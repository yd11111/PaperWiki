TS for Taiwanese Mandarin with Enhanced Polyphone Disambiguation", "arxiv_id": "2501.17790", "date": "2025-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "voice-cloning", "Taiwanese-Mandarin", "polyphone-disambiguation", "code-switching", "LLM-based", "flow-matching"], "summary": "将 CosyVoice 适配到 Taiwanese Mandarin,通过 phonetic augmentation 解决多音字消歧问题,并提出 Iconic Unit Augmented Speech Cloning 将 PER 降低 61.2%,同时系统性揭示了 LLM 生成的 speech units 是 voice cloning 失败的主要原因", "route": "Text (+g2pW phonetic symbols) → LLM → Speech Units → OT-CFM (+speaker embedding) → Mel → Vocoder → Waveform; 可选路径: iconic speaker LLM → Units → CFM (target speaker embedding) → Waveform", "metrics": "主观评估优于 4 个商用系统 [Fig 2]; 客观 PER 0.8% / SSL-MOS 4.46 (TCMD) [Table 1]; Iconic Unit Cloning: PER 3.4%→1.3% (61.2% 降低), speaker similarity 仅下降 2.51% [§6.1.3]; 语音克隆平均 speaker similarity 92.29% [§5.2]", "takeaway": "(1) Iconic Unit Augmented Speech Cloning — 解耦内容生成和音色转换的两阶段策略,对所有 LLM+CFM 管线中的 long-tail speaker 问题有直接迁移价值; (2) 通过控制变量实验隔离错误源 (CFM conditions vs LLM conditions) 的分析方法论; (3) BERT-style phonetic symbol augmentation 策略 (50% 句子级 + 15% 字符级)", "limitation": "(1) 仅训练了 LLM,未微调 S3 tokenizer/CFM,上限受限; (2) 评估数据集规模较小 (30 comparisons, 115 speakers); (3) 中文地名的 code-switching 表现不佳 [Table 2]; (4) 无消融实验量化各训练技巧的独立贡献", "concepts": ["ConditionalFlowMatching", "SpeechTokenizer", "LLM-basedTTS", "SpeakerEmbedding", "SemanticvsAcousticTokens"], "source": "Sources/BreezyVoice.pdf", "github": "", "demo": ""}, {"name": "CSP-FT", "title": "Efficient Emotion and Speaker Adaptation in LLM-Based TTS via Characteristic-Specific Partial Fine-Tuning", "arxiv_id": "2501.14273", "date": "2025-01", "venue": "arXiv (v2, Mar 2026)", "org": "", "tier": "deep", "tags": ["TTS", "domain-adaptation", "fine-tuning", "parameter-efficient", "codec-language-model", "emotion", "speaker-adaptation", "catastrophic-forgetting"], "summary": "通过 weighted-sum 分析 Transformer 各层对情感/说话人控制的贡献,仅微调贡献最高和最低的两层,实现 ~8% 参数、~2x 加速下的高效域适应且显著缓解灾难性遗忘", "route": "预训练 codec LM → Stage 1: 冻结模型,用 weighted-sum + 下游分类器分析各层贡献 → 选 highest + lowest 两层 → Stage 2: 仅微调这两层做目标域 TTS 适应", "metrics": "Fun-CosyVoice3.0 上 SS 94.8% / ERS 96.8% / WER 3.8% (vs Full FT: 94.5% / 97.0% / 12.1%), 11 个英语情感数据集 (244h); 训练速度 1.91-2.62x 加速 [Table 2, Fig 4]", "takeaway": "用下游任务的 layer-wise weighted-sum 分析来指导选择性微调,且分析结果跨数据集/跨语言可迁移 — 分析做一次,适应做多次", "limitation": "仅在 4 个 codec LM 上验证,未在 diffusion-based 或 NAR 架构上测试; 层选择基于任务权重平均,对情感/说话人权重分布不均的模型可能次优 (CosyVoice 案例 [Table 6])", "concepts": ["CodecLanguageModel", "SpeakerAdaptation", "EmotionControlinTTS", "LLM-basedTTS", "SpeakerEmbedding", "Self-SupervisedSpeechRepresentation"], "source": "Sources/CSP-FT.pdf", "github": "", "demo": ""}, {"name": "FaceSpeak", "title": "FaceSpeak: Expressive and High-Quality Speech Synthesis from Human Portraits of Different Styles", "arxiv_id": "2501.03181", "date": "2025-01", "venue": "AAAI 2025", "org": "", "tier": "deep", "tags": ["TTS", "multi-modal", "face-to-speech", "emotion", "style-transfer", "disentanglement", "VITS", "adversarial-training"], "summary": "从任意风格肖像图 (真人/卡通/幻想) 中解耦身份与情感特征,驱动 VITS2 合成与人物形象匹配的表达性语音", "route": "肖像图 -> FaRL 提取面部特征 -> IAM (identity) + EAM (emotion) 双分支解耦 -> GRL + vCLUB 去相关 -> control embedding 注入 VITS2 -> 波形", "metrics": "intra-domain NMOS 4.13 / ISMOS 3.97 / ESMOS 4.36 (vs MM-TTS 3.94/3.82/4.08) [Table 1]; identity-emotion 组合控制准确率 98.6% (identity) / 92.1% (emotion) [Fig 6]; MCD 3.32, SS 0.95 [Table 3]", "takeaway": "(1) GRL + vCLUB 双重解耦策略可用于任何需要分离两个纠缠属性的场景; (2) 用 FaRL (CLIP-pretrained face model) 提取面部特征避免背景/衣着干扰的思路; (3) 用 LLM + 图像生成模型 (DALL-E/PhotoMaker) 自动构建多模态训练数据的 pipeline", "limitation": "(1) out-of-domain emotion accuracy 仅 31.32% 泛化堪忧 [Table 3]; (2) 仅在有限情感类别上验证; (3) 合成质量整体仍低于 ground truth; (4) EM2 TTS 数据集的图像由 AI 生成,face-voice 对应关系的真实性存疑", "concepts": ["StyleTransferinTTS", "EmotionControlinTTS", "SpeakerEmbedding", "SpeechFactorization", "GradientReversalLayer", "VariationalAutoencoderforTTS"], "source": "Sources/FaceSpeak.pdf", "github": "", "demo": ""}, {"name": "JELLY", "title": "JELLY: Joint Emotion Recognition and Context Reasoning with LLMs for Conversational Speech Synthesis", "arxiv_id": "2501.04904", "date": "2025-01", "venue": "ICASSP 2025", "org": "", "tier": "deep", "tags": ["CSS", "emotion", "LLM", "LoRA", "Q-former", "Whisper", "conversational", "context-reasoning"], "summary": "用 LLM (Vicuna-7B) + 多 PLoRA + EQ-former 实现对话中的情感状态推理,再驱动 FastSpeech 2 合成情感语音", "route": "对话音频 → Whisper+TLTR+Q-former(EQ-former) → LLM with PLoRA-E/PLoRA-T → 情感/强度预测 → FastSpeech 2 + emotion/intensity encoder → 语音", "metrics": "E-DMOS 3.987 (vs ECSS 3.914, GT 4.063); ECA 58.60% (vs ECSS 55.72%); Emotion F1 60.17 (vs ECSS 13.66) [Table I, II, DailyTalk]", "takeaway": "(1) PLoRA 分流设计 — 对不同模态输入用独立 LoRA,保持 LLM 文本能力; (2) 三阶段渐进训练缓解数据稀缺; (3) EQ-former 的 TLTR 层选择机制提取情感信息", "limitation": "TTS 后端是 FastSpeech 2 (非 SOTA); DailyTalk 仅 20h/2 说话人; 不处理重叠语音; 推理时依赖 Whisper ASR 获取 transcript", "concepts": ["EmotionControlinTTS", "ModalityAdaptationforSpeechLLM", "ProsodyModeling"], "source": "Sources/JELLY.pdf", "github": "", "demo": ""}, {"name": "Low-ResourceForwardTacotron", "title": "Low-Resource Text-to-Speech Synthesis Using Noise-Augmented Training of ForwardTacotron", "arxiv_id": "2501.05976", "date": "2025-01", "venue": "IEEE (preprint)", "org": "", "tier": "deep", "tags": ["TTS", "low-resource", "data-augmentation", "non-autoregressive", "multi-speaker", "speaker-adaptation", "noise-augmentation"], "summary": "仅用 4 个高质量说话人 + 5-20 分钟目标说话人数据,通过 WGN 噪声增强 + binned/weighted sampling 训练 ForwardTacotron,在 speaker similarity 上大幅超越零样本 HierSpeech++", "route": "文本 → multi-speaker ForwardTacotron (CBHG + duration/pitch/energy predictors + acoustic condition embedding) → mel spectrogram → StyleMelGAN → 波形", "metrics": "speaker sim. MOS +1.1 over HierSpeech++ (male); cos-sim 0.69 vs 0.45 (female, 5min); 43M params vs 108.5M (HierSpeech++); naturalness MOS ≈ HierSpeech++ (20min) [Fig 2] [Table II]", "takeaway": "(1) clean/noisy dual condition-ID 让模型既利用噪声增强数据又在推理时只用 clean embedding; (2) binned sampling 让 LR 说话人独占部分 batch 获得充分梯度更新; (3) 仅 4 个 HR 说话人即可构建多说话人基座", "limitation": "需要针对每个新说话人重新训练 (非 zero-shot); 1 min 数据时质量下降明显; 仅在英语 + 2 个说话人上验证; vocoder 固定为 StyleMelGAN (非 SOTA)", "concepts": ["Non-autoregressiveTTS", "SpeakerAdaptation", "SpeakerEmbedding", "NeuralVocoder", "DurationPredictor", "MelSpectrogram"], "source": "Sources/Low-ResourceForwardTacotron.pdf", "github": "", "demo": ""}, {"name": "MathReader", "title": "MathReader: Text-to-Speech for Mathematical Documents", "arxiv_id": "2501.07088", "date": "2025-01", "venue": "ICASSP 2025", "org": "", "tier": "deep", "tags": ["TTS", "pipeline", "OCR", "accessibility", "LaTeX", "mathematical-TTS", "document-reader"], "summary": "用 OCR + fine-tuned T5-small (LaTeX→spoken English 翻译) + VITS 组成 pipeline,解决现有 TTS 文档朗读器无法正确读出数学公式的问题", "route": "PDF → Nougat-small OCR → mmd 文件 → 正则提取 LaTeX 公式 → T5-small 翻译为 spoken English → 替换原文中公式 → VITS TTS → 语音", "metrics": "WER 0.281 (vs Edge 0.510, Acrobat 0.617); CER 0.148 (vs Edge 0.341, Acrobat 0.454) [Table II]; 单页平均 23.62 秒 [Table IV]", "takeaway": "将\"公式→口语化英文\"建模为翻译任务并用小模型 (T5-small) 解决,低成本高效率的工程思路;pipeline 分段设计使每个模块可独立替换", "limitation": "仅处理英文数学文档;评估数据集为手工标注的小规模测试集(具体规模未报告);无主观评估(MOS);依赖 Nougat OCR 质量;T5-small 对复杂嵌套公式的翻译准确性未深入分析", "concepts": ["Text-to-SpeechPipeline", "TTSEvaluation"], "source": "Sources/MathReader.pdf", "github": "", "demo": ""}, {"name": "MinMo", "title": "MinMo: A Multimodal Large Language Model for Seamless Voice Interaction", "arxiv_id": "2501.06282", "date": "2025-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "aligned-multimodal", "full-duplex", "streaming", "voice-interaction", "instruction-following", "speech-to-speech", "CosyVoice"], "summary": "8B aligned multimodal LLM, 通过四阶段对齐 (S2T→T2S→S2S→Duplex) 在 1.4M 小时语音上训练, 以 SenseVoice encoder + Qwen2.5-7B + CosyVoice 2 decoder 组合实现 SOTA 语音理解/生成/全双工对话, 100ms S2T 延迟 / 600ms 全双工延迟 [§1, §3.4]", "route": "Audio → SenseVoice-Large encoder (636M) → Input Projector (2L Transformer + CNN, 170M, 2x downsample) → Qwen2.5-7B-instruct (LoRA) → Output Projector (6M, linear) + Voice Token LM (CosyVoice 2 LM, 370M, 5:15 interleave) → Token2wav (CFM + Vocoder) → Audio; Full Duplex Predictor (18M, 1L Transformer) 接 LLM hidden states [§3.1, Table 1, Fig 3]", "metrics": "ASR Fleurs 10-lang avg 4.13 CER/WER (SOTA vs Whisper 4.48 / Qwen2-Audio 9.11); S2TT CoVoST2 avg 38.92 BLEU (SOTA); LID Fleurs-102 85.3% acc (SOTA); SER near-100% on acting sets (CASIA 98.1%, CREMA-D 94.8%); SQA S2S LlamaQ 48.3 / WebQ 39.9 (SOTA); Instruction-following 98.4% total (vs GLM-4-Voice 63.1%); Full-duplex assistant turn-taking F1@10 0.985 (simulated); Duplex system latency ~600ms on L20 [Tables 5-22]", "takeaway": "(1) **5:15 semantic-speech interleaving**: LLM hidden states 和 text tokens 拼接作为 semantic vectors,每 5 个 semantic vectors 后接 15 个 speech tokens,单 AR decoder 即可流式生成,不需 Freeze-Omni 的三个 decoder [§3.2]; (2) **Pre-align 防梯度冲击**: 先只训 adapter 让随机初始化参数稳定,再联合训练 encoder+adapter,避免大梯度干扰预训练参数 [§3.4]; (3) **全双工基于语义理解**: 用 LLM hidden states 驱动 duplex predictor,利用 LLM 的语义能力判断是否响应, 比独立 VAD/分类器更准确 [§3.4]; (4) **Instruct speech 仅用 hidden embedding 对齐**: 不更新 LLM,仅靠 <150h 指令数据 + Voice Decoder 训练即可实现情感/方言/语速控制, 98.4% instruction accuracy [§3.4, Table 18]", "limitation": "LLM 仅 LoRA 更新,多样指令跟随 (语言/任务切换) 能力受限 [§6]; TTS 存在长尾发音错误 (one-to-many tokens + 特殊符号) [§6]; Instruct 数据仅约 1000h,指令控制效率待提升 [§6]; 全双工仍需外部 AEC/VAD,非完全端到端 [§6]; TTS 质量略低于独立 CosyVoice 2 (zh CER 2.48 vs 2.06, NMOS 3.69 vs 3.73) [Table 17]; S2S 模式性能系统性低于 S2T [Table 19]", "concepts": ["SpeechLanguageModel", "Full-duplexSpokenDialogue", "ModalityAdaptationforSpeechLLM", "StreamingSpokenDialogue", "Speech-LLMIntegrationTaxonomy", "LLM-basedTTS"], "source": "Sources/MinMo.pdf", "github": "", "demo": ""}, {"name": "OpenOmni", "title": "OpenOmni: Large Language Models Pivot Zero-shot Omnimodal Alignment across Language with Real-time Self-Aware Emotional Speech Synthesis", "arxiv_id": "2501.04561", "date": "2025-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["omnimodal", "speech-LM", "emotional-TTS", "DPO", "CTC", "multimodal-alignment", "real-time", "zero-shot"], "summary": "用语言作为 pivot 分阶段做 speech-text 和 image-text 对齐, 隐式实现零样本三模态对齐; 加轻量 CTC speech decoder + DPO 实现实时情感语音", "route": "Speech(Whisper) / Image(CLIP) → Projectors → Qwen2.5-7B LLM → Text output + Speech decoder(MOE+Qwen2.5-0.5B+CTC) → Vocoder → Speech", "metrics": "OmniBench 37.40 (vs VITA 33.45, 7B vs 7x8B, 1.8M vs 5M data) [Table 2]; Emotion accuracy 67.9% (+7.6% over w/o DPO) [Table 5]; NAR: 30s speech <1s [§4.4]", "takeaway": "(1) language-pivot 分阶段对齐策略可用于任何多模态扩展场景 — 只要两对模态各自与语言对齐, 第三对模态对齐可隐式获得; (2) MOE 层稳定 CTC 训练的经验 (无 MOE 时训练失败); (3) text-guided feature fusion 纠正 LLM 输出错误对 speech decoder 的干扰", "limitation": "(1) 未探索更大规模三模态数据的潜力 [§5 Limitations]; (2) NAR CTC 训练难度仍高于 AR, MOE 是工程 patch 而非根本解决方案; (3) 情感控制依赖 CosyVoice 生成的合成偏好数据, 非真人标注; (4) 未开源训练代码和数据", "concepts": ["SpeechLanguageModel", "EmotionControlinTTS", "SpeechTokenizer", "Speech-LLMIntegrationTaxonomy", "ModalityAdaptationforSpeechLLM", "Non-autoregressiveTTS", "StreamingSpokenDialogue", "DifferentiableRewardOptimization", "Speech-TextAlignment"], "source": "Sources/OpenOmni.pdf", "github": "", "demo": ""}, {"name": "PROEMO", "title": "PROEMO: Prompt-Driven Text-to-Speech Synthesis Based on Emotion and Intensity Control", "arxiv_id": "2501.06276", "date": "2025-01", "venue": "arXiv (cs.SD)", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "intensity-control", "prompt-control", "LLM", "prosody", "multi-speaker", "FastSpeech2"], "summary": "在 FastSpeech 2 上叠加 HuBERT-based 情感/强度双编码器 + GPT-4 推理时 prompt control,实现多说话人情感 TTS 的情感类型与强度可控", "route": "Text → FS2 Encoder → Variance Adaptor (pitch/energy/duration × GPT-4 scaling) + Emotion Encoder (HuBERT) + Intensity Encoder (HuBERT + ranking function) + Speaker Encoder (GE2E) → Mel Decoder → HiFiGAN → Waveform", "metrics": "ECA 0.797 (FS2w/E&I, local PC), MOS 3.728 (FS2w/E&I, G&L PC), PIR ~72% accuracy (ESD test set) [Table 1, Fig 3]", "takeaway": "用 relative attribute ranking 从无强度标注数据学习 per-speaker 情感强度编码器,避免主观标注; GPT-4 双层 scaling factor 设计提供推理时韵律微调入口", "limitation": "依赖 GPT-4 API 推理 (延迟/成本/不可复现); ESD 仅 350 句 5 类情感,规模太小; MOS 3.728 未达现代系统水平; 未与 EmoSphere/EmoCtrl-TTS 等 2024 方法对比; local-only 优于 G&L 暴露全局控制可能有害", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "Non-autoregressiveTTS", "SpeakerEmbedding", "MelSpectrogram", "DurationPredictor"], "source": "Sources/PROEMO.pdf", "github": "", "demo": ""}, {"name": "RADKA-CSS", "title": "Retrieval-Augmented Dialogue Knowledge Aggregation for Expressive Conversational Speech Synthesis", "arxiv_id": "2501.06467", "date": "2025-01", "venue": "arXiv preprint (submitted to Elsevier)", "org": "", "tier": "deep", "tags": ["TTS", "conversational-speech-synthesis", "RAG", "heterogeneous-graph", "contrastive-learning", "style-modeling", "prosody", "multi-granularity"], "summary": "首次将 RAG 引入 CSS,从历史存储对话中检索场景和风格相似的对话片段,通过多粒度异构图聚合多源风格知识,使合成语音更贴合当前对话风格", "route": "当前对话 (CD) → [数据库准备: bart-large-cnn-samsum 提取摘要 + Sentence-BERT 语义向量 + Wav2Vec2.0-IEMOCAP 风格向量 + x-vector 说话人信息] → [多属性检索: 语义+风格联合 Top-K] → [多源风格知识聚合: AMgHG + TMgHG 编码 + 对比学习约束] → [Style Renderer 注入 FastSpeech 2] → HiFi-GAN → 语音", "metrics": "N-DMOS 3.904 / S-DMOS 3.879 (vs ECSS 最佳 baseline 3.720/3.698, GT 4.448/4.498); MAE-P 0.442 / MAE-E 0.305 / MAE-D 0.130,均优于所有 baseline [Table 3]", "takeaway": "(1) 多属性联合检索 (语义+风格同时考虑) 优于级联或单属性检索 [Table 5/6]; (2) 多粒度异构图 (word/sentence/dialogue 三级节点 + 四种关系) 比同构图和纯 sentence-level 更全面 [Table 4, Abl.5-6]; (3) 用 bart-large-cnn-samsum 对对话文本做摘要再向量化,实现对话级语义表示", "limitation": "(1) 仅在 DailyTalk (2 说话人固定交替) 上验证,未验证多说话人公共场景 [§7]; (2) backbone 为 FastSpeech 2,未探索 LLM-based TTS; (3) SDSSD 的构建依赖完整的历史对话文本+音频,冷启动时无 SD 可检索; (4) 代码开源但论文仍为 preprint", "concepts": ["ProsodyModeling", "StyleTransferinTTS", "EmotionControlinTTS", "GlobalStyleTokens", "Non-autoregressiveTTS", "Self-SupervisedSpeechRepresentation"], "source": "Sources/RADKA-CSS.pdf", "github": "", "demo": ""}, {"name": "TTS-Transducer", "title": "TTS-Transducer: End-to-End Speech Synthesis with Neural Transducer", "arxiv_id": "2501.06320", "date": "2025-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "neural-transducer", "RNNT", "audio-codec", "monotonic-alignment", "end-to-end", "zero-shot"], "summary": "将 ASR 领域的 neural transducer (RNNT) 引入 TTS,端到端预测 audio codec tokens,利用单调对齐约束避免显式 duration predictor 和自回归 hallucination。", "route": "Tokenized Text → Transformer Encoder (+ GST speaker cond.) → RNNT Joint Network → 第一码本 codes → Aligned Encoder Output + Predicted Codes → NAR Transformer (RCH) → 剩余码本 codes → Audio Codec Decoder → Waveform", "metrics": "CER 3.94% / WER 13.83% (challenging texts, IPA+NeMo-Codec) vs Bark CER 11.67% / SpeechT5 CER 6.00%; MOS 3.82 (可比 SpeechT5 3.84); SSIM 0.868-0.908 (LibriTTS-R) [Table I, III]", "takeaway": "(1) 用 RNNT loss + k2 shortest_path 同时获得对齐和预测,零额外计算开销;(2) 只用 transducer 预测第一码本、剩余码本用 NAR 头迭代预测,优雅解决多码本 RNNT 内存爆炸问题;(3) codec-agnostic 设计——同一架构适配 EnCodec/DAC/NeMo-Codec 无需修改", "limitation": "仅在 LibriTTS-R (464h) 上训练,未在大规模数据 (60K+ h) 上验证 scaling;MOS 仅 3.82 (低于 ground truth 通常 4.0+);未开源模型权重;未与同期强 baseline (如 VALL-E 2, CosyVoice) 对比;streaming 模式仅作为 future work 提及", "concepts": ["ResidualVectorQuantization", "DurationPredictor", "GlobalStyleTokens", "Non-autoregressiveTTS", "CodecLanguageModel", "LLM-basedTTS", "SpeakerEmbedding"], "source": "Sources/TTS-Transducer.pdf", "github": "", "demo": ""}, {"name": "Universal-2-TF", "title": "Universal-2-TF: Robust All-Neural Text Formatting for ASR", "arxiv_id": "2501.05948", "date": "2025-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["ASR", "text-formatting", "punctuation-restoration", "truecasing", "inverse-text-normalization", "multi-task", "seq2seq", "BERT"], "summary": "两阶段纯神经网络 text formatting 系统,用共享 encoder 的多目标 token classifier 做标点/大小写/span 检测,再用限定 span 的 seq2seq 做 ITN 和混合大小写转换,在 AssemblyAI Universal-2 ASR 中部署", "route": "normalized text → BERT multi-head classifier (punctuation + casing + ITN span) → 提取 span + 上下文 → BART seq2seq (ITN + mixed-case) → 格式化文本", "metrics": "PER 29.0%, I-WER 30.3% (vs Universal-1-TF 的 52.7%), CER 0.9%, 人类偏好 81.2% vs 17.2% [Table 2, Table 3]", "takeaway": "\"先分类定位再局部生成\"的两阶段设计思路可迁移;共享 encoder 多头设计减少推理成本;LLM 生成合成数据增强低资源格式化实体", "limitation": "仅支持句后标点(不支持西语倒问号等句前标点);不利用声学信息;I-WER 30% 仍有较大提升空间;仅英语", "concepts": [], "source": "Sources/Universal-2-TF.pdf", "github": "", "demo": ""}, {"name": "CSM", "title": "CSM: Conversational Speech Model", "arxiv_id": "", "date": "2025", "venue": "GitHub (no paper)", "org": "", "tier": "card", "tags": ["speech-LM", "conversational-TTS", "multi-turn", "open-source", "codec-LM"], "summary": "Sesame 开源的对话语音生成模型,基于 Llama backbone + 多 codebook 语音生成,支持多轮对话上下文", "route": "文本/音频 token → Llama Transformer → 多 codebook AR 生成 → Mimi codec 解码", "metrics": "", "takeaway": "", "limitation": "", "concepts": ["SpeechLanguageModel", "CodecLanguageModel"], "source": "https://github.com/SesameAILabs/csm", "github": "", "demo": ""}, {"name": "FlowDec", "title": "FlowDec", "arxiv_id": "", "date": "2025", "venue": "ICLR 2025", "org": "", "tier": "deep", "tags": ["audio-codec", "flow-matching", "postfilter", "non-adversarial", "full-band", "48kHz", "general-audio", "neural-codec"], "summary": "基于 conditional flow matching 的 stochastic postfilter,将非对抗训练的 neural codec (NDAC) 输出增强到与 GAN-based codec (DAC) 相当的感知质量,同时支持低至 4 kbit/s 的全频段 48kHz 音频编码", "route": "Audio(48kHz) → Encoder → RVQ(NDAC, non-adversarial) → Decoder(deterministic) → initial estimate y → Postfilter(joint flow matching, NCSN++, 6 NFE) → enhanced audio hat{x}", "metrics": "FAD 1.62 (NFE=6), 优于 DAC 3.0-10.0; MUSHRA 与 DAC on par @ 4.5-7.5 kbit/s; RTF 0.2285 (vs ScoreDec 1.707) [Table 4, Fig.5, Fig.6]", "takeaway": "(1) 非对抗 codec + flow postfilter 的解耦设计 (2) Shifted prior q0 = N(y, Sigma_y) 消除 OT solver 需求 (3) 频率依赖噪声 sigma_y(f) 适配自然信号频谱特性 (4) CQT loss 改善低频建模", "limitation": "非因果架构(non-streaming); RTF 0.23 虽优于 ScoreDec 但仍非实时; 多次 NFE 推理增加延迟; 48kHz 全频段训练资源需求大", "concepts": ["ConditionalFlowMatching", "ScoreMatching", "ResidualVectorQuantization", "NeuralVocoder", "Diffusion-basedVocoder"], "source": "Sources/FlowDec.pdf", "github": "", "demo": ""}, {"name": "CodecLMSpontaneousStyle", "title": "The Codec Language Model-based Zero-Shot Spontaneous Style TTS System for CoVoC Challenge 2024", "arxiv_id": "2412.01100", "date": "2024-12", "venue": "ISCSLP 2024 CoVoC Challenge", "org": "", "tier": "deep", "tags": ["TTS", "codec-LM", "zero-shot", "voice-cloning", "spontaneous-speech", "CFG", "delay-pattern", "LLaMA"], "summary": "LLaMA-based codec LM + delay pattern + CFG 实现零样本自发风格语音克隆,在 CoVoC 2024 受限赛道获自然度 MOS 第一(3.80)", "route": "文本→MT5 encoder(+LoRA)→text encoding; 语音→HuBERT+K-means→semantic tokens + DAC→acoustic tokens; LLaMA AR 生成 semantic tokens→delay pattern AR 生成 acoustic tokens→DAC decoder→波形", "metrics": "自然度 MOS 3.80(第1）、质量 MOS 3.84（第2）、相似度 MOS 3.49（第2）、自发风格 MOS 3.33（第3）、CER 10.29%（第2）、SECS 0.797（第4）[Table 2, 3]", "takeaway": "delay pattern 在自发语音韵律建模中的适配性；CFG 同时应用于 semantic 和 acoustic 两阶段的双重引导策略；渐进式预训练→微调的数据策略", "limitation": "纯数据驱动无显式自发行为标签,自发风格 MOS 仅 3.33；voice cloning 性能中等(SECS 0.797 仅排第4)；仅在 CoVoC 受限赛道评估,无标准 benchmark 对比", "concepts": ["CodecLanguageModel", "Classifier-FreeGuidance", "LLM-basedTTS", "SemanticvsAcousticTokens"], "source": "Sources/CodecLMSpontaneousStyle.pdf", "github": "", "demo": ""}, {"name": "CosyVoice2", "title": "CosyVoice 2: Scalable Streaming Speech Synthesis with Large Language Models", "arxiv_id": "2412.10117", "date": "2024-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "streaming", "LLM-based", "coarse-to-fine", "flow-matching", "FSQ", "instructed-TTS"], "summary": "CosyVoice 的流式升级版,用 FSQ 替代 VQ + 预训练 LLM 初始化 + chunk-aware causal flow matching 实现近无损流式零样本 TTS", "route": "Text (BPE) → Text-Speech LM (Qwen2.5 init, AR) → supervised speech tokens (FSQ-SenseVoice, 25Hz) → Chunk-aware CFM (causal Conv-Transformer UNet) + speaker emb → Mel → vocoder → Waveform", "metrics": "LibriSpeech test-clean WER 2.45% / NMOS 3.90 / SS 0.751 (streaming); SEED test-zh CER 1.45% / SS 0.806 (offline) [Table 5, 6]", "takeaway": "(1) FSQ 替代 VQ 实现 100% codebook 利用率 + 更低 ASR error; (2) 文本 LLM 初始化 text-speech LM 降低 CER 18%; (3) 四种 attention mask (non-causal/full-causal/chunk-M/chunk-2M) 统一训练实现隐式自蒸馏; (4) DPO + differentiable ASR reward 用于 SFT 阶段 RL 微调", "limitation": "(1) 仅支持中英日韩四种语言; (2) 无法通过文本指令控制音色 (timbre); (3) 不支持歌声合成; (4) 日语因字符集重叠导致性能较差", "concepts": ["SpeechTokenizer", "FiniteScalarQuantization", "ConditionalFlowMatching", "Classifier-FreeGuidance", "SemanticvsAcousticTokens", "LLM-basedTTS", "CodecLanguageModel"], "source": "Sources/CosyVoice2.pdf", "github": "", "demo": ""}, {"name": "GLM-4-Voice", "title": "GLM-4-Voice: Towards Intelligent and Human-Like End-to-End Spoken Chatbot", "arxiv_id": "2412.02612", "date": "2024-12", "venue": "arXiv (Zhipu AI / Tsinghua University)", "org": "", "tier": "deep", "tags": ["speech-LM", "end-to-end", "spoken-chatbot", "speech-tokenizer", "flow-matching", "single-codebook", "streaming", "interleaved-data"], "summary": "通过合成 speech-text 交替数据将预训练扩展到 1T tokens,结合 12.5Hz 单码本 VQ-Whisper tokenizer 和 streaming thoughts 推理模板,构建了首个兼具高智能和自然语音表达的端到端 spoken chatbot", "route": "用户语音 → VQ-Whisper tokenizer (12.5Hz, 175bps) → GLM-4-9B (扩展词表) → streaming thoughts (text+speech 交替输出) → CosyVoice CFM decoder + HiFi-GAN → 语音响应", "metrics": "ChatGPT Score General QA 5.40 / Knowledge 5.20 (vs Moshi 2.42/3.60); UTMOS 4.45 (vs Moshi 3.90); ASR-WER 5.74% (vs Moshi 7.95%) [Table 6]", "takeaway": "(1) 合成交替数据绕过 speech-text 平行语料瓶颈; (2) Streaming Thoughts 模板以固定 text:speech ratio 交替解码实现低延迟; (3) SFT 阶段分离 text/speech loss 解决不同学习速度问题", "limitation": "仅支持中英双语; 未探索全双工; tokenizer 12.5Hz 帧率下重建质量受限 (WER 8.43 on reconstruction); 无公开 SFT 数据详情; 推理依赖 streaming thoughts 比例的经验选择", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "ConditionalFlowMatching", "Single-codebookvsMulti-codebook", "StreamingSpokenDialogue", "Speech-LLMIntegrationTaxonomy", "SemanticvsAcousticTokens"], "source": "Sources/GLM-4-Voice.pdf", "github": "", "demo": ""}, {"name": "HierarchicalEmotionControl", "title": "Hierarchical Control of Emotion Rendering in Speech Synthesis", "arxiv_id": "2412.12498", "date": "2024-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "hierarchical", "flow-matching", "emotion-distribution", "disentanglement", "prosody", "controllability"], "summary": "基于 flow matching (MatchaTTS) 的情感 TTS 框架,通过 DNN-based 层级情感分布 (ED) 提取实现 phoneme/word/utterance 三级可量化情感强度控制", "route": "Reference Audio → Hierarchical ED Extractor (OpenSMILE+WavLM → Feature Extractor → SER/EPR Classifier → 三级 ED) + Speaker Encoder → Text Encoder + Duration Adaptor → Flow-Prediction Network → Mel → Vocos → Waveform", "metrics": "WER 8.75 (Whisper) [Table I], MCD 5.31 [Table I], SECS 0.871 (WavLM) / 0.511 (WeSpeaker) [Table I], Emotion Score 0.369 (EPR) [Table III]; MUSHRA Naturalness 48.91, Emotion Similarity 59.41 [Table IV] (均在 ESD 英文子集)", "takeaway": "(1) EPR (Emotion Presence Recognizer) 的二分类设计比多分类 SER 更适合量化情感强度; (2) OpenSMILE (word/phoneme) + WavLM (utterance) 组合利用了两者在不同粒度的互补优势; (3) GRL 对抗训练有效解耦 speaker/gender 信息,提升情感可控性", "limitation": "仅在 ESD (29h, 5 情感, 10 说话人, content-parallel) 上验证,未测试非平行/大规模/多语言数据; 未利用文本中的词汇情感信息 (lexical prosody); 未与 LLM-based TTS 比较; Naturalness MOS 仍低于 Ground Truth ~13 分", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "ConditionalFlowMatching", "SpeakerEmbedding", "GlobalStyleTokens", "GradientReversalLayer"], "source": "Sources/HierarchicalEmotionControl.pdf", "github": "", "demo": ""}, {"name": "IDEA-TTS", "title": "Incremental Disentanglement for Environment-Aware Zero-Shot Text-to-Speech Synthesis", "arxiv_id": "2412.16977", "date": "2024-12", "venue": "ICASSP 2025", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "disentanglement", "environment-aware", "speech-enhancement", "acoustic-environment", "VITS", "spectral-masking"], "summary": "提出 \"先解耦环境,再解耦说话人\" 的级联式因子分解方案,在 VITS 框架上实现可控声学环境的零样本 TTS", "route": "环境频谱 → Environment Estimator (spectral mask) → 增强频谱 + 环境 mask; 增强频谱 → Posterior Encoder → z; 环境 mask → ECAPA-TDNN → 环境 embedding; 环境语音 → H/ASP → 说话人 embedding; z + speaker emb + env emb → Decoder → 环境感知波形", "metrics": "Environment-robust TTS MOS 3.90 / SECS 0.873 / CER 5.26% (与 YourTTS Raw Ref. 持平 [Table I]); Env-to-Clean 场景 PESQ 1.86 vs DiffRENT 1.53 [Table III]; 增量解耦 vs 同时解耦 CER 降幅 57% (12.23→5.26) [Table I]; 数据集: DDS", "takeaway": "(1) spectral masking 从 speech enhancement 迁移到 TTS 解耦,mask 作为环境信息载体比原始频谱更纯净; (2) 级联解耦设计 -- 利用属性间的层级关系 (环境是全局效应,影响说话人特征) 确定解耦顺序; (3) 全零环境 embedding 作为 \"无环境\" 条件,在训练中同时监督 raw 和 environmental 输出", "limitation": "仅在 DDS 数据集 (12h, 48 speakers, 27 conditions) 上验证; backbone 为 2021 年的 VITS,未与 LLM-based TTS 比较; 环境可控性局限于 DDS 涵盖的混响+噪声类型; ICASSP 4 页篇幅限制了细节展开", "concepts": ["SpeechFactorization", "SpeakerEmbedding", "VariationalAutoencoderforTTS", "StyleTransferinTTS"], "source": "Sources/IDEA-TTS.pdf", "github": "", "demo": ""}, {"name": "LatentLM", "title": "Multimodal Latent Language Modeling with Next-Token Diffusion", "arxiv_id": "2412.08635", "date": "2024-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multimodal", "latent-language-model", "next-token-diffusion", "sigma-VAE", "continuous-representation", "TTS", "image-generation", "unified-model"], "summary": "提出 LatentLM 框架,用 sigma-VAE 将连续数据编码为 latent vectors,用 next-token diffusion 在 causal Transformer 中统一建模离散和连续数据", "route": "连续数据 → sigma-VAE Encoder → latent vectors → Causal Transformer (离散用 softmax head / 连续用 diffusion head) → sigma-VAE Decoder → 原始数据", "metrics": "图像生成 FID 2.24 (ImageNet 256, 479M params) [Table 1]; TTS SIM 0.697, WER-C 1.2 (LibriSpeech, 15fps) [Table 4]; MLLM FID 14.54 + VQAv2 38.72 [Table 3]", "takeaway": "sigma-VAE 防止 variance collapse 的设计; per-token lightweight diffusion head 复用 Transformer backbone 计算; 统一离散+连续的 causal 建模范式", "limitation": "TTS 实验规模较小 (仅 LibriSpeech); 未与 CosyVoice/Seed-TTS 等工业级系统对比; CFG 对 diffusion head 的影响未深入分析", "concepts": ["DiffusionModel", "Classifier-FreeGuidance", "SpeechTokenizer", "LLM-basedTTS"], "source": "Sources/LatentLM.pdf", "github": "", "demo": ""}, {"name": "SLAM-Omni", "title": "SLAM-Omni: Timbre-Controllable Voice Interaction System with Single-Stage Training", "arxiv_id": "2412.15649", "date": "2024-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["spoken-dialogue", "speech-LM", "semantic-token", "zero-shot-timbre", "single-stage-training", "parallel-generation", "group-modeling"], "summary": "用 CosyVoice 监督 semantic tokens 将 speaker 信息解耦到 vocoder,结合 semantic group modeling 压缩音频序列、historical text prompting 压缩对话历史,实现了首个单阶段训练的音色可控端到端语音对话系统", "route": "Whisper encoder → Linear projector → Qwen2-0.5B (parallel text + grouped semantic tokens) → CosyVoice CFM vocoder + speaker prompt → HiFi-GAN → waveform", "metrics": "ChatGPT Score 39.32, UTMOS 4.45 (best among all SDMs), ASR-WER 4.54% (best), 60 GPU hours on 4x A100 [Table 3, 4]", "takeaway": "(1) Semantic group modeling: 一步预测 G=3 个 semantic tokens,ASR-WER 从 18.23% 降至 4.54%,GPU 时间从 126h 降至 60h [Table 5]; (2) Historical text prompting: 用 text-only 历史替代 audio-text 交替历史,压缩上下文长度,继承 LLM 文本 in-context learning; (3) Single-stage training 反而优于 ASR/TTS 预训练,因为预训练损害指令遵循能力 [Table 6]", "limitation": "(1) text-only 历史丢失副语言信息; (2) 仅在 0.5B LLM 验证,scale-up 未知; (3) ChatGPT Score 仍明显低于同规模 text LLM (Qwen2-0.5B-instruct: 57.70 vs 39.32) [Table 3]; (4) 训练数据为 CosyVoice 合成语音,非真实对话", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/SemanticvsAcousticTokens|Semantic vs Acoustic Tokens", "概念库/ConditionalFlowMatching|Conditional Flow Matching", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation for Speech LLM", "概念库/StreamingSpokenDialogue|Streaming Spoken Dialogue", "概念库/SpokenDialogueEvaluation|Spoken Dialogue Evaluation", "概念库/SpeechTokenizer|Speech Tokenizer"], "source": "arXiv", "github": "", "demo": ""}, {"name": "TableQuest", "title": "Benchmarking Table Comprehension in the Wild", "arxiv_id": "2412.09884", "date": "2024-12", "venue": "TRL Workshop @ NeurIPS 2024", "org": "", "tier": "deep", "tags": ["benchmark", "table-comprehension", "LLM-evaluation", "financial-NLP", "question-answering"], "summary": "提出 TableQuest,一个在真实金融报告(SEC 10-K)语境下评估 LLM 表格理解能力的 benchmark,覆盖从事实提取到多步推理三个难度层次", "route": "SEC 10-K HTML 报告 → 三轮渐进式 QA 合成(Easy/Medium/Hard) → 人机混合质量过滤 → 240 题评估集 → ELO 排名(GPT-4-turbo 评委)", "metrics": "GPT-4-turbo Overall ELO 1164.35 / Accuracy 65.6%; Claude-3.5-sonnet ELO 1081.39 / Accuracy 65.6%; 闭源模型显著优于开源 [Table 2][Table 3]", "takeaway": "(1) 三轮渐进式 QA 合成 pipeline,每轮以前一轮为负例引导更高难度; (2) ELO-based 评测替代 EM/F1 处理开放性答案; (3) 自监督验证方法(用学术论文做 domain transfer 验证合成质量)", "limitation": "仅覆盖金融领域 10-K 报告;评估集仅 240 题(80/级);ELO 评委本身为 GPT-4-turbo 可能存在偏好;未评测 2024 年后的新模型(o1/Claude 3.5 Sonnet v2 等)", "concepts": [], "source": "Sources/TableQuest.pdf", "github": "", "demo": ""}, {"name": "Dynamic-SUPERB", "title": "Dynamic-SUPERB Phase-2: A Collaboratively Expanding Benchmark for Measuring the Capabilities of Spoken Language Models with 180 Tasks", "arxiv_id": "2411.05361", "date": "2024-11", "venue": "arXiv Preprint (National Taiwan Univ / UT Austin / CMU / NTU / INRS-EMT)", "org": "", "tier": "deep", "tags": ["benchmark", "speech-evaluation", "spoken-language-model", "instruction-following", "task-taxonomy", "audio-understanding", "music-understanding", "LLM-as-judge"], "summary": "Dynamic-SUPERB Phase-2 是迄今最大的 instruction-based 通用语音/音频模型评估 benchmark,包含 180 个任务 (91 个新增),覆盖 speech/music/audio 三大域,并提供详细的任务分类体系和 LLM-as-judge 评估 pipeline", "route": "Task Collection (community contribution, 145 proposals → 91 accepted) → Task Formulation (instruction + audio + optional text) → Task Taxonomy (speech 8 domains + audio/music 9 domains) → Evaluation (LLM judge for classification, LLM post-processor for regression, direct metrics for sequence generation)", "metrics": "覆盖 180 tasks (vs SUPERB 13, HEAR 19, Phase-1 55) [Table 1]; 评估 8 个模型 (SALMONN-7B/13B, Qwen-Audio, Qwen2-Audio, WavLLM, LTU-AS, GAMA, MU-LLaMA) + Whisper-LLaMA baseline; 无单一模型在所有任务上表现优异 [§5, Fig 3]", "takeaway": "(1) 社区协作式 benchmark 构建方法 (call for tasks); (2) 多粒度任务分类体系 (speech 8 域 + audio/music 9 域); (3) LLM-as-judge 评估 pipeline for classification + regression + sequence generation 三类任务的统一评估", "limitation": "缺少语音生成任务 [§6 Limitations]; 任务分类体系可能不完整; LLM-as-judge 在某些新任务上泛化性未验证; 核心任务结果与原始 SUPERB 不直接可比 (指令格式不同)", "concepts": ["AudioUnderstanding", "SpeechLanguageModel"], "source": "https://arxiv.org/abs/2411.05361", "github": "", "demo": ""}, {"name": "EmoSphere++", "title": "EmoSphere++: Emotion-Controllable Zero-Shot Text-to-Speech via Emotion-Adaptive Spherical Vector", "arxiv_id": "2411.02625", "date": "2024-11", "venue": "IEEE Transactions on Affective Computing (submitted)", "org": "", "tier": "deep", "tags": ["emotional-TTS", "zero-shot", "emotion-control", "style-transfer", "flow-matching", "disentanglement", "VAD", "spherical-coordinates"], "summary": "提出 emotion-adaptive spherical vector (EASV) 将 VAD 维度情感建模为球坐标系下的 style(角度)+ intensity(半径),结合 joint attribute style encoder 实现情感可控的零样本 TTS", "route": "Text → Phoneme → Text Encoder + Duration Predictor → mu; Reference Speech → Joint Attribute Style Encoder (Speaker Encoder + Emotion Encoder + EASV Extractor) → e_sty; (mu, e_sty) → CFM Decoder → Mel → BigVGAN → Waveform", "metrics": "Seen: nMOS 3.92, ECA 93.53%, EECS 0.927 (vs GenerSpeech ECA 82.54%); Unseen: nMOS 3.91, ECA 94.61%, EECS 0.936 [Table II, III] (ESD dataset)", "takeaway": "(1) Emotion-adaptive centroid extraction — 用 max-ratio 找球心而非简单均值,适用于任何需要考虑类间分布的坐标变换; (2) Normalized orthogonality loss 跨样本对增强解耦泛化; (3) SVAS 指标可复用于评估任何情感 TTS", "limitation": "仅在 ESD (10 speakers, 5 emotions) 上验证,规模远小于现代零样本 TTS (CosyVoice/Seed-TTS 用数万小时); 依赖外部 VAD 预测器的准确性; 未与 LLM-based TTS 对比; 代码已开源", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "StyleTransferinTTS", "GlobalStyleTokens", "SpeakerEmbedding", "GradientReversalLayer", "DurationPredictor"], "source": "Sources/EmoSphere++.pdf", "github": "", "demo": ""}, {"name": "Fish-Speech", "title": "Fish-Speech: Leveraging Large Language Models for Advanced Multilingual Text-to-Speech Synthesis", "arxiv_id": "2411.01156", "date": "2024-11", "venue": "Technical Report", "org": "", "tier": "deep", "tags": ["TTS", "LLM", "dual-AR", "GFSQ", "vocoder", "multilingual", "zero-shot", "voice-cloning"], "summary": "Dual-AR (Slow+Fast Transformer) + GFSQ + LLM 替代 G2P 的多语言 TTS 框架,用 FF-GAN 解码", "route": "Text → LLM (Slow Transformer) → Semantic Tokens → Fast Transformer → GFSQ Codebook Tokens → FF-GAN (ConvNeXt Encoder + FireFly Generator) → Mel → Waveform", "metrics": "WER 6.89% (GT 9.22%), SIM 0.914/0.762 (Resemblyzer/SpeechBrain), MOS 4.05 [Table 1-3]", "takeaway": "(1) Dual-AR 分离全局语义和局部声学的 idea; (2) GFSQ 实现 100% codebook 利用率; (3) LLM 直接处理文本免去 G2P 依赖", "limitation": "仅在 voice cloning 场景评估,缺少 Seed-TTS-eval 等标准 benchmark; 对比基线较少 (CosyVoice/F5-TTS/reecho); 无中文实验结果", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "FiniteScalarQuantization", "ResidualVectorQuantization", "NeuralVocoder", "SemanticvsAcousticTokens"], "source": "https://arxiv.org/abs/2411.01156", "github": "", "demo": ""}, {"name": "SALMONN-omni-v1", "title": "SALMONN-omni: A Codec-free LLM for Full-duplex Speech Understanding and Generation (v1 Technical Report)", "arxiv_id": "2411.18138", "date": "2024-11", "venue": "arXiv (Technical Report)", "org": "", "tier": "deep", "tags": ["full-duplex", "speech-LM", "codec-free", "thinking-mechanism", "streaming", "turn-taking", "barge-in", "echo-cancellation"], "summary": "首篇提出 codec-free 全双工 Speech LLM 概念框架的技术报告,通过 streaming encoder + LLM + streaming synthesizer 的 embedding 桥接 + \"thinking\" 状态转换机制实现同时听说 [§1, §2]", "route": "streaming speech input → Streaming Speech Encoder (auditory embeddings, 每 block 固定时长 delta_t) → LLM (生成 n 个 word embeddings/block, 含 `<start_speak>`/`<end_speak>`/`<think>` 状态 token) → Streaming Speech Synthesizer (cross-attention, 生成 delta_t 时长语音) [§2, Fig 2]", "metrics": "无定量评估表格,仅提供 case study 定性展示 (streaming ASR, speech enhancement, spoken QA, context-independent/dependent barge-in, echo cancellation) [§3, Fig 3-9]", "takeaway": "(1) \"thinking\" 机制的核心洞察: 在 listening 状态给 LLM 输入 `<think>` token 但不强制特定输出,用负系数 loss 避免 placeholder 重复导致的分布坍缩 [§2]; (2) 周期同步 time block 设计让 LLM 获得 \"时间感\",对齐音频和文本模态 [§2]; (3) 用 embedding 而非 codec token 连接组件,避免词表冲突和灾难性遗忘 [§1, §2]", "limitation": "仅为概念框架和定性 case study,无定量实验对比 [§3]; 未公开模型架构细节 (encoder/synthesizer 具体选型、LLM backbone、训练超参) [§2]; 未公开 checkpoint [§1]", "concepts": ["概念库/Full-duplexSpokenDialogue|Full-duplex Spoken Dialogue", "概念库/SpeechLanguageModel|Speech Language Model", "概念库/StreamingSpokenDialogue|Streaming Spoken Dialogue", "概念库/Turn-takinginSpokenDialogue|Turn-taking in Spoken Dialogue", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy"], "source": "Sources/SALMONN-omni-v1.pdf", "github": "", "demo": ""}, {"name": "Seed-VC", "title": "Seed-VC: Zero-Shot Voice Conversion with Diffusion Transformers", "arxiv_id": "2411.09943", "date": "2024-11", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["voice-conversion", "zero-shot", "diffusion-transformer", "flow-matching", "timbre-leakage", "singing-voice-conversion", "in-context-learning"], "summary": "通过外部 timbre shifter 消除训练-推理不一致 + diffusion transformer 利用完整参考语音做 in-context learning,实现高 speaker similarity 的零样本语音转换", "route": "Source speech → Timbre Shifter → Semantic Encoder (Whisper-small) → Length Regulator → [Timbre Vector (CAM++) + Reference Semantic + Noisy Mel] → U-DiT (flow matching) → ODE Solver → BigVGANv2 → Converted speech", "metrics": "SECS 0.8676 / WER 11.99% / CER 2.92% (vs OpenVoice 0.7547/15.46/4.73, CosyVoice 0.8440/18.98/7.29) [Table 1]; Singing VC: SECS 0.7405 / CER 19.70% vs RVCv2 0.7264/28.46% [Table 2]", "takeaway": "(1) Timbre shifter 训练策略 — 用不完美的外部 VC/TTS 模型扰动训练数据,消除 content extractor 中的 timbre leakage,泛化性强; (2) 完整参考语音作为 prompt 做 in-context learning; (3) 从 speech VC 到 singing VC 仅需加入 F0 conditioning", "limitation": "(1) 依赖外部 timbre shifter (OpenVoiceV2) 的质量; (2) DNSMOS 略低于 OpenVoice,quality-similarity trade-off; (3) 未做大规模 ablation on timbre shifter methods; (4) 代码已开源 (github.com/Plachtaa/seed-vc)", "concepts": ["ConditionalFlowMatching", "Self-SupervisedSpeechRepresentation", "SpeakerEmbedding", "SpeechFactorization", "DiffusionModel", "F0Modeling"], "source": "Sources/Seed-VC.pdf", "github": "", "demo": ""}, {"name": "Cont-SPT", "title": "Continuous Speech Tokenizer in Text To Speech", "arxiv_id": "2410.17081", "date": "2024-10", "venue": "NAACL 2025 Findings", "org": "", "tier": "deep", "tags": ["TTS", "continuous-token", "speech-tokenizer", "autoregressive", "flow-matching", "information-retention"], "summary": "用连续 speech tokenizer (Cont-SPT) 替代 RVQ 离散 tokenizer,在 VALL-E 架构上减少量化信息损失,提升 TTS 连续性和 MOS", "route": "Audio → Encoder(24kHz resample) → Continuous embedding → AR Language Model → Codec Decoder + Flow Matching + De-noising → Output Audio", "metrics": "WER 6.59% (vs VALL-E 12.73%), SIM 0.73 (vs 0.53), EMoS 1.32 (vs 0.83), Continuity 3.61 (vs 1.80), LibriSpeech test-clean [Table 1, 2]", "takeaway": "(1) tokenizer encoder-decoder 先以 VAE-like 方式预训练再联合微调(LR=0.05x LM); (2) 用频域 transfer function 分析 tokenizer 信息保留能力; (3) 连续 token 对采样率更鲁棒", "limitation": "仅在 LibriSpeech (~1000h) 上实验,未验证大规模数据; 无 zero-shot speaker cloning 评估; 未在多模态 LLM 场景验证; EMoS 绝对值偏低(1.32),可能与评估工具有关", "concepts": ["SpeechTokenizer", "ResidualVectorQuantization", "ConditionalFlowMatching", "VariationalAutoencoderforTTS", "CodecLanguageModel", "SemanticvsAcousticTokens", "MelSpectrogram", "TTSEvaluation"], "source": "Sources/Cont-SPT.pdf", "github": "", "demo": ""}, {"name": "DMOSpeech", "title": "DMOSpeech: Direct Metric Optimization via Distilled Diffusion Model in Zero-Shot Speech Synthesis", "arxiv_id": "2410.11097", "date": "2024-10", "venue": "Preprint (2024.10, revised 2025.02)", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "distillation", "zero-shot", "metric-optimization", "speaker-similarity", "distribution-matching"], "summary": "通过 Distribution Matching Distillation 将 diffusion TTS teacher 蒸馏为 4-step student,打通完整梯度通路后首次实现端到端优化 SV loss + CTC loss,student 在所有主观和客观指标上超越 teacher 且推理快 13x", "route": "Text (IPA) → DiT encoder (8 layers) → DiT decoder (16 layers, 4-step DMD sampling from noise) → DAC latent → DAC decoder → Waveform; 训练时加 DMD loss + multimodal adversarial loss + CTC loss + SV loss", "metrics": "MOS-N 4.42 / SMOS-V 4.49 (超越 GT 的 3.86) / WER 1.94 (低于 GT 的 2.19) / SIM 0.69 (超越 GT 的 0.67) / RTF 0.07 (vs teacher 0.96), LibriSpeech test-clean [Table 1, 3]", "takeaway": "(1) DMD2 蒸馏 + 训练时模拟单步推理减少 train/infer mismatch; (2) 在 latent 空间训练 CTC ASR 和 SV model 使 metric optimization 端到端可微; (3) mode shrinkage 在强条件生成中有益的洞察", "limitation": "(1) 蒸馏带来条件 diversity 下降 (CVf0 从 teacher 0.70 降至 0.58); (2) 仅在英语 LibriLight 上训练和评估,未验证多语言; (3) speaker similarity 超越 GT 引发 deepfake 伦理风险; (4) 无显式 duration/prosody 建模,依赖 prompt speaking rate 估算长度", "concepts": ["Diffusion-basedTTS", "DiffusionModel", "ScoreMatching", "SpeakerEmbedding", "SpeakerVerification", "Classifier-FreeGuidance", "Non-autoregressiveTTS"], "source": "Sources/DMOSpeech.pdf", "github": "", "demo": ""}, {"name": "DiVA", "title": "DiVA: Distilled Voice Assistant Without Instruction Training Data", "arxiv_id": "2410.02678", "date": "2024-10", "venue": "ACL 2025", "org": "", "tier": "deep", "tags": ["speech-LM", "distillation", "context-distillation", "Q-Former", "Whisper", "instruction-following", "data-efficiency", "voice-assistant"], "summary": "通过跨模态 context distillation (用冻结 text LLM 对 transcript 的响应分布作为自监督目标) 训练 Speech LLM,仅用 3.5k 小时 ASR 数据即在多任务上泛化,用户偏好 72% 胜率优于 Qwen 2 Audio (>100x 训练计算量)", "route": "Audio → Whisper encoder (冻结) → Q-Former (Whisper decoder 初始化, 可训练) → audio tokens → Llama 3 8B (冻结) → text response; 同时对 transcript → Llama 3 text embedding + output hidden state 做 L2 距离对齐", "metrics": "SQA PANDA ~55% (HeySQuAD, vs Qwen2Audio ~40%); IEMOCAP wF1 ~48%, MELD wF1 ~43%; CoVoST2 BLEU 在 Tamil/Turkish 最佳; 用户偏好 72% win rate vs Qwen 2 Audio [Fig 2/3/4/6]", "takeaway": "(1) 隐藏状态 L2 距离作为 KL divergence 高效近似 (Lemma 1) — 当 teacher/student 共享冻结 output matrix 时可用; (2) Whisper decoder 初始化 Q-Former — 复用已有 cross-attention 而非从头训练; (3) 仅 ASR 数据 + distillation 即可泛化到多任务 — 减少对 instruction data 的依赖", "limitation": "继承 base LLM 的偏见 (中日文生成 Pinyin/Romanji 而非原生文字); 无法理解纯声学线索 (sarcasm/humor 接近 chance); 仅支持理解不支持语音生成; 仅在 CommonVoice (朗读语音) 上训练,真实对话场景覆盖不足", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation for Speech LLM", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy", "概念库/AudioUnderstanding|Audio Understanding", "概念库/Self-SupervisedSpeechRepresentation|Self-Supervised Speech Representation"], "source": "Sources/DiVA.pdf", "github": "", "demo": ""}, {"name": "LiveSpeech2", "title": "Zero-Shot Text-to-Speech from Continuous Text Streams", "arxiv_id": "2410.00767", "date": "2024-10", "venue": "Under Review (arXiv)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "streaming", "Mamba", "SSM", "cross-attention", "semantic-guidance", "RVQ"], "summary": "基于 Mamba+RoPE cross-attention 的 streaming zero-shot TTS,支持无限长文本流输入,通过推理时 semantic guidance 保证内容对齐", "route": "文本流(BPE tokens) + 参考语音(Transformer encoder→64 embeddings) → Mamba decoder(12 层, cross-attention 融合) → EnCodec 16 codebook codes → EnCodec decoder → 语音", "metrics": "CER 2.7/3.0 (3-10s/10s+), WER 3.1/4.1, SS 61.7/67.6, SMOS 3.4/3.4, NMOS 3.2/3.3 (LibriTTS test-clean) [Table 2]", "takeaway": "(1) RoPE 在 cross-attention 中用于 text sliding window — 使固定上下文训练泛化到无限长推理; (2) grapheme token 联合解码 + transcript-guided sampling — 不需额外 ASR 即可推理时纠正对齐; (3) N-time sampling 利用 grapheme 输出做 CER 选择,无需外部 ASR", "limitation": "未开源; 仅英语验证; CER/WER 落后于 XTTS v2 等非流式模型; Mamba 内部状态不可控导致 hard guidance 效果差; 极短 chunk (单词级) 性能退化明显", "concepts": ["ResidualVectorQuantization", "SemanticvsAcousticTokens", "SpeechTokenizer", "SpeakerEmbedding", "CodecLanguageModel", "StreamingSpokenDialogue", "Speech-TextAlignment"], "source": "Sources/LiveSpeech2.pdf", "github": "", "demo": ""}, {"name": "MitigatingUnauthorized", "title": "Mitigating Unauthorized Speech Synthesis for Voice Protection", "arxiv_id": "2410.20742", "date": "2024-10", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["voice-protection", "adversarial-perturbation", "unlearnable-examples", "data-poisoning", "voice-cloning", "deepfake-defense", "error-minimizing"], "summary": "提出 Pivotal Objective Perturbation (POP),在原始语音中嵌入不可感知的 error-minimizing 扰动,使 TTS 模型在 fine-tuning 时无法学到有效的语音分布,从而阻止高质量仿冒语音合成", "route": "原始音频 → 代理 TTS 模型(VITS)→ 分析多目标 loss → 选择 mel reconstruction loss 作为 pivotal objective → PGD 生成 error-minimizing 扰动 → 受保护音频(position-fixed patch perturbation)→ 攻击者 fine-tune 任意 TTS 模型均生成低质量语音", "metrics": "MB-iSTFT-VITS LibriTTS WER 21.9%→127.3%, MCD 5.83→13.65 [Table 1]; 跨模型迁移 VITS WER 27.0%→124.0% [Table 3]; 受保护音频 SNR 17.9dB, PESQ 3.55 [Fig 4]; MOS 降至 0.13-0.18(VITS/MB-iSTFT-VITS) [Table 2]", "takeaway": "pivotal objective selection -- 面对多目标 TTS loss,分析哪个 loss 与音频输入直接相关且跨模型通用,只优化它做扰动生成;position-fixed perturbation 减少计算开销同时提高不可感知性", "limitation": "仅覆盖 fine-tuning 场景(不含 zero-shot);无感知优化(仅用 L_p norm);MOS 评估仅 61 人;未测试 codec LM 架构;被同作者 SafeSpeech (2025) 全面升级", "concepts": ["Anti-spoofingandDeepfakeDetection", "SpeakerVerification", "MelSpectrogram", "VoiceCloningTaxonomy", "VariationalAutoencoderforTTS"], "source": "Sources/MitigatingUnauthorized.pdf", "github": "", "demo": ""}, {"name": "Moshi", "title": "Moshi: a speech-text foundation model for real-time dialogue", "arxiv_id": "2410.00037", "date": "2024-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["full-duplex", "speech-LM", "real-time", "streaming", "audio-codec", "RVQ", "inner-monologue", "multi-stream"], "summary": "首个全双工实时语音对话大模型,通过 Helium 7B 文本 backbone + Mimi 混合语义-声学 codec + RQ-Transformer 层级生成 + Inner Monologue 文本前缀,实现 160ms 理论延迟的 speech-to-speech 对话 [§1]", "route": "24kHz audio → Mimi encoder (causal conv + VQ/RVQ, 12.5Hz) → [text + semantic + 7 acoustic] tokens → Temporal Transformer (7B, Helium) + Depth Transformer (6L, 1024d) → Mimi decoder → 24kHz audio [§3.1, Fig 1]", "metrics": "sWUGGY 74.8 / sBLIMP 59.9 (audio-only cold start, SOTA) [Table 7]; spoken QA: Web Q. 26.6 / LLaMA Q. 62.3 / Trivia QA 22.8 (全面超越 SpeechGPT/Spectron) [Table 8]; Mimi MUSHRA 81.0 (adversarial-only, vs RVQGAN 31.3) [Table 4]; streaming TTS WER 4.7% on LibriSpeech [§5.7]; dialogue cond. PPL 41.9 (超越 dGSLM cascaded 45.9) [Table 9]; 安全评分 83.05 (ALERT benchmark) [§6.1]", "takeaway": "(1) Inner Monologue: text token 作为 audio token 的前缀,显著提升语言质量,且同一架构通过调节 text-audio delay 可派生 streaming ASR/TTS [§3.4.4]; (2) Split RVQ: 1 VQ (semantic) + 7 RVQ (acoustic) 解耦语义-声学冲突 [§3.3.2]; (3) Depthwise parametrization: Depth Transformer 的每个 codebook level 使用独立参数,减少层间竞争 [§3.4.1]; (4) Adversarial-only training: 去除重建 loss 反而大幅提升感知音质 [§3.3]", "limitation": "仅支持英语 [§1]; 安全评分中等 (83.05 vs GPT-4 99.98) [§6.1]; 量化到 4-bit 时 MMLU 下降 5-10 点 [§5.8]; signal-based watermarking 不可用 (codec 非幂等) [§6.4]; 训练需多阶段 (text pretrain → audio pretrain → multi-stream post-train → Fisher finetune → instruct finetune) [Table 1]; 全部开源 (github.com/kyutai-labs/moshi)", "concepts": ["Full-duplexSpokenDialogue", "SpeechLanguageModel", "SpeechTokenizer", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "StreamingSpokenDialogue"], "source": "Sources/Moshi.pdf", "github": "", "demo": ""}, {"name": "SNAC", "title": "SNAC: Multi-Scale Neural Audio Codec", "arxiv_id": "2410.14411", "date": "2024-10", "venue": "NeurIPS 2024 Workshop on AI-Driven Speech, Music, and Sound Generation", "org": "", "tier": "deep", "tags": ["audio-codec", "neural-compression", "multi-scale-RVQ", "RVQGAN", "speech-tokenizer"], "summary": "在 RVQGAN 的 RVQ 阶段引入多尺度时间分辨率 (Multi-Scale RVQ), 让不同量化层在不同帧率上工作, 以更低比特率达到更高音质 [论文原文]", "route": "Audio (44.1kHz/32kHz/24kHz) → Conv Encoder (stride [2,3,8,8] or [2,4,8,8]) → MSRVQ (3-4层, 不同下采样因子 [8,4,2,1], codebook 4096x12bit) → Conv Decoder (noise blocks + depthwise conv + local windowed attention) → Reconstructed Audio [§4.1]", "metrics": "Speech MUSHRA 88.4 @0.98kbps vs DAC 85.0 @2.5kbps vs EnCodec 75.9 @6kbps [Table 2]; Music MUSHRA 77.9 @1.9kbps vs DAC 90.4 @7.74kbps [Table 3]; 消融: multi-scale ViSQOL 4.00 vs single-scale 3.89 @更高比特率3.1kbps [Table 1]", "takeaway": "Multi-Scale RVQ (不同层不同帧率) 可降低总 token 数 + 引入天然 coarse-to-fine 结构; Noise Block (input-dependent Gaussian noise) 提升重建质量和 codebook 利用; depthwise conv 稳定 GAN 训练且减参数", "limitation": "音乐评估在最高比特率下仍未达 DAC 水准; 无 semantic distillation (纯 acoustic codec); 代码已开源 (github.com/hubertsiuzdak/snac)", "concepts": ["ResidualVectorQuantization", "SpeechTokenizer", "SemanticvsAcousticTokens", "CodebookCollapse", "Multi-scaleSTFTDiscriminator"], "source": "Sources/SNAC.pdf", "github": "", "demo": ""}, {"name": "STTATTS", "title": "STTATTS: Unified Speech-To-Text And Text-To-Speech Model", "arxiv_id": "2410.18607", "date": "2024-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multi-task-learning", "ASR", "TTS", "encoder-decoder", "parameter-efficient", "speech-text-unified", "low-resource", "Arabic-TTS"], "summary": "通过 task fusion module + multi-task loss 在单个 SpeechT5 encoder-decoder 中同时学习 ASR 和 TTS,参数量仅为分离训练的 ~50%,性能可比单任务模型", "route": "语音/文本 → modal-specific pre-net → shared transformer encoder → task fusion module (128-dim task vector + FC) → shared decoder → modal-specific post-net → 文本/mel spectrogram → HiFi-GAN", "metrics": "English ens WER 4.84 / TTS CER 3.18 (155M params) vs VoxtLM_base WER 6.5 / TTS CER 3.5 (350M params); English enl WER 2.99 / TTS CER 2.10 [Table 3, 5]", "takeaway": "(1) 极简 task fusion module (128-dim vector + FC) 在共享 encoder 输出上条件化任务,几乎无额外参数开销; (2) warm fine-tuning 策略解决 ASR/TTS 数据不平衡问题; (3) 联合训练改善 ASR 性能 (ASR+TTS 数据 > 单 ASR 数据)", "limitation": "合成语音 MOS 3.0-3.4 (enl 环境),自然度仍有差距; 仅比较 VoxtLM 一个 joint-task baseline; 未尝试更大模型规模; 阿拉伯语数据太少 (32h) 导致 TTS 质量有限", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeakerEmbedding", "NeuralVocoder", "MelSpectrogram", "Speech-TextAlignment", "Attention-basedTTS", "Text-to-SpeechPipeline", "TTSEvaluation"], "source": "Sources/STTATTS.pdf", "github": "", "demo": ""}, {"name": "VeryAttentiveTacotron", "title": "Robust and Unbounded Length Generalization in Autoregressive Transformer-Based Text-to-Speech", "arxiv_id": "2410.22179", "date": "2024-10", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "autoregressive", "attention", "alignment", "robustness", "length-generalization", "encoder-decoder", "relative-position-bias"], "summary": "通过可微的 Interpolated Relative Position Biases (IRPBs) 和可学习的 latent alignment position,让 AR Transformer TTS 在保留多头交叉注意力灵活性的同时,实现无限制长度泛化和消除 word dropping/repeating。", "route": "Phoneme → Conv+Self-Attn Encoder → (Alignment Layer: LSTM + Location-based Cross-Attn w/ IRPBs → monotonic alignment position) → 6x (Self-Attn + Relative Cross-Attn w/ IRPBs + FFN) Decoder → VQ-VAE codes → Mel → GAN Vocoder → Waveform", "metrics": "MOS 3.68 (Lessac) / 3.16 (LibriTTS) 与 T5 baseline 无显著差异; CER 3.3 vs T5 的 10.2 (Lessac) [Table 1]; 泛化到 1500 字符(~90s)而训练仅 9.6s; 重复词压力测试 0/27 错误 vs T5 的 14/27 [§5.4]", "takeaway": "IRPBs 的设计思路(将离散 RPB 变连续可微,配合 Gaussian 初始化 + MDP)可推广到任何需要单调对齐的 encoder-decoder 任务; alignment position 作为 latent variable 通过反向传播学习,不需要外部对齐标注", "limitation": "训练速度慢 12-20% (alignment layer 序列化); 仅在英语数据上实验; 未与 VALL-E/ELLA-V 等当代 codec LM 系统直接比较; VQ-VAE + vocoder 两阶段离散化流程复杂", "concepts": ["Attention-basedTTS", "Non-autoregressiveTTS", "DurationPredictor", "NeuralVocoder", "SpeakerEmbedding", "MelSpectrogram", "TTSEvaluation"], "source": "Sources/VeryAttentiveTacotron.pdf", "github": "", "demo": ""}, {"name": "BigCodec", "title": "BigCodec: Pushing the Limits of Low-Bitrate Neural Speech Codec", "arxiv_id": "2409.05377", "date": "2024-09", "venue": "arXiv (IEEE SLT 2024)", "org": "", "tier": "deep", "tags": ["audio-codec", "low-bitrate", "single-codebook", "model-scaling", "GAN-based", "SVQ"], "summary": "通过将模型规模扩大到 159M 参数(典型 codec 的 11 倍),在 1.04 kbps 单码本条件下实现与 4-6 kbps 多码本 codec 可比的重建质量,MUSHRA 甚至超过 GT", "route": "Waveform → Residual CNN (snake activation, 5 blocks, R=200) + LSTM → 8D projection + L2-norm → SVQ (K=8192, single codebook) → 8D → LSTM + Residual CNN → Reconstructed Waveform; MPD + MS-STFT Discriminator", "metrics": "MUSHRA 92.33 (> GT 91.84), PESQ-WB 2.68 (vs DAC-4k 2.72, EnCodec-6k 2.77), SIM 0.84 (vs TF-Codec@1.5k 0.73), STOI 0.93 | LibriSpeech test-clean", "takeaway": "(1) 低比特率 codec 中 model scaling 是被忽视但有效的方向; (2) 低维 VQ + L2-norm 在单码本场景下确保高利用率; (3) LSTM 对时序建模的持续价值", "limitation": "RTF 仅 1.1x (勉强实时); 仅 960h LibriSpeech 训练; 300M 无进一步增益(scaling 存在天花板); 无语义建模; 16 kHz", "concepts": ["Single-codebookvsMulti-codebook", "ResidualVectorQuantization", "CodecTrainingObjectives", "Multi-scaleSTFTDiscriminator", "CodebookCollapse", "TokenRateandBitrateTrade-offs", "SnakeActivation"], "source": "Sources/BigCodec.pdf", "github": "", "demo": ""}, {"name": "CoFi-Speech", "title": "CoFi-Speech: Speaking from Coarse to Fine — Improving Neural Codec Language Model via Multi-Scale Speech Coding and Generation", "arxiv_id": "2409.11630", "date": "2024-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-codec", "multi-scale", "coarse-to-fine", "LM-TTS", "zero-shot-TTS", "recency-bias", "VQ-VAE", "multi-resolution"], "summary": "提出多尺度 codec (CoFi-Codec) + 多尺度生成 (CoFi-LM) 的 coarse-to-fine CLM-TTS 框架,通过 stack-of-scale 多 LM 级联从高时间尺度到低时间尺度逐步生成,显著缓解 recency bias 并超越 CosyVoice", "route": "Speech → Mel Spectrogram → Multi-scale Encoder (ResNet + strided conv, 3 级下采样) → VQ at each scale (120ms/40ms/20ms, codebook 16384, s3/s2/s1) + ECAPA-TDNN global embedding → Multi-scale Decoder (VQ add + ResNet + transposed conv 上采样) → Mel → BigVGAN Vocoder → Waveform; TTS: Text (BPE 8192) + Ref Embedding → CoFi-LM (SoS: 3 个级联 12L Transformer, 各自生成一个尺度的 token) → Speech Tokens → CoFi-Codec Decoder → Audio", "metrics": "SoS NMOS 4.42/SMOS 3.90 vs CosyVoice NMOS 4.28/SMOS 3.70, VALL-E NMOS 3.46/SMOS 2.92, SoCodec-TTS NMOS 4.30/SMOS 3.51 [Table I]; 三尺度 SoS CER 2.60%/SIM 87.4 vs 单尺度 CER 4.35%/SIM 84.5 [Fig 3]; 数据集 WenetSpeech4TTS Basic 7k hours", "takeaway": "(1) Stack-of-Scale 级联: 用多个小 LM 分别生成不同尺度 token,高尺度 LM 的 hidden states 作为 prompt + 上采样 conditioning 传给低尺度 LM,避免单 LM 处理长序列; (2) Scale-Wise Nested Dropout: 训练时随机 mask 低尺度序列,迫使高尺度序列保留有效信息,防止表示坍缩; (3) Residual 减法分离: encoder 输出与 decoder 累积输出做差取残差再量化,实现信息逐层细化", "limitation": "仅在中文 (WenetSpeech4TTS 7k hours) 上验证; 编码操作在 Mel 域而非波形域; BigVGAN vocoder 非联合训练; SoS 需要 3 个独立 LM,参数量和训练成本更高; 未报告推理延迟/RTF; MOS 测试仅 10 名评估者、100 条子集", "concepts": ["CodecLanguageModel", "ResidualVectorQuantization", "Single-codebookvsMulti-codebook", "CodebookCollapse", "LLM-basedTTS", "SpeechTokenizer", "MelSpectrogram", "NeuralVocoder", "SpeakerEmbedding"], "source": "Sources/CoFi-Speech.pdf", "github": "", "demo": ""}, {"name": "CoT-ST", "title": "CoT-ST", "arxiv_id": "2409.19510", "date": "2024-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-translation", "chain-of-thought", "SLM", "curriculum-learning", "Q-Former", "Whisper", "Qwen2"], "summary": "通过三阶段课程学习 (ASR→MMT→SRT) 激活 SLM 的 Chain-of-Thought 推理能力，将语音翻译分解为\"先转写再翻译\"，SOTA 于 CoVoST-2 和 MuST-C", "route": "speech → Whisper encoder (frozen) → Q-Former (80 queries, trainable) → Qwen2-7B LLM (frozen) → transcription + translation", "metrics": "CoVoST-2 en-zh BLEU 47.7 (prev SOTA 45.2), MuST-C en-zh zero-shot BLEU 21.2 (prev 18.3), 3x inference speedup vs Qwen2-Audio [Table 2, 5]", "takeaway": "(1) 将 CoT 应用于 speech translation 的思路——隐式中间 ASR 转写为翻译提供上下文; (2) 仅训练 projection 层即可达到 SOTA; (3) 课程学习策略的任务排序设计", "limitation": "仅限 8B 参数以下 LLM 验证; 仅 text 输出 (非 S2ST); 开源", "concepts": ["SpeechLanguageModel", "Speech-TextAlignment", "AudioUnderstanding"], "source": "Sources/CoT-ST.pdf", "github": "", "demo": ""}, {"name": "ComparingDiscrete-Continuous", "title": "Comparing Discrete and Continuous Space LLMs for Speech Recognition", "arxiv_id": "2409.00800", "date": "2024-09", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["ASR", "LLM", "speech-representation", "discrete-tokens", "continuous-representation", "HuBERT", "Whisper", "LLaMA2"], "summary": "在统一框架下系统对比 discrete/continuous x supervised/unsupervised 四类语音表征在 LLM-based ASR 中的表现,发现 token 兼容性 (matched tokens) 是 pretrained LLM 场景下的关键因素", "route": "Speech → Speech Encoder (HuBERT/Whisper/HuBERT-CTC/K-means) → Discrete tokens 或 Continuous embeddings → Adapter/Embedding → LM (JTFS LM 或 LLaMA2-7b LoRA) → Text", "metrics": "WER 1.69%/3.03% on LibriSpeech test-clean/other (HuBERT-CTC xlarge + 4-gram + LLaMA2, #29); 从零训练最优 5.28%/9.74% (Whisper continuous, #20)", "takeaway": "(1) 2x2 表征分类矩阵是清晰的实验设计范式; (2) matched tokens 对 pretrained LLM 的重要性可推广到 TTS 中的 speech token 设计; (3) HuBERT layer 16 优于 layer 24 的发现可指导 SSL tokenizer 层选择", "limitation": "仅在 LibriSpeech 单一数据集验证; JTFS LM 仅 10 层 Transformer (较小); 开源代码但模型规模有限; continuous JTFS LM 的 MSE+CE 双损失设计缺乏消融", "concepts": ["Self-SupervisedSpeechRepresentation", "LLM-enhancedASR", "Speech-LLMIntegrationTaxonomy", "ModalityAdaptationforSpeechLLM", "SpeechTokenizer"], "source": "Sources/2409.00800.pdf", "github": "", "demo": ""}, {"name": "FireRedTTS", "title": "FireRedTTS: A Foundation Text-To-Speech Framework for Industry-Level Generative Speech Applications", "arxiv_id": "2409.03283", "date": "2024-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "foundation-model", "voice-cloning", "chatbot", "speech-tokenizer", "flow-matching", "zero-shot"], "summary": "小红书提出的工业级 foundation TTS 框架,涵盖数据管线 + semantic-aware tokenizer + AR LM + 双路线 decoder,支持配音和聊天机器人两大应用", "route": "Raw Audio → 数据管线(增强/分割/聚类/ASR/过滤) → Clean Dataset; Text → BPE Tokenizer + Speaker Emb → AR Transformer (400M) → Semantic Tokens → Flow-Matching Mel Decoder / Streamable Decoder → SR-Vocoder (BigVGAN-V2) → 48kHz Waveform", "metrics": "CoMOS 4.32 (vs CosyVoice 4.15, GT 4.53) [Table 2]; Flow-matching decoder CoMOS 4.48, Streamable decoder 4.41 [Table 4]; UGC zero-shot MOS 4.25 / SIM 73.61%, PUGC few-shot(1h) MOS 4.65 / SIM 78.92% [Table 5]; 情感分类准确率: fine-tuned 97%/97%/100%/98% (neutral/happy/sad/angry) [Table 7]", "takeaway": "(1) 数据管线设计: 源分离→增强→VAD→聚类→ASR→三维过滤(DNSMOS/采样率/ASR置信度); (2) Clip&Shuffle 防止 acoustic encoder 泄漏 content 信息; (3) Streamable decoder 用 multi-stream LM + Mel Codec 实现流式推理; (4) Instruction tuning 的 token insertion + embedding injection 双模式控制副语言行为", "limitation": "英语和 code-switch 场景稳定性较差 (EN overall error 12%, MIX 8.5%) [Table 3]; 未开源; PUGC 场景 zero-shot SIM 仅 68.63%,需 1 小时 fine-tuning 才达工业标准; 数据管线描述详细但数据本身不公开", "concepts": ["SpeechTokenizer", "ConditionalFlowMatching", "Classifier-FreeGuidance", "SpeakerEmbedding", "SemanticvsAcousticTokens", "NeuralVocoder", "LLM-basedTTS", "EmotionControlinTTS"], "source": "Sources/FireRedTTS.pdf", "github": "", "demo": ""}, {"name": "IndicVoices-R", "title": "IndicVoices-R: Unlocking a Massive Multilingual Multi-speaker Speech Corpus for Scaling Indian TTS", "arxiv_id": "2409.05356", "date": "2024-09", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "dataset", "multilingual", "Indian-languages", "speech-enhancement", "data-pipeline", "zero-shot", "multi-speaker"], "summary": "通过语音增强管道将 ASR 数据集 IndicVoices 转化为 1,704 小时、10,496 说话人、22 种印度语言的高质量 TTS 数据集,并配套首个印度语 zero-shot/few-shot/many-shot TTS benchmark", "route": "IndicVoices (ASR, 44.1kHz) → HTDemucs (demixing) → VoiceFixer (dereverberation) → DeepFilterNet3 (enhancement) → 多指标过滤 (C50/SNR/pitch/speaking rate/CER) → 音量归一化 → IndicVoices-R", "metrics": "N-MOS 3.38 (vs LJSpeech 4.36 / IndicTTS 4.29) | SNR 60.47 dB | C50 53.45 dB | speaker similarity 88.18% (VoiceCraft on IV-R) vs 78.93% (VoiceCraft on IndicTTS) [Table 1, Table 5]", "takeaway": "英语预训练的语音增强模型 (HTDemucs/VoiceFixer/DeepFilterNet3) 具有良好的跨语言泛化能力,可直接用于非英语语音数据处理; ASR→TTS 数据转化管道可迁移到其他低资源语言", "limitation": "N-MOS 仍低于录音室质量数据集 (3.38 vs 4.29); 8kHz 会话子集未被利用; 仅使用 grapheme (无 phonemizer),对复杂音素映射的语言可能不够; 仅验证了 VoiceCraft 一个模型", "concepts": ["SpeakerAdaptation", "TTSEvaluation", "SpeakerEmbedding"], "source": "Sources/IndicVoices-R.pdf", "github": "", "demo": ""}, {"name": "LLaMA-Omni", "title": "LLaMA-Omni: Seamless Speech Interaction with Large Language Models", "arxiv_id": "2409.06666", "date": "2024-09", "venue": "ICLR 2025", "org": "", "tier": "deep", "tags": ["speech-LM", "streaming", "real-time", "non-autoregressive", "CTC", "speech-interaction", "end-to-end", "modular-SpeechLM"], "summary": "在 Llama-3.1-8B-Instruct 上挂载 Whisper 编码器和 CTC-based NAR 流式语音解码器,用 200K 合成数据训练,实现 236ms 延迟的 speech-in speech-out 交互", "route": "Speech → Whisper-large-v3 encoder (frozen) → 5x downsample adaptor (concat + 2-layer MLP) → Llama-3.1-8B-Instruct → upsample (lambda=25) → 2-layer NAR Transformer decoder (CTC) → HuBERT discrete units → HiFi-GAN vocoder → Speech", "metrics": "ChatGPT Score S2TIF 3.99, S2SIF 3.47; ASR-WER 10.82; UTMOS 3.93; Latency 236ms (streaming, Omega=10) [Table 2, Fig 3, Table 4]", "takeaway": "(1) CTC 做 LLM hidden states → speech units 的变长对齐,免去预对齐开销; (2) upsample factor lambda 控制输出序列长度的设计简洁有效; (3) InstructS2S-200K 的三步数据构造流程 (指令改写→响应生成→语音合成) 可复制到其他语音交互数据集构建", "limitation": "NAR decoder 建模能力有限导致语音自然度不如 AR 方案; 仅支持单轮英文交互; 训练数据仅~1K小时语音,规模受限; 无说话人/情感控制; ASR-WER (10.82) 高于级联系统 (3.78/6.77)", "concepts": ["SpeechLanguageModel", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "StreamingSpokenDialogue", "Non-autoregressiveTTS", "SpeechTokenizer"], "source": "Sources/LLaMA-Omni.pdf", "github": "", "demo": ""}, {"name": "MT-LLM", "title": "Large Language Model Can Transcribe Speech in Multi-Talker Scenarios with Versatile Instructions", "arxiv_id": "2409.08596", "date": "2024-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "multi-talker-ASR", "instruction-following", "dual-encoder", "LoRA", "cocktail-party", "multi-task", "SOT"], "summary": "首次将 LLM 用于多说话人 cocktail party 场景的 instruction-based ASR,通过 Whisper+WavLM 双编码器提取语义+声学表征,LoRA 微调 Llama-2 实现 6 种 talker attribute 指令的灵活转写", "route": "Multi-talker audio → Whisper encoder (semantic) + WavLM (multi-layer acoustic, learnable weighted sum) (均冻结) → 各自 Conv adapter (2-layer conv + bottleneck + linear) → concat → Llama-2-7b-chat + LoRA (rank=32) → SOT-style text output", "metrics": "2-spk LibriSpeechMix WER 5.2% (vs SOT-Conformer 4.9%); single-spk 2.3% (vs SOT-Conformer 2.4%); TT/KT/SS tasks 接近 best-matching baseline; 仅 1% 参数可训练 (76.6M/7.55B) [Table I, II, III]", "takeaway": "(1) WavLM multi-layer weighted sum 捕获 speaker-discriminative 声学信息的策略; (2) multi-task training 不仅带来 versatility 还改善基础 MT ASR 的正则化效应; (3) 用 best-matching 结果隔离 speaker confusion 和 ASR error 的分析方法", "limitation": "仅在模拟数据 (LibriSpeechMix) 上实验,未验证真实重叠场景; 不是通用 Speech LLM; OS/TL 任务表现有明显差距; 训练数据规模有限 (~6.3k hrs); 未与同期 Qwen2-Audio 等更大模型对比", "concepts": ["ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "AudioUnderstanding", "Self-SupervisedSpeechRepresentation"], "source": "Sources/MT-LLM.pdf", "github": "", "demo": ""}, {"name": "MaskGCT", "title": "MaskGCT: Zero-Shot Text-to-Speech with Masked Generative Codec Transformer", "arxiv_id": "2409.00750", "date": "2024-09", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "non-autoregressive", "masked-generative", "speech-codec", "semantic-token"], "summary": "用 masked generative modeling 完全替代自回归,构建无需 text-speech alignment 和 phone-level duration 的非自回归 zero-shot TTS", "route": "Text + prompt → T2S (Masked Generative Transformer 695M, 50 步迭代) → semantic tokens (50Hz) → S2A (Masked Generative 353M, 逐层) → 12 层 acoustic tokens → Vocos decoder → Waveform", "metrics": "SIM-O 0.728 / WER 2.466% (SeedTTS test-en); SIM-O 0.777 / WER 2.183% (SeedTTS test-zh); SMOS 4.24 / 4.11 (LibriSpeech / test-zh); 训练数据 100K h Emilia", "takeaway": "VQ-VAE 量化 w2v-BERT 2.0 特征做 semantic codec (优于 k-means,已被 IndexTTS2 采用); text+prompt 做 prefix + bidirectional attention 的 in-context learning 范式; flow matching 预测 total duration 而非 phone-level", "limitation": "仍需外部 duration predictor; 多语言扩展仅重训 T2S 未联合 tokenizer/S2A; 代码已开源但 100K h Emilia 数据集获取受限", "concepts": ["SpeechTokenizer", "ResidualVectorQuantization", "ConditionalFlowMatching"], "source": "Sources/MaskGCT.pdf", "github": "", "demo": ""}, {"name": "PreferenceAlignment", "title": "Preference Alignment Improves Language Model-Based TTS", "arxiv_id": "2409.12403", "date": "2024-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "preference-alignment", "DPO", "LM-based-TTS", "RLHF", "post-training"], "summary": "在 1.15B 参数的 LM-based TTS 上系统验证 DPO 的最佳实践,证明 preference alignment 可以用 1 小时数据显著提升 WER/SIM/MOS,后两项超越人类语音", "route": "预训练 LM-TTS (Multi-Scale Transformer + SoundStream) → 生成 preference pairs (metric-based ranking) → DPO 训练 (β=0.01, ~350 updates) → 评估", "metrics": "WER 4.5→3.0, SPK SIM 0.635→0.667, Proxy MOS 3.80→4.23 (LibriSpeech test-clean) [Table I]; OOD VCTK WER 1.6→1.5, SIM 0.677→0.688, MOS 3.87→4.15 [Table III.b]", "takeaway": "(1) 用 generated win-lose pairs 而非 ground truth 作 positive, (2) 小 β (0.01) 优于默认值, (3) 多 metric 联合排序构建 preference pairs 取得均衡提升, (4) 仅 1h 数据即可有效", "limitation": "仅用 proxy metric 代替人类偏好,无真人 MOS 评估; iterative DPO 不稳定; 未探索 PPO 等其他 PA 方法; 开源基于 ESPnet,非最优基线", "concepts": ["DifferentiableRewardOptimization", "LLM-basedTTS", "TTSEvaluation", "SpeakerEmbedding", "CodecLanguageModel"], "source": "Sources/PreferenceAlignment.pdf", "github": "", "demo": ""}, {"name": "SESD", "title": "Sample-Efficient Diffusion for Text-To-Speech Synthesis", "arxiv_id": "2409.03717", "date": "2024-09", "venue": "arXiv (Interspeech submission)", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "latent-diffusion", "sample-efficiency", "data-efficiency", "text-encoder", "alignment"], "summary": "通过 latent diffusion + ByT5 文本编码 + 非对称 loss weighting,用不到 1k 小时标注数据达到接近人类水平的 TTS 可懂度 (WER 2.3% vs human 2.2%)", "route": "Text → ByT5 encoder (frozen) → Position-Aware Cross-Attention → U-Audio Transformer (1D U-Net + Transformer) → EnCodec continuous latents → RVQ + EnCodec decoder → Waveform", "metrics": "Text-only WER 2.3% [Table 1]; Speaker-prompted WER 2.3%, SIM 0.617 [Fig 3]; VALL-E 对比 WER 5.9%, SIM 0.580 (用 62.5x 数据) [§1]; 训练仅 960h LibriSpeech [§5]", "takeaway": "(1) 非对称 Cauchy-Normal loss weighting 强化高噪声级学习,改善 text-speech alignment; (2) 在 EnCodec quantization 前建模连续 latent 避免信息损失 + 序列压缩 32x; (3) Position-aware cross-attention 中用 MLP 编码相对位置辅助对齐; (4) ByT5 作为 character-level text encoder 省去 phonemizer", "limitation": "仅在 LibriSpeech (朗读语音) 评估,未测对话/情感/多语言场景; 250 步采样推理慢; 无 MOS 主观评测; speaker similarity 0.617 低于 NS2/VoiceBox (但它们用 45-62x 数据)", "concepts": ["Diffusion-basedTTS", "DiffusionModel", "Classifier-FreeGuidance", "DurationPredictor", "ResidualVectorQuantization", "Non-autoregressiveTTS"], "source": "Sources/SESD.pdf", "github": "", "demo": ""}, {"name": "SoCodec", "title": "SoCodec: A Semantic-Ordered Multi-Stream Speech Codec for Efficient Language Model Based Text-to-Speech Synthesis", "arxiv_id": "2409.00933", "date": "2024-09", "venue": "SLT 2024", "org": "", "tier": "deep", "tags": ["speech-codec", "product-quantization", "ordered-representation", "multi-stream", "LM-TTS", "semantic-encoding", "zero-shot-TTS", "efficiency"], "summary": "提出有序积量化 (OPQ) 将语音压缩为有序多流语义 token 序列,配合 multi-stream delayed LM 实现 240ms frameshift (12x 压缩) 下仍优于 VALL-E 的 zero-shot TTS", "route": "Speech → HuBERT SSL Encoder → ResNet Downsampling → OPQ (grouped PQ + stream-wise nested dropout) → Ordered Multi-stream Semantic Tokens + ECAPA-TDNN Global Acoustic Embedding → ResNet Decoder → SSL Features + Mel → BigVGAN Vocoder → Waveform; TTS: Text (BPE 8192) + Ref Embedding → GPT-2 Multi-stream Delayed LM (12L, 1024d) → Speech Tokens → SoCodec Decoder → Audio", "metrics": "SoCodec-40 NMOS 3.83/SMOS 3.91/CER 2.37%/SIM 85.17 (vs VALL-E NMOS 3.40/SMOS 2.73/CER 10.69%/SIM 72.45); SoCodec-120 NMOS 3.98/SMOS 3.78/CER 2.57%/RTF 0.22; SoCodec-240 NMOS 3.77/SMOS 3.47/CER 3.01%/RTF 0.16 [Table 1]; OPQ vs PQ TTS w/ SS CER: 120ms 2.57 vs 3.76, 240ms 3.01 vs 5.25 [Fig 5]; 数据集 WenetSpeech4TTS Basic 7226h", "takeaway": "(1) Ordered Product Quantization: grouped PQ + stream-wise nested dropout 强制低流编码主成分信息,可迁移到任何多流 codec; (2) Clip&Shuffle: 截取 25-75% 片段 → 切 1s slice → 随机打乱,简单有效地防止 acoustic encoder 编码 content 信息,无需对抗训练; (3) OPQ 使 delay=1 即可获得良好 TTS 效果,更大 delay 无显著收益,说明有序表示大幅降低了 multi-stream LM 对 delay 步数的依赖", "limitation": "仅在中文 (WenetSpeech4TTS) 上验证,跨语言泛化未知; 未报告 bitrate (codebook 128x8, frameshift 可变,估算 120ms 约 1.17 kbps); BigVGAN vocoder 非端到端联合训练; 仅 12L GPT-2 (约 100-200M),未探索更大 LM; MOS 测试仅 10 名评估者,100 条测试集较小", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "ResidualVectorQuantization", "CodecTrainingObjectives", "AudioTokenizerTaxonomy", "SpeechFactorization", "CodecLanguageModel", "TokenRateandBitrateTrade-offs", "Single-codebookvsMulti-codebook"], "source": "Sources/SoCodec.pdf", "github": "", "demo": ""}, {"name": "SongCreator", "title": "SongCreator: Lyrics-based Universal Song Generation", "arxiv_id": "2409.06029", "date": "2024-09", "venue": "NeurIPS 2024", "org": "", "tier": "deep", "tags": ["song-generation", "lyrics-to-song", "singing-voice", "dual-sequence-LM", "attention-mask", "multi-task", "editing", "accompaniment"], "summary": "提出双序列语言模型 (DSLM) 将歌声与伴奏作为两条交互序列建模,配合注意力掩码策略实现单系统完成 8 种歌曲生成/编辑任务", "route": "Lyrics → [Lyrics Encoder] → [DSLM: Vocal Decoder + Accompaniment Decoder (BCA 交互) → Song Decoder (非自回归融合)] → Semantic tokens → [LDM (VAE + U-Net Diffusion)] → 44.1kHz Song", "metrics": "Lyrics-to-song FAD 2.14 / Musicality MOS 4.25 (vs GT 4.3); Lyrics-to-vocals Musicality MOS 3.98 (vs GT 3.89); AB test 60% preferred over Jukebox [Table 3, 4, 15]", "takeaway": "(1) BCA 模块让双序列 LM 的两条 token 流实时交互信息; (2) 注意力掩码策略 (BR/A2V/V2A/None x Causal/Non-causal) 用统一架构适配多种任务; (3) 20% BCA=None dropout 类似 CFG 避免过度依赖序列间交互", "limitation": "最长仅 30s 生成 (不支持完整歌曲结构); 无法通过文本描述控制风格/流派; BEST-RQ 对伴奏中歌声信息编码不充分导致清晰度受限; 未开源", "concepts": ["SingingVoiceSynthesis", "CodecLanguageModel", "SemanticvsAcousticTokens", "DiffusionModel", "Self-SupervisedSpeechRepresentation", "Classifier-FreeGuidance"], "source": "Sources/SongCreator.pdf", "github": "", "demo": ""}, {"name": "SpeechQualityEval", "title": "Enabling Auditory Large Language Models for Automatic Speech Quality Evaluation", "arxiv_id": "2409.16644", "date": "2024-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-quality-assessment", "auditory-LLM", "MOS-prediction", "speaker-similarity", "multimodal-LLM", "LoRA", "A/B-testing", "natural-language-description"], "summary": "用 LoRA 微调 auditory LLM (SALMONN/Qwen-Audio) + task-specific prompts,实现 MOS/SIM 预测、A/B 测试、NL 质量描述的多任务统一语音评估", "route": "音频 → audio encoder (BEATs+Whisper / Whisper-large-v2) → connection module (Q-Former / pooling) → frozen LLM (Vicuna / Qwen-7B) + LoRA → 文本输出 (分数 / 选择 / 描述)", "metrics": "MOS 预测 BVCC sys-level LCC 0.884 (vs SOTA 0.939); SIM 预测 VoxSim LCC 0.816 (vs SOTA 0.835); A/B 测试 acc 0.698 (MOS diff>0.5 时 0.803) [Table I-IV]", "takeaway": "dataset-specific prompt 策略提升跨数据集泛化; averaging multiple prompts 增强鲁棒性; 单一 LLM 模型统一多种评估任务的可行性验证", "limitation": "A/B 测试整体准确率 <70% 不够实用; NL 描述缺乏专用训练数据导致输出单调; Qwen-Audio 系列在 MOS/SIM 上显著弱于 SALMONN; 无 CoT 推理能力,后续工作 (GSRM/SpeechJudge/UniSRM) 已大幅超越", "concepts": ["TTSEvaluation", "SpeakerEmbedding", "SpeakerVerification", "Self-SupervisedSpeechRepresentation", "AudioUnderstanding", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/SpeechQualityEval.pdf", "github": "", "demo": ""}, {"name": "StableForm-TTS", "title": "Improving Robustness of Diffusion-Based Zero-Shot Speech Synthesis via Stable Formant Generation", "arxiv_id": "2409.09311", "date": "2024-09", "venue": "arXiv (ICASSP format)", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "zero-shot", "source-filter", "formant", "robustness", "pronunciation"], "summary": "首次将 source-filter theory 引入 diffusion TTS,将 mel spectrogram 分解为 excitation 和 formant 两路,仅对 excitation 施加扩散,formant 直接生成以保护发音稳定性", "route": "Phonemes → Text Encoder (SALN) → Decomposed Variance Adaptor (pitch/energy → excitation path; content → formant path) → E-F Generators → Score-based Diffusion (仅 excitation) → X'_E + X_F = 合成 Mel → HiFi-GAN vocoder", "metrics": "CER 1.44 vs 2.73 (GSS, LT-460, VCTK) [Table I]; 放大到 69M/19K h 后 CER 0.52 (接近 Tortoise 0.44, 参数量仅 1/14) [Table III]", "takeaway": "(1) 将生成模型仅施加于需要多样性的路径 (excitation/韵律),确定性内容 (formant) 用非随机路径直接生成; (2) 用 CER ratio 可视化诊断扩散步数对发音鲁棒性的影响", "limitation": "基于 Grad-StyleSpeech (非自回归, ~35M 参数),与当前 LLM-based 零样本 TTS SOTA 差距大; SECS 略低于 baseline; 未在 SEED-TTS-Eval 等标准 benchmark 评估; 未开源模型权重", "concepts": ["Diffusion-basedTTS", "ScoreMatching", "SpeechFactorization", "Non-autoregressiveTTS", "F0Modeling", "ProsodyModeling", "MelSpectrogram", "DurationPredictor"], "source": "Sources/StableForm-TTS.pdf", "github": "", "demo": ""}, {"name": "TITW", "title": "Text-To-Speech Synthesis In The Wild", "arxiv_id": "2409.08711", "date": "2024-09", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "dataset", "noisy-training", "data-pipeline", "in-the-wild", "deepfake-detection", "benchmark", "VoxCeleb"], "summary": "首个公开的标准化 noisy-TTS 训练数据集,基于 VoxCeleb1 构建,提供两级难度 (Easy/Hard) + 标准化评估协议,同时支持 deepfake detection 研究", "route": "VoxCeleb1 原始音频 → WhisperX 转录+分割 → 启发式数据筛选 → TITW-Hard (189h); → DEMUCS 增强 + DNSMOS 过滤 → TITW-Easy (173h)", "metrics": "TITW-Easy DNSMOS 2.78 / UTMOS 3.32 / WER 9.1%; MQTTS 在 Easy 上达到 UTMOS 3.08 (KSKT) 和 3.20 (KSUT); TITW-Hard 上多数模型训练失败或严重退化 [Table 2, Table 3, Table 4]", "takeaway": "(1) 分级数据集设计思路 — 用\"当前能 work\" vs \"留给未来\"的分层推动社区迭代; (2) 基于 DNSMOS 阈值的自动数据筛选策略; (3) 选择 speaker recognition 数据集作为 TTS 源数据的 dual-use 设计思路", "limitation": "仅英语单语; TITW-Hard 上当前所有模型表现极差,缺少如何改进的具体方案; 数据规模 (189h) 远小于 Emilia (101K+ h),不适合大规模训练; 评估仅用自动指标,无 MOS 人工评测", "concepts": ["TTSEvaluation", "NeuralVocoder", "SpeakerEmbedding", "Anti-spoofingandDeepfakeDetection", "SpeakerVerification", "Text-to-SpeechPipeline"], "source": "Sources/TITW.pdf", "github": "", "demo": ""}, {"name": "LSLM", "title": "Language Model Can Listen While Speaking", "arxiv_id": "2408.02622", "date": "2024-08", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["full-duplex", "speech-LM", "turn-taking", "interactive", "streaming", "decoder-only-TTS", "SSL", "fusion"], "summary": "首个系统探索端到端\"边说边听\"的 speech language model,通过 middle fusion 将 streaming SSL 监听通道融入 AR TTS 生成,实现实时 turn-taking", "route": "Text → Decoder-only Transformer (106M) → 离散 speech tokens → Vocoder; 同时 Streaming vq-wav2vec encoder → Projection → 融合到 Transformer 各层", "metrics": "Command-FDM: WER 4.05%, F1 98.00% (clean); Voice-FDM: WER 5.33%, F1 95.50% (clean) [Table 2, 3]", "takeaway": "(1) Middle fusion 策略 -- 在每个 Transformer block 注入监听信号,平衡生成质量与交互能力; (2) IRQ token 机制 -- 用特殊 token 实现端到端 turn-taking,无需外部 VAD; (3) 形式化 FDM loss (Eq. 3) 将全双工建模统一为条件语言建模", "limitation": "仅 106M 参数,训练于 LibriTTS 585h,未在真实对话数据上验证; 未实现 speech-in speech-out 对话 (输入是 text→TTS,不是真正的口语对话); 未开源模型权重", "concepts": ["Full-duplexSpokenDialogue", "Turn-takinginSpokenDialogue", "SpeechLanguageModel", "StreamingSpokenDialogue", "Self-SupervisedSpeechRepresentation", "LLM-basedTTS"], "source": "Sources/LSLM.pdf", "github": "", "demo": ""}, {"name": "PeriodWave", "title": "PeriodWave", "arxiv_id": "2408.07547", "date": "2024-08", "venue": "arXiv preprint (under review)", "org": "", "tier": "deep", "tags": ["vocoder", "flow-matching", "waveform-generation", "multi-period", "DWT", "high-fidelity", "universal-vocoder", "ODE"], "summary": "首个将 flow matching 成功应用于波形生成的 vocoder,通过 multi-period reshaping 显式编码不同周期特征,在 pitch/periodicity 指标上大幅超越 GAN baseline,且仅需 3 天训练", "route": "Mel-spectrogram → ConvNeXt V2 Mel Encoder → [Periodify(reshape 1D→2D, periods=[1,2,3,5,7]) → Period-aware UNet(2D conv) → Reshape 2D→1D → Sum] → Final Block → ODE solver(Midpoint, 16 steps) → Waveform", "metrics": "LibriTTS: PESQ 4.248 / Periodicity 0.0765 / V/UV F1 0.9651 / MOS 3.95 (vs BigVGAN PESQ 4.027 / Periodicity 0.1018 / MOS 3.92); LJSpeech: UTMOS 4.3578 (vs BigVGAN 4.2172) [Table 1, Table 2]", "takeaway": "(1) Periodify: 将 1D 信号 reshape 为 2D 用质数 period 避免重叠,让 2D conv 捕获周期结构 — 可迁移到任何处理周期信号的生成模型; (2) DWT 多频带建模替代 MBD 的频带分割,无损信息解耦; (3) FreeU 技巧: 缩放 skip connection (alpha=0.9) + 放大 backbone (beta=1.1) 降低高频噪声; (4) Energy-based prior + temperature scaling 稳定 flow matching 在高维波形上的训练", "limitation": "推理速度慢于 GAN (16 步 Midpoint: 7.48x 实时, vs HiFi-GAN 166x); M-STFT 指标不如 GAN (仅优化向量场 loss,未加频谱 loss); Snake activation 训练不稳定未能整合; 高频建模仍有改进空间", "concepts": ["ConditionalFlowMatching", "NeuralVocoder", "Diffusion-basedVocoder", "SnakeActivation", "Multi-scaleSTFTDiscriminator", "F0Modeling"], "source": "Sources/PeriodWave.pdf", "github": "", "demo": ""}, {"name": "SSLSuprasegmentalAnalysis", "title": "SSL Suprasegmental Analysis", "arxiv_id": "2408.13678", "date": "2024-08", "venue": "arXiv 2024 (Stanford University)", "org": "", "tier": "deep", "tags": ["self-supervised-learning", "probing", "suprasegmentals", "stress", "tone", "accent", "wav2vec2", "HuBERT"], "summary": "首次系统对比英文/中文 SSL 语音模型 (wav2vec 2.0, HuBERT, WavLM) 对超音段特征 (stress, tone, accent) 的 layer-wise 表征能力,发现超音段表征在中间层最强且是抽象的 (非直接 F0 追踪)", "route": "语音 → SSL 模型 (12 层 Transformer) → 各层 embedding → 线性 probe (分类/回归) → 逐层 F1/R-squared 分析", "metrics": "stress/tone 最佳层在 8-9 层 (中间偏深); 英文模型 stress F1 ~0.75; Mandarin 模型 tone F1 ~0.55; F0 regression R² 在各层波动且与超音段 peak 不重合 [Fig 1-3]", "takeaway": "(1) 超音段表征是抽象语言学特征而非简单声学追踪; (2) 语言特异性表征仅在 context network 中出现 (非 CNN 层); (3) ASR fine-tuning 增强词级韵律表征 (stress, tone) 但对短语级 accent 效果弱", "limitation": "仅 12 层 BASE 模型; 仅 linear probe (无非线性); 英文 Switchboard (对话) vs 中文 GTMC (朗读) 域不匹配; 无多语言预训练模型对比", "concepts": ["ProsodyModeling", "Self-SupervisedSpeechRepresentation"], "source": "Sources/SSLSuprasegmentalAnalysis.pdf", "github": "", "demo": ""}, {"name": "SaSLaW", "title": "SaSLaW: Dialogue Speech Corpus with Audio-visual Egocentric Information Toward Environment-adaptive Speech Synthesis", "arxiv_id": "2408.06858", "date": "2024-08", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "corpus", "dialogue", "Lombard-effect", "entrainment", "environment-adaptive", "speech-chain", "prosody"], "summary": "构建了首个包含对话者第一人称听觉+视觉同步记录的自发对话语料库 SaSLaW,验证了将 hearing audio 作为环境条件输入的 EA-TTS 模型能生成适应噪声环境的语音", "route": "Text + Hearing Audio → FastSpeech 2 (Encoder-Decoder) + GST Style-Token Layer + Env-to-style Predictor → Mel Spectrogram → HiFi-GAN → Waveform", "metrics": "AB preference test 显示 FS2-predsty/FS2-predsty-ptrn 在 noisy 环境下显著优于 vanilla FS2 [Fig 6]; 客观评估显示 EA-TTS 模型的合成语音 RMS/F1/spectral tilt 随噪声等级变化 [Fig 5]", "takeaway": "(1) 用 loudspeaker 阵列+真实噪声数据模拟扩散噪声环境的录制方法; (2) 收集脉冲响应(IR)+环境噪声以构建可复现的主观评估样本; (3) 用信号处理合成的伪环境自适应数据做预训练以增强小数据下的泛化", "limitation": "语料规模极小(4对说话人, ~30min/pair); 仅日语; 未探索视觉信息的建模; 安静环境下 EA-TTS 反而比 vanilla FS2 差; 无 MOS 绝对分数报告", "concepts": ["GlobalStyleTokens", "ProsodyModeling", "StyleTransferinTTS", "F0Modeling", "NeuralVocoder"], "source": "Sources/SaSLaW.pdf", "github": "", "demo": ""}, {"name": "SimpleSpeech2", "title": "SimpleSpeech 2: Towards Simple and Efficient Text-to-Speech with Flow-based Scalar Latent Transformer Diffusion Models", "arxiv_id": "2408.13893", "date": "2024-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "non-autoregressive", "flow-matching", "scalar-quantization", "speech-tokenizer", "sentence-duration", "diffusion-transformer"], "summary": "用 scalar quantization codec (SQ-Codec) 将语音压缩到有限紧凑的标量空间,再用 flow-based diffusion transformer 在该空间生成,结合 sentence-level duration 控制实现简单高效的 NAR TTS。", "route": "Text → ByT5 encoder → [Timbre&Style from FACodec] → Flow-based Scalar Transformer Diffusion (LLAMA-style, Time-MoE) → SQ-Codec Decoder → Waveform", "metrics": "MOS 4.28 (vs GT 3.96), WER 7.55% (Whisper+HuBERT avg), SIM 0.93, RTF 0.25 (25 steps) [Table III]; SQ-Codec PESQ 4.16, STOI 0.95 [Table II]", "takeaway": "(1) Scalar quantization 思路: 用 tanh + round 将连续特征映射到有限离散空间,既保证重建质量又压缩 diffusion 搜索空间; (2) Time-MoE: 按时间步分段使用不同 denoising expert; (3) Noisy label ≈ CFG 的理论分析可为大规模 ASR 数据训练 TTS 提供理论依据; (4) Sentence-level duration 足以控制 NAR TTS 语音长度", "limitation": "仅 7K 小时训练数据 (vs 60K+ 主流), speaker similarity 落后于大数据方案; 中文 WER 13.98% (高于 ChatTTS 8.88%); 未开源; 与 SeedTTS/E2TTS 等并发工作的差异化有限", "concepts": ["ConditionalFlowMatching", "FiniteScalarQuantization", "Non-autoregressiveTTS", "Classifier-FreeGuidance", "DurationPredictor", "SpeechTokenizer"], "source": "Sources/SimpleSpeech2.pdf", "github": "", "demo": ""}, {"name": "SpeechCraft", "title": "SpeechCraft: A Fine-grained Expressive Speech Dataset with Natural Language Description", "arxiv_id": "2408.13608", "date": "2024-08", "venue": "ACM MM 2024", "org": "", "tier": "deep", "tags": ["dataset", "TTS", "controllability", "style", "natural-language", "annotation", "expressive", "emphasis"], "summary": "提出自动语音标注系统(expert classifiers + fine-tuned LLaMA 2)和大规模双语表达性语音数据集 SpeechCraft(2000+ 小时, 8 维属性, 定制化 NL 描述),显著提升 expressive TTS 和 speech style captioning 性能", "route": "原始语音 → 信号处理工具(pitch/energy/speed) + wav2vec 2.0(gender/age) + Emotion2vec/SECap(emotion) + emphasis detector(word emphasis) → 属性标签 → fine-tuned LLaMA 2 定制化改写 → Description/Instruction 两版自然语言描述", "metrics": "ParlerTTS + SpeechCraft Mean_Acc 80.54%(vs TextrolSpeech 75.62%, +4.92 pp)[Table 5]; Salle 提升更大(69.59 vs 56.11, +13.48 pp); Instruction 版 emphasis Acc_s R@2 EN 90.96%, ZH 95.43% [Table 7]; Speech style captioning MOS 3.79(vs SECap 3.58)[§5.3]", "takeaway": "(1) Description vs Instruction 两版 prompt 设计 --- transcript 嵌入描述实现细粒度(word-level emphasis)控制而不损失全局风格控制; (2) LLM 定制化改写替代模板填充的数据构建范式; (3) 用 FastSpeech 2 variance adaptor 合成 emphasis 数据的巧妙 bootstrapping 策略", "limitation": "(1) emphasis 数据为 TTS 合成而非真实录音,real-life emphasis 检测精度仅 41.63% sentence-level; (2) 情感标注 EN 用 Emotion2vec(分类), ZH 用 SECap(caption),标注体系不一致; (3) Audiobox 的人工标注数据未开源无法对比; (4) 数据开源但 emphasis 检测模型细节在 supplementary",
