 "concepts": ["NaturalLanguageDescriptionforTTS", "ProsodyModeling", "StyleTransferinTTS", "EmotionControlinTTS", "SpeechFactorization", "CodecLanguageModel"], "source": "Sources/SpeechCraft.pdf", "github": "", "demo": ""}, {"name": "VoxInstruct", "title": "VoxInstruct: Expressive Human Instruction-to-Speech Generation with Unified Multilingual Codec Language Modelling", "arxiv_id": "2408.15676", "date": "2024-08", "venue": "ACM MM 2024", "org": "", "tier": "deep", "tags": ["instruction-to-speech", "codec-LM", "multilingual", "CFG", "semantic-token", "LLaMA", "expressive-TTS", "voice-cloning"], "summary": "提出首个统一的多语言 instruction-to-speech 框架,用一条自然语言指令同时传达内容和风格,通过 semantic token 中间表征 + 多重 CFG 策略替代传统的 content/description 分离输入 [§1]", "route": "Instruction Text → MT5 Encoder (with LoRA) → Text Embedding → AR LLaMA (Stage I: →Language ID + Semantic Tokens; Stage II: →Coarse AT Q1) → NAR LLaMA (Stage III: →Fine AT Q2-Q8) → Vocos Decoder → Waveform [§4.1-4.2, Fig 2]", "metrics": "EN MOS-Q 4.22 / MOS-I 3.76, WER 2.5%, attribute accuracy 80.54% [Table 2]; stress Acc_word 88.29% / Acc_sentence 87.17% [Table 4]; voice cloning MOS-Q 4.06 / MOS-S 4.01 (mono, vs VALL-E 3.48/3.99) [Table 5]", "takeaway": "(1) Semantic token 做 instruction-to-content 桥梁: 去除连续重复 token 后的 HuBERT ST 序列让模型先\"理解\"要说什么再生成声学细节,去掉 ST 后 WER 从 3.0 骤升到 26.2 [Table 6]; (2) 多重 CFG 在 codec LM 中的应用: 对 instruction→ST 和 instruction/ST→AT 分别做 CFG,各自增强不同维度的控制力 [§4.3]; (3) 渐进式 fine-tuning: pre-train (transcript-only) → fine-tune (instruction) → fine-grained fine-tune (stress) 三阶段逐步解锁控制粒度 [§4.4]", "limitation": "(1) Emotion accuracy 仅 59.81%,是所有属性中最低的,论文未深入分析原因 [Table 2]; (2) 训练数据中 instruction-speech 对仅 2.4K 小时,fine-grained 仅 200 小时,规模较小; (3) 仅支持英文和中文; (4) 论文发表于 2024 年,其 WER 2.5% 和 MOS 4.22 已被后续系统 (如 CosyVoice2, Seed-TTS) 超越", "concepts": ["Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "LLM-basedTTS", "SpeechTokenizer", "CodecLanguageModel", "Classifier-FreeGuidance"], "source": "Sources/VoxInstruct.pdf", "github": "", "demo": ""}, {"name": "WavTokenizer", "title": "WavTokenizer: An Efficient Acoustic Discrete Codec Tokenizer for Audio Language Modeling", "arxiv_id": "2408.16532", "date": "2024-08", "venue": "ICLR 2025", "org": "", "tier": "deep", "tags": ["audio-codec", "single-codebook", "VQ", "extreme-compression", "semantic-richness", "iSTFT-decoder", "attention-decoder"], "summary": "通过扩展 VQ 空间 + iSTFT 解码器 + attention + 多尺度判别器,实现单 quantizer 仅 40/75 tokens/s 的极端压缩,同时保持 SOTA 主观重建质量和语义丰富度", "route": "Raw audio → CNN encoder (stride 320x/600x) → Single VQ (K=4096) → Attention + ConvNeXt + iSTFT decoder → Reconstructed audio", "metrics": "UTMOS 4.05 (75 tok/s) vs DAC 3.91 (900 tok/s) on LibriTTS test-clean [Table 1]; MUSHRA 96.1 vs DAC 92.8 [Table 2]; TTS WER 5.1% vs DAC 6.9% [Table 12]", "takeaway": "(1) 大码本 (4096) + k-means init + random awakening 策略可在单码本下维持高利用率; (2) iSTFT decoder 消除 aliasing artifacts; (3) decoder 中加 attention 同时提升重建和语义,训练窗口扩展到 3s", "limitation": "缺乏 ASR 级语义理解能力; 未验证在超大规模数据 (>8K h) 和大型多模态模型上的表现; PESQ/STOI 不如高比特率 RVQ 模型; 语义丰富度的论证主要依赖分类 accuracy (ARCH),未验证 ASR WER 等更直接的语义指标", "concepts": ["ResidualVectorQuantization", "Single-codebookvsMulti-codebook", "CodebookCollapse", "Multi-scaleSTFTDiscriminator", "SemanticvsAcousticTokens", "TokenRateandBitrateTrade-offs", "CodecTrainingObjectives", "AudioTokenizerTaxonomy"], "source": "Sources/WavTokenizer.pdf", "github": "", "demo": ""}, {"name": "CosyVoice", "title": "CosyVoice: A Scalable Multilingual Zero-shot Text-to-speech Synthesizer based on Supervised Semantic Tokens", "arxiv_id": "2407.05407", "date": "2024-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "LLM-based", "flow-matching", "supervised-token", "multilingual", "coarse-to-fine", "voice-cloning"], "summary": "首次将 ASR 监督训练的 semantic tokens 引入 TTS,配合 LLM + OT-CFM 两阶段架构实现可扩展的多语言零样本语音合成", "route": "Text → BPE + TextEncoder → [S, x-vec, text_enc, T, speech_tokens, E] → LLM (AR) → speech tokens → OT-CFM (+ speaker emb + masked mel) → Mel → HiFi-GAN → Waveform", "metrics": "LibriTTS WER 3.17% / SS 69.49 (大规模); 英文 WER 2.89% 接近人类 (2.66%); 中文 SS 81.58 超原始录音 (74.15) [Table 7-9]", "takeaway": "(1) 在 ASR encoder 中间插入 VQ 层获取监督 semantic tokens,几乎不影响 ASR 性能; (2) x-vector 分离说话人建模,让 LLM 专注语义+韵律、CFM 专注音色+环境; (3) OT-CFM + cosine scheduler + CFG 的组合方案", "limitation": "(1) 对 VQ 层插入位置和 codebook 大小未做充分消融; (2) 跨语言场景需省略 prompt 文本/token 来避免韵律泄露,但信息损失不可避免; (3) 指令微调数据规模有限(556h); (4) 已开源但论文未报 MOS", "concepts": ["SpeechTokenizer", "ConditionalFlowMatching", "LLM-basedTTS", "Classifier-FreeGuidance", "SpeakerEmbedding", "SemanticvsAcousticTokens"], "source": "Sources/CosyVoice.pdf", "github": "", "demo": ""}, {"name": "Emilia", "title": "Emilia: An Extensive, Multilingual, and Diverse Speech Dataset for Large-Scale Speech Generation", "arxiv_id": "2407.05361", "date": "2024-07", "venue": "IEEE SLT 2024", "org": "", "tier": "deep", "tags": ["dataset", "large-scale", "multilingual", "in-the-wild", "speech-generation", "TTS", "preprocessing-pipeline", "open-source"], "summary": "首个大规模、多语言、多样化的开源 in-the-wild 语音数据集 (101K+ 小时, 6 语种) + 首个开源预处理 pipeline (Emilia-Pipe),专为训练自然、自发的语音生成模型设计", "route": "In-the-wild 音频 → Standardization (24kHz, mono, -20dBFS) → Source Separation (UVR-MDX-Net) → Speaker Diarization (pyannote) → VAD 细粒度切分 (Silero-VAD, 3-30s) → ASR (WhisperX) → Quality Filtering (语种/DNSMOS/duration) → 标注数据", "metrics": "处理后 DNSMOS P.835 OVRL 3.26 (vs MLS 3.33); Emilia-Test AR WER 6.6% + SIM-O 0.618 + FSD 12.73 (vs MLS-trained: WER 8.4% + SIM-O 0.577 + FSD 24.73); 多语种 TTS 6 语种均有效 [Table 4, 5]", "takeaway": "(1) 完整的 in-the-wild 音频预处理 pipeline 开源可复用; (2) DNSMOS P.835 OVRL ≥ 3.0 作为自动质量筛选阈值; (3) 双 ASR 信心 + duration outlier 过滤策略; (4) 处理速度 2.5h/min — 大规模数据处理方案", "limitation": "无人工转写(全 ASR 标注); 无细粒度标签(情感/风格/韵律); 24kHz 采样率 (非 44.1kHz); 部分语种规模偏小 (德/法/日/韩 各 ~1-2K h)", "concepts": ["SpeechTokenizer", "Self-SupervisedSpeechRepresentation"], "source": "Sources/Emilia.pdf", "github": "", "demo": ""}, {"name": "EmoCtrl-TTS", "title": "Laugh Now Cry Later: Controlling Time-Varying Emotional States of Flow-Matching-Based Zero-Shot Text-to-Speech", "arxiv_id": "2407.12229", "date": "2024-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "zero-shot", "flow-matching", "nonverbal-vocalizations", "speech-to-speech-translation", "arousal-valence", "laughter-generation"], "summary": "在 flow-matching zero-shot TTS 上叠加帧级 arousal-valence + laughter-detector embedding,用 27k 小时真实情感数据训练,实现任意说话人的时变情感语音合成 (含笑声、哭泣等 NV)", "route": "文本 → phoneme embedding + 情感 prompt → arousal-valence extractor → emotion embedding + NV prompt → laughter detector → NV embedding → [phoneme + emotion + NV] 条件 flow-matching audio model (Transformer 24L) → mel spectrogram → MelGAN vocoder → waveform", "metrics": "JVNV S2ST: Emo SIM 0.697, Aro-Val SIM 0.643, SIM-o 0.497 (超越 ELaTE 0.671/0.548/0.441); Laughter-test: Emo SIM 0.848 (ELaTE 0.806); Crying-test: Aro-Val SIM 0.597 (ELaTE 0.471) [Table 3/6/7]", "takeaway": "(1) laughter detector embedding 意外能泛化到哭泣等其他 NV 类型 -- 单一检测器跨 NV 复用; (2) 数据策略: emotion2vec 伪标签 + DNSMOS 质量过滤 + speaker change detection 清洗出 27k 小时数据; (3) 分数据源用不同条件 embedding (IH-EMO 只用 emotion, LAUGH 只用 NV) 避免负面交互", "limitation": "未开源; WER 有中度退化 (EmoCtrl-TTS 3.2% vs Voicebox 2.1%); 仅英语; 数据为 Microsoft 内部匿名数据无法复现; 主观评测 NMOS/EMOS 与 ELaTE 相近,优势主要在客观指标", "concepts": ["ConditionalFlowMatching", "EmotionControlinTTS", "Classifier-FreeGuidance", "ProsodyModeling", "MelSpectrogram", "StyleTransferinTTS", "SpeakerEmbedding", "Self-SupervisedSpeechRepresentation"], "source": "Sources/EmoCtrl-TTS.pdf", "github": "", "demo": ""}, {"name": "FunAudioLLM", "title": "FunAudioLLM: Voice Understanding and Generation Foundation Models for Natural Interaction Between Humans and LLMs", "arxiv_id": "2407.04051", "date": "2024-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "ASR", "TTS", "SER", "AED", "multilingual", "zero-shot", "voice-cloning"], "summary": "阿里巴巴通义语音的双基座框架 — SenseVoice (语音理解: ASR/SER/AED/LID,5x faster than Whisper-small) + CosyVoice (语音生成: 零样本多语言 TTS + 指令跟随),通过 S^3 supervised semantic tokenizer 连接理解与生成 [§Abstract]", "route": "理解: Speech → Feature Extractor → SAN-M Encoder (Small) / Transformer Encoder-Decoder (Large) → [concat(e_LID, e_SER, e_AEC, e_ITN, X_speech)] → CTC/CE Loss → ASR+SER+AED+LID [§2.2, Fig 2]; 生成: Text → Text Tokenizer → [S, x-vec, text, speech_tokens] → AR Transformer LM → Speech Tokens → OT-CFM (+speaker emb +ref mel) → Mel → HiFTNet → Waveform [§2.4, Fig 4]", "metrics": "SenseVoice-S: RTF 0.007, 5x faster than Whisper-small, 15x faster than Whisper-large [Table 7]; ASR: CER 2.09 AISHELL-1 / 7.68 CommonVoice zh (best) [Table 6]; SER: WA 96.0/93.2/73.9 CREMA-D/ESD/IEMOCAP (SenseVoice-L best or near-best) [Table 8]; CosyVoice: WER 2.89±0.18 (LibriTTS) / CER 3.82±0.24 (AISHELL-3), SS 74.30/81.58 [Table 10-11]", "takeaway": "(1) Supervised semantic speech tokenizer (S^3): 在 ASR encoder 第 6 层后插入 VQ,用 ASR loss 监督,tokens 天然编码语义+副语言信息 (50Hz → single codebook 4096) [§2.3, Fig 3]; (2) SenseVoice-Small 的非自回归 multi-task 设计: 4 个 task embedding prepend + SAN-M encoder + CTC,实现极低延迟 [§2.2]; (3) Cross-lingual voice cloning: 跨语言时省略 prompt text 和 speech tokens,仅用 speaker embedding + LID,防止源语言韵律泄露 [§2.4.3, Fig 5]; (4) Rich transcription: SER/AED/LID/ITN 全部作为伪标签 (150M AED + 30M SER entries) 自动标注训练数据 [§3.1]", "limitation": "(1) SenseVoice 不支持 streaming [§6]; (2) CosyVoice 仅支持 5 语言 [§6]; (3) 情感控制依赖显式指令,不能从文本语义推断情感 [§6]; (4) 唱歌任务表现差 [§6]; (5) SenseVoice 和 CosyVoice 未端到端联合训练,pipeline 可能引入错误传播 [§6]", "concepts": ["SpeechTokenizer", "ConditionalFlowMatching", "LLM-basedTTS", "Self-SupervisedSpeechRepresentation", "AudioUnderstanding", "EmotionControlinTTS", "SpeakerEmbedding", "Instruction-GuidedSpeechSynthesis"], "source": "Sources/FunAudioLLM.pdf", "github": "", "demo": ""}, {"name": "GPT-Talker", "title": "GPT-Talker: Generative Expressive Conversational Speech Synthesis", "arxiv_id": "2407.21491", "date": "2024-07", "venue": "ACM MM 2024", "org": "", "tier": "deep", "tags": ["TTS", "conversational-speech-synthesis", "GPT-based", "multimodal-context", "semantic-style-token", "dataset", "HuBERT", "VITS"], "summary": "首次将 GPT 引入 CSS,将多轮多模态对话上下文序列化为 discrete tokens,通过 next-token prediction 预测 agent 回复的语义+风格 token 序列,配合 ConVITS 合成表达性对话语音;同时发布 236h 中英双语自然对话数据集 NCSSD", "route": "多模态对话历史 (text + audio) → phoneme tokenization + HuBERT-VQ tokenization → 交替排列为统一序列 → ConGPT (24层 Transformer) AR 预测 → semantic+style token 序列 → ConVITS (text encoder + token encoder + cross-attention + timbre encoder + VITS decoder) → 语音波形", "metrics": "N-DMOS 3.890 / E-DMOS 3.908 (DailyTalk); DTWD 42.125 / SSIM 0.882 — 全面超越 ECSS (3.597/3.585/64.564/0.749) 和 FCTalker (3.405/3.537/65.241/0.741) [Table 3]", "takeaway": "(1) 将 CSS 上下文建模统一为序列化 GPT 问题,极大简化架构; (2) ABAB 交替排列 text+audio tokens 优于 AABB 顺序排列 (Table 3 ablation); (3) 三阶段训练策略: 单句预训练→Collection 子集微调→Recording 子集精调; (4) NCSSD 自动化数据构建 pipeline 可复用", "limitation": "(1) 仅支持 N=3 轮对话,更长历史 (N=4) 性能显著下降; (2) 英文录制部分非母语者,表现力可能受限; (3) 视觉模态数据未利用; (4) ConGPT 和 ConVITS 分开训练,非端到端优化", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "CodecLanguageModel", "StyleTransferinTTS"], "source": "Sources/GPT-Talker.pdf", "github": "", "demo": ""}, {"name": "J-CHAT", "title": "J-CHAT: Japanese Large-scale Spoken Dialogue Corpus for Spoken Dialogue Language Modeling", "arxiv_id": "2407.15828", "date": "2024-07", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-dataset", "spoken-dialogue", "corpus-construction", "dGSLM", "Japanese", "spontaneous-speech", "speech-LM"], "summary": "提出自动化方法构建 76k 小时日语对话语料库 J-CHAT,验证多数据源多样性(而非纯规模)对 dGSLM 性能的关键作用", "route": "YouTube/Podcast 音频 → Whisper 语言识别 → PyAnnote 说话人分段 → 对话提取 (5s gap 切分 + 80% 单人过滤) → Demucs 降噪 → ASR 转录", "metrics": "dGSLM-J-CHAT 自然度 MOS 2.28/意义度 MOS 2.18 (60 人主观评测); NISQA 音质分 Podcast 2.99 / YouTube 2.37 (vs STUDIES 4.01, CallHome-JP 1.98) [Table 3, §4.2]", "takeaway": "多源混合训练(YouTube+Podcast)比单源 4x 规模更有效; 自动化对话提取 pipeline 可复用到其他语言", "limitation": "dGSLM 生成质量仍远低于 resynthesis 上界; 仅日语验证; 无 turn-taking 统计评估; MOS 绝对值偏低 (2.28 vs resynthesis 2.55)", "concepts": ["SpeechLanguageModel", "Full-duplexSpokenDialogue", "SpeechTokenizer", "SpokenDialogueEvaluation"], "source": "Sources/J-CHAT.pdf", "github": "", "demo": ""}, {"name": "MELLE", "title": "MELLE: Autoregressive Speech Synthesis without Vector Quantization", "arxiv_id": "2407.08551", "date": "2024-07", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "autoregressive", "continuous-token", "mel-spectrogram", "variational-inference", "LLM-TTS", "codec-free"], "summary": "首个在连续 mel-spectrogram 空间做自回归语言建模的零样本 TTS,通过 spectrogram flux loss + latent sampling module 替代离散 codec tokens,实现单阶段高效推理 [论文原文]", "route": "Text(BPE)→Pre-net→Transformer Decoder(AR prediction of mel frames)→Latent Sampling Module→Post-Net→HiFi-GAN→Waveform [Fig 1-2]", "metrics": "Continuation WER_H 1.98, SIM 0.508 (vs VALL-E WER_H 3.8, SIM 0.508); Cross-sentence WER_H 2.10, SIM 0.625; MOS 4.20 (vs GT 4.29, VALL-E 2 4.08); SMOS 4.40 (超越 GT 3.94); 推理 5.49s (vs VALL-E 7.32s, MELLE-R4 仅 1.40s) [Table 1, 3, 5]", "takeaway": "(1) Spectrogram flux loss 防止连续预测的 static/repetitive frames; (2) Latent sampling module 为连续 token AR 提供采样机制; (3) Reduction factor r 实现推理加速", "limitation": "(1) 依赖外部 HiFi-GAN vocoder (非端到端); (2) 仅英文评估; (3) 连续 mel 的 SIM 在 cross-sentence 上略低于 VALL-E 2", "concepts": ["MelSpectrogram", "VariationalAutoencoderforTTS", "LLM-basedTTS", "CodecLanguageModel", "NeuralVocoder", "ResidualVectorQuantization"], "source": "Sources/MELLE.pdf", "github": "", "demo": ""}, {"name": "Multi-ScaleAcousticPrompts", "title": "Spontaneous Style Text-to-Speech Synthesis with Controllable Spontaneous Behaviors Based on Language Models", "arxiv_id": "2407.13509", "date": "2024-07", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "spontaneous-speech", "language-model", "prosody-modeling", "spontaneous-behavior", "VALL-E", "Mandarin"], "summary": "在 VALL-E 骨干上增加显式自发行为编码器(19 类分类体系)+ 细粒度韵律提取/预测模块,使 LM-based TTS 能合成可控的自然自发式语音", "route": "Phoneme → Text Encoder + Syntactic-aware Behavior Encoder(L-embeddings）→ AR/NAR Acoustic Decoder → EnCodec Decoder → Waveform; 并行: Mel → Prosody Extractor → P-embeddings (训练); Text+L-emb → Prosody Predictor → P-embeddings (推理)", "metrics": "PN-MOS 4.09 / LN-MOS 4.05 (vs VALL-E 3.30/3.32); MCD 4.879 (vs 5.291); 预测标签 vs 手动标签仅差 6.8% 偏好率 [Table 1, Fig 4]", "takeaway": "(1) 句法位置感知的自发行为编码思路 — 同一标签在不同句法位置有不同韵律表现; (2) 三阶段渐进微调策略(先联合训练主模块 → 单独训练 predictor → 低 LR 联合精调); (3) 用 cross-attention 将行为标签作为 query、韵律表征作为 KV 来融合两类信息", "limitation": "仅 5.4 小时单人普通话语料; 仅 20 句主观评测; 无与 CosyVoice/Seed-TTS 等现代系统对比; 19 类分类体系可能语言特异; 未开源", "concepts": ["ProsodyModeling", "LLM-basedTTS", "CodecLanguageModel", "StyleTransferinTTS", "MelSpectrogram"], "source": "Sources/Multi-ScaleAcousticPrompts.pdf", "github": "", "demo": ""}, {"name": "Qwen2-Audio", "title": "Qwen2-Audio Technical Report", "arxiv_id": "2407.10759", "date": "2024-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-understanding", "multimodal", "LALM", "instruction-tuning", "DPO", "natural-language-prompt", "voice-chat"], "summary": "Qwen-Audio 的升级版,用自然语言 prompt 替代层次标签简化预训练,并通过 SFT+DPO 三阶段训练实现 voice chat / audio analysis 双模式无缝交互,在 AIR-Bench 上超越 Gemini-1.5-pro", "route": "Audio (16kHz) → 128-ch mel-spectrogram → Whisper-large-v3 encoder (冻结→微调) → Pooling (stride=2, ~40ms/frame) → Qwen-7B LLM → text response", "metrics": "LibriSpeech WER 1.6/3.6 (clean/other) [Table 2] | AIR-Bench chat 7.18/6.99/6.79/6.77 (speech/sound/music/mixed, GPT-4 eval) [Table 2] | CoVoST2 avg BLEU 35.6 (7 directions) [Table 2] | VocalSound ACC 93.92% [Table 2]", "takeaway": "(1) 用自然语言 prompt 替代 hierarchical tags 做多任务预训练,降低预训练-微调 gap; (2) voice chat + audio analysis 双模式联合训练,无需 system prompt 切换; (3) DPO 优化 factuality 和 behavior adherence", "limitation": "仅输出文本不输出语音; 技术报告内容较短 (7 页正文),架构和训练细节披露不足; 未公布预训练数据具体来源和规模; DPO 数据集未公开细节", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/AudioUnderstanding|Audio Understanding", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation", "概念库/Audio-LanguagePretraining|Audio-Language Pretraining", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy"], "source": "Sources/Qwen2-Audio.pdf", "github": "", "demo": ""}, {"name": "RIO", "title": "Robust Zero-Shot Text-to-Speech Synthesis with Reverse Inference Optimization", "arxiv_id": "2407.02243", "date": "2024-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["RLHF", "zero-shot-TTS", "robustness", "reverse-inference", "exposure-bias", "codec-LM", "VoiceCraft", "production-perception-consistency"], "summary": "提出 Reverse Inference Optimization (RIO),基于贝叶斯公式提出 \"合成语音应能反向推理出原始 prompt\" 的 Production-Perception Consistency (PPC) 准则,用于 RLHF 中自动选择正/负样本,无需人工标注或 pairwise 偏好数据 [论文原文]", "route": "Text + Prompt → VoiceCraft (forward TTS) → Synthesized speech; Synthesized speech → VoiceCraft (reverse inference) → Reconstructed prompt; 同时满足 forward MOS 好 + reverse inference 好 → positive sample → RLHF update", "metrics": "WER 3.4%, SIM 0.96, MOS 4.40, bad case ratio 1% (MOS) / 4% (WER), 接近 Ground-Truth (WER 1.3, MOS 4.48) [Table 2]; 830M: MOS 4.45, WER 1.7% [Fig 4]", "takeaway": "(1) reverse inference 作为自动质量判据,无需 reward model 或人工标注; (2) 不需要 pairwise preference data (vs DPO/SpeechAlign); (3) 仅需 ~150 正/负样本,训练 1 epoch (~10 min on A100)", "limitation": "(1) reverse inference 仅预测 3 秒 prompt,长 prompt 未验证; (2) 依赖 MOSNet 作为 discriminator,MOSNet 本身有偏差; (3) 仅在 VoiceCraft 上验证,未在 VALL-E/CosyVoice 等系统测试; (4) 代码基于 VoiceCraft,非主流 codec LM", "concepts": ["LLM-basedTTS", "ResidualVectorQuantization", "TTSEvaluation", "SemanticvsAcousticTokens"], "source": "Sources/RIO.pdf", "github": "", "demo": ""}, {"name": "Seed-ASR", "title": "Seed-ASR: Understanding Diverse Speech and Contexts with LLM-based Speech Recognition", "arxiv_id": "2407.04675", "date": "2024-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["ASR", "LLM-based-ASR", "AcLLM", "self-supervised-learning", "context-aware", "multilingual", "multi-dialect", "reinforcement-learning"], "summary": "字节跳动将 ASR 建模为\"音频条件化 LLM\"(AcLLM) 问题 — 2B 参数 conformer 编码器 (LUISE) 在 2000 万小时数据上做 SSL,连续表征送入数百亿参数 MoE LLM,经 SFT/Context-SFT/RL 四阶段训练,在中英文公开测试集上比 Whisper-large-v3/USM/Universal-1 降低 10-40% WER,在部分场景超过人类转录员 [§Abstract, §1]", "route": "Speech → Mel-filterbank → LUISE (2B conformer, SSL pretrained) → Continuous representations (40ms) → Converter (4-frame splicing + linear, → 160ms) → [Instruction + Contexts + Speech Repr] → MoE LLM (frozen, 10B+ params) → Text transcription [§3.1, Fig 2]", "metrics": "CN 公开集平均 CER 2.98% (vs Paraformer-large 4.07, Qwen-Audio 5.23) [Table 3]; CN 多域 WER 1.94% (vs E2E 3.68, -47%) [Table 4]; ML LibriSpeech test-clean 1.58%, test-other 2.84% [Table 11]; MLS en-US 4.14% (vs Whisper-v3 5.29, USM 7.0, Gemini-1.5-Pro 4.6) [Table 11]; 主观可理解性 4.86 vs 人类 4.61 [Table 8]", "takeaway": "(1) LUISE 的迭代 SSL 策略: 第一轮随机投影 codebook → 第二轮用第一轮编码器中间层 k-means 聚类做新 codebook,通过 CTC probing 选最佳语义层 (第 25/32 层) [§3.2, Fig 5]; (2) 冻结 LLM + 可学习 encoder/converter: 保留 LLM 语义知识不被 ASR 训练冲掉 [§3.3]; (3) Joint beam search + 声学剪枝: 先用无上下文分数过滤不合理候选,再做上下文融合打分,解决上下文引入的幻觉问题 [§3.4, Eq 1]; (4) Weighted WER 作为 RL reward: 关键词错误加权比普通 WER 更有效 [§3.5, Table 1]; (5) 长音频直接输入 LLM (不切段): 避免切段边界信息丢失和全局上下文断裂,WER 相对降低 8.8% [§3.6.2, Table 2]", "limitation": "(1) 闭源,模型和训练数据均不公开; (2) 仅做 ASR 单任务,不支持语音生成/翻译/情感识别等; (3) LUISE 2B + MoE LLM 10B+ 的推理成本极高,延迟数据未报告; (4) RL 阶段仅用数千小时高质量数据,可扩展性不明; (5) 中文方言 WER 仍为 19.09%,绝对值较高", "concepts": ["Self-SupervisedSpeechRepresentation", "LLM-enhancedASR", "SpeechLanguageModel", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/Seed-ASR.pdf", "github": "", "demo": ""}, {"name": "SpontaneousStyleTTS", "title": "Spontaneous Style Text-to-Speech Synthesis with Controllable Spontaneous Behaviors Based on Language Models", "arxiv_id": "2407.13509", "date": "2024-07", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "spontaneous-speech", "language-model", "prosody", "expressive-speech", "VALL-E", "behavior-modeling", "Mandarin"], "summary": "基于 VALL-E 的自发语音合成系统,通过句法感知的自发行为编码器(19 种行为)和细粒度韵律建模,显著提升自发语音的韵律自然度和行为自然度", "route": "音素序列 + 自发行为标签 + 句法结构 → 句法感知行为编码器(L-embeddings)→ 加到文本 embeddings; 参考音频 → 韵律提取器(P-embeddings)/ 推理时由 AR 韵律预测器生成 → 加到文本 embeddings → VALL-E AR/NAR decoder → EnCodec 解码 → 语音", "metrics": "PN-MOS 4.09 / LN-MOS 4.05 (vs VALL-E 3.30/3.32, vs FastSpeech 2 2.61/2.54); MCD 4.879 (vs VALL-E 5.291) [Table 1, 内部自发语料]", "takeaway": "(1) 句法位置信息辅助自发行为建模; (2) 多头注意力将行为标签与韵律表征耦合; (3) 三步渐进式微调策略(backbone → 行为+韵律提取 → 韵律预测+联合精调)", "limitation": "仅 5.4h 单人普通话数据; 无公开 MOS 基准可比; 未开源; 自发行为分类体系仅覆盖普通话", "concepts": ["ProsodyModeling", "LLM-basedTTS", "CodecLanguageModel"], "source": "Sources/SpontaneousStyleTTS.pdf", "github": "", "demo": ""}, {"name": "TTSDS", "title": "TTSDS - Text-to-Speech Distribution Score", "arxiv_id": "2407.12707", "date": "2024-07", "venue": "INTERSPEECH 2024", "org": "", "tier": "deep", "tags": ["TTS-evaluation", "benchmark", "distributional-metrics", "Wasserstein-distance", "objective-metrics", "MOS-correlation", "factor-analysis"], "summary": "首个将 TTS 评估从逐样本 MOS 推向分布级多因子评估的 benchmark,通过 Wasserstein 距离衡量合成语音在 5 个因子上与真实语音的分布差异,在 35 个跨时代 TTS 系统上实现 0.60-0.83 的 Spearman 相关", "route": "TTS 合成音频 → 5 因子 (Environment/Speaker/Prosody/Intelligibility/General) x 多特征 → 每个特征计算与真实语音和噪声的 Wasserstein-2 距离 → 归一化 0-100 分 → 因子均值 = TTSDS", "metrics": "Spearman ρ=0.60 (Blizzard'08 MOS) / 0.79 (BTTF MOS) / 0.83 (TTS Arena Elo); 每个数据集仅需 80-100 样本; 35 个 TTS 系统 (2008-2024) [Fig 2]", "takeaway": "(1) 分布级评估而非样本级评估,天然处理 one-to-many; (2) 因子化分解使评估可解释(\"prosody 好但 environment 差\"); (3) 噪声锚点归一化使分数具有绝对含义 (>50=更像真实语音)", "limitation": "需 80-100 样本/系统才能计算; 不适合单样本评估; 个别因子 (General, Environment) 独立相关性不稳定; OpenVoice v2 得分与 TTS Arena 排名不一致", "concepts": ["TTSEvaluation", "Self-SupervisedSpeechRepresentation", "ProsodyModeling", "SpeakerEmbedding", "SpeakerVerification"], "source": "Sources/TTSDS.pdf", "github": "", "demo": ""}, {"name": "XEUS", "title": "XEUS: Towards Robust Speech Representation Learning for Thousands of Languages", "arxiv_id": "2407.00837", "date": "2024-07", "venue": "arXiv (CMU / Shanghai Jiaotong / Toyota Tech)", "org": "", "tier": "deep", "tags": ["self-supervised-learning", "speech-representation", "multilingual", "massively-multilingual", "E-Branchformer", "dereverberation", "SSL", "ASR"], "summary": "提出 XEUS (Cross-lingual Encoder for Universal Speech),一个在 1M 小时、4057 种语言数据上预训练的 E-Branchformer 语音 SSL 模型,结合 masked prediction + denoising + 新颖的 dereverberation 目标,在 ML-SUPERB 上设立新 SOTA", "route": "Waveform → (noise/reverb augmentation) → Random Masking → XEUS (Student, E-Branchformer 19层) → Predicted Pseudo-labels; WavLabLM (Teacher) → K-Means → Target Pseudo-labels", "metrics": "ML-SUPERB SUPERB_s 956/956 (SOTA) [Table 3]; SUPERB 英语 4 项第一 (KS, SD, ER, ASR) [Table 5]; FLEURS ASR CER 8.9 (接近 w2v-BERT 2.0 v2 8.7) [Table 4]; VCTK resynthesis MOS 3.23 / WER 10.0 (均最优) [Table 6]", "takeaway": "(1) Dereverberation 作为 SSL 预训练目标,增强噪声/混响鲁棒性; (2) 7413 小时新语料覆盖 4057 种语言的数据收集方法 (WikiTongues + Jesus Dramas + MMS-unlab v2); (3) E-Branchformer 替代 Transformer/Conformer 提升训练效率", "limitation": "长尾语言 (<1h 数据) 下游性能仍显著差于高资源语言 [§7]; 数据/训练代码尚未完全公开; 577M 参数量未做更大规模的 scaling 实验", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeechTokenizer", "SemanticvsAcousticTokens"], "source": "Sources/XEUS.pdf", "github": "", "demo": ""}, {"name": "CoLM-DSR", "title": "CoLM-DSR: Leveraging Neural Codec Language Modeling for Multi-Modal Dysarthric Speech Reconstruction", "arxiv_id": "2406.08336", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["dysarthric-speech", "speech-reconstruction", "codec-LM", "multi-modal", "audio-visual", "speaker-similarity", "prosody", "EnCodec"], "summary": "将 VALL-E 的 codec LM 框架迁移到 dysarthric speech reconstruction,设计 speaker codec normalizer 将异常 codecs 映射到正常 codecs,显著改善 speaker similarity 和 prosody naturalness", "route": "失真语音+唇部视频 → 多模态编码器(AV-HuBERT) → phoneme embeddings; 失真语音 → EnCodec tokenizer → dysarthric codecs → SV-based normalizer → normal codecs; phoneme embeddings + normal codecs → AR+NAR codec LM decoder → 重建 codecs → EnCodec decoder → 重建语音", "metrics": "Speaker Similarity MOS 3.30-3.78 vs baseline 2.31-3.10 [Table 1]; SV distance 0.969-1.080 vs baseline 1.054-1.137 (越低越好) [Table 2]; WER 47.9%-55.6% vs AVHu-DSR 48.0%-55.9% [Table 3]; Naturalness MOS 3.80-3.91 vs AVHu-DSR 3.52-3.62 [Table 1]; 数据集: UASpeech (4 speakers)", "takeaway": "用 SV distance 做 codec-level 的 nearest neighbor 映射来纠正异常韵律同时保留音色 — 这一\"在 codec 空间做 speaker-aware normalization\"的思路可迁移到其他需要保留身份但修正风格的语音转换任务", "limitation": "仅 4 个 speaker-dependent 系统在 UASpeech 上评估; WER 改善极小 (主要受 content encoder 瓶颈); normal codec set 的构建依赖大量正常语音数据; codec normalizer 对严重患者 (M12) 无法直接使用 dysarthric codecs 做 AB test", "concepts": ["CodecLanguageModel", "ResidualVectorQuantization", "ProsodyModeling", "SpeakerVerification", "SpeakerEmbedding"], "source": "Sources/CoLM-DSR.pdf", "github": "", "demo": ""}, {"name": "ControllingEmotionTTSNLPrompts", "title": "Controlling Emotion in Text-to-Speech with Natural Language Prompts", "arxiv_id": "2406.06406", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "prompting", "controllability", "style-transfer", "NAR-TTS", "multi-speaker"], "summary": "用蕴含情感的自然语言句子 (而非风格描述文本) 作为 prompt,通过 DistilRoBERTa emotion embedding + squeeze-and-excitation 融合驱动 FastSpeech 2 架构实现情感可控 TTS", "route": "情感文本 → DistilRoBERTa (frozen emotion classifier) → 768d CLS embedding → Linear → concat(speaker_emb) → SE block → conditional layernorm 注入 Conformer encoder/decoder/prosody predictor → Mel spectrogram → HiFi-GAN → waveform", "metrics": "Speaker similarity cosine 0.953 (vs baseline 0.950); Cramer's V 0.80 (vs ground truth 0.85, vs baseline 0.06); MOS 3.37 (vs baseline 3.30, vs GT 3.95); 推理 RTF 0.07 (GPU) [Table 2-4]", "takeaway": "(1) 用情感文本本身替代风格描述作为 prompt 源 — 训练时从 Yelp 等文本数据集提取情感句子配对语音,推理时直接用输入文本做 prompt; (2) 每次训练迭代随机采样不同 prompt 增强泛化,避免过拟合特定 prompt", "limitation": "仅 5 类离散情感 (anger/joy/neutral/sadness/surprise); speaker embedding 用 lookup table 非 zero-shot; 情感粒度为 utterance-level; 代码开源但数据处理pipeline复杂度较高", "concepts": ["EmotionControlinTTS", "NaturalLanguageDescriptionforTTS", "ProsodyModeling", "SpeakerEmbedding", "StyleTransferinTTS", "Non-autoregressiveTTS", "GlobalStyleTokens"], "source": "Sources/ControllingEmotionTTSNLPrompts.pdf", "github": "", "demo": ""}, {"name": "DEX-TTS", "title": "DEX-TTS: Diffusion-based EXpressive Text-to-Speech with Style Modeling on Time Variability", "arxiv_id": "2406.19135", "date": "2024-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "expressive", "style-transfer", "reference-based", "DiT", "zero-shot", "multi-speaker"], "summary": "将参考语音风格分解为时间不变(AdaIN + 多层特征图注意力池化)和时间变化(VQ + cross-attention)两路,配合改进的 DiT backbone(overlapping patchify + conv-freq embedding),实现无需预训练的高质量 reference-based expressive TTS", "route": "phoneme → text encoder(RoPE + swish gate + T-V AdaLN) → MAS aligner → diffusion decoder(conv down → T-IV AdaIN adapter + T-V cross-attention adapter → DiT blocks with overlapping patchify → conv up) → mel → HiFi-GAN → waveform", "metrics": "VCTK seen COS 85.31 / MOS-S 3.88, unseen COS 80.45 / MOS-S 3.81; ESD seen COS 82.71 / MOS-S 3.84, unseen COS 75.58 / MOS-S 3.52; LJSpeech(GeDEX-TTS) WER 6.55 / MOS-N 4.26 [Table 1, 2, 4]", "takeaway": "(1) T-IV/T-V 二分法 + 对应 adapter 设计模式(AdaIN for global, cross-attention for temporal); (2) overlapping patchify 消除 DiT patch 边界伪影; (3) VQ 作为 T-V 风格的信息瓶颈,防止过度细节导致 WER 恶化; (4) 多层特征图 + attention pooling 提取跨层公共 T-IV 统计量; (5) adapter 中加入 diffusion timestep t 条件实现自适应风格注入", "limitation": "RTF 0.297 远高于非 diffusion 方法(MetaStyleSpeech 0.034); 50 步 Euler 推理慢; 仅在 VCTK/ESD 中等规模数据集验证; 无大规模(>10K speaker)零样本实验; 代码已开源但未见后续大规模复现报告", "concepts": ["Diffusion-basedTTS", "StyleTransferinTTS", "DiffusionModel", "GlobalStyleTokens", "DurationPredictor", "F0Modeling", "MelSpectrogram", "ScoreMatching"], "source": "Sources/DEX-TTS.pdf", "github": "", "demo": ""}, {"name": "E2TTS", "title": "E2 TTS: Embarrassingly Easy Fully Non-Autoregressive Zero-Shot TTS", "arxiv_id": "2406.18009", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "flow-matching", "non-autoregressive", "mel-spectrogram", "simplification"], "summary": "用字符序列+filler token 替代 phoneme alignment/G2P/duration model,使 flow-matching TTS 简化到只有 mel spectrogram generator + vocoder 两个模块,仍达 SOTA 零样本 TTS", "route": "字符文本+filler token padding → Flow-matching Transformer (U-Net skip connections) → mel spectrogram → BigVGAN vocoder → waveform", "metrics": "WER 1.9% / SIM-o 0.708 (预训练初始化, LibriSpeech-PC test-clean) [Table 1]; CMOS -0.05 vs GT (不可区分) [Table 2]", "takeaway": "filler token 机制 -- 用特殊填充 token 将短文本序列 pad 到与 mel 等长,让模型自己学文本-音频对齐,无需任何外部对齐工具; speech infilling 训练范式无需 paired phoneme alignment 数据", "limitation": "收敛极慢(需完整 800K 步训练才超过 Voicebox,早期阶段 WER 远高于有 alignment 的模型) [Fig 4]; 推理仍需指定目标时长; 训练数据要求高(50K+ hours); 未开源", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "Classifier-FreeGuidance", "DurationPredictor", "MelSpectrogram"], "source": "Sources/E2TTS.pdf", "github": "", "demo": ""}, {"name": "EmoSphere-TTS", "title": "EmoSphere-TTS: Emotional Style and Intensity Modeling via Spherical Emotion Vector for Controllable Emotional Text-to-Speech", "arxiv_id": "2406.07803", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "controllable", "adversarial-training", "expressiveness", "prosody", "spherical-coordinates"], "summary": "通过将 AVD 情感伪标签从笛卡尔坐标变换到球面坐标,将情感风格(角度)和情感强度(径向距离)自然解耦,实现可控情感 TTS", "route": "文本 → FastSpeech 2 Encoder → Variance Adaptor (+ Spherical Emotion Embedding + Speaker Embedding) → Decoder → Mel → BigVGAN → Waveform", "metrics": "nMOS 3.88 vs 最佳 baseline 3.34 [Table 1]; ECA 94.02% [Table 1]; 情感强度辨别率平均 0.69 vs baseline 0.53/0.51 [Table 2]; 均在 ESD 数据集上评估", "takeaway": "(1) 球面坐标变换将风格/强度解耦的思路可迁移到其他多维属性控制场景; (2) 用 SER 伪标签替代人工 AVD 标注,零标注成本获得连续情感维度", "limitation": "仅句子级全局情感,无 phoneme-level 控制; 仅在 ESD (5 情感, 10 说话人) 上验证; 无零样本能力; 合成质量仍低于 GT (UTMOS 3.15 vs 3.78)", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "F0Modeling", "GlobalStyleTokens", "Non-autoregressiveTTS", "MelSpectrogram"], "source": "Sources/EmoSphere-TTS.pdf", "github": "", "demo": ""}, {"name": "GPST", "title": "GPST: Generative Pre-trained Speech Language Model with Efficient Hierarchical Transformer", "arxiv_id": "2406.00976", "date": "2024-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "hierarchical-transformer", "codec-LM", "semantic-token", "acoustic-token", "zero-shot", "multilingual", "hi-res"], "summary": "用 global+local 双层 transformer 将 semantic 和 acoustic tokens 统一在单阶段自回归框架中,以 33% 的参数量超越 AudioLM/VALL-E", "route": "Audio → XLSR (semantic, 50Hz) + EnCodec (acoustic, 75Hz x 8 RVQ) → Global Transformer (semantic + summed acoustic) → Local Transformer (per-timestep D codes AR) → EnCodec Decoder → Waveform", "metrics": "WER 2.8 / SPK 0.536 (acoustic continuation, LibriSpeech test-clean) [Table 1]; SPK 0.605 / DNSMOS 3.89 (speaker identity transfer) [Table 1-2]; 190M params vs AudioLM 600M", "takeaway": "(1) 将 RVQ 多码本 tokens 在全局层 sum 为单向量、在局部层 AR 展开的分治策略,可迁移到任何多码本 codec 的 LM 建模; (2) local-drop 随机丢弃局部 transformer 的时间步来加速 Hi-Res 训练; (3) 跨语言时在语义不连续处插入 0.1s 静音段稳定生成", "limitation": "不支持直接 text-to-speech (需额外 text-to-semantic 模型); 训练数据仅 60K 小时英文; Hi-Res (16 quantizers) 时 WER 反而上升 (6.4 vs 4.0) 说明更多码本增加建模难度", "concepts": ["SemanticvsAcousticTokens", "ResidualVectorQuantization", "SpeechLanguageModel", "CodecLanguageModel", "Single-codebookvsMulti-codebook"], "source": "Sources/GPST.pdf", "github": "", "demo": ""}, {"name": "MetaLearningTTS7000Languages", "title": "Meta Learning Text-to-Speech Synthesis in over 7000 Languages", "arxiv_id": "2406.06403", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "multilingual", "low-resource", "meta-learning", "zero-shot", "language-embedding", "massively-multilingual"], "summary": "通过 LESS loss 结构化语言嵌入空间 + meta learning 近似未见语言嵌入,使一个 FastSpeech-2 based 模型在 462 种语言预训练后零样本泛化到 7212 种语言", "route": "Text → eSpeak NG/transphone phonemizer → articulatory features → FastSpeech-2 (50M, conditioned on speaker emb + language emb) → mel → PortaSpeech post-net (40M) → HiFi-GAN (14M) → waveform; 未见语言时用 meta learner 从 k-NN 语言嵌入平均近似目标嵌入", "metrics": "WER 0.1 (eng) / 0.2 (fra) / 0.3 (cym) / 0.7 (vie); WV-MOS 4.4 (eng) / 3.9 (fra) / 4.0 (cym, bre); 人工评测中位数 4/5 (vie, cym, bre, aym),与 MMS 无显著差异 [Table 3, Fig 3]", "takeaway": "(1) LESS loss 将语言学先验(系统树距离 + 地理距离 + 音素集相似度)注入嵌入空间结构,可迁移到任何需要结构化嵌入的场景; (2) 用 MMS TTS 合成数据增强语言多样性的 data augmentation 策略; (3) 训练 curriculum(先多说话人数据,再全量数据)解决 speaker-language 信息泄漏", "limitation": "(1) 仅评估 6 种语言(高/中/低资源各 2),7000+ 语言中大部分未验证; (2) 低资源语言的评估缺乏可靠 ASR 和参考录音; (3) 合成质量仍显著低于人类参考(尤其低资源); (4) 未开源训练数据的完整清洗流程; (5) 模型参数仅 ~104M,与 2024 年 LLM-TTS 规模差距大", "concepts": ["PhonemeRepresentation", "Non-autoregressiveTTS", "NeuralVocoder", "SpeakerEmbedding", "MelSpectrogram", "ProsodyModeling"], "source": "https://arxiv.org/abs/2406.06403", "github": "", "demo": ""}, {"name": "NAST", "title": "NAST: Noise Aware Speech Tokenization for Speech Language Models", "arxiv_id": "2406.11037", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "speech-representation", "noise-robustness", "discrete-token", "self-supervised-learning", "GSLM", "disentanglement"], "summary": "提出端到端可学习的噪声感知 speech tokenizer,通过 Gumbel-Softmax 离散化 + augmentation invariance loss + local/global 表征分离,在 GSLM 场景下显著提升 token 对信号扰动的鲁棒性", "route": "HuBERT-9th-layer 表征 → Predictor(Conformer + Gumbel-Softmax → 帧级 one-hot local tokens) + Residual Encoder(时间平均 → global vector) → Decoder(local⊕global → 重建 HuBERT embedding);训练时 clean+augmented 信号同时输入,robustness loss 对齐两者 token 分布", "metrics": "UED(Unit Edit Distance) noise 50 units: 9.51 vs k-means 29.74 vs Gat 24.67 [Table 1]; sWUGGY 200 units: 76.42 vs k-means 71.88 [Table 2]; ABX-other-across 50 units: 10.25 vs k-means 13.50 [Table 2]", "takeaway": "(1) Robustness loss 通过 linear interpolation 对齐变长增强信号和 clean 信号的 logits,简洁有效; (2) Diversity loss 防止 codebook collapse; (3) Residual encoder 分离 global (speaker) 和 local (content) 信息,迫使离散 token 专注于内容", "limitation": "仅在 LibriSpeech 960h 上训练和评估,无多语言/大规模实验; 仅评估 GSLM 下游(sWUGGY/sBLIMP/TSC),未在 TTS 或 ASR 上测试; clean 场景下 TSC 略逊于 k-means [Table 2]", "concepts": ["SpeechTokenizer", "Gumbel-Softmax", "Self-SupervisedSpeechRepresentation", "SemanticvsAcousticTokens", "SpeechLanguageModel"], "source": "Sources/NAST.pdf", "github": "", "demo": ""}, {"name": "NaturalVoices", "title": "NaturalVoices", "arxiv_id": "2406.04494", "date": "2024-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["dataset", "voice-conversion", "spontaneous-speech", "emotional-speech", "podcast-data", "data-pipeline"], "summary": "首个大规模自发、表达性、情感语音数据集 (3,846h, 2,467+ speakers)，附带自动化数据标注 pipeline，面向 Voice Conversion", "route": "MSP-Podcast → Diarization+ASR → Speaker Recognition → Emotion/SNR/Sound Event Detection → NaturalVoices 数据集", "metrics": "SV% 95.65 (S2S) / 89.16 (U2U), CER 17.01/18.55, WER 27.20/30.43; MOS Quality 3.17, Intelligibility 3.77 [Table 2, 4]", "takeaway": "(1) 从 podcast 自动构建大规模 VC 数据的完整 pipeline; (2) 多维标注 (情感+SNR+声事件+年龄性别) 的数据集设计范式", "limitation": "标注全自动 (弱标签); 仅英语; 以 VC 为目标验证, TTS 应用尚未探索", "concepts": ["SpeakerEmbedding", "EmotionControlinTTS", "ProsodyModeling"], "source": "Sources/NaturalVoices.pdf", "github": "", "demo": ""}, {"name": "Seed-TTS", "title": "Seed-TTS: A Family of High-Quality Versatile Speech Generation Models", "arxiv_id": "2406.02430", "date": "2024-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "autoregressive", "diffusion", "reinforcement-learning", "voice-cloning", "speech-tokenizer", "LLM-based"], "summary": "首个在零样本 ICL 场景下达到与人类语音统计不可区分水平的大规模自回归 TTS 系统,附带 self-distillation 和 RL post-training 两项扩展", "route": "Reference Speech → Speech Tokenizer → Tokens; Text + Tokens → AR Transformer → Generated Tokens → Diffusion Transformer → Mel → Acoustic Vocoder → Waveform", "metrics": "CMOS -0.07/-0.08 vs Human (EN/ZH), SIM 0.762/0.796 (EN/ZH), WER 2.249/1.115 (EN/ZH) [Table 1]; Seed-TTS_DiT SIM 0.790/0.809 (EN/ZH) [Table 10]", "takeaway": "(1) Self-distillation via speaker perturbation 实现 timbre disentanglement; (2) REINFORCE + SIM/WER reward 做 TTS post-training; (3) 全 diffusion NAR 变体无需 phoneme-level duration prediction", "limitation": "未开源; 对背景音乐/噪声 prompt 鲁棒性差; 长文本韵律变化不足; 歌唱不支持; RL 存在 reward hacking (WER 低但自然度降)", "concepts": ["SpeechTokenizer", "ConditionalFlowMatching", "DifferentiableRewardOptimization"], "source": "Sources/Seed-TTS.pdf", "github": "", "demo": ""}, {"name": "Small-E", "title": "Small-E: Small Language Model with Linear Attention for Efficient Speech Synthesis", "arxiv_id": "2406.04467", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "codec-language-model", "linear-attention", "zero-shot", "voice-cloning", "efficient-training", "LCLM", "encoder-decoder"], "summary": "用线性复杂度的循环架构 (LCLM blocks) 替代 decoder-only transformer,配合 Position-Aware Cross-Attention 解决 skip/repeat,在 64M 参数 + 4x RTX3080 上实现 competitive 的 zero-shot voice cloning", "route": "Text → BPE → Transformer encoder → PACA cross-attention ← LCLM encoder ← EnCodec RVQ tokens; cross-attention output + audio embedding → LCLM decoder → logits → EnCodec RVQ tokens → Vocos → waveform", "metrics": "MOS 3.16 / SMOS 3.08 (vs YourTTS 2.56/2.54, MetaVoice 3.80/3.91); 训练吞吐 316 kT/s (vs decoder-only 195 kT/s, +62%); PACA 将 skip/repeat 各降至 1/100 [Table 1-3]", "takeaway": "(1) LCLM blocks 作为 transformer 的 drop-in 替代用于音频 LM; (2) PACA 的 position feedback loop 思路可迁移到任何 AR TTS 的 cross-attention; (3) 小模型+长样本训练的可行性验证", "limitation": "仅与 YourTTS (86M, 非 LM) 和 MetaVoice (1.2B, 20x 数据) 比较,缺少同规模 LM 基线; 仅评估英文朗读; Vocos 3kbps 解码器本身引入质量损失 (MOS 4.27 vs original 4.55 [Table 3])", "concepts": ["CodecLanguageModel", "LLM-basedTTS", "ResidualVectorQuantization", "Speech-TextAlignment"], "source": "Sources/Small-E.pdf", "github": "", "demo": ""}, {"name": "TacoLM", "title": "TacoLM: GaTed Attention Equipped Codec Language Model are Efficient Zero-Shot Text to Speech Synthesizers", "arxiv_id": "2406.15752", "date": "2024-06", "venue": "Interspeech 2024 (inferred from format)", "org": "", "tier": "deep", "tags": ["zero-shot-TTS", "codec-language-model", "gated-attention", "MEGA", "efficiency", "VALL-E", "autoregressive"], "summary": "用 MEGA gated attention 替换标准 multi-head attention,实现 10x 参数压缩 + 5.2x 推理加速的 VALL-E 变体,同时通过 gated cross-attention 改善 text-audio 对齐", "route": "Text → BPE tokenizer → Text tokens; Audio → EnCodec → RVQ tokens → AR (GPSA + GCA, 6 blocks) 生成第 1 层 → NAR (12 GPSA layers) 生成第 2-8 层 → EnCodec decoder → Waveform", "metrics": "WER 5.96% vs VALL-E 6.25%, SPK 0.8696 vs 0.8617, SMOS 3.75 vs 3.50, 参数 15.8M vs 154.3M (0.10x), RTF 1.45 vs 7.54 (5.2x speedup) [Table 1, Table 2] (LibriSpeech test-clean/test-other)", "takeaway": "(1) MEGA 作为 multi-head attention 的 drop-in 替换可大幅降低 codec LM 的计算成本; (2) 在 decoder-only 模型中加入显式 cross-attention 层解决长序列 text attention 退化问题", "limitation": "仅在 LibriSpeech 960h 上训练和评估,未验证大规模可扩展性; 仍依赖两阶段 (AR+NAR) 框架; WER 5.96% 在当前 SOTA 水平来看偏高", "concepts": ["CodecLanguageModel", "ResidualVectorQuantization", "LLM-basedTTS", "Non-autoregressiveTTS", "Speech-TextAlignment"], "source": "Sources/TacoLM.pdf", "github": "", "demo": ""}, {"name": "TextAwareContextAwareTTS", "title": "Text-aware and Context-aware Expressive Audiobook Speech Synthesis", "arxiv_id": "2406.05672", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "audiobook", "style-modeling", "contrastive-learning", "context-aware", "prosody", "expressiveness", "VITS"], "summary": "用 CLIP 式跨模态对比学习从文本预测风格 embedding + 跨句 context encoder,实现有声书 TTS 的多样风格和连贯韵律", "route": "Text → T5 encoder + attention pooling → style embedding (与 HuBERT speech style 对齐) → VQ → Context Encoder (prev/cur/next sentences + BERT) → VITS/LM TTS → waveform", "metrics": "TACA-VITS EMOS 3.93 vs VITS 3.61 (+0.32); TACA-LM EMOS 4.05 vs LM 3.80 (+0.25); text-speech style cosine similarity 0.93 (T5) vs 0.82 (BERT) [Table 1, §4.1]", "takeaway": "(1) 用 speech style similarity 阈值 (alpha/beta) 自动构造跨模态对比学习正负样本,避免人工标注; (2) VQ 量化 style embedding 提升稳定性; (3) pre-training + context-aware fine-tuning 两阶段策略复用有/无上下文标注数据", "limitation": "仅中文有声书场景验证; 无消融分解 text-aware style vs context encoder 各自贡献; LM-based 模型 CER 高 (13.1%); 数据集未公开", "concepts": ["GlobalStyleTokens", "StyleTransferinTTS", "ProsodyModeling", "Self-SupervisedSpeechRepresentation"], "source": "Sources/TextAwareContextAwareTTS.pdf", "github": "", "demo": ""}, {"name": "TraceableSpeech", "title": "TraceableSpeech: Towards Proactively Traceable Text-to-Speech with Watermarking", "arxiv_id": "2406.04840", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "watermarking", "proactive-traceability", "neural-codec", "codec-LM", "security", "speech-synthesis"], "summary": "将水印嵌入从 TTS 的后处理阶段前移到 codec 联合训练阶段,通过 frame-wise broadcast 实现对任意时长语音的鲁棒水印", "route": "Text → Phoneme → VALL-E (AR+NAR) → Discrete Codes → Imprint Module (Watermark Encoder broadcast + merge with latent z) → Speech Decoder → Watermarked Speech; 提取: Mel-spectrogram → ResNet → r-vector → Linear layers → Predicted Watermark", "metrics": "PESQ 3.641 (4@10) / 3.569 (4@16) vs baseline 3.197 [Table 1]; MOS 3.959 (4@10) vs 3.554 baseline [Table 2]; 提取精度在双重 resplicing 攻击后仍 100% (4@10) vs 49-86% baseline [Table 3]; 4@64 在 0.3s 语音上精度 >95% [Table 4]", "takeaway": "(1) 水印与 codec 端到端联合训练消除误差累积的思路,可推广到其他需要在生成过程中嵌入元信息的场景; (2) frame-wise broadcast 将固定维度的信息均匀扩展到可变长序列的方法", "limitation": "仅在 LibriTTS 上实验; 语音质量仍低于无水印 codec (未报告无水印 HiFiCodec 重建指标作对照); 水印容量有限 (最高 4@64 ≈ 24 bit); 未讨论对 vocoder 攻击 (如重新合成) 的鲁棒性; 仅英文", "concepts": ["CodecLanguageModel", "ResidualVectorQuantization", "Anti-spoofingandDeepfakeDetection", "TTSEvaluation", "SpeakerEmbedding"], "source": "Sources/TraceableSpeech.pdf", "github": "", "demo": ""}, {"name": "UniAudio1.5", "title": "UniAudio 1.5: Large Language Model-driven Audio Codec is A Few-shot Audio Task Learner", "arxiv_id": "2406.10056", "date": "2024-06", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["audio-codec", "LLM", "in-context-learning", "few-shot", "multi-scale-RVQ", "cross-modal", "audio-understanding", "audio-generation"], "summary": "提出 LLM-Codec,将音频量化到 frozen LLM 的词表空间,使 LLAMA 2 无需任何参数更新即可通过 in-context learning 完成多种音频理解和生成任务", "route": "Audio → Encoder (480x downsample) → Multi-scale RVQ (3层,码本=LLAMA vocab) → Word sequence → Frozen LLAMA 2 7B (ICL) → Word sequence → Codec Decoder → Audio", "metrics": "重建 PESQ 2.55 / STOI 0.82 (VCTK, 57 tok/s) [Table 1]; 2-way 情感分类最高 59% acc (semantic layer, 3-shot, 0-repeat) [Table 2]; 简单 TTS 70% ACC / DNSMOS 2.92 [Table 4]; Dynamic-SUPERB 鸟声检测 50% acc (vs ImageBind-LLM 28%) [Table 3]", "takeaway": "(1) 用预训练 LLM 词表初始化 codec 码本并 freeze,消除 modal gap 的思路; (2) Word-level codebook (Oxford 5000) 用于语义层,sub-word codebook 用于声学层的差异化设计; (3) Consistency loss 用 Whisper encoder 特征引导 VQ2 训练稳定性", "limitation": "性能远逊于专用模型 (speech denoising PESQ 2.17 vs SGMSE+ 3.53 [Table 5]); 只支持简单 TTS (digit-level); 受 LLM 上下文长度限制无法增加 demonstrations; 仅测试 LLAMA 2 7B", "concepts": ["ResidualVectorQuantization", "SemanticvsAcousticTokens", "CodebookCollapse", "SpeechTokenizer", "CodecLanguageModel", "AudioTokenizerTaxonomy"], "source": "Sources/UniAudio1.5.pdf", "github": "", "demo": ""}, {"name": "VALL-E-R", "title": "VALL-E R: Robust and Efficient Zero-Shot Text-to-Speech Synthesis via Monotonic Alignment", "arxiv_id": "2406.07855", "date": "2024-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "codec-LM", "monotonic-alignment", "robustness", "inference-efficiency", "AR-NAR", "phoneme-alignment"], "summary": "在 VALL-E 基础上引入 phoneme 单调对齐策略增强鲁棒性 + codec-merging 下采样加速推理,WER 逼近 ground truth 且推理速度提升 60%+", "route": "Text → G2P → Phoneme + 3s Acoustic Prompt (Merged EnCodec codes) → AR model (同步预测 acoustic token + aligned phoneme, 受 monotonic alignment 约束) → NAR model (逐层生成 2-8th quantizer codes, 条件为 aligned phoneme) → EnCodec Decoder → Waveform", "metrics": "Continuation WER 1.58% vs VALL-E 2.37% vs GT 1.41% [Table 1]; Cross-sentence WER 3.18% vs VALL-E 5.48% [Table 1]; Spk-Sim 0.876 vs VALL-E 0.875 [Table 1]; 推理速度 3.67s/10s vs VALL-E 10.27s/10s [Table 4]; QMOS 4.02 vs VALL-E 3.96 [Table 2]", "takeaway": "(1) codec-merging: 通过 average pooling + repeat 在 RVQ 层间插入下采样模块,无需重训 codec 即可降低采样率,可迁移到任何 RVQ codec; (2) monotonic alignment: 在 decoder-only LM 中同步预测 phoneme 作为文本对齐锚点,用 Bernoulli 采样控制 phoneme pointer 推进,解决 attention degradation", "limitation": "仅在 LibriSpeech 960h 上训练和评估,规模较小; 未与 flow-based/diffusion-based 方法对比; codec-merging 仅下采样第一层(多层下采样质量显著下降); 未开源; monotonic alignment 依赖外部 forced aligner(MFA)提供训练对齐", "concepts": ["ResidualVectorQuantization", "LLM-basedTTS", "Speech-TextAlignment", "PhonemeRepresentation", "Non-autoregressiveTTS"], "source": "Sources/VALL-E-R.pdf", "github": "", "demo": ""}, {"name": "VALL-E2", "title": "VALL-E 2: Neural Codec Language Models are Human Parity Zero-Shot Text to Speech Synthesizers", "arxiv_id": "2406.05370", "date": "2024-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "codec-LM", "human-parity", "sampling-strategy", "grouped-modeling", "AR-NAR"], "summary": "在 VALL-E 基础上引入 Repetition Aware Sampling(自适应切换 nucleus/random sampling 避免 infinite loop）和 Grouped Code Modeling（将 codec codes 按 group 建模缩短序列长度），首次在 LibriSpeech/VCTK 上达到 human parity 零样本 TTS", "route": "Text → BPE → Text Tokens + Speech Prompt → EnCodec → Grouped Code Prompt → AR Transformer (RAS decoding, 生成 1st quantizer grouped codes) → NAR Transformer (greedy decoding, 生成 2-8th quantizer codes) → Vocos Decoder → Waveform", "metrics": "WER 1.5% / SIM 0.782 / DNSMOS 3.987 (LibriSpeech, 3s prefix, single sampling, group=1) [Table 1]; SMOS 4.61 > GT 4.13 / CMOS +0.033 > 0 (LibriSpeech, 40 speakers) [Table 2]; WER 0.9% / SIM 0.487 (VCTK, 3s, single, group=2) [Table 4]", "takeaway": "(1) Repetition Aware Sampling: 在 AR decoding 中监控 token 重复率,超阈值自动从 nucleus 切换到 random sampling,一行代码级改动解决 infinite loop; (2) Grouped Code Modeling: 将多帧 codec codes 拼为一组,每组作为一个 AR step,在 AR 层面缩短序列 G 倍且组内 NAR 生成,可直接迁移到任何 codec LM; (3) NAR 模型显式 split acoustic condition: 训练时随机切分 prompt 并使用全 8 层 codes,推理时自然利用完整 prompt 信息提升 speaker similarity", "limitation": "仅英文实验; human parity 结论仅基于 LibriSpeech/VCTK 两个 read speech 数据集; 未开源代码/权重; 仍依赖 off-the-shelf EnCodec (75Hz, 8层 RVQ),被 codec 帧率和码本设计约束", "concepts": ["LLM-basedTTS", "ResidualVectorQuantization", "SpeechTokenizer", "SemanticvsAcousticTokens", "CodecLanguageModel", "Non-autoregressiveTTS"], "source": "Sources/VALL-E2.pdf", "github": "", "demo": ""}, {"name": "XTTS", "title": "XTTS: a Massively Multilingual Zero-Shot Text-to-Speech Model", "arxiv_id": "2406.04904", "date": "2024-06", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "multilingual", "cross-lingual", "voice-cloning", "language-model", "VQ-VAE", "GPT-2"], "summary": "基于 Tortoise 改进的多语言零样本 TTS,通过 VQ-VAE + GPT-2 + HiFi-GAN 三组件架构实现 16 语种的语音克隆与跨语言合成", "route": "Text (BPE) + Reference Mel → Conditioning Encoder (Perceiver Resampler) → GPT-2 AR decoder (预测 VQ-VAE codes) → GPT-2 latent → HiFi-GAN (conditioned on H/ASP speaker embedding) → 24kHz Waveform", "metrics": "英语 CER 0.54, UTMOS 4.007, SECS 0.642 [Table 2]; 16 语种平均 CER 2.06, SECS 0.505 [Table 4]; CMOS +0.41/+0.92 vs HierSpeech++/Mega-TTS 2 [Table 3]; Fine-tuning 后跨语言 SECS 0.585→0.717 [§5]", "takeaway": "(1) 码本频率过滤 (保留 Top-1024) 提升表现力; (2) Perceiver Resampler 生成固定数量 speaker embeddings,解耦参考音频长度; (3) 语言 batch balancer 平衡多语言训练", "limitation": "SMOS 略低于 HierSpeech++/Mega-TTS 2 (speaker similarity 不如单语模型); VQ-VAE decoder 重建有 artifacts 需额外 HiFi-GAN; 低资源语言数据量极少 (如 Czech 52h, Japanese 57h)", "concepts": ["CodecLanguageModel", "SpeakerEmbedding", "SpeakerAdaptation", "Single-codebookvsMulti-codebook", "VoiceCloningTaxonomy"], "source": "Sources/XTTS.pdf", "github": "", "demo": ""}, {"name": "video-SALMONN", "title": "video-SALMONN: Speech-Enhanced Audio-Visual Large Language Models", "arxiv_id": "2406.15704", "date": "2024-06", "venue": "ICML 2024", "org": "", "tier": "deep", "tags": ["audio-visual", "speech-LM", "multimodal", "Q-Former", "LoRA", "video-understanding", "causal-attention", "multi-resolution"], "summary": "首个能同时理解视觉帧序列+语音+音频事件+音乐的端到端 av-LLM,通过多分辨率因果 Q-Former (MRC Q-Former) + diversity loss + unpaired 混合训练,在 Video QA 上比 InstructBLIP 提升 25%+,在含语音的 AVQA 上比 Video-LLaMA 提升 30%+", "route": "Video frames (2Hz) → InstructBLIP ViT (冻结) + Audio → Whisper encoder + BEATs encoder (冻结) → 帧级时序同步 (0.5s) → MRC Q-Former (多分辨率滑窗: 0.5s + 5s, 因果自注意力, 可训练) → 投影层 → Vicuna 13B + LoRA → text response", "metrics": "Video QA 49.6% vs InstructBLIP 24.7% (+25%); AVQA Presentation 70.5% vs Video-LLaMA 21.3% (+49%); ASR WER 2.6% (接近 Whisper 2.9%); AVM 79.7% (零样本跨模态推理); AVSR WER 7.7% vs Whisper 8.3% (-7.2% rel.) [Table 2, 3]", "takeaway": "(1) 多分辨率 Q-Former: 高分辨率管语音/时序,低分辨率管语义/全局,互补后由 LLM 融合; (2) diversity loss: 用 cosine similarity 惩罚冗余 query,适用于所有 Q-Former 架构; (3) unpaired 混合训练: 将独立音频和视频任务混合为伪 AV 任务,迫使模型均衡关注双模态", "limitation": "仅支持短视频 (~25s); 视觉帧率仅 2Hz (低于人眼感知); LoRA 仅 0.4% 参数; 训练数据 <1M 样本; SAVE benchmark 自建,外部复现有限; 语音输出未涉及", "concepts": ["SpeechLanguageModel", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "Audio-LanguagePretraining", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/video-SALMONN.pdf", "github": "", "demo": ""}, {"name": "Mamba-2", "title": "Transformers are SSMs: Generalized Models and Efficient Algorithms Through Structured State Space Duality", "arxiv_id": "2405.21060", "date": "2024-05", "venue": "ICML 2024", "org": "", "tier": "deep", "tags": ["SSM", "state-space-model", "selective-SSM", "sequence-modeling", "architecture", "linear-complexity", "structured-matrix", "semiseparable"], "summary": "通过证明 selective SSM 与 structured masked attention 是半可分矩阵变换的对偶形式,设计出兼具 SSM 线性复杂度和 attention 硬件友好性的 SSD 算法与 Mamba-2 架构", "route": "输入 u → 并行线性投影得 (A, X, B, C) → 1D Conv(X) → SSD layer(半可分矩阵分块乘法: chunk 内用二次 attention 形式,chunk 间用线性 SSM 递推) → 门控 → GroupNorm → 线性投影输出", "metrics": "LM: Mamba-2 2.7B Pile ppl 6.09 (vs Mamba-2.8B 6.22, Transformer++ 6.13); SSD 速度 2-8x > Mamba scan, seq_len >= 2K 时快于 FlashAttention-2; 状态维度 N=256 几乎不减速 [Table 1, Fig 10]", "takeaway": "(1) 分块矩阵乘法统一 linear/quadratic 形式是通用算法设计范式; (2) 多头模式(MVA/MQA/MKA/MHA)移植到 SSM 的系统方法论; (3) 混合架构(~10% attention 层)在纯 SSM 和纯 Transformer 之间取最优; (4) Tensor Parallel 设计(并行投影 A/B/C/X + GroupNorm)", "limitation": "A 矩阵限制为 scalar-identity(比 Mamba-1 的 diagonal 表达力弱); 仍未验证 10B+ 规模; 不含 softmax 因此不完全泛化 standard attention; 音频/语音实验缺失(仅 LM)", "concepts": ["CodecLanguageModel"], "source": "Sources/Mamba-2.pdf", "github": "", "demo": ""}, {"name": "CM-TTS", "title": "CM-TTS: Enhancing Real Time Text-to-Speech Synthesis Efficiency through Weighted Samplers and Consistency Models", "arxiv_id": "2404.00569", "date": "2024-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "consistency-model", "NAR", "single-step-generation", "weighted-sampling", "mel-spectrogram"], "summary": "将 consistency training (非 distillation) 应用于 mel-spectrogram 生成,配合 importance sampler 消除对抗训练和 teacher 依赖,实现单步高质量 TTS", "route": "Phoneme → FFT Encoder → Variance Adaptor (pitch/energy/duration) → CM-Decoder (WaveNet, online+target EMA) → Mel → HiFi-GAN → Waveform", "metrics": "VCTK MOS 3.96 (T=1) vs DiffGAN-TTS 3.45 (T=1) [Table 1]; LJSpeech MOS 3.84 (T=1) vs DiffGAN-TTS 3.71 [Table 8]; 28.6M params", "takeaway": "Importance sampler 根据历史 loss 动态调整 ODE 轨迹采样权重,可迁移到任何基于 ODE 轨迹采样的训练(flow matching 等); padding 纳入 loss 计算提升变长序列建模", "limitation": "单说话人零样本场景不如 DiffGAN-TTS [Table 9]; 仅探索 mel 生成未扩展到其他音频任务; 网络结构本身未优化(层数/残差模块); 代码开源但影响力有限", "concepts": ["Diffusion-basedTTS", "DiffusionModel", "ScoreMatching", "Non-autoregressiveTTS", "NeuralVocoder", "MelSpectrogram"], "source": "Sources/CM-TTS.pdf", "github": "", "demo": ""}, {"name": "HumaneSpeech", "title": "Humane Speech Synthesis through Zero-Shot Emotion and Disfluency Generation", "arxiv_id": "2404.01339", "date": "2024-04", "venue": "LREC-COLING 2024", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "disfluency", "zero-shot", "rule-based", "virtual-patient", "conversational-AI", "prompt-engineering"], "summary": "用 GPT-4 零样本 prompt engineering 在文本生成阶段同时输出情感标签和 disfluency 标记,再通过规则映射将这些标记转换为预录音频片段与 TTS 合成语音拼接,实现\"类人\"语音", "route": "User Input → GPT-4 (with emotion/disfluency prompt) → Annotated Text → Rule-based Parser → {Clean Text → SpeechT5/MMS-TTS → Speech} + {Emotion Cues → Predefined Audio Mapping} + {Disfluencies → TTS Synthesis + Stretching} → Concatenated Waveform", "metrics": "无标准客观指标(无 MOS/WER/SIM),仅有定性主观分析; SpeechT5 被评为三个 TTS 模型中综合最优 [§5.2.3]", "takeaway": "将 LLM 作为情感/disfluency 标签的零样本生成器,利用其世界知识在对话上下文中产生语境合适的非言语行为标注 — 这个 idea 可迁移到现代 NV-capable TTS 的标签生成阶段", "limitation": "无定量评估(无 MOS/MCD/WER); 规则映射不可泛化(新情感需手动添加音频); 分段拼接音频不自然; SpeechT5/MMS-TTS 已过时; 仅在单一虚拟患者场景验证; 代码可用但可复现性低(依赖 GPT-4 API + 特定音频素材)", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "Text-to-SpeechPipeline"], "source": "Sources/HumaneSpeech.pdf", "github": "", "demo": ""}, {"name": "HyperTTS", "title": "HyperTTS: Parameter Efficient Adaptation in Text to Speech using Hypernetworks", "arxiv_id": "2404.04645", "date": "2024-04", "venue": "LREC-COLING 2024", "org": "", "tier": "deep", "tags": ["TTS", "speaker-adaptation", "parameter-efficient", "hypernetwork", "adapter", "multi-speaker", "domain-adaptation"], "summary": "用 hypernetwork 将静态 adapter 参数变为 speaker-conditioned 动态参数,以 <1% backbone 参数量实现接近 full fine-tune 的多说话人 TTS 适应", "route": "Text → Phoneme Encoder (4 FFT) → Variance Adapter (duration/pitch/energy) → Mel-Decoder (6 FFT) → Mel Spectrogram; 各模块卷积层后插入 adapter, adapter 权重由 Hypernetwork(SE+LE→SP→Parameter Sampler) 动态生成 [Fig 2]", "metrics": "HyperTTS_e/v/d COS 79.46 / FFE 34.47 (客观, 1.27% 参数); HyperTTS_d MOS 3.64 vs TTS-FT 3.70 (主观, p~0.56 无显著差异, 0.42% 参数) [Table 1, Table 4]", "takeaway": "hypernetwork 以 (speaker_embedding, layer_id) 为条件生成 adapter 权重,将离散的 per-speaker adapter 问题转化为连续参数空间采样问题,理论上可扩展到任意数量说话人而不增加 hypernetwork 参数", "limitation": "backbone 仅 35.7M 参数 (FastSpeech-like); 仅英语 LibriTTS/VCTK 验证; hypernetwork 存在 overfitting 适应域的问题 [§6]; WER 偏高 (>0.20); 未与 LoRA/CLN 等同期方法比较", "concepts": ["SpeakerAdaptation", "SpeakerEmbedding"], "source": "Sources/HyperTTS.pdf", "github": "", "demo": ""}, {"name": "IndustrialScaleASR", "title": "Anatomy of Industrial Scale Multilingual ASR", "arxiv_id": "2404.09841", "date": "2024-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["ASR", "conformer", "RNN-T", "BEST-RQ", "self-supervised-learning", "multilingual", "code-switching", "hallucination"], "summary": "600M Conformer RNN-T + BEST-RQ 预训练(12.5M hr) + 多源微调(1.8M hr),在半参数量下达到 Whisper large-v3 竞争性 WER,同时在 hallucination(-30%)、noise robustness(-90% fabrication)、timestamp、latency(5x)上全面优于 encoder-decoder 架构", "route": "12.5M hr 无标注音频 →[BEST-RQ SSL]→ Conformer encoder(600M) →[RNN-T 联合微调]→ 188k hr 监督 + 1.6M hr 伪标签 →[VAD 分段 + batch 推理]→ 转写 + 时间戳", "metrics": "EN avg WER 7.6% (vs Whisper 8.4%, Canary-1B 8.1%) [Table 3]; HR5 -30% vs Whisper [§4.6]; 噪声 fabrication 10.5% vs Whisper 100% [Table 6]; RTF 5.7e-3 vs Whisper 29.7e-3 (5x) [Table 5]", "takeaway": "(1) sequential transducer loss 将 RNN-T lattice 沿时间轴展开,内存从 6.9TB 降至可行范围 [§3.3.2]; (2) 双模型伪标签互验(WER>20%丢弃)控制伪标签质量 [§3.1.3]; (3) hallucination 定量指标 FRN/ORN/HRN 可用于任何 ASR 系统评估 [§4.6.1]", "limitation": "仅覆盖 4 种高资源语言; 未与 streaming Conformer 对比; 非开源; code-switching 测试集为合成拼接", "concepts": ["Self-SupervisedSpeechRepresentation"], "source": "Sources/IndustrialScaleASR.pdf", "github": "", "demo": ""}, {"name": "KazEmoTTS", "title": "KazEmoTTS: A Dataset for Kazakh Emotional Text-to-Speech Synthesis", "arxiv_id": "2404.01033", "date": "2024-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "dataset", "Kazakh", "low-resource", "GradTTS", "diffusion"], "summary": "首个哈萨克语情感 TTS 数据集 (54,760 条, 74.85h, 6 种情感, 3 位叙述者),附带 GradTTS baseline 模型", "route": "文本 → GradTTS (hard emotion label) → 80-dim log-mel → HiFi-GAN vocoder → 波形", "metrics": "MCD 6.02-7.67 / MOS 3.51-3.57 / 情感识别总准确率 37% [Table 3, Table 4]", "takeaway": "(1) Telegram bot 用于录音收集和评估的低成本数据采集流程; (2) Whisper ASR 做录音质量筛选 (CER 检测 → 人工复核 → 淘汰),从 84,714 条筛到 54,760 条", "limitation": "MOS 仅 3.5 级别; 情感识别准确率极低 (angry 仅 22%); 无情感强度控制; 模型无创新; 未与当时的情感 TTS SOTA 做公平对比", "concepts": ["EmotionControlinTTS", "Diffusion-basedTTS", "NeuralVocoder", "MelSpectrogram", "TTSEvaluation"], "source": "Sources/KazEmoTTS.pdf", "github": "", "demo": ""}, {"name": "Llama-VITS", "title": "Llama-VITS: Enhancing TTS Synthesis with Semantic Awareness", "arxiv_id": "2404.06714", "date": "2024-04", "venue": "LREC-COLING 2024", "org": "", "tier": "deep", "tags": ["TTS", "end-to-end", "semantic-embedding", "LLM", "VITS", "emotion", "expressiveness"], "summary": "将 Llama2 的语义嵌入注入 VITS 的文本编码,在不改变 VITS 主体架构的前提下提升情感表达能力,系统对比 7 种语义 token 提取策略 (5 全局 + 2 序列) 与 BERT-VITS baseline", "route": "Text -> Llama2 final hidden layer -> 全局/序列 token -> 线性投影 -> 与 VITS acoustic embedding 融合 (add 或 attention) -> VITS 正常合成", "metrics": "LJSpeech UTMOS 4.21 ([AVE]/[EIS_Sentence]/[LAST], 与 ORI-VITS 4.19 持平); EmoV_DB ESMOS 3.22 ([TEX]) vs ORI-VITS 3.06, 情感相似度显著提升 [Table 1]", "takeaway": "用 LLM 的 prompt 机制 (EIS_Word/EIS_Sentence) 从文本中提取情感/意图/风格向量,作为 TTS 系统的辅助条件信号; 全局 vs 序列 token 的选择取决于目标 (naturalness vs expressiveness)", "limitation": "仅测试 Llama2 一种 LLM、仅在小规模干净数据集上验证; 无主观 MOS 自然度评测 (仅有 UTMOS 客观预测); ESMOS 仅 5 条采样, 统计效力有限; 引入 Llama2 13B 的计算开销大, 不适合实时场景", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "SemanticvsAcousticTokens", "Text-to-SpeechPipeline"], "source": "Sources/Llama-VITS.pdf", "github": "", "demo": ""}, {"name": "RALL-E", "title": "RALL-E: Robust Codec Language Modeling with Chain-of-Thought Prompting for Text-to-Speech Synthesis", "arxiv_id": "2404.03204", "date": "2024-04", "venue": "arXiv preprint (under review)", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based-TTS", "robustness", "chain-of-thought", "prosody", "duration", "alignment", "autoregressive"], "summary": "将 Chain-of-Thought prompting 引入 LLM-based TTS,通过先预测 phoneme-level prosody tokens (pitch + duration) 再预测 speech tokens + duration-guided attention masking,大幅提升 AR codec LM 的鲁棒性", "route": "Text (phonemes) + Speech prompt → AR Transformer 先预测 prosody tokens (pitch+duration) → 再预测 1st-layer speech tokens (duration-guided masking 约束 attention) → NAR Transformer 预测 2-16 层 speech tokens → SoundStream decoder → waveform", "metrics": "WER 5.6% → 2.5% (w/o reranking), 1.7% → 1.0% (w/ reranking), LibriSpeech test-clean [Table 2]; hard sentences error rate 68% → 4% [Table 1]; UTMOS 3.9 → 4.0 [Table 2]; CMOS vs GT -0.02 [Table 3]", "takeaway": "(1) CoT-style 分步预测作为 AR 鲁棒性增强的通用策略; (2) 利用预测的 duration 信息反向约束 attention mask (duration-guided masking); (3) duration-guided inference 用总 duration 强制停止 EOS,消除 omission/repetition", "limitation": "依赖外部对齐工具获取训练时 duration 标签; 未开源; 仅在英文数据集上验证; speaker similarity (SIM 0.49) 与原始 VALL-E (0.58) 相比无提升", "concepts": ["LLM-basedTTS", "ProsodyModeling", "DurationPredictor", "CodecLanguageModel", "ResidualVectorQuantization", "Speech-TextAlignment"], "source": "Sources/RALL-E.pdf", "github": "", "demo": ""}, {"name": "SpeechAlign", "title": "SpeechAlign: Aligning Speech Generation to Human Preferences", "arxiv_id": "2404.05600", "date": "2024-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["RLHF", "DPO", "preference-optimization", "codec-LM", "zero-shot-TTS", "self-improvement", "distribution-gap"], "summary": "首次将人类偏好学习 (DPO/RLHF-PPO/CoH/BoN) 应用于 speech codec language model,通过 golden vs synthetic AR tokens 构建偏好数据集实现迭代自改进 [论文原文]", "route": "Text → SpeechGPT AR model → AR tokens → SoundStorm NAR model → Speech; 偏好优化在 AR model 层面操作", "metrics": "LibriSpeech: WER 6.0 / SIM 0.90 (DPO-Iter3); VCTK: WER 7.9 / SIM 0.83; 相比 baseline SFT (WER 7.2 / SIM 0.87) 显著改进 [Table 3]", "takeaway": "(1) 利用 golden vs synthetic token 的天然对比构建偏好数据,无需人工标注; (2) 迭代自改进 (iterative DPO) 可持续提升性能; (3) DPO 在 codec LM 上有效", "limitation": "(1) 仅优化 AR model,未涉及 NAR model 的偏好优化; (2) 仅在 LibriSpeech/VCTK 英语数据上验证; (3) SpeechGPT 基线较老,未在更强的 codec LM 上测试; (4) 偏好数据集仅考虑整体质量,未区分 pitch/timbre/rhythm 等细粒度维度", "concepts": ["CodecLanguageModel", "SemanticvsAcousticTokens", "ResidualVectorQuantization", "LLM-basedTTS", "SpeechTokenizer", "TTSEvaluation"], "source": "Sources/SpeechAlign.pdf", "github": "", "demo": ""}, {"name": "StoryTTS", "title": "StoryTTS: A Highly Expressive Text-to-Speech Dataset with Rich Textual Expressiveness Annotations", "arxiv_id": "2404.14946", "date": "2024-04", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "dataset", "expressiveness", "prosody", "annotation", "LLM", "Mandarin", "storytelling"], "summary": "首个同时包含语音和文本表现力标注的 TTS 数据集,从中文评书录音构建,附带 LLM 驱动的五维度文本表现力标注框架", "route": "评书录音 → VAD+Whisper 分割 → 人工校正 → LLM 五维度标注 (句式/修辞/场景/角色/情感) → Expressiveness Encoder 注入 VQTTS", "metrics": "+ALL 融合全部标签: MCD 6.181 (baseline 6.904, ↓10.5%), log-F0 RMSE 0.402 (baseline 0.437, ↓8.0%), MOS 4.09±0.07 (baseline 3.88±0.07, ↑5.4%) [Table 4]", "takeaway": "(1) 用 LLM few-shot annotation 替代人工标注降低成本,不同 LLM 负责不同维度 (Claude-2 做结构标注,GPT-4 做情感描述); (2) 将文本表现力分解为五个正交维度的分析框架; (3) 基于 BERT cross-attention 建模情感在句内的分布", "limitation": "单说话人 (无法验证多说话人泛化); 仅中文评书域 (域外迁移未验证); LLM 标注准确率未给出定量评估; Expressiveness Encoder 设计较简单 (embedding lookup + cross-attention)", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "StyleTransferinTTS", "GlobalStyleTokens", "NaturalLanguageDescriptionforTTS", "TTSEvaluation"], "source": "Sources/StoryTTS.pdf", "github": "", "demo": ""}, {"name": "UMETTS", "title": "UMETTS: A Unified Framework for Emotional Text-to-Speech Synthesis with Multimodal Prompts", "arxiv_id": "2404.18398", "date": "2024-04", "venue": "IEEE (preprint, arXiv:2404.18398v2)", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "multimodal", "contrastive-learning", "style-transfer", "expressiveness"], "summary": "通过对比学习将视觉/音频/文本三模态情感特征对齐为统一 emotion embedding,注入多种 TTS 后端实现多模态 prompt 驱动的情感语音合成", "route": "多模态输入(图像/视频/音频/文本 prompt) → EP-Align(对比学习对齐) → emotion embedding → EMI-TTS(VITS/FastSpeech2/Tacotron2 变体) → 情感语音", "metrics": "ESD 上 FastSpeech2 变体 WER 7.35% / CER 3.07% / SECS 0.896 / ESMOS 4.37 [Table I]; MEADTTS 上 MCD 5.927 / SECS 0.890 [Table I]", "takeaway": "EP-Align 的 prompt anchoring 对齐策略 — 用固定的文本 emotion prompt 作为锚点,将其他模态向锚点对齐,避免直接跨模态对齐的分布差异问题", "limitation": "TTS 后端均为传统模型(非 LLM-based),仅在 ESD/MEAD 小规模数据集上验证; 情感类别有限(基本情感),未覆盖细粒度/混合情感; 论文实验中 MM-TTS 基线因代码不可用仅用 demo 评估,对比公平性存疑", "concepts": ["EmotionControlinTTS", "GlobalStyleTokens", "StyleTransferinTTS", "ProsodyModeling", "SpeakerEmbedding", "NaturalLanguageDescriptionforTTS"], "source": "Sources/UMETTS.pdf", "github": "", "demo": ""}, {"name": "USAT", "title": "USAT: A Universal Speaker-Adaptive Text-to-Speech Approach", "arxiv_id": "2404.18094", "date": "2024-04", "venue": "arXiv (IEEE Trans. format)", "org": "", "tier": "deep", "tags": ["TTS", "speaker-adaptation", "zero-shot", "few-shot", "voice-cloning", "VAE", "normalizing-flow", "adapter"], "summary": "统一 zero-shot (instant) 和 few-shot (fine-grained) 说话人适应的 TTS 框架,通过解耦学习 + memory-augmented VAE 提升泛化,通过轻量 adapter 实现 0.5-1.6% 参数的 few-shot 适应", "route": "phoneme → Phoneme Encoder + Duration Predictor → frame-level phoneme repr l; ref speech → MAVAE encoder → speech repr z_ref; Timbre Converter (normalizing flow): l + z_ref → speech repr z_hat → MAVAE decoder → waveform", "metrics": "LibriTTS unseen: NMOS 3.95, SMOS 4.06, SMCS 0.780, SVR 88.7% [Table I]; ESLTTS fine-grained: SMOS 3.74, SMCS 0.833, SVR 98.8% with only 0.64M params [Table V]", "takeaway": "(1) memory codebook 简化 VAE 后验分布 -- 让 decoder 更容易学习; (2) phoneme leakage discriminator 的对比设计 -- 用同一句切片 vs 同人不同句的 embedding 对来检测语言信息泄漏; (3) 冻结预训练参数只训练插入的 adapter -- 避免灾难性遗忘的有效策略", "limitation": "(1) 基于 VITS backbone,合成质量上限受限; (2) 未与 VALL-E/NaturalSpeech 2 等 2023 年后 LLM-based 或 diffusion-based 方法对比; (3) ESLTTS 仅 37 小时; (4) 非母语口音场景 instant adaptation 的 SVR 仅 48.4% [Table II]", "concepts": ["SpeakerAdaptation", "VoiceCloningTaxonomy", "VariationalAutoencoderforTTS", "SpeakerEmbedding", "GradientReversalLayer", "SpeechFactorization", "DurationPredictor", "PhonemeRepresentation"], "source": "Sources/USAT.pdf", "github": "", "demo": ""}, {"name": "Gemini1.5", "title": "Gemini 1.5: Unlocking multimodal understanding across millions of tokens of context", "arxiv_id": "2403.05530", "date": "2024-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multimodal-LLM", "long-context", "ASR", "speech-understanding", "audio-reasoning", "MoE", "in-context-learning", "needle-in-haystack"], "summary": "Google 的 natively multimodal MoE 模型,将 context 窗口推至 10M tokens,在音频/视频/文本上实现 >99% needle recall 并在长上下文 ASR 上超越 Whisper/USM 专用模型", "route": "原始音频/视频/文本 → native multimodal encoder (MoE Transformer) → unified context (up to 10M tokens) → text output", "metrics": "长上下文 ASR WER 5.5% (15min YouTube, 无分段, vs Whisper 7.3%@30s分段) [Table 8]; 音频 haystack 100% recall@107h [Fig 10]; MLS en WER 4.2% [Table 20]; FLEURS 55lang WER 6.5% [Table 20]; Kalamang ASR CER 23.0% (800-audioshot, from scratch) [Table 6]", "takeaway": "(1) 超长上下文消除了音频分段预处理的需求; (2) 混合模态 in-context learning (文本语法 + 音频样例) 用于低资源语言 ASR; (3) 跨模态 needle-in-haystack 评估方法论", "limitation": "(1) 音频架构细节未公开(tokenization 方式、采样率、音频 token 率均未说明); (2) 多语言 ASR 在非 head 语言上有回退(post-training 只覆盖 5 种头部语言); (3) 无语音生成能力; (4) 音频 benchmark 仅覆盖 ASR/AST,未评估 speaker/emotion/paralinguistic 任务", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "LLM-enhancedASR", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/Gemini1.5.pdf", "github": "", "demo": ""}, {"name": "HUME-VOCALBURST", "title": "The NeurIPS 2023 Machine Learning for Audio Workshop: Affective Audio Benchmarks and Novel Data", "arxiv_id": "2403.14048", "date": "2024-03", "venue": "NeurIPS 2023 MLA Workshop", "org": "", "tier": "deep", "tags": ["dataset", "emotion-recognition", "vocal-burst", "prosody", "affective-computing", "speech-emotion", "paralinguistic", "benchmark"], "summary": "NeurIPS 2023 MLA Workshop 白皮书,发布四个情感/副语言音频数据集 (HUME-PROSODY, HUME-VOCALBURST, MODULATE-SONATA, MODULATE-STREAM),配套多个 SER/vocal-burst 竞赛基线", "route": "数据收集 (众包模仿/专业演员/游戏直播) → 情感标注 (多 rater intensity 评分) → 标准化 (16kHz/48kHz, speaker-independent splits) → Benchmark 任务定义 (ExVo MTL/Generation/FewShot + A-VB High/Two/Culture/Type)", "metrics": "ExVo-MultiTask S_MTL 0.435 (NLPros best) [Table 8]; A-VB High CCC 0.736 (EIHW best) [Table 9]; MODULATE-SONATA 25-class UAR 0.90 (early fusion Wav2Vec2+HuBERT) [Table 10]", "takeaway": "(1) 跨文化 vocal burst 数据设计 (4 countries, seed imitation 范式); (2) 48 维 semantic space 情感标注框架 (Cowen 2021); (3) HEEP 指标结合 FID 评估 vocal burst 生成质量; (4) Speaker-independent partition 确保公平评估", "limitation": "数据集为特定任务设计,非通用 SER benchmark; HUME 数据集 test set blind (需提交至 competitions@hume.ai); MODULATE-STREAM 无 baseline (7000h 纯音频); 白皮书性质,无方法创新", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "Self-SupervisedSpeechRepresentation", "AudioUnderstanding", "TTSEvaluation"], "source": "Sources/HUME-VOCALBURST.pdf", "github": "", "demo": ""}, {"name": "LipToSpeech", "title": "Towards Accurate Lip-to-Speech Synthesis in-the-Wild", "arxiv_id": "2403.01087", "date": "2024-03", "venue": "ACM Multimedia 2023 (MM '23)", "org": "", "tier": "deep", "tags": ["lip-to-speech", "visual-speech", "multi-modal", "TTS", "lip-reading", "assistive-technology", "audio-visual"], "summary": "将 lip-to-speech 分解为 lip-to-text + visual-conditioned TTS,利用预训练 lip reading 模型的噪声文本输出和视觉特征,首次在 in-the-wild 多说话人场景下实现高质量、唇同步的语音合成", "route": "唇部视频 → VTP (lip-to-text, 预训练冻结) → 噪声文本 + 视觉特征 → Visual TTS (Text Encoder + Visual Encoder + Visual-Text Attention + Speaker Embedding + Spectrogram Decoder) → mel spectrogram → BigVGAN → 语音波形", "metrics": "LRS2 上 PESQ 1.47 / STOI 0.65 / ESTOI 0.47 / LSE-C 8.083 / LSE-D 6.586,全面超越 VCA-GAN/SVTS/Multi-task L2S;MOS 评估 intelligibility 3.49, content clarity 3.52, sync 3.82, overall 3.31 [Table 1, Table 2]", "takeaway": "(1) 利用相邻任务(lip-to-text)的成熟模型为更难任务(lip-to-speech)提供中间监督; (2) 视觉-文本注意力天然提供时序对齐,省去 duration predictor; (3) 视频帧与 mel 帧的固定倍率关系可直接上采样,无需学习 duration", "limitation": "依赖预训练 lip-to-text 模型(需文本监督训练);仅测试英语;唇读文本噪声(WER ~22.6%)会传播到语音输出;未开源完整训练代码", "concepts": ["SpeakerEmbedding", "MelSpectrogram", "DurationPredictor", "ProsodyModeling", "NeuralVocoder", "Non-autoregressiveTTS"], "source": "Sources/LipToSpeech.pdf", "github": "", "demo": ""}, {"name": "NaturalSpeech3", "title": "NaturalSpeech 3: Zero-Shot Speech Synthesis with Factorized Codec and Diffusion Models", "arxiv_id": "2403.03100", "date": "2024-03", "venue": "ICML 2024", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "diffusion", "factorization", "disentanglement", "codec", "discrete-diffusion", "non-autoregressive"], "summary": "提出 FACodec (属性分解 codec) + factorized discrete diffusion,将语音分解为 content/prosody/timbre/acoustic detail 四个子空间独立建模,首次在多说话人 LibriSpeech 上达到人类水平", "route": "Text → Phoneme Encoder → Duration Diffusion → Length Regulator → Prosody Diffusion → Content Diffusion → Detail Diffusion → FACodec Decoder (+ timbre from prompt) → Waveform", "metrics": "LibriSpeech Sim-O 0.67 / Sim-R 0.76 / WER 1.81 / CMOS 0.00 (=人类) / SMOS 4.01; RAVDESS MCD 4.28 / Acc 0.52 [Table 1, 2]", "takeaway": "(1) Factorized VQ: 按语音属性维度分解而非按残差分解; (2) 信息瓶颈 + GRL + detail dropout 三重解耦机制; (3) In-context learning 实现零样本属性迁移; (4) 离散 diffusion 的 mask-and-predict 公式统一各子空间生成", "limitation": "(1) 推理需 60 次 forward pass (4 个 diffusion x 4 iterations x 2 for CFG + duration),速度不如 AR 或 flow matching 方案; (2) FACodec 仅开源编码器,完整 TTS 系统未开源; (3) 分解的正交性缺乏理论保证", "concepts": ["SpeechFactorization", "Diffusion-basedTTS", "ResidualVectorQuantization", "Classifier-FreeGuidance", "GradientReversalLayer", "MaskedGenerativeModeling", "SpeechTokenizer"], "source": "Sources/NaturalSpeech3.pdf", "github": "", "demo": ""}, {"name": "AutomatedTTSDataset", "title": "An Automated End-to-End Open-Source Software for High-Quality Text-to-Speech Dataset Generation", "arxiv_id": "2402.16380", "date": "2024-02", "venue": "LREC-COLING 2024", "org": "", "tier": "deep", "tags": ["TTS", "dataset-generation", "data-quality", "phoneme-coverage", "ASR", "quality-assurance", "open-source", "recording-pipeline"], "summary": "提出首个开源端到端 TTS 数据集生成工具,集成 phoneme-balanced 选句、自动录音管理、ASR-based QA 和预处理,覆盖 6 种语言。", "route": "OPUS 语料库文本 → phoneme-balanced 迭代选句 → voice actor 录音(批量/单句) → VAD 分割 + ASR 匹配 → 两轮人工标注审核 → 格式化输出", "metrics": "句子匹配率 ~98% [Table 3]; 二次 QC 丢弃率 0-0.15% [Table 4]; 编辑率 1.25-11.38% [Table 4]; 6 语言各 30h 目标", "takeaway": "phoneme 分布驱动的迭代选句算法可迁移到任何需要平衡语音覆盖的场景; Whisper auto-correction 导致数据管线失败的教训值得注意", "limitation": "仍需专业 voice actor + 母语标注员团队; 规模受限(30h/语言 vs Emilia 100k+h); 无 MOS 等合成质量评估; 依赖 ASR 模型可用性(低资源语言受限)", "concepts": ["PhonemeRepresentation", "TTSEvaluation", "Text-to-SpeechPipeline"], "source": "Sources/AutomatedTTSDataset.pdf", "github": "", "demo": ""}, {"name": "BASETTS", "title": "BASE TTS: Lessons from building a billion-parameter Text-to-Speech model on 100K hours of data", "arxiv_id": "2402.08093", "date": "2024-02", "venue": "arXiv (Amazon AGI)", "org": "", "tier": "deep", "tags": ["TTS", "large-scale", "LLM-TTS", "emergent-abilities", "scaling", "discrete-speech-tokens", "WavLM", "BPE"], "summary": "1B 参数 GPT-2 + 100K 小时公共数据训练的最大 TTS 模型,验证了 TTS 中的 \"emergent abilities\" (10K+ hours / 500M+ params 时复杂韵律开始涌现) / Largest TTS model at 1B params trained on 100K hours of public data, demonstrating emergent abilities in TTS prosody at scale", "route": "Speech → WavLM → Content Regressor + Speaker Regressor → VQ → Speechcodes (+BPE) → SpeechGPT (GPT-2, 1B, AR, text+speechcodes joint modeling) → Speechcode Decoder (Conv+BigVGAN) → Waveform [§2, Fig 1-3]", "metrics": "MUSHRA 71.7-73.7 (seen/unseen, vs Tortoise 68.8, Bark 46-49, YourTTS 39-47) [Table 6]; WER 6.5% / SIM 92.7% (vs Bark 19.2/91.7, Tortoise 8.0/90.3, YourTTS 16.3/90.1) [Table 7]; Speechcode decoder 3x faster than diffusion decoder + streamable [§4.5]; Emergent abilities visible at BASE-medium (10K hrs, 400M params) [§4.3, Fig 4]", "takeaway": "(1) WavLM-based speaker-disentangled speechcodes — contrastive loss + gradient reversal 将 speaker info 推到 speaker embedding 侧,speechcode 只保留 phonetic+prosodic [§2.2.2, Fig 2]; (2) BPE on speechcodes — 序列长度减少 40%,使 AR Transformer 可处理更长音频 [§2.2.3]; (3) Speechcode decoder (Conv+BigVGAN) 替代 diffusion decoder — 3x 加速 + streamable + 质量不降 [§2.4, §4.2]; (4) \"Emergent abilities\" testset: 7 categories of challenging texts 作为 TTS benchmark [§3.3, Table 2]", "limitation": "偶有 hallucination/cutoff [§6]; 未开源 (ethical concerns) [§7]; 仅报告一种 speechcode 配置(WavLM)的完整结果 [§6]; ASR 生成的转录有噪声(已通过 text restoration 部分缓解) [§3.1]", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "SemanticvsAcousticTokens", "SpeakerEmbedding", "SpeechFactorization"], "source": "Sources/BASETTS.pdf", "github": "", "demo": ""}, {"name": "Daisy-TTS", "title": "Daisy-TTS: Simulating Wider Spectrum of Emotions via Prosody Embedding Decomposition", "arxiv_id": "2402.14523", "date": "2024-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "prosody", "diffusion", "embedding-decomposition", "structural-model-of-emotion", "style-control", "PCA"], "summary": "基于 Plutchik 结构情感模型,通过学习可分离韵律嵌入 + PCA 分解,实现一级/二级情感、强度和极性的组合式模拟", "route": "参考音频 (mel + pitch + energy) → Prosody Encoder + Emotion Discriminator → 情感可分离嵌入 u → PCA 分解为原型 → FiLM 条件注入 Grad-TTS encoder → diffusion decoder → mel → HiFi-GAN", "metrics": "MOS 3.456~3.844 vs baseline 2.822~3.356 (primary emotions); 一级情感识别率 33%~53% vs baseline 14%~53% [Table 1]; 强度缩放 MOS 最大跌幅仅 0.255 vs baseline 0.689 [Fig 4]", "takeaway": "(1) Emotion discriminator 强制韵律嵌入的情感可分离性 — 可推广到任何需要属性分离的 reference encoder; (2) PCA 分解实现线性组合/缩放/取反操控嵌入空间 — 通用的嵌入操控范式", "limitation": "仅在 ESD 10 说话人数据集验证; 二级情感识别率偏低 (10%~35%); 未与 Tang et al. (2023) 基于预训练 SER 的方法对比 (未开源); 仅支持 Plutchik 框架中的 4 种一级情感", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "GlobalStyleTokens", "SpeechFactorization", "Diffusion-basedTTS", "StyleTransferinTTS"], "source": "Sources/Daisy-TTS.pdf", "github": "", "demo": ""}, {"name": "FrameWiseBreath", "title": "Frame-Wise Breath Detection with Self-Training: An Exploration of Enhancing Breath Naturalness in TTS", "arxiv_id": "2402.00288", "date": "2024-02", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["TTS", "breath-detection", "self-training", "Conformer", "sound-event-detection", "naturalness", "semi-supervised", "pseudo-labeling"], "summary": "提出基于 Conformer + 自训练的帧级呼吸音检测模型,无需人工标注即可准确检测呼吸位置,提升 TTS 合成语音中呼吸音的自然度", "route": "语音 → MFA pause 检测 → 规则特征提取(Duration/ZCR/VMS/NA-VMS）→ 高精度初始标注 → Conformer+BiLSTM 检测模型 → 自训练伪标签迭代 → breath marks 插入文本 → VITS TTS 训练", "metrics": "呼吸检测 IoU 0.836 (vs 基线 0.710) [Table 3a]; MOS2 (呼吸自然度) 3.55 (vs VITS 3.34) [Table 4]", "takeaway": "(1) 规则高精度标注 + 自训练伪标签的半监督策略,可迁移到其他副语言发声检测; (2) Conformer + 下采样/上采样实现帧级检测的架构设计", "limitation": "(1) 推理时呼吸位置由 GT 语音检测给出,实际应用需额外的语言模型预测 breath marks; (2) 未区分吸气/呼气; (3) 仅在 LibriTTS-R (有声书) 上验证; (4) MOS1 整体自然度提升不显著 (3.37 vs 3.35)", "concepts": ["ProsodyModeling", "MelSpectrogram", "TTSEvaluation", "DurationPredictor"], "source": "Sources/FrameWiseBreath.pdf", "github": "", "demo": ""}, {"name": "Spirit-LM", "title": "Spirit-LM", "arxiv_id": "2402.05755", "date": "2024-02", "venue": "ICLR 2025", "org": "", "tier": "deep", "tags": ["speech-LM", "multimodal", "interleaving", "expressive-speech", "text-speech-alignment", "few-shot", "sentiment-preservation"], "summary": "在 LLaMA-2 7B 上通过 word-level speech-text interleaving 持续预训练,构建可自由混合文本和语音的基础模型;EXPRESSIVE 版本加入 pitch/style tokens 实现情感保持。", "route": "TextLM 初始化 + semantic tokens (HuBERT) + paralinguistic tokens (pitch VQ-VAE + style k-means) + word-level interleaved training", "metrics": "StoryCloze-S 61.0 (超 TWIST 55.4); Few-shot ASR WER 6.0 (LS-clean, +ASR+TTS); STSP sentiment preservation T->T 0.65 / S->S 0.54 (EXPRESSIVE, 6-shot)", "takeaway": "(1) Word-level interleaving 比 sentence-level parallel (ASR+TTS only) 和 word-level transcription 都更好,是跨模态对齐的关键; (2) 多速率 token 混合 (25Hz HuBERT + 12.5Hz pitch + 1Hz style) 的 timestamp-sorted 拼接方法简洁有效; (3) STSP benchmark 是一个可复用的表现力评估框架", "limitation": "(1) 语音质量依赖 HiFi-GAN vocoder 和 Expresso 4 speakers; (2) text 性能有 ~2pt 下降; (3) 仅英语; (4) 仅 7B 规模; (5) EXPRESSIVE 版本语义能力进一步下降 (~3pt on BLIMP-S)", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/SemanticvsAcousticTokens|Semantic vs Acoustic Tokens", "概念库/SpeechFactorization|Speech Factorization", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy", "概念库/EmotionControlinTTS|Emotion Control in TTS"], "source": "Sources/Spirit-LM.pdf", "github": "", "demo": ""}, {"name": "AudioSeal", "title": "AudioSeal: Proactive Detection of Voice Cloning with Localized Watermarking", "arxiv_id": "2401.17264", "date": "2024-01", "venue": "ICML 2024", "org": "", "tier": "deep", "tags": ["audio-watermarking", "deepfake-detection", "voice-cloning", "localization", "proactive-detection", "perceptual-loss"], "summary": "首个专为 AI 语音 localized detection 设计的音频水印方法,通过 generator/detector 联合训练实现采样级水印定位,检测速度比 WavMark 快两个数量级", "route": "原始音频 → Generator (EnCodec-based encoder-decoder) → 加性水印波形 δ → 叠加到原始音频 → 增强/遮蔽 → Detector (EnCodec encoder + 线性层) → 逐采样检测概率 [0,1]^T + 可选 k-bit attribution", "metrics": "平均检测 AUC 0.97 vs WavMark 0.84 (15 种音频编辑); IoU 0.99 @ 1s 水印段 vs WavMark 0.35; 检测速度 485x 快于 WavMark (无水印时); MUSHRA 77.07 vs WavMark 71.52 [Table 1, 3, Fig 5, 6]", "takeaway": "(1) TF-Loudness 损失 -- 利用听觉掩蔽在时频域自适应分配水印强度; (2) 水印遮蔽增强策略 -- 随机遮蔽/替换训练数据的水印段,迫使 detector 学会 localize; (3) 将 detection 与 attribution 解耦 -- 一个 detector 同时输出检测分数和 k-bit 消息,避免多次前向传播", "limitation": "(1) 高通滤波鲁棒性差 (AUC 0.61 @ 1500Hz cutoff),因为 TF-Loudness 倾向在低频嵌入水印; (2) 白盒攻击可轻松破解 (检测错误率 80%+ while PESQ>4),detector 权重必须保密; (3) 仅在 16kHz 单声道训练,未验证高采样率场景", "concepts": ["Anti-spoofingandDeepfakeDetection", "CodecTrainingObjectives"], "source": "Sources/AudioSeal.pdf", "github": "", "demo": ""}, {"name": "MultiTaskFrontEnd", "title": "Multi-Task Learning for Front-End Text Processing in TTS", "arxiv_id": "2401.06321", "date": "2024-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "front-end", "text-normalization", "POS-tagging", "homograph-disambiguation", "multi-task-learning", "ALBERT"], "summary": "用 shared trunk + task-specific heads 的 MTL 架构联合学习 TN/POS/HD 三个 TTS 前端任务,证实了任务间正向迁移;附带发布了 Llama 2 生成的平衡 HD 数据集", "route": "Text → [TN tokenizer → Char Emb → Bi-LSTM → Transformer] + [ALBERT layer 1 embeddings] → Cross-Attention → Shared trunk output → Task-specific heads (TN: token-level rule classification; POS: word-level tag prediction; HD: homograph pronunciation classification + ALBERT layer 12 skip connection)", "metrics": "TN line acc 86.93% / WER 2.40% (内部数据集); POS acc 97.18% (SwDA); HD macro acc 93.10% (Wikipedia) / 93.56% (Llama 2 balanced) [Table 1]; Llama 2 数据集带来 HD +9% 绝对提升 [Table 2]", "takeaway": "(1) 预训练 LM 不同层提供不同类型信息——浅层(句法)给 TN/POS、深层(语义/上下文)给 HD 的分层利用策略; (2) 用 LLM 生成 balanced dataset 解决标注不均衡问题的方法论", "limitation": "仅针对 American English,无多语言验证; TN 使用内部规则集(106 rules)不可复现; 数据集(TN/POS)部分为内部数据; POS tagging 在 MTL 中反而轻微下降(helper task 自身被\"伤害\"); 无与端到端前端方案的对比", "concepts": ["Text-to-SpeechPipeline", "PhonemeRepresentation"], "source": "Sources/MultiTaskFrontEnd.pdf", "github": "", "demo": ""}, {"name": "MunTTS", "title": "MunTTS: A Text-to-Speech System for Mundari", "arxiv_id": "2401.15579", "date": "2024-01", "venue": "", "org": "", "tie
