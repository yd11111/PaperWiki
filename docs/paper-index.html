<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperWiki — 论文索引</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2129;
    --surface3: #21262d;
    --border: #30363d;
    --border-light: #3d444d;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #656d76;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --tag-bg: #1f2a3a;
    --tag-text: #79c0ff;
    --hover: #1c2433;
    --deep: #3fb950;
    --repro: #d2a8ff;
    --card: #8b949e;
    --enhanced-card: #f0883e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }
  .header { padding: 40px 48px 32px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
  .header h1 span { color: var(--accent); }
  .header .subtitle { color: var(--text2); font-size: 14px; }
  .stats {
    display: flex; gap: 32px; padding: 20px 48px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .stat-item { display: flex; flex-direction: column; align-items: center; }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
  .controls {
    display: flex; gap: 12px; padding: 16px 48px;
    align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border);
  }
  .search-box { flex: 1; min-width: 240px; max-width: 400px; position: relative; }
  .search-box input {
    width: 100%; padding: 8px 12px 8px 36px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text2);
  }
  .filter-group {
    display: flex; gap: 4px; background: var(--surface);
    border-radius: 6px; padding: 2px; border: 1px solid var(--border);
  }
  .filter-btn {
    padding: 6px 14px; font-size: 13px; border: none; background: none;
    color: var(--text2); border-radius: 4px; cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { color: var(--text); background: var(--surface2); }
  .filter-btn.active { background: var(--accent); color: #fff; }
  .sort-select {
    padding: 7px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer; outline: none;
  }
  .result-count { font-size: 13px; color: var(--text2); margin-left: auto; }
  .paper-list { padding: 8px 48px 48px; }
  .paper-item {
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    background: var(--surface); transition: border-color 0.15s; overflow: hidden;
  }
  .paper-item:hover { border-color: var(--border-light); }
  .paper-main {
    display: flex; align-items: flex-start; padding: 16px 20px; cursor: pointer; gap: 16px;
  }
  .expand-icon {
    color: var(--text3); font-size: 11px; margin-top: 7px;
    transition: transform 0.2s; flex-shrink: 0; width: 12px;
  }
  .paper-item.expanded .expand-icon { transform: rotate(90deg); }
  .paper-head { flex: 1; min-width: 0; }
  .title-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .paper-name { font-size: 20px; font-weight: 700; color: var(--text); white-space: nowrap; flex-shrink: 0; }
  .paper-title { font-size: 14px; color: var(--text2); font-weight: 400; line-height: 1.4; }
  .meta-line {
    display: grid;
    grid-template-columns: 64px 180px 80px 56px 1fr;
    align-items: center; gap: 8px; margin-top: 8px;
  }
  .meta-date { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
  .meta-org {
    font-size: 12px; color: var(--accent2); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meta-venue {
    font-size: 12px; color: var(--text3); padding: 1px 8px;
    background: var(--surface3); border-radius: 4px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .tier {
    display: inline-block; padding: 1px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .tier-deep { background: rgba(63,185,80,0.15); color: var(--deep); }
  .tier-repro { background: rgba(210,168,255,0.15); color: var(--repro); }
  .tier-card { background: rgba(139,148,158,0.15); color: var(--card); }
  .tier-enhanced-card { background: rgba(240,136,62,0.15); color: var(--enhanced-card); }
  .tags-inline { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    display: inline-block; padding: 1px 8px;
    background: var(--tag-bg); color: var(--tag-text);
    border-radius: 10px; font-size: 11px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .tag:hover { background: rgba(88,166,255,0.25); }
  .tag.active { background: var(--accent); color: #fff; }
  .paper-links {
    display: flex; gap: 6px; flex-shrink: 0; align-items: center; margin-top: 4px;
  }
  .link-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px; border-radius: 5px; font-size: 12px;
    text-decoration: none; transition: all 0.15s; white-space: nowrap;
    border: 1px solid var(--border); color: var(--text2); background: none;
  }
  .link-btn:hover { border-color: var(--accent); color: var(--accent); }
  .link-btn.disabled { opacity: 0.25; pointer-events: none; }
  .link-btn svg { width: 14px; height: 14px; }
  .paper-detail { display: none; padding: 0 20px 20px 44px; }
  .paper-item.expanded .paper-detail { display: block; }
  .card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 20px 24px;
  }
  .card-row { display: flex; gap: 8px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
  .card-row:last-child { margin-bottom: 0; }
  .card-label { flex-shrink: 0; font-weight: 600; color: var(--accent); min-width: 56px; }
  .card-value { color: var(--text); }
  .card-route {
    color: var(--text2); font-family: "SF Mono", "Fira Code", monospace;
    font-size: 12px; word-break: break-all;
  }
  .card-concepts {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px;
    padding-top: 14px; border-top: 1px solid var(--border);
  }
  .card-concepts-label {
    font-size: 11px; color: var(--text3); text-transform: uppercase;
    letter-spacing: 0.5px; width: 100%; margin-bottom: 2px;
  }
  .concept-chip {
    padding: 2px 10px; background: rgba(210,168,255,0.1);
    color: var(--repro); border-radius: 10px; font-size: 12px;
  }
  .empty-state { text-align: center; padding: 64px 0; color: var(--text2); font-size: 14px; display: none; }
  @media (max-width: 900px) {
    .header, .stats, .controls, .paper-list { padding-left: 16px; padding-right: 16px; }
    .stats { flex-wrap: wrap; gap: 16px; }
    .paper-main { flex-direction: column; }
    .paper-links { margin-top: 8px; }
    .title-line { flex-direction: column; gap: 4px; }
    .paper-name { font-size: 17px; }
    .meta-line { grid-template-columns: 64px 1fr; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Paper<span>Wiki</span> 论文索引</h1>
  <div class="subtitle">TTS / Speech / Audio 方向论文知识库</div>
</div>

<div class="stats">
  <div class="stat-item"><div class="stat-num">526</div><div class="stat-label">论文总数</div></div>
  <div class="stat-item"><div class="stat-num">514</div><div class="stat-label">Deep</div></div>
  <div class="stat-item"><div class="stat-num">7</div><div class="stat-label">Repro</div></div>
  <div class="stat-item"><div class="stat-num">5</div><div class="stat-label">Card</div></div>
  <div class="stat-item"><div class="stat-num">8</div><div class="stat-label">跨越年份</div></div>
</div>

<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06l-3.04-3.04Z"/></svg>
    <input type="text" id="searchInput" placeholder="搜索论文名、标签…">
  </div>
  <div class="filter-group" id="tierFilter">
    <button class="filter-btn active" data-tier="all">全部</button>
    <button class="filter-btn" data-tier="deep">Deep</button>
    <button class="filter-btn" data-tier="repro">Repro</button>
    <button class="filter-btn" data-tier="card">Card</button>
  </div>
  <select class="sort-select" id="sortSelect">
    <option value="date-desc">日期 ↓ 新→旧</option>
    <option value="date-asc">日期 ↑ 旧→新</option>
    <option value="name-asc">名称 A→Z</option>
    <option value="name-desc">名称 Z→A</option>
  </select>
  <div class="result-count" id="resultCount"></div>
</div>

<div class="paper-list" id="paperList"></div>
<div class="empty-state" id="emptyState">没有匹配的论文</div>

<script>
const PAPERS = [{"name": "AnyAudio-Judge", "title": "AnyAudio-Judge: A Dynamic Rubric-Based Benchmark and Evaluator for Audio Instruction Following", "arxiv_id": "2606.03116", "date": "2026-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["evaluation", "audio-judge", "rubric-based", "instruction-following", "LALM", "GRPO", "reward-model", "benchmark"], "summary": "提出 dynamic rubric-based evaluation 范式,将复杂音频指令分解为可验证的二值 rubric items 逐项评估,配套 7,920 样本四域 benchmark + 105K 样本训练语料 + 专用 judge 模型,还可作为 InstructTTS RL 的 reward model", "route": "instruction → LLM 分解为 n 个 binary rubric items → LALM judge 逐项评估 yes/no logits → softmax 归一化 → 平均概率得到对齐分数", "metrics": "Bench 上 zh avg ACC 85.26 / en avg ACC 84.45 (超越 Gemini-2.5-Pro zh 78.31 / en 77.27); PAM 外部 benchmark LCC 0.614 / SRCC 0.601 (超越 CLAPScore 0.472/0.477); InstructTTS RL 后 Gemini Score 69.6→72.9, 人类偏好 Win 34.6%", "takeaway": "(1) dynamic rubric 分解思路可迁移到任何 instruction-following 评估场景; (2) hard negative 构造 pipeline (instruction swapping + attribute perturbation) 是通用的 benchmark 建设方法论; (3) SFT→GRPO 两阶段训练 judge model 的范式; (4) rubric-level 概率聚合比 holistic scoring 更 interpretable", "limitation": "rubric 分解质量依赖 LLM (Qwen3),分解不完美会遗漏隐含约束或过度拆分; rubric 生成引入额外推理时间; 仅在自建 benchmark + PAM 上验证,缺乏更多外部 benchmark 交叉验证; reward model 下游 RL 仅用 DiTAR 一个模型验证", "concepts": ["TTSEvaluation", "Audio-LanguagePretraining", "Instruction-GuidedSpeechSynthesis", "AudioUnderstanding"], "source": "Sources/AnyAudio-Judge.pdf", "github": "", "demo": ""}, {"name": "AudioInteractionModel", "title": "Audio Interaction Model", "arxiv_id": "2606.05121", "date": "2026-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["streaming", "audio-LM", "interaction", "proactive", "full-duplex", "unified-model", "real-time", "FIFO-inference"], "summary": "将离线 Large Audio Language Model 转为 always-on 流式交互模型,通过 perceive-decide-respond 循环在每个 400ms chunk 决定沉默或响应,统一对话/ASR/翻译/主动响应等 7 大类 28 子任务", "route": "连续音频流 → Audio Encoder (chunk-wise 400ms) → Adapter → Qwen2.5-Omni-3B (LLM) → 每步预测 <silent>/<response> + 文本响应; FIFO 异步推理解耦编码与解码", "metrics": "MMAU 58.15 (vs Qwen2.5-Omni-3B 57.81), CoVoST2 en-zh BLEU 55.22 (+15.72), ProactiveSound-Bench 61.2/62.8 (Sin./Mul.), 首帧延迟 392ms [Table 1-5]", "takeaway": "(1) FIFO 异步推理 -- 编码器持续入队,解码器按需出队,消除 stall 并降低首帧延迟 4.5x; (2) 层次化事件策划 -- LLM 规划场景+事件细化+clip grounding 构造语义一致的流式训练数据; (3) 双目标训练 L = L_LM + λ*L_stream 给流控 token 独立优化头; (4) 综合性 silence 训练 -- history review + 验证后静音数据抑制 false triggering", "limitation": "(1) 仅 3B 参数,对话质量不及 7B omni models (Alpaca 4.28 vs Qwen2.5-Omni-7B 4.49); (2) 无语音输出(text-only response),不是端到端 speech-to-speech; (3) StreamAudio-2M 由合成语音(CosyVoice)构造,非真实交互数据; (4) ProactiveSound-Bench 仅 644 样本,较小", "concepts": ["Full-duplexSpokenDialogue", "StreamingSpokenDialogue", "SpeechLanguageModel", "Turn-takinginSpokenDialogue", "AudioUnderstanding"], "source": "Sources/AudioInteractionModel.pdf", "github": "", "demo": ""}, {"name": "Cognitive-State-ConditionedTTS", "title": "CoSTA: Cognitive-State-Conditioned TTS Data Augmentation Using ASR Transcripts for Alzheimer's Disease Detection", "arxiv_id": "2606.06170", "date": "2026-06", "venue": "Interspeech 2026", "org": "", "tier": "deep", "tags": ["TTS", "data-augmentation", "Alzheimer-disease", "AD-detection", "speech-pathology", "CosyVoice2", "F5-TTS", "ASR"], "summary": "用认知状态条件化的 CosyVoice2/F5-TTS 合成 AD/HC 语音做数据增强,配合 ASR 转录文本池,将 ADReSS 检测准确率提升 4.16% 至 85.83%", "route": "ASR 模型集合 → 36 种转录文本 + MT → CS-Cond TTS (CosyVoice2 instruction/F5-TTS cognition label) → 合成语音 → 与原始数据混合 → WavLM-based AD 检测器", "metrics": "85.83% accuracy (ADReSS test, audio-only) vs 81.67% baseline (+4.16%); CS-Cond CosyVoice2 MCD 5.436 vs pretrained 6.854 (AD) [Table 1]; 最优增强倍率 2x [Fig 3]", "takeaway": "(1) 用 instruction fine-tuning 实现病理语音条件化的最小改动方案; (2) ASR 错误作为\"有益噪声\"的数据增强思路; (3) 多 ASR 模型集合构建转录文本多样性", "limitation": "仅验证于 ADReSS 单一数据集 (108 训练 / 48 测试); 仅二分类 (AD vs HC); TTS 模型的病理特征保真度未深入分析; 过度增强 (>2.5x) 导致性能下降", "concepts": ["ConditionalFlowMatching", "Instruction-GuidedSpeechSynthesis", "LLM-basedTTS", "NaturalLanguageDescriptionforTTS"], "source": "Sources/Cognitive-State-ConditionedTTS.pdf", "github": "", "demo": ""}, {"name": "DUET", "title": "DUET: Unified Dual-Space Emotion Control for Diffusion/Flow TTS", "arxiv_id": "2606.00066", "date": "2026-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["emotion-control", "TTS", "diffusion", "flow-matching", "activation-steering", "plug-and-play", "training-free", "classifier-guidance"], "summary": "发现预训练 diffusion/flow-matching TTS 的 hidden states 中情感方向与说话人方向近正交,由此设计双空间 plug-and-play 情感控制框架 — hidden space steering 偏移韵律轨迹 + mel-space guidance 经可微 vocoder 修正频谱细节", "route": "冻结 TTS backbone → linear probe 找到情感最可分层 l* 和判别方向 de → 每步去噪: (1) hidden state 沿 de steering (norm-adaptive) → (2) clean mel estimate 经 Vocos 反传 SER 梯度修正 → 下一步", "metrics": "ESD 上 DUET+GradTTS Avg 75.5% vs 最强 baseline Qwen3-TTS 46.8% (+28.7%); 主观 EMOS 3.93 (最高), NMOS 3.83 [Table 1, Table 3]", "takeaway": "(1) linear probe 同时检测情感可分层 + 验证 speaker/emotion 正交性的方法论; (2) norm-adaptive steering (perturbation 按 ||h|| 缩放) 解决去噪步间尺度变化问题; (3) cosine-scheduled guidance + trust-region 约束组合,控制梯度介入的时间窗口和步长上限", "limitation": "仅支持离散类别情感 (angry/happy/sad); angry 表现显著弱于 happy/sad (仅达 GT ceiling 的 49%); 未验证连续 arousal-valence 控制; 需要少量情感标注语音做 probing (~数千条); 代码/模型未开源", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "Diffusion-basedTTS", "Classifier-FreeGuidance", "MelSpectrogram", "NeuralVocoder"], "source": "Sources/DUET.pdf", "github": "", "demo": ""}, {"name": "EntityBindingFailures", "title": "Entity Binding Failures in Speech LLM Reasoning: Diagnosis and Chain-of-Thought Intervention", "arxiv_id": "2606.04474", "date": "2026-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "reasoning", "entity-binding", "chain-of-thought", "modality-gap", "evaluation", "benchmark"], "summary": "揭示 Speech LLM 的 S2T/T2T modality gap 不是均匀认知缺陷,而是高度集中于需要 entity tracking 的逻辑推理任务;提出 EA-CoT 通过强制外化 entity-property 绑定修复该瓶颈,最高提升 24.4 pp", "route": "speech/text input → SLLM (Qwen2.5-Omni / Phi-4-MM) → [EA-CoT prompt: entity enumeration → claim recording → step-by-step reasoning → answer] → output (1024 tokens)", "metrics": "web of lies S2T: Phi-4 50.8% → 75.2% (+24.4 pp), Qwen 52.8% → 69.6% (+16.8 pp); gap 从 40.8 pp 缩减到 12.0 pp (Phi-4) [Table 1]", "takeaway": "(1) 按推理类别精细拆分 modality gap 的诊断方法论; (2) EA-CoT 的 entity enumeration 策略可迁移到任何需要 entity tracking 的 speech reasoning 场景; (3) token budget control 实验设计消除混淆变量", "limitation": "仅 7B 级模型 + TTS 合成语音评估,未测试真实噪声语音; EA-CoT 约 3x 推理延迟; 4 个 BBH 类别覆盖有限; 无训练时改进方案", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "ModalityAdaptationforSpeechLLM"], "source": "Sources/EntityBindingFailures.pdf", "github": "", "demo": ""}, {"name": "SparseAutoencoderEmotion", "title": "Sparse Autoencoders for Interpretable Emotion Control in Text-to-Speech", "arxiv_id": "2606.01479", "date": "2026-06", "venue": "ICML 2026", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "sparse-autoencoder", "activation-steering", "interpretability", "LLM-TTS", "training-free", "IndexTTS2"], "summary": "用 Sparse Autoencoder 将 LLM-TTS semantic backbone 的 residual stream 分解为稀疏可解释特征,通过调制少量情感相关 latent features 实现无需训练的双向情感控制(诱导+抑制）", "route": "文本+参考 → IndexTTS2 AR semantic backbone → 拦截 layer-16 residual stream → SAE 编码为稀疏 latent (4096 维, Top-32 active) → 调制 top-6 情感选择性 features → SAE 解码回 residual → CFM + vocoder → 音频", "metrics": "Emo-SIM 0.912/0.885/0.880 (anger/happiness/sadness induction, 最高或次高) [Table 1]; EMOS 3.22, NMOS 3.49 (人类评估最高) [Table 2]; F0 +23.11 Hz (p=1.07e-4) [Table 4]; WER 0.3% (anger induction, 极低) [Table 1]", "takeaway": "(1) sentence-level selectivity score 比 magnitude-based 和 token-level 选择更可靠 (Table 3); (2) SAE 可一次训练、推理时零成本切换情感; (3) dead latent 问题的 auxiliary residual projection loss 解法", "limitation": "仅在单一 backbone (IndexTTS2) 上完整验证; 仅 3 类离散情感 (anger/happiness/sadness); SAE 训练需收集大量 backbone activations (56k 生成); 未验证连续 AV 控制或混合情感", "concepts": ["EmotionControlinTTS", "LLM-basedTTS", "ConditionalFlowMatching", "ProsodyModeling", "SemanticvsAcousticTokens"], "source": "Sources/SparseAutoencoderEmotion.pdf", "github": "", "demo": ""}, {"name": "UAT", "title": "UAT: Unified Audio-Text Diffusion for Audio Generation, Editing, and Captioning", "arxiv_id": "2606.04939", "date": "2026-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["unified-audio", "text-to-audio", "audio-editing", "audio-captioning", "diffusion", "masked-diffusion", "dual-stream", "DiT"], "summary": "在预训练 TTA diffusion backbone 上增加轻量文本流,用 continuous audio diffusion + masked discrete text diffusion 实现首个 diffusion-centric 统一音频生成/编辑/字幕框架", "route": "Text → frozen T5-Base encoder → text stream; Audio → frozen VAE encoder → audio latent → audio stream; 双流在 24-block DiT 中逐层双向交互 → audio diffusion head (velocity prediction) + text diffusion head (masked token reconstruction) → VAE decode / token decode", "metrics": "TTA generation: IS 12.47 / FD 14.47 / FAD 2.87 / CLAP 0.491 (AudioCaps, unified SOTA); Captioning: CIDEr 0.406 / SPIDEr 0.272 / SBERT-SIM 0.572 (AudioCaps); Human eval OVL 4.260 / REL 4.260 (接近 GT 4.347/4.407) [Table 1-4]", "takeaway": "(1) 在已有 TTA diffusion backbone 上用最小改动(加轻量文本流)引入理解能力,而非从头训练统一模型 — retrofit 策略的成本远低于 from-scratch 训练; (2) continuous + discrete diffusion 的耦合机制: 音频流先更新,文本流以更新后的音频为条件再更新,形成因果链; (3) 文本 refiner (3-layer self-attention) 在 caption head 前精化表征,提升 captioning 无需改动 backbone", "limitation": "(1) captioning 与大型 AR audio-language models (Audio Flamingo 3, 9B) 仍有差距; (2) 仅验证了 audio captioning,未扩展到 QA/reasoning 等更复杂理解任务; (3) 生成质量受限于底层 AudioX backbone; (4) 1.7B 参数,相对于 UNISON (621-732M) 参数效率不高; (5) 未开源", "concepts": ["ConditionalFlowMatching", "DiffusionModel", "MaskedGenerativeModeling", "AudioUnderstanding", "Classifier-FreeGuidance", "Diffusion-basedTTS"], "source": "Sources/UAT.pdf", "github": "", "demo": ""}, {"name": "UniVocal", "title": "UniVocal: Unified Speech-Singing Code-Switching Synthesis", "arxiv_id": "2606.01677", "date": "2026-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "SVS", "code-switching", "speech-singing", "curriculum-learning", "CoT", "pitch-modeling", "data-synthesis"], "summary": "在 CosyVoice 2 基础上通过 refined cent token (1200-bin 音高离散化) + CoT interleaved generation + 两阶段 curriculum learning,实现从文本语义自动推断语音/歌声模式切换 (SCS)", "route": "Text + Instruction → Causal Transformer LM (交替生成 cent token → semantic token) → Flow Matching (+ cent embedding 条件) → HiFi-GAN → Waveform", "metrics": "SCSBench-Mixed F1(O) 0.871 / F1(S) 0.810 (超越级联 baseline); SeedTTS-EN UTMOS 4.21 (第一); Empathy E-MOS 2.26 接近 ElevenLabs 2.30; GTsinger WER 18.07 (第一) [Table 1-4]", "takeaway": "(1) 用 modulo-1200 将 F0 投影到单八度 cent 空间,1 cent 量化误差 ~0.08% 频率偏差,兼顾语音韵律和歌声旋律; (2) CoT 式 interleaved token 生成让 LM 先 \"plan\" pitch 再生成 content; (3) LLM 生成语义脚本 + stage-1 模型合成音频的 SCS 数据构造 pipeline", "limitation": "(1) 歌声训练数据依赖 Suno 合成歌曲,electronic tone 和歌词对齐问题限制了声学保真度上限; (2) 纯 implicit cue 场景切换成功率低 (Implicit-Only 部分失败); (3) 真实 SCS 场景泛化需要 explicit trigger (Real SCS F1 0.201 → Enhanced 0.730)", "concepts": ["ConditionalFlowMatching", "SemanticvsAcousticTokens", "F0Modeling", "SingingVoiceSynthesis", "LLM-basedTTS", "ProsodyModeling", "Instruction-GuidedSpeechSynthesis"], "source": "Sources/UniVocal.pdf", "github": "", "demo": ""}, {"name": "VoxCPM2", "title": "VoxCPM2: Multilingual and Controllable Hierarchical Diffusion-Autoregressive Speech Generation", "arxiv_id": "2606.06928", "date": "2026-06", "venue": "arXiv preprint", "org": "", "tier": "repro", "tags": ["TTS", "hierarchical-modeling", "flow-matching", "tokenizer-free", "semi-discrete", "multilingual", "controllable", "zero-shot"], "summary": "VoxCPM 的 2B 参数多语言可控版本,通过统一序列组织将 basic TTS / voice design / controllable cloning / continuation cloning 统一在同一个分层连续 latent backbone 中", "route": "Text(BPE) → TSLM(MiniCPM-4-1B, 28L) → FSQ(512-dim) → RALM(8L, NoPE) → LocDiT(12L, multi-token prefix) → AudioVAE V2 decoder(48kHz); optional: Reference audio → VAE encode → delimited prefix segment", "metrics": "Seed-TTS-Eval EN-WER 1.84% / ZH-CER 0.97% / SIM 75.3/79.5; CV3-Eval hard-zh 8.55% hard-en 8.48%; InstructTTSEval APS 55.0 / DSD 67.5 / RP 78.8 [Table 3, 5]", "takeaway": "(1) 统一序列组织 — 不同任务只是输入 building blocks 的不同排列; (2) concat-projection fusion 替代 sum; (3) Multi-token LocDiT prefix 避免 early information collapse; (4) 非对称 VAE encode@16kHz / decode@48kHz 做隐式超分; (5) NoPE for RALM 提升长序列稳定性", "limitation": "SIM 不如 dots.tts (75.3 vs 79.2 avg); controllable cloning 的指令遵循精度仍有限(DSD 67.5%); 2M 小时内部数据不可复现", "concepts": ["FiniteScalarQuantization", "ConditionalFlowMatching", "LLM-basedTTS", "SemanticvsAcousticTokens", "SpeechTokenizer", "Classifier-FreeGuidance", "VariationalAutoencoderforTTS", "Next-TokenDiffusion"], "source": "Sources/VoxCPM2.pdf", "github": "", "demo": ""}, {"name": "WavTTS", "title": "WavTTS: Towards High-Quality Zero-Shot TTS via Direct Raw Waveform Modeling", "arxiv_id": "2606.03455", "date": "2026-06", "venue": "arXiv", "org": "", "tier": "repro", "tags": ["TTS", "flow-matching", "waveform-generation", "end-to-end", "zero-shot", "diffusion-transformer", "NAR"], "summary": "首个在原始波形空间上用 flow matching + DiT 实现接近 SOTA 水准的零样本 TTS 系统,消除了对 vocoder/VAE/codec 的依赖", "route": "Text + Audio Prompt → ConvNeXt V2 encoder + Patchified waveform (F=160) → DiT (flow matching, x-prediction) → Unpatchify → Raw waveform (16kHz)", "metrics": "Seed-TTS test-en WER 1.50% (best) / SIM-o 0.65 / UTMOS 3.92 (best); test-zh CER 1.59% / SIM-o 0.73 [Table 1]", "takeaway": "Signal-noise variance alignment (k=9) 解决波形低方差与 Gaussian prior 的 20dB SNR 失配; PolyShift 推理时间表; x-prediction + multi-scale mel loss 组合", "limitation": "Speaker similarity 仍落后于 latent 模型 (0.65 vs ZipVoice 0.70); 仅 16kHz; 50 NFE 推理步; 需 100K 小时数据 + 673M 参数才有竞争力", "concepts": ["ConditionalFlowMatching", "Diffusion-basedTTS", "Non-autoregressiveTTS", "Classifier-FreeGuidance", "NeuralVocoder", "MelSpectrogram"], "source": "Sources/WavTTS.pdf", "github": "", "demo": ""}, {"name": "Zero-shotCross-lingualSER", "title": "Learning Emotion-discriminative Representations for Zero-Shot Cross-lingual Speech Emotion Recognition", "arxiv_id": "2606.06200", "date": "2026-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-emotion-recognition", "cross-lingual", "zero-shot", "contrastive-learning", "adversarial-training", "disentanglement", "wav2vec2"], "summary": "通过 language-aware supervised contrastive learning + GRL speaker adversarial learning 学习情感判别性表征,实现零样本跨语言 SER", "route": "多语言情感语音 → wav2vec 2.0 (LoRA fine-tune) → mean pooling → [supervised contrastive loss + speaker adversarial loss + CE loss] → emotion classifier", "metrics": "9 设定平均 UAR 82.26% / F1 81.96%,比仅用多语言数据的 Baseline 2 提升 +9.05% UAR / +9.38% F1 [Table 2]", "takeaway": "language-aware weighting (跨语言同情感对赋予更高权重 lambda=2.5) + hierarchical batch sampling (语言x情感x样本) 的组合策略,可迁移到任何跨语言表征对齐任务", "limitation": "仅验证 4 类离散情感 (happy/angry/sad/neutral),未涉及连续 AV 维度;目标语言测试集极小 (EMO-DB 38 条, CaFE 42 条, URDU 80 条);未与 LLM-based SER 或大规模多语言 SSL 方法对比", "concepts": ["GradientReversalLayer", "SpeechFactorization", "Self-SupervisedSpeechRepresentation"], "source": "Sources/Zero-shotCross-lingualSER.pdf", "github": "", "demo": ""}, {"name": "dots.tts", "title": "dots.tts: A 2B-Parameter Continuous Autoregressive TTS Foundation Model", "arxiv_id": "2606.07080", "date": "2026-06", "venue": "arXiv preprint", "org": "", "tier": "repro", "tags": ["TTS", "continuous-AR", "flow-matching", "self-corrective-alignment", "MeanFlow-distillation", "zero-shot", "end-to-end", "LLM-based"], "summary": "2B 参数连续 AR TTS,通过语义 AudioVAE + 全历史条件 AR-FM head + SOAR 自修正后训练三项设计,在 Seed-TTS-Eval 上取得所有已报告系统的最优平均性能", "route": "Text(BPE) → LLM(Qwen2.5-1.5B, 6.25Hz) → AR-FM head(18L DiT, full-history conditioning) → 25Hz VAE latent patches → Semantic Encoder(24L, 4x downsample) → feedback to LLM; AudioVAE decoder(BigVGAN) → 48kHz waveform", "metrics": "Seed-TTS-Eval avg WER 2.95% / SIM 79.2 (SOAR); MF NFE=4 avg WER 2.94% / SIM 78.2; MiniMax 24-lang avg SIM 83.9 [Table 2, 3]", "takeaway": "(1) SOAR 奖励免费自修正后训练 — 用模型自己的 off-trajectory 状态做监督,不需要 reward model; (2) CFG-aware MeanFlow 蒸馏 — 将 CFG 融入蒸馏目标,推理时只需 1 次 forward; (3) Block-causal 并行训练让 AR-FM 的训练 forward 与逐步推理数值一致; (4) 语义 encoder 做 LLM 反馈的信息瓶颈,防止 acoustic detail 干扰全局规划", "limitation": "多语言 WER 被低资源语言拖累(BPE 覆盖不足); 1.5M 小时内部数据不可复现; 开源 Emilia-only 结果有差距; 无显式韵律/情感控制", "concepts": ["ConditionalFlowMatching", "LLM-basedTTS", "SemanticvsAcousticTokens", "SpeechTokenizer", "Classifier-FreeGuidance", "VariationalAutoencoderforTTS"], "source": "Sources/dots.tts.pdf", "github": "", "demo": ""}, {"name": "AffectCodec", "title": "AffectCodec: Emotion-Preserving Neural Speech Codec for Expressive Speech Modeling", "arxiv_id": "2605.11098", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["audio-codec", "emotion-preservation", "RVQ", "knowledge-distillation", "semantic-alignment", "speech-emotion-recognition", "expressive-TTS"], "summary": "首个将情感保留作为一阶优化目标的 neural speech codec,通过情感-语义引导调制、关系保持蒸馏和情感加权语义对齐三阶段框架,在 RVQ 离散化过程中显式保护情感信息", "route": "Speech → Acoustic Encoder → EG-Latent Modulation (cross-attn with frozen CLAP emotion + HuBERT semantic) → RVQ (8 layers, 1024 entries) → RP-Distill (relational geometry alignment on Q1) + EW-Align (emotion-weighted token-text alignment on Q1) → Decoder → Waveform", "metrics": "Reconstruction: Emo SIM 0.94 / PESQ 3.04 / UTMOS 3.68 (均 best) [Table 2]; EMO-SUPERB: 5/6 datasets best/2nd [Table 3]; Zero-shot TTS: Emo_SIM 0.91 (EmoVoiceDB) / 0.84 (SECAP) (均 best) [Table 4]", "takeaway": "(1) 用 frozen emotion encoder (CLAP-LAION) 的帧级特征做 cross-attention 调制 acoustic latent; (2) 帧级情感差分 (||e_t - e_{t-1}||) 作为 attention-reweighting 权重,让情感变化大的帧获得更强语义对齐监督; (3) 关系蒸馏用 pairwise distance 而非 feature matching, 更好保持 topological structure", "limitation": "(1) 训练数据仅 2.3K 小时,远小于 WavTokenizer (80K h) 等; (2) 44M 参数 + 4 个 frozen teacher (CLAP + wav2vec 2.0 + BERT + HuBERT),训练计算开销显著; (3) Limitations 节仅讨论效率,未讨论情感类别覆盖范围和跨语言泛化; (4) 代码/模型未公开发布 (截至论文发表); (5) NNIME 中文数据集表现低于最强 baseline,跨语言情感保持仍有挑战", "concepts": ["ResidualVectorQuantization", "SpeechTokenizer", "EmotionControlinTTS", "CodecTrainingObjectives", "SemanticvsAcousticTokens", "Self-SupervisedSpeechRepresentation", "ProsodyModeling"], "source": "Sources/AffectCodec.pdf", "github": "", "demo": ""}, {"name": "AgentSteerTTS", "title": "AgentSteerTTS: A Multi-Agent Closed-Loop Framework for Composite-Instruction Text-to-Speech", "arxiv_id": "2605.17583", "date": "2026-05", "venue": "ICML 2026", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "disentanglement", "multi-agent", "composite-instruction", "adversarial-training", "closed-loop", "retrieval-augmented"], "summary": "用多 agent 闭环框架解决 composite-instruction TTS 中的 semantic-acoustic misalignment — 先解耦 speaker-emotion,再用检索锚定目标区域,最后用双速反馈校准强度", "route": "文本指令 → ADM 解耦(GRL 双向对抗) → DAC 双流锚定(prototype retrieval + gated fusion) → Fast Loop(latent gradient correction) → Slow Loop(MLLM perceptual critique) → 合成语音", "metrics": "E-SIM 0.955 / S-SIM 0.841 / CSR 0.78 / WER 1.34% (composite benchmark, Gemini3 backend) [Table 2, 3]; ESD: ESMOS 4.42 / SNMOS 4.52 / MCD 5.815 (Qwen3 backend) [Table 1]", "takeaway": "(1) 用 cross-covariance 正交约束 + 双向 GRL 实现 speaker-emotion 解耦; (2) 推理时 latent scaling 的梯度校准(仅调 alpha 不跑 vocoder,开销约 38ms/step); (3) 用 perceptual cropping 筛选 prototype 的相关时间窗口", "limitation": "依赖 100h 人工筛选的 prototype library(覆盖不足则退化); 闭环 Slow Loop 依赖外部 MLLM(Gemini/Qwen3),引入延迟和不可控性; 未开源(计划发布非商业 checkpoint); DMOS 3.82 低于部分平滑 baseline,反映 naturalness-expressiveness trade-off", "concepts": ["EmotionControlinTTS", "GradientReversalLayer", "SpeechFactorization", "SpeakerEmbedding", "ProsodyModeling", "Instruction-GuidedSpeechSynthesis"], "source": "Sources/AgentSteerTTS.pdf", "github": "", "demo": ""}, {"name": "Chatterbox-Flash", "title": "Chatterbox-Flash: Prior-Calibrated Block Diffusion for Streaming Zero-Shot TTS", "arxiv_id": "2605.30748", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "block-diffusion", "streaming", "discrete-token", "parallel-decoding", "diffusion-language-model"], "summary": "将预训练 AR TTS decoder 微调为 block-diffusion decoder,通过 prior-calibrated scoring 解决离散语音 token 的 dominant-token bias,实现首个支持原生流式的 block-diffusion zero-shot TTS", "route": "text + speaker embedding + prompt speech tokens → Llama-style Transformer (block-diffusion training with complementary masking + token-shift loss) → block-by-block parallel decoding (PMI position ranking + early decoding + CFG) → flow-matching vocoder → waveform", "metrics": "LibriSpeech-PC SIM-o 0.717 / WER 1.67 / UTMOS 4.29; Seed-TTS SIM-o 0.704 / WER 1.96 / UTMOS 4.09; RTF 0.107 (2.7x lower than Qwen3-TTS); TTFP 118ms [Table 1, Table 3]", "takeaway": "PMI scoring 思路(减去 marginal prior 做校准)可迁移到任何 discrete token 的 parallel decoding 场景; AR→block-diffusion 的 fine-tuning 路线(保留 AR 骨架,只换训练目标)是低成本获得并行能力的通用策略", "limitation": "block size D >= 24 时 WER 急剧恶化; 训练数据贡献未隔离; PMI 在饱和 benchmark 上无直接质量增益(优势仅在 early decoding 和 hard samples 上显现); 未与 OmniVoice 的流式配置做公平对比", "concepts": ["MaskedGenerativeModeling", "Classifier-FreeGuidance", "CodecLanguageModel", "Non-autoregressiveTTS", "Diffusion-basedTTS"], "source": "Sources/Chatterbox-Flash.pdf", "github": "", "demo": ""}, {"name": "ContinualSpeakerUnlearning", "title": "Continual Speaker Identity Unlearning with Minimal Interference", "arxiv_id": "2605.25962", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["machine-unlearning", "voice-privacy", "zero-shot-TTS", "speaker-identity", "continual-learning", "flow-matching", "GDPR", "safety"], "summary": "提出 CORTIS 框架,首次解决 ZS-TTS 中持续增量 speaker identity unlearning 问题 -- 通过 Fisher-information 参数定位 + 正交子空间投影,使每次新遗忘不干扰先前已遗忘的说话人身份", "route": "遗忘请求 f_i 到达 → 计算 forget/remain/prior-forget Fisher → 对比显著性 top-k% 构建参数 mask M_i → 在 M_i 限定区域内执行 TGU unlearning → 收集梯度快照 → SVD 提取 rank-R 正交基 U_i → 后续请求的梯度投影到 U_{<i} 的正交补空间", "metrics": "5 次顺序遗忘后所有 forget speaker SIM < 0.18 (最差 0.198) [Fig 3]; S-R 保持 0.527 (原模型 0.649) [Table 7]; 3 次遗忘后 S-f1=0.172, S-f2=0.148, S-f3=0.124, S-R=0.557 [Table 1]; 每次请求仅需 3.5 小时 vs TGU 累积模式 87.5 小时 (3 次后) [Table 4]", "takeaway": "\"对偶灾难性\"问题的形式化 -- continual learning 防止\"灾难性遗忘\"(已学知识丢失),continual unlearning 防止\"灾难性再学习\"(已遗忘知识复活),两者对称但需要不同机制; Fisher-information 对比显著性 mask 的设计(分子=forget Fisher, 分母=max(remain, prior forget) Fisher)可迁移到其他需要局部化更新的场景", "limitation": "仅在 VoiceBox (CFM-based NAR) 上验证,未测试 AR/LLM-based TTS; S-R 在 5 次遗忘后降至 0.527 (原模型 0.649,降幅 19%); 未讨论对抗性攻击(fine-tuning 恢复); 最长序列仅测试 5 个 speaker", "concepts": ["ConditionalFlowMatching", "SpeakerEmbedding", "SpeakerVerification", "Anti-spoofingandDeepfakeDetection", "VoiceCloningTaxonomy"], "source": "Sources/ContinualSpeakerUnlearning.pdf", "github": "", "demo": ""}, {"name": "CosyEdit2", "title": "CosyEdit2: Speech-Editing-Oriented RL Unlocks Better Zero-Shot TTS", "arxiv_id": "2605.25930", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-editing", "GRPO", "reinforcement-learning", "post-training", "zero-shot-TTS", "end-to-end", "flow-matching", "reward-design"], "summary": "在 CosyVoice2 上构建两阶段 post-training 框架(SFT → editing-oriented GRPO),用无需目标录音的 target-speech-free 数据 + 三维 editing reward 突破 SFT 的 preservation-accuracy 天花板,同时提升 speech editing 和 zero-shot TTS", "route": "(original text + target text + original speech) → BPE tokenizers + FSQ speech tokenizer → AR LLM 生成 target speech tokens → GOT-CFM flow matching (全局原始语音条件) → BigVGAN vocoder → edited speech", "metrics": "Speech editing: WER 1.43-1.93% / SS 0.89-0.93 / MAE_DNSMOS 0.107-0.137 (Ming-Freeform-Audio-Edit, best acoustic consistency) [Table 1]; Zero-shot TTS: zh CER 3.52% / en WER 4.87% / hard-zh CER 8.06 / hard-en WER 5.93 (CV3-Eval, best across board) [Tables 3-5]; SEED-TTS: zh CER 1.16% / en WER 1.95% (Table 9)", "takeaway": "(1) TTS-to-Edit prompt construction: 任何 TTS 语料对 logue", "LLM-deployment", "IVR", "data-augmentation", "chain-of-thought", "iterative-learning", "industrial-system", "Baidu"], "summary": "用 FSM 约束 + CoT 选择式生成 + 双评估器迭代学习,将 <2B 参数的 LLM 部署到百度地图电话 IVR 系统中,实现 83.9% 任务成功率和 130ms 响应延迟", "route": "ASR → 对话历史 + FSM 候选回复 → LLM-S (CoT 推理 + 选项选择) → 选中回复 → TTS", "metrics": "TSR 83.9% (vs DuIVRS-1 79.9%, +4pp; vs 人类 89.6%) [Table 2]; CR avg 77.18% (vs DuIVRS-1 68.08%, +13.37%) [Table 1]; 幻觉率 0% [§A.2.2]; 延迟 130ms, 日处理 40 万通 [Table 2]", "takeaway": "(1) 选择式生成 — 不让 LLM 自由生成,而是从 FSM 定义的候选集中选择,将幻觉率降到 0%; (2) 双评估器投票 — domain-specific LLM-L + domain-agnostic Black-box LLM 互补评估,解决\"近亲繁殖\"问题; (3) FSM 驱动的均匀采样数据增强,解决对话系统的长尾分布问题", "limitation": "(1) 严重依赖 FSM 结构,新场景/新属性需要重新设计 FSM; (2) 选择式生成限制了灵活性,无法处理 FSM 未覆盖的对话路径; (3) 延迟从 15ms (DuIVRS-1) 增至 130ms,虽在可接受范围但代价明显; (4) 评估指标仅 CR 和 TSR,缺乏对话质量/用户满意度等多维评估; (5) 时间背景 (2023 年开发) 使部分设计决策在当前 LLM 能力下可能过于保守", "concepts": [], "source": "Sources/DuIVRS-2.pdf", "github": "", "demo": ""}, {"name": "FC-TTS", "title": "FC-TTS: Style and Timbre Control in Zero-Shot Text-to-Speech with Disentangled Speech Representations", "arxiv_id": "2605.24618", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "disentanglement", "style-control", "timbre-control", "flow-matching", "VQ-VAE", "FACodec"], "summary": "基于 FACodec 的双参考零样本 TTS,通过两阶段 spectrogram 生成 + TCF 风格编码器 + 条件一致性 loss 实现 timbre 与 speaking style 的独立控制", "route": "文本→Phoneme Encoder→Aligner→Timbre Adapter(zspk)→Blurry Mel→CFM Decoder(zsty from TCF)→Clean Mel→HiFi-GAN→Waveform", "metrics": "LibriSpeech UTMOS 4.22 / WER 1.88% / SPK 0.60 (204M params) [Table 1]; RAVDESS timbre ABX Win 66.1% vs FACodec-VC 10.7% [Table 2]; style ABX Win 65.5% vs F5-TTS 8.9% [Table 3]; AudioLLM Style-MOS 3.92 vs 1.50 [Table 4]", "takeaway": "(1) 两阶段 coarse-to-fine 将不同条件信号物理分离到不同阶段,适用于任何需要多条件解耦控制的生成任务; (2) Q-Former + FSQ 信息瓶颈组合可迁移到其他需要从参考中提取高层特征而过滤低层细节的场景; (3) CCL 的交叉条件化设计(predictor 接收非目标条件作为额外输入)可推广到任意多条件生成", "limitation": "仅英语; SPK 得分低于 F5-TTS While Speaking? A Study of User-Stream Routing in Full-Duplex Spoken Dialogue", "arxiv_id": "2605.10199", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["full-duplex", "spoken-dialogue", "user-stream-routing", "channel-fusion", "cross-attention", "interruption-handling", "speech-LM"], "summary": "在统一框架下对比全双工口语对话中两种 user-stream routing 策略 -- 通道融合 (CF-Duplex) 语义理解强但打断时易上下文污染, cross-attention routing (XA-Duplex) 语义弱但生成连贯性更鲁棒", "route": "用户音频 → streaming Whisper encoder (causal conv + causal attn + RoPE) → speech adapter (3 linear, 2x downsample) → [channel fusion | cross-attention adapters] → frozen Qwen3-1.7B + LoRA → text head + audio head (Qwen3-0.6B, G=4 group decoding) → CosyVoice 2 token2wav", "metrics": "CF-Duplex: ASR WER 3.90/10.04 (clean/other), FDB v1.0 interruption TOR 1.000 + GPT-4o 3.96, FDB v1.5 interruption Respond 0.72 + Stop Latency 0.74s; XA-Duplex: FDB v1.0 Smooth Turn Taking TOR 0.983 (best) [Table 1-5]", "takeaway": "(1) 显式 INT token + 动态 overlap range 训练 (概率分布 [0.6,0.3,0.06,0.03,0.01] 对应 2-6 步延迟) 大幅提升打断处理; (2) cross-attention 将用户流作为外部记忆,避免上下文污染 -- 可在高可靠性场景选用; (3) WAIT/INT 特殊 token 统一建模空闲/打断行为,损失权重 0.001 (WAIT) vs 50 (INT) 平衡稀疏信号", "limitation": "仅在 Qwen3-1.7B 单一尺度验证, 未探索混合路由; XA-Duplex QA 性能显著弱于 CF-Duplex, 尚不清楚是架构固有限制还是训练不足; 合成对话数据, 未用真实人机对话训练", "concepts": ["Full-duplexSpokenDialogue", "SpeechLanguageModel", "StreamingSpokenDialogue", "Turn-takinginSpokenDialogue", "SpokenDialogueEvaluation", "ModalityAdaptationforSpeechLLM"], "source": "arXiv", "github": "", "demo": ""}, {"name": "High-FidelityCodec-Inspired", "title": "CodecCap: High-Fidelity Codec-Inspired Residual Modeling for Dense Video Captioning", "arxiv_id": "2605.26967", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["video-captioning", "dense-captioning", "codec-inspired", "keyframe-residual", "VLM", "benchmark", "multi-granularity", "temporal-reasoning"], "summary": "将视频编解码的 I-frame / P-frame 思想迁移到 dense video captioning,用 keyframe anchor caption + temporal residual caption 实现高保真、低冗余的视频文本表示", "route": "Video -> Scene-Aligned Segmentation (ffprobe + PySceneDetect) -> Keyframe Anchoring (VLM 生成 anchor caption) -> Residual Captioning (VLM 逐帧差分) -> Hierarchical Aggregation (text-only LLM 合成 scene/video 级叙述)", "metrics": "VidCapQA overall accuracy 49.5% (VDCTalker, Qwen3.5-35B-A3B SFT) vs 44.4% base model (+5.1%), vs 47.9% Gemini 3.1 Pro; trajectory +15.5%, action recognition +12.0% [Table 2]", "takeaway": "(1) 用编解码 I/P-frame 类比将\"完整描述 + 增量差分\"结构化分解的思路可迁移到任何需要减少冗余同时保留细节的序列描述任务; (2) caption-then-QA 评估协议(VidCapQA)将 caption 质量转化为下游 QA 准确率,可迁移到 TTS evaluation 中评估生成语音的信息保留度; (3) unknown-aware majority voting 多模型共识标注策略", "limitation": "仅视觉模态,不含音频信号; residual-only SFT 导致 speed/state-change 维度轻微退化 (-4.1%/-1.5%); VDCTalker 仅 3B 活跃参数,静态属性识别仍落后大模型; 未开源(截至论文发表)", "concepts": [], "source": "Sources/High-FidelityCodec-Inspired.pdf", "github": "", "demo": ""}, {"name": "HoliTok", "title": "HoliTok: A Continuous Holistic Tokenization with Robust Dual Capabilities of Speech Generation and Understanding", "arxiv_id": "2605.29948", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["continuous-tokenizer", "VAE", "progressive-training", "unified-model", "speech-generation", "speech-understanding", "AR-DiT", "flow-matching"], "summary": "渐进式三阶段训练的连续 VAE 语音 tokenizer,在同一个 25 Hz/128-dim latent 空间中同时实现高保真重建、可学习的 TTS 生成、和统一生成-理解建模", "route": "48kHz waveform → causal conv encoder (6 downsampling blocks, hop=1920) → temporal variational bottleneck (LSTM+normalizing flow) → 25Hz/128-dim latent → BigVGAN-style decoder → waveform; 下游: latent patches → PatchEncoder → Qwen2.5-0.5B LLM (AR) → DiT flow-matching head → latent → decoder", "metrics": "重建 PESQ 4.10/4.01 (NB/WB), WER 4.22%, SPKSIM 0.968 (LibriSpeech test-other) [Table 1]; TTS WER 1.33% (Seed-TTS-en) [Table 2]; 统一模型 HoliTok-Unite TTS avg WER 8.59%, ASR avg WER 8.02% [Table 3]; 可控 TTS 最佳 CLSP 和最低 WER [Fig 2]", "takeaway": "(1) 渐进式 AE→VAE→downstream-aware 三阶段训练策略——先建立可靠解码流形,再冻结两端仅训练 bottleneck,最后联合优化+语义蒸馏; (2) implicit fidelity transfer 的理论分析框架——量化了 VAE 波形失真的上界与 Stage-I 失真和 AE-to-VAE latent shift 的关系; (3) DiT TTS-only 预训练初始化显著提升统一训练的 TTS 性能", "limitation": "(1) 仅在语音域评估,未验证音乐/环境音的泛化性; (2) 下游仅用 AR+DiT 架构,未探索 pure DiT/NAR 架构; (3) 训练数据 ~500K h 含大量内部数据难以复现; (4) HoliTok-Unite 含 680M 语义 encoder,参数量显著增大", "concepts": ["SpeechTokenizer", "VariationalAutoencoderforTTS", "ConditionalFlowMatching", "SemanticvsAcousticTokens", "Next-TokenDiffusion", "CodecTrainingObjectives", "Self-SupervisedSpeechRepresentation"], "source": "Sources/HoliTok.pdf", "github": "", "demo": ""}, {"name": "ImmersiveTTS", "title": "ImmersiveTTS: Environment-Aware Text-to-Speech with Multimodal Diffusion Transformer and Domain-Specific Training", "arxiv_id": "2605.30965", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["environment-aware-TTS", "diffusion-transformer", "MM-DiT", "flow-matching", "representation-alignment", "REPA", "dual-stream", "CLAP"], "summary": "用 MM-DiT 双流架构 + flow matching + domain-specific REPA 实现环境感知 TTS,在 joint attention 中显式建模语音与环境音的交互", "route": "content prompt → Text Encoder + MAS → frame-level prior; environment prompt → CLAP (global AdaLN) + Flan-T5 (token-level stream); dual-stream MM-DiT (12 double + 18 single blocks) → VAE decoder → HiFi-GAN", "metrics": "AudioCaps WER 8.06% / FAD 5.80 / CLAP 0.308 / SN-MOS 4.20 (vs VoiceDiT: 11.68 / 9.07 / 0.263 / 3.47); 仅 25 NFEs vs 200 [Table 1]", "takeaway": "(1) domain-specific dual-teacher REPA -- 不同域用不同 SSL teacher 对齐,比统一 teacher 效果更好; (2) MM-DiT 双流对 heterogeneous 模态融合的有效性; (3) WavLM 对齐 clean speech 而 ATST 对齐 mixed audio 的不对称 target 设计", "limitation": "训练仅用合成混合数据 (LibriTTS + WavCaps mixing),未在真实 in-the-wild 录音上验证; 缺乏 prosody/emotion 显式控制; 单任务 TTS/TTA 各自不及专用系统 (CosyVoice2 WER 5.23 vs 9.89, TangoFlux FAD 2.96 vs 7.81) [Table 7]", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Diffusion-basedTTS", "Self-SupervisedSpeechRepresentation", "NaturalLanguageDescriptionforTTS", "DurationPredictor", "MelSpectrogram", "NeuralVocoder"], "source": "Sources/ImmersiveTTS.pdf", "github": "", "demo": ""}, {"name": "KineticOptimalTTS", "title": "Kinetic-Optimal Scheduling with Moment Correction for Metric-Induced Discrete Flow Matching in Zero-Shot Text-to-Speech", "arxiv_id": "2605.09386", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["discrete-flow-matching", "Fisher-Rao", "kinetic-optimal", "CTMC", "zero-shot-TTS", "NAR", "codec-based", "DiT"], "summary": "为 metric-induced discrete flow matching 推导了 training-free 的 kinetic-optimal 时间调度器 + finite-step moment correction,在 codec-based zero-shot TTS 上全面超越 masked generative baselines", "route": "Text+Prompt → DiT backbone (全 codebook 联合预测) → CTMC sampling (KO scheduler + moment corrector) → Codec decoder → Waveform", "metrics": "UTMOS 3.651 / WER 1.777% / SIM 0.743 (Seed-TTS test-en, 32 NFE) [Table 2]; CMOS 0 (ref) vs all baselines negative [Table 3]; SIM highest on 3/4 SOTA test sets [Table 4,5]", "takeaway": "(1) Fisher-Rao 等速遍历作为 training-free scheduler 设计原则, 可迁移到其他 discrete generative task; (2) moment correction 不改 jump 方向只调 jump 概率的轻量 corrector 设计; (3) codebook-wise linearly decayed loss weight 稳定 full-codebook 训练", "limitation": "仅验证了 L2 cosine distance,未探索其他 token distance; 399M 参数在 WER 上不敌大规模 AR 系统; 仅验证 TTS 未推广到其他域; text frontend 较简单影响 WER", "concepts": ["ConditionalFlowMatching", "MaskedGenerativeModeling", "Classifier-FreeGuidance", "ResidualVectorQuantization", "Non-autoregressiveTTS", "DiffusionModel", "DurationPredictor"], "source": "Sources/KineticOptimalTTS.pdf", "github": "", "demo": ""}, {"name": "MELD", "title": "MELD: Mel-Spectrogram-Based Speech Language Modeling with Discrete Latent Variables", "arxiv_id": "2605.29859", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "STT", "zero-shot", "autoregressive", "mel-spectrogram", "discrete-latent", "variational-inference", "joint-modeling"], "summary": "在 mel-spectrogram 上引入离散隐变量做变分自回归建模,联合优化编码器和 AR 模型,同时解决 mel AR 的静音循环问题和 codec 两阶段的信息损失问题", "route": "text(BPE) + mel prompt → decoder-only Transformer → 预测离散隐变量 z_t (K=8192 soft VQ) → 重建 mel frame x_t (MLP+PostNet) → HiFi-GAN vocoder → waveform", "metrics": "TTS WER 2.4/1.9 (Conformer/Whisper), SIM 0.872, SMOS 3.89 on LibriSpeech test-clean [Table 2,4]; STT WER 4.2/10.0 (clean/other) [Table 6]; 均优于 Codec-LM 和 MELLE", "takeaway": "(1) 冻结 k-means codebook 做 soft VQ,避免 VQ 训练不稳定; (2) 将 EOS 合并到离散词表,免去 stop predictor; (3) 离散采样天然支持 repetition penalty 抑制静音循环", "limitation": "仅在 LibriSpeech 960h 上验证; 依赖 HiFi-GAN vocoder (与 codec decoder 不完全可比); 未探索更多语音任务 (QA, 翻译等); 200M 参数较小", "concepts": ["MelSpectrogram", "SpeechLanguageModel", "CodecLanguageModel", "VariationalAutoencoderforTTS", "ResidualVectorQuantization"], "source": "Sources/MELD.pdf", "github": "", "demo": ""}, {"name": "MelShield", "title": "MelShield: Robust Mel-Domain Audio Watermarking for Provenance Attribution of AI Generated Synthesized Speech", "arxiv_id": "2605.01515", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-watermarking", "TTS", "mel-spectrogram", "spread-spectrum", "copyright-attribution", "provenance", "security", "vocoder"], "summary": "在 mel spectrogram 域通过 keyed spread-spectrum 扰动嵌入水印,实现跨 vocoder 架构的 plug-and-play 音频溯源,无需重训练或神经网络提取器", "route": "Text → Acoustic Model → Mel Spectrogram X → [Spread-spectrum embedding: key K + payload m → spreading patterns → adaptive mask → low-energy perturbation] → Watermarked Mel X̃ → Vocoder (DiffWave/HiFi-GAN) → Watermarked Audio; 验证: Suspect Audio → Mel extraction → Residual vs Reference Mel → Keyed correlation test → Decoded payload", "metrics": "HiFi-GAN @ 32-bit: ACC=1.0, PESQ=3.81 [Table 1]; DiffWave @ 32-bit: ACC=1.0, PESQ=3.63 [Table 1]; HiFi-GAN 鲁棒性: MP3/AAC/N20 全部 ACC=1.0 [Table 3]; DiffWave 鲁棒性: MP3/AAC ACC=1.0, N20 ACC=0.95 [Table 2]; LJSpeech 数据集", "takeaway": "(1) 利用 mel spectrogram 作为 model-agnostic 的水印嵌入点——任何共享 mel 接口的 TTS pipeline 均可复用; (2) reference-based verification 无需训练提取器,可直接用于部署; (3) adaptive energy mask 根据帧能量自适应调节嵌入强度,平衡鲁棒性与不可察觉性", "limitation": "reference-based 验证需存储每条语音的 reference mel,大规模部署存储开销大; 仅在 LJSpeech(单说话人)上验证; 未测试 codec-based TTS(如 VALL-E 系列); 未与 TraceableSpeech 直接对比; 噪声鲁棒性在低 SNR(5-10dB)下衰减明显", "concepts": ["Anti-spoofingandDeepfakeDetection", "MelSpectrogram", "NeuralVocoder", "Text-to-SpeechPipeline", "TTSEvaluation"], "source": "Sources/MelShield.pdf", "github": "", "demo": ""}, {"name": "NativeAudio-VisualAlignment", "title": "Native Audio-Visual Alignment for Generation", "arxiv_id": "2605.30073", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["audio-video-generation", "MMDiT", "diffusion", "multimodal", "timbre-control", "audio-visual-alignment", "joint-generation"], "summary": "NAVA 提出 \"先对齐再融合\" 的 MMDiT 架构,将音频-视频同步与语义条件解耦,在联合音视频生成中以 6.3B 参数实现最优同步和视频质量", "route": "Text/Timbre --> Context Tokens; Video/Audio --> separate VAE latents --> Hierarchical Alignment Layers (modality-aware AV self-attn + context cross-attn, 10 blocks) --> Unified Fusion Layers (shared projection + joint denoising, 20 blocks) --> Audio + Video output [§3.1, Fig 2]", "metrics": "Verse-Bench Sync-C 7.791 (best) / Sync-D 7.566 (best) / Video Quality 0.659 (best) / WER 0.099 (best); Seed-TTS Speaker Similarity 66.7 (best among AV models, competitive with audio-only CosyVoice2 65.2) [Table 1, Table 2]", "takeaway": "(1) Condition-Factorized CFG -- 将不同条件轴(text/alignment/timbre)分别 dropout+guidance,可迁移到任何多条件扩散系统; (2) Timbre-in-Context -- 将参考音色作为 span-level context token 而非全局 embedding,天然支持多说话人; (3) Rate-aware RoPE rescaling 处理异构 token rate", "limitation": "长尾音频事件(罕见动物叫声、音乐、歌唱)生成仍弱; 代码未开源; 训练成本极高(~107K H100 GPU-hours); 论文为 Baidu 内部工作,数据 pipeline 不可复现", "concepts": ["Classifier-FreeGuidance", "DiffusionModel", "SpeakerEmbedding"], "source": "Sources/NativeAudio-VisualAlignment.pdf", "github": "", "demo": ""}, {"name": "NaturalEmotionalTTS", "title": "Toward Natural Emotional TTS with Non-Verbal Expression", "arxiv_id": "2605.25504", "date": "2026-05", "venue": "IEEE (preprint)", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "non-verbal-vocalization", "fine-grained-control", "diffusion", "expressiveness"], "summary": "提出细粒度 NV 标注方案 (频率+时长编码),基于 Grad-TTS+emotion encoder 构建 NV emotional TTS,显著提升表现力 (eMOS 4.20) 和情感识别率 (78.8%)", "route": "EARS 语料 (女声 NV) → 细粒度标注 (style/频率/时长 tag) → NV Processor (style parser + discrete unit parser + duration parser) → NV token → Emotional Grad-TTS (+ arousal-valence 条件) → mel spectrogram → HiFi-GAN → waveform", "metrics": "eMOS 4.20 (vs verbal-only 3.81), 识别准确率 78.8% (vs verbal-only 65.5%), sad 98.3%, fear 82.7%, happy 82.5% [Fig 2, Table 3]", "takeaway": "细粒度 NV 标注方案 (音节重复=频率, 字符重复=时长) 可迁移到任何 TTS 系统的 NV 数据构建", "limitation": "仅 739 条女声 NV, backbone 为过时的 Grad-TTS (非 LLM-based), 未开源代码/模型, angry 识别率仅 64.3%, naturalness 有轻微下降", "concepts": ["EmotionControlinTTS", "Diffusion-basedTTS", "ProsodyModeling", "MelSpectrogram"], "source": "Sources/NaturalEmotionalTTS.pdf", "github": "", "demo": ""}, {"name": "PilotTTS", "title": "PilotTTS: A Disciplined Modular Recipe for Competitive Speech Synthesis", "arxiv_id": "2605.27258", "date": "2026-05", "venue": "Amap Voice Technical Report", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "autoregressive", "LLM-based", "Q-Former", "data-engineering", "emotion", "paralinguistic"], "summary": "以可复现数据管线 + Q-Former 双路径 speaker-style 解耦 conditioning 为核心,用 200K 小时数据和 Qwen3-0.6B 构建零样本 TTS 系统,在 SEED-TTS-Eval 上取得最高 speaker similarity (0.862/0.815) 和最低英文 WER (1.50%)", "route": "Text → Qwen3 tokenizer → Qwen3-0.6B AR (conditioned on CAMPPlus spk emb + Q-Former style tokens) → semantic tokens → DiT-CFM decoder → mel spectrogram → HiFi-GAN → waveform", "metrics": "SIM 0.862 (test-zh) / 0.815 (test-en), CER 0.87% (test-zh), WER 1.50% (test-en), 情感控制主类平均成功率 88.1%, 副语言整体 85.1% [Table 1-4]", "takeaway": "(1) cross-sample paired training 策略实现 speaker-style 解耦 -- 不同内容的同说话人音频做参考,迫使 conditioner 只编码说话人属性; (2) 三阶段数据管线完全用开源工具构建,从 raw audio 到 200K h 高质量训练数据; (3) 方言合成的 mixed-prompt sampling 策略,用预训练模型合成普通话做伪平行数据", "limitation": "(1) 无显式 style modeling module -- Q-Former 隐式建模风格,细粒度表达力可能受限; (2) 单码本 FSQ 信息容量上限低于多码本 RVQ,难以扩展到歌唱/背景音乐; (3) mel + vocoder 的间接重建引入额外失真; (4) 未开源训练数据,仅开源管线工具和模型权重", "concepts": ["ConditionalFlowMatching", "SpeakerEmbedding", "SpeechTokenizer", "FiniteScalarQuantization", "LLM-basedTTS", "EmotionControlinTTS", "Single-codebookvsMulti-codebook"], "source": "Sources/PilotTTS.pdf", "github": "", "demo": ""}, {"name": "Raon-OpenTTS", "title": "Raon-OpenTTS: Open Models and Data for Robust Text-to-Speech", "arxiv_id": "2605.20830", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "open-data", "data-curation", "DiT", "flow-matching", "robustness-evaluation"], "summary": "首个系统性验证大规模开放数据可训练出与闭源数据 TTS 模型性能可比的零样本 TTS,发布 615K h 开放数据集 + 过滤管线 + DiT 模型 (0.3B/1B)", "route": "11 个开放语音语料库 → Raon-OpenTTS-Pool (615K h) → 三维过滤 (DNSMOS/WER/SR, 15th percentile) → Raon-OpenTTS-Core (510K h) → DiT (F5-TTS 架构) + flow matching → mel spectrogram → HiFi-GAN 16kHz", "metrics": "Seed-TTS-Eval WER 1.78% / SIM 0.749 (1B); CV3-Hard WER 6.15% / SIM 0.775 (1B, 双第一); Raon-Eval Overall WER 2.81% / SIM 0.695 (1B, 最佳) [Table 1, 5, 6]", "takeaway": "(1) 多源开放数据的聚合策略和 combined rank-based 三维过滤 (15th percentile); (2) YouTube-Commons 预处理管线 (UVR-MDX → PyAnnote → Silero VAD → Whisper-large-v3); (3) Raon-OpenTTS-Eval 四声学域 (Clean/Noisy/Wild/Expressive) 6K prompt 评估方法论", "limitation": "仅英语; 无架构创新 (直接用 F5-TTS); HiFi-GAN 16kHz vocoder 限制音频带宽; 训练算力需求 9K GPU-hours (B200); CMOS 主观评估仅 second-best (MaskGCT/Qwen3-TTS/VoxCPM 在部分条件下更优)", "concepts": ["ConditionalFlowMatching", "Diffusion-basedTTS", "TTSEvaluation", "MelSpectrogram", "NeuralVocoder"], "source": "Sources/Raon-OpenTTS.pdf", "github": "", "demo": ""}, {"name": "Raon-Speech", "title": "Raon-Speech Technical Report", "arxiv_id": "2605.23912", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "full-duplex", "bilingual", "SpeechLM", "turn-taking", "knowledge-distillation", "preference-optimization", "English-Korean"], "summary": "9B 英韩双语 SpeechLM + 全双工扩展,通过三阶段训练 (alignment → KD pre-training → SimPO post-training) 在 42 个 benchmark 上建立最强 speech-centric profile,全双工版通过 SIL/BOW/BC 状态建模实现自然实时对话", "route": "speech → AuT/Voxtral encoder → MLP adaptor → Qwen3-VL-8B backbone → Speech Generation Expert (semantic token) → RCP (15 acoustic tokens) → Mimi codec decoder → waveform; 全双工: 单序列交错 user speech + assistant text + assistant speech", "metrics": "VoiceBench avg 76.79 (best), MMAU 78.68 (best), MMLU-Pro 64.05 (best); 韩语全面领先; FDB v1.0 interruption TOR 0.980 (best), backchannel TOR 0.091 (best) [Table 4, 5, 6]", "takeaway": "(1) on-policy self-distillation: text-conditioned model 做 teacher 促进 speech-text 对齐,同时用冻结 backbone 做 text KD 防遗忘; (2) SIL/BOW/BC 三 token 状态建模,将\"何时说\"与\"说什么\"解耦; (3) RMSNorm (init scale 0.02) 稳定 adaptor-LLM 对齐", "limitation": "(1) UTMOS 感知自然度不是最优 (Qwen2.5-Omni 的 UTMOS 更高) [Table 4]; (2) FDB v2.0 多轮长对话表现弱于 PersonaPlex 和 MiniCPM-o 4.5 [Table 6]; (3) 仅支持英韩双语; (4) 1.38M 小时数据中依赖大量 in-house 数据,复现难度高", "concepts": ["SpeechLanguageModel", "Full-duplexSpokenDialogue", "ModalityAdaptationforSpeechLLM", "Turn-takinginSpokenDialogue", "StreamingSpokenDialogue", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "SpeakerEmbedding", "SpokenDialogueEvaluation", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/Raon-Speech.pdf", "github": "", "demo": ""}, {"name": "RobustSpeechFlow", "title": "RobustSpeechFlow: Learning Robust Text-to-Speech Trajectories via Augmentation-based Contrastive Flow Matching", "arxiv_id": "2605.22083", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "contrastive-learning", "alignment-robustness", "zero-shot", "data-augmentation", "training-strategy"], "summary": "将 TTS 的 skip/repeat 失败模式转化为 contrastive flow matching 的 hard negatives,通过 latent 空间增强直接惩罚对齐错误", "route": "ground-truth latent x → repeat/skip augmentation → 长度保持的 corrupted latent x_aug → 与 random negative 共同构成 contrastive 正则项 → L = L_pos - lambda_rand * L_rand - lambda_aug * L_aug", "metrics": "Seed-TTS-eval WER 1.38 (vs baseline 1.44, 0.06B params, benchmark 最低) [Table 1]; ZERO500-en CER 0.35% / ZERO500-ko CER 0.57% at NFE=24 [Table 2]", "takeaway": "(1) 用 domain-specific failure modes 构造 hard negatives 的思路可迁移到任何 contrastive FM 场景; (2) 长度保持的 latent augmentation 设计(overwrite 而非 insert/delete)避免了 variable-length 带来的 batch 构造和训练不稳定问题", "limitation": "SIM 0.60 在 Seed-TTS-eval 上偏低(CosyVoice 3 为 0.72, Seed-TTSDiT 为 0.79),作者归因于 compact baseline 架构限制而非方法本身; 无主观评估(MOS); 训练数据和 SupertonicTTS 架构未开源", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Non-autoregressiveTTS"], "source": "Sources/RobustSpeechFlow.pdf", "github": "", "demo": ""}, {"name": "SemaVoice", "title": "SemaVoice: Semantic-Aware Continuous Autoregressive Speech Synthesis", "arxiv_id": "2605.16964", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "continuous-AR", "VAE", "semantic-alignment", "diffusion", "LLM-based", "patch-diffusion"], "summary": "在 sigma-VAE 训练中引入 WavLM 引导的 frame-wise + pair-wise 语义对齐损失,提升连续 AR TTS 的语义连贯性,在 Seed-TTS-Eval 英文 WER 达到 1.71%", "route": "24kHz 语音 → sigma-VAE encoder (15Hz, 1600x 压缩, + WavLM 对齐训练) → 连续 latent → Qwen2.5-1.5B AR LLM (patch size 2) → LocDiT diffusion head (DDPM, 含 previous-patch conditioning) → sigma-VAE decoder → 波形", "metrics": "EN WER 1.71% / SIM 0.694, ZH CER 1.18% / SIM 0.754 (Seed-TTS-Eval) [Table 1]; N-MOS EN 3.98 (vs GT 4.02) [Table 2]; 150K h 双语训练, 1.5B 参数", "takeaway": "SFM guided alignment 的双层损失设计 (frame-wise cosine + pair-wise 自相似矩阵匹配) 可推广到任何 VAE-based 连续表示学习场景,且不需修改下游架构; 自适应权重通过梯度比自动平衡对齐损失与重建损失", "limitation": "仅验证中英双语; 连续 AR 的顺序推理固有延迟未解决; SFM alignment 依赖冻结 WavLM,不确定对其他 SFM 的适用性; 未开源 (截至论文发布)", "concepts": ["Self-SupervisedSpeechRepresentation", "VariationalAutoencoderforTTS", "Next-TokenDiffusion", "Classifier-FreeGuidance", "LLM-basedTTS", "Diffusion-basedTTS", "SemanticvsAcousticTokens"], "source": "Sources/SemaVoice.pdf", "github": "", "demo": ""}, {"name": "Step-Audio2.5", "title": "StepAudio 2.5 Technical Report", "arxiv_id": "2605.23463", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "unified-foundation", "ASR", "TTS", "realtime", "RLHF", "MTP", "audio-language"], "summary": "统一音频-语言基座模型,通过共享 MoE backbone + task-specific post-training (RLHF-centric) + 专用解码策略,同时在 ASR/TTS/Realtime 三个方向达到 SOTA [§Abstract]", "route": "共享基座: Audio Encoder (frozen) → Adaptor → LLM Decoder (MoE, 2.2T pretrained) → 三分支: ASR (MTP-5 verifiable decoding) / TTS (纯 NTP, audio tokens as language, RLHF+GRM) / Realtime (progressive SFT + RLHF + generative rewards) [§2, Fig 1]", "metrics": "ASR: avg CER 2.97 zh / avg WER 3.68 en / avg long-form 3.63 (全面 SOTA vs Qwen3-ASR, VibeVoice-ASR, FunASR-Nano) [Table 1]; ASR RTF 0.0053 (最快) [Table 2]; TTS: 69.1% overall arena win rate vs MiniMax/ElevenLabs/Gemini [Fig 4]; Realtime: 5 eval suites 全部 SOTA (+10 margin on human eval vs next-best) [Fig 5]", "takeaway": "(1) MTP-5 for ASR: 5 个 lookahead branch 并行提议 tokens,autoregressive verification 确保正确性,RTF 低至 0.0053 [§4]; (2) Generative Reward Model (GRM): 生成式奖励模型替代标量 reward,捕获更细粒度的人类偏好 [§5.1]; (3) Progressive SFT for Realtime: conversational alignment → persona control → paralinguistic sensitivity 三阶段渐进 [§6.1.2]; (4) Dynamic rehearsal schedule: SFT 中交错通用推理任务防止灾难性遗忘 [§6.1.2]; (5) Million-scale persona matrix: 10K 种子 persona 通过 fission 算法扩展为百万级 persona-dialogue pairs [§6.2]", "limitation": "未公开模型参数量 (仅说 MoE backbone); TTS 评估采用 arena pairwise 而非标准 benchmark (MOS/WER),可比性有限 [§5.3]; Realtime 评估中部分基线通过 API 获取,非严格控制 [§6.3]; 数据规模极大 (2.2T tokens) 但数据组成透明度有限; 论文篇幅偏短 (19 页),部分细节不足", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "LLM-basedTTS", "ModalityAdaptationforSpeechLLM", "Instruction-GuidedSpeechSynthesis"], "source": "Sources/Step-Audio2.5.pdf", "github": "", "demo": ""}, {"name": "SwanSphere", "title": "Towards Streaming Synchronized Spatial Audio Generation via Autoregressive Diffusion Transformer", "arxiv_id": "2605.30940", "date": "2026-05", "venue": "", "org": "", "tier": "card", "tags": ["spatial-audio", "streaming", "autoregressive", "diffusion-transformer"], "summary": "", "route": "", "metrics": "", "takeaway": "", "limitation": "", "concepts": [], "source": "https://arxiv.org/abs/2605.30940", "github": "", "demo": ""}, {"name": "SwanVoice", "title": "SwanVoice: Expressive Long-Form Zero-Shot Speech Synthesis for Both Monologue and Dialogue", "arxiv_id": "2605.30993", "date": "2026-05", "venue": "", "org": "", "tier": "enhanced-card", "tags": ["zero-shot-tts", "long-form", "dialogue", "flow-matching", "expressive-tts", "diffusion-post-training"], "summary": "", "route": "", "metrics": "", "takeaway": "", "limitation": "", "concepts": [], "source": "https://arxiv.org/abs/2605.30993", "github": "", "demo": ""}, {"name": "Swanbench-Speech", "title": "Comprehensive Benchmarking of Long-Form Speech Generation in Diverse Scenarios", "arxiv_id": "2605.28618", "date": "2026-05", "venue": "", "org": "", "tier": "card", "tags": ["benchmark", "long-form", "speech-generation", "evaluation"], "summary": "", "route": "", "metrics": "", "takeaway": "", "limitation": "", "concepts": [], "source": "https://arxiv.org/abs/2605.28618", "github": "", "demo": ""}, {"name": "Tibetan-TTS", "title": "Tibetan-TTS: Low-Resource Tibetan Speech Synthesis with Large Model Adaptation", "arxiv_id": "2605.02496", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "low-resource", "cross-lingual", "Tibetan", "tokenizer-adaptation", "flow-matching", "LLM-TTS"], "summary": "基于星辰大语音模型(AR LM + Flow Matching)构建据作者所知业界首个大模型藏语 TTS 系统,通过数据治理 + 藏语 tokenizer 适配 + 跨语言自适应训练实现低资源藏语语音合成", "route": "藏语文本 → 文本归一化 → 藏语适配 tokenizer(音节级 / BPE) → 星辰大语音模型(AR LM → Flow Matching) → 藏语语音", "metrics": "MOS 4.28(音节级）/ 4.35（BPE）, 发音准确率 97.6% / 96.6%, 均优于商用对标系统 X-API (MOS 3.74, 93.8%) [Table 1]", "takeaway": "面向新语言的 tokenizer 适配策略(音节级 vs BPE 两条路线各有互补);低资源语言 TTS 的系统性数据治理 pipeline;证明跨语言大模型迁移在极低资源场景的可行性", "limitation": "仅覆盖卫藏方言,未扩展至安多/康巴;评估仅主观 MOS + 音节准确率,缺少 WER/SIM 等客观指标;骨干模型未公开,无法复现;评估规模偏小(10 名评估者);无对比消融(无法量化各模块单独贡献)", "concepts": ["ConditionalFlowMatching", "LLM-basedTTS", "PhonemeRepresentation", "SpeakerAdaptation", "CodecLanguageModel"], "source": "Sources/Tibetan-TTS.pdf", "github": "", "demo": ""}, {"name": "UNISON", "title": "UNISON: Unified Sound Generation and Editing via Deep LLM Fusion", "arxiv_id": "2605.31530", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["unified-audio", "text-to-audio", "TTS", "zero-shot", "audio-editing", "flow-matching", "MM-DiT", "deep-fusion"], "summary": "用 layer-wise deep LLM fusion + channel-mask 统一架构,在 621-732M 参数的单模型中同时实现 T2A、TTS、零样本克隆、音频编辑和时序组合,性能匹敌或超越各任务的专用模型", "route": "Text instruction → frozen Qwen2.5-Omni-7B (逐层 hidden states) → learned projectors → DeepFusion MM-DiT (flow matching) ← [z_t || z_s || mask] via frozen MMAudio VAE → ODE solver → VAE decode → waveform", "metrics": "T2A FAD 1.558 / CLAP 0.503 (AudioCaps, D24); TTS WER 1.27% EN / CER 0.92% ZH (Seed-TTS, D24); 音频编辑 overall FD 12.38 / CLAP 0.364 (vs MMEDIT 20.60/0.257) [Table 1, 2, 5]", "takeaway": "(1) Deep fusion: 将 frozen LLM 不同层隐状态通过 uniform sampling 映射到 DiT 各 block,低层给词汇/音素信息、高层给语义信息,改善复合指令跟随; (2) Channel-mask 统一: 仅用一个标量 mask channel (0/1/2) 区分 generation/editing/cloning,source audio 通过同一 VAE 编码后 channel concatenation,避免 task-specific 模块; (3) 零初始化 zs/m 连接权重,使训练初期行为类似纯去噪,逐步学习利用 source/mask 通道", "limitation": "(1) MMAudio VAE 对语音高频 formant 重建有损,是 TTS 音质上限的瓶颈; (2) 编辑训练数据为合成混合(简单 RMS mixing),与真实场景的混响/遮蔽/Lombard 效应有差距; (3) 不支持音乐生成; (4) 仅支持中英文; (5) 未开源", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "DiffusionModel", "Instruction-GuidedSpeechSynthesis", "LLM-basedTTS", "VariationalAutoencoderforTTS"], "source": "Sources/UNISON.pdf", "github": "", "demo": ""}, {"name": "UniSRM", "title": "UniSRM: A Unified Speech Reward Model for Reasoning-Based Fine-grained Assessment", "arxiv_id": "2605.23261", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-evaluation", "reward-model", "GRPO", "reasoning", "LLM-as-judge", "multi-dimensional", "preference-learning", "AudioLLM"], "summary": "基于 Qwen2.5-Omni-7B 的统一语音 reward model,通过 SFT+RCR-GRPO 两阶段训练,在 4 种评估任务上实现多维度、可解释的语音质量判断", "route": "(text prompt + speech audio) → Qwen2.5-Omni-7B-thinker → SFT → RCR-GRPO → <think> 多维度推理 </think> <answer> 偏好/评分 </answer>", "metrics": "T1 acc 65.06% / T3-Zh acc 91.30% / T4 acc 88.89% / T2 PCC 0.551,均超越 Gemini-2.5-Pro 和 SpeechJudge [Table 1]; BVCC cross-dataset PCC 0.498 vs Gemini-2.5-Pro 0.339 [Table 7]", "takeaway": "RCR-GRPO 的维度级 reasoning supervision (Eq. 10-11) 可迁移到任何需要 CoT+多维打分的 judge model 训练中; 冲突过滤 (cyclic A>B>C>A 移除) 提升标注质量", "limitation": "训练数据标注主要依赖 Gemini (LLM-as-annotator 而非人类);仅在 Qwen2.5-Omni-7B 上验证;GRPO 计算成本高 (480 GPU-hours);未覆盖重口音/重叠语音等困难场景", "concepts": ["TTSEvaluation", "DifferentiableRewardOptimization", "Audio-LanguagePretraining"], "source": "Sources/UniSRM.pdf", "github": "", "demo": ""}, {"name": "WavCube", "title": "WavCube: Unifying Speech Representation for Understanding and Generation via Semantic-Acoustic Joint Modeling", "arxiv_id": "2605.06407", "date": "2026-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-representation", "self-supervised-learning", "unified-representation", "diffusion", "TTS", "information-bottleneck", "semantic-acoustic"], "summary": "从 frozen WavLM 特征出发, 通过两阶段 compress-then-enrich 训练, 得到 128 维连续 latent, 同时支持语音理解 (接近 WavLM)、重建 (媲美 acoustic VAE) 和生成 (SOTA zero-shot TTS)", "route": "波形 --> WavLM encoder (1024d@50Hz) --> Semantic Compressor (3-layer Transformer+MLP) --> 128d latent --> Semantic Restorer (1024d) + Acoustic Decoder (32-layer Transformer + Vocos) --> 波形", "metrics": "Zero-shot TTS WER 1.86% / SIM-o 0.678 (LibriTTS, 150k steps) [Table 3]; WER 2.20% / SIM-o 0.709 (Emilia, 250k steps) [Table 4]; SUPERB 8x 压缩下接近 WavLM-Large [Table 2]; 重建 UTMOS 4.04 / STOI 0.97 [Table 1]", "takeaway": "(1) 信息瓶颈过滤 SSL 冗余维度使 latent 变得 diffusion-friendly; (2) semantic anchoring loss 在微调 SSL encoder 时防止语义漂移; (3) Stage 1 用 detached gradient 隔离 semantic 和 acoustic 训练目标", "limitation": "Speaker ID (SID) 从 WavLM 93.78% 降到 42.36%, 压缩损失严重 [Table 2]; 128-dim 仍是已评估中最大的 latent 维度; 仅在英文数据集上验证理解能力; 未探索 discrete token 化", "concepts": ["Self-SupervisedSpeechRepresentation", "SemanticvsAcousticTokens", "Diffusion-basedTTS", "VariationalAutoencoderforTTS", "MelSpectrogram", "ConditionalFlowMatching"], "source": "Sources/WavCube.pdf", "github": "", "demo": ""}, {"name": "X-Voice", "title": "X-Voice: Enabling Everyone to Speak 30 Languages via Zero-Shot Cross-Lingual Voice Cloning", "arxiv_id": "2605.05611", "date": "2026-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "cross-lingual", "voice-cloning", "zero-shot", "NAR-TTS", "multilingual", "IPA"], "summary": "0.4B 参数的 NAR flow-matching 多语言 TTS,通过 Dual-Level Language Injection + Decoupled Scheduled CFG + 两阶段训练实现 30 语言 transcript-free 零样本跨语言语音克隆", "route": "Target Text → IPA/Pinyin → Text Embedding + FiLM(LID) → DiT (22 layers, OT-CFM, Dual-Level LID injection at time+text levels) → Mel Spectrogram; 推理时 Decoupled CFG (acoustic wA=2.5 + linguistic wL=4.0 with A-Warmup + Decay) → Vocos vocoder → Waveform", "metrics": "Seed-TTS test-zh WER 1.28% / SIM 0.76 (X-Voice_s2); test-en WER 1.30% / SIM 0.65 (X-Voice_s2); RTF 0.073 (vs Qwen3-TTS 1.754); 30 语言 X-Voice Test Set 上 WER 接近 GT,SIM 竞争力强 [Table 3, 5]", "takeaway": "(1) Dual-Level Language Injection (time-level concat + text-level FiLM) 的口音抑制设计可迁移到任何需要全局条件 vs 局部条件解耦的生成任务; (2) Asymmetric Warmup CFG 的动机清晰 --- 语义引导在噪声早期无方向性,需要 warmup; 声学引导需要从一开始锚定; (3) 两阶段 SFT with synthetic prompts 消除 transcript 依赖的范式比 forced alignment 更简洁", "limitation": "(1) SIM 与 Qwen3-TTS/MOSS-TTS 等更大模型仍有差距; (2) 句内 code-switching 未优化; (3) Stage 2 依赖 Stage 1 合成数据质量; (4) 低资源欧洲语言 (如 Maltese) WER 仍很高 (~70%)", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "PhonemeRepresentation", "Non-autoregressiveTTS"], "source": "Sources/X-Voice.pdf", "github": "", "demo": ""}, {"name": "AST-Edit", "title": "AST: Adaptive, Seamless, Training-Free Precise Speech Editing", "arxiv_id": "2604.16056", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-editing", "training-free", "flow-matching", "latent-inversion", "TTS", "autoregressive", "guidance"], "summary": "利用 AM-FM TTS 模型的 flow matching latent space,通过 latent inversion + word-level recomposition + 自适应 mel-space guidance (AWFG) 实现 training-free 的精确语音编辑", "route": "source mel → inverse ODE → inverted latent; target text → AR model → semantic condition; LCS alignment → latent recomposition + µ recomposition → AWFG-guided forward ODE → edited mel", "metrics": "SpkSim 0.986 (SOTA), WDTW 0.2025 (SOTA), WER 2.91% (vs SSR-Speech 3.57%, Step-Audio-EditX 9.58%), DNSMOS 3.792 [Table 2, LibriSpeech-Edit]", "takeaway": "(1) latent inversion + recomposition 作为 training-free editing 的通用范式,可迁移到任何 AM-FM 模型; (2) AWFG 的自适应 guidance -- deviation-based dynamic weighting 避免 over-constraining; (3) WDTW 指标可用于评估任何需要保持未编辑区域时域一致性的任务", "limitation": "仅适用于 AM-FM 范式 TTS 模型; mel-space guidance 受 inversion 近似误差影响; 未开源; 仅在英文数据集上验证", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "MelSpectrogram"], "source": "Sources/AST-Edit.pdf", "github": "", "demo": ""}, {"name": "BeyondMonologue", "title": "Beyond Monologue: Interactive Talking-Listening Avatar Generation with Conversational Audio Context-Aware Kernels", "arxiv_id": "2604.10367", "date": "2026-04", "venue": "arXiv (USTC + iFLYTEK)", "org": "", "tier": "deep", "tags": ["full-duplex", "audio-driven-video", "talking-head", "avatar", "attention-mechanism", "DiT", "flow-matching", "dual-stream"], "summary": "提出 Multi-Head Gaussian Kernels (MHGK) 在 3D cross-attention 中注入多尺度时序先验,结合 Wan2.2-5B 骨架和双流 Q-Former 音频注入,实现首个统一的高质量全双工 talking-listening 虚拟人视频生成", "route": "Reference Image + Talking Audio + Listening Audio → Wav2Vec 2.0 → 独立 Causal Q-Former (talking/listening) → TL2V-DiT (3D Spatiotemporal CA + MHGK) → Wan2.2 3D VAE Decoder → Video [§3, Fig 2]", "metrics": "HDTF: FID 23.96 / CSIM 0.749 / LSE-C 6.58; MEAD: FID 21.82 / CSIM 0.876 / LSE-C 6.28; ResponseNet 交互: FID 18.48 / LSE-C 6.68; User Study listening MOS: Natural 4.14 / AV Align 4.18 (vs INFP 3.86/4.05) [Table 1, 2, 5]", "takeaway": "MHGK 的思路 — 用不同标准差的高斯核分配 attention head 的感受野,在任何需要同时保持局部对齐和全局上下文的跨模态 attention 中可直接复用;Q-Former 替代 all-zero CFG 的设计也可迁移到 audio-conditioned diffusion 系统", "limitation": "未开源代码/模型;VoxHear 数据集未公开;仅在 HDTF/MEAD/ResponseNet 上评测,缺乏 in-the-wild 验证;listening 行为评估依赖 user study (11 人) 而非自动化指标", "concepts": ["ConditionalFlowMatching", "DiffusionModel", "Classifier-FreeGuidance", "Full-duplexSpokenDialogue"], "source": "Sources/BeyondMonologue.pdf", "github": "", "demo": ""}, {"name": "CapTalk", "title": "CapTalk: Unified Voice Design for Single-Utterance and Dialogue Speech Generation", "arxiv_id": "2604.08363", "date": "2026-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "voice-design", "caption-conditioned", "dialogue", "autoregressive", "FHVAE", "CoT", "timbre-reuse"], "summary": "统一 caption-conditioned 自回归框架,通过 FHVAE-inspired 层次化变分条件实现单句+对话 voice design,解决了 timbre 保持与 context-adaptive expression 的冲突", "route": "Caption (APS/DSD/RP) + text → Backbone Transformer (Qwen, 预测第一层 codebook) → Decoder Transformer (预测剩余 15 层 codebook) → 16kHz speech; 对话分支额外引入 CoT (emotion/tone/pitch/energy/speed) 和 dialogue context", "metrics": "InstructTTSEval-ZH AVG 73.73 (best overall, RP 61.70 远超第二名 55.20) [Table 1]; 人工 MOS 4.20 (best), Role 4.17 (best) [Table 2]; 对话 SIM 0.808, Context Coherence 4.18, MOS 4.12 (均优于 Fish S2 Pro) [Table 7]; Timbre reuse SIM 0.92 (fixed e_spk) [Table 10]", "takeaway": "(1) FHVAE 的 utterance-conditioned KL prior 实现 timbre-expression 解耦,可迁移到任何需要稳定全局属性+局部自适应的生成任务; (2) CoT 显式规划 turn-level 属性,将高层情感意图和低层韵律实现分层建模; (3) 三种 caption style (APS/DSD/RP) 的数据增强策略", "limitation": "训练数据以自然会话为主,acted-style 表达强度偏弱 [§5.1.1]; 单句 timbre consistency 评分偏低 (3.59) 但这是 voice design 固有的 one-to-many 问题而非模型缺陷 [Appendix C]; 依赖 Qwen3-Omni 的 caption 质量 [§A]; 未开源代码/模型/数据", "concepts": ["NaturalLanguageDescriptionforTTS", "SpeakerEmbedding", "SpeechFactorization", "VariationalAutoencoderforTTS", "CodecLanguageModel", "EmotionControlinTTS", "ProsodyModeling"], "source": "Sources/CapTalk.pdf", "github": "", "demo": ""}, {"name": "ChainOfDetails", "title": "Text-To-Speech with Chain-of-Details: modeling temporal dynamics in speech generation", "arxiv_id": "2604.19330", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "non-autoregressive", "masked-generative", "coarse-to-fine", "discrete-token", "temporal-dynamics"], "summary": "将 coarse-to-fine 从 RVQ 层级维度转到时间分辨率维度,用共享 decoder 逐级精化时间细节,以更少参数实现竞争力 TTS", "route": "Text→G2P→Duration Predictor→Masked tokens @ level 1 (21Hz)→Shared Decoder (bidirectional)→level 2 (43Hz)→level 3 (86Hz)→DAC decoder→waveform", "metrics": "LibriSpeech WER 2.81% (CoD-Large, 503M) vs VALL-E 5.9% (60k hrs); SeedTTS WER 2.73% vs MaskGCT 2.62% (1B, 100k hrs) [Table I, Table III]", "takeaway": "(1) 时间维度 decimation 作为 coarse-to-fine 轴,与 RVQ 层级正交; (2) 所有 temporal level 共享一个 decoder 的参数复用设计; (3) 推理时 CFG scale 从高到低线性衰减 (3→0.75)", "limitation": "无 MOS 评测 (仅 WER); 仅 LibriTTS/MLS 英文数据; 未与 flow-matching 路线 (E2-TTS, VoiceBox) 对比; 未开源", "concepts": ["MaskedGenerativeModeling", "ResidualVectorQuantization", "Non-autoregressiveTTS", "Classifier-FreeGuidance", "DurationPredictor", "SemanticvsAcousticTokens"], "source": "Sources/ChainOfDetails.pdf", "github": "", "demo": ""}, {"name": "ConversationalTTS-RL", "title": "Enhancing Conversational TTS with Cascaded Prompting and ICL-Based Online Reinforcement Learning", "arxiv_id": "2604.08709", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["conversational-TTS", "in-context-learning", "reinforcement-learning", "online-RL", "style-control", "expressiveness", "cascaded-prompting", "CTC"], "summary": "提出 cascaded prompting (textual style token + human-curated audio prompt) 与 ICL-based online RL (AES-CE reward + CTC regularization) 相结合的对话 TTS 框架,实现数据高效的细粒度风格控制", "route": "LLM 生成 style token → AR prosody model (fine-grained audio prompt) → discrete prosody tokens → diffusion acoustic model (coarse-grained audio prompt) → BigVGAN vocoder → waveform", "metrics": "ICL vs Zero-shot: naturalness net win rate +7.5%, CVAD net win rate +79.6%; ICL vs GPT-4o: CVAD net win rate +5.6%; RL-AES-CTC vs SFT only: CMOS net win rate +7.1% (95% CI: 3.97%-10.23%) [Table 1, Table 2]", "takeaway": "(1) AR/diffusion 两阶段使用不同粒度 style prompt 减少 speaker drift; (2) CTC loss 作为 RL 正则化防止 reward hacking 和 text hallucination; (3) human-in-the-loop prompt selection 用 Monte Carlo estimation 的 lower-bound AES-CE score", "limitation": "全部使用 in-house 数据和模型,无标准 benchmark 对比; 仅英语评估; 人工 prompt selection 虽然 data-efficient 但仍需 human effort; RL 仅在 AR prosody model 上验证", "concepts": ["DifferentiableRewardOptimization", "ProsodyModeling", "EmotionControlinTTS", "StyleTransferinTTS", "LLM-basedTTS", "Diffusion-basedTTS"], "source": "Sources/ConversationalTTS-RL.pdf", "github": "", "demo": ""}, {"name": "MAGIC-TTS", "title": "MAGIC-TTS: Fine-Grained Controllable Speech Synthesis with Explicit Local Duration and Pause Control", "arxiv_id": "2604.21164", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "duration-control", "pause-control", "flow-matching", "zero-shot", "controllable-TTS", "token-level-control"], "summary": "在 F5-TTS flow matching backbone 上注入 token-level duration+pause 数值条件,通过 zero-value correction 和 cross-validated 高置信度时长标注实现可靠的局部时长控制", "route": "Text + Prompt Speech + (optional) Token-aligned Timing Track (d_i, p_i) → MLP timing encoders with zero-correction → residual injection into text embeddings → DiT-based CFM acoustic generator → Mel → Vocos vocoder → Waveform", "metrics": "C-MAE 10.56ms / C-Corr 0.918 (controlled) vs 36.88ms / 0.588 (spontaneous) [Table 1]; Seed-TTS-Eval EN WER 3.434 / SIM 0.638, ZH CER 2.215 / SIM 0.738 (spontaneous, quality trade-off) [Table 7]", "takeaway": "(1) zero-value correction (g(x)-g(0)) 使零值输入贡献零残差,防止高频零值 (如 pause=0) 产生 dense bias 淹没稀疏控制信号 (如 content duration); (2) cross-validation filtering (Stable-ts × MFA, B@150) 构建高置信度局部时长标注; (3) availability masking + duration dropout 使模型兼容有/无控制两种模式", "limitation": "未开源; spontaneous 模式下 Seed-TTS-Eval WER/CER 有显著退化 (EN WER 1.993→3.434); 评估主要在 B@150 子集上进行,规模和多样性有限; 中文 token-level 编辑评估受 MFA 词边界不稳定性限制", "concepts": ["ConditionalFlowMatching", "DurationPredictor", "ProsodyModeling", "Non-autoregressiveTTS"], "source": "Sources/MAGIC-TTS.pdf", "github": "", "demo": ""}, {"name": "MINT-Bench", "title": "MINT-Bench: A Comprehensive Multilingual Benchmark for Instruction-Following Text-to-Speech", "arxiv_id": "2604.17958", "date": "2026-04", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["TTS", "benchmark", "evaluation", "instruction-following", "multilingual", "controllability", "LALM-as-judge"], "summary": "首个结构化多语言 instruction-following TTS benchmark,通过分层 taxonomy + 三阶段数据构建 + 层级混合评估协议,在 10 语言上系统评估 TTS 指令遵循能力", "route": "4 轴 Taxonomy (难度/控制域/控制规格/细粒度模式) → 3 阶段数据构建 (节点规范 → 结构化标签计划 → 指令-文本对) → 3 层评估 (WER 内容一致性 → LALM 指令遵循 → 条件感知质量+音色多样性)", "metrics": "Gemini 2.5-Flash EN Overall PE 3.66 最高 [Table 3]; Qwen3-TTS ZH PE 3.12 超越所有商用系统 [Table 3]; LALM-human agreement Spearman 67-77 (接近人类间 69-79) [Table 5]; 覆盖 10 语言,大分割 890 对/语言,迷你分割 274 对/语言", "takeaway": "(1) 三阶段数据构建 pipeline 防止属性泄露和语义漂移; (2) 内容一致性系数 c 作为后续评分的缩放因子而非过滤门; (3) 条件感知质量评估仅对强指令遵循样本 (s=3) 启用,避免低质量样本干扰排名", "limitation": "覆盖范围有限 (不含长文本/对话/code-switching); 多语言不平衡 (中英大分割 vs 其他语言迷你分割); 依赖 Gemini 作为评估 LALM (可能存在偏差和版本依赖)", "concepts": ["Instruction-GuidedSpeechSynthesis", "TTSEvaluation", "NaturalLanguageDescriptionforTTS"], "source": "Sources/MINT-Bench.pdf", "github": "", "demo": ""}, {"name": "MambaVoiceCloning", "title": "MambaVoiceCloning: Efficient and Expressive Text-to-Speech via State-Space Modeling and Diffusion Control", "arxiv_id": "2604.00292", "date": "2026-04", "venue": "ICLR 2026", "org": "", "tier": "deep", "tags": ["TTS", "SSM", "Mamba", "diffusion", "voice-cloning", "streaming", "efficiency", "encoder-design"], "summary": "首个推理时完全无 attention 的 diffusion-based TTS conditioning stack,用三个 selective SSM (Mamba) 模块分别编码文本、节奏和韵律,在 protocol-matched 实验下小幅超越 StyleTTS2/VITS 并将编码器参数降至 21M、吞吐提升 1.6x [§1, Table 9]", "route": "phonemized text + reference audio → Bi-Mamba Text Encoder (gated bidirectional + AdaLN) + Temporal Bi-Mamba (rhythm/alignment) + Expressive Mamba (prosody/style) → [Training-only: attention-based aligner] → pitch modeling (SSM-only F0) → speech dynamics → StyleTTS2 diffusion decoder → HiFi-GAN/iSTFTNet vocoder [§3, Fig 1]", "metrics": "LibriTTS unseen MOS-N 4.22 / MOS-S 4.07 (vs StyleTTS2 4.15/4.03, VITS 3.69/3.54) [Table 1]; LJSpeech F0 RMSE 0.653, MCD 4.91, PESQ 3.85, RTF 0.0169 [Table 4]; Encoder params 21M (vs StyleTTS2 42M), throughput 1.6x, peak memory 72% [Table 9]; OOD MOS 3.88 vs StyleTTS2 3.87 [Table 2]; Long-form MOS 4.16 vs 3.91, RTF 0.0170 vs 0.0200 [Table 3]", "takeaway": "(1) Gated bi-directional Mamba fusion: sigmoid gate 调制 forward/backward 方向,改善长文本韵律一致性 [§3.2.1, Eq. 3]; (2) AdaLN + Mamba: 将 style embedding 通过 AdaLN 注入 SSM,实现 speaker conditioning [§3.2.1, Eq. 4]; (3) Training-time aligner + inference-time removal: 轻量 attention aligner 仅训练用,推理时丢弃,保持全 SSM 推理路径 [§3.3]; (4) Protocol-matched evaluation: 所有 baseline 在同一 mel-diffusion-vocoder pipeline 下重训,隔离 conditioning 效果 [§4.1]", "limitation": "仅英语数据集 (LJSpeech/LibriTTS) [§6 Limitations]; AdaLN 提供全局 style,不支持细粒度情感控制 [§6]; Diffusion decoder 仍占 54.2% 延迟,整体 RTF 改善有限 [Table 15]; 不与 NaturalSpeech 3/CosyVoice 3 等工业系统直接对比 (数据/规模差异) [§1, §4.1]; double-blind review 匿名", "concepts": ["Diffusion-basedTTS", "ProsodyModeling", "F0Modeling", "SpeakerEmbedding", "VoiceCloningTaxonomy", "DurationPredictor", "Non-autoregressiveTTS", "Attention-basedTTS"], "source": "Sources/MambaVoiceCloning.pdf", "github": "", "demo": ""}, {"name": "MimicLM", "title": "MimicLM: Zero-Shot Voice Imitation through Autoregressive Modeling of Pseudo-Parallel Speech Corpora", "arxiv_id": "2604.11552", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["voice-imitation", "voice-conversion", "zero-shot", "pseudo-parallel-data", "interleaved-text-audio", "DPO", "preference-alignment", "autoregressive"], "summary": "通过 \"role-swapping\" 数据构造(合成语音当 source、真实语音当 target)+ interleaved text-audio 建模 + DPO 对齐,实现简洁端到端的零样本 voice imitation,在自然度上显著超越 Vevo/SeedVC v2", "route": "Real speech → CosyVoice2 TTS 合成异说话人语音 (source) → Qwen2.5-0.5B decoder-only Transformer → interleaved text+audio chunks (chunked phase) + continuous remaining (continuous phase) → CosyVoice2 flow-matching decoder → waveform", "metrics": "N-MOS 4.71 vs Vevo 3.85 / SeedVC v2 3.14 [Table 2]; DPO 后 Real/Real WER 15.80→13.81% [Table 3]; S-SIM 0.601 (DPO) vs Vevo 0.652 [Table 1]", "takeaway": "Role-swapping 思路 — 让合成语音做输入而非输出,训练目标变为\"恢复真实语音\",突破合成质量天花板; interleaved text-audio 的 1:5 ratio 设计(text 领先 audio,提供语义锚点)", "limitation": "S-SIM 略低于 Vevo; WER 仍显著高于 timbre-only 系统; 依赖外部 TTS (CosyVoice2) 质量; 8.5M pairs 构造 + 2-stage DPO 训练成本高; 评估集中于英语", "concepts": ["SpeechFactorization", "LLM-basedTTS", "SpeechTokenizer", "DifferentiableRewardOptimization", "VoiceCloningTaxonomy"], "source": "Sources/MimicLM.pdf", "github": "", "demo": ""}, {"name": "OmniScript", "title": "OmniScript: Towards Audio-Visual Script Generation for Long-Form Cinematic Video", "arxiv_id": "2604.11102", "date": "2026-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["video-understanding", "video-to-script", "multimodal-LLM", "a
