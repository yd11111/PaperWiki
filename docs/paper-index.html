udio-visual", "long-form-video", "temporal-grounding", "reinforcement-learning", "GRPO"], "summary": "提出首个音频-视觉长视频到结构化脚本 (V2S) 的 8B 参数多模态模型,通过记忆增强标注 + CoT SFT + 时序分段 RL 奖励实现接近闭源 SOTA 的性能", "route": "长视频 → Whisper 音频编码 + Qwen3-VL 视觉编码 → AV-DeepStack 多层融合 → CoT 推理 (plot + character 关系) → 层级脚本解码 (Meta → Scene → Event → Fields)", "metrics": "5min 视频 Event Overall F1 37.7, tIoU@0.1 69.3 (vs Qwen3VL-235B: 33.0/62.0; vs Gemini-3-pro: 38.9/64.4) [Table 1]; Scene Overall F1 52.6, tIoU@0.1 74.6 [Table 2]", "takeaway": "(1) 时序分段奖励设计 — 将 RL 奖励按事件级 one-to-one 匹配分段计算,避免全局相似度被主要特征淹没短时事件; (2) 记忆增强标注管线 (CPM) — 跨段持久化角色档案 + 延迟命名策略解决跨场景角色追踪; (3) 两阶段长视频推理 (TSG) — 先规划后生成,实现几乎长度不变的性能", "limitation": "(1) 长视频 LCE 策略在 30min+ 出现性能悬崖; (2) 音频感知仍偏弱 (Audio Cue F1 仅 11.6); (3) benchmark 仅 10 部影视作品,泛化性存疑; (4) 未开源训练数据", "concepts": ["AudioUnderstanding", "Audio-LanguagePretraining"], "source": "Sources/OmniScript.pdf", "github": "", "demo": ""}, {"name": "OmniVoice", "title": "OmniVoice: Towards Omnilingual Zero-Shot Text-to-Speech with Diffusion Language Models", "arxiv_id": "2604.00688", "date": "2026-04", "venue": "Preprint (under review)", "org": "", "tier": "repro", "tags": ["TTS", "zero-shot", "non-autoregressive", "discrete-diffusion", "masked-generation", "multilingual", "multi-codebook", "LLM-initialization"], "summary": "首个单阶段离散 NAR TTS 支持 600+ 语言,通过 full-codebook random masking + LLM 初始化实现 SOTA 智能度和说话人相似度", "route": "Text tokens + Multi-codebook acoustic tokens (prompt+masked target) → Bidirectional Transformer (Qwen3-0.6B init) → C 个 codebook-specific prediction heads → 32-step iterative unmasking → Higgs-audio decoder → Waveform", "metrics": "LibriSpeech-PC WER 1.30% / SIM-o 0.729; Seed-TTS zh WER 0.84% / SIM-o 0.777; FLEURS-102 avg CER 4.00% (82/102 语言 CER≤5%); CMOS +0.44 vs ground truth; RTF 0.032 (16 steps, batch=1) [Table 1, 4, 2, 8]", "takeaway": "(1) Full-codebook random masking: 打破 per-layer masking 惯例,训练效率 C 倍提升且质量更好; (2) 用 AR LLM 权重初始化 bidirectional NAR 模型,免去从头训练; (3) 581k 小时全开源数据 + 语言级重采样公式 (Eq. 2) 的低资源语言扩展策略", "limitation": "仅用开源数据训练,部分语言质量受限; 数字/数学模式处理弱; 离散 NAR 尚无类似 flow distillation 的推理加速方法; 32 步推理仍慢于 flow-based 单步方案", "concepts": ["Non-autoregressiveTTS", "MaskedGenerativeModeling", "LLM-basedTTS", "SpeechTokenizer", "ResidualVectorQuantization", "Classifier-FreeGuidance", "Single-codebookvsMulti-codebook", "Diffusion-basedTTS"], "source": "Sources/OmniVoice.pdf", "github": "", "demo": ""}, {"name": "Qwen3.5-Omni", "title": "Qwen3.5-Omni Technical Report", "arxiv_id": "2604.15804", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["omni-model", "speech-LM", "multimodal", "TTS", "ASR", "streaming", "MoE", "voice-cloning"], "summary": "数百亿参数的全模态大模型,采用 Thinker-Talker + Hybrid MoE 架构,通过 ARIA 动态对齐和 RVQ+MTP 实现低延迟流式语音交互,在 215 个音频/音视频 benchmark 上达到 SOTA", "route": "(Text/Audio/Image/Video) → AuT encoder + Vision encoder → Thinker (Hybrid MoE) → text tokens → Talker (Hybrid MoE + ARIA) → RVQ tokens → MTP (residual codebooks) → Code2Wav (causal ConvNet) → waveform", "metrics": "SEED-TTS test-en WER 1.26 (SOTA) [Table 8]; MMAU 82.2 (超 Gemini-3.1 Pro 81.1) [Table 5]; Fleurs ASR avg WER 6.6% (vs Gemini-3.1 Pro 7.3%) [Table 13]; Plus 首包延迟 435ms (audio) / 651ms (video) [Table 1]; 29 语言 TTS 22/29 WER 最优 [Tables 9-10]", "takeaway": "ARIA 的自适应速率约束 — 对任意前缀,累计 speech/text token 比不超过全局比率,简单但有效地解决了跨语言编码效率不匹配;Thinker→Talker 条件化生成 (用 hidden state 而非仅 text tokens) 保留了上下文韵律信息", "limitation": "仅 API 可用,模型权重未开源;Plus 首包延迟 435ms 在 8 并发下升至 955ms;论文未报告 MOS 等主观评估;消融实验不足,ARIA 与 dual-channel 的直接对比数据缺失", "concepts": ["SpeechLanguageModel", "ResidualVectorQuantization", "Speech-TextAlignment", "StreamingSpokenDialogue", "Full-duplexSpokenDialogue", "LLM-basedTTS", "Turn-takinginSpokenDialogue", "SpeakerAdaptation", "ModalityAdaptationforSpeechLLM"], "source": "Sources/Qwen3.5-Omni.pdf", "github": "", "demo": ""}, {"name": "Step-Audio-R1.5", "title": "Step-Audio-R1.5 Technical Report", "arxiv_id": "2604.25719", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-reasoning", "RLHF", "RLVR", "chain-of-thought", "multi-turn-dialogue", "reinforcement-learning", "audio-understanding"], "summary": "提出 \"verifiable reward trap\" 概念,论证 RLVR 系统性损害音频模型的对话自然度,通过整合 RLHF (rubric-guided preference reward model + PPO) 在保持推理能力的同时大幅改善多轮交互体验 [§Abstract]", "route": "Input audio → Qwen2 audio encoder (frozen, 25Hz) → Audio adaptor (2x down, 12.5Hz) → Qwen2.5 32B LLM decoder (CoT: reasoning trace → final reply) → text output [§2]", "metrics": "Avg 77.97 / 8 benchmarks (vs R1 72.50, +5.47); Audio MC 41.15 (vs R1 24.61, +67%); Step-DU 82.76 (vs R1 64.37, +18.39); 竞争 Gemini 3 Pro (79.67) [Table 1]", "takeaway": "(1) \"Verifiable reward trap\" 诊断框架: RLVR 将连续感官信号压缩为离散标签,系统性忽视 \"how to say it\"; (2) Rubric-based generated reward model: 支持 rubric-guided + ordinary preference 两种评估模式的统一 RLHF; (3) 联合优化 instruction-sensitive 和 preference-sensitive 目标 (非分阶段训练,避免遗忘)", "limitation": "纯文本输出模型,不生成语音 (对话体验改善的评估依赖 benchmark 分数而非主观 MOS); 论文声称\"改善对话自然度\"但缺乏韵律/自然度维度的直接评估 (无 MOS/CMOS/prosody metrics); 仅 32B 参数; 训练数据细节未公开; RLHF 的 reward model 质量和 human annotation 规模未说明", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "DifferentiableRewardOptimization", "ModalityAdaptationforSpeechLLM", "SpokenDialogueEvaluation", "ProsodyModeling"], "source": "Sources/Step-Audio-R1.5.pdf", "github": "", "demo": ""}, {"name": "T5Gemma-TTS", "title": "T5Gemma-TTS Technical Report", "arxiv_id": "2604.01760", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "encoder-decoder", "zero-shot", "voice-cloning", "multilingual", "codec-LM", "duration-control", "PM-RoPE"], "summary": "用 T5Gemma 预训练 encoder-decoder 骨干 + XCodec2 单码本 + PM-RoPE 进度感知 cross-attention,实现持久文本 conditioning 和可控时长的多语言 zero-shot TTS", "route": "文本→T5Gemma encoder(26层, bidirectional)→cross-attention(PM-RoPE)→T5Gemma decoder(26层, AR)→XCodec2 tokens→waveform", "metrics": "日语 CER 0.126 / SIM 0.677(vs XTTS v2 0.622, CI不重叠) [Table 2]; 韩语(未见语言) SIM 0.747 / CER 0.082 [Table 2]; PM-RoPE 关闭→CER 0.129→0.982 [Table 3]", "takeaway": "PM-RoPE 作为进度信号注入 cross-attention 的方法可迁移到任何 encoder-decoder 序列生成任务;subword 输入替代 phoneme 消除多语言前端工程", "limitation": "RTF 0.8-2.0 远慢于 NAR 方法;UTMOS 低于 flow-matching/diffusion 后端;PM-RoPE 对 subword 输入(vs phoneme)的影响未做消融;英语评估有 LibriHeavy/LibriSpeech 数据泄漏", "concepts": ["CodecLanguageModel", "LLM-basedTTS", "Single-codebookvsMulti-codebook", "DurationPredictor", "VoiceCloningTaxonomy", "PhonemeRepresentation"], "source": "Sources/T5Gemma-TTS.pdf", "github": "", "demo": ""}, {"name": "TTS-PRISM", "title": "TTS-PRISM: A Perceptual Reasoning and Interpretable Speech Model for Fine-Grained Diagnosis", "arxiv_id": "2604.22225", "date": "2026-04", "venue": "Interspeech 2026 (submitted)", "org": "", "tier": "deep", "tags": ["TTS", "evaluation", "speech-quality", "multi-dimensional", "instruction-tuning", "audio-LLM", "interpretable", "Mandarin"], "summary": "为中文 TTS 建立 12 维分层诊断框架,通过 schema-driven instruction tuning 在 7B 模型上实现单次推理的多维评分 + 可解释推理,人类对齐度超越 30B+ 通用模型", "route": "音频波形 → MiMo-Audio encoder (acoustic/semantic/text tokens) → LLM backbone (7B) → [R1,S1,...,R12,S12] 交错输出 (先 rationale 后 score)", "metrics": "12 维平均 LCC 0.717 / SRCC 0.721 / MSE_norm 0.044, 超越 Gemini-2.5-Pro (LCC 各维 0.587-0.808) 和 Qwen3-Omni (LCC 0.169-0.665); RSC 0.98 vs Qwen3-Omni 0.88 [Table 1, §4.1]", "takeaway": "(1) 对抗扰动 + 专家锚点构建训练数据的策略 — 去掉 negatives 后 LCC 从 0.717 暴跌至 0.150, 比不训练还差; (2) 交错 [R,S] 输出序列作为逻辑正则化器,迫使模型先推理后打分", "limitation": "仅中文; 发音准确率维度弱于 Gemini-2.5-Pro (ASR 预训练的 error-tolerant 偏差难以通过 SFT 消除); 12 维 schema 人工设计,可扩展性待验证", "concepts": ["TTSEvaluation", "ProsodyModeling", "AudioUnderstanding", "EmotionControlinTTS", "Instruction-GuidedSpeechSynthesis"], "source": "Sources/TTS-PRISM.pdf", "github": "", "demo": ""}, {"name": "UltraLowLatencyTTS", "title": "An Ultra-Low Latency, End-to-End Streaming Speech Synthesis Architecture via Block-Wise Generation and Depth-Wise Codec Decoding", "arxiv_id": "2604.12438", "date": "2026-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["streaming-TTS", "non-autoregressive", "neural-audio-codec", "discrete-token", "depth-wise-decoding", "low-latency", "end-to-end"], "summary": "将 FastSpeech 2 的输出头从连续 mel 回归替换为 32 层 RVQ 离散分类,通过 depth-wise sequential decoding 逐层条件预测 Mimi codec tokens,完全绕过 vocoder,实现 RTF 0.0033 / TTFB 48.99ms 的端到端流式合成", "route": "Phoneme → FastSpeech 2 Encoder + Variance Adaptor → Length Regulator (12.5 Hz) → Depth-wise Cascaded Discrete Decoder (32 heads, 逐层条件累加) → Mimi Frozen Decoder → 24kHz Waveform", "metrics": "RTF 0.0033 (303x 实时), TTFB 48.99ms; English MOS 2.51 vs FS2+PWG 2.81 [Table 8]; V/UV Error 2.67% (优于 VITS 2.82% 和 FS2 3.62%) [Table 4]; WER 8.89% [Table 5]", "takeaway": "(1) depth-wise sequential decoding 的递归条件累加公式 h_{t,i} = h_t + sum(E_j(y_{t,j})) — 简单但有效地利用 RVQ 层级依赖; (2) staged loss weighting (层1-4 权重1.0, 5-16 权重0.5, 17-32 权重0.1) 防止高阶 codebook 信息塌陷; (3) dummy token 机制处理 sub-frame phoneme 对齐问题", "limitation": "(1) English MOS 仅 2.51,显著低于 GT 4.51 和 baseline 2.81,质量-效率 trade-off 偏向效率; (2) 仅单说话人实验,无 zero-shot/多说话人能力; (3) 代码未公开; (4) 评估者非母语(English MOS 评分可能有偏差); (5) MCD 10.20 dB 显著高于 VITS 7.31 dB 和 FS2 8.24 dB", "concepts": ["ResidualVectorQuantization", "Non-autoregressiveTTS", "NeuralVocoder", "DurationPredictor", "MelSpectrogram", "SemanticvsAcousticTokens", "TokenRateandBitrateTrade-offs"], "source": "Sources/UltraLowLatencyTTS.pdf", "github": "", "demo": ""}, {"name": "UniSonate", "title": "UniSonate: A Unified Model for Speech, Music, and Sound Effect Generation with Text Instructions", "arxiv_id": "2604.22209", "date": "2026-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "TTM", "TTA", "unified-audio", "instruction-control", "MM-DiT", "flow-matching", "natural-language-description"], "summary": "首个用 flow matching + MM-DiT 统一 TTS/TTM/TTA 三模态生成的框架,通过动态 token 注入将非结构化 SFX 融入 phoneme 驱动架构,课程学习实现正向迁移", "route": "NL instruction → Qwen2.5-7B (frozen) + content (phoneme for speech/music, [SFX] tokens for effects) → Zipformer → Joint DiT 14L + Single DiT 6L → CFM ODE solver → Mel-VAE decoder → speech/music/SFX", "metrics": "TTS WER EN 1.47% / ZH 1.25% (best); SongEval Coh 3.18 (SOTA); TTA FAD 4.21 (competitive); 联合训练 vs 单任务: WER 2.24→1.47, Coh 3.11→3.18 [Table 3, 4, 5, 6, 7]", "takeaway": "(1) 动态 token 注入: 用 phoneme-to-duration 比率 lambda 将 SFX 符号化为伪音素序列,复用 phoneme 驱动架构; (2) 三阶段课程学习: speech→music→SFX 渐进扩展避免负迁移; (3) 正向迁移的经验证据: 联合训练显著提升各单任务性能", "limitation": "TTA 与专用 SOTA (GenAU-L FAD 2.07) 差距明显 (FAD 4.21); 仅支持 2-20s 短片段; 纯文本控制的 one-to-many 模糊性; 1.3B 参数推理成本高; 未开源", "concepts": ["Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "ConditionalFlowMatching", "Diffusion-basedTTS", "VariationalAutoencoderforTTS", "PhonemeRepresentation"], "source": "Sources/UniSonate.pdf", "github": "", "demo": ""}, {"name": "UnifiedAudioSchema", "title": "Beyond Transcription: Unified Audio Schema for Perception-Aware AudioLLMs", "arxiv_id": "2604.12506", "date": "2026-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["AudioLLM", "perception", "paralinguistic", "supervision", "structured-schema", "audio-understanding", "speech-factorization", "JSON-supervision"], "summary": "提出 Unified Audio Schema (UAS),将音频监督信号从纯 ASR 文本扩展为 Transcription + Paralinguistics + Non-linguistic Events 三组件结构化 JSON,解决 AudioLLM 感知能力系统性不足的问题", "route": "音频 → Audio Encoder (AuT) → Projection Layer → LLM (Qwen2.5-7B) → text/audio output; 训练时用 UAS JSON 作为监督目标,推理时可用标准 prompt 不生成完整 JSON", "metrics": "MMSU perception +10.9% (55.7% vs best baseline 44.8%); MMSU reasoning 77.4% (与 Qwen2.5-Omni 77.6% 持平); MMAR overall 60.1% (SOTA); MMAU average 69.4%; Seed-TTS WER avg 1.6 (best) [Table 1, Table 2]", "takeaway": "(1) 结构化 JSON 作为训练时的密集监督信号、推理时可灵活切换的设计模式; (2) 感知与推理独立的实验证据可迁移到 TTS 评估; (3) UAS-QA 辅助数据集将 schema 知识转化为 task performance 的训练策略", "limitation": "仅验证中英两种语言; 单说话人场景(不处理 cocktail party); 训练成本未公开; 对比 baseline 有限(仅 3 个 7B 模型)", "concepts": ["AudioUnderstanding", "SpeechFactorization", "ProsodyModeling", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/UnifiedAudioSchema.pdf", "github": "", "demo": ""}, {"name": "VoxSafeBench", "title": "VoxSafeBench: Not Just What Is Said, but Who, How, and Where", "arxiv_id": "2604.14548", "date": "2026-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["SLM-safety", "social-alignment", "fairness", "privacy", "benchmark", "speech-grounding", "jailbreak", "audio-conditioned"], "summary": "首个联合评估 SLM 安全/公平/隐私的 benchmark,通过 Two-Tier 设计分离内容风险与语音上下文风险,揭示当前 SLM 普遍存在的\"speech grounding gap\" -- 文本级安全屏障无法迁移到语音原生条件", "route": "文本数据采集 → CosyVoice3 合成三视图 (Text/Clean Audio/Diverse Audio) + Tier 2 声学 cue 注入 → Whisper-v3 WER<5% 质量过滤 → 22 任务 (Safety/Fairness/Privacy x Tier 1/Tier 2) → 6 开/闭源 SLM 评估 → DeepSeek-V3 LLM-as-Judge", "metrics": "Safety Tier 2: 最好 SAR 76.1% (Gemini-3-Pro, impaired) vs 文本上限 100% [Table 3]; Fairness: Tier 1→Tier 2 Fair Rate 普遍暴跌 (e.g. GPT-4o Criminality 70.7%→38.5%) [Table 4]; Privacy: Gemini-3-Pro 硬隐私泄漏率从 text 23.9% 跳至 audio 81.2% [Table 5]", "takeaway": "(1) Two-Tier 设计范式: 分离\"规范知识缺失\"与\"规范应用失败\",可迁移到任何需要区分能力瓶颈与对齐瓶颈的评估场景; (2) 中间感知探测 (intermediate perception probes) + 文本参考上限作为构建有效性验证方法", "limitation": "(1) 大部分音频为 CosyVoice3 合成而非自然录音,真实场景失败可能更严重; (2) Tier 2 使用高显著性 cue,模型对更微妙线索可能更差; (3) 文本参考上限并非 oracle (只验证规范可达性,不代表完美表现)", "concepts": ["SpeechLanguageModel", "AudioUnderstanding"], "source": "Sources/VoxSafeBench.pdf", "github": "", "demo": ""}, {"name": "WAND", "title": "WAND: Windowed Attention and Knowledge Distillation for Efficient Autoregressive Text-to-Speech Models", "arxiv_id": "2604.08558", "date": "2026-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "efficient-inference", "sliding-window-attention", "knowledge-distillation", "KV-cache", "autoregressive", "LLM-based", "curriculum-learning"], "summary": "通过将 AR-TTS 的注意力分为 global (conditioning) + local sliding-window (generated tokens),配合 KD 和 curriculum learning,实现常数内存/计算推理,且几乎无质量损失", "route": "Pretrained AR-TTS → 注意力分区 (global + local window W) → curriculum scheduling (W_start→W) → KD (L_CE + λL_KL) from full-attention teacher → 1 epoch fine-tuning on 100h", "metrics": "KV cache -50~66% (max IndexTTS -66.2%), GFLOPs -34~47% (max IndexTTS -46.9%), speedup 1.51-1.89x, WER 持平或改善 (CosyVoice 2: 1.94→1.72%), 跨语言 CER 退化 <0.1% (CosyVoice 2/IndexTTS), SparkTTS +0.21% [Table 1, Table 3]", "takeaway": "(1) global/local 注意力分区策略可推广到所有 prefix-conditioned AR 生成模型; (2) 注意力质量分布分析方法(量化 prompt vs generated 的注意力占比)可用于验证窗口大小选择; (3) curriculum + soft mask 渐进训练策略", "limitation": "仅验证 ≤0.5B 模型 + 10s 生成; window size 需根据 token rate 手动选择; 未在 >1B 模型或分钟级生成上验证; 无开源代码", "concepts": ["LLM-basedTTS", "CodecLanguageModel", "FiniteScalarQuantization", "Single-codebookvsMulti-codebook"], "source": "Sources/WAND.pdf", "github": "", "demo": ""}, {"name": "AccentVector", "title": "Accent Vector: Controllable Accent Manipulation for Multilingual TTS Without Accented Data", "arxiv_id": "2603.07534", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "accent", "task-vector", "LoRA", "multilingual", "controllable-TTS", "XTTS", "zero-shot"], "summary": "将 LoRA 微调后的参数差作为\"Accent Vector\",通过参数空间的线性缩放和插值实现无口音数据的细粒度口音控制和混合口音合成", "route": "目标语言母语数据 → LoRA 微调 XTTS-v2 → 提取参数差 τ = θ_ft - θ_pre = θ_LoRA → 推理时 θ_accent = θ_pre + α·τ → 口音语音", "metrics": "British accent prob 23.3→56.7% (+143%), Hindi 2.2→24.2% (+1021%), 人类口音识别准确率 53-80%, SSIM 维持 ~0.86-0.90, UTMOS 2.59-3.61 [Table 3][Table 6]", "takeaway": "将 LoRA 权重差视为可操控的属性向量,通过线性缩放控制属性强度 — 可迁移到情感、语速等其他可控 TTS 场景; 多向量线性组合实现多属性混合", "limitation": "对声调语言(普通话)效果最弱(+23.6% vs 其他语言 +90-1021%); 评估依赖有偏代理模型(VoxProfile/Whisper/UTMOS); 仅在 XTTS-v2 上验证; 训练数据 UTMOS 中等偏低", "concepts": ["SpeakerAdaptation", "ProsodyModeling", "StyleTransferinTTS"], "source": "Sources/AccentVector.pdf", "github": "", "demo": ""}, {"name": "Affectron", "title": "Affectron: Emotional Speech Synthesis with Affective and Contextually Aligned Nonverbal Vocalizations", "arxiv_id": "2603.14432", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "nonverbal-vocalization", "data-augmentation", "codec-LM", "expressive-speech", "VoiceCraft", "EnCodec"], "summary": "在 verbal-only 预训练 NCLM 上,通过情感驱动的 NV 数据增强 + 结构化 masking 实现多样化、情感一致的 NV 合成", "route": "文本 + 情感参考音频 → (训练时) Emotion2Vec NV 匹配 + 球面角距离位置路由 → NV 增强 token 序列 + NV 结构化 masking → VoiceCraft Transformer AR 生成 → EnCodec 解码 → 带 NV 的语音", "metrics": "NV-Acc 37.75% (seen) / 36.90% (unseen) vs VoiceCraft 10.49/11.90 [Table 1]; NV type Acc@5 91.69%, JSD 0.0051 远优于 LLM baselines [Table 2]; AB test 一致偏好 affect-aware 增强 [Fig 3]", "takeaway": "(1) 用 decoupled 语料 (语音和 NV 分开录制) + 情感 embedding 匹配来合成训练样本,绕过对齐标注; (2) 球面坐标角距离衡量局部情感稳定性选择 NV 插入位置; (3) 结构化 masking 让 verbal 上下文双向条件化 NV 生成", "limitation": "仅 EARS (100h) 小语料训练,无法与大规模系统直接对比; decoupled 设计无法建模 verbal-NV 重叠; 代码已开源", "concepts": ["EmotionControlinTTS", "CodecLanguageModel", "ProsodyModeling", "Self-SupervisedSpeechRepresentation", "MaskedGenerativeModeling"], "source": "Sources/Affectron.pdf", "github": "", "demo": ""}, {"name": "AnatomyofModalityGap", "title": "Anatomy of the Modality Gap: Dissecting the Internal States of End-to-End Speech LLMs", "arxiv_id": "2603.01502", "date": "2026-03", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-LM", "modality-gap", "interpretability", "CKA", "speech-representation", "reasoning", "multimodal"], "summary": "通过逐层表征分析,发现 Speech LLM 的 modality gap 根源不是几何对齐不足,而是语音冗余导致的 Information Dilution -- 语义信息分散在过多 token 中,阻碍了 LLM 晚期层的决策锐化", "route": "语音/文本输入 → 四个开源 LSLM → 逐层提取 hidden states → DTW 对齐 speech-text tokens → Cross-layer CKA + Logit Lens + Probing + Attention 分析 → 三阶段框架 (Structural Transformation → Semantic Smearing → Decision Instability)", "metrics": "Qwen2.5-Omni S2T vs T2T: SpeechMMLU -6.7%, BBH -3.9%; MiniCPM-o: SpeechMMLU -13.8%, BBH -10.2%; 输入层统计校准导致 BBH -15.5% 崩溃; 文本注入 8x 冗余: SpeechMMLU 73.9%→51.2%, BBH 62.4%→53.5% [Fig 1, Table 1, Table 3]", "takeaway": "(1) Cross-layer CKA + DTW 对齐的分析框架可迁移到任何多模态 LLM 的模态差异诊断; (2) \"注入冗余到文本\"的因果验证思路 -- 通过降低文本信息密度来模拟语音特性; (3) KV token merging 作为推理时轻量级缓解方案 (cosine>0.90 阈值)", "limitation": "纯诊断性工作,未提出有效的工程解决方案; KV token merging 仅带来 +0.1~+0.5 pp 改善; 文本冗余注入是离散的,与语音连续冗余机制不同; 仅评估 4 个模型,缺乏对 discrete-token-based LSLM 的分析", "concepts": ["ModalityAdaptationforSpeechLLM", "SpeechLanguageModel", "Speech-LLMIntegrationTaxonomy", "AudioUnderstanding", "Self-SupervisedSpeechRepresentation", "SemanticvsAcousticTokens"], "source": "Sources/AnatomyofModalityGap.pdf", "github": "", "demo": ""}, {"name": "BorderlessLongSpeech", "title": "Any2Speech: Borderless Long Speech Synthesis", "arxiv_id": "2603.19798", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "long-form", "agentic", "data-strategy", "hierarchical-annotation", "chain-of-thought", "instruction-following", "multi-speaker"], "summary": "提出 Generation 4 Native Agentic TTS 框架,通过 \"label don't filter\" 数据策略 + Global-Sentence-Token 分层标注 + CoT 推理 + Dimension Dropout,实现跨句情感弧连贯的长语音场景合成", "route": "任意输入 → LLM Agent(结构化为 GST schema)→ Instruct+Think 分流 → CoT 推理(Global→Sentence→Token 逐级规划) → 连续 tokenizer backbone → 长音频", "metrics": "无定量评估结果 -- 作者明确指出 Gen 4 TTS 的评估框架是开放问题 [§5]", "takeaway": "(1) \"label don't filter\" 数据哲学可用于任何含噪语音数据场景; (2) Global-Sentence-Token 分层控制协议可作为 TTS agent 系统的接口标准; (3) Dimension Dropout 的部分条件训练思路可迁移到其他条件生成任务", "limitation": "无开源; 无定量实验/对比; 仅面向离线内容创作,未覆盖实时交互; 模型架构细节缺失(backbone 仅一句话带过)", "concepts": ["LLM-basedTTS", "Instruction-GuidedSpeechSynthesis", "EmotionControlinTTS", "ProsodyModeling", "NaturalLanguageDescriptionforTTS"], "source": "Sources/BorderlessLongSpeech.pdf", "github": "", "demo": ""}, {"name": "EntropyGRVQ", "title": "Entropy-Guided GRVQ for Ultra-Low Bitrate Neural Speech Codec", "arxiv_id": "2603.01476", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-codec", "quantization", "ultra-low-bitrate", "GRVQ", "entropy", "codebook-efficiency", "speech-compression"], "summary": "用信道方差作为信息量代理,将 GRVQ 的均分改为熵引导的不等分组,在 0.6875 kbps 超低比特率下改善 codebook 利用率和感知质量", "route": "24kHz waveform → Conv encoder (512d, 12.5 Hz) → Transformer bottleneck → 分支: (1) 语义 VQ (1 codebook, WavLM 蒸馏) + (2) EG-GRVQ (4 codebooks, 2 groups, 方差均衡分组) → 求和 → Conv decoder → 24kHz waveform", "metrics": "PESQ 1.881 (vs retrain 1.779, +0.10), STOI 0.890 (vs 0.886), ViSQOL 2.496 (vs 2.546 retrain), MUSHRA +21 over official Mimi, +11 over GRVQ [Table 1, Fig 4-5]", "takeaway": "信道方差均衡分组的思路可推广到任何 GRVQ/GVQ 系统; 方差统计只需在训练集上做一次,zero overhead at inference", "limitation": "分组点固定(k=237),未探索自适应分组; 仅在 0.6875 kbps 单一比特率下验证; 训练数据规模有限(LibriTTS+VCTK); SDR 指标略劣于 retrained Mimi", "concepts": ["ResidualVectorQuantization", "SemanticvsAcousticTokens", "CodebookCollapse", "CodecTrainingObjectives", "TokenRateandBitrateTrade-offs"], "source": "Sources/EntropyGRVQ.pdf", "github": "", "demo": ""}, {"name": "FishAudioS2", "title": "Fish Audio S2 Technical Report", "arxiv_id": "2603.08823", "date": "2026-03", "venue": "Technical Report", "org": "", "tier": "deep", "tags": ["TTS", "LLM", "dual-AR", "RVQ", "audio-codec", "GRPO", "reinforcement-learning", "zero-shot"], "summary": "Fish-Speech S1 的全面升级版 — 用 Qwen3-4B 作为 Slow AR backbone + RVQ 语义蒸馏 tokenizer + GRPO 多维度 RL 对齐,实现指令控制、多说话人对话和长文本合成", "route": "Text + Reference Audio → Qwen3-4B (Slow AR, semantic tokens) → 4-layer Fast AR (acoustic tokens, depth-wise) → Multi-Codebook Fusion → 10-layer RVQ Codec (21 Hz, 44.1kHz) with EVA-GAN Decoder → Waveform", "metrics": "Seed-TTS-Eval WER 0.54%/0.99% (zh/en) [Table 1]; ATT posterior mean 0.515 (w/ instruction) [Table 5]; EmergentTTS-Eval win rate 81.88% [Table 6]; RTF 0.195, TTFA <100ms [§5]", "takeaway": "(1) 数据 pipeline 的 dual-purpose 设计 — 质量模型和 ASR 模型既做预训练过滤又做 RL reward,消除分布偏移; (2) Dr.GRPO 去除标准差归一化避免难度偏差; (3) LoRA weight-swap 机制节省 RL 中 reference model 的显存; (4) SGLang RadixCache 对 reference audio KV 缓存实现 86.4% 命中率", "limitation": "(1) Qwen3-4B backbone 非自研,受限于其 tokenizer 和架构; (2) RL reward 中的 ASR 模型 (Qwen3-Omni-30B-A3B) 远大于 TTS 模型本身,部署成本高; (3) 消融实验极少,难以归因各组件贡献; (4) Fish Audio Instruction Benchmark 是自建,缺乏第三方验证", "concepts": ["LLM-basedTTS", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "SpeechTokenizer", "DifferentiableRewardOptimization"], "source": "Sources/FishAudioS2.pdf", "github": "", "demo": ""}, {"name": "HowOpenIsOpenTTS", "title": "How Open is Open TTS? A Practical Evaluation of Open Source TTS Tools", "arxiv_id": "2603.24116", "date": "2026-03", "venue": "IEEE Access", "org": "", "tier": "deep", "tags": ["TTS", "benchmark", "open-source", "low-resource", "Romanian", "evaluation", "speaker-adaptation", "reproducibility"], "summary": "系统性评估 FastPitch/VITS/Grad-TTS/Matcha-TTS 四个开源 TTS 在 Romanian 低资源场景下的可用性与合成质量,发现架构选择比数据量/训练时长更重要", "route": "SWARA 语料(21h Romanian) → 标准化 phoneme pipeline (eSpeak-NG) → 16 说话人 eigen-voice 基线训练 → 2 说话人 finetuning (10/1000 samples x 120/400/4000 iterations) → 客观+主观评估", "metrics": "FastPitch WER 最低 2.1% [Fig 1]; VITS 主观 naturalness+similarity 最高 [Fig 9,10]; Matcha-TTS UTMOS 最高 ~3.12 [Fig 2]; 31 人听感测试 [§4.3]", "takeaway": "(1) 开源 TTS 工具的工程可用性评分框架(安装/文档/社区/适配); (2) 客观-主观评估不一致的系统性证据(UTMOS vs 人类判断); (3) 10-sample finetuning 的快速基线方法", "limitation": "仅评估前一代(非 LLM-era)架构,未纳入 VALL-E/CosyVoice 等新范式; 仅 Romanian 单语言; 训练均 from-scratch 而非利用预训练 checkpoint; Parler-TTS 因训练失败被排除", "concepts": ["TTSEvaluation", "SpeakerAdaptation", "NeuralVocoder", "ConditionalFlowMatching", "Diffusion-basedTTS", "Non-autoregressiveTTS", "DurationPredictor", "F0Modeling", "MelSpectrogram"], "source": "Sources/HowOpenIsOpenTTS.pdf", "github": "", "demo": ""}, {"name": "InterspeechAudioEncoderChallenge", "title": "The Interspeech 2026 Audio Encoder Capability Challenge for Large Audio Language Models", "arxiv_id": "2603.22728", "date": "2026-03", "venue": "Interspeech 2026", "org": "", "tier": "deep", "tags": ["audio-encoder", "LALM", "benchmark", "evaluation", "audio-understanding", "feature-fusion", "SSL", "LoRA"], "summary": "提出 XARES-LLM 框架和 Interspeech 2026 Audio Encoder Challenge,通过冻结 encoder + 可训练 projector + LoRA LLM 的统一生成式评估,22 支团队的结果证明 LALM-aligned audio encoder 在通用音频表征上全面优于传统 SSL encoder", "route": "Frozen Audio Encoder → Projector MLP → LoRA-enhanced SmolLM2-135M → Text Output (classification labels / transcriptions / captions)", "metrics": "Track A 冠军 THUVoice 91.2% avg (21 classification tasks); Track B 冠军 trans-encoder 65.9% avg (9 understanding tasks) [Table 4, Table 5]", "takeaway": "(1) 用极小 LLM (135M) 作为 encoder 评估探针,使评估结果归因于 encoder 而非 LLM; (2) 解耦 encoder/LLM 开发的实验范式可迁移到 TTS encoder 评估; (3) feature fusion (多 encoder 组合) 是低成本提升通用性的有效策略", "limitation": "(1) 仅评估冻结 encoder,不考虑 encoder 与 LLM 联合训练的场景; (2) SmolLM2-135M 可能限制了对复杂推理任务的评估天花板; (3) 不涉及 TTS/生成类任务,仅覆盖理解端; (4) LALM-aligned encoder 的优势可能部分源于更大规模训练数据而非架构本身", "concepts": ["Audio-LanguagePretraining", "AudioUnderstanding", "Self-SupervisedSpeechRepresentation", "ModalityAdaptationforSpeechLLM", "SpeakerEmbedding"], "source": "Sources/InterspeechAudioEncoderChallenge.pdf", "github": "", "demo": ""}, {"name": "IterateDifferentiate", "title": "Iterate to Differentiate: Enhancing Discriminability and Reliability in Zero-Shot TTS Evaluation", "arxiv_id": "2603.24430", "date": "2026-03", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "evaluation", "zero-shot", "iterative-evaluation", "metrics", "score-saturation", "discriminability", "human-alignment"], "summary": "通过递归使用模型自身合成输出作为参考音频进行迭代合成,利用差异化退化放大模型间性能差距,从而恢复已有客观指标对 SOTA TTS 系统的区分力和人类对齐性", "route": "(ref_wav, ref_text, target_text) → TTS model → synthesized_wav → 替换 ref_wav → 重复 N 次 → 聚合多轮指标(Mean/LWA/EWA/AUC) → 排名", "metrics": "UTMOSv2 system-level SRCC 从 0.118 提升至 0.464 (Mean); DNSMOS 从 0.091 提升至 0.255; 10 轮后 SIM 标准差从 3.83 扩大至 12.15, CER 标准差从 0.64 扩大至 17.62 [Table 3, Fig 3]", "takeaway": "迭代合成作为\"模型压力测试\"的思路可迁移到任何生成模型评估场景 — 不需要新指标,只需让模型反复处理自身输出,观察退化速率; 5 轮迭代即可达到接近 10 轮的区分效果 [Fig 4]", "limitation": "计算成本线性增长(N 倍推理); 迭代评估偏好稳定性而非多样性/表现力; 仅评估开源模型,商业模型未覆盖; naturalness 与 speaker similarity 在低质量参考下存在冲突", "concepts": ["TTSEvaluation"], "source": "Sources/IterateDifferentiate.pdf", "github": "", "demo": ""}, {"name": "LLaDA-TTS", "title": "LLaDA-TTS: Unifying Speech Synthesis and Zero-Shot Editing via Masked Diffusion Modeling", "arxiv_id": "2603.26364", "date": "2026-03", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "masked-diffusion", "non-autoregressive", "zero-shot", "speech-editing", "discrete-diffusion", "LLM-based"], "summary": "将 AR-pretrained TTS LLM 转换为 masked discrete diffusion decoder,仅改 attention mask + 训练目标,50 小时数据即可匹配原 AR 性能并获得 2x 加速 + 免训练 speech editing。", "route": "Text + Prompt → [Qwen2-0.5B, bidirectional attention + 1/t masked diffusion] → Discrete Speech Tokens (T 步 iterative unmasking) → [Flow Matching + HiFi-GAN (CosyVoice 3)] → Waveform", "metrics": "CER 0.98% (zh) / WER 1.96% (en) @ 64 steps on SEED-TTS-Eval,匹配 CosyVoice 3-0.5B baseline (CER 1.21%)，2x LLM-stage speedup [Table 1, Fig 3]", "takeaway": "AR→masked diffusion 的迁移配方 (bidirectional attention + label shift + 1/t objective + AR init) 可直接应用于任何 LLM-based AR TTS 系统;attention head 中涌现的 text-speech alignment 可用于免训练 speech editing", "limitation": "需预先指定输出长度 (token-text ratio)；非流式；无 KV cache 所以单步成本高于 AR (靠步数少补偿)；仅在 CosyVoice 3 一个 backbone 上验证", "concepts": ["MaskedGenerativeModeling", "LLM-basedTTS", "Non-autoregressiveTTS", "DiffusionModel", "ConditionalFlowMatching", "SemanticvsAcousticTokens", "SpeechTokenizer"], "source": "Sources/LLaDA-TTS.pdf", "github": "", "demo": ""}, {"name": "LongCat-AudioDiT", "title": "LongCat-AudioDiT: High-Fidelity Diffusion TTS in the Waveform Latent Space", "arxiv_id": "2603.29339", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "NAR", "flow-matching", "waveform-latent", "VAE", "DiT", "zero-shot"], "summary": "纯扩散 NAR TTS,通过在 waveform latent 空间直接建模消除 mel 中间表示引入的 compounding error,在 Seed 基准上 SOTA", "route": "文本 → UMT5 (dual embedding: last hidden + raw word emb) → ConvNeXt V2 refinement → DiT (CFM backbone, cross-attention alignment) → Wav-VAE decoder → waveform", "metrics": "SIM 0.818 (Seed-ZH), 0.797 (Seed-Hard), CER 1.09% (Seed-ZH), WER 1.50% (Seed-EN); 3.5B 参数, 1M 小时数据 [Table 1]", "takeaway": "(1) prompt noisy latent 在推理时需要用 GT 值覆盖,否则 drift 导致质量下降; (2) UMT5 的 raw word embedding + last hidden state 双通道文本表示改善可懂度; (3) APG 消除 CFG 高 scale 下的 oversaturation; (4) VAE 维度越高重建越好但 TTS 生成反而变差 — 维度选择需联合优化", "limitation": "可懂度 (CER/WER) 仍不及 Qwen3-TTS、CosyVoice3.5 等重工程系统; 仅支持中英双语; 推理速度未报告 RTF; 无情感/韵律控制能力的讨论", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Diffusion-basedTTS", "VariationalAutoencoderforTTS", "MelSpectrogram", "Non-autoregressiveTTS"], "source": "Sources/LongCat-AudioDiT.pdf", "github": "", "demo": ""}, {"name": "MOSS-TTS", "title": "MOSS-TTS Technical Report", "arxiv_id": "2603.18090", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "autoregressive", "discrete-token", "audio-codec", "foundation-model", "voice-cloning", "RVQ", "Transformer-tokenizer"], "summary": "用纯 Transformer tokenizer (1.6B, 12.5 fps, 32-layer RVQ) + 大规模 AR 预训练 (8B Delay / 1.7B Local-Transformer),在 zero-shot voice cloning、duration control 和小时级长文本生成上均取得竞争力", "route": "Text + Optional Prompt → Interleaved Text/Audio Tokens → Single AR Backbone (Delay Pattern: 33 heads) or Backbone + Local AR (Local Transformer) → 32-layer RVQ Tokens → MOSS-Audio-Tokenizer Decoder → 24kHz Waveform", "metrics": "Seed-TTS-eval ZH SIM 79.62% / EN SIM 73.28% (Local-Transformer, Continuation) [Table 3]; Duration control AbsErr Mean 0.7% [Table 5]; Ultra-long 中文 CER 1.86% @ 10000+ tokens (Continuation) [Table 6]", "takeaway": "(1) Tokenizer 内嵌 LLM semantic head 做 audio-to-text 监督,无需外部 SSL teacher; (2) 4 阶段 WSD curriculum: 先纯 TTS → 重采样 clone 数据 → 恢复均衡 + LR decay → 长上下文扩展; (3) Continuation 模式 (把 prompt 当 speech prefix 续写) 比显式 Clone 模式 SIM 更高", "limitation": "开源但部分数据未开放; 超长英文 (50000+ tokens ≈ 67 min) WER 劣化严重 (29.52%); speaker drift 随时间累积是主要瓶颈; 无主观 MOS 评估", "concepts": ["ResidualVectorQuantization", "CodecLanguageModel", "SemanticvsAcousticTokens", "QuantizerDropout", "LLM-basedTTS", "AudioTokenizerTaxonomy", "CodecTrainingObjectives"], "source": "Sources/MOSS-TTS.pdf", "github": "", "demo": ""}, {"name": "MOSS-TTSD", "title": "MOSS-TTSD: Text to Spoken Dialogue Generation", "arxiv_id": "2603.19739", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["spoken-dialogue", "multi-speaker", "long-form", "voice-cloning", "codec-LM", "autoregressive", "RVQ", "evaluation"], "summary": "基于 Qwen3-8B + MOSS-Audio-Tokenizer 的全离散 spoken dialogue 合成模型,支持 60 分钟单次生成、5 说话人、零样本声音克隆和多语言", "route": "对话脚本(含 [S1]/[S2] speaker tags + 可选参考音频) → Qwen3-8B-base 自回归生成 16 层 RVQ tokens(multi-head delay pattern） → MOSS-Audio-Tokenizer decoder → 波形", "metrics": "ACC 0.9587/0.9626, SIM 0.7949/0.7326, WER 4.85%/9.88% (ZH/EN) [Table 1]; Elo ratings 全维度领先开源模型 [Fig 4]; vs ElevenLabs V3/Gemini/Doubao 主观偏好多数胜出 [Fig 5]", "takeaway": "(1) voice_clone + continuation 双范式融合显著提升 speaker similarity; (2) 基于 forced alignment 的 TTSD-eval 避免 diarization 误差; (3) 三阶段 curriculum 从单人到多人的训练策略", "limitation": "非实时交互(script-conditioned, 非 full-duplex); 60 分钟上限依赖 65K token 上下文; 多说话人(3-5 人)训练依赖合成拼接数据,真实多人数据极少; TTSD-eval 依赖 forced alignment 质量; 未报告 MOS", "concepts": ["LLM-basedTTS", "CodecLanguageModel", "ResidualVectorQuantization", "VoiceCloningTaxonomy", "Turn-takinginSpokenDialogue", "SpokenDialogueEvaluation", "AudioTokenizerTaxonomy"], "source": "Sources/MOSS-TTSD.pdf", "github": "", "demo": ""}, {"name": "MOSS-VoiceGenerator", "title": "MOSS-VoiceGenerator: Create Realistic Voices with Natural Language Descriptions", "arxiv_id": "2603.28086", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "instruction-following", "voice-design", "natural-language-description", "autoregressive", "codec-LM", "RVQ", "cinematic-data"], "summary": "复用 MOSS-TTS 架构 (Qwen3 1.7B + MOSS-Audio-Tokenizer 16 层 RVQ),以影视数据为核心训练 instruction-driven voice design 模型,主观评估全面优于 Qwen3-TTS-VD / MiniMax / MIMO-Audio", "route": "NL Timbre Instruction + Synthesis Text → Qwen3 Text Tokenizer → Decoder-only LM (1.7B, delay pattern) → 16-layer RVQ Audio Tokens → MOSS-Audio-Tokenizer Decoder → Waveform", "metrics": "InstructTTSEval EN DSD 82.0% / RP 68.7% [Table 1]; 主观 pairwise preference 全维度 win > 50% vs MiMo-Audio (63.1%), MiniMax (61.9%), Qwen3-TTS-VD (61.9%) [Fig 4]", "takeaway": "(1) 影视数据 + 去噪后过滤 (DNSMOS >= 3.0, 保留率 5%→45%) 获取多样真实语音; (2) Speech-text alignment embedding 做 style-guided mining,从中性数据中定向挖掘表达性片段; (3) English instruction rewriting 将有效训练样本翻倍解决英文韵律不稳定", "limitation": "仅支持中英文; 英文数据量不足 (7K vs 18K h) 导致部分英文风格韵律弱; 去噪可能引入伪影 (残余呼吸噪声/高频平滑); 输出偶有不稳定; 无客观音质指标 (MOS/PESQ) 报告", "concepts": ["Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "CodecLanguageModel", "ResidualVectorQuantization", "LLM-basedTTS"], "source": "Sources/MOSS-VoiceGenerator.pdf", "github": "", "demo": ""}, {"name": "MamTra", "title": "MamTra: A Hybrid Mamba-Transformer Backbone for Speech Synthesis", "arxiv_id": "2603.12342", "date": "2026-03", "venue": "Interspeech 2026 (submitted)", "org": "", "tier": "deep", "tags": ["TTS", "hybrid-architecture", "Mamba", "SSM", "Transformer", "knowledge-distillation", "efficiency", "LLM-based-TTS"], "summary": "将预训练 Transformer TTS backbone 中的部分 attention 层替换为 Mamba 层,通过结构化权重转移 + 多级蒸馏,仅用 2% 训练数据实现 34% 推理显存降低且几乎不损失语音质量", "route": "预训练 CosyVoice 2 Transformer → 选择替换策略(BlockBeg/Importance) → Attention Q,K,V 权重映射到 Mamba C,B,x → 多级蒸馏(CE + logits KL + embedding MSE) → 混合 Mamba-Transformer backbone", "metrics": "MamTra 1:1 在 SEED-TTS-eval test-en 上 WER 2.28%(teacher CosyVoice 2: 2.03%),NMOS 3.66 vs 3.68,UTMOS 4.16 vs 4.15,SSIM 0.72 vs 0.66; VRAM 降低 34% [Table 3, Fig 3]", "takeaway": "Attention→SSM 的结构化权重映射(Q→C, K→B, V→x),可用于任何需要将 Transformer 层转为线性复杂度的场景; 分层替换策略分析(哪些层更适合 Mamba)可指导混合架构设计", "limitation": "基于 CosyVoice 2 单一 backbone,泛化到其他 TTS 系统未验证; 1:11 比例下质量明显下降; 仅在英文 LibriTTS(0.5kh)上训练/评估,中文和多语言未涉及; 代码未在论文发表时开源", "concepts": ["LLM-basedTTS", "Non-autoregressiveTTS", "SpeechLanguageModel", "Attention-basedTTS"], "source": "Sources/MamTra.pdf", "github": "", "demo": ""}, {"name": "NV-Bench", "title": "NV-Bench: Benchmark of Nonverbal Vocalization Synthesis for Expressive Text-to-Speech Generation", "arxiv_id": "2603.15352", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["benchmark", "evaluation", "nonverbal-vocalizations", "paralinguistic", "TTS", "ASR", "controllability", "expressive-speech"], "summary": "首个基于功能分类学的 NV-capable TTS 标准化 benchmark,含 1,651 条 paired GT 多语言数据和双维评估协议 (指令对齐 + 声学保真度)", "route": "原始音频 → Emilia-Pipeline+MiMo-Audio 过滤 → NVASR 标注 → 人工验证 → 14 类 NV 平衡测试集; 评估: 文本 prompt → TTS 合成 → NVASR 转写 → CER/PCER/OCER (对齐) + FAD/FD/SIM/DNSMOS (声学)", "metrics": "NVASR CER 1.29% (SMIIP-NV) [Table 3]; NV-CV3 PCER 27.69% (ZH single) [Table 4]; NV-FlexiVoice FAD 0.29 / FD 2.72 [Table 5]; NV-CV3 NMOS 4.08 / IMOS 3.95 [Table 5]; IMOS vs PCER Spearman rho=-0.65 (p<0.001) [§4.2.4]", "takeaway": "(1) PCER 指标设计 — 从 CER 中隔离 NV symbol 的编辑距离,可迁移到任何带特殊标记的 TTS 评估; (2) \"功能分类学\"替代\"声学分类\",使 NV 评估从 event detection 升维到 pragmatic appropriateness; (3) 用 MiMo-Audio-7B 做 single-speaker verification 过滤多说话人残留,比传统 diarization 更鲁棒", "limitation": "(1) 1,651 条规模偏小,每类 50 条 single-label 的统计功效有限; (2) 仅中英双语; (3) 未评估 NV 的 pragmatic appropriateness (上下文适当性),仅评估是否生成了正确的 NV 类型; (4) NVASR 评估器本身有误差,CER 1.29% 并非零; (5) 未开源评估器权重", "concepts": ["TTSEvaluation", "ProsodyModeling", "EmotionControlinTTS", "Instruction-GuidedSpeechSynthesis", "AudioUnderstanding"], "source": "Sources/NV-Bench.pdf", "github": "", "demo": ""}, {"name": "OmniCodec", "title": "OmniCodec: Low Frame Rate Universal Audio Codec with Semantic-Acoustic Disentanglement", "arxiv_id": "2603.20638", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-codec", "universal-codec", "semantic-acoustic-decoupling", "low-frame-rate", "VQ", "RVQ", "self-guidance", "streaming"], "summary": "用预训练理解模型 (Qwen3-Omni-AuT-Encoder) 做语义分支 + RVQ 做声学分支 + self-guidance loss, 在 12.5/6.25 Hz 低帧率实现 speech/music/sound 全域 codec", "route": "Audio → Qwen3-Omni-AuT-Encoder (semantic) + SEANet (acoustic) → Adapter 解耦 → VQ (semantic) + 31-layer RVQ (acoustic) → Acoustic Transformer + Decoder → Waveform", "metrics": "同比特率 2200 bps 下 OmniCodec-16L vs Mimi-16L: Mel dis. 0.81 vs 1.12, MCD 3.05 vs 3.93, N-MOS 3.45 vs 3.42, S-MOS 3.50 vs 3.51 [Table 1]; music PPL0 4.14 vs 4.43, sound PPL0 3.32 vs 3.74 [Table 4]", "takeaway": "(1) Self-guidance loss (用连续 pre-quantized latent 的输出指导 quantized token 的输出,无额外参数) 提升 codebook 利用率 0.974→0.982; (2) 直接借用理解模型 encoder 做 codec 的语义分支,避免从头训练 SSL 模型", "limitation": "speech domain PPL 不如 Mimi (WavLM BERT 架构学习 phonetic details 更优); music 训练数据为 in-house 不公开; 6.25Hz 模型指标明显低于 12.5Hz; 论文无下游 TTS 生成实验", "concepts": ["SemanticvsAcousticTokens", "ResidualVectorQuantization", "AudioTokenizerTaxonomy", "CodecTrainingObjectives", "CodebookCollapse", "Single-codebookvsMulti-codebook", "TokenRateandBitrateTrade-offs", "QuantizerDropout", "Multi-scaleSTFTDiscriminator", "Self-SupervisedSpeechRepresentation"], "source": "Sources/OmniCodec.pdf", "github": "", "demo": ""}, {"name": "RLforDeepfakeDetection", "title": "Does Fine-tuning by Reinforcement Learning Improve Generalization in Binary Speech Deepfake Detection?", "arxiv_id": "2603.02914", "date": "2026-03", "venue": "arXiv (under review)", "org": "", "tier": "deep", "tags": ["deepfake-detection", "reinforcement-learning", "GRPO", "fine-tuning", "generalization", "anti-spoofing", "self-supervised-learning"], "summary": "将 GRPO 应用于 SSL-based 语音深伪检测器的 fine-tuning,发现纯 GRPO 微调在保持域内性能的同时显著改善域外泛化,negative reward 是关键因素", "route": "原始波形 -> SSL 前端 (XLS-R-2B/MMS-1B/MMS-300M, post-trained) -> 全局平均池化 -> 线性层 + softmax -> REAL/FAKE 二分类; GRPO fine-tuning 使用 binary indicator reward", "metrics": "XLS-R-2B 上 ItW EER 6.35% (SFT) -> 2.19% (GRPO); 域外平均 EER 6.28% -> 2.69%; 域内 EER ~10% 两者持平 [Table 1]", "takeaway": "(1) binary classification 上 GRPO 的 negative reward 机制可作为通用 regularization 手段; (2) Wasserstein drift 分析方法可用于诊断 fine-tuning 导致的分布偏移; (3) GRPO w/o neg. 等价于 SFT + regularization 的数学推导有理论价值", "limitation": "仅验证 binary classification; reward 设计过于简单 (indicator function); 未解释 GRPO 改善泛化的深层机制; 代码未公开 (承诺 review 后公开)", "concepts": ["Anti-spoofingandDeepfakeDetection", "Self-SupervisedSpeechRepresentation", "DifferentiableRewardOptimization"], "source": "Sources/RLforDeepfakeDetection.pdf", "github": "", "demo": ""}, {"name": "SelfTTS", "title": "SelfTTS: Cross-Speaker Style Transfer through Explicit Embedding Disentanglement and Self-Refinement using Self-Augmentation", "arxiv_id": "2603.22252", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "cross-speaker-style-transfer", "disentanglement", "contrastive-learning", "VITS", "emotion", "self-augmentation", "voice-conversion"], "summary": "基于 VITS 的跨说话人情感迁移系统,通过 cosine-based GRL 显式解耦 speaker/emotion embedding + MPCL 对比损失聚类 + Self-Augmentation 自增强提升自然度", "route": "Mel slice → 双 Reference Encoder (speaker RE + emotion RE) → MPCL 聚类 + cosine-based GRL 解耦 → VITS posterior/flow/decoder 条件化 → 波形; Self-Aug 阶段用 VC permute speaker 生成合成情感参考", "metrics": "eMOS 2.853 (最优, vs E3-VITS 2.237, VECL 2.556); EECS 0.8423 (vs 0.5367, 0.6929); SECS 0.8163; CKA(emb) 0.0139 (最低纠缠) [Table 1, Table 2]", "takeaway": "(1) cosine similarity + GRL 的 label-free 解耦方案,可迁移到任何需要双因子正交化的场景; (2) MPCL 对比损失比 CE 更适合多正例聚类,且无需特殊 batch 设计; (3) Self-Aug 的 ENC 配置(仅替换 emotion encoder 输入)比 GT 替换更安全", "limitation": "仅在 ESD (20 speakers, 5 emotions) 上验证,规模偏小; 跨语料库 WER 极高(>1.0); 无零样本能力; 自然度 nMOS 2.746 仍显著低于 GT 3.638; 未与 LLM-based TTS 对比", "concepts": ["GradientReversalLayer", "StyleTransferinTTS", "EmotionControlinTTS", "SpeechFactorization", "SpeakerEmbedding"], "source": "Sources/SelfTTS.pdf", "github": "", "demo": ""}, {"name": "SpeakerPoisoning", "title": "Targeted Speaker Poisoning Framework in Zero-Shot Text-to-Speech", "arxiv_id": "2603.07551", "date": "2026-03", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speaker-poisoning", "voice-privacy", "zero-shot-TTS", "machine-unlearning", "knowledge-distillation", "contrastive-learning", "triplet-loss", "speaker-identity"], "summary": "将 speaker identity erasure (poisoning) 从 VoiceBox 迁移到 StyleTTS2,提出 Encoder-Guided Poisoning (EGP) 绕过 teacher 生成瓶颈,引入 AUC + FSSIM 分布级评估框架,揭示多说话人 scalability 限制", "route": "pre-trained StyleTTS2 → 冻结 text encoder/decoder/discriminator,仅微调 diffusion module → TGP: teacher 用 retain speaker 生成 mel target, student 训练时以 p_forget 概率替换 retain ref 为 forget ref → EGP: 改用 style encoder 输出替代 teacher 生成的 mel 作为 target → 可选加 triplet loss 显式推开 forget embedding → 60K steps, AdamW, lr=1e-4", "metrics": "1-speaker: EGP+Trip. AUC 0.95 (最高), SSIM-F 0.48 (最低) [Table 1]; 15-speaker: EGP+Trip. AUC 0.76, SSIM-F 0.71, Avg-FSSIM 0.69 [Table 2]; 100-speaker: EGP+Trip. AUC 0.64, Avg-FSSIM 0.71, Max-FSSIM 0.91 [Table 2]; EGP retain WER 2.90 (vs pretrained 2.75) [Table 1]", "takeaway": "(1) EGP 的核心 insight -- 当 teacher 和 student 架构相同时,用 encoder 输出替代 teacher 生成输出可提供更干净的优化信号,这一思路可迁移到其他同架构蒸馏场景; (2) AUC 作为 retain/forget 分布可分离性的度量,比单一 cosine similarity 阈值更鲁棒; (3) Max-FSSIM 概念 -- 衡量生成语音与 forget set 中**任意**说话人的最大相似度,揭示 worst-case leakage", "limitation": "(1) 仅在 StyleTTS2 (diffusion-based) 上验证,未测试 AR 或 LLM-based TTS; (2) 100 speaker 时 AUC 仅 0.64,Max-FSSIM 高达 0.91,scalability 问题未解决; (3) triplet loss 在多说话人场景效果大幅下降 -- 推开一个 negative 会推向另一个 [Sohn 2016]; (4) 训练代码和模型权重尚未公开 (upon acceptance); (5) 未讨论 forget speaker 与 retain speaker 声音高度相似时的误伤问题", "concepts": ["SpeakerEmbedding", "SpeakerVerification", "DiffusionModel", "Anti-spoofingandDeepfakeDetection", "VoiceCloningTaxonomy", "TTSEvaluation"], "source": "Sources/SpeakerPoisoning.pdf", "github": "", "demo": ""}, {"name": "StreamWise", "title": "StreamWise: Serving Multi-Modal Generation in Real-Time at Scale", "arxiv_id": "2603.05800", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multi-modal-serving", "systems", "real-time-generation", "video-generation", "TTS-serving", "DAG-scheduling", "heterogeneous-hardware", "diffusion-serving"], "summary": "面向实时多模态生成(如播客视频)的模块化 serving 系统,通过 deadline-aware DAG 调度 + DiT/VAE 解耦 + 异构硬件 + 自适应质量,实现 10 分钟视频 sub-second TTFF、成本 <$45", "route": "用户请求 → LLM 生成剧本 → TTS 合成语音 + T2I/I2I 生成图像 → I2V DiT 去噪生成视频 → V+A 唇形同步 → 上采样 → FFmpeg 拼接流式输出", "metrics": "单 8xA100 server: TTFF=3.7h, $25; 256xA100+64xH200: TTFF<22s, $45; 自适应质量: TTFF<1s, 高质量覆盖>90% 视频 [§5.2, Fig 8, Fig 13]", "takeaway": "(1) DAG deadline 反推调度 — 从最终 SLO 递归计算每个 DAG 节点的 deadline,早期场景可降质量换延迟; (2) DiT/VAE 解耦 — 让 DiT 在 latent space 流式输出给 VAE 解码,实现 pipeline 并行; (3) 用 cost x TTFF 作为联合优化目标,在 Pareto 前沿上导航", "limitation": "(1) 仅模拟了多请求场景,未报告真实多租户负载下的性能; (2) 视频质量仅用 Elo rating 间接评估,未做人工评测; (3) 系统仅在 Azure 上验证,跨云可移植性未知; (4) GB200 实验未使用 Blackwell 专有优化(FP4 等)", "concepts": ["Classifier-FreeGuidance", "DiffusionModel", "StreamingSpokenDialogue"], "source": "Sources/StreamWise.pdf", "github": "", "demo": ""}, {"name": "TASTE-Streaming", "title": "TASTE-Streaming: Towards Streamable Text-Aligned Speech Tokenization and Embedding for Spoken Language Modeling", "arxiv_id": "2603.12350", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-tokenization", "spoken-language-model", "streaming", "text-aligned", "CTC", "flow-matching", "FSQ"], "summary": "TASTE 的流式扩展——将 CTC ASR 内置到 encoder、decoder 改为因果 interleaving 模式,实现 text-aligned speech tokenization 的低延迟流式编解码,性能与原版 TASTE 持平", "route": "Speech → Whisper-based ASR encoder → CTC decoder (提取 text tokens) + Aggregator (text-aligned speech embedding) → FSQ → AR Unit decoder (interleaving text+unit tokens) → Flow-matching Vocoder → Waveform", "metrics": "WER 4.1% / UTMOS 4.11 / Spkr Sim 0.88 / Drtn Con 0.901 (LibriSpeech test-clean, ~600 bps) [Table 1]; 匹配 bitrate (~150 bps): WER 4.2% vs TASTE 4.5%, Spkr Sim 0.86 vs 0.80 [Table 3]; Enc RTF 0.002 vs TASTE 0.117 (~59x) [Table 1]; Dec RTF 0.076 vs 0.414 (~5.5x) [Table 1]; FCL 0.311s vs 12.29s (~40x) [Table 2]", "takeaway": "(1) CTC 内置 ASR 消除外部依赖的方案简洁有效; (2) interleaving N:M text-unit token 的流式解码 pattern; (3) bi-stage + joint training 让系统对 ASR 误差鲁棒; (4) FSQ 替代 VQ 在低 embedding 维度下表现更好", "limitation": "仅在 ~1000h 英语数据上验证; 未测试 SLM 下游任务(仅 tokenizer 级评估); UTMOS 略低于原 TASTE(4.11 vs 4.24,但原文指出 TASTE 高 UTMOS 部分来自背景去噪); 未与 TaDiCodec (no VQ) 等连续表征路线做下游 SLM 对比", "concepts": ["SpeechTokenizer", "SpeechLanguageModel", "FiniteScalarQuantization", "Speech-TextAlignment", "ConditionalFlowMatching", "SemanticvsAcousticTokens"], "source": "Sources/TASTE-Streaming.pdf", "github": "", "demo": ""}, {"name": "VoXtream2", "title": "VoXtream2: Full-stream TTS with dynamic speaking rate control", "arxiv_id": "2603.13518", "date": "2026-03", "venue": "Under review at INTERSPEECH 2026", "org": "", "tier": "deep", "tags": ["TTS", "streaming", "zero-shot", "autoregressive", "speaking-rate-control", "full-stream", "CFG", "distribution-matching"], "summary": "在 VoXtream 基础上通过 distribution matching 实现帧级动态语速控制 (1-7 SPS,支持 mid-utterance 变速),配合多条件 CFG 和 prompt text masking,以 462M 参数 + 40k 小时数据达到公开 baseline 水平,FPL 74ms", "route": "Text (word-by-word) → G2P (IPA) → Phoneme Transformer (25 look-ahead) → Temporal Transformer (semantic token + duration token 联合预测,CFG γ=1.5) + distribution matching SRC → Depth Transformer (16 codebooks,冻结 CSM 权重,CFG γ=3.0) + ReDimNet speaker embedding → Mimi decoder → waveform", "metrics": "SEED-en WER 1.32% / SPK-SIM 0.656 / UTMOS 4.05; LS-PC WER 2.12 / SPK-SIM 0.638 / UTMOS 4.24; Naturalness MUSHRA 68.8±2.3 (最高); FPL 74ms, RTF 0.256 (RTX3090); Dynamic SRC Pearson corr 0.62-0.83 [Table 2, 4, 5]", "takeaway": "(1) Distribution matching 做采样时语速控制: 不改模型,只在 duration token 采样时用目标分布重加权,轻量且可即时切换; (2) CFG 不应用于 duration 但仍间接影响语速,γ 可作为 SRC 辅助调节杠杆; (3) Prompt text masking 消除对外部 aligner 的推理依赖; (4) Acoustic prompt enhancement 对冲 CFG 带来的音质退化", "limitation": "语速仍受 prompt speaking rate 影响 (未完全解耦); 慢速语速 (1 SPS) WER 大幅上升 (16.5%); 训练依赖外部 forced aligner (~35% 数据因对齐失败丢弃); 仅英语", "concepts": ["Classifier-FreeGuidance", "SpeakerEmbedding", "ProsodyModeling", "DurationPredictor", "LLM-basedTTS", "SemanticvsAcousticTokens", "SpeechTokenizer", "PhonemeRepresentation", "Speech-TextAlignment"], "source": "Sources/VoXtream2.pdf", "github": "", "demo": ""}, {"name": "VoxtralTTS", "title": "Voxtral TTS", "arxiv_id": "2603.25551", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "voice-cloning", "multilingual", "codec", "flow-matching", "autoregressive", "DPO"], "summary": "Mistral 提出 hybrid AR+flow-matching TTS,用 VQ-FSQ 混合 codec 编码 semantic/acoustic tokens,在多语言 zero-shot voice cloning 上以 68.4% win rate 超越 ElevenLabs Flash v2.5。", "route": "Text + Voice ref → Voxtral Codec (VQ semantic + FSQ acoustic, 12.5Hz, 2.14kbps) → AR decoder backbone (Ministral 3B) 生成 semantic tokens → FM transformer (8 NFE + CFG) 生成 acoustic tokens → Codec decoder → 24kHz waveform", "metrics": "Voice cloning win rate 68.4% vs ElevenLabs Flash v2.5 [Table 5]; Speaker SIM 0.628 vs 0.392 (ElevenLabs v3) on SEED-TTS [Table 3]; WER 1.23% on SEED-TTS [Table 3]; UTMOS 4.11 on SEED-TTS [Table 3]; Codec PESQ 3.05 vs Mimi-16cb 2.67 on Expresso [Table 2]", "takeaway": "(1) VQ+FSQ 混合量化: 语义用高维 VQ 保证信息容量,声学用低维 FSQ 保证利用率,避免了纯 RVQ 的 codebook collapse; (2) Flow-matching 替代 depth transformer: 3 token 序列长度(h,t,x_t) vs 38 (MaskGIT) 或 36 步 AR (depth),大幅降低 acoustic 生成开销; (3) Flow-DPO 的 AR 适配: 每个 token 独立采样 t,长度归一化导致不稳定", "limitation": "不支持 emotion tag/text instruction 显式控制(只能通过 voice prompt 风格迁移); 仅 CC BY-NC 开源; DPO 在 Hindi 上 WER 反而退化 (+1.61%); CFG alpha 高时 text-adherence 变差; 论文未提供 MOS 原始分数", "concepts": ["SemanticvsAcousticTokens", "SpeechTokenizer", "LLM-basedTTS", "ConditionalFlowMatching", "Classifier-FreeGuidance", "FiniteScalarQuantization", "SpeechFactorization", "SpeechLanguageModel", "VoiceCloningTaxonomy", "CodecTrainingObjectives"], "source": "Sources/VoxtralTTS.pdf", "github": "", "demo": ""}, {"name": "WavSLM", "title": "WavSLM: Single-Stream Speech LM via WavLM Distillation", "arxiv_id": "2603.05299", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "single-codebook", "knowledge-distillation", "WavLM", "self-supervised", "speech-tokenizer", "autoregressive", "streaming"], "summary": "将 WavLM 的中间层蒸馏为单码本 tokenizer + 上层蒸馏为因果 LM,实现 speech-only、单流、可流式的 SLM,305M 参数竞争 1.3-8B text-pretrained baselines", "route": "原始波形 → FocalCodec-Stream (WavLM-6 + compressor + VQ) → 单码本 discrete tokens (50 Hz) → decompressor → WavLM layers 7-24 (causal) + LM head → next-chunk prediction (C=4)", "metrics": "Avg score 69.5 (best among all, Table 1); UTMOS 3.72 / SpkSim 91.8% (best, Table 2); RTF 5.8x vs LLaMA-Mimi 1.1x (Table 2); 训练仅用单张 H100", "takeaway": "(1) 把 SSL 模型的不同层级拆分为 tokenizer + LM backbone 是一种高效的模型复用策略; (2) next-chunk prediction 与 tokenizer chunk size 对齐,解耦了 token 分辨率与建模效率", "limitation": "语言建模能力仍弱于 text-pretrained 模型 (PPL 161 vs LLaMA-Mimi 122); 仅在英语 read speech 上验证; 65k 词表需要更多数据才能 work; 代码/模型未公开", "concepts": ["SpeechLanguageModel", "SemanticvsAcousticTokens", "Single-codebookvsMulti-codebook", "Self-SupervisedSpeechRepresentation", "SpeechTokenizer"], "source": "Sources/WavSLM.pdf", "github": "", "demo": ""}, {"name": "WhispSynth", "title": "WhispSynth: Scaling Multilingual Whisper Corpus through Real Data Curation and A Novel Pitch-free Generative Framework", "arxiv_id": "2603.14853", "date": "2026-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["whisper-speech", "data-engine", "DDSP", "pitch-removal", "TTS-data", "corpus-construction", "multilingual", "voice-conversion"], "summary": "提出 DDSP-based pitch-free 后处理 + CosyVoice3 的数据引擎,将嘈杂的真实耳语数据升级为 118h 高保真合成耳语语料(WhispSynth),fine-tune 出的 CosyWhisper W-MOS 4.53 超过真实录音 4.33", "route": "真实耳语 WhispReal (118h) → CosyVoice3 合成初始耳语 → DDSP pitch detection → 谐波/噪声分离 → 丢弃谐波+OLA 重建 → WhispSynth (118h, 24kHz) → CFM fine-tune → CosyWhisper", "metrics": "W-MOS 4.53 vs GT 4.33 vs CosyVoice3 3.40 [Table 4]; CER 12.76%/WER 29.22% [Table 4]; VTR 0.88 [Table 4]; WhispSynth CER/WER 比 WhispReal 降 46% [Table 5]", "takeaway": "(1) 用 DDSP 源滤波器做信号后处理(分离谐波→丢弃)而非生成,思路可迁移到任何需要移除周期性成分的场景; (2) 三阶段 DDSP 训练策略(正常语音对抗训练→耳语继续训练→半监督双焦点); (3) 只 fine-tune CFM 不动 LLM 和 vocoder 的选择,表明耳语与正常语音的差异主要在声学建模层", "limitation": "(1) 依赖 CosyVoice3 闭源预训练权重; (2) 未评估麦克风差异的影响 [Limitations]; (3) 开源模型内嵌音频水印可能影响声学特性 [Limitations]; (4) 多语言验证仅日/韩两种且数据来自 YouTube ASMR [Appendix D]; (5) WER 29.22% 仍然较高", "concepts": ["ConditionalFlowMatching", "F0Modeling", "NeuralVocoder", "SpeakerEmbedding"], "source": "Sources/WhispSynth.pdf", "github": "", "demo": ""}, {"name": "WildASR", "title": "WildASR: Back to Basics — Revisiting ASR in the Age of Voice Agents", "arxiv_id": "2603.25727", "date": "2026-03", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["ASR", "benchmark", "robustness", "multilingual", "hallucination", "voice-agent", "diagnostic-evaluation", "OOD"], "summary": "多语言(EN/ZH/JA/KO)ASR 诊断 benchmark,用真实人声 + 受控扰动沿三轴(环境/人群/语言)因子隔离评估,揭示 7 个 SOTA ASR 系统在 OOD 条件下严重且不均匀的退化及幻觉风险", "route": "真实人声语料(FLEURS + MagicData + 专项数据集) → 受控扰动/筛选(混响/远场/编解码/噪声间隙/裁剪 + 儿童/老年/口音 + 短话语/截断/代码切换) → 7 个 ASR 系统统一推理 → WER/CER + HER + P90 Elbow + Prompt Sensitivity 四维分析", "metrics": "Clean baseline 5.7% 平均错误率; Noise gap MagicData EN WER +67.7%; JA/KO CER +118.9%/+121.0%; 儿童语音 EN 最低 WER 仍 18.2%; 短话语 WER 可达 73.9%; Qwen2-Audio KO code-switching MER 211.7%; 人类平均错误率仅 4.7% [Table 2, 3, 4, Fig 1]", "takeaway": "(1) 因子隔离评估设计(每个 OOD 因子独立评估,避免混淆) (2) P90 Elbow 分析识别系统不稳定性阈值 (3) HER 指标捕获 WER 遗漏的语义幻觉 (4) Prompt sensitivity profiling 量化指令措辞对 ASR 的影响", "limitation": "人口偏移子集仅覆盖 EN/ZH; 4 种语言不含低资源语言; 环境扰动为模拟而非真实录音; 仅 7 个模型; 样本量有限(尤其人口子集)", "concepts": ["TTSEvaluation", "SpokenDialogueEvaluation", "AudioUnderstanding", "LLM-enhancedASR"], "source": "Sources/WildASR.pdf", "github": "", "demo": ""}, {"name": "ZeSTA", "title": "ZeSTA: Zero-Shot TTS Augmentation with Domain-Conditioned Training for Data-Efficient Personalized Speech", "arxiv_id": "2603.04219", "date": "2026-03", "venue": "arXiv (Maum AI / Humelo)", "org": "", "tier": "deep", "tags": ["TTS", "data-augmentation", "speaker-adaptation", "fine-tuning", "zero-shot", "low-resource", "domain-conditioning", "personalization"], "summary": "提出 ZeSTA 框架,通过 domain embedding + real-data oversampling,解决用 ZS-TTS 合成数据增强轻量 TTS 微调时的 speaker similarity 下降问题", "route": "目标说话人少量录音 → ZS-TTS(Fish-Speech/CosyVoice 2)生成合成语音 → domain embedding 区分 real/synth + real 数据 3x oversampling → VITS 微调 → 推理时设 d=real", "metrics": "DC+OS 将 SECS 从 0.765(naive mixing, FS)恢复到 0.815(接近 Real 100% 的 0.832),同时保持 CER/WER 改善;ABX 偏好 70.8%(FS, LibriTTS) [Table 3, Table 4]", "takeaway": "domain embedding 思路极简且不改基础架构,可移植到任何使用合成数据微调的 TTS 系统;real-data oversampling 作为 complementary trick 成本为零", "limitation": "仅在 VITS 上验证,未扩展到 LLM-based TTS;8+6 个说话人规模较小;未与 LoRA/adapter 等参数效率方法对比;合成数据量固定为 90%,未探索最优比例", "concepts": ["SpeakerAdaptation", "SpeakerEmbedding", "VoiceCloningTaxonomy", "VariationalAutoencoderforTTS"], "source": "Sources/ZeSTA.pdf", "github": "", "demo": ""}, {"name": "ARCHI-TTS", "title": "ARCHI-TTS: A Flow-Matching-Based Text-to-Speech Model with Self-Supervised Semantic Aligner and Accelerated Inference", "arxiv_id": "2602.05207", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "non-autoregressive", "text-speech-alignment", "inference-acceleration", "low-token-rate", "DiT"], "summary": "提出 Semantic Aligner + 分离 DiT 架构的 NAR flow-matching TTS,通过显式语义对齐和 training-free 推理加速同时提升质量和效率", "route": "Text→ConvNeXt V2→Semantic Aligner(+mask embeddings)→Condition Encoder(18 DiT)→Velocity Decoder(4 DiT)→VAE Decoder→Waveform", "metrics": "LibriSpeech-PC WER 1.98% / SSIM 0.70 [Table 1]; SeedTTS-EN WER 1.47% / SSIM 0.68, SeedTTS-ZH WER 1.42% / SSIM 0.70 [Table 2]; RTF 0.21 (32 NFE) → 0.09 (75% sharing) [Fig 2]; 289M params, 100K hrs Emilia, 8×RTX5090 4天", "takeaway": "(1) 分离 condition encoder 和 velocity decoder 使 encoder 输出可跨步复用,training-free 加速推理; (2) 用 learnable mask embedding 作为 temporal canvas 让 transformer 自动学习对齐,无需 hard duration 也无需 padding to speech length; (3) CTC loss 在 DiT 中间层做辅助语义监督加速收敛", "limitation": "MOS 略低于 F5-TTS 和 CosyVoice2 [Table 3]; SSIM 在 SeedTTS-EN 上 0.68 低于 DiTAR 0.74 和 Seed-TTSDiT 0.79; 未报告长句/复杂文本的鲁棒性; 消融仅在小规模 LibriTTS/LibriHeavy 上进行", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "Classifier-FreeGuidance", "SpeakerEmbedding", "VariationalAutoencoderforTTS"], "source": "Sources/ARCHI-TTS.pdf", "github": "", "demo": ""}, {"name": "CTC-TTS", "title": "CTC-TTS: LLM-based dual-streaming TTS with CTC alignment", "arxiv_id": "2602.19574", "date": "2026-02", "venue": "INTERSPEECH 2026 (submitted)", "org": "", "tier": "deep", "tags": ["TTS", "streaming", "CTC", "alignment", "LLM-based", "dual-streaming", "interleaving", "zero-shot"], "summary": "用 CTC aligner 替代 MFA 做 phoneme-speech 对齐,配合 bi-word 交错策略构建 LLM-based 双流式 TTS,同时提供质量优先(-L)和延迟优先(-F)两种变体", "route": "Text → G2P (Phonetisaurus, IPA) → CTC aligner (Whistle, 25fps) → phoneme-speech alignment → bi-word interleaving (L: length concat / F: feature stack) → Decoder-only Transformer (AR) → WavTokenizer (single-codebook, 75 tokens/s) → chunk-aware streaming output", "metrics": "单说话人 CTC-TTS-L WER 1.50% / CER 0.79% / UTMOS 4.15 / FPL-A 210ms (vs LLMVoX WER 2.40% / FPL-A 167ms) [Table 1]; 多说话人 continuation CTC-TTS-L WER 4.82% / MOS 4.33 / SMOS 4.60 (vs MFA+ELLA-V WER 10.98% / MOS 3.94) [Table 2]; cross-speaker CTC-TTS-L WER 6.33% / MOS 4.23 [Table 3]", "takeaway": "(1) bi-word block 设计 — 当前词 phonemes + separator + 下一词 phonemes + 当前词 speech tokens,提供 compact look-ahead 上下文; (2) CTC blank 分配策略 — 将 blank 归并到后续 phoneme,再按 1:3 帧率比映射到 speech tokens; (3) 两种 interleaving 变体覆盖不同部署需求", "limitation": "仅在英文单语场景验证(LibriSpeech / VoiceAssistant400K); 模型规模小(~160M); 未与 CosyVoice 2 等工业系统直接对比; 代码未开源(待 accept); G2P 依赖 WFST-based Phonetisaurus,未探索 neural G2P", "concepts": ["Speech-TextAlignment", "LLM-basedTTS", "CodecLanguageModel", "SpeechTokenizer", "PhonemeRepresentation", "Single-codebookvsMulti-codebook"], "source": "Sources/CTC-TTS.pdf", "github": "", "demo": ""}, {"name": "CoCoEmo", "title": "CoCoEmo: Composable and Controllable Human-Like Emotional TTS via Activation Steering", "arxiv_id": "2602.03420", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "activation-steering", "mixed-emotion", "text-emotion-mismatch", "linear-separability", "training-free", "hybrid-TTS"], "summary": "首次系统分析 hybrid TTS (SLM+Flow) 中情感表征的位置和线性可分性,提出 discriminability-driven activation steering 实现可组合混合情感和文本-情感错配合成", "route": "情感语音数据集 → SLM 各层各操作 linear probe → Top-K 层/操作选出 → mean-difference steering vector 提取 → 加权组合混合情感 → 推理时注入 SLM 中间层 attn_output → 重归一化 → 合成", "metrics": "Mixed-emotion CREMA-D: E-SIM 0.795, TEP 0.315, H-Rate 0.755 (alpha=5.0); High-mismatch IEMOCAP: E-SIM 0.862, TEP 0.504 (alpha=6.0); 跨 CosyVoice2 和 IndexTTS2 两个 backbone 验证", "takeaway": "(1) cross-conditioning diagnostic 解耦 SLM vs flow 的情感贡献;(2) linear separability 作为 steering site 选择的指导原则;(3) multi-rater 软标签直接作为混合情感 steering 权重", "limitation": "未开源代码(声称将公开);仅验证 5 类离散情感(angry/sad/happy/surprise/neutral);steering 仅在 last-token 位置操作;alpha > 4.5 时 WER 有一定退化", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "SpeechLanguageModel", "ProsodyModeling", "StyleTransferinTTS"], "source": "Sources/CoCoEmo.pdf", "github": "", "demo": ""}, {"name": "Covo-Audio", "title": "Covo-Audio Technical Report", "arxiv_id": "2602.09823", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "end-to-end", "full-duplex", "LALM", "speech-dialogue", "audio-understanding", "intelligence-speaker-decoupling", "empathy"], "summary": "腾讯 7B 端到端 LALM,通过 hierarchical tri-modal interleaving 预训练 + intelligence-speaker decoupling 后训练,在语音对话/全双工/理解多任务上全面 SOTA 或 competitive", "route": "连续音频 → Whisper encoder → 3 级 conv adapter (6.25Hz) → Qwen2.5-7B → 交错 text+discrete speech tokens → FM decoder + BigVGAN → 24K 波形", "metrics": "URO-Bench 中文 AlpacaEval 90.02, VStyle 共情 anxiety 5.00; Full-duplex turn-taking 99.7%, pause handling 97.6%; MMSU 66.64 (SOTA); AIR-Bench avg 80.86 (SOTA); 预训练 2T tokens", "takeaway": "Intelligence-speaker decoupling 技术 --- 用多说话人训练解耦说话人与智力,再用 TTS 数据伪对话(masked text loss)转移高质量声音,成本远低于为每个声音收集对话数据", "limitation": "未开源全部版本(仅 Chat 版); 全双工版 pause handling 仍偶有 early-response; GaokaoEval 因长静音段导致 FD 版劣化明显; 音频理解推理能力仍不如 Qwen2.5-Omni 的 CoT", "concepts": ["SpeechLanguageModel", "Full-duplexSpokenDialogue", "SpeechTokenizer", "ModalityAdaptationforSpeechLLM", "ConditionalFlowMatching", "Speech-LLMIntegrationTaxonomy", "Turn-takinginSpokenDialogue", "AudioUnderstanding"], "source": "Sources/Covo-Audio.pdf", "github": "", "demo": ""}, {"name": "DSFlow", "title": "DSFlow: Dual Supervision and Step-Aware Architecture for One-Step Flow Matching Speech Synthesis", "arxiv_id": "2602.09041", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["flow-matching", "distillation", "one-step-generation", "TTS", "efficiency", "DiT"], "summary": "提出 dual supervision (endpoint + velocity alignment) + step-aware token 替代 adaLN-Zero 的模块化蒸馏框架,实现单步 flow matching TTS 接近 teacher 质量且参数减少 24%", "route": "噪声 x0 → DiT backbone (step-aware token 条件) → 单步预测 → mel spectrogram x1; 训练时 teacher 10-step ODE 提供 endpoint + mean velocity 双重监督", "metrics": "1-step MOS-N 4.32 vs teacher 10-step 4.43 (LibriSpeech); RTF 0.012 vs 0.303 (25x 加速); 118M vs 154M 参数 [Table 1]", "takeaway": "(1) 离散化后按信息熵匹配模型容量 -- adaLN-Zero 为连续时间设计,蒸馏到 K 步后只需 O(KD) 参数; (2) JVP-free 的 mean velocity 计算方法; (3) 蒸馏后弱 CFG (w=0.05) 仍有效的发现", "limitation": "未在超大规模多语言设定下验证; 不适用于 AR 架构; step-aware token 仅适用于 adaLN-based 架构 (CosyVoice2 等 U-Net 无法使用)", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Diffusion-basedTTS", "Non-autoregressiveTTS", "ScoreMatching", "MelSpectrogram"], "source": "Sources/DSFlow.pdf", "github": "", "demo": ""}, {"name": "DeepfakeWordDetection", "title": "Deepfake Word Detection by Next-token Prediction using Fine-tuned Whisper", "arxiv_id": "2602.22658", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["deepfake-detection", "ASR", "Whisper", "anti-spoofing", "partial-spoof", "word-level-detection", "vocoder", "fine-tuning"], "summary": "通过在转录文本中插入标记 token (`<TOF>`/`<EOF>`),将 Whisper 微调为同时执行语音转录和合成词检测的双任务模型,无需任何架构或算法改动", "route": "输入语音波形 -> Whisper encoder (mel spectrogram) -> decoder next-token prediction -> 输出带 `<TOF>`/`<EOF>` 标记的转录文本 -> 标记间的词即为检测到的合成词", "metrics": "In-domain (Ft.Voc->E.Voc): FAR 7.22%, FRR 0.52%, WER 0.87% [Table 2]; In-domain (Ft.TTS->E.TTS): FAR 1.38%, FRR 1.79%, WER 2.20% [Table 2]; 均与 ResNet 专用检测器持平", "takeaway": "\"Token 插入\"范式 -- 任何 seq2seq 模型都可以通过在输出序列中插入特殊 token 来低成本增加新任务,无需改架构/改 loss/加分类头; 用 vocoder copy-synthesis 生成训练数据替代昂贵的 TTS 合成数据", "limitation": "Out-of-domain 性能严重退化 (FAR 高达 78.6%); vocoded 训练数据无法泛化到 TTS 合成词; 跨语言场景下 FRR 接近 90%; 未开源代码", "concepts": ["Anti-spoofingandDeepfakeDetection", "NeuralVocoder", "LLM-enhancedASR"], "source": "Sources/DeepfakeWordDetection.pdf", "github": "", "demo": ""}, {"name": "ERNIE5.0", "title": "ERNIE 5.0 Technical Report", "arxiv_id": "2602.04705", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multimodal", "unified-model", "MoE", "autoregressive", "audio-generation", "audio-understanding", "TTS", "ASR"], "summary": "首个公开的万亿参数统一自回归基础模型,通过超稀疏 MoE + 模态无关路由 + 弹性训练,在单一 next-group-of-tokens prediction 框架下实现 text/image/video/audio 的理解和生成,且可从单次预训练中提取多种规模的子模型 [§Abstract]", "route": "Text/Vision/Audio → 模态专用 Tokenizer (text BPE / causal 3D visual VQ / 12.5Hz RVQ audio codec) → 统一 embedding → 超稀疏 MoE Backbone (<3% activation, modality-agnostic routing) → 模态专用 Head/Decoder → 输出 (text / image / video / waveform) [§2, Fig 1]", "metrics": "TTS WER 1.35% zh / 1.54% en (SEED-TTS, post-trained) [Table 8]; ASR WER 0.31 AISHELL-1 / 1.16|2.61 LibriSpeech (post-trained, best among omni-models) [Table 7]; VoiceBench AlpacaEval 4.94 / MMSU 81.95 [Table 7]; Audio Understanding MMAU 75.90 [Table 7]; Text MMLU-Pro 83.80 / AIME 2025 89.06 (post-trained) [Table 2]; Vision GenEval 90.1 / VBench-Semantic 83.40 [Table 5,6]; 弹性训练: 35.8% 参数子模型 avg score 75.17 vs 全模型 75.55 [Table 12]; 25% top-k routing 获 >15% decoding speedup,精度损失极小 [§6.4.2]", "takeaway": "(1) **Depth-wise NCP**: 将 RVQ 多层 codec 的预测分布到 backbone 不同 transformer 层,避免展平为长序列,适用于任何 RVQ-based 音频生成 [§2.3.2]; (2) **弹性训练三维度**: depth/width/sparsity 同时训练,单次预训练出多规格子模型,对 MoE 模型部署灵活性极有价值 [§3.3]; (3) **AHRL (Adaptive Hint-based RL)**: 对难题注入部分 think skeleton 引导,随训练进展渐退,解决 RL 中困难任务零奖励问题 [§4.3]; (4) **U-RB (Unbiased Replay Buffer)**: 解决异步 RL 中长尾 rollout 导致的数据分布偏差 [§4.1]; (5) **音频 semantic token Whisper 蒸馏**: 将 Whisper encoder 输出对齐到第一层 RVQ token,使语义信息集中于第一层,对设计 semantic-aware codec 有参考价值 [§2.3.1]", "limitation": "非开源,无法复现; TTS 质量弱于 CosyVoice 3 等专用系统 (zh WER 1.35 vs 0.71) [Table 8]; 音频评测仅覆盖 ASR/VoiceBench/MMAU 三类,缺乏 SIM/MOS/PESQ 等声学质量指标; 弹性训练的 ablation 仅在小模型 (3.2B) 上验证,未展示万亿参数上的详细消融; 论文未公开具体参数量、层数、专家数等关键架构细节; 音频只覆盖 speech,对 music/sound effect 等通用音频的生成能力未评测", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "LLM-basedTTS", "ResidualVectorQuantization"], "source": "Sources/ERNIE5.0.pdf", "github": "", "demo": ""}, {"name": "EditContentPreserveAcoustics", "title": "Edit Content, Preserve Acoustics: Imperceptible Text-Based Speech Editing via Self-Consistency Rewards", "arxiv_id": "2602.00560", "date": "2026-02", "venue": "ICME 2026", "org": "", "tier": "deep", "tags": ["speech-editing", "semantic-token", "reinforcement-learning", "GRPO", "flow-matching", "text-based-editing", "self-consistency", "perceptual-alignment"], "summary": "将 text-based speech editing 从 acoustic token 空间迁移到 semantic token 空间,并用预训练 TTS 模型的 log-prob 作为 self-consistency reward 通过 GRPO 进一步对齐编辑区与上下文的韵律连贯性", "route": "文本+前后缀 semantic tokens → LLM (PSM infilling) → 编辑区 semantic tokens → Flow Matching + HiFi-GAN → 波形", "metrics": "Insertion WER 4.97% (vs VoiceCraft 12.94), SIM 0.82 (vs 0.67), MOS 4.06 (vs 3.64) on full benchmark [Table I]; Substitution WER 4.41% (vs 12.73) [Table I]; 2.5s mask WER 4.227 (vs FluentSpeech 7.390) [Table II]", "takeaway": "用预训练 TTS 模型的条件 log-prob 作为 naturalness/coherence reward,可迁移到任何需要\"生成内容与上下文融合\"的场景 (如 speech continuation, dialogue TTS); Gated reward aggregation (WER 超阈值直接置零) 防止 reward hacking", "limitation": "仅测试英语; 训练需 8x H800; 仅限 insertion/deletion/substitution 三种操作,未扩展到 freeform editing; 依赖 CosyVoice 3 作为 critic,critic 质量上限受限", "concepts": ["SemanticvsAcousticTokens", "ConditionalFlowMatching", "DifferentiableRewardOptimization", "CodecLanguageModel", "Non-autoregressiveTTS", "LLM-basedTTS"], "source": "Sources/EditContentPreserveAcoustics.pdf", "github": "", "demo": ""}, {"name": "EmotionCoherentAugmentation", "title": "Emotion-Coherent Speech Data Augmentation and Self-Supervised Contrastive Style Training for Enhancing Kids's Story Speech Synthesis", "arxiv_id": "2602.10164", "date": "2026-02", "venue": "IEEE SLT 2024", "org": "", "tier": "deep", "tags": ["TTS", "expressive-speech", "data-augmentation", "contrastive-learning", "GST", "audiobook", "emotion", "style-embedding"], "summary": "用 text emotion classifier 驱动 emotion-coherent 语音拼接增强 + SimCLR contrastive loss 改善 GST reference encoder,提升小数据集上有声书 TTS 的表现力", "route": "单句音频 → T5 emotion 分类 → 同情感句拼接(插入正态分布停顿) → Tacotron2 + TP-GST 训练(+ SimCLR loss on reference encoder) → mel-spectrogram → WaveGlow → 多句有声书语音", "metrics": "TP-GST L1 loss 0.075 (M4) vs 0.155 (M2 baseline); emotion classification 75.3% vs 70.7%; MOS naturalness 3.25 vs 3.19; K-S test p=0.630 (M3) vs p=0.027 (M1) on inter-sentence pause [Table IV, V, §IV-C]", "takeaway": "emotion-coherent 拼接思路可迁移到任何需要多句训练的 TTS 系统; SimCLR on reference encoder 是简单有效的正则化手段; 用正态分布建模句间停顿是低成本但有效的方法", "limitation": "仅 6.5h 单说话人数据,MOS 仅 3.25 且置信区间重叠; 基于 Tacotron2+WaveGlow 的过时架构; 仅 8 名评估者; 无与现代 LLM-TTS 的对比", "concepts": ["GlobalStyleTokens", "EmotionControlinTTS", "ProsodyModeling", "Self-SupervisedSpeechRepresentation", "StyleTransferinTTS", "MelSpectrogram"], "source": "Sources/EmotionCoherentAugmentation.pdf", "github": "", "demo": ""}, {"name": "Eureka-Audio", "title": "Eureka-Audio: Triggering Audio Intelligence in Compact Language Models", "arxiv_id": "2602.13954", "date": "2026-02", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["audio-understanding", "lightweight-model", "MoE", "adapter", "paralinguistic", "ASR", "audio-captioning", "data-synthesis"], "summary": "1.7B 参数的轻量级音频理解模型,通过 MoE adapter 处理音频异质性 + DataFlux 数据合成管线增强副语言推理,在 MMAU 等 benchmark 上与 4-17x 更大的模型竞争", "route": "原始音频 → Whisper encoder (连续声学表征) → Sparse MoE Adapter (跨模态映射) → Qwen3-1.7B-base LLM (自回归文本生成)", "metrics": "MMAU 74.67 (vs Qwen3-Omni 74.57) [Table 4]; LibriSpeech test-clean WER 1.46 [Table 3]; 解码吞吐 269.7 tokens/s (vs Qwen3-Omni 72.9) [Fig 4]; Dense captioning MMAU 52.96 (vs Qwen3-Omni-Captioner 56.68) [Table 5]", "takeaway": "MoE adapter 解耦不同音频类型 (语音/环境声/音乐) 的表征冲突,适用于任何多类型音频统一建模场景; DataFlux 的多模型交叉验证数据过滤思路可迁移到其他数据合成管线", "limitation": "仅支持理解不支持生成; WenetSpeech 等中文场景与大模型差距明显 [Table 3]; MoE adapter 的专家路由可视化和分析缺失,无法验证\"不同专家确实学到不同音频类型\"的 claim; DataFlux 依赖 GPT-OSS-120B 和 Qwen3-Omni 等闭源/大模型作为 teacher", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "Audio-LanguagePretraining"], "source": "Sources/Eureka-Audio.pdf", "github": "", "demo": ""}, {"name": "GSRM", "title": "GSRM: Generative Speech Reward Model for Speech RLHF", "arxiv_id": "2602.13891", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["reward-model", "generative-reward", "RLHF", "speech-naturalness", "CoT-reasoning", "acoustic-features", "TTS-evaluation", "online-RL"], "summary": "提出 Generative Speech Reward Model (GSRM),将语音自然度评估分解为 acoustic feature extraction + feature-grounded CoT reasoning 两阶段,实现可解释的多维度语音质量判断,并首次用于 online speech RLHF [论文原文]", "route": "Raw audio → Phoneme-level forced alignment → Vowel-level acoustic features (pitch/intensity/duration) → Acoustic feature log → Text LLM (GPT-4o) CoT synthesis → SFT on Qwen2.5-Omni-7B → GSRM; Online RLHF: Speech LLM generator → GSRM verifier → reward → RL update", "metrics": "Naturalness prediction PCC 0.465 (OOD), approaching human inter-rater 0.532 [Table 5]; Online RLHF: 82% A/B win rate in naturalness [Table 6]", "takeaway": "(1) 将 speech evaluation 分解为 explicit feature extraction + reasoning,比端到端预测更可解释; (2) vowel-level acoustic features 作为 sufficient statistics; (3) GSRM 作为 universal verifier 实现 online speech RLHF", "limitation": "(1) 依赖 forced alignment 工具 (phoneme-level),可能在 noisy/accented speech 上失败; (2) CoT 合成依赖 GPT-4o,成本高; (3) 仅在 conversational TTS 场景验证; (4) 31K 标注数据规模相对较小", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "TTSEvaluation"], "source": "Sources/GSRM.pdf", "github": "", "demo": ""}, {"name": "PFluxTTS", "title": "PFluxTTS: Hybrid Flow-Matching TTS with Robust Cross-Lingual Voice Cloning and Inference-Time Model Fusion", "arxiv_id": "2602.04160", "date": "2026-02", "venue": "IEEE ICASSP 2026", "org": "", "tier": "deep", "tags": ["flow-matching", "TTS", "cross-lingual", "voice-cloning", "dual-decoder", "vocoder", "super-resolution", "zero-shot"], "summary": "推理时融合 duration-guided 和 alignment-free 两个独立 flow-matching 解码器的向量场,兼得对齐稳定性和自然度,配合 FLUX 架构的 sequence prompt embedding 实现鲁棒跨语言克隆", "route": "phonemes → DG TextEncoder + AF TextEncoder → DG FLUX decoder + AF DiT decoder → vector-field fusion (ODE solver) → mel → PeriodWave+SR vocoder → 48kHz waveform", "metrics": "Nat. MOS 4.11 / SMOS 3.51 (mTEDx cross-lingual) [Table 1]; WER 6.9% / SPK-SIM 0.68 (VoxLingua-dev, 33 languages) [Table 2]", "takeaway": "推理时向量场融合策略 -- 两个独立训练的模型通过分时段的 alpha 调度在 ODE 求解中混合,无需联合训练或蒸馏,实用性极强", "limitation": "仅在 English 作为目标语言的方向上评估; RTF 0.56 不算快(两个完整解码器 + 30 ODE steps); 50k 小时训练数据远少于 ChatterBox 等 baseline", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "DurationPredictor", "NeuralVocoder", "VoiceCloningTaxonomy", "SpeakerEmbedding"], "source": "Sources/PFluxTTS.pdf", "github": "", "demo": ""}, {"name": "PersonaPlex", "title": "PersonaPlex: Voice and Role Control for Full Duplex Conversational Speech Models", "arxiv_id": "2602.06053", "date": "2026-02", "venue": "ICASSP 2026 (under review)", "org": "", "tier": "deep", "tags": ["full-duplex", "voice-cloning", "role-conditioning", "duplex-speech", "speaker-similarity", "conversational-AI", "NVIDIA"], "summary": "首个在全双工对话模型中同时实现 zero-shot voice cloning 和 text-based role conditioning 的系统,通过 Hybrid System Prompt (text+voice) 在 Moshi 架构上实现角色化对话 [§1]", "route": "[text prompt (角色描述) + voice prompt (短音频样本)] → Hybrid System Prompt → Moshi (Depth+Temporal Transformer, Mimi codec) → 三通道 (user audio, agent text, agent audio) 自回归生成 [§3.1, Fig 1]", "metrics": "DMOS 3.90 (Full-Duplex-Bench, SOTA) vs Moshi 2.83 / Gemini 3.72 [Table 1]; SSIM 0.57 (voice cloning, SOTA) vs Moshi 0.10 / Gemini 0.00 [Table 1]; Service-Duplex-Bench GPT-4o 均分 4.48 vs Gemini 4.73 / Moshi 1.75 [Table 4]; 发布模型 DMOS 2.95, SSIM 0.65 [Table 7, Appendix A]", "takeaway": "(1) Hybrid System Prompt: text+voice 两段拼接实现双重 conditioning,顺序无关 [§3.1]; (2) 合成数据方案: Qwen-3-32B/GPT-OSS-120B 生成文本对话 → Dia/ChatterboxTTS 合成语音,覆盖客服+QA 场景 [§3.2]; (3) Service-Duplex-Bench: 50 场景 x 7 问题的角色遵循评估扩展 [§3.3]", "limitation": "仅英语 [论文原文]; 基于 Moshi 7B 架构限制了智能上限 [agent解读]; 未开源训练数据/代码,仅开源模型权重 (personaplex-7b-v1) [Appendix A]; text prompt 细节程度对角色遵循影响显著 [§3.2]", "concepts": ["Full-duplexSpokenDialogue", "Turn-takinginSpokenDialogue", "VoiceCloningTaxonomy", "SpeakerEmbedding", "SpokenDialogueEvaluation", "StreamingSpokenDialogue"], "source": "Sources/PersonaPlex.pdf", "github": "", "demo": ""}, {"name": "SiTok", "title": "SiTok", "arxiv_id": "2602.06602", "date": "2026-02", "venue": "ICLR 2026", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "diffusion-autoencoder", "semantic-regularization", "CTC", "low-bitrate", "flow-matching", "speech-codec", "speech-understanding"], "summary": "用 diffusion autoencoder 替代 RVQ-GAN 构建 speech tokenizer,通过 CTC semantic regularization 使 12.5 Hz / 0.2 kbps 单 codebook 离散表征同时支持高保真重建和强语义理解", "route": "Mel(50Hz,128-bin) → 4x downsample → Llama Encoder(16L) → VQ(65536) → Llama Diffusion Decoder(16L, non-causal, flow matching) → Mel → Vocos → Wav(24kHz); 辅助 CTC Decoder(4L) → text", "metrics": "WER 4.06 / SIM 0.641 / UTMOS 3.44 (CN=1, 0.2kbps); WER 2.80 / SIM 0.660 / UTMOS 3.46 (CN=4, 0.7kbps); LLM-ASR WER 4.95; 显著优于 Mimi/WavTokenizer/StableCodec 等 on SeedTTS test-en [Table 1,2]", "takeaway": "(1) Diffusion autoencoder 作为 speech tokenizer 的新范式 (2) CTC loss 直接监督 VQ latent space 保证语义性 (3) Token CFG 增强 codec 重建 (4) Shortcut fine-tuning 实现 2-4 步高质量解码", "limitation": "2M 小时 Meta 内部数据不可复现; diffusion decoder 推理仍需多步 (默认 16 步); 非因果架构不支持 streaming; 离散表征仍落后于连续特征", "concepts": ["SpeechTokenizer", "DiffusionModel", "ConditionalFlowMatching", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "Classifier-FreeGuidance", "MelSpectrogram", "CodebookCollapse", "SpeechLanguageModel", "TokenRateandBitrateTrade-offs", "Single-codebookvsMulti-codebook", "CodecTrainingObjectives"], "source": "Sources/SiTok.pdf", "github": "", "demo": ""}, {"name": "TADA", "title": "TADA: A Generative Framework for Speech Modeling via Text-Acoustic Dual Alignment", "arxiv_id": "2602.23068", "date": "2026-02", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "LLM", "flow-matching", "synchronous-tokenization", "VAE", "alignment", "spoken-language-model", "zero-shot"], "summary": "通过 CTC 对齐将语音特征与文本 token 1:1 同步,实现 2-3 fps 的极低帧率单流 LLM 建模,几乎消除内容幻觉", "route": "Text + Audio → CTC Aligner (forced alignment) → VAE Encoder (per-token latent) → Llama 3.2 (additive text+acoustic embedding, K-shift lookahead) → Flow Matching Head (acoustic + Bit Diffusion duration) → VAE Decoder → Waveform", "metrics": "SeedTTS-Eval CER 0.73% (1B) / 0.76% (3B), SIM 77.9/75.1; LibriTTSR CER 0.55/0.40, SIM 80.2/79.9; RTF 0.09/0.13; 零幻觉 (CER>0.15 样本数=0) [Table 2]", "takeaway": "(1) 1:1 text-speech 对齐作为 inductive bias 消除幻觉; (2) Bit Diffusion (gray coding) 在 flow matching 中联合预测连续特征和离散时长; (3) Speech Free Guidance 以几乎零开销弥合 modality gap; (4) 在线 rejection sampling 保证 speaker 一致性", "limitation": "oMOS 分数偏低 (2.79-2.85),说明音频感知质量有提升空间; SIM 在长文本下有 speaker drifting; 需要预训练 CTC aligner + VAE codec,pipeline 不简单; 模型 1B/3B 较大; 开源", "concepts": ["LLM-basedTTS", "ConditionalFlowMatching", "SpeechTokenizer", "Speech-TextAlignment", "SpeechLanguageModel", "TokenRateandBitrateTrade-offs", "VariationalAutoencoderforTTS", "Next-TokenDiffusion", "Classifier-FreeGuidance", "SpeakerEmbedding"], "source": "Sources/TADA.pdf", "github": "", "demo": ""}, {"name": "UniAudio2.0", "title": "UniAudio 2.0: A Unified Audio Language Model with Text-Aligned Factorized Audio Tokenization", "arxiv_id": "2602.04683", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-foundation-model", "unified-understanding-generation", "audio-tokenizer", "factorized-codec", "reasoning-tokens", "layer-specialization", "multi-task", "few-shot"], "summary": "通过 ReasoningCodec (reasoning tokens 5Hz + reconstruction tokens 12.5Hz) 和 functional layer specialization (understanding/cross-modal/generation experts) 构建首个跨 speech/sound/music 的统一理解+生成音频基础模型", "route": "Audio → ReasoningCodec [Reasoning Branch (Whisper+Music encoder → query-based RVQ 5Hz) + Reconstruction Branch (WavLM+Whisper+Music → group-wise VQ 12.5Hz + FiLM)] → Multi-stream 9-channel packing → Unified AR Transformer (3 understanding + 28 cross-modal/LLaMA + 2 generation layers + 4-layer local decoder) → Audio/Text output", "metrics": "ASR LS-clean 2.71 WER; TTS SEED-EN 3.63 / SEED-ZH 2.30 WER; Codec MUSHRA speech 90.5±2.8 (best); Reasoning PPL 3.68 (vs XCodec 18.40); 1-shot emotion 67.0% EN; DSR 19.4% WER (vs Qwen2.5-Omni 80.6%); MMLU 44.1% (vs LLaMA 3.2 3B 47.6%) [Tables 1-8]", "takeaway": "(1) Reasoning tokens 作为 text-aligned \"planning layer\" 降低 reconstruction tokens 建模难度 (信息论证明: I(S;R|X,S<t) > 0 → PPL 降低); (2) Layer specialization 避免全层处理 text+audio 导致的 text knowledge forgetting; (3) Auditory sentences 作为统一 multi-task 训练数据构造策略; (4) GRPO 训练 reasoning branch 改善 tokenizer 的理解质量", "limitation": "Flow-based decoder 多步推理增加延迟 [Appendix C.1]; 仅探索 1B/3B 规模,未验证 scaling law [C.3]; Sound/music 数据量远少于 speech 导致非语音任务弱 [C.4]; 未做 post-training (SFT/RLHF) [C.5]; S2S 对话质量弱于 LLAMA-Omni [Table 7]", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/ResidualVectorQuantization|RVQ", "概念库/SemanticvsAcousticTokens|Semantic vs Acoustic Tokens", "概念库/LLM-basedTTS|LLM-based TTS", "概念库/AudioUnderstanding|Audio Understanding", "概念库/AudioTokenizerTaxonomy|Audio Tokenizer Taxonomy", "概念库/SpeechFactorization|Speech Factorization", "概念库/CodecLanguageModel|Codec Language Model"], "source": "Sources/UniAudio2.0.pdf", "github": "", "demo": ""}, {"name": "VividVoice", "title": "VividVoice: A Unified Framework for Scene-Aware Visually-Driven Speech Synthesis", "arxiv_id": "2602.02591", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["scene-aware-TTS", "multi-modal-alignment", "latent-diffusion", "visual-driven", "environmental-acoustics", "memory-bank", "decoupling"], "summary": "提出 Scene-Aware Visually-Driven Speech Synthesis 任务,用 decoupled memory bank (D-MSVA) 同时从视觉场景中提取音色和环境声效特征,配合 latent diffusion 生成与场景匹配的沉浸式语音", "route": "(文本 + 图像 + 参考语音) → Text Encoder + MAS + Duration Predictor 得 text latent; Visual Encoder (MetaCLIP) + Audio Encoder (CLAP) → D-MSVA (4 memory banks) 得 Recalled Scene Embedding → 两路联合 condition Latent Diffusion → VAE Decoder + Vocoder → 波形", "metrics": "WER 7.15% (vs VoiceLDM 9.23%, GT 10.62%), FAD 3.98 (vs 4.74), KL 1.53 (vs 1.79), MOS-SC 4.30 (vs 2.56), MOS-TI 3.08 (vs 1.75) [Table 1]", "takeaway": "Decoupled memory bank 解耦多属性的思路可推广到任何需要从单一输入独立控制多个属性的场景;programmatic data pipeline(用 text-to-image + text-to-audio 同 prompt 生成配对数据)解决跨模态对齐数据稀缺问题", "limitation": "只对比了 VoiceLDM 一个 baseline(其他 vision-driven 模型因任务不匹配被排除);CLAPcap 分数略低于 baseline,论文归因于 caption 中非发声视觉细节的干扰;数据集主要依赖合成数据(Vivid-210K 中 pretraining set 为程序合成),真实数据仅用于 fine-tuning", "concepts": ["Diffusion-basedTTS", "DurationPredictor", "VariationalAutoencoderforTTS", "SpeakerEmbedding", "MelSpectrogram"], "source": "Sources/VividVoice.pdf", "github": "", "demo": ""}, {"name": "WhenDoSpeechLLMsBehaveLikeASR-LLMPipelines", "title": "The Cascade Equivalence Hypothesis: When Do Speech LLMs Behave Like ASR→LLM Pipelines?", "arxiv_id": "2602.17598", "date": "2026-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "interpretability", "cascade", "evaluation", "probing", "logit-lens", "concept-erasure", "benchmark-methodology"], "summary": "提出 Cascade Equivalence Hypothesis 并用 matched-backbone 行为测试 + logit lens/LEACE 机制分析证明当前 speech LLMs 在 text-sufficient 任务上本质是隐式 ASR→LLM cascade,且噪声下更差", "route": "音频输入 → E2E Speech LLM (Ultravox/Qwen2-Audio/Phi-4-MM/Gemini) vs. Whisper+matched-backbone LLM cascade → 6 个分类任务(4 text-sufficient + 2 text-insufficient) → per-example Cohen's kappa + error overlap + McNemar + layer-wise probing + logit lens + LEACE", "metrics": "Ultravox vs matched cascade kappa=0.93 (AG News), 0.78 (CSQA); 噪声下 Gemini SST-2 掉 10.2% vs Cascade-S 仅 2.6%; LEACE text erasure 令两个模型所有任务准确率降至 0%", "takeaway": "(1) matched-backbone testing 方法论可迁移到任何多模态 LLM 评估; (2) \"acoustic surplus\" 信息论框架可用于判断任务是否需要 E2E 模型; (3) implicit cascade test 可检验内部表征是否真正驱动预测", "limitation": "机制分析仅覆盖 2/4 模型(Gemini 闭源, Phi-4-MM 架构不同); text-sufficient 任务用 TTS 合成音频非自然语音; 线性 probing/LEACE 无法捕获非线性编码的信息", "concepts": ["SpeechLanguageModel", "Speech-LLMIntegrationTaxonomy", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "LLM-enhancedASR"], "source": "Sources/WhenDoSpeechLLMsBehaveLikeASR-LLMPipelines.pdf", "github": "", "demo": ""}, {"name": "AzeroS", "title": "AzeroS: Extending LLM to Speech with Self-Generated Instruction-Free Tuning", "arxiv_id": "2601.0
