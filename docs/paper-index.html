6086", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-LM", "instruction-free", "modality-adaptation", "paralinguistic", "dual-encoder", "self-generated-data", "alignment", "audio-understanding"], "summary": "通过 Self-Generated Instruction-Free Tuning (SIFT) 范式,仅训练两个轻量 projector (共 47.6M 参数) 就让冻结的 Qwen2.5-7B 同时理解语音语义和副语言信息,在 VoiceBench 和 AIR-Bench 上取得 SOTA", "route": "Speech → TTA encoder (semantic, 153M, frozen) + Auden-Voice encoder (paralinguistic, 153M, frozen) → 2x linear projector (23.8M each, trainable) → Qwen2.5-7B-Instruct (frozen) → text response", "metrics": "VoiceBench overall 73.13 (vs text-only 上界 77.52, cascaded Whisper+Qwen2.5 76.05); AIR-Bench Foundation avg 77.25; AIR-Bench Chat 8.28 (超过 GPT-4o 的 7.53 和 Qwen2.5-Omni 的 7.85) [Table 5]", "takeaway": "(1) SIFT 范式 -- 去掉 instruction 强迫 encoder 做全信息对齐,理论简洁且实验有效; (2) 冻结 LLM 的 self-generated data 替代人工标注; (3) 两阶段渐进对齐 (先 semantic 后 paralinguistic) 比一阶段效果好", "limitation": "仅做 speech-aware (text output),不生成语音; 公开数据仅 ~25k 小时; 未验证更大 LLM backbone 的 scaling; SIFT 在 self-elicit 条件不满足时退化 (需 SIT fallback)", "concepts": ["SpeechLanguageModel", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "Speech-LLMIntegrationTaxonomy", "Self-SupervisedSpeechRepresentation"], "source": "Sources/AzeroS.pdf", "github": "", "demo": ""}, {"name": "BridgingAudio-TextGap", "title": "CORD: Bridging the Audio-Text Reasoning Gap via Weighted On-policy Cross-modal Distillation", "arxiv_id": "2601.16547", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-LM", "cross-modal-alignment", "knowledge-distillation", "GRPO", "on-policy", "LALM", "audio-text-gap", "reasoning"], "summary": "用模型自身的文本模态作为 teacher,通过 on-policy 跨模态蒸馏(token 级加权 KL + 序列级 GRPO)弥合 LALM 中音频-文本推理差距", "route": "音频输入 → LALM rollout → token 级 reverse KL (Top-K 重要性加权 + 位置衰减) + 序列级 judge-based GRPO → 对齐到文本条件推理行为", "metrics": "音频-文本 gap 平均减少 41.6% (Qwen2-Audio) / 44.8% (Step-Audio2-mini); MMSU 36.04→38.06 [Table 1]; 仅用 80K 训练样本 [§4.1]", "takeaway": "(1) token 级 KL 偏斜分析方法可迁移到任何跨模态蒸馏场景; (2) Top-K 重要性加权避免梯度稀释; (3) on-policy distillation + GRPO 的组合解决 GRPO 单独使用时的 collapse 问题 [Table 3]", "limitation": "仅在 Baidu 内部 judge model 上验证(未开源); 训练数据为数学单一领域; 未在真正 text-insufficient 任务(如情感识别)上验证效果", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "ModalityAdaptationforSpeechLLM", "Audio-LanguagePretraining", "Speech-LLMIntegrationTaxonomy", "DifferentiableRewardOptimization"], "source": "Sources/BridgingAudio-TextGap.pdf", "github": "", "demo": ""}, {"name": "CosyEdit", "title": "CosyEdit: Unlocking End-to-End Speech Editing Capability from Zero-Shot Text-to-Speech Models", "arxiv_id": "2601.05329", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-editing", "end-to-end", "post-training", "transfer-learning", "flow-matching", "AR-NAR", "cost-effective", "zero-shot-TTS-adaptation"], "summary": "通过对 CosyVoice 进行 task-specific post-training + inference 优化,仅用 250h 监督数据和 400M 参数实现端到端语音编辑,匹敌 cascade SOTA 并超越所有 E2E 基线", "route": "(target text + original speech) → S3 tokenizer → AR LLM 生成 target speech tokens → GOT-CFM (guided by original mel) → mel spectrogram → HiFi-GAN → edited speech", "metrics": "WER 4.50% / EMOS 4.15 (RealEdit, best overall) ; SpkSIM 0.9734 / SMOS 4.04 (best E2E, close to cascade SOTA) ; MCD 4.94 dB (best E2E after replacement)", "takeaway": "(1) Zero-shot training + one-shot inference 的非对称设计防止 shortcut learning; (2) GOT-CFM reference-guided conditioning 保持编辑区/非编辑区一致性; (3) GigaEdit 低成本数据构造流程可迁移到其他编辑任务", "limitation": "仅英文 (GigaSpeech); 未开源 (承诺开源); 背景噪声保持仍有 MOS 损失; 多编辑位置场景未深入分析", "concepts": ["LLM-basedTTS", "ConditionalFlowMatching", "SpeechTokenizer", "SpeakerEmbedding", "Speech-TextAlignment"], "source": "Sources/CosyEdit.pdf", "github": "", "demo": ""}, {"name": "DiffuSpeech", "title": "DiffuSpeech: Silent Thought, Spoken Answer via Unified Speech-Text Diffusion", "arxiv_id": "2601.22889", "date": "2026-01", "venue": "Preprint (arXiv)", "org": "", "tier": "deep", "tags": ["speech-LM", "diffusion", "masked-diffusion", "speech-to-speech", "chain-of-thought", "reasoning", "multimodal", "non-autoregressive"], "summary": "首个 diffusion-based speech-text LM,通过 masked diffusion 联合生成文本推理链和语音回复,实现 \"Silent Thought, Spoken Answer\"", "route": "Speech (HuBERT 25Hz → 500 discrete tokens) + Text (LLaDA 128K vocab) → Unified MDLM backbone (masked diffusion, selective masking) → Text reasoning + Speech tokens → HiFi-GAN vocoder → Waveform", "metrics": "S→S QA: LlamaQ 68.5% (+4.3 vs Moshi), WebQ 49.7% (+9.0 vs Moshi) [Table 2]; TTS WER: 6.2% LS-Clean (best among generative models) [Table 3]; MMLU 66.2% (+0.3 vs LLaDA base) [Table 4]", "takeaway": "(1) Modality-specific selective masking: 仅 mask target 不 mask condition,让不同模态共享一个 diffusion backbone; (2) \"Silent Thought\" 范式: text CoT traces 不发声但指导 speech 生成质量; (3) Confidence-based unmasking schedule: 先填高确信 token 后填难 token,类似 MaskGIT 但用于 speech-text 混合序列", "limitation": "HuBERT 25Hz/500 codes 语音质量上限受限 (无 speaker similarity 评估); ThinkingTalk 数据集仅 26K 样本且用合成语音; 未评估延迟/RTF; 仅支持英语", "concepts": ["SpeechLanguageModel", "MaskedGenerativeModeling", "Diffusion-basedTTS", "SemanticvsAcousticTokens", "NeuralVocoder", "LLM-basedTTS"], "source": "Sources/DiffuSpeech.pdf", "github": "", "demo": ""}, {"name": "EmoShift", "title": "EmoShift: Lightweight Activation Steering for Enhanced Emotion-Aware Speech Synthesis", "arxiv_id": "2601.22873", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "activation-steering", "LLM-based", "lightweight", "CosyVoice", "parameter-efficient"], "summary": "在 LLM-based TTS 的输出嵌入空间插入轻量 EmoSteer 层,学习每种情感的 steering vector,以 10M 参数 (< 1/30 全参) 实现超越全参数微调的情感表现力", "route": "[Speaker Emb, Emotion Prompt, Text Emb] → LLM (CosyVoice-300M-Instruct, frozen) → hidden state h → EmoSteer Layer (h' = h + ε·v_e, v_e = hW_e) → modified speech tokens → Flow Matching Vocoder → waveform", "metrics": "EmoShift(Best): Overall emotion SER 75.94%, MOS 4.14, Emo-MOS 3.96 vs CosyVoice-SFT(311M): 69.74%, 3.93, 3.79 [Table 1, Table 2] (ESD English, 10 speakers)", "takeaway": "(1) 可学习投影矩阵 W_e 将通用 hidden state 映射为情感特定方向,方法简单可复制; (2) 推理时 α 缩放实现情感强度连续控制; (3) 仅训练 EmoSteer 层冻结其余参数的策略可推广到其他可控属性 (口音/语速/风格)", "limitation": "仅在 ESD 英文 (350 句, 5 情感, 10 说话人) 上验证,规模很小; 未开源; α=3 时 WER 从 7.90 升至 11.60; SpkSIM 低于全参微调 (82.41 vs 93.03)", "concepts": ["EmotionControlinTTS", "LLM-basedTTS", "ProsodyModeling"], "source": "Sources/EmoShift.pdf", "github": "", "demo": ""}, {"name": "Fine-GrainedContrastiveAudio-Text", "title": "Towards Fine-Grained and Multi-Granular Contrastive Language-Speech Pre-training", "arxiv_id": "2601.03065", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["contrastive-learning", "speech-text-retrieval", "speaking-style", "paralinguistic", "dual-encoder", "fine-grained", "pretraining", "dataset"], "summary": "提出 FCaps (47k h/19M captions) 和 CLSP 模型 (724M),首次用端到端 fine-grained style captions 训练 speech-text dual encoder,在检索/分类/风格相似度打分上大幅超越已有 CLAP 模型", "route": "语音 → SPEAR-XLarge encoder → mean pooling → MLP + L2 norm → 共享嵌入空间 ← L2 norm + MLP ← [CLS] ← RoBERTa-base ← caption text; 两阶段课程训练 (InfoNCE → multi-positive InfoNCE + 动态调度)", "metrics": "全局检索 S→T R@1 45.6 (vs ParaCLAP 2.1), 细粒度检索 S→T R@1 68.1 (vs GLAP 4.6); 零样本情感 WA 57.2 (IEMOCAP); 人类相关性 Pearson r=0.893/0.903/0.886 (Intrinsic/Situational/Fusion) [Table 3-5]", "takeaway": "端到端标注 pipeline (Qwen3-Omni captioner + agentic verification); 多正例对比训练处理一对多 speech-caption 关系; 动态任务调度器平衡粗/细粒度; CLSP 可直接作为 TTS style evaluation metric", "limitation": "仅英语; SPEAR 编码器限制了非英语泛化; 评估数据集有限 (ParaSpeechCaps test set 仅 241 clips); 零样本分类仍不够强 (IEMOCAP UA 56.1%)", "concepts": ["Audio-LanguagePretraining", "NaturalLanguageDescriptionforTTS", "Self-SupervisedSpeechRepresentation", "StyleTransferinTTS", "TTSEvaluation"], "source": "Sources/Fine-GrainedContrastiveAudio-Text.pdf", "github": "", "demo": ""}, {"name": "FlexiVoice", "title": "FlexiVoice: Enabling Flexible Style Control in Zero-Shot TTS with Natural Language Instructions", "arxiv_id": "2601.04656", "date": "2026-01", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["TTS", "instruction-following", "style-control", "zero-shot", "DPO", "GRPO", "disentanglement", "progressive-post-training"], "summary": "通过 Progressive Post-Training (DPO→Decoupling GRPO→Instruction GRPO) 系统性解决 zero-shot TTS 中 Style-Timbre-Content conflict 的 instruction-following TTS 系统 [论文原文]", "route": "Text + Instruction + Reference Speech → LLM (pre-trained on Emilia + FlexiVoice-Instruct) → Speech Tokens → Flow Matching → Mel → Vocoder → Waveform; Post-training: S1 (DPO on emotion) → S2 (Decoupling GRPO with r_ser + r_sv rewards) → S3 (Instruction GRPO with ALM reward) [§3, Fig.1]", "metrics": "TO-Easy ACC-I: 97.4% EN / 99.8% ZH (vs CosyVoice2 baseline N/A); TO-Hard ACC-I: 89.4% (vs VoxInstruct 17.8%); TR-Easy ACC-I: 89.4% EN / 81.8% ZH with SV 91.0% / 98.8%; InstructTTSEval Avg: 79.3 EN / 70.8 ZH (vs Gemini-pro 80.3 / 84.8, MiMo-Audio 72.6 / 70.5); CMOS up to +0.9 vs FlexiVoice-Base [Table 2, 3, 4]", "takeaway": "(1) Progressive Post-Training curriculum (easy emotions → hard disentanglement → complex instructions), 证明顺序至关重要 (逆序 Avg 54.7 vs 正序 88.7) [Table 5]; (2) Multi-objective GRPO 用 SER + SV rewards 实现 style-timbre 解耦 [§3.2.2]; (3) FlexiVoice-Instruct 4316hrs 指令-语音数据集构建方法 (LLM metadata annotation) [§4]", "limitation": "ACC-T 非零 (6.6% EN TO-Hard) 说明文本情感泄漏未完全消除; WER/CER 略高于 base model (style 代价) [Table 3]; 未开源; 依赖 SER/SV 外部 reward models", "concepts": ["LLM-basedTTS", "ConditionalFlowMatching", "SpeechTokenizer", "Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "StyleTransferinTTS", "EmotionControlinTTS", "DifferentiableRewardOptimization"], "source": "Sources/FlexiVoice.pdf", "github": "", "demo": ""}, {"name": "Habibi", "title": "Habibi: Laying the Open-Source Foundation of Unified-Dialectal Arabic Speech Synthesis", "arxiv_id": "2601.13802", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "Arabic", "multi-dialect", "low-resource", "curriculum-learning", "flow-matching", "zero-shot", "benchmark"], "summary": "首个开源统一多方言阿拉伯语 TTS 框架,通过 ASR→TTS 数据整理 + MSA→方言课程学习,在 12+ 方言上匹敌 ElevenLabs 商业系统", "route": "ASR 语料 → CPS 过滤 + 源分离去噪 → mel spectrogram + 字符序列 → F5-TTS (flow matching) → MSA SFT (Stage 1) → 方言/统一 SFT (Stage 2, 含 regional identifier tokens) → zero-shot 合成", "metrics": "Uni.D2-I DMOS 4.24 vs ElevenLabs 4.12 (MSA), SMOS 全 7 方言超越 ElevenLabs (ALG: 4.10 vs 2.48), WER-O 6/7 方言更低, SIM 全部更高 [Table 4, 5]", "takeaway": "(1) 用 CPS 过滤从 ASR 语料中筛选 TTS 可用数据,简单但有效; (2) 课程学习中先学正式语体(MSA)再学方言,数据排序比计算量更重要; (3) Regional identifier tokens 训练时使用即使推理时缺失也能提升性能", "limitation": "UTMOS 全面低于 ElevenLabs (MSA: 2.81 vs 3.35),自然度有差距; 阿拉伯语 ASR 模型本身 WER 很高(MAR GT WER-O 54.42%),评估可靠性受限; 方言 ASR 偏弱导致部分结果可能失真", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "MelSpectrogram", "TTSEvaluation"], "source": "Sources/Habibi.pdf", "github": "", "demo": ""}, {"name": "MCLP", "title": "Evaluating and Rewarding LALMs for Expressive Role-Play TTS via Mean Continuation Log-Probability", "arxiv_id": "2601.22661", "date": "2026-01", "venue": "ICML 2026", "org": "", "tier": "deep", "tags": ["TTS", "evaluation", "reward", "RL", "GRPO", "role-play", "stylistic-consistency", "LALM"], "summary": "提出 MCLP — 利用 LALM continuation likelihood 量化风格一致性的可解释指标,同时作为 GRPO reward 显著提升 Role-Play TTS 的风格遵循", "route": "场景/角色/对话历史 → Step-Audio-2-mini SFT → GRPO (MCLP style reward + CER content gate) → 交错 TA4 tokens → token2wav", "metrics": "MOS 3.576 (vs MiMo-Audio-7B 2.484, OV-InstructTTS 2.864); CER 1.130% (最低); MCLP -4.636 (最高); MCLP ∆>0.1 时 win rate>0.8 [Table 2, Fig 5]", "takeaway": "(1) \"固定 transcript + 重复\" 的 continuation context 设计,消除 content 变量后 likelihood 仅反映 style; (2) gated hybrid reward (CER>τ 则 R=0) 防止 \"expressive gibberish\"; (3) 300 万小时 continuation pretraining 增强 LALM 的 style-aware ICL", "limitation": "仅中文验证 (英文仅跨语言初步实验); 依赖 Step-Audio-2 tokenizer (semantic tokenizer 偏向 style 而非 acoustic); 场景/角色描述由 LLM 自动生成可能有噪声; 开源代码但未开源模型权重", "concepts": ["LLM-basedTTS", "TTSEvaluation", "StyleTransferinTTS", "DifferentiableRewardOptimization", "Instruction-GuidedSpeechSynthesis", "EmotionControlinTTS"], "source": "Sources/MCLP.pdf", "github": "", "demo": ""}, {"name": "MoEAdapter", "title": "MoE Adapter for Large Audio Language Models: Sparsity, Disentanglement, and Gradient-Conflict-Free", "arxiv_id": "2601.02967", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["MoE", "adapter", "LALM", "gradient-conflict", "audio-understanding", "sparse-routing", "expert-specialization", "multimodal"], "summary": "将 LALM 中的 dense adapter 替换为 MoE 架构,通过 sparse expert routing 解耦异构音频信号的梯度冲突,在相同参数预算下提升音频理解和推理性能", "route": "双流音频输入 (Whisper-VQ semantic tokens + Whisper encoder continuous features) → element-wise fusion → MoE-Adapter (8 experts, top-4 routing + aggregation MLP) → Qwen3-1.7B LLM decoder → NTP", "metrics": "MMSU +3.16 (35.03→38.19), OBQA +3.75 (50.10→53.85), MMAU +1.71 (59.79→61.50); 活跃参数仅为 baseline 的 75% (70.8M vs 94.4M)", "takeaway": "MoE adapter 作为 plug-in 替换 dense adapter 的设计范式; gradient cosine similarity / influence score 作为诊断多任务优化冲突的分析工具", "limitation": "仅在 1.7B 小模型上验证; 仅做 understanding/reasoning,未扩展到生成任务; 无流式/延迟分析", "concepts": ["ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "Speech-LLMIntegrationTaxonomy", "SemanticvsAcousticTokens", "Audio-LanguagePretraining"], "source": "Sources/MoEAdapter.pdf", "github": "", "demo": ""}, {"name": "OV-InstructTTS", "title": "OV-InstructTTS: Towards Open-Vocabulary Instruct Text-to-Speech", "arxiv_id": "2601.01459", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "InstructTTS", "open-vocabulary", "reasoning", "LALM", "emotion", "paralinguistic", "dataset"], "summary": "提出 open-vocabulary InstructTTS 范式,通过 LALM reasoning chain 将高层叙事指令映射到情感/声学/副语言属性,再生成语音", "route": "开放词汇指令 + 文本 → LALM (Step-Audio-2-mini-Base) → <think> reasoning chain (情感标签+声学描述+副语言标签) → interleaved text+audio tokens → Flow Matching + HiFiGAN → 语音", "metrics": "Gemini Score 70.42 (best), MOS 4.28 (超越 GroundTruth 4.10), ICMOS 3.91 (best), CER 3.61%, SIM 0.722 [Table 2]", "takeaway": "(1) 从小说叙事上下文生成 open-vocabulary 指令的数据构造 pipeline; (2) reasoning chain 作为中间表示桥接高层指令与低层声学; (3) PC-PTI 两阶段方法插入副语言标签且几乎不破坏原始转录 (S-CER 0.35%)", "limitation": "仅基于有声书数据 (ContextSpeech, 476.8h),泛化到真实对话/播客场景未验证; 依赖 Step-Audio-2-mini-Base 预训练模型; 评估以 LLM-as-judge (Gemini) 为主,客观指标有限; 数据集和 demo 公开但模型权重未明确开源", "concepts": ["Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "EmotionControlinTTS", "LLM-basedTTS", "ConditionalFlowMatching"], "source": "Sources/OV-InstructTTS.pdf", "github": "", "demo": ""}, {"name": "PhonologicalTokenizer", "title": "Phonological Tokenizer: Prosody-Aware Phonetic Token via Multi-Objective Fine-Tuning with Differentiable K-Means", "arxiv_id": "2601.19781", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "discrete-token", "self-supervised-learning", "prosody", "disentanglement", "differentiable-k-means", "speechLM", "single-codebook"], "summary": "通过 differentiable k-means 对 SSL phonetic tokens 做 ASR + resynthesis 多目标微调, 获得保留语言+韵律信息但丢弃说话人身份的单码本 \"phonological\" token", "route": "WavLM-large (21st layer) → differentiable k-means (2000 centroids) → ASR head + HiFi-GAN vocoder (+ speaker embedding) 联合微调 → 推理时仅需 SSL + k-means", "metrics": "ER acc 51.7% (baseline WavLM 41.7%) [Table 2]; TIMIT VC UTMOS 3.88/SpkSim 0.762 (均 best) [Table 3]; speechLM GenPPL 5.60/UTMOS 3.86 (均 best) [Table 4]; ASR WER 4.6/8.5 (略降) [Table 2]", "takeaway": "loss weight alpha 连续调控 token 属性谱的思路; speaker embedding 条件化 vocoder 的被动解耦策略; 仅 44h 额外数据即可微调 SSL token 属性", "limitation": "仅在英语数据上验证; alpha 为固定超参数不可动态调整; 未与监督式 semantic tokens (CosyVoice S3) 或 continuous tokenizer 路线对比; SpeechLM 评估仅用 0.5B 小模型", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "Self-SupervisedSpeechRepresentation", "Single-codebookvsMulti-codebook", "SpeechFactorization", "SpeechLanguageModel", "ProsodyModeling"], "source": "Sources/PhonologicalTokenizer.pdf", "github": "", "demo": ""}, {"name": "Qwen3-ASR", "title": "Qwen3-ASR Technical Report", "arxiv_id": "2601.21337", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["ASR", "multilingual", "LALM", "forced-alignment", "speech-recognition", "language-identification", "streaming", "open-source"], "summary": "基于 Qwen3-Omni 基座的 all-in-one ASR 家族 (0.6B/1.7B) + 首个 LALM-based NAR forced aligner,覆盖 52 语言/方言、歌声识别、流式推理", "route": "音频 → Fbank 100Hz → AuT encoder (8x下采样, 12.5Hz) → Projector → Qwen3 LM → ASR 文本; ForcedAligner: 音频 + 带 [time] 槽的转录 → AuT + Qwen3 LM → timestamp prediction layer (NAR)", "metrics": "1.7B LibriSpeech clean/other 1.63/3.38 WER, WenetSpeech 4.97/5.88 CER [Table 3]; 0.6B TTFT 92ms, throughput 2000s/s@128并发 [Table 2]; ForcedAligner AAS 32.4ms (vs Monotonic-Aligner 141.3ms, NFA 101.2ms) on human-labeled [Table 9]", "takeaway": "(1) 四阶段训练范式 (AuT预训练→Omni预训练→ASR SFT→GSPO RL); (2) ForcedAligner 的 slot-filling 重构 + NAR 解码 + 动态槽插入训练策略; (3) ASR SFT 阶段不使用自然语言指令以防止 instruction injection", "limitation": "仅限 ASR 任务 (不支持 TTS/对话等生成); 30 语言 Fleurs 全集上略逊 Whisper-large-v3; ForcedAligner 训练依赖 MFA 伪标签; 内部 benchmark 不可复现", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "ModalityAdaptationforSpeechLLM", "LLM-enhancedASR"], "source": "Sources/Qwen3-ASR.pdf", "github": "", "demo": ""}, {"name": "Qwen3-TTS", "title": "Qwen3-TTS Technical Report", "arxiv_id": "2601.15621", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "streaming", "multilingual", "voice-cloning", "instruction-following", "speech-tokenizer", "codec"], "summary": "Qwen3-TTS 通过双 tokenizer(25Hz 单码本 + 12Hz 16 层 RVQ)+ dual-track LM 架构,在 5M 小时数据上训练,实现 10 语言流式 TTS,在多数 zero-shot/cross-lingual/controllability 指标上超越 CosyVoice 3 和 MiniMax-Speech(test-zh 上 CosyVoice 3 仍略优）", "route": "Text(Qwen tokenizer）+ Reference Speech（speaker encoder / in-context）→ Qwen3 LM（dual-track: text + acoustic token 沿 channel 拼接）→ Speech Tokens → Code2Wav（25Hz: chunk-wise DiT + BigVGAN; 12Hz: causal ConvNet）→ Waveform", "metrics": "WER 1.24%(test-en, SEED-TTS-Eval, 12Hz-1.7B, SOTA) [Table 5]; WER 0.77%(test-zh) [Table 5]; Speaker SIM 0.799(zh, 最高) [Table 6]; zh-to-ko WER 4.82(比 CosyVoice3 降 66%) [Table 7]; Voice Design APS 85.2(zh, 开源 SOTA) [Table 8]; 首包延迟 97ms(12Hz-0.6B) [Table 2]", "takeaway": "(1) 双 tokenizer 策略: 同一 LM backbone 适配不同延迟需求,25Hz 适合高质量, 12Hz 适合超低延迟; (2) MTP 模块处理 RVQ 多码本序列,比 delay pattern 和 NAR 更适合流式; (3) 概率性激活 thinking pattern 提升 instruction following; (4) DPO + GSPO 后训练改善自然度和鲁棒性", "limitation": "(1) 25Hz tokenizer 在长文本稳定性反而优于 12Hz,说明多码本路线在长上下文建模上仍有瓶颈 [Table 10]; (2) 论文未公开 DPO/GSPO 的具体 reward 设计和训练细节; (3) 仅报告 WER/SIM,未报告 MOS/PESQ 等感知指标; (4) 未与 F5-TTS/Seed-TTS 等非自回归方法在延迟-质量上做 fair comparison", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "Single-codebookvsMulti-codebook", "ResidualVectorQuantization", "LLM-basedTTS", "ConditionalFlowMatching", "SpeakerEmbedding", "Instruction-GuidedSpeechSynthesis", "TokenRateandBitrateTrade-offs"], "source": "Sources/Qwen3-TTS.pdf", "github": "", "demo": ""}, {"name": "ReStyle-TTS", "title": "ReStyle-TTS: Relative and Continuous Style Control for Zero-Shot Speech Synthesis", "arxiv_id": "2601.03632", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "style-control", "LoRA", "classifier-free-guidance", "flow-matching", "emotion", "prosody"], "summary": "首个在 zero-shot TTS 中实现连续且相对的多属性风格控制框架,通过 Decoupled CFG 解耦文本/参考引导 + Style LoRA + Orthogonal LoRA Fusion 正交融合 + Timbre Consistency Optimization 奖励加权训练,实现 pitch/energy/emotion 的独立连续调节且保持音色", "route": "文本 + 参考音频 → F5-TTS (flow matching) + DCFG (独立 lambda_t / lambda_a) → Style LoRA (per-attribute) + OLoRA fusion (正交投影消除干扰) → TCO (speaker similarity reward 加权 flow matching loss) → mel spectrogram → waveform", "metrics": "Contradictory-style emotion ACC best across all pairs [Table 2]; Pitch Low→High 90.2% / High→Low 92.8% (vs CosyVoice 74.9/76.9, EmoVoice 72.4/73.1) [Table 3]; Ablation: DCFG Attr Delta 51.2%, WER 2.31%, Spk-sv 0.79 (vs w/o DCFG 7.6%/2.67/0.85) [Table 4]; Seed-TTS test set", "takeaway": "(1) DCFG 将 CFG 中纠缠的 text/reference guidance 解耦为独立 lambda 的思路可迁移到任何 CFG-based 条件生成任务; (2) OLoRA 正交投影融合多 LoRA 的方法是图像生成中 multi-LoRA 技术到语音的成功迁移; (3) TCO 用 speaker similarity reward 做 advantage-weighted regression 训练,成本极低且不破坏 flow matching 稳定性", "limitation": "每增加新属性需训练新 LoRA(扩展性受限); 仅在 F5-TTS 和 CosyVoice 上验证; 无流式推理分析; 未开源代码(截至论文发表)", "concepts": ["Classifier-FreeGuidance", "ConditionalFlowMatching", "ProsodyModeling", "SpeakerEmbedding", "SpeechFactorization"], "source": "Sources/ReStyle-TTS.pdf", "github": "", "demo": ""}, {"name": "SPAM", "title": "SPAM: Style Prompt Adherence Metric", "arxiv_id": "2601.05554", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS-evaluation", "prompt-adherence", "contrastive-learning", "CLAP", "style-TTS", "metric", "SupCon"], "summary": "基于 CLAP 框架的 prompt adherence 自动评估指标,通过声学属性因子化 + SupCon 损失实现对 style prompt 的 plausible 且 faithful 评估", "route": "Speech(WavLM+X-Vector+G2P）→ cross-attention → 4 branch fusion（global+speed+energy+pitch）→ speech embedding **a** ←cosine sim→ **b** ← Llama-3.1 8B + FF → Style Prompt", "metrics": "LCC 0.58 / SRCC 0.58 / KTAU 0.41 (plausibility, MOS correlation, TextrolSpeech) [Table 1]; AR 0.862 / H1 rejected / H2 accepted (faithfulness, TextrolSpeech) [Table 1]", "takeaway": "(1) SupCon loss 替代 infoNCE 处理 style key 的 many-to-many 匹配; (2) 用 auxiliary prediction heads (variance predictor for speed, MLP for energy/pitch) 引导各分支学习对应属性; (3) 因子化评估思路可迁移到其他 audio-text alignment 场景", "limitation": "(1) 仅在英文数据集验证; (2) 因子化仅覆盖 pitch/speed/energy/speaker/transcript 五维度,缺少 emotion/breathing/pause 等细粒度副语言; (3) 未开源 (截至论文发布); (4) MOS 相关性为中等水平 (LCC ~0.58), 尚不足以完全替代人类评估", "concepts": ["SpeechFactorization", "Audio-LanguagePretraining", "ProsodyModeling", "SpeakerEmbedding"], "source": "Sources/SPAM.pdf", "github": "", "demo": ""}, {"name": "SonoEdit", "title": "SonoEdit: Null-Space Constrained Knowledge Editing for Pronunciation Correction in LLM-Based TTS", "arxiv_id": "2601.17086", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "pronunciation-correction", "knowledge-editing", "causal-tracing", "null-space", "model-editing", "LLM-TTS", "one-shot-editing"], "summary": "将 NLP 知识编辑 (ROME/AlphaEdit) 迁移到 TTS,通过 acoustic causal tracing 定位发音层 + null-space 投影约束权重更新,实现 one-shot 发音修正且不影响其他语音特性", "route": "错误发音词 → Acoustic Causal Tracing 定位 L15-21 → 提取 key/value → Null-Space Projection (SVD on LibriTTS) → Closed-form ΔW (AlphaEdit) → 更新 V/FFN 权重", "metrics": "Target-WER 86.4%→2.8%, Global-WER 3.15%(几乎无损), SIM 0.99, MOS 4.18; 人类发音评分 2.3→4.4 [Table 2, Table 3]", "takeaway": "(1) 用 causal tracing 定位 TTS 模型中特定语言学功能层的方法论; (2) null-space projection 作为 \"zero side-effect editing\" 的通用保障手段; (3) one-shot closed-form weight update 无需训练循环", "limitation": "依赖预计算 null-space(分布偏移会削弱正交性保证); 仅定位 coarse token 层面可能遗漏 fine-grained 子音素错误; 大批量编辑可能饱和 null-space; 不适用于全局系统性口音偏差", "concepts": ["LLM-basedTTS", "PhonemeRepresentation", "SpeakerEmbedding", "CodecLanguageModel", "SpeechTokenizer"], "source": "Sources/SonoEdit.pdf", "github": "", "demo": ""}, {"name": "StreamingASR", "title": "Streaming Speech Recognition with Decoder-Only Large Language Models and Latency Optimization", "arxiv_id": "2601.22779", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["ASR", "streaming", "LLM", "decoder-only", "MoChA", "latency-optimization", "LoRA", "Conformer"], "summary": "用 MoChA 作为 read/write policy network 自适应分割语音流,使 decoder-only LLM 能以交错序列方式进行 streaming ASR,并通过 minLT loss 大幅降低延迟", "route": "语音 → Conformer chunked encoder → FFN adaptor → MoChA policy network 动态分割 → 语音段与文本 token 交错 → Qwen 2.5-1.5B (LoRA) → 转写", "metrics": "AISHELL-1 CER 5.1% (streaming) / 4.9% (non-streaming) [Table 1]; AISHELL-2 CER 5.5% / 5.0% [Table 2]; minLT 使平均延迟从 16 帧降至 6 帧 (62.5% reduction),CER 仅从 5.4% 升至 5.5% [Table 4]", "takeaway": "(1) MoChA 的 stop-and-decode 机制可迁移至其他需要动态 speech-text 对齐的场景(如 streaming speech translation); (2) streaming/non-streaming 共享参数联合训练简化系统开发; (3) minLT loss 作为可插拔的延迟正则项", "limitation": "仅在 Mandarin 数据上验证; LLM 仅用 1.5B 参数; 依赖 HMM forced alignment 生成 minLT 的 gold boundary; 未报告实际 RTF 或端到端延迟(仅报告 token-level 帧延迟)", "concepts": ["Speech-TextAlignment", "ModalityAdaptationforSpeechLLM", "StreamingSpokenDialogue", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/StreamingASR.pdf", "github": "", "demo": ""}, {"name": "T-Mimi", "title": "T-Mimi: A Transformer-Based Mimi Decoder for Real-Time On-Phone TTS", "arxiv_id": "2601.20094", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-codec", "on-device", "quantization", "transformer", "streaming-TTS", "latency-optimization", "neural-vocoder"], "summary": "将 Mimi codec 的卷积 decoder 替换为纯 Transformer decoder (受 TS3-Codec 启发),在手机端将 TTS 解码延迟从 42.1ms 降至 4.4ms (9.6x),同时通过选择性量化将存储从 163.2MB 降至 68.7MB [§1, Table 3]", "route": "Mimi encoder (frozen) → 12.5Hz codec features → 12-layer Transformer decoder (8 原始 + 4 新增, fixed-window streaming self-attention) → 2 Linear layers (upsampling) → 24kHz waveform [§3.1, Fig 1]", "metrics": "CMOS winrate +2.32% vs Mimi-FT (95% CI 含0, on-par) [Table 1]; QAT PESQ 3.16 vs FP32 3.21, STOI 0.98 [§4.2.2]; 存储 68.7MB (vs 163.2MB FP32) [Table 3]; 延迟 4.4ms/80ms-chunk (vs 42.1ms) on Samsung S22 [Table 3]", "takeaway": "(1) Transformer + Linear 替代 de-convolution 做波形上采样,对移动端推理框架 (XNNPACK) 更友好; (2) \"越靠近波形的层越不能量化\"——选择性混合精度 QAT 策略; (3) 10% silence padding 数据增强消除静音段噪声", "limitation": "仅替换 decoder,encoder 未改动; 无公开代码; 训练数据 5M 小时为内部数据; 仅在 Samsung Galaxy S22 上测试; 人类评估仅 CMOS (无 MUSHRA/MOS); QAT 后 PESQ 仍有 0.05 差距", "concepts": ["SpeechTokenizer", "CodecTrainingObjectives", "Multi-scaleSTFTDiscriminator", "NeuralVocoder", "SemanticvsAcousticTokens", "TokenRateandBitrateTrade-offs"], "source": "Sources/T-Mimi.pdf", "github": "", "demo": ""}, {"name": "TARS", "title": "TARS: Closing the Modality Reasoning Gap for Speech Large Language Models", "arxiv_id": "2601.05543", "date": "2026-01", "venue": "ACL 2026", "org": "", "tier": "deep", "tags": ["speech-LM", "reasoning", "reinforcement-learning", "modality-alignment", "GRPO", "trajectory-alignment", "representation-drift"], "summary": "提出 on-policy RL 框架,通过 layer-wise representation alignment + output-level behavior alignment 两个 dense reward 信号,在 GRPO 训练中将 Speech LLM 的语音推理轨迹对齐到文本推理轨迹,实现 7B 模型 SOTA 的跨模态推理恢复率 (MRR ~100%) [§1, §3]", "route": "speech/text input → Speech LLM (frozen encoder + LoRA on LLM) → GRPO 生成 G=8 completions (4 speech + 4 text) → 非对称 reward: text 用 R_base, speech 用 R_base + R_rep + R_beh → modality-specific normalization → DAPO loss update [§3, Fig 1]", "metrics": "Qwen2.5-Omni: avg audio 76.84%, MRR 98.89% (vs base 71.30%/91.76%); Phi-4-MM: avg audio 79.80%, MRR 100.45% (vs base 63.23%/79.59%); 超越 cascaded ASR+LLM baselines; WER 不变 (~4.2%) [Table 1, Table 2]", "takeaway": "(1) 用文本模态的 on-policy completion 作为 moving reference 而非 static teacher,随训练共同进化 [§3.2]; (2) modality-specific normalization 解决混合模态 GRPO 中弱模态被持续压制的问题 [§3.3]; (3) 即使 accuracy reward 全零 (语音推理太难),alignment reward 仍提供有效梯度 [§3.3]; (4) layer-wise representation reward 的 middle layers (11-20) 最关键,但全层最优 [§5.2, Fig 3]", "limitation": "仅评估 7B 规模 [Limitations]; 仅单轮推理,未验证多轮对话 [Limitations]; 依赖 text-only reference,无法对齐文本中无对应的副语言信息 [Limitations]; 仅 TTS 合成训练数据,real speech 仅在评估中验证 [§4.1]", "concepts": ["SpeechLanguageModel", "Speech-TextAlignment", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding"], "source": "Sources/TARS.pdf", "github": "", "demo": ""}, {"name": "TED-TTS", "title": "TED-TTS: Training-Free Intra-Utterance Emotion and Duration Control for Text-to-Speech Synthesis", "arxiv_id": "2601.03170", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "duration-control", "training-free", "inference-time", "zero-shot", "autoregressive", "controllable-TTS"], "summary": "首个 training-free 框架,在预训练自回归 zero-shot TTS 上实现 intra-utterance 多段情感切换和时长控制,通过 2D causal attention mask + 单调流对齐(MSA)隔离 segment 条件并追踪对齐,通过 duration embedding steering + EOS logit 调制实现局部时长控制", "route": "文本分段 + 每段 emotion/duration spec → LLM (Qwen3-8B fine-tuned) 自动 prompt → IndexTTS2 T2S 模块 + 2D causal mask + MSA 对齐 → segment-aware emotion conditioning + duration steering → semantic tokens → waveform", "metrics": "SMOS 4.00-4.22 / NMOS 4.07-4.22 (EN, SOTA) [Table 1, 2]; Duration error 3.21-3.39% (全设置, vs baseline 5.78-12.03%) [Table 4]; RTF < 1.0 (40% overhead vs baseline) [Fig 6]", "takeaway": "2D causal attention mask 实现 segment-local conditioning 的思路可迁移到任何需要 intra-sequence 条件切换的 AR 生成任务; MSA 的 Bayesian 对齐追踪是在线 text-semantic alignment 的通用方案", "limitation": "不建模 segment 间的渐进情感过渡(仅 segment-wise 切换); duration 精度受限于预训练模型的 duration embedding 表示能力; 仅在 IndexTTS2 上验证,跨模型泛化性未证明; 代码开源但 MED-TTS 数据集未见公开", "concepts": ["EmotionControlinTTS", "ProsodyModeling"], "source": "Sources/TED-TTS.pdf", "github": "", "demo": ""}, {"name": "Training-freeSpeakerUnlearning", "title": "Erasing Your Voice Before It's Heard: Training-free Speaker Unlearning for Zero-Shot Text-to-Speech", "arxiv_id": "2601.20481", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["machine-unlearning", "voice-privacy", "zero-shot-TTS", "speaker-identity", "activation-steering", "training-free", "inference-time", "DiT"], "summary": "首个 training-free 的 ZS-TTS speaker unlearning 框架,通过在推理时动态 steering DiT 隐层激活中的 identity 方向来抑制 opt-out speaker 的声音合成,同时保持语音内容和情感属性", "route": "opt-out speaker 参考语音 + retain speaker 池(N=30) → 预计算 ID-prototype (各 DiT block 的 FFN 输出均值) → 推理时逐 step 计算 steering vector (opt-out 激活 - ID-prototype 的归一化差) → 动态选择 cos sim < tau 的 layer-step 组合 → 减去 identity 方向投影 → ODE solver + vocoder → unlearned 语音", "metrics": "SIM-SO 0.477 vs TGU 0.510 (更低=更好的 unlearning) [Table 1]; WER-SO 3.25 vs TGU 4.03 [Table 1]; SIM-UO 0.488 (unseen, TGU 无法处理) [Table 2]; SIM-Emo 0.723 vs F5-TTS 0.732 (情感几乎不损) [Table 3]; 训练时间 0h vs TGU 430h [Table 1]", "takeaway": "(1) \"ID-prototype + dynamic threshold\" 的两阶段 intervention selection 思路 -- 先用全局统计 (mu+k*sigma) 选 layer,再用 layer 内均值选 step,实现稀疏且自适应的干预; (2) 用 FFN 输出而非 attention 输出做 steering,因为 FFN 做了非线性通道混合后包含更强的 timbre/identity 信号 [§2.2]; (3) steering vector 的 L2 归一化确保方向纯净、强度由 alpha 单独控制", "limitation": "仅在 F5-TTS (DiT-based flow matching) 上验证,未测试 AR 架构; unseen opt-out 的 WER 上升明显 (UO: 2.03→3.26),seen opt-out WER 略有改善 (SO: 3.36→3.25); alpha=1.2 和 k=1 (对应 mu+sigma) 为经验值,缺乏理论指导; 未讨论声音相似 speaker 的误伤风险", "concepts": ["ConditionalFlowMatching", "SpeakerEmbedding", "SpeakerVerification", "Anti-spoofingandDeepfakeDetection", "VoiceCloningTaxonomy"], "source": "Sources/Training-freeSpeakerUnlearning.pdf", "github": "", "demo": ""}, {"name": "TruS", "title": "Erasing Your Voice Before It's Heard: Training-Free Speaker Unlearning for Zero-Shot Text-to-Speech", "arxiv_id": "2601.20481", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["machine-unlearning", "voice-privacy", "zero-shot-TTS", "speaker-identity", "activation-steering", "training-free", "flow-matching", "DiT"], "summary": "首个 training-free 推理时 speaker unlearning 框架 -- 通过构造 ID-prototype 并在 DiT FFN 激活值上动态施加 steering vector,使 F5-TTS 在推理时即时阻止特定说话人声音的合成,同时保持 retain speakers 的质量不变", "route": "N=30 个 retain speaker 语音 → F5-TTS DiT 各层 FFN 激活 → 平均得 ID-prototype P_Ret → opt-out speaker 激活 X_Opt 与 P_Ret 做差 → L2 归一化得 steering vector S → 逐层逐步 cosine similarity 动态选择干预点(τ = µ + kσ) → 投影减法消除身份分量 → ODE solver + vocoder → unlearned 语音", "metrics": "SIM-SO 0.477 (F5-TTS 原始 0.657, 降 27%) / WER-SO 3.25 (vs TGU 4.03, SGU 3.70) / SIM-UO 0.488 (F5-TTS 0.668, 降 27%) / SIM-Emo 0.723 (vs F5-TTS 0.732, 仅降 1.2%) / 0 training hours (vs TGU 430h, SGU 48h) [Table 1-3]", "takeaway": "(1) ID-prototype + 投影减法的身份消除策略可迁移到 voice conversion 的 speaker disentanglement; (2) 动态层+步选择机制(µ+kσ 阈值)比 EmoSteer-TTS 的固定 top-k 更灵活,可用于其他 activation steering 任务; (3) 仅需单条 opt-out 语音的 one-shot 设计极大降低了部署门槛", "limitation": "仅在 F5-TTS 上验证,未测试 AR/LLM-based TTS; 身份抑制不如重训练的 SGU 彻底(SIM-SO 0.477 vs 0.106); 未讨论恢复攻击/对抗攻击的鲁棒性; 未讨论相似声音的误伤; 代码已公布但未有大规模部署验证", "concepts": ["ConditionalFlowMatching", "SpeakerEmbedding", "SpeakerVerification", "Anti-spoofingandDeepfakeDetection", "EmotionControlinTTS"], "source": "Sources/TruS.pdf", "github": "", "demo": ""}, {"name": "VibeVoice-ASR", "title": "VibeVoice-ASR Technical Report", "arxiv_id": "2601.18184", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["ASR", "long-form", "multi-speaker", "speaker-diarization", "timestamping", "LLM-ASR", "end-to-end", "multilingual"], "summary": "复用 VibeVoice TTS 的 dual tokenizer (7.5 Hz, 3200x 压缩) + Qwen2.5 LLM,将 ASR + Speaker Diarization + Timestamping 统一为单次前向的 Rich Transcription 生成任务,支持 60 分钟长音频和 50+ 语言", "route": "60-min Audio → [Acoustic Tokenizer (sigma-VAE encoder) + Semantic Tokenizer (encoder)] → ~27K continuous latent tokens + Optional Context Prompt → Qwen 2.5 LLM (decoder-only, autoregressive) → Rich Transcription stream (Speaker ID + Timestamps + Content)", "metrics": "AISHELL-4 DER 6.77 (vs Gemini-2.5-Pro 15.32, Gemini-3-Pro 22.03) [Table 2]; AMI-IHM tcpWER 20.82 (vs 38.35, 63.65) [Table 2]; MLC avg DER 3.42 [Table 2]; 11/16 settings best cpWER, 8/16 best WER [§3]", "takeaway": "1) TTS tokenizer 反向复用于 ASR — 同一 encoder 同时服务生成和理解; 2) Rich Transcription 格式将 ASR/diarization/timestamping 统一为序列生成; 3) 合成数据闭环 (GPT-5 生成 script → VibeVoice TTS 合成音频 → 用于训练 ASR); 4) prompt-based context injection 提升领域术语准确率", "limitation": "SFT 偏重中英文导致多语言遗忘; 不处理重叠语音 (cocktail party problem); 仅与 Gemini 对比,缺少与 Whisper/专用长音频 ASR 系统的直接比较", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "AudioUnderstanding", "ModalityAdaptationforSpeechLLM"], "source": "Sources/VibeVoice-ASR.pdf", "github": "", "demo": ""}, {"name": "VoiceSculptor", "title": "VoiceSculptor: Your Voice, Designed By You", "arxiv_id": "2601.10629", "date": "2026-01", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "instruction-following", "voice-design", "voice-cloning", "controllable", "CoT", "RAG", "open-source"], "summary": "开源 instruction-following voice design 系统,通过 CoT 属性推理 + RAG 指令增强 + voice design/clone 解耦架构,实现自然语言驱动的细粒度语音属性控制,开源 SOTA on InstructTTSEval-Zh", "route": "NL instruction → (RAG 检索相似指令) → LLaSA-3B (CoT 属性推理 → speech attribute tokens → XCodec2 audio tokens) → prompt waveform → CosyVoice2-0.5B (voice clone: Flow Matching + HiFi-GAN) → target speech", "metrics": "InstructTTSEval-Zh: APS 75.7%, DSD 64.7%, RP 61.5%, AVG 67.6% (开源 SOTA); IMOS 3.67; vs MiMo-Audio 7B AVG 64.5%, vs VoxInstruct AVG 47.5%; 低于 Gemini 2.5 Pro AVG 84.8% [Table 1]", "takeaway": "(1) CoT 属性分解: 将 NL 指令通过 chain-of-thought 显式映射到结构化属性 token,可迁移到任何需要精细控制的条件生成任务; (2) voice design/clone 解耦: 属性控制和高保真合成分到两个专门模块,各自优化; (3) 属性 token dropout (p=0.2) 防止对显式控制信号的过拟合", "limitation": "主要评估中文; 与 Gemini 差距仍大 (AVG 67.6 vs 84.8); 重度依赖 RAG (去掉 RAG AVG 下降 8.2%); 老人/儿童声音效果差; 重复合成稳定性不足", "concepts": ["Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "LLM-basedTTS", "SpeakerEmbedding"], "source": "Sources/VoiceSculptor.pdf", "github": "", "demo": ""}, {"name": "VoxPrivacy", "title": "VoxPrivacy: A Benchmark for Evaluating Interactional Privacy of Speech Language Models", "arxiv_id": "2601.19956", "date": "2026-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-LM", "benchmark", "privacy", "multi-speaker", "speaker-verification", "evaluation", "safety", "interactional-privacy"], "summary": "提出 VoxPrivacy,首个评估 SLM 在多说话人共享环境中保护上下文敏感信息能力的三层 benchmark,揭示开源模型在条件隐私判断上接近随机猜测", "route": "LLM 生成隐私声明 → 多阶段预处理 → 三层对话组装 (直接指令/说话人验证/主动保护) → CosyVoice2 合成 32 小时双语音频 → 9 个 SLM 评估 + LLM-as-judge", "metrics": "开源 SLM Tier 2/3 accuracy ~50% (随机猜测); fine-tuned Kimi-Audio Tier 2 EN accuracy 83.93%, F1 82.65%; Spoofing Attack 导致最大性能下降 (-6.41%) [Table 3, Table 6]", "takeaway": "(1) 三层递进 benchmark 设计范式 (指令遵循 → 条件推理 → 自主推断); (2) 混合任务 fine-tuning (30% 通用 + 70% 隐私) 有效避免灾难性遗忘; (3) Speaker Continuity Bias 概念 -- 开源 SLM 在说话人切换时错误率不成比例地上升", "limitation": "完全基于合成数据 (CosyVoice2 TTS); 仅覆盖异步对话场景 (不含实时多人同时说话); 仅测试英语和中文; 依赖 SFT 而非 RL 训练; Real-VoxPrivacy 仅 586 条验证,规模有限", "concepts": ["SpeechLanguageModel", "SpeakerVerification", "SpokenDialogueEvaluation", "AudioUnderstanding", "Anti-spoofingandDeepfakeDetection", "SpeakerEmbedding"], "source": "Sources/VoxPrivacy.pdf", "github": "", "demo": ""}, {"name": "EmotionThinker", "title": "EmotionThinker", "arxiv_id": "", "date": "2026", "venue": "ICLR 2026 (under review)", "org": "", "tier": "deep", "tags": ["speech-emotion-recognition", "SER", "reinforcement-learning", "GRPO", "reasoning", "prosody", "SpeechLLM", "chain-of-thought"], "summary": "首个将 RL (GRPO) 应用于语音情感推理的框架,通过 prosody-centric SFT + Progressive Trust-aware Reasoning Reward (GRPO-PTR) 使 SpeechLLM 输出可解释的情感判断", "route": "Speech → Audio Encoder → Qwen2.5-Omni-7B (SpeechLLM) → \\<think\\>CoT reasoning\\</think\\> → \\<answer\\>emotion label\\</answer\\>; 训练: EmotionCoT-35K → Prosody SFT → GRPO-PTR", "metrics": "SER Avg Acc 68.89% (vs 2nd-best 65.41% BLSP-Emo); Reasoning Avg 3.98/5 (vs 2nd-best 3.5 Qwen2.5-Omni); 在 IEMOCAP 77.68%, MELD 59.71%, RAVDESS 71.56%, SAVEE 73.96% [Table 2]", "takeaway": "(1) GRPO-PTR: progressive reward scheduling + trustworthiness weight tau 防止 reward hacking (2) EmotionCoT-35K 数据构建 pipeline (自动韵律标注 + GPT-4o CoT 生成) (3) Prosody-centric SFT 作为 RL 冷启动", "limitation": "匿名投稿, 代码/数据未开源; 依赖 Qwen2.5-Omni-7B 底座; EmotionCoT-35K 数据质量依赖 GPT-4o 生成; 仅评估英文情感; RL 训练不稳定性需仔细调参", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "SpeechLanguageModel", "AudioUnderstanding", "DifferentiableRewardOptimization"], "source": "Sources/EmotionThinker.pdf", "github": "", "demo": ""}, {"name": "FlexiCodec", "title": "FlexiCodec: A Dynamic Neural Audio Codec for Low Frame Rates", "arxiv_id": "", "date": "2026", "venue": "Under review at ICLR 2026", "org": "", "tier": "deep", "tags": ["audio-codec", "low-frame-rate", "dynamic-frame-rate", "ASR-feature", "dual-stream", "FSQ", "speech-tokenizer", "token-merging"], "summary": "首个将 audio codec 帧率推至 3-12.5Hz 的动态帧率 codec, 通过 ASR 特征引导的 frame merging 自适应分配时间分辨率, 在超低帧率下仍保持强语义保留 [论文原文]", "route": "Speech (16kHz) → Dual-stream Encoding (ASR Encoder 12.5Hz + Codec Encoder 12.5Hz) → Frame Merging (cosine sim > τ 合并相似帧) → FSQ (semantic stream, D=5, L=8, 32768 entries) + RVQ (acoustic stream, 24层, 4096 entries) → Frame Unmerging (Transformer + local attention 恢复 12.5Hz) → Codec Decoder → Reconstructed Speech [§3, Fig.1]", "metrics": "6.25Hz avg: WER(RVQ1) 4.15% vs DAC 22.6% vs DualCodec 31.5% [Fig.3a]; 8.3Hz: WER 2.98% vs DAC 8.5%; PESQ@8.3Hz 3.03 vs DAC 2.76; UTMOS@8.3Hz 4.21 vs DAC 3.94 [Fig.3]; 与 50Hz+ baselines 对比: FlexiCodec@6.25Hz WER 4.15 优于 SpeechTokenizer-50Hz WER 5.56, Encodec-75Hz WER 5.90 [Table 5]", "takeaway": "(1) ASR cosine similarity 引导的 frame merging — 按语义复杂度自适应分配帧率, Pearson r=0.775 与 phoneme rate 相关 [Fig.4]; (2) 训练时 τ 从 [0.7, 1.0] 随机采样, 推理时调 τ 实现连续可控帧率 [§3]; (3) interleaved sequence + local attention transformer 处理 merged 帧上下文 [Fig.2a]", "limitation": "仅在 LibriLight-Large (54K hrs English audiobook) 训练, 多语言需微调 [Appendix F]; 代码将在 review 后开源; NAR 阶段仍需 12.5Hz 固定帧率解码 [footnote 2]", "concepts": ["ResidualVectorQuantization", "SpeechTokenizer", "SemanticvsAcousticTokens", "ConditionalFlowMatching", "Multi-scaleSTFTDiscriminator", "QuantizerDropout", "FiniteScalarQuantization", "TokenRateandBitrateTrade-offs"], "source": "Sources/FlexiCodec.pdf", "github": "", "demo": ""}, {"name": "STITCH", "title": "STITCH: Simultaneous Thinking and Talking with Chunked Reasoning for Spoken Language Models", "arxiv_id": "", "date": "2026", "venue": "ICLR 2026", "org": "", "tier": "deep", "tags": ["speech-LM", "reasoning", "chain-of-thought", "interleaved-generation", "latency", "spoken-dialogue", "math-QA"], "summary": "首次为 interleaved SLM 引入 unspoken chain-of-thought reasoning,通过交替生成 reasoning chunks 与 text-speech chunks 实现\"边想边说\",在不增加延迟的前提下将数学推理准确率提升 15%+ [§1]", "route": "speech input → SLM (GLM-4-Voice-9B) → [SOPR] reasoning tokens [EOPR] + text tokens + speech tokens → speech decoder → audio output; reasoning/text/speech 三种 token 交替生成,reasoning 在 audio 播放间隙生成 [§3.2, Fig 1]", "metrics": "STITCH-R 数学 QA 平均 78.70% (vs no-reasoning 62.98%, TBS 79.12%),延迟仅 N_reason+N_text+N_speech 而非 N_full [Table 1a]; STITCH-S 78.04% 且延迟 = N_text+N_speech (与无推理基线完全相同) [Table 1a]; 非推理任务平均 55.97-57.03%,不降低 [Table 1b]; UTMOSv2 > 3.10, GPT-4o fluency > 4.66 [Table 2]", "takeaway": "(1) 利用 audio 播放的空闲 GPU 时间生成 reasoning tokens,零额外延迟 [§3.2, Fig 1]; (2) 推理 chunk 长度 N_token 可在推理时调节 (60-100),无需重训 [§7]; (3) 可接入外部更强推理模型 (reasoning augmentation model) 替换自身推理 [§8]", "limitation": "仅验证数学 QA 场景 [§4.2]; 基于 GLM-4-Voice 单一 SLM,未与其他 SLM 对比 [§4.3]; LoRA 微调失败,需全量微调 [Appendix F]; 仅数学数据微调会导致过拟合 [Appendix F]", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "StreamingSpokenDialogue"], "source": "Sources/STITCH.pdf", "github": "", "demo": ""}, {"name": "SpeechWorldModel", "title": "SpeechWorldModel", "arxiv_id": "", "date": "2026", "venue": "ICLR 2026 (under review)", "org": "", "tier": "deep", "tags": ["speech-understanding", "causal-graph", "world-model", "reasoning", "emotion-recognition", "speech-act", "theory-of-mind", "SLM"], "summary": "首个基于因果图的模块化语音理解模型，将语音理解分解为 4 个认知模块 (WMA→ToM→SA→Prag) 构成 DAG，显式推理链引导 LLM 生成，在情感识别上超越 Gemini 2.5 Pro", "route": "speech → WavLM (acoustic) + DistilBERT (text) + openSMILE (prosody) → Fusion → Causal Graph (4 nodes) → Explicit Reasoning Chain → LLaMA/Qwen2-Audio IT → Response", "metrics": "Overall M.J. Score 7.81 (LLaMA) / 7.59 (Qwen2-Audio), 超越 Gemini 2.5 Pro (8.12) 的训练成本的 1/50+, Emotion Accuracy 97.80% (ours) vs 82.47% (Gemini) [Table 3]", "takeaway": "(1) 因果图结构化语音理解 (稀疏梯度 + 5x 训练加速); (2) 半监督图训练 (缺失标签时通过链式梯度学习); (3) 认知科学启发的模块设计", "limitation": "仅 4 模块 (简化); 因果图结构预定义 (非自适应学习); 依赖 label generation pipeline; ICLR 2026 在审", "concepts": ["SpeechLanguageModel", "AudioUnderstanding", "ProsodyModeling", "EmotionControlinTTS"], "source": "", "github": "", "demo": ""}, {"name": "StableToken", "title": "StableToken: A Noise-Robust Semantic Speech Tokenizer for Resilient SpeechLLMs", "arxiv_id": "", "date": "2026", "venue": "Under review at ICLR 2026", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "noise-robustness", "voting-LFQ", "consensus-training", "SpeechLLM", "token-stability", "multi-branch-quantization"], "summary": "首个系统性解决 semantic speech tokenizer 噪声脆弱性的工作, 通过 Voting-LFQ (多分支 bit-wise majority vote 量化) + Noise-Aware Consensus Training 将 token 稳定性 (UED) 降低 >60% 相对, 同时保持 SOTA 重建质量和下游 SpeechLLM 性能 [论文原文]", "route": "Speech (16kHz) → Whisper-large-v3 Encoder (frozen bottom, trainable top) → Average Pooling (25Hz) → n=5 parallel linear projections (d=13 dims each) → Sign binarization → Bit-wise majority vote → Token index (0 to 2^13-1 = 8192) → Text Decoder (CTC loss); Training: majority branches get clean input (H_clean), minority branches get perturbed input (H_perturbed) → Consensus Loss [§2, Fig.2]", "metrics": "UED avg 10.17% (vs CosyVoice2 38.66%, GLM-4-Voice 28.62%, S^3 Tokenizer 33.09%) [Table 1]; WER: LS-clean 3.84 / LS-other 7.99 / SEED-en 3.44 / SEED-zh 2.62 (均为 SOTA 或 competitive) [Table 2]; 下游 ASR: CHiME-4 real 35.90% / sim 30.61% WER (vs CosyVoice 54.63% / 47.71%) [Table 3]; 下游 TTS: SEED-TTS WER 3.02% / MOS 4.08 ZH [Table 3]", "takeaway": "(1) Voting-LFQ 多分支 bit-level voting — 低开销的量化鲁棒化方案, 可迁移到任何 LFQ/FSQ tokenizer; (2) Noise-Aware Consensus Training — 通过 clean majority + perturbed minority 的 multi-view 训练 + consensus loss 显式学习噪声不变性; (3) Token stability (UED) 作为 tokenizer 评估新维度", "limitation": "仅关注 semantic tokenizer (无 acoustic reconstruction); vocab 8192 比 CosyVoice2 (4096) 大, 使 token-level invariance 更难维持 (但仍 SOTA); 推理时所有 n 分支都用 clean input [§2.2]; 代码未开源", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "SpeechLanguageModel", "ResidualVectorQuantization", "Self-SupervisedSpeechRepresentation", "FiniteScalarQuantization"], "source": "Sources/StableToken.pdf", "github": "", "demo": ""}, {"name": "TTSDS2", "title": "TTSDS2", "arxiv_id": "", "date": "2026", "venue": "ICLR 2026 (under review)", "org": "", "tier": "deep", "tags": ["TTS-evaluation", "benchmark", "distributional-metrics", "Wasserstein-distance", "multilingual", "objective-metrics", "MOS-correlation"], "summary": "首个在 20 个 TTS 系统 x 4 域 x 14 语言上全面验证的分布式客观评估指标，平均 Spearman ρ≈0.67，是唯一在所有条件下 ρ>0.5 的指标", "route": "TTS 合成音频 → 5 因子 (Generic/Speaker/Prosody/Intelligibility) x 多特征 → Wasserstein-2 距离 vs 真实分布 → 归一化分数 (0-100)", "metrics": "平均 Spearman ρ=0.67 across MOS/CMOS/SMOS x 4 domains; 11,282 人工 MOS ratings; 14 语言 benchmark; 20 TTS 系统排名 [Table 2, 3]", "takeaway": "(1) 分布级评估代替样本级评估的范式; (2) 因子化多维评估 (而非单一分数); (3) 可复现的自动化 benchmark pipeline", "limitation": "需 50-100 样本才能计算; 不适合评估单个样本; 多语言 MOS 人工验证缺失; ICLR 2026 在审", "concepts": ["TTSEvaluation", "Self-SupervisedSpeechRepresentation", "ProsodyModeling", "SpeakerEmbedding"], "source": "", "github": "", "demo": ""}, {"name": "Aliasing-FreeSynthesis", "title": "Aliasing-Free Neural Audio Synthesis", "arxiv_id": "2512.20211", "date": "2025-12", "venue": "IEEE/ACM TASLP (submitted)", "org": "", "tier": "deep", "tags": ["vocoder", "neural-codec", "anti-aliasing", "GAN-based", "DDSP", "waveform-generation", "singing-voice", "audio-synthesis"], "summary": "从信号处理角度系统解决 neural vocoder/codec 中激活函数和上采样层的 aliasing 问题,提出 ADAA SnakeBeta + resampling upsampling;vocoder 在歌声/音乐上显著超越 BigVGAN,codec 以更少参数(119M vs 154M)与 DAC 持平或略优", "route": "Mel/Waveform → Encoder → RVQ(codec)/直接输入(vocoder) → Decoder(AF Conv Blocks: ADAA SnakeBeta activation + resampling upsampling + deterministic noise prior) → Waveform", "metrics": "歌声 MUSHRA: Pupu-Vocoder_large 70.84 vs BigVGAN_large 53.08 [Table II]; 音乐 MUSHRA: 56.42 vs 50.42 [Table III]; AHR activation -45.95 dB vs LeakyReLU -25.25 dB [Table I]", "takeaway": "ADAA 技术可迁移到任何使用非线性激活的上采样网络; deterministic noise prior 解决重采样训练不稳定; SnakeBeta 的 closed-form ADAA 消除 threshold fallback", "limitation": "CPU RTF 较高(oversampling 的 DDSP 计算); 极低比特率 codec 性能收敛; 音乐合成整体质量仍有提升空间", "concepts": ["NeuralVocoder", "SnakeActivation", "Multi-scaleSTFTDiscriminator", "ResidualVectorQuantization"], "source": "Sources/2512.20211.pdf", "github": "", "demo": ""}, {"name": "DMP-TTS", "title": "DMP-TTS: Disentangled Multi-Modal Prompting for Controllable Text-to-Speech with Chained Guidance", "arxiv_id": "2512.09504", "date": "2025-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "controllable", "style-timbre-disentanglement", "multi-modal-prompting", "classifier-free-guidance", "flow-matching", "DiT", "CLAP"], "summary": "DiT-based 可控 TTS 框架,通过 CLAP-based 多模态风格编码器 (Style-CLAP) 和分层链式 classifier-free guidance (cCFG) 实现 content/timbre/style 的独立连续控制", "route": "Text → Text Encoder + Duration Predictor → phoneme-level alignment; Style (audio/text) → Style-CLAP → style embedding; Speaker audio → CAM++ Speaker Encoder → timbre embedding; 三条件 → DiT (CFM) → mel latent → BigVGAN → waveform", "metrics": "情感准确率 0.64 (text) / 0.55 (audio), 能量准确率 0.85/0.82, 语速准确率 0.73/0.74; NMOS 3.82 (audio prompt, 接近 GT 3.86); 说话人相似度 0.71-0.72 (低于 CosyVoice2 0.80); WER 0.038/0.043; 内部 300h 中文数据集 [Table 1]", "takeaway": "(1) cCFG 分层 condition dropout 训练 + chained guidance 推理,可迁移到任何多条件扩散模型; (2) Style-CLAP 对比学习 + 多任务监督对齐 audio/text 风格空间; (3) REPA 用 Whisper 特征引导 DiT 中间层加速收敛", "limitation": "仅 300h 中文数据训练 (vs baselines 100k+h); speaker similarity 显著落后大规模预训练系统; 未开源 (截至 2025.12); 数据集内部不公开", "concepts": ["Classifier-FreeGuidance", "ConditionalFlowMatching", "StyleTransferinTTS", "SpeechFactorization", "SpeakerEmbedding", "ProsodyModeling"], "source": "Sources/DMP-TTS.pdf", "github": "", "demo": ""}, {"name": "DisCo-Speech", "title": "DisCo-Speech: Controllable Zero-Shot Speech Generation with A Disentangled Speech Codec", "arxiv_id": "2512.13251", "date": "2025-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "disentanglement", "speech-codec", "prosody-control", "voice-cloning", "FSQ", "GRL"], "summary": "提出 DisCodec(解耦语音编解码器)+ 标准 AR LM 的零样本可控语音生成框架,在 codec 层面解决 content/prosody/timbre 纠缠问题", "route": "语音 → 三并行编码器(content/prosody/timbre) → FSQ 量化 → content+prosody 融合为统一 token → AR LM 预测 → DisCodec decoder + timbre 注入 → 波形", "metrics": "Codec 50 tok/s: UTMOS 4.10, SSIM 0.81, WER 2.92% [Table 1]; VC: SSIM 0.61, F0cor 0.59 最优 [Table 2]; AB test vs Vevo: Style prosody 48.9% 偏好 [Table 3]; 克隆 SSIM 0.597 EN / 0.677 ZH [Table 4]", "takeaway": "(1) Soft orthogonality constraint 作为解耦强度的连续可调工具; (2) Residual FSQ 层次化建模 F0+非 pitch 韵律; (3) Stage 2 fusion 将多流 token 合并为单流供标准 LM 使用的设计模式", "limitation": "Speaker similarity 低于多阶段系统(如 CosyVoice 2); 高度夸张韵律不稳定; 代码权重尚未公开", "concepts": ["SpeechFactorization", "CodecLanguageModel", "FiniteScalarQuantization", "GradientReversalLayer", "SpeechTokenizer", "ProsodyModeling"], "source": "Sources/DisCo-Speech.pdf", "github": "", "demo": ""}, {"name": "Fun-Audio-Chat", "title": "Fun-Audio-Chat Technical Report", "arxiv_id": "2512.20156", "date": "2025-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "LALM", "full-duplex", "dual-resolution", "DPO", "model-merging", "spoken-dialogue", "audio-understanding"], "summary": "阿里通义的 Parallel LALM,用 dual-resolution 架构 (5Hz LLM + 25Hz SRH) 和 Core-Cocktail Training 实现计算高效的语音对话,并引入 Multi-Task DPO 增强真实场景能力", "route": "Speech(Whisper encoder → Adapter → S3Tokenizer) → Shared LLM(5Hz grouped tokens + text) → Text Head(text) + SRH(25Hz speech tokens) → Speech Detokenizer(FlowMatching + HiFi-GAN)", "metrics": "OpenAudioBench S2T 76.61%(8B, 同规模最优) [Table 2]; VoiceBench S2T 83.21%(8B) [Table 2]; MMAU 77.9%(30B-A3B, 全模型最优) [Table 3]; 全双工 Turn-taking 100%(30B-A3B) [Table 7]; UTMOS 4.37 / ASR-WER 4.32% on Llama Q. [§3.2]; GPU hours ~50% reduction [§1]", "takeaway": "Core-Cocktail Training 的中间模型合并策略 ($M_r = \\alpha M_1 + (1-\\alpha)M_0$, $\\alpha$=0.5) 可迁移到任何多模态微调场景防灾难性遗忘; 分辨率解耦 (LLM 低帧率 + 生成头高帧率) 是通用的效率-质量平衡思路", "limitation": "多轮对话记忆丢失 [§5]; 语音指令跟随稳定性不足 [§5]; 共情表现不一致 [§5]; 仅做 post-training 无大规模预训练,理论上限可能受限", "concepts": ["SpeechLanguageModel", "Full-duplexSpokenDialogue", "SpeechTokenizer", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "ConditionalFlowMatching"], "source": "Sources/Fun-Audio-Chat.pdf", "github": "", "demo": ""}, {"name": "GLM-TTS", "title": "GLM-TTS Technical Report", "arxiv_id": "2512.14291", "date": "2025-12", "venue": "Technical Report (Zhipu AI)", "org": "", "tier": "deep", "tags": ["TTS", "LLM", "GRPO", "reinforcement-learning", "LoRA", "vocoder", "production-level", "speech-tokenizer"], "summary": "1.5B 参数的生产级 LLM-based TTS, 通过 GRPO 多奖励 RL + 优化 Whisper-VQ tokenizer + Vocos2D vocoder + Phoneme-in 混合输入, 100K 小时训练达开源 SOTA", "route": "Text/Phoneme → GLM-tokenizer (Whisper-VQ) + Prompt → GLM-TTS (AR) → Speech Tokens → FLOW (diffusion) → Mel → Vocos2D → Waveform", "metrics": "test-zh CER 1.03% / SIM 76.1 (SFT), CER 0.89% / SIM 76.4 (RL); test-en WER 2.23% / SIM 67.2; Vocos2D MOS 4.16 vs Vocos 3.58 [Table 3, 8]", "takeaway": "(1) GRPO 四维 reward (CER+SIM+Emotion+Laughter) 的 RL 框架; (2) Whisper-VQ tokenizer 的系统优化经验; (3) Vocos2D 的 2D 卷积设计; (4) Phoneme-in 混合输入处理多音字", "limitation": "英语数据不足 (不到中文一半); 情感 benchmark 为内部数据集; GRPO 的 Emotion reward 与 Dynamic Sampling 存在冲突", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "ConditionalFlowMatching", "NeuralVocoder", "DifferentiableRewardOptimization", "SpeakerAdaptation"], "source": "Sources/GLM-TTS.pdf", "github": "", "demo": ""}, {"name": "JoyVoice", "title": "JoyVoice: Long-Context Conditioning for Anthropomorphic Multi-Speaker Conversational Synthesis", "arxiv_id": "2512.19090", "date": "2025-12", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "multi-speaker", "long-form", "conversational", "E2E", "flow-matching", "LLM-based"], "summary": "提出 E2E Transformer-DiT 联合训练架构,通过 AR hidden states 直接 conditioning 全局因果 DiT,支持最多 8 说话人、5 分钟长对话的零样本语音合成", "route": "Text + Speaker Tags/Embeddings → Qwen2.5-0.5B AR Transformer → 离散 token (AM loss) + 连续 hidden states → Global Causal DiT (FM loss) → Mel → Vocoder → Waveform", "metrics": "SEED-TTS-Eval test-zh CER 0.97% / test-en WER 1.69% / test-hard CER 5.55% [Table 3]; MSMT-eval 2spk-zh cpCER 1.88% [Table 5]; 12.5Hz E2E 与 25Hz 性能相当 [Table 2]", "takeaway": "(1) 离散 token + 连续 hidden 双信号设计兼顾稳定性与信息量; (2) 无分割的多说话人序列建模(speaker tag + 隐式 attention 对齐); (3) 随机 chunk 训练统一流式/非流式; (4) 基于 CER=0 vs CER>0 构建 APO preference pairs", "limitation": "4 说话人以上质量明显下降(训练数据不足); RL 训练仍在进行中; 不支持音乐/音效; 未开源", "concepts": ["ConditionalFlowMatching", "LLM-basedTTS", "SpeechTokenizer", "FiniteScalarQuantization", "SemanticvsAcousticTokens", "Diffusion-basedTTS", "TokenRateandBitrateTrade-offs", "DifferentiableRewardOptimization", "SpeakerEmbedding"], "source": "Sources/JoyVoice.pdf", "github": "", "demo": ""}, {"name": "M3-TTS", "title": "M3-TTS: Multi-modal DiT Alignment & Mel-latent for Zero-shot High-fidelity Speech Synthesis", "arxiv_id": "2512.04720", "date": "2025-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["zero-shot-TTS", "NAR-TTS", "flow-matching", "MMDiT", "mel-VAE", "cross-modal-alignment", "training-efficiency"], "summary": "用 MMDiT (Joint-DiT + Single-DiT) 实现 NAR TTS 中的 text-speech 跨模态对齐,配合 Mel-VAE 隐空间压缩,无需 duration prediction 或 filler padding 即可达到 SOTA 级 NAR 可懂度", "route": "Text → Zipformer Text Encoder → Text Features T; Ref Speech → Mel-VAE Encoder → Latent x1 → Noising → xt; [xt; T] → Joint-DiT (cross-modal attention) → [Ha; Ht] → Single-DiT (speech-only refinement) → vθ → ODE Solver → Mel-VAE Decoder → Mel → Vocoder → Waveform", "metrics": "Seed-TTS test-en: WER 1.48 (Fbank) / 1.36 (VAE), SIM-o 0.681/0.604, UTMOS 3.88/2.80; Seed-TTS test-zh: WER 1.36/1.31, SIM-o 0.762/0.621; NMOS 3.80/3.62, QMOS 3.99/3.75 [Table 1]; VAE 变体训练加速 2.9x (31h vs 90h, 8xA100) [Table 2]", "takeaway": "(1) MMDiT 的 Joint attention 作为 text-speech 对齐的通用方案,无需任何显式 duration 建模; (2) 两阶段 DiT 分工模式 (Joint 做对齐 + Single 做声学精炼) 可推广到其他跨模态生成; (3) Mel-VAE 在时间和维度上的双重压缩思路,用 latent 替代 raw mel 实现训练加速", "limitation": "(1) Mel-VAE 变体在 SIM-o 和 UTMOS 上大幅落后于 Fbank 变体和 Ground Truth (codec 重建上限限制); (2) 44.1 kHz 下 VAE 变体 WER 10.7,性能严重退化 [Table 1]; (3) 推理时需拼接 prompt text + ref audio 后才接目标序列,增加延迟 [§4.4]; (4) 代码未开源(截至 arXiv 提交时)", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "Classifier-FreeGuidance", "VariationalAutoencoderforTTS", "Speech-TextAlignment", "MelSpectrogram"], "source": "Sources/M3-TTS.pdf", "github": "", "demo": ""}, {"name": "ManchuTTS", "title": "ManchuTTS: Towards High-Quality Manchu Speech Synthesis via Flow Matching and Hierarchical Text Representation", "arxiv_id": "2512.22491", "date": "2025-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "low-resource", "endangered-language", "non-autoregressive", "hierarchical-representation", "contrastive-learning", "agglutinative"], "summary": "针对满语黏着特性设计三级文本表征(音素-音节-韵律)+层级对比损失,在仅 5.2h 数据上实现 MOS 4.52 的 CFM-based NAR TTS", "route": "满语文本→IPA phoneme+syllable+prosody 三级特征→Conv1D phoneme encoder→8 层 DiT + 三层 cross-modal attention→CFM ODE→80-dim mel spectrogram→vocoder", "metrics": "MOS 4.52 (vs GT 4.68, F5-TTS 4.12, VITS 3.95); WER 12.4%; AWPA 92.7%; Prosodic Naturalness 89.4%; RTF 0.12; 86ms latency [Table III, IV, VI]", "takeaway": "三级文本表征+层级对比损失的思路可迁移到其他黏着语/低资源语言 TTS; cross-modal attention 的 self→cross→self 三层结构是轻量级多模态对齐方案", "limitation": "仅支持实验室录音,方言变体精度下降; 情感表达有限; 6.24h 数据集规模极小且尚未完全开源; 与主流系统(CosyVoice/VALL-E)的架构差距大,zero-shot 能力弱", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "DurationPredictor", "MelSpectrogram", "PhonemeRepresentation", "ProsodyModeling"], "source": "Sources/ManchuTTS.pdf", "github": "", "demo": ""}, {"name": "MiMo-Audio", "title": "MiMo-Audio: Audio Language Models are Few-Shot Learners", "arxiv_id": "2512.23808", "date": "2025-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "few-shot", "audio-understanding", "unified-model", "emergent-ability", "speech-continuation", "patch-encoder-decoder", "RVQ-tokenizer"], "summary": "通过 100M+ 小时无损 speech token 预训练,首次在语音领域观察到 GPT-3 式 emergent few-shot learning,base 模型无需微调即可执行 voice conversion/style transfer/speech translation 等从未训练过的任务 [§1, §3.4]", "route": "24kHz waveform → MiMo-Audio-Tokenizer (1.2B, 25Hz, 8-layer RVQ, 200 tokens/s) → Patch Encoder (6L Transformer, 4帧→1 patch, 6.25Hz) → MiMo-7B LLM backbone → Patch Decoder (16L Transformer, 1 patch→4帧, delay pattern) → Tokenizer decoder+vocoder → waveform [§2, Fig 3]", "metrics": "Base: SpeechMMLU S2S 69.1 / MMAU 66.0 (开源 SOTA) [Table 6]; modality gap 仅 3.4 (vs Step-Audio2 22.3) [§3.4]; Instruct: MMAU 74.90 / MMSU 61.70 / MMAU-Pro 53.35 / MMAR 63.60 (均开源 SOTA,接近 Gemini 2.5 Flash) [Table 8]; InstructTTSEval-EN 72.59 / ZH 70.52 (超越 GPT-4o-mini-tts) [Table 9]; BigBench Audio S2T 72.90 (仅次于 GPT-4o) [Table 8]", "takeaway": "(1) Patch encoder-decoder 架构将 200 token/s 降至 6.25 Hz LLM 输入,解决 speech-text 长度失配 [§2.2]; (2) Tokenizer 从零联合训练 encoder + LLM 的 A2T loss 同时获得语义和声学能力,无需 SSL 蒸馏 [§2.1.2]; (3) Text-guided interleaving (5:5 ratio) 同时生成 text 和 speech tokens 提升生成质量 [§3.2.2]; (4) Loss weights 按 RVQ 层指数衰减 (100-12-8-6-4-2-2-1-1) 确保高层语义 > 低层声学 [Table 3]; (5) Layer-3 hidden states + final-layer skip connection 在 tokenizer encoder 中缓解语义-声学冲突 [§2.1.1]", "limitation": "训练数据 100M+ 小时,普通团队无法复现 [§3.1]; 对话语音质量不稳定 (timbre discontinuity, mispronunciation) [§6]; thinking 机制在 sound/music 任务上引入幻觉导致性能下降 [§6]; ASR WER 3.50 (LibriSpeech) 弱于 Step-Audio2 1.87 和 Kimi-Audio 2.13 [Table 9]; 模型开源但训练数据未开源", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "LLM-basedTTS", "AudioUnderstanding", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "CodecTrainingObjectives"], "source": "Sources/MiMo-Audio.pdf", "github": "", "demo": ""}, {"name": "RRPO", "title": "RRPO: Robust Reward Policy Optimization for LLM-Based Emotional TTS", "arxiv_id": "2512.04552", "date": "2025-12", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["emotional-TTS", "reinforcement-learning", "reward-hacking", "reward-model", "robustness", "LLM-TTS", "post-training"], "summary": "在 DiffRO 框架中通过三层混合正则化 (LS + EAM + Adv) 构建鲁棒 Reward Model,解决 emotional TTS 中 policy 生成声学伪影骗取虚假奖励的 reward hacking 问题", "route": "文本+情感指令 → CosyVoice2 LLM (Gumbel-Softmax 可微采样) → speech tokens → Robust RM (SER head, hybrid regularization fine-tuned) → reward gradient → policy update", "metrics": "E-MOS 3.78 (vs DiffRO 3.65, SFT 3.52), N-MOS 3.81 (vs DiffRO 3.61, SFT 3.72); SER WA on ESD 81.7% (vs baseline 64.4%); IEMOCAP 68.0% (cross-lingual) [Table 1, Table 2]", "takeaway": "三层 RM 正则化方案可迁移到任何基于可微 reward 的 TTS 后训练 — Label Smoothing 修正过度自信, Energy-Adaptive Mixup 平滑决策边界, Adversarial Training 增强扰动鲁棒性; 特别是 EAM 基于语音能量自适应计算混合系数的设计,比标准 Mixup 更适合语音信号", "limitation": "仅在单说话人中文数据 (10K 样本, 5 类情感) 上验证; 无零样本说话人泛化实验; 未与 GRPO/DPO 等非 DiffRO 路线对比; Adv 在部分数据集上与 EAM 存在 trade-off (Table 2 IEMOCAP/ESD 略降); 代码未开源", "concepts": ["DifferentiableRewardOptimization", "EmotionControlinTTS", "Gumbel-Softmax", "LLM-basedTTS"], "source": "Sources/RRPO.pdf", "github": "", "demo": ""}, {"name": "Smark", "title": "Smark: A Watermark for Text-to-Speech Diffusion Models via Discrete Wavelet Transform", "arxiv_id": "2512.18791", "date": "2025-12", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "watermarking", "diffusion", "DWT", "audio-security", "model-agnostic", "mel-spectrogram", "copyright-protection"], "summary": "利用 DWT 在 diffusion TTS 共享的 reverse diffusion 过程中将水印嵌入 mel spectrogram 的低频 LL 子带,实现模型无关的通用语音水印", "route": "Text → Text Encoder → Reverse Diffusion (X'_T → X'_t) → DWT 分解 X'_t 为 LL/LH/HL/HH → Watermark Embedder 修改 LL 子带 → IDWT 重建 → 继续 Reverse Diffusion → X'_0 (带水印语音) → Watermark Extractor (Conv2D + Pooling) → 提取水印 m'", "metrics": "GradTTS+LJSpeech: PESQ 4.5467 / STOI 1.0 / MOS 3.1134 / ACC 1.0 [Table II]; 攻击鲁棒性: GradTTS 所有单/双重攻击下 ACC ≥ 0.97 [Table III]; 容量 50-5000bp 下 ACC ≥ 0.990 [Fig 4]", "takeaway": "(1) DWT 低频子带嵌入策略 — 在扩散过程中间状态选择结构稳定区域做信息注入; (2) 强度预测器动态调整嵌入强度 — 根据局部信号特性自适应平衡不可感知性与鲁棒性; (3) 课程式多目标训练 — 先稳定主模型再逐步增大辅助目标权重", "limitation": "需要接入 reverse diffusion 过程 (需修改 TTS 推理代码); 未在商业 TTS 系统上验证; 实验仅覆盖英文; 未考虑 re-synthesis 攻击; 假设检验方法对极短语音 (<0.3s) 的有效性未讨论", "concepts": ["Diffusion-basedTTS", "MelSpectrogram", "Anti-spoofingandDeepfakeDetection", "TTSEvaluation"], "source": "Sources/Smark.pdf", "github": "", "demo": ""}, {"name": "TaskVectorTTS", "title": "Task Vector in TTS: Toward Emotionally Expressive Dialectal Speech Synthesis", "arxiv_id": "2512.18699", "date": "2025-12", "venue": "ICASSP 2026 (推测,arXiv Dec 2025)", "org": "", "tier": "deep", "tags": ["TTS", "task-vector", "dialect", "emotion", "zero-shot", "LoRA", "F5-TTS", "style-transfer"], "summary": "将 NLP 领域的 task vector (微调参数差) 迁移到 F5-TTS,通过层级合并策略实现方言+情感的零样本跨风格语音合成", "route": "预训练 F5-TTS → 按风格分别微调 → 计算参数差 (task vector) → 缩放得到 E-Vector → 层级合并 (早层方言 + 晚层情感) → 联合控制合成", "metrics": "方言 MOS 3.18 (E-Vector) vs 2.62 (CosyVoice2) vs 3.69 (GT) [Table 2]; 情感方言 MOS 2.83 (HE-Vector) vs 1.87 (CosyVoice2) [Table 3]; 8 方言,仅需 60k 步微调", "takeaway": "参数空间的风格向量操作思路 — 将不同属性的微调方向分配到模型不同层,避免干扰;LoRA E-Vector 允许多风格共存于单一 backbone", "limitation": "仅在 F5-TTS 上有效,应用于 CosyVoice 时质量下降 [§5];参数变化非严格线性,线性缩放有理论局限;MOS 分数偏低 (方言 3.18, 情感方言 2.83),距实用仍有差距;数据集/评估非公开", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "EmotionControlinTTS", "StyleTransferinTTS", "SpeakerAdaptation"], "source": "Sources/TaskVectorTTS.pdf", "github": "", "demo": ""}, {"name": "E2E-VGuard", "title": "E2E-VGuard: Adversarial Prevention for Production LLM-based End-To-End Speech Synthesis", "arxiv_id": "2511.07099", "date": "2025-11", "venue": "NeurIPS 2025", "org": "", "tier": "deep", "tags": ["voice-protection", "adversarial-perturbation", "voice-cloning", "anti-spoofing", "deepfake-defense", "speaker-verification", "LLM-TTS", "end-to-end"], "summary": "通过 encoder ensemble timbre 扰动 + ASR 对抗攻击发音破坏 + 心理声学模型感知优化,实现对 LLM-based TTS 和 ASR-driven 端到端语音克隆的双层主动防护", "route": "原始音频 → {6 encoder ensemble (VITS/GSV/CosyVoice/StyleTTS2 encoder + WavLM + MFCC) → timbre feature loss} + {ASR 模型 (Wav2vec2) → CTC targeted attack → pronunciation loss} + {心理声学模型 → 频域掩蔽阈值 + L2 norm → 感知 loss} → PGD 优化 500 步 → 受保护音频", "metrics": "Fine-tuning: WER↑ 94.812% (T, GSV) / SIM↓ 0.082 (UT, StyleTTS2) [Table 1]; Zero-shot: SIM↓ 0.008 (UT, Step-Audio) [Table 2]; Commercial API: SIM 0.689→0.203 [Fig 2]; 感知: SNR 18.523-20.470, PESQ 1.949-2.324, MOS 3.522±0.218 [Table 1, Appendix G]; 真实世界: WER 72.615%, SIM 0.068 [Fig 3]", "takeaway": "(1) Encoder ensemble + 异质 feature extractor(传统 MFCC + 预训练 SSL + TTS encoder)组合策略,可迁移到任何需要跨模型 transferable perturbation 的场景; (2) 双层防护思路(timbre + pronunciation),分别针对 TTS 的两个核心输入(参考音频特征 + 文本)施加扰动,比单层防护覆盖面更广", "limitation": "(1) 扰动生成需 ~98-112 秒/样本(4090 GPU) [Appendix A],比 SafeSpeech 的 10.6s 慢约 10 倍; (2) 心理声学模型的 SNR 优于 baseline 但 PESQ 1.949 较低,说明在时频感知精细度上仍有提升空间; (3) 发音保护依赖特定 ASR 模型(非 universal),需依赖迁移性 [Appendix A]; (4) 代码开源但未提供预训练权重", "concepts": ["Anti-spoofingandDeepfakeDetection", "SpeakerVerification", "SpeakerEmbedding", "VoiceCloningTaxonomy", "LLM-basedTTS", "SpeechTokenizer"], "source": "Sources/E2E-VGuard.pdf", "github": "", "demo": ""}, {"name": "InstructAudio", "title": "InstructAudio: Unified Speech and Music Generation with Natural Language Instruction", "arxiv_id": "2511.18487", "date": "2025-11", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "TTM", "unified-audio", "instruction-control", "MM-DiT", "flow-matching", "natural-language-description", "music-generation"], "summary": "首个用统一 NL instruction + phoneme 输入格式同时控制 TTS 和 TTM 的框架,基于 MM-DiT 架构实现 timbre/paralinguistic/musical 多属性纯文本控制", "route": "NL instruction + text/lyrics → Qwen2.5-7B (frozen) instruct encoder + Zipformer phoneme encoder → Joint DiT (14L) + Single DiT (6L) → CFM ODE solver → Mel-VAE decoder → speech/music", "metrics": "Seed-TTS WER EN 1.52% / ZH 1.35% (best); Gender Acc 100%, Emotion Acc 83.33%, Dialogue Acc 90%; SongEval Coherence 3.08 / Musicality 2.98 (best) [Table 1, 2, 3]", "takeaway": "(1) 统一 instruction-phoneme 格式消除 TTS/TTM 输入异构性; (2) Frozen 大 LLM (Qwen2.5-7B) 做 instruct encoder 的高效利用; (3) Joint DiT + Single DiT 分层设计平衡跨模态对齐和单模态细节", "limitation": "NMOS 3.46 低于 CosyVoice2 (3.65),纯文本控制的 one-to-many 模糊性导致音质下降; 音乐限制在 5-20s 短片段; 无开源代码", "concepts": ["Instruction-GuidedSpeechSynthesis", "NaturalLanguageDescriptionforTTS", "ConditionalFlowMatching", "Diffusion-basedTTS", "SingingVoiceSynthesis"], "source": "Sources/InstructAudio.pdf", "github": "", "demo": ""}, {"name": "Ming-UniAudio", "title": "Ming-UniAudio: Speech LLM for Joint Understanding, Generation and Editing with Unified Representation", "arxiv_id": "2511.05516", "date": "2025-11", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "unified-model", "continuous-tokenizer", "VAE", "speech-editing", "free-form-editing", "per-token-diffusion", "flow-matching"], "summary": "提出 VAE-based 连续统一 speech tokenizer (MingTok-Audio),实现理解/生成/编辑三合一 speech LLM,并首创无 timestamp 的自由形式语音编辑能力", "route": "音频 → MingTok-Audio (causal transformer VAE, 3 阶段训练) → 统一特征 Zuni (高维, LLM 输入) / Zlatent (低维, flow matching 用) → MoE LLM (16.8B, 2.8B active) → text head (理解) / per-token flow matching head (生成/编辑) → MingTok-Audio decoder → 波形", "metrics": "中文 voice cloning Seed-TTS-WER **0.95%** (SOTA) [Table 13]; ContextASR 12 项中 **8 项 SOTA** [Table 12]; tokenizer PESQ **4.21** vs MiMo 2.71 / EnCodec 2.19 [Table 2]", "takeaway": "(1) semantic module freezing 策略 — 联合训练初期冻结 tokenizer 中的语义模块防 representation drift,性能差异显著 (AVG WER 4.35 vs 6.86) [Table 5]; (2) 语义编辑用 CoT + [MASK] 显式定位编辑区域; (3) diffusion head 预训练初始化可 2x 加速收敛 [Table 5, Fig 5b]", "limitation": "SIM 指标偏低 (MingTok-Audio-TTS: Seed-zh SIM 0.75, Seed-en SIM 0.68 [Table 3],低于 CosyVoice 3 的 0.78;最终统一模型未报告 SIM); 语义编辑 deletion WER 偏高 (22.92/27.60) [Table 14]; pitch alteration 的 SIM 仅 0.36/0.24 [Table 14]; 无 MOS 主观评测", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "VariationalAutoencoderforTTS", "ConditionalFlowMatching", "SpeechLanguageModel", "Next-TokenDiffusion", "LLM-basedTTS", "Classifier-FreeGuidance"], "source": "Sources/Ming-UniAudio.pdf", "github": "", "demo": ""}, {"name": "Multi-RewardGRPO", "title": "Multi-Reward GRPO for Stable and Prosodic Single-Codebook TTS LLMs at Scale", "arxiv_id": "2511.21270", "date": "2025-11", "venue": "arXiv (ACM Conference submission)", "org": "", "tier": "deep", "tags": ["TTS", "reinforcement-learning", "GRPO", "single-codebook", "prosody", "post-training", "LLM-TTS"], "summary": "在单码本 TTS LLM (LLaSA) 上用多奖励 GRPO 做 RL 后训练,通过五个奖励函数 (WER + SIM + 长度约束 + 熵正则 + LLM 标注韵律对齐) 系统性提升韵律稳定性、说话人相似度和自然度", "route": "Text+Ref Speech -> Single-codebook TTS LLM (LLaSA 1B/3B/8B) -> N rollouts -> 多奖励评估 (Whisper WER + WavLM SIM + length + entropy + prosody match) -> GRPO policy update; 可选 +FM decoder", "metrics": "LLaSA+RL: CER 1.10 (zh) / WER 2.12 (en) / SIM 0.758 (zh) / MOS 4.12; +FM: CER 1.08 / WER 2.08 / SIM 0.790 / MOS 4.21; 优于 Spark-TTS / CosyVoice 1&2,接近 CosyVoice 3 (使用 4x 数据) [Table 1]", "takeaway": "1) 用推理型 LLM (DeepSeek-R1) 离线标注韵律结构作为 RL 监督信号; 2) 多奖励拆分设计使每个奖励功能明确且可独立消融; 3) 10K samples 即可获得可测量增益,RL 数据效率高于 SFT", "limitation": "仅 4 页短文,细节不足 (如 prosody reward 的 pause mapping 规则未完整给出); R_pro 是 binary reward,可能信号稀疏; 未与 DiffRO/DPO 做直接对比; 未开源", "concepts": ["LLM-basedTTS", "ProsodyModeling", "Single-codebookvsMulti-codebook", "ConditionalFlowMatching", "SpeakerEmbedding", "DifferentiableRewardOptimization", "SpeakerVerification", "TTSEvaluation"], "source": "Sources/Multi-RewardGRPO.pdf", "github": "", "demo": ""}, {"name": "PURECodec", "title": "PURE Codec: Progressive Unfolding of Residual Entropy for Speech Codec Learning", "arxiv_id": "2511.22687", "date": "2025-11", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-codec", "RVQ", "speech-enhancement", "training-stability", "entropy-decomposition", "variable-bitrate"], "summary": "用预训练 speech enhancement 模型引导 RVQ 第一层量化低熵(增强后)表征,后续层逐步编码高熵残差,通过 VAE 预训练 + 随机增强调度实现稳定训练", "route": "输入波形 S → (可选) Enhancement 模块 → Encoder → 连续 latent Q → Stream 1 量化增强 embedding / Stream 2-L 量化残差 → Decoder → 重建波形; GAN 训练 + multi-scale discriminator", "metrics": "OWSM-v3.2 训练: WER 2.26→2.05, UTMOS 3.42→3.64, SPK-SIM 0.64→0.71 vs DAC baseline [Table II]; 在 noisy 数据 (URGENT/CommonVoice) 上 DAC 坍缩而 PURE 保持稳定 [Table II]; TTS 下游: WER 10.8→10.5, UTMOS 3.68→3.95 [Table IV]", "takeaway": "(1) 用外部模型 (enhancement/denoising) 的输出作为 RVQ 第一层的 soft target,让信息分解有语义指导; (2) VAE 预训练 + 冻结 encoder 的两阶段训练策略稳定量化; (3) 随机增强调度 (p_enh=0.25-0.50) 平衡压缩灵活性和熵控制", "limitation": "依赖 speech-specific enhancement 模型,不直接适用于音乐/通用音频; SDR 在 clean 数据上低于 DAC (codec 引入幅度偏移); 仅在 16kHz 评估; 代码开源但基于 ESPnet 框架", "concepts": ["ResidualVectorQuantization", "CodebookCollapse", "QuantizerDropout", "SpeechTokenizer", "Multi-scaleSTFTDiscriminator", "CodecTrainingObjectives", "VariationalAutoencoderforTTS"], "source": "Sources/PURECodec.pdf", "github": "", "demo": ""}, {"name": "SALMONN-Guard", "title": "Speech-Audio Compositional Attacks on Multimodal LLMs and Their Defense with SALMONN-Guard", "arxiv_id": "2511.10222", "date": "2025-11", "venue": "ICML 2026", "org": "", "tier": "deep", "tags": ["audio-safety", "red-teaming", "jailbreaking", "multimodal-safety", "guard-model", "speech-audio-composition", "benchmark", "LLM-safety"], "summary": "提出 SACRED-Bench (首个利用语音-音频组合的黑盒攻击 benchmark) 和 SALMONN-Guard (首个联合检查语音+音频+文本的 guard model),将 Gemini 2.5 Pro 的 66% 攻击成功率降至 20%", "route": "攻击: 有害内容 → ChatTTS 合成 → SSO (语音重叠) / SAO (语音+非语音混合) / MSD (多人对话) → 间接文本 prompt → 目标 LLM; 防御: Audio + Text → Qwen2.5-Omni-7B + LoRA (SFT, 两阶段) → safety judgment (harmful/harmless/refusal)", "metrics": "Gemini 2.5 Pro overall ASR 66.75%, SALMONN-Guard 降至 11.32% (OBE 7.74%); 对 Speech Insertion/Editing 等未训练攻击 ASR 分别为 0.00%/3.00% [Table 1, Table 4]; FAR 0% [Table 1]", "takeaway": "(1) 语音-音频组合作为黑盒攻击范式: 不需要梯度/白盒访问,利用真实音频场景的复杂性; (2) 两阶段 SFT curriculum (先全局再难例聚焦) 训练轻量 guard model; (3) 间接引用 (indirect reference) 作为绕过文本安全过滤器的通用策略", "limitation": "仅评估英文; SALMONN-Guard 仍有 ~11% 残余 ASR; SAO 依赖人工收集的有害音频; 仅 2 人听力测试验证 intelligibility; guard model 需要部署为独立组件,增加推理延迟", "concepts": ["AudioUnderstanding", "SpeechLanguageModel", "Audio-LanguagePretraining", "Anti-spoofingandDeepfakeDetection"], "source": "Sources/SALMONN-Guard.pdf", "github": "", "demo": ""}, {"name": "SingingSDS", "title": "SingingSDS: A Singing-Capable Spoken Dialogue System for Conversational Roleplay Applications", "arxiv_id": "2511.20972", "date": "2025-11", "venue": "EAIM2026 at AAAI", "org": "", "tier": "deep", "tags": ["spoken-dialogue-system", "singing-voice-synthesis", "SVS", "roleplay", "cascaded-pipeline", "LLM", "ASR", "melody-control"], "summary": "首个将歌声合成 (SVS) 集成到交互式 spoken dialogue system 的开源系统,通过级联 ASR-LLM-SVS pipeline + melody-constrained lyric prompting 实现 speech-in, singing-out 角色扮演对话", "route": "用户语音 → ASR (Whisper/Paraformer) → 文本 → LLM (Llama3/Gemini + 角色 prompt + 音节约束) → 歌词文本 → G2P → SVS (VISinger 2 + melody controller + speaker embedding) → 歌声输出", "metrics": "SingMOS 4.53-4.59, PER 0.12-0.61%, N&F 4.00-4.21, Char. Cons. 4.13-4.19, Lyric Qual. 3.35-3.86 (20 prompts, 4 配置组合, Whisper+Gemini+KiSing 最优) [Table 2]; SVS 延迟 ~0.16-0.19s [Table 2]", "takeaway": "(1) melody phrase constraint prompting — 在 LLM prompt 中指定每行音节数以对齐旋律结构,无需模型微调; (2) pitch-based vs lyric-aware alignment 两种旋律对齐策略可推广到任何 melody-conditioned generation; (3) 模块化 registry-based 架构设计适用于多模态对话系统快速原型", "limitation": "SVS 后端 (VISinger 2) 非最先进; 评估规模小 (20 prompts, 6 listeners); 仅支持中日双语; melody constraint 是 soft constraint (LLM 不保证精确音节数); 无与 end-to-end speech LLM 对话系统的延迟/质量对比; 仅支持 text → singing 的单向转换,无 singing → text 反向理解", "concepts": ["SingingVoiceSynthesis", "SVSEvaluationMetrics", "MusicalScoreEncoder", "SpokenDialogueEvaluation"], "source": "Sources/SingingSDS.pdf", "github": "", "demo": ""}, {"name": "SpeechJudge", "title": "SpeechJudge", "arxiv_id": "2511.07931", "date": "2025-11", "venue": "arXiv 2025 (ByteDance Seed + CUHK Shenzhen)", "org": "", "tier": "deep", "tags": ["TTS-evaluation", "naturalness", "reward-model", "GRPO", "SFT", "human-feedback", "pairwise-preference", "benchmark"], "summary": "首个针对 TTS naturalness 的完整评估套件: 99K pairwise 人类偏好数据集 (SpeechJudge-Data) + 1K 高一致性 benchmark (SpeechJudge-Eval) + 基于 GRPO 训练的 generative reward model (SpeechJudge-GRM, 77.2% accuracy)", "route": "6 个零样本 TTS 模型生成语音对 → 69 名标注员 pairwise preference 标注 (99K pairs) → SFT (Gemini-2.5-Flash CoT distillation) + GRPO (human preference as verifiable reward) → SpeechJudge-GRM; 可用作 TTS 后训练 reward function", "metrics": "SpeechJudge-GRM 77.2% accuracy (vs BTRM 72.7%); Voting@10 79.4%; 用于 TTS 后训练 N-CMOS +0.25 (online) [Table 3, Fig 6]", "takeaway": "(1) Pairwise preference + GRPO 训练 GRM 比 Bradley-Terry 标量 reward 更强; (2) CoT-based SFT 冷启动; (3) 用 GRM 做 TTS 后训练 (offline DPO + online reward); (4) 大规模 naturalness preference 数据集构建方法", "limitation": "仅覆盖中英文 + code-switching; 标注者均为中国专业评分员; 仅针对合成语音 (非自发语音); 数据集中中文一致性显著高于英文; GRM 在 expressive + 极端风格上仍有 failure cases; CoT 质量依赖 Gemini-2.5-Flash teacher", "concepts": ["TTSEvaluation", "DifferentiableRewardOptimization", "AudioUnderstanding"], "source": "Sources/SpeechJudge.pdf", "github": "", "demo": ""}, {"name": "Step-Audio-EditX", "title": "Step-Audio-EditX: First Open-Source LLM-based Audio Model for Expressive and Iterative Audio Editing", "arxiv_id": "2511.03601", "date": "2025-11", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-editing", "emotion-control", "style-control", "paralinguistic", "zero-shot-TTS", "LLM-based", "reinforcement-learning", "large-margin-data"], "summary": "首个开源 LLM-based 音频编辑模型,通过 large-margin 合成数据 + SFT + PPO,在 3B 参数下实现情感/风格/副语言的迭代编辑,且超越 MiniMax-2.6-hd 和 Doubao-Seed-TTS-2.0 [§Abstract]", "route": "Input audio → Dual-codebook Tokenizer (linguistic 16.7Hz + semantic 25Hz) → Audio LLM (3B, chat format) → Output Dual-Tokens → Flow Matching (DiT backbone) + BigVGANv2 → Edited Waveform [§2, Fig 2]", "metrics": "Emotion accuracy: 53.5→70.7% (Iter0→Iter3 avg) [Table 1]; Style accuracy: 46.0→66.2% (Iter0→Iter3 avg) [Table 1]; Paralinguistic: 1.91→2.89 (1-3 scale, Iter0→Iter1) [Table 4]; 泛化至闭源模型: MiniMax-2.6-hd emotion 63.3→74.2% (avg Iter0→Iter3), GPT-4o-mini-TTS 59.7→71.9% [Table 2]", "takeaway": "(1) Large-margin synthetic data pipeline: 用 voice cloning 生成同一说话人不同情感/风格的对比数据 + margin scoring + margin selection (score>=6),无需大量真实情感数据 [§3.1.2]; (2) 迭代编辑: 多轮 editing 持续提升准确率,Iter3 比 Iter0 提升 17-20pp [Table 1]; (3) 模型无关泛化: EditX 可编辑任意 TTS 系统输出,包括闭源模型 [Table 2]; (4) Token-level reward model: Bradley-Terry loss 直接在 dual-codebook tokens 上训练,无需解码为波形 [§4.2]", "limitation": "(1) 编辑非传统意义的 \"editing\" (mask-based),而是条件再生成 [§7]; (2) Emotion accuracy 最高仅 ~70% (Iter3),离完美控制仍有距离; (3) 未报 MOS 或人类评估; (4) 训练数据依赖内部 voice cloning pipeline,复现需先有基座 TTS; (5) Paralinguistic 评估使用 Gemini-2.5-Pro LLM-as-judge,客观性待验证 [§5.1]", "concepts": ["LLM-basedTTS", "EmotionControlinTTS", "Instruction-GuidedSpeechSynthesis", "SpeechTokenizer", "ConditionalFlowMatching", "StyleTransferinTTS"], "source": "Sources/Step-Audio-EditX.pdf", "github": "", "demo": ""}, {"name": "Step-Audio-R1", "title": "Step-Audio-R1 Technical Report", "arxiv_id": "2511.15848", "date": "2025-11", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-reasoning", "reinforcement-learning", "PPO", "RLVR", "self-distillation", "chain-of-thought", "test-time-compute"], "summary": "首个成功让音频语言模型受益于 extended reasoning 的工作,通过 Modality-Grounded Reasoning Distillation (MGRD) 迭代式地将模型推理从文本替代推理转向真正的声学特征推理,在音频理解 benchmark 上超越 Gemini 2.5 Pro、接近 Gemini 3 Pro [§Abstract]", "route": "Audio waveform → Qwen2 Audio Encoder (frozen, 25Hz) → Adapter (2x downsample, 12.5Hz) → Qwen2.5 32B LLM → `<think>` reasoning chain + final answer (text only) [§2, Fig 2]", "metrics": "S2T avg 83.6% (vs Gemini 2.5 Pro 81.5%, Gemini 3 Pro 85.1%) [Table 1]; Big Bench Audio 98.7% (SOTA) [Table 1]; S2S realtime 96.1% reasoning score, 0.92s latency [Table 2]; MMAU 77.7% (format reward ablation) [§6.1]", "takeaway": "(1) MGRD 迭代自蒸馏框架: 每轮从上一轮模型采样→过滤声学 grounded CoT→SFT+RL,逐步将推理从文本代理转向声学分析 [§4.2]; (2) Format reward 防止 reasoning collapse: 准确率 0.8 + 推理存在性 0.2 的复合奖励,保持 CoT 长度稳定 [§4.2, Eq.7]; (3) Pass@[3,6]/8 数据筛选策略: 只选中等难度问题做 RL,比全量数据或纯失败问题都更好 [§6.2]; (4) Self-cognition correction: 迭代自蒸馏+8K DPO pairs 将\"我无法听音频\"错误从 6.76%→0.02% [§6.3]", "limitation": "仅 5K RL 样本,规模化效果未验证; 输出纯文本不支持语音生成; 32B 参数推理成本高; MGRD 迭代次数 T 的选择未讨论; 与 Gemini 3 Pro 仍有 1.5% 差距; Big Bench Audio 以外的 benchmark 优势不显著", "concepts": ["SpeechLanguageModel", "ModalityAdaptationforSpeechLLM"], "source": "Sources/Step-Audio-R1.pdf", "github": "", "demo": ""}, {"name": "W3AR", "title": "Speech Recognition Model Improves Text-to-Speech Synthesis using Fine-Grained Reward", "arxiv_id": "2511.17555", "date": "2025-11", "venue": "AAAI 2026", "org": "", "tier": "deep", "tags": ["TTS", "reinforcement-learning", "ASR", "reward-model", "attention", "word-level", "policy-optimization", "zero-shot"], "summary": "利用 frozen Whisper 的 cross-attention map 提取 word-level 的 attention purity 和 alignment monotonicity 两个 reward 信号,通过 group-relative policy optimization 细粒度优化 autoregressive TTS 的发音清晰度和韵律流畅性", "route": "TTS 生成多组候选音频 → Whisper encoder 提取音频表征 → Whisper decoder teacher-forcing ground-truth text → 提取 cross-attention map → 计算 per-word purity/monotonicity reward → group-relative advantage → 策略梯度更新 TTS", "metrics": "In-domain WER 5.25→3.21 (-38.9%), OOD WER 8.92→4.54 (-49.1%), MOS-N 4.07→4.38 (LibriTTS), BC 10.9→4.71%; VoiceCraft WER 8.55→4.98 (-41.7%) [Table 1, 2, 3]", "takeaway": "ASR cross-attention 作为免训练的 word-level TTS 质量评估信号;purity+monotonicity 二分法可迁移到任何需要 speech-text alignment 质量度量的场景", "limitation": "reward 完全依赖 Whisper attention 质量(换 ASR 模型效果未知);仅验证 3 个 TTS 模型;无韵律坍缩分析;训练需要 group sampling (N=8) 增加计算成本", "concepts": ["DifferentiableRewardOptimization", "TTSEvaluation", "Speech-TextAlignment", "LLM-basedTTS", "CodecLanguageModel", "ProsodyModeling"], "source": "Sources/W3AR.pdf", "github": "", "demo": ""}, {"name": "BridgeCode", "title": "BridgeCode: A Dual Speech Representation Paradigm for Autoregressive Zero-Shot Text-to-Speech Synthesis", "arxiv_id": "2510.11646", "date": "2025-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["zero-shot-TTS", "autoregressive", "speech-representation", "token-rate", "discrete-continuous", "RVQ", "dual-representation"], "summary": "提出 BridgeCode 双表征范式 (10 Hz sparse tokens + 50 Hz dense continuous features) 和双向 bridging module,让 AR TTS 以 5 倍更少的迭代步数达到竞争力质量", "route": "wav2vec 2.0 连续特征 → SparseBridge (multi-scale conv + 5x downsample + hierarchical RVQ + code selection) → 10 Hz sparse tokens → GPT-2 AR 预测 → DenseBridge (code prediction + RVQ decoder + upsample + inverse conv) → 50 Hz dense features → HiFi-GAN vocoder → 波形", "metrics": "LibriTTS test: WER 4.9% (最优) / SMOS 4.01 / QMOS 4.11 / UTMOS 3.894; token rate 10 Hz (CosyVoice 25 Hz, VALL-E 50 Hz); RTF 0.37x (2.7x 加速 vs baseline AR) [Table 1, Table 3]", "takeaway": "(1) 在 AR 循环中输入 5 帧连续特征预测下一个 token——让模型看到比 token 更丰富的上下文; (2) feature loss 作为 cross-entropy 的补充监督,惩罚声学距离而非均匀 token 错误; (3) 层间对齐 (layer-wise alignment) 确保 SparseBridge/DenseBridge 中间表征一一对应", "limitation": "仅在 LibriTTS (585h English) 上验证,未测试大规模数据/多语言; 质量与 CosyVoice (25 Hz) 持平但未超越; 未开源; 无 SEED-TTS-Eval 等标准 benchmark 结果", "concepts": ["ResidualVectorQuantization", "TokenRateandBitrateTrade-offs", "SpeechTokenizer", "SemanticvsAcousticTokens", "LLM-basedTTS", "NeuralVocoder", "CodecLanguageModel"], "source": "Sources/BridgeCode.pdf", "github": "", "demo": ""}, {"name": "CTDiffusion", "title": "Continuous-Token Diffusion for Speaker-Referenced TTS in Multimodal LLMs", "arxiv_id": "2510.12995", "date": "2025-10", "venue": "NeurIPS 2025 Workshop SPIGM", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "autoregressive", "continuous-representation", "MLLM", "zero-shot", "speaker-cloning", "exposure-bias"], "summary": "在 MLLM 中引入逐帧 contin
