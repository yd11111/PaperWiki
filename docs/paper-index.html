uous-token diffusion head + dual-head 架构 + two-stage 训练,以 160M 参数实现 SOTA AR zero-shot TTS (WER 1.95%, SIM 0.54)", "route": "Text + 3s ref audio → OPT-125M (causal LM) → dual-head: LM head 控制 EOS + diffusion head (12-layer MLP, DDPM) 逐帧去噪 64-dim VAE latent → VAE decoder → waveform", "metrics": "WER 1.95% / SIM-R 0.54 / UTMOS 4.00 on LibriSpeech(PC) test-clean; two-stage vs one-stage: 46% 相对 WER 降低 (3.61%→1.95%) [Table 1]", "takeaway": "(1) Two-stage 训练策略(先联合训练后冻结 LM 单独训练 diffusion head)解决 distribution drift,通用于所有 LM + diffusion head 联合训练场景; (2) Masked training (30% mask ratio) 缓解连续 AR 的 exposure bias; (3) 用 LM head 预测 `<cont_speech_gen>` + `<eos>` 控制变长语音生成,无需外部 duration predictor", "limitation": "(1) 仅在 LibriSpeech(PC) 评估,无中文/多语言验证; (2) 模型仅 160M,scalability 未验证; (3) 推理需 100 步 diffusion denoising,速度可能是瓶颈; (4) 未开源", "concepts": ["Next-TokenDiffusion", "LLM-basedTTS", "Diffusion-basedTTS", "VariationalAutoencoderforTTS", "MaskedGenerativeModeling", "Classifier-FreeGuidance", "SpeakerEmbedding"], "source": "Sources/CTDiffusion.pdf", "github": "", "demo": ""}, {"name": "DiSTAR", "title": "DiSTAR: Diffusion over a Scalable Token Autoregressive Representation for Speech Generation", "arxiv_id": "2510.12210", "date": "2025-10", "venue": "arXiv preprint (work in progress)", "org": "", "tier": "deep", "tags": ["zero-shot-TTS", "RVQ", "masked-diffusion", "autoregressive", "discrete-token", "patch-generation", "codec-LM"], "summary": "将 AR language model (patch-level) 与 discrete masked diffusion (intra-patch) 耦合在 RVQ code space 中,实现 zero-shot TTS 的块级并行、无 duration predictor、可变比特率生成", "route": "Text phonemes → Causal AR Transformer (patch-level sketch h_k) → Masked Diffusion Transformer (parallel infilling of RVQ codes within patch) → RVQ Codec Decoder → waveform", "metrics": "WER 1.66%/1.32% (LibriSpeech-PC/SeedTTS-en, 均 best), SIM 0.67/0.66, UTMOS 4.27/4.05; CMOS +0.22 vs Human, SMOS 3.31 (均 best) [Table 1, Table 2] (0.3B params)", "takeaway": "(1) RVQ-aware 采样三件套 (layer-wise temp shaping, position-wise temp shaping, hybrid greedy/sample); (2) stochastic layer truncation 实现推理时可变比特率/计算量控制; (3) overlapping patches smoothing boundaries", "limitation": "仅在 50K h 英语上验证,多语言未评估; 仅 work-in-progress 状态; 与 DiTAR 比 SIM 无明显优势; 未开源", "concepts": ["ResidualVectorQuantization", "MaskedGenerativeModeling", "Classifier-FreeGuidance", "CodecLanguageModel", "QuantizerDropout", "Single-codebookvsMulti-codebook"], "source": "Sources/DiSTAR.pdf", "github": "", "demo": ""}, {"name": "DialoSpeech", "title": "DialoSpeech: Dual-Speaker Dialogue Generation with LLM and Flow Matching", "arxiv_id": "2510.08373", "date": "2025-10", "venue": "APSIPA ASC 2025", "org": "", "tier": "deep", "tags": ["dialogue-TTS", "dual-track", "flow-matching", "LLM-TTS", "multi-speaker", "zero-shot", "cross-lingual"], "summary": "双轨架构 (LLM 生成 dual-track semantic tokens + chunked flow matching 合成波形),实现零样本双说话人对话语音合成,仅 10K 小时数据 + 0.5B 模型即达到与百万小时级系统可比的对话自然度", "route": "对话文本 + 双说话人 prompt → BPE text tokens + ECAPA-TDNN speaker embeddings → LLaMA-based DiaLM (causal cross-attention, dual-head) → dual-track semantic tokens → chunked CFM (DiT backbone, block-wise guided attention) → mel spectrogram → BigVGAN-v2 vocoder → 24kHz 双通道波形", "metrics": "中文 CER 2.27% (vs CosyVoice2 2.81%, MoonCast 3.61%) [Table II]; 中文 Spontaneity MOS 3.96 (vs CosyVoice2 3.44, MoonCast 3.87) [Table II]; 英文 WER 8.62% (vs CoVoMix 9.71%) [Table I]; SIM-O 0.67-0.69 [Table I/II]", "takeaway": "(1) block-wise guided attention (causal/history/future mask) 实现固定内存的 chunked flow matching 解码; (2) 数据 pipeline: VAD+Paraformer ASR+Pyannote diarization+OSD+SpatialNet separation 构建 dual-track 对话数据; (3) <SIL> token 在 dual-stream 中隐式建模 turn-taking/overlap", "limitation": "SIM-O 低于 CosyVoice2 (0.69 vs 0.75 中文); 英文 WER 8.62% 显著高于 CosyVoice2 的 2.40%; 仅评估 dual-speaker 场景; 长对话 (分钟级) 因内存限制未探索; 未开源 (承诺开源但尚未)", "concepts": ["ConditionalFlowMatching", "LLM-basedTTS", "SpeechLanguageModel", "SemanticvsAcousticTokens", "SpeakerEmbedding", "Turn-takinginSpokenDialogue"], "source": "Sources/DialoSpeech.pdf", "github": "", "demo": ""}, {"name": "ELLSA", "title": "ELLSA: End-to-End Listen, Look, Speak and Act", "arxiv_id": "2510.16756", "date": "2025-10", "venue": "arXiv (Tsinghua / ByteDance)", "org": "", "tier": "deep", "tags": ["full-duplex", "multimodal", "speech-LM", "embodied-AI", "MoE", "VLA", "robot-manipulation", "turn-taking"], "summary": "ELLSA 是首个端到端全双工模型,通过 SA-MoE 架构将 speech expert 和 action expert 用 shared attention 连接,实现同时听+看+说+做的四模态 MIMO 交互", "route": "Speech → Mamba encoder → MLP adapter → Speech Expert (LLaMA-3.1-8B) ←SA-MoE attention→ Action Expert (Emu3-Base) ← VisionVQ + FAST tokenizer; Speech Expert → Synthesizer Adapter → CosyVoice2-0.5B → 语音输出 [§3, Fig 1]", "metrics": "LIBERO 平均成功率 89.4% (超 pi0-FAST 85.5%); Llama Q. S2S 70.0 (超 Freeze-Omni 56.2); 对话 turn-taking 100%; Speaking-while-acting 时性能下降可控 (SPEAR encoder 版本下降 <3%)", "takeaway": "SA-MoE 的\"shared KV cache + 独立 FFN\"设计可迁移到任何需要融合异构预训练模型的场景; 将 VLA 和 speech LLM 通过 attention 桥接的思路", "limitation": "仅在 LIBERO 仿真环境验证,未部署真实机器人; 全双工场景有限 (无 backchannel); speaking-while-acting 时性能有可见下降 (尤其难题); 2-expert 设计绑定了模态分组", "concepts": ["Full-duplexSpokenDialogue", "Turn-takinginSpokenDialogue", "StreamingSpokenDialogue", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "SpeechLanguageModel"], "source": "Sources/ELLSA.pdf", "github": "", "demo": ""}, {"name": "Flamed-TTS", "title": "Flamed-TTS: Flow Matching Attention-Free Models for Efficient Generating and Dynamic Pacing Zero-shot Text-to-Speech", "arxiv_id": "2510.02848", "date": "2025-10", "venue": "AAAI 2026", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "flow-matching", "attention-free", "FACodec", "non-autoregressive", "efficiency", "duration-modeling"], "summary": "在 flow matching 的 Denoiser 中用 ConvNeXt 替代 self-attention,利用离散码构造的 semantically enriched prior 保持语义,同时引入概率化 Duration & Silence Generator 增强时间多样性。", "route": "Phonemes → Phoneme Encoder → Duration/Silence Generator (CFM-based) → Length Regulator → Code Decoder (6层 FFT, 含 speech prompt) → 6-code folding+CNN → Denoiser (DiT w/ ConvNeXt, no self-attn) → FACodec Decoder → Waveform", "metrics": "WER 4% (LibriSpeech test-clean, 5s prompt), UTMOS 3.87, SIM-O 0.51; RTF 0.028 (NFE=32, A100); 仅用 500h LibriTTS 训练,143M trainable params [Table 1, Table 2]", "takeaway": "(1) 当 prior 携带足够语义时可移除 Denoiser 的 self-attention 换取 L^2*d → L*k*d 复杂度; (2) flow matching 训练 Duration/Silence Generator 实现 NAR 模型的动态节奏; (3) code folding (B*6*L*D → B*L*6D → CNN → B*L*D') 作为多码本合并策略", "limitation": "仅在 LibriTTS 500h 英语数据训练和评估,无多语言/大数据量验证; UTMOS 不及 Spark-TTS (4.33 vs 3.87); SIM-O/SIM-R 不及 Spark-TTS; 无 MOS 人工评测; FACodec 作为 frozen codec 限制了上界", "concepts": ["ConditionalFlowMatching", "DurationPredictor", "SpeechFactorization", "ResidualVectorQuantization", "Non-autoregressiveTTS"], "source": "Sources/Flamed-TTS.pdf", "github": "", "demo": ""}, {"name": "MAVE", "title": "Speak, Edit, Repeat: High-Fidelity Voice Editing and Zero-Shot TTS with Cross-Attentive Mamba", "arxiv_id": "2510.04738", "date": "2025-10", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-editing", "zero-shot-TTS", "Mamba", "SSM", "cross-attention", "codec-LM", "autoregressive", "RVQ"], "summary": "首个将 Mamba (SSM) + cross-attention 成功应用于 text-conditioned speech editing 和 zero-shot TTS 的 codec LM,以 ~6x 内存优势超越 VoiceCraft", "route": "Text → MFA phonemizer → 4-layer Transformer encoder → phoneme embeddings; Audio → X-Codec (8 RVQ codebooks, 50 Hz) → CM3 causal masking + token rearrangement → 12-layer Mamba decoder (每层后接 cross-attention to text) → delayed stacking → X-Codec decoder → output audio", "metrics": "Speech editing MOS Nat 3.90 vs VoiceCraft 3.77 vs GT 4.00 [Table 1]; Zero-shot TTS SIM 0.57 vs VoiceCraft 0.55 vs GT 0.66 [Table 2]; 内存 6.2 GB vs VoiceCraft 37.9 GB [Table 4]; 均在 RealEdit / LibriTTS 上", "takeaway": "(1) Mamba 处理 audio tokens + cross-attention 处理 text conditioning 的\"分工\"设计,利用 SSM 对高层特征的压缩记忆适配音频、cross-attention 保留文本精度; (2) CM3 causal masking + token rearrangement 实现 AR 框架下的双向上下文; (3) 不用 speaker embedding 而用 reference audio 前缀做 in-context speaker conditioning", "limitation": "(1) 仅与 VoiceCraft/FluentSpeech 对比,未对比 Seed-TTS/F5-TTS/MaskGCT 等当前更强系统; (2) 仅训练 9K h GigaSpeech (英语 16kHz),规模受限; (3) 零样本 TTS 在长句 (>34 词) 时质量下降明显; (4) 代码未开源", "concepts": ["CodecLanguageModel", "ResidualVectorQuantization", "Speech-TextAlignment", "Non-autoregressiveTTS", "TTSEvaluation", "PhonemeRepresentation"], "source": "Sources/MAVE.pdf", "github": "", "demo": ""}, {"name": "Ming-Flash-Omni", "title": "Ming-Flash-Omni: A Sparse, Unified Architecture for Multimodal Perception and Generation", "arxiv_id": "2510.24821", "date": "2025-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["omni-model", "multimodal", "MoE", "continuous-speech-representation", "flow-matching", "VAE-tokenizer", "speech-generation", "image-generation"], "summary": "基于 Ling-Flash-2.0 MoE (100B/6.1B active) 的全模态感知-生成模型,用连续 VAE latents 替代离散 token 实现 speech/sound/music 统一生成,在 vision-language 理解上达到 Gemini 2.5 Pro 水平", "route": "Image/Video → Vision Encoder → VideoRoPE → Ling-Flash-2.0 MoE (100B/6.1B) → text; Audio → Audio Encoder → Ling → text; Text → Ling → Audio Head (Qwen2.5, 0.5B) → flow matching → VAE decoder (12.5Hz, 44.1kHz) → speech/sound/music; Text → Ling → multi-scale queries → single-stream DiT → image", "metrics": "TTS: Seed-zh WER 0.87, SIM 0.72; Seed-en WER 2.19, SIM 0.61 [Table 5]; ContextASR avg 3.30 (best) [Table 8]; Sichuanese CER 2.25% (best) [Table 6]; Vision: MMStar 74.9, MMMU 77.1 [Table 1]; Image gen: GenEval 0.94 (SOTA unified) [Table 2]; Streaming video avg 75.92 (beats Gemini 2.5 Pro 74.99) [Table 11]", "takeaway": "(1) 12.5Hz VAE tokenizer 统一 speech/sound/music — 低帧率 + 44.1kHz 统一采样率 + built-in super-resolution,大幅缩短序列长度 [§2.2]; (2) Multi-stage 可控性训练 — Stage 1 学基础映射, Stage 2 同时注入 voiceprint + text instructions,无需 gradient reversal 即可解耦音色与风格 [§2.2]; (3) Generative segmentation as editing — 把分割重构为\"给香蕉染色\"而非\"输出 mask\",让理解直接监督生成 [§2.3]; (4) RL post-training for vision generation — 多维度奖励 + 离线数据正则化防 reward hacking [§2.3]", "limitation": "SIM 仍低于专用 TTS (Seed-TTS zh 0.80 vs 本文 0.72) [Table 5]; 缺少 MOS 主观评测; 模型非开源权重; 缺乏 discrete vs continuous token 路线的消融对比; modality-specific router 无消融验证", "concepts": ["SpeechLanguageModel", "LLM-basedTTS", "ConditionalFlowMatching", "VariationalAutoencoderforTTS", "SpeechTokenizer", "ModalityAdaptationforSpeechLLM"], "source": "Sources/Ming-Flash-Omni.pdf", "github": "", "demo": ""}, {"name": "ParaStyleTTS", "title": "ParaStyleTTS: Toward Efficient and Robust Paralinguistic Style Control for Expressive Text-to-Speech Generation", "arxiv_id": "2510.18308", "date": "2025-10", "venue": "ACM Conference (submitted)", "org": "", "tier": "deep", "tags": ["TTS", "style-control", "paralinguistic", "prosody", "VITS", "end-to-end", "lightweight", "FiLM"], "summary": "提出两级风格建模 (音素级韵律 GTU + 句子级副语言 FiLM),在 VITS 架构上实现可解释且高效的文本提示式风格控制 TTS", "route": "IPA tokens + prosody tokens → FFT encoder → GTU (prosody) → FiLM (paralinguistic from MPNet) → VAE+Flow+HiFi-GAN → waveform", "metrics": "I-MOS 4.65 / N-MOS 4.36 (vs CosyVoice 4.75/4.57); 风格准确率 emotion 54% / gender 100% / age 57.5% (全面超越 CosyVoice); 推理 121ms / 52M 参数 / 763MB 显存 (vs CosyVoice 4076ms/436M/1852MB) [Table 2-4]", "takeaway": "(1) 将副语言 prompt embedding 分裂为 local (FiLM 调制每个音素) + global (拼接到 flow 条件) 两路注入,以极低参数开销获得双粒度控制; (2) MPNet prompt encoder 可预计算缓存,推理时复杂度降至 O(N^2),适合边缘部署", "limitation": "WER 15.29% (CosyVoice 10.30%); 仅支持 3 种副语言维度 (emotion/age/gender); prompt 为模板化格式 (\"A [Age] [Gender] is speaking [Accent] with [Emotion] emotion\"),非自由文本; 训练数据仅 108h/38 说话人; 无零样本声音克隆能力", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "StyleTransferinTTS", "VariationalAutoencoderforTTS", "NaturalLanguageDescriptionforTTS", "LLM-basedTTS"], "source": "Sources/ParaStyleTTS.pdf", "github": "", "demo": ""}, {"name": "ParsVoice", "title": "ParsVoice: A Large-Scale Multi-Speaker Persian Speech Corpus for Text-to-Speech Synthesis", "arxiv_id": "2510.10774", "date": "2025-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "dataset", "low-resource", "Persian", "multi-speaker", "speech-corpus", "audiobook", "data-pipeline"], "summary": "构建最大公开波斯语 TTS 语料库(2,200h / 1,815 说话人),通过 ParsBERT 句子完整性验证 + 二分搜索边界优化 + 多维质量评估的自动化 pipeline 从有声书中提取 TTS-ready 数据", "route": "有声书音频 → WebRTC VAD 分割 → Google ASR 转写 → ParsBERT 句子完整性验证(不完整则迭代延伸边界) → 二分搜索+线性微调边界优化 → 音频/文本质量评分过滤 → ECAPA-TDNN 说话人聚类 → 标点恢复 → 最终 TTS 子集", "metrics": "MOS 3.6/5, SMOS 4.0/5, 可懂度 MOS 4.0/5 (XTTS 微调, 22 名母语评分者); WER 10.40%(Google ASR) / 17.20%(独立 Whisper), Speaker Sim 80.0% (ECAPA-TDNN) [Table 3, Table 4]", "takeaway": "(1) ParsBERT 句子完整性分类器 + 迭代边界延伸确保分割的句子级完整性(97.4% F1); (2) 二分搜索 + 线性微调的边界优化算法,利用 ASR 转写稳定性作为隐式对齐信号,平均去除 426.9ms 起始/181.6ms 结尾静音; (3) 多维质量评估框架(音频 0-100 + 文本 0-1),可迁移到其他低资源语言", "limitation": "(1) 仅有声书风格(正式朗读),不含对话语音; (2) 仅验证 XTTS 一个架构,泛化性未知; (3) MOS 与 DeepMine 系统不可直接比较(不同评分者/条件); (4) 性别不平衡(67% 男性); (5) 说话人 ID 基于自动聚类而非人工标注", "concepts": ["SpeakerEmbedding", "TTSEvaluation", "PhonemeRepresentation"], "source": "Sources/ParsVoice.pdf", "github": "", "demo": ""}, {"name": "RLAIF-SPA", "title": "RLAIF-SPA: Structured AI Feedback for Semantic-Prosodic Alignment in Speech Synthesis", "arxiv_id": "2510.14628", "date": "2025-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "reinforcement-learning", "post-training", "GRPO", "expressiveness", "prosody", "RLAIF"], "summary": "提出 RLAIF-SPA,用 GRPO 优化结构化 AI 反馈 (4 维韵律-情感标签匹配 + WER 惩罚),在不依赖人工情感标注的情况下联合提升 TTS 的情感表达力和语义准确性", "route": "Text → LLM 标注 4 维情感标签 (Structure/Emotion/Speed/Tone) → MiniCPM-O 生成语音 → ASR (Whisper) 计算 WER reward + Qwen2-Audio 判断标签匹配 reward → GRPO 更新策略", "metrics": "LibriSpeech WER 5.80 (vs Chat-TTS 7.85, F5-TTS 4.87) [Table I]; SIM-O 0.72 (最高) [Table I]; CMOS 7.23 (最高) [Table I]; SER Avg 30.08 (最高) [Table I]", "takeaway": "将 emotional alignment 分解为 4 个正交属性 (Structure/Emotion/Speed/Tone) 并用 LLM 自动标注,可迁移到任何需要多维可控性的 TTS 系统的 post-training 阶段", "limitation": "训练仅用 1000 条 LibriSpeech 子集,泛化性存疑; 4 维标签由 GPT-4o 生成,标注质量依赖 LLM 能力; SER 绝对准确率偏低 (Avg 30% 左右); 未与 DiffRO/Emo-DPO/EmoSteer-TTS 等最相关 baseline 对比", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "DifferentiableRewardOptimization", "TTSEvaluation"], "source": "Sources/RLAIF-SPA.pdf", "github": "", "demo": ""}, {"name": "SAC", "title": "SAC: Neural Speech Codec with Semantic-Acoustic Dual-Stream Quantization", "arxiv_id": "2510.16841", "date": "2025-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-codec", "speech-tokenizer", "disentanglement", "dual-stream", "semantic-acoustic", "single-codebook", "LLM-TTS", "VQ-GAN"], "summary": "将语音 codec 拆为冻结语义流 + 可训练声学流两个独立量化通道,解码端 ConvNeXt 融合,实现迄今最干净的语义-声学解耦和 SOTA 重建质量", "route": "波形 → [冻结 Semantic Tokenizer → VQ → 12.5Hz semantic tokens] + [Acoustic Encoder → VQ → 25/50Hz acoustic tokens] → ConvNeXt Prenet 融合 → Codec Decoder → 波形; 辅助: 语义特征重建 MSE + 说话人嵌入 MSE", "metrics": "高比特率 (875bps): WER 2.35% / UTMOS 4.25 / SIM 0.86; 低比特率 (525bps): WER 2.53% / UTMOS 4.27 / SIM 0.78; TTS (Seed-TTS-eval): WER 1.06% (en) / 0.90% (zh) / UTMOS 4.21 (en) [Table 1/2/9]", "takeaway": "(1) 冻结语义流免除语义-声学优化冲突,可直接移植到任何需要语义保真的 codec 设计; (2) interleaved flattening 按帧率比拼接双流 token 实现单阶段 AR LLM-TTS; (3) 辅助 speaker embedding supervision 用 ERes2Net 提取目标、MLP 预测,简单有效(SIM 0.65→0.78)", "limitation": "仅限语音域,语义 tokenizer 是 ASR 监督训练的,无法直接扩展到音乐/通用音频; TTS 中 SIM 略低于 50Hz codec 的 baseline(37.5Hz tokenizer 的帧率限制)", "concepts": ["SemanticvsAcousticTokens", "SpeechTokenizer", "SpeechFactorization", "ResidualVectorQuantization", "CodecTrainingObjectives", "CodebookCollapse", "Single-codebookvsMulti-codebook", "TokenRateandBitrateTrade-offs", "SpeakerEmbedding", "Multi-scaleSTFTDiscriminator"], "source": "Sources/SAC.pdf", "github": "", "demo": ""}, {"name": "SpeechLMScore", "title": "Reference-free automatic speech severity evaluation using acoustic unit language modelling", "arxiv_id": "2510.00639", "date": "2025-10", "venue": "ACM Multimedia Asia Workshops 2024", "org": "", "tier": "deep", "tags": ["speech-evaluation", "pathological-speech", "self-supervised-learning", "reference-free", "severity", "naturalness", "HuBERT", "language-model"], "summary": "将 TTS 自然度评估指标 SpeechLMScore (HuBERT Layer 1 + k-means + LSTM 困惑度) 跨领域应用于病理语音严重度评估,无需参考转写即可优于传统声学特征", "route": "语音 → HuBERT-Base (Layer 1) → k-means 离散化 → LSTM LM (LibriLight 训练) → perplexity → severity score", "metrics": "NKI-OC-VC r=0.6895 (p<0.001); NKI-SpeechRT r=0.3834 (p<0.001); 噪声相关性仅 r=0.0305 (robust) [Table 1, Table 2]", "takeaway": "SSL 语言模型的困惑度可直接作为语音质量/异常程度的 proxy,无需任何标注数据或参考文本;当需要 reference-free 的语音质量快速筛查时,perplexity 是一个零成本的 baseline", "limitation": "(1) 与 reference-based PER 仍有显著差距 (NKI-SpeechRT: r=0.38 vs r=0.82); (2) 仅在荷兰语口腔癌/放化疗患者上测试; (3) LSTM LM 需约 50k 小时数据训练; (4) 可解释性差", "concepts": ["TTSEvaluation", "Self-SupervisedSpeechRepresentation", "SpeechLanguageModel"], "source": "Sources/SpeechLMScore.pdf", "github": "", "demo": ""}, {"name": "Survey-ResponsibleTTSEvaluation", "title": "Position: Towards Responsible Evaluation for Text-to-Speech", "arxiv_id": "2510.06927", "date": "2025-10", "venue": "ICML 2026", "org": "", "tier": "deep", "tags": ["position-paper", "TTS-evaluation", "MOS", "WER", "SIM", "responsible-AI", "standardization", "fairness"], "summary": "首篇 TTS 评估 position paper,提出三层 Responsible Evaluation 框架 (Fidelity → Comparability → Governance),系统诊断 MOS/WER/SIM/F0 等指标的结构性缺陷,并呼吁将公平性和安全性纳入标准评估协议", "route": "历史回顾 (三时代演进) → 指标缺陷诊断 (Level 1) → 可比性/标准化挑战 (Level 2) → 治理/公平/安全 (Level 3) → 每层可操作建议 → Alternative Views", "metrics": "LibriSpeech test-clean 不同版本致 WER 差异 60% (2.63 vs 4.22) [Appendix A/Table 1]; SIM-o 含/不含 prompt 差异达 0.151 (0.754 vs 0.905) [Appendix B/Table 2]; MOS ceiling 在 4.5+ 饱和 [§3.2]", "takeaway": "(1) 论文评估部分应明确报告 dataset variant/split/size + inference task 定义 + SIM 计算方式; (2) 客观指标改善应结合 uncertainty estimation; (3) 报告 RTF 时需注明硬件/batch size/prompt length/streaming mode", "limitation": "以框架和建议为主,不含新指标或新 benchmark 的技术实现; 公平性和安全性部分停留在问题识别层面,缺乏具体评估协议设计; 主要关注英文/中文 TTS,对低资源语言讨论有限", "concepts": ["TTSEvaluation", "SpeakerVerification", "SpeakerEmbedding", "ProsodyModeling", "Anti-spoofingandDeepfakeDetection"], "source": "Sources/TTSEvaluationPositionPaper.pdf", "github": "", "demo": ""}, {"name": "TASLA", "title": "TASLA: Text-Aligned Speech Tokens with Multiple Layer-Aggregation", "arxiv_id": "2510.14934", "date": "2025-10", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-tokenization", "spoken-language-model", "text-aligned", "prosody", "FSQ", "multi-layer-attention", "low-bitrate"], "summary": "在 text-aligned speech tokenization 框架中引入多层动态注意力(MLDA)和 FSQ,让每个 text 位置自适应融合冻结语音编码器的浅层/深层特征,在 ~2.62 Hz 极低帧率下显著改善韵律保真度", "route": "Speech waveform → Frozen Whisper encoder (32 layers) → MLDA cross-attention (Q=text embeddings, K=layer 32, V=weighted mix of layers 8/16/24/32) → FSQ (d=64, L=8) → Unit decoder → S3 units → CosyVoice vocoder → waveform", "metrics": "LibriSpeech F0-PCC 0.87 vs TASTE 0.80 [Table 1]; Expresso F0-PCC 0.84 vs 0.73 [Table 1]; VoxCeleb Energy-PCC 0.81 vs 0.74 [Table 1]; LibriSpeech UTMOS 3.43 vs TASTE 3.51 [Table 2]; S3 unit accuracy ~10% higher than TASTE [Fig 3]", "takeaway": "用 MLP 产生 per-frame layer mixture weights 的思路可迁移到任何需要从多层 encoder 聚合信息的场景;frozen encoder + learnable mixer 比 trainable encoder 更经济且可解释(可分析哪些层在何时被使用)", "limitation": "S3 unit 性能天花板限制了质量指标的上涨空间(S3 accuracy 提升 10% 但 UTMOS 几乎持平);仅在 LibriSpeech 上训练,数据量有限;WER 略劣于 TASTE (0.12 vs 0.10);未探索端到端生成,仍依赖 S3 unit + vocoder 两阶段解码", "concepts": ["SpeechTokenizer", "FiniteScalarQuantization", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "ProsodyModeling", "Speech-TextAlignment", "TokenRateandBitrateTrade-offs", "SpeechLanguageModel"], "source": "Sources/TASLA.pdf", "github": "", "demo": ""}, {"name": "TKTO", "title": "TKTO: Data-efficient Targeted Token-level Preference Optimization for LLM-based TTS", "arxiv_id": "2510.05799", "date": "2025-10", "venue": "arXiv (SpiralAI)", "org": "", "tier": "deep", "tags": ["preference-optimization", "token-level-optimization", "KTO", "LLM-based-TTS", "data-efficiency", "pronunciation", "Japanese-TTS", "polyphonic-disambiguation"], "summary": "通过构建 contrastive LLMs 自动估计 token-level importance weights,将 KTO 从 sequence-level 推广到 token-level,消除配对数据需求,在日语发音歧义任务上 accuracy 提升 39%、CER 降低 54%", "route": "Unpaired data → KTO 训练 π+ 和 label-flipped π- → log-ratio 计算 token weights → Token-level KTO 优化 πθ → CosyVoice 2 生成语音", "metrics": "日语 Acc 0.668→0.958 (+43%), CER 0.138→0.066 (-52%), Bad 0.095→0.027 (-72%) (Male, unpaired) [Table 1]; 中文 Acc 0.645→0.898, CER 0.024→0.014 [Table 3]; NMOS 4.09→4.21 [Table 2]; ABX win rate 61.3% vs Base [Fig 6]", "takeaway": "(1) Label-flipped KTO 构建 contrastive LLM pair 用于 token-level importance 估计——可推广到任何序列级 PO 需要 token-level 精细化的场景; (2) 无配对数据偏好优化 (KTO) 在 TTS 上的有效性,89.5% 的数据本来无法被 DPO 利用", "limitation": "仅在 0.5B 模型验证,无 scaling 实验; 仅评估日语/中文歧义发音场景,未覆盖英语或通用 TTS 质量; 需额外训练两个 contrastive LLMs (8xA100 ~10min,成本低但仍是额外步骤); 无开源代码/模型", "concepts": ["LLM-basedTTS", "DifferentiableRewardOptimization", "SpeechTokenizer"], "source": "Sources/TKTO.pdf", "github": "", "demo": ""}, {"name": "U-Codec", "title": "U-Codec: Ultra Low Frame-rate Neural Speech Codec for Fast High-fidelity Speech Generation", "arxiv_id": "2510.16718", "date": "2025-10", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["audio-codec", "ultra-low-frame-rate", "RVQ", "speech-tokenizer", "LLM-TTS", "hierarchical-transformer"], "summary": "首个在 5Hz 帧率下实现高保真语音压缩的 neural speech codec,通过 Transformer 帧间依赖建模 + 深层 FRVQ 补偿极端压缩损失,配合 CodecFormer 层级 LM 实现 LLM-based TTS 约 3x 推理加速", "route": "16kHz waveform → 5-stage Conv Encoder (stride 3200) → Transformer bottleneck (8L) → FRVQ (8/16/32/100 layers) → Mirror Conv Decoder → 16kHz waveform; TTS: text+speech tokens → Global Transformer (24L, 序列长度=T) → Local Transformer (8L, patch 内逐 token) → codec decode", "metrics": "Codec 重建 (LibriSpeech test-clean) PESQ 3.20 / STOI 0.93 / SPK-SIM 0.87 @5Hz-32RVQ; TTS SIM-r 0.6757 / WER 1.8 @5Hz; RTF 0.52 @8RVQ-c16384 (vs UniAudio 1.40 @50Hz)", "takeaway": "(1) Transformer bottleneck 在极低帧率 codec 中补偿帧间依赖的设计; (2) CodecFormer 的 global-local 分离将 TxN 序列降为 T,使深 RVQ 对 LLM 推理友好; (3) 系统性 RVQ 深度 vs codebook 大小的消融 (固定 bitrate 约 1kbps 下探索 8-100 层)", "limitation": "PESQ 3.20 / SPK-SIM 0.87 仍低于 DAC 的 4.15/0.95 (但 DAC 在 50Hz); TTS 训练仅用 50k 小时 LibriHeavy,规模较小; 仅评估英语; 未开源训练代码 (demo+权重已开源)", "concepts": ["ResidualVectorQuantization", "TokenRateandBitrateTrade-offs", "CodecTrainingObjectives", "SpeechTokenizer", "CodecLanguageModel"], "source": "Sources/U-Codec.pdf", "github": "", "demo": ""}, {"name": "UASR-LLM", "title": "Adapting Speech Foundation Models for Unified Multimodal Speech Recognition with Large Language Models", "arxiv_id": "2510.22961", "date": "2025-10", "venue": "IEEE TNNLS (submitted)", "org": "", "tier": "deep", "tags": ["audio-visual-speech-recognition", "speech-foundation-model", "visual-speech-recognition", "lipreading", "LLM", "knowledge-distillation", "LoRA", "multimodal-fusion"], "summary": "通过在 frozen SFM 每层插入视觉注入模块 + LLM decoder,实现单一模型统一 ASR/VSR/AVSR,在可比数据量下 LRS3 上超越各 baseline", "route": "Lip video → DistillAV visual encoder → Visual Injection Modules (cross-attn) injected into each frozen SFM block → 2-layer FFN adaptor → LLM (Qwen 2.5-7B + LoRA) → text", "metrics": "LRS3 clean (1759h/1759h): VSR 20.9% WER, ASR 0.84% WER, AVSR 0.69% WER [Table II]; noisy AVSR 3.2% avg WER (433h/433h, UASR-LLM-L) [Table II]", "takeaway": "(1) tanh gating 初始化为 0 的注入模块设计,保证与原始 frozen model 的初始等价; (2) visual injection pretraining 用 clean audio 表征做 teacher 蒸馏,让 corrupted AV input 学会对齐到 clean 空间; (3) 辅助 CTC loss 用独立的 1k vocabulary 而非 LLM 原生 152k vocabulary,解决收敛困难", "limitation": "不做帧压缩 (50 fps 直接送 LLM),推理效率低,作者承认这是未来方向 [§V]; 视觉编码器依赖自有 DistillAV 预训练,非公开通用方案; 仅在英语 LRS3 上评测; VSR 仍落后于使用 100k hr 数据的 LP-Conformer [Table II]", "concepts": ["Self-SupervisedSpeechRepresentation", "ModalityAdaptationforSpeechLLM", "LLM-enhancedASR", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/AdaptingSpeechFoundationModels.pdf", "github": "", "demo": ""}, {"name": "UltraVoice", "title": "UltraVoice: Scaling Fine-Grained Style-Controlled Speech Conversations for Spoken Dialogue Models", "arxiv_id": "2510.22588", "date": "2025-10", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["spoken-dialogue", "style-control", "dataset", "emotion", "controllable-TTS", "instruction-following", "SFT", "expressive-speech"], "summary": "构建首个大规模 (830h, 100K 样本) 多维度细粒度风格控制语音对话数据集,SFT 后端到端 spoken dialogue 模型在风格控制 (MOS +29-42%, IFR +14-40pp) 和通用对话能力 (URO-Bench +8-11%) 上同时显著提升", "route": "UltraChat 文本 → GPT-4o 风格指令注入 → GPT-4o-audio-preview/Edge-TTS/CosyVoice 语音合成 → Whisper ASR 质控过滤 → SFT spoken dialogue 模型", "metrics": "SLAM-Omni-0.5B IFR 28.30→68.39% (+40.09pp); VocalNet-8B MOS 2.85→3.68 (+29.12%); URO-Bench VocalNet-7B SFT Avg Basic 81.56 超过 Qwen2.5-Omni-7B 的 70.69 [Table 4, Table 5, Table 10]", "takeaway": "用 GPT-4o 作为\"风格指令扩写器\"批量生成多样化 style prompt 的数据增强策略; 用 Whisper ASR CER<20% 作为合成语音质控门槛", "limitation": "数据全合成 (GPT-4o 合成文本 + TTS 合成语音),无真人对话数据; 仅单轮对话; 多语言控制在 LLaMA backbone 上失效 (Language IFR +0.00~0.33pp); 固定单一 response 音色", "concepts": ["EmotionControlinTTS", "Instruction-GuidedSpeechSynthesis", "StyleTransferinTTS", "SpeechLanguageModel", "SpokenDialogueEvaluation", "NaturalLanguageDescriptionforTTS"], "source": "Sources/UltraVoice.pdf", "github": "", "demo": ""}, {"name": "UniVoice", "title": "UniVoice: Unifying Autoregressive ASR and Flow-Matching based TTS with Large Language Models", "arxiv_id": "2510.04593", "date": "2025-10", "venue": "arXiv (Work in Progress)", "org": "", "tier": "deep", "tags": ["TTS", "ASR", "unified-model", "flow-matching", "autoregressive", "LLM", "zero-shot", "continuous-representation"], "summary": "首个在单个 LLM 中通过 dual attention mask 统一 AR-ASR 和 flow-matching-TTS 的连续表征框架,在两个任务上均达到或超过现有统一方法", "route": "speech → Whisper encoder + adapter → LLM (causal mask for ASR / bidirectional mask for TTS) → text tokens (ASR) 或 mel spectrogram via flow matching (TTS) → BigvGAN vocoder", "metrics": "ASR WER 3.0/6.3 (LibriSpeech clean/other); TTS SIM 0.56, WER 4.06, UTMOS 3.72 (LibriSpeech-PC) [Table 1]", "takeaway": "dual attention mask 机制(causal vs bidirectional 在同一 transformer 中按任务切换),适用于任何需要同时建模 AR 和 non-AR 目标的多任务框架; text-prefix-conditioned infilling 替代显式 speaker embedding 的零样本方案", "limitation": "仅在 LibriHeavy 50K 小时数据+SmolLM2-360M 上验证,未扩展到大模型/大数据; TTS 质量(SIM 0.56, UTMOS 3.72)显著弱于专用系统(CosyVoice SIM 0.66, F5-TTS UTMOS 3.84); 仅限 ASR+TTS 两任务,未涉及对话/编辑等; 代码已开源但为 work in progress", "concepts": ["ConditionalFlowMatching", "LLM-basedTTS", "SpeechLanguageModel", "Classifier-FreeGuidance", "MelSpectrogram", "SpeakerEmbedding"], "source": "Sources/UniVoice.pdf", "github": "", "demo": ""}, {"name": "VCBBench", "title": "VCB Bench: An Evaluation Benchmark for Audio-Grounded Large Language Model Conversational Agents", "arxiv_id": "2510.11098", "date": "2025-10", "venue": "arXiv (v4, Feb 2026)", "org": "", "tier": "deep", "tags": ["LALM", "benchmark", "evaluation", "Chinese", "real-speech", "robustness", "instruction-following", "voice-conversation"], "summary": "首个基于全真人录音的中文语音对话 LALM 评估基准,涵盖指令遵循、知识和鲁棒性三个维度,揭示开源 LALM 在英语适配和物理干扰鲁棒性方面的系统性短板", "route": "真人录音 (第三方专业录制 + 综艺 Q&A + 双人对话) → 三维评估 (Instruction Following / Knowledge / Robustness) → audio-to-audio API 调用 → ASR 转写 + GPT-4o/Gemini-2.5-Pro 评判 → 逐任务打分", "metrics": "Qwen3-Omni 和 Fun-Audio-Chat 综合最强; TIF 最高 90.45 (Qwen3-Omni); SIF 最高 78.82 (Fun-Audio-Chat); GK 最高 66.86 (Qwen3-Omni); GPT-4o-Audio MTD 仅 33.59 (多轮对话严重失败) [Table 1]", "takeaway": "(1) 将 robustness 评估分解为 Speaker/Environment/Content 三类,每类有 control group 对照的评估设计; (2) text-speech alignment 三模式 ablation (A2T / A2A W/ ASR / A2A W/O ASR) 可复用于任何 LALM 评估; (3) 用同一说话人在不同干扰条件下重新录制保证 speaker 控制变量", "limitation": "(1) 评判依赖 GPT-4o 和 Gemini,评判一致性未充分验证; (2) 仅评估 audio-to-audio 管线,不评估纯文本推理能力作为 baseline; (3) 未评估 full-duplex 交互能力; (4) 数据集规模偏小 (各子集 40-350 条); (5) prompt 策略未优化,可能未充分发挥模型潜力", "concepts": ["TTSEvaluation", "SpokenDialogueEvaluation", "AudioUnderstanding", "Speech-TextAlignment"], "source": "Sources/VCBBench.pdf", "github": "", "demo": ""}, {"name": "Vox-Evaluator", "title": "Vox-Evaluator: Enhancing Stability and Fidelity for Zero-shot TTS with A Multi-Level Evaluator", "arxiv_id": "2510.20210", "date": "2025-10", "venue": "AAAI 2026", "org": "", "tier": "deep", "tags": ["TTS", "evaluation", "speech-correction", "preference-alignment", "DPO", "zero-shot", "error-detection", "reward-model"], "summary": "提出统一的多级评估器 Vox-Evaluator,同时提供 error localization + transcription + quality score,驱动 inference-time 语音纠错和 training-time fine-grained DPO,提升零样本 TTS 稳定性和保真度", "route": "合成语音 X + 目标文本 T → Speech Encoder (wav2vec2.0) + Unit Encoder (BART) → 三路输出 (LSTM→时间戳, MLP→质量分, Decoder→转写文本) → DTW 比对定位错误 → mask+regenerate 纠错 / segment-level DPO 优化", "metrics": "error localization IOU 0.782 (+19.7% vs fine-tuned wav2vec2.0); F5-TTS_refine WER 1.42% (原 1.73%, Seed-TTS test-en) [Table 3]; DPO 后 WER 1.73→1.55%, SIM 0.67→0.683 [Fig 3]; failure rate 12%→6% (TTSDS2) [Table 4]", "takeaway": "(1) 用 focal loss 处理 timestamp prediction 的严重类别不平衡; (2) DTW 在 predicted text 与 GT text 之间做 alignment 来精确定位语义不匹配段; (3) segment-level DPO loss 仅在 error segments 上计算,避免 full-utterance DPO 的信息冗余", "limitation": "evaluator 仅 185M 参数,quality score PCC 0.541 仍有提升空间; speech correction 需 2 轮迭代推理增加延迟; DPO 在 2000 步后 reward saturation 导致性能下降; 训练数据 FGES (22K) 规模不大; 未开源", "concepts": ["TTSEvaluation", "ConditionalFlowMatching", "Non-autoregressiveTTS", "DifferentiableRewardOptimization", "Speech-TextAlignment", "Self-SupervisedSpeechRepresentation", "MaskedGenerativeModeling", "SpeakerVerification"], "source": "Sources/Vox-Evaluator.pdf", "github": "", "demo": ""}, {"name": "video-SALMONN-S", "title": "video-SALMONN S: Memory-Enhanced Streaming Audio-Visual LLM", "arxiv_id": "2510.11129", "date": "2025-10", "venue": "ICML 2026 (submission)", "org": "", "tier": "deep", "tags": ["streaming", "video-understanding", "test-time-training", "TTT", "long-term-memory", "audio-visual", "av-LLM", "KV-cache"], "summary": "首个将 test-time training (TTT) 用作流式视频记忆机制的 av-LLM,通过 TTTMEM 层 (含 long-span prediction loss) + 两阶段训练 + 模态感知记忆读取,在 16k token 预算下处理 3+ 小时视频,长视频 benchmark 上超越流式/非流式基线 3-7%,ELViM 上超越 14.2%", "route": "Video (1 FPS) → Qwen3-VL ViT encoder → Video encodings Xt + Audio → Whisper-Large-v3 → Q-Former aligner → TTTMEM 层 (fast weight 更新 + long-span prediction) → Similarity discarding (固定 N token) → Qwen3-VL 8B LLM + LoRA (rank 128) → [可选] Modality-aware memory reading → text response", "metrics": "Video-MME long 71.3% (vs Qwen3-VL 60.1%, +11.2%) [Table 1]; LVBench 55.6% (vs 47.4%, +8.2%) [Table 1]; ELViM 46.7% (vs non-streaming 28.1%, +18.6%; vs PEMF 38.2%, +8.5%) [Table 1]; 仅用 25% memory tokens 达到 merging 同等精度 [Fig 6]; TTTMEM 仅增加 0.000235 TFLOPs 开销 [Table 7]", "takeaway": "(1) TTT 作为参数化长期记忆: 将序列历史编码到 MLP fast weights 中,比 token merging/discarding 更高效地保留远程信息; (2) Long-span prediction loss: 用 t-T 步的重建目标作为时间一致性正则化,鼓励 fast weights 保留远程依赖; (3) 两阶段训练: Stage 1 冷启动 TTT 参数 + LLM LoRA,Stage 2 冻结 TTT 投影参数只保留 fast weight 更新规则 + 扩展上下文,解耦参数学习与容量扩展; (4) Similarity discarding 优于 merging: 避免 over-smoothing,让 TTTMEM 的 fast-weight 状态保留有用摘要", "limitation": "仅在 8B backbone 上验证; ELViM 依赖 Gemini-2.5-Pro 生成问题; 音频 tokens bypass TTTMEM (无视觉-音频联合记忆); 仅支持理解不支持生成; Stage 1 训练需 32xH800 48h", "concepts": ["AudioUnderstanding", "ModalityAdaptationforSpeechLLM"], "source": "Sources/video-SALMONN-S.pdf", "github": "", "demo": ""}, {"name": "ARDM-DPO", "title": "ARDM-DPO: Direct Preference Optimization for Speech Autoregressive Diffusion Models", "arxiv_id": "2509.18928", "date": "2025-09", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["DPO", "preference-optimization", "autoregressive-diffusion", "zero-shot-TTS", "post-training", "RLHF", "continuous-representation", "expressiveness"], "summary": "首次将 DPO 扩展到自回归扩散模型 (ARDM),在 DiTAR 上实现 F0 方差翻倍 (提升表现力) 和 CER 降低 25% (提升鲁棒性)", "route": "文本+prompt → DiTAR (causal LM + diffusion head) → 连续 token 序列 → 音频; DPO 通过比较 winning/losing 样本的 denoising loss 差异优化策略", "metrics": "Task A: F0V 14.2→29.2 Hz (β=200, 200 steps), SIM 0.770→0.765, WER 5.17→3.73 [Table 1]; Task B: CER 8.37→6.32 (β=1600, 9K steps), SIM 0.711→0.712 [Table 2]", "takeaway": "(1) ARDM 的马尔可夫链视角 + Jensen 不等式近似使 DPO loss 分解为逐 token 逐 timestep 的 denoising error 比较,工程上非常简洁; (2) 用可自动计算的 proxy reward (F0V, CTC NLL) 构建偏好对, 免除人工标注", "limitation": "Task A 训练不稳定需 early stopping; winning/losing 双方 loss 均上升 (与 LLM DPO 类似); 偏好数据构建策略未充分探索; 未开源", "concepts": ["Next-TokenDiffusion", "DifferentiableRewardOptimization", "DiffusionModel", "Classifier-FreeGuidance", "ScoreMatching", "Diffusion-basedTTS"], "source": "Sources/ARDM-DPO.pdf", "github": "", "demo": ""}, {"name": "Align2Speak", "title": "Align2Speak: Improving TTS for Low Resource Languages via ASR-Guided Online Preference Optimization", "arxiv_id": "2509.21718", "date": "2025-09", "venue": "Submitted to ICASSP 2026", "org": "", "tier": "deep", "tags": ["TTS", "GRPO", "preference-alignment", "low-resource", "multilingual", "autoregressive", "IPA", "reinforcement-learning"], "summary": "用 GRPO 在线强化学习 + ASR/SV/PESQ 多目标 reward 优化低资源语言 TTS,在仅 30 分钟配对数据下将 CER 降低 8 倍以上", "route": "IPA 文本 → NAR Encoder → AR Decoder (Koel-TTS) → NanoCodec tokens → 波形; GRPO 阶段用 unpaired text+speaker prompt 生成多样本,CER+SSIM+PESQ 组合 reward 计算优势,更新策略网络", "metrics": "英语 GRPO vs DPO: CER 0.53 vs 0.55 (CFG), SSIM 0.783 vs 0.729 [Table 1]; 葡萄牙语 30min FT+GRPO: CER 3.94% vs baseline 33.00% (>8x 降低) [Fig 3, §3.3]", "takeaway": "(1) IPA tokenization 实现语言无关的 TTS 基座,256 byte-level tokens 即可覆盖所有语音; (2) GRPO 不需要配对数据,只需 unpaired text + speaker audio 即可做 RL; (3) 分段线性 reward 归一化函数设计,将不同量纲指标映射到 [0,1]", "limitation": "仅在 Koel-TTS 380M 上验证; 无人工 MOS 评测; 低资源语言仅测试 3 种 (印地语/葡萄牙语/波兰语); 未讨论 GRPO 训练稳定性问题 (Tongyi 发现 >1500 步后 GRPO 退化)", "concepts": ["LLM-basedTTS", "DifferentiableRewardOptimization", "Classifier-FreeGuidance", "SpeakerVerification", "SpeakerEmbedding", "TTSEvaluation", "ProsodyModeling"], "source": "Sources/Align2Speak.pdf", "github": "", "demo": ""}, {"name": "AnalysingNeuralAudioCodecs", "title": "Analysing the Language of Neural Audio Codecs", "arxiv_id": "2509.01390", "date": "2025-09", "venue": "arXiv 2025 (UTokyo + Keio University + UC Berkeley)", "org": "", "tier": "deep", "tags": ["neural-audio-codec", "speech-tokenizer", "Zipf-law", "Heaps-law", "entropy", "statistical-analysis", "token-properties", "n-gram"], "summary": "首次系统分析 NAC token 序列的语言学统计特性,发现 3-gram 级别最接近自然语言分布,且 \"更像语言的 token\" 与更好的语音质量 (WER/UTMOS) 正相关", "route": "6 种 NAC 模型 (15 配置) → Codec-SUPERB 提取 token → 去重 + 维度偏移拼接 → n-gram (2/3/4/6) 统计分析 (Zipf alpha, Heaps beta/k, entropy/redundancy) → 与 resynthesis 质量 (WER/CER/UTMOS) 做相关分析", "metrics": "3-gram alpha ~2.0-2.3 (最接近 Zipf 理想值 2) [Fig 2]; Heaps' beta 与 WER Pearson r=0.37-0.61, bit reduction rate 与 UTMOS r=-0.55 to -0.78 [Fig 8-9]; 英文/中文趋势一致", "takeaway": "(1) 3-gram Zipf/Heaps 统计量可作为 tokenizer 质量的快速 proxy metric,无需完整 ASR/TTS pipeline; (2) 维度偏移 + boundary token 的多码本拼接处理方法; (3) 语言学统计分析可迁移到任何离散 token 序列 (image/video tokens)", "limitation": "仅 LJSpeech + CSS10 (单说话人朗读); 相关性 r 较弱 (~0.2-0.3 for Zipf); 未与 SSL tokens 同框架对比; 因果方向不明确 (n_d 是混淆因素); 未开源分析代码", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "ResidualVectorQuantization", "CodebookCollapse", "AudioTokenizerTaxonomy", "Single-codebookvsMulti-codebook", "TokenRateandBitrateTrade-offs"], "source": "Sources/AnalysingNeuralAudioCodecs.pdf", "github": "", "demo": ""}, {"name": "AudioMOSChallenge2025", "title": "The AudioMOS Challenge 2025", "arxiv_id": "2509.01336", "date": "2025-09", "venue": "arXiv (challenge summary paper)", "org": "", "tier": "deep", "tags": ["evaluation", "MOS-prediction", "audio-quality", "text-to-music", "TTS-evaluation", "speech-quality", "SSL", "challenge"], "summary": "首个涵盖语音/音乐/通用音频的自动主观质量预测挑战赛,三个赛道分别聚焦 TTM MOS、Audiobox Aesthetics 四轴、多采样率语音 MOS,24 支队伍参赛且普遍超越 baseline", "route": "参赛者典型路线 = SSL 特征 (CLAP/WavLM/MuQ/BEATs) → 回归头 (MLP/KAN/Mamba2) → 多模型集成 (ridge/voting); 评估指标为 system-level SRCC", "metrics": "Track 1 冠军 T09 系统级 SRCC 超 baseline 20.8% (musical quality) / 30.4% (textual alignment) [§IV-B]; Track 3 冠军 T17 SRCC=0.955 vs baseline B03=0.749 [Fig 3]", "takeaway": "(1) 模型集成对 MOS 预测始终有效 — 三个赛道冠军全部使用集成 [§V-A3]; (2) 离散采样率 ID 作为额外输入特征可显著改善跨采样率预测 [§V-A3]; (3) 扩大训练数据未必有效 — Track 2 多数队伍仅用提供数据就超越了用 500h in-house 数据训练的 baseline [§IV-C]", "limitation": "(1) 参赛队伍多集中单赛道,跨赛道通用方案缺乏; (2) Track 2 训练集含 YouTube 数据导致再分发困难; (3) 所有赛道仅考虑 sample-level/system-level 预测,未涉及 distribution-level 评估", "concepts": ["TTSEvaluation", "Self-SupervisedSpeechRepresentation", "Audio-LanguagePretraining", "SVSEvaluationMetrics"], "source": "Sources/AudioMOSChallenge2025.pdf", "github": "", "demo": ""}, {"name": "Audiobook-CC", "title": "Audiobook-CC: Controllable Long-context Speech Generation for Multicast Audiobook", "arxiv_id": "2509.17516", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "audiobook", "long-context", "emotion-control", "style-disentanglement", "self-distillation", "multicast", "context-aware"], "summary": "基于 CosyVoice 2 构建有声书专用 TTS 框架,通过上下文序列建模 + prompt-target 解耦训练 + 情感自蒸馏实现章节级多角色可控生成", "route": "文本→(上下文序列 + 控制序列 + 说话人嵌入)→AR LLM→speech tokens→CFM→BigVGAN→波形", "metrics": "M-MOS 4.25 (chapter, ctx+inst) vs CosyVoice2 3.88 / MOSS-TTSD 3.72 [Table 1]; 混合情感 S-MOS 4.08 vs CosyVoice2 3.67 [Table 4]", "takeaway": "(1) prompt-target 解耦策略——用不同音频做 prompt 和 target 以减少韵律复制; (2) 将指令分解为离散属性标签(emotion + volume + speed)而非端到端的自然语言指令; (3) 利用已训练模型做自蒸馏 + 过滤来扩充高强度情感数据", "limitation": "未开源; 主观评估为主,缺少客观指标(如 PESQ/UTMOS); 训练资源极大(64xA800, 1M小时数据); 仅中文场景验证; 上下文长度的 scalability 未讨论", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "LLM-basedTTS", "SpeakerEmbedding", "SpeechTokenizer", "ProsodyModeling", "StyleTransferinTTS", "Instruction-GuidedSpeechSynthesis"], "source": "https://arxiv.org/abs/2509.17516", "github": "", "demo": ""}, {"name": "BFA", "title": "BFA: Real-time Multilingual Text-to-speech Forced Alignment", "arxiv_id": "2509.23147", "date": "2025-09", "venue": "Under review (IEEE)", "org": "", "tier": "deep", "tags": ["forced-alignment", "CTC", "phoneme-boundary", "multilingual", "real-time", "speech-processing"], "summary": "基于 CTC + universal phoneme encoder 的强制对齐系统,比 MFA 快 240 倍且支持多语言,同时显式建模音素间隙", "route": "语音波形 -> CUPE 声学特征提取 (multi-task: 67 phonemes + 17 groups) -> espeak-ng G2P 文本处理 -> CTC Viterbi DP 对齐 (概率校准 + 层次解码) -> onset/offset 边界 + inter-phoneme gaps", "metrics": "TIMIT recall@20ms 71.4% (vs MFA 71.9%) / recall@60ms 87.9% (vs MFA 82.8%); Buckeye recall@20ms 63.7% (vs MFA 58.1%); 速度 45-240x faster [Table 1, Table 2]", "takeaway": "(1) 概率校准 (log-prob boosting beta=5.0 + floor epsilon=10^-8) 提升低资源语言对齐覆盖率; (2) 层次解码 (silence-aware divide-and-conquer) 将长音频拆成独立子问题; (3) onset+offset 双边界预测揭示 30-40% 音素有 inter-phoneme gap 的事实", "limitation": "严格容忍度 (20ms) 下 precision 较低 (55.6% vs MFA 81.2%),因双边界预测导致总预测数约为 MFA 的 2 倍; BFAworld (35 语言) 在英语上 recall@20ms 仅 60.9%; 仅在英语语料 (TIMIT+Buckeye) 上评估,未验证非英语语言", "concepts": ["DurationPredictor", "PhonemeRepresentation", "Non-autoregressiveTTS"], "source": "Sources/BFA.pdf", "github": "", "demo": ""}, {"name": "BatonVoice", "title": "BatonVoice: An Operationalist Framework for Enhancing Controllable Speech Synthesis with Linguistic Intelligence from LLMs", "arxiv_id": "2509.26514", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "controllable", "LLM", "emotion", "instruction-following", "preference-optimization", "cross-lingual", "operationalism"], "summary": "用 LLM 将自然语言指令解码为显式 vocal features (pitch/energy/spectral centroid),再由专用 TTS 模型 BatonTTS 从这些特征生成语音,实现零指令数据的可控合成", "route": "Instruction + Text → LLM (conductor, Gemini 2.5 Pro) → JSON vocal features (Fv) → BatonTTS (Qwen3-1.7B + CosyVoice2 decoder) → Speech", "metrics": "Emotion Acc. 57.6% (EN, 超 Minimax-2.5-HD 48.6% +9.0 abs) / WER 2.5 (Seed-TTS) / 中文零样本 Emotion Acc. 56.2% (超 CosyVoice 52.0%) [Table 1, Table 3]", "takeaway": "(1) 将抽象控制需求\"物化\"为可量化特征作为中间表示,让 LLM 和 TTS 各做各擅长的事; (2) APO preference optimization 用预训练模型输出作 rejected sample,SFT 模型输出作 chosen sample,无需人工标注偏好数据; (3) vocal features 从 decoder 重建语音中提取而非原始语音,保证特征在合成空间可实现", "limitation": "(1) 推理依赖外部强 LLM (Gemini 2.5 Pro) 生成 vocal features,增加延迟和成本; (2) 人类评估中被 Minimax-2.5-HD 超越 (win rate 30%),流畅度和自然度不足; (3) 特征维度有限 (仅 pitch/energy/spectral centroid),缺乏 duration/rhythm/breathing 等控制; (4) 仅英文训练,中文零样本 WER 2.1 与原生模型有差距", "concepts": ["Instruction-GuidedSpeechSynthesis", "EmotionControlinTTS", "ProsodyModeling", "LLM-basedTTS", "ConditionalFlowMatching"], "source": "Sources/BatonVoice.pdf", "github": "", "demo": ""}, {"name": "BridgingLM-TTSgap", "title": "Bridging the Gap Between Training and Inference in LM-Based TTS Models", "arxiv_id": "2509.17021", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "exposure-bias", "training-strategy", "autoregressive", "long-form-synthesis"], "summary": "提出 prompt-guided hybrid training 方案, 在训练中混入模型自生成 token 模拟推理分布, 配合 EOS-adaptive scheduling, 系统性缓解 LM-based TTS 的 exposure bias", "route": "GT token 序列 → iteration 1 teacher forcing → iteration 2+ 替换部分 GT 为自生成 token (prompt protection 保留前 T1 个 GT) → EOS 预测反馈调节迭代次数 → 单次 backward (L_TF + sum(w_n * L_FR))", "metrics": "CosyVoice2 WER 6.23→4.21 (LibriSpeech), SIM 0.74→0.78; A/B preference 54.3% win vs TF; 仅 1.5x 训练计算量", "takeaway": "EOS 预测作为 exposure bias 严重度指标, 用于动态调节 free running 程度; prompt protection 策略可迁移到任何 AR 语音生成模型的训练", "limitation": "仅在 CosyVoice/CosyVoice2 上验证, 未测试其他 LM-TTS 架构; 短语音 (Seed-TTS, <10s) 改善有限; 未报告长语音专项评估 (如 >30s); 未开源", "concepts": ["LLM-basedTTS", "SpeechTokenizer"], "source": "Sources/BridgingLM-TTSgap.pdf", "github": "", "demo": ""}, {"name": "Cross-LingualF5-TTS", "title": "Cross-Lingual F5-TTS: Towards Language-Agnostic Voice Cloning and Speech Synthesis", "arxiv_id": "2509.14579", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "cross-lingual", "voice-cloning", "zero-shot", "NAR-TTS", "duration-prediction", "forced-alignment"], "summary": "通过 MMS 强制对齐 + speaking rate predictor 移除 F5-TTS 对 audio prompt transcript 的依赖,首次在 NAR flow-matching TTS 上实现跨语言零样本语音克隆", "route": "Audio Prompt → Speaking Rate Predictor (Transformer-based, mel→rate class) → predicted rate + target text phoneme/syllable/word count → target duration; Target Text + Audio Prompt (无 transcript) → Cross-Lingual F5-TTS (DiT, OT-CFM, MMS word boundary 训练) → Mel Spectrogram → Vocos vocoder → Waveform", "metrics": "Intra-lingual: LibriSpeech-PC WER 2.079% (M1) vs F5-TTS 2.205%, UTMOS 3.884 vs 3.797 [Table 2]; SeedTTS-zh WER 1.481% (M2) vs 1.475%, SIM 0.764 vs 0.762 [Table 2]; Cross-lingual test-en: WER 2.496% (M1), SIM 0.543 [Table 3]; Cross-lingual test-zh: WER 1.801% (M2), SIM 0.565 [Table 3]", "takeaway": "(1) Speaking rate 离散化为分类任务 + Gaussian Cross-Entropy loss 处理有序类别的思路,可迁移到任何需要预测连续值的场景; (2) MMS forced alignment 作为多语言 word boundary 工具,可用于其他需要 transcript-free 操作的场景; (3) 不同语言适配不同粒度的 speaking rate predictor(英语用 phoneme-level, 中文用 syllable-level)的发现", "limitation": "(1) 跨语言 SIM 较低(0.543-0.565),说明去掉 prompt transcript 后细微说话人特征(口音/情感)的迁移能力下降 [§5]; (2) speaking rate predictor 仅在中英数据训练,泛化到其他语言的可靠性未充分验证; (3) 相比 LLM-based 跨语言系统(CosyVoice 3/Qwen3-TTS)仍有差距; (4) 需要额外训练独立的 speaking rate predictor 模块", "concepts": ["ConditionalFlowMatching", "DurationPredictor", "Non-autoregressiveTTS"], "source": "Sources/Cross-LingualF5-TTS.pdf", "github": "", "demo": ""}, {"name": "DAIEN-TTS", "title": "DAIEN-TTS: Disentangled Audio Infilling for Environment-Aware Text-to-Speech Synthesis", "arxiv_id": "2509.14684", "date": "2025-09", "venue": "ICASSP 2026", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "environment-aware", "flow-matching", "disentanglement", "cross-attention", "classifier-free-guidance"], "summary": "在 F5-TTS infilling 框架上增加 speech-environment separation + cross-attention environment conditioning,实现 timbre 和 time-varying 背景环境的独立可控零样本 TTS", "route": "环境语音 → SES module (Transformer masking net, STFT 域分离) → clean speech mel + env mel → random span mask → DiT + cross-attention (env 通过 CA 注入, speech+text 通过 concat 注入) → CFM 训练重建 masked environmental speech → 推理时 DCFG + SNR adaptation → vocoder → 环境感知个性化语音", "metrics": "WER 1.93% (silence env, vs F5-TTS 2.87%), SIM-o 0.60 (vs F5-TTS 0.49), MOS 3.84 (vs F5-TTS 3.09); 环境场景 MOS 3.78, ESMOS 3.65 [Table 1, Seed-TTS test-en set]", "takeaway": "(1) cross-attention 注入独立条件优于 concatenation 的实验验证; (2) DCFG 多条件独立引导; (3) SNR adaptation 推理时对齐环境 prompt 的信噪比", "limitation": "仅在 LibriTTS (580h) 上训练, 未验证大规模数据; SES 模块依赖 STFT 域 masking net, 对复杂混响场景的分离质量未评估; 无流式推理; 环境音来自 DNS-Challenge (AudioSet+FreeSound) 人工混合, 非真实录音", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "MelSpectrogram", "SpeechFactorization", "MaskedGenerativeModeling"], "source": "Sources/DAIEN-TTS.pdf", "github": "", "demo": ""}, {"name": "DSM", "title": "Streaming Sequence-to-Sequence Learning with Delayed Streams Modeling", "arxiv_id": "2509.08753", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["streaming", "seq2seq", "ASR", "TTS", "multi-stream", "decoder-only", "speech-text", "latency"], "summary": "提出 Delayed Streams Modeling (DSM),通过将多模态序列预对齐到相同帧率并引入可控 delay,用标准 decoder-only Transformer 实现 streaming seq2seq,在 ASR 和 TTS 上同时达到 SOTA 级性能 [§1]", "route": "[ASR] 24kHz audio → Mimi codec (12.5Hz, 32 RVQ) → audio stream (teacher-forced) + text stream (delayed, sampled) → Transformer backbone (2.6B) → text logits → transcription with timestamps [§3.2]; [TTS] text stream (input) + action stream (output, WORD prediction) + audio stream (output, delayed) → Transformer backbone (1B) + RQ-Transformer sampler → Mimi decode → 24kHz audio [§3.3, Fig 2-3]", "metrics": "ASR avg WER 6.4% on OpenASR (streaming, vs best non-streaming 5.6%) [Table 1]; TTS avg WER 1.72% English long-form (vs Chatterbox 1.95%) [Table 3]; TTS speaker sim 76.46% English (vs Chatterbox 66.92%) [Table 4]; TTS throughput 137.3x real-time at batch 64 on H100 [Table 6]; ASR throughput 380x real-time at batch 256 [Table 10]; ASR latency precision ~300ms around target delay [§4.3.1]", "takeaway": "(1) Delay conditioning: 将 delay 值通过 cosine embedding 注入输入,单模型覆盖全 delay 范围,且性能优于 fixed-delay 变体 [§3.2, Fig 4]; (2) Action stream: 额外输出流预测 \"何时插入下一个词\",解决 TTS 中输入文本缺乏时间对齐信息的问题 [§3.3]; (3) Lookahead text stream: 在主文本输入的同时前馈后续词内容,帮助模型做停顿决策 [§3.3]; (4) CFG distillation: 将 CFG 蒸馏为条件嵌入,使开源模型不需要暴露 unconditional 模式 [§4.2]", "limitation": "需要 word-level 时间对齐的训练数据 (靠 Whisper pseudo-labels) [§3.2]; TTS 主观质量低于 Chatterbox (54.8 vs 67.7 MUSHRA) [Table 5]; speaker encoder 未开源 (安全考量) [§4.2]; 公开版模型仅 0.75B 参数 [Appendix J]; 法语 TTS WER 偏高 (3.26%) [Table 3]", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/CodecLanguageModel|Codec Language Model", "概念库/LLM-basedTTS|LLM-based TTS", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/SemanticvsAcousticTokens|Semantic vs Acoustic Tokens", "概念库/StreamingSpokenDialogue|Streaming Spoken Dialogue", "概念库/ResidualVectorQuantization|Residual Vector Quantization"], "source": "Sources/DSM.pdf", "github": "", "demo": ""}, {"name": "DeepDubbing", "title": "Deep Dubbing: End-to-End Auto-Audiobook System with Text-to-Timbre and Context-Aware Instruct-TTS", "arxiv_id": "2509.15845", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "audiobook", "text-to-timbre", "instruct-TTS", "flow-matching", "multi-speaker", "emotion-control", "context-aware"], "summary": "提出 DeepDubbing 端到端有声书合成系统,用 OT-CFM 从角色文本描述生成 speaker embedding (TTT),再用 LLM + CFM + instruct 实现上下文情感语音合成 (CA-Instruct-TTS)", "route": "书籍文本 → LLM 解析角色描述+情感场景指令 → TTT(CFM, DiT 4层)生成 speaker embedding → CA-Instruct-TTS(LLM 12层 + DiT flow matching + NSF-BigVGAN)→ 多角色有声书", "metrics": "TTT: SA 96-100%, AA 73-90%(除儿童), CMS 2.87/4 (Qwen3-0.6B encoder) [Table 2]; CA-Instruct-TTS: MOS-N 3.33, MOS-E 4.15, WER 2.54% [Table 3]", "takeaway": "(1) 用 CFM 生成 speaker embedding 而非音频级合成——可迁移到任何需要从文本描述获取 speaker 表示的系统; (2) emotion-scene template \"[情感]|[场景]|[文本]\" 的三元组设计简洁有效; (3) 显式 gender label 注入解决了文本描述中性别控制不稳定的问题", "limitation": "(1) 儿童语音性别分类准确率低(SA 仅 90-96%),作者归因于训练数据中成人模仿儿童的混淆; (2) 基座模型 QinYu 未开源,核心 CA-Instruct-TTS 不可复现; (3) 仅有 MOS 主观评测,缺少 speaker similarity (SIM) 客观指标; (4) 训练数据 4000h 内部数据,仅释放 50h 合成数据集", "concepts": ["ConditionalFlowMatching", "SpeakerEmbedding", "NaturalLanguageDescriptionforTTS", "Instruction-GuidedSpeechSynthesis", "Classifier-FreeGuidance", "ProsodyModeling", "EmotionControlinTTS"], "source": "Sources/DeepDubbing.pdf", "github": "", "demo": ""}, {"name": "DiFlow-TTS", "title": "DiFlow-TTS: Compact and Low-Latency Zero-Shot Text-to-Speech with Factorized Discrete Flow Matching", "arxiv_id": "2509.09631", "date": "2025-09", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "discrete-flow-matching", "FACodec", "non-autoregressive", "efficiency", "compact", "factorization"], "summary": "首个将离散 flow matching 应用于零样本 TTS 的系统,通过 factorized probability velocity field 分头建模 prosody 和 acoustic token,以 122-164M 参数实现 UTMOS 3.98 + RTF 0.03-0.07,模型最小 11.7x、推理最快 34x 于 baseline", "route": "Text → Phoneme Encoder → Duration Predictor → Length Regulator → Content Predictor → content embeddings; Speech Prompt → FACodec → (prosody tokens, acoustic tokens, speaker embedding); 两路 + masked tokens → Factorized Discrete Flow Denoiser (DiT + multi-head prediction) → prosody + acoustic tokens → FACodec Decoder → waveform", "metrics": "UTMOS 3.98 / WER 0.05 / SIM-O 0.45 / F0 Acc 0.88 / F0 RMSE 7.97 (LibriSpeech test-clean, 3s prompt, 128 NFE) [Table 1]; MOS naturalness 4.18 / intelligibility 4.41 / similarity 4.42 [Table 2]; 164M params, RTF 0.07 (16 NFE) [Table 3]", "takeaway": "factorized multi-head prediction 机制——用独立 prediction head 为不同属性子空间预测概率速度,可迁移到任何多属性离散生成任务; attribute-type embedding 区分不同属性流的简单有效设计", "limitation": "SIM-O 仅 0.45(低于 F5-TTS 0.66、MaskGCT 0.67),speaker conditioning 过于简单(仅 global AdaLN);依赖预训练 FACodec(NaturalSpeech 3)不可端到端优化;仅在 470h LibriTTS 上训练,未验证大规模 scaling;代码/权重未开源", "concepts": ["ConditionalFlowMatching", "SpeechFactorization", "DurationPredictor", "ResidualVectorQuantization", "Non-autoregressiveTTS", "ProsodyModeling", "SpeechTokenizer"], "source": "Sources/DiFlow-TTS.pdf", "github": "", "demo": ""}, {"name": "DiaMoE-TTS", "title": "DiaMoE-TTS: A Unified IPA-Based Dialect TTS Framework with Mixture-of-Experts and Parameter-Efficient Zero-Shot Adaptation", "arxiv_id": "2509.22727", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "dialect", "multilingual", "MoE", "IPA", "PEFT", "LoRA"], "summary": "基于 F5-TTS,通过 IPA 统一方言前端 + MoE 方言路由 + LoRA/Adapter PEFT,用 ~1.1k 小时数据实现多方言零样本 TTS", "route": "方言文本 → IPA G2P → Unified IPA Phonemes → ConvNeXt V2 Text Encoder → Dialect MoE → DiT (Flow Matching) → Mel Spectrogram → Vocoder", "metrics": "在 6 个方言上报告 WER/MOS/UTMOSv2,整体落后商业系统(Edge TTS/CosyVoice2/Qwen-TTS);消融证明 IPA+MoE 优于 pinyin w/o MoE (CD MOS 2.22 vs 1.23) [Table 2, Table 3]", "takeaway": "(1) IPA 统一前端消除方言 G2P 歧义; (2) MoE 加方言分类辅助 loss 防止风格平均化; (3) 四阶段渐进训练范式(pretrain → transfer → MoE → PEFT 新方言); (4) 简单 pitch/time-scale 增强实现低资源适应", "limitation": "WER 仍高(YUE 76.6%, NAN 92.4%);MOS 普遍 < 3.5;与商业系统差距明显;评估缺少 speaker similarity 指标;Peking Opera 等特殊领域 WER > 39%", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "PhonemeRepresentation", "SpeakerAdaptation", "MelSpectrogram"], "source": "Sources/DiaMoE-TTS.pdf", "github": "", "demo": ""}, {"name": "FireRedTTS2", "title": "FireRedTTS-2: Towards Long Conversational Speech Generation for Podcast and Chatbot", "arxiv_id": "2509.02020", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "dialogue-generation", "podcast", "streaming", "dual-transformer", "speech-tokenizer", "multi-speaker", "context-aware"], "summary": "面向长对话语音生成的流式 TTS 系统,通过 12.5Hz streaming tokenizer + text-speech interleaved format + dual-transformer 架构实现多说话人 podcast 和交互式聊天的上下文感知合成", "route": "Dialogue Text → [S1]text+speech_tokens[S2]text+speech_tokens... (interleaved) → Backbone Transformer (Qwen2.5, predicts 1st RVQ layer) → Decoder Transformer (Qwen2.5, predicts remaining N-1 layers) → Speech Tokenizer Decoder (Vocos-based) → Waveform", "metrics": "Seed-TTS-eval: CER 1.14% (ZH) / WER 1.95% (EN), SIM 0.736/0.665 [Table 2]; Podcast-zh: CER 2.08, SIM 0.753, MCD 7.99, CMOS 0.0 [Table 4]; Podcast-en: WER 3.16, SIM 0.703, MCD 9.06, CMOS 0.0 [Table 4]; Emotion accuracy: 83-93% across 6 emotions [Table 3]; Fine-tuned podcast: 56% win/even vs GT [Fig 4]", "takeaway": "(1) 12.5Hz frame rate 大幅缩短序列长度; (2) Dual-transformer 比 delay-pattern 更好利用上下文; (3) Text-speech interleaved format 天然支持流式逐句生成; (4) Three-stage curriculum: mono→dialogue→SFT", "limitation": "仅支持 3 分钟/4 说话人 podcast; UTMOS 评分低于 Xcodec2/Mimi (3.88 vs 4.13/3.87); 英语 SIM 较低 (0.665); 中文 tokenizer WER 高于 SpeechTokenizer; 未开源", "concepts": ["SpeechTokenizer", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "LLM-basedTTS", "SpeakerEmbedding", "NeuralVocoder"], "source": "Sources/FireRedTTS2.pdf", "github": "", "demo": ""}, {"name": "FuseCodec", "title": "FuseCodec: Semantic-Contextual Fusion and Supervision for Neural Codecs", "arxiv_id": "2509.11425", "date": "2025-09", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["audio-codec", "speech-tokenizer", "RVQ", "semantic-distillation", "contextual-supervision", "cross-modal-alignment", "zero-shot-TTS"], "summary": "提出三种将 HuBERT 语义 + BERT 上下文表征融入 RVQ 量化空间的策略 (latent fusion / global distillation / temporal alignment),在不改变 codec 骨干架构的前提下统一 acoustic-semantic-contextual 三模态。", "route": "语音波形 → Conv encoder → Z → (+ CrossAttn(Semantic, Contextual) [Fusion 变体]) → RVQ 8层 → (Ldistill 对齐 global/temporal semantic-contextual signals [Distill/ContextAlign 变体]) → Conv decoder → 重建波形; TTS 扩展: phoneme → AR Transformer → Q(1) → NAR Transformer → Q(2:8) → FuseCodec decoder → 语音", "metrics": "LibriSpeech test-clean: WER 3.99 / PESQ 3.13 / STOI 0.95 (FuseCodec-Fusion, 4 kbps) vs EnCodec WER 4.04 / PESQ 2.31 / STOI 0.92 (6 kbps); Codec-SUPERB Audio 0.785; TTS WER 8.55 (Distill) vs DM-Codec-TTS 10.26 [Table 2, 3, 4]", "takeaway": "(1) 全局 semantic/contextual vector broadcast 到每个时间步做 distillation — 简单有效的跨模态 temporal supervision; (2) 窗口对齐算法解决 text-speech 长度不匹配; (3) 10% modality dropout 防止过度依赖辅助模态,推理时可仅用 encoder", "limitation": "仅在 LibriSpeech 100h 训练,规模较小; 语义/上下文来自 ASR→BERT pipeline,引入 ASR 误差传播; 只测英语 (多语言仅消融); 与最新单码本方案 (BigCodec/WavTokenizer) 不在同一设计空间; 代码开源但发表在 arXiv,未经 peer review", "concepts": ["ResidualVectorQuantization", "SpeechTokenizer", "SemanticvsAcousticTokens", "Self-SupervisedSpeechRepresentation", "CodecTrainingObjectives", "CodecLanguageModel"], "source": "Sources/FuseCodec.pdf", "github": "", "demo": ""}, {"name": "GRPO-TTS", "title": "Group Relative Policy Optimization for Text-to-Speech with Large Language Models", "arxiv_id": "2509.18798", "date": "2025-09", "venue": "arXiv (ICASSP submission, 4 pages)", "org": "", "tier": "deep", "tags": ["TTS", "reinforcement-learning", "GRPO", "post-training", "LLM-TTS", "reward-design", "CER", "NLL"], "summary": "用现成 ASR 模型 (Whisper) 的 CER + NLL 构建复合 reward,通过 GRPO 微调两类 LLM-based TTS (CosyVoice2 / Llasa-1B),在不引入额外训练模型的前提下显著提升语音可懂度和自然度", "route": "Text → TTS LLM (CosyVoice2 或 Llasa-1B) → G=8 rollouts → Codec Decoder/FM+Vocoder → Speech → Whisper ASR → CER reward + NLL reward → 调和平均 → GRPO policy update", "metrics": "CosyVoice2+GRPO: CER 1.07 (zh, from 1.41) / WER 2.30 (en, from 2.46) / MOS 4.58 (zh, from 4.42); Llasa+GRPO: CER 1.30 (zh, from 7.73!) / WER 2.17 (en, from 4.95) [Table 1, Table 2]", "takeaway": "1) ASR 模型的 NLL 作为 CER 的互补 reward — 在 CER=0 时仍提供区分度; 2) 调和平均组合 reward 对低值更敏感,避免单维度掩盖缺陷; 3) GRPO 仅需 4000 句训练数据即可显著改善两类 TTS 系统", "limitation": "仅 4 页会议论文,细节有限; 未与 DiffRO/DPO 做实验对比; Llasa-1B 自然度无显著改善未深入分析; 代码/模型已开源但论文未详述超参数搜索过程", "concepts": ["LLM-basedTTS", "SemanticvsAcousticTokens", "ConditionalFlowMatching", "SpeakerEmbedding", "SpeakerVerification", "DifferentiableRewardOptimization", "TTSEvaluation", "Gumbel-Softmax"], "source": "Sources/GRPO-TTS.pdf", "github": "", "demo": ""}, {"name": "HD-PPT", "title": "HD-PPT: Hierarchical Decoding of Content- and Prompt-Preference Tokens for Instruction-based TTS", "arxiv_id": "2509.19001", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "instruction-following", "controllability", "speech-tokenizer", "hierarchical-decoding", "FSQ", "CLAP"], "summary": "通过 ASR+CLAP 双监督的 speech codec 将 speech tokens 分解为 content-preference 和 prompt-preference 两种中间表征,再用 LLM + 轻量 decoder 层级化生成(先语义→再风格→最终声学),显著提升 Instruct-TTS 的指令遵循精度", "route": "Text instruction → Qwen2.5-0.5B(AR 生成 hidden states) → 2-layer hierarchical decoder(sequentially 预测 content-pref token → prompt-pref token → speech token) → CosyVoice 2 vocoder(flow-matching + HiFi-GAN) → waveform", "metrics": "MOS-N 4.108 / MOS-S 4.167(TextrolSpeech+EmoVoice-DB 联合测试); DNSMOS 3.84; EMO-SIM 0.753 (vs CosyVoice 2 的 0.714); WER 5.18% [Table 1]", "takeaway": "(1) 用 ASR+CLAP 双监督训练 preference token codec,在 discrete token 空间实现 content/style 分离——可迁移到其他需要 fine-grained 控制的 codec 设计; (2) 层级化 decoder 的\"先语义后风格\"生成顺序,以及 stochastic masking + logit-embedding concat 正则化方案", "limitation": "仅在 TextrolSpeech + EmoVoice-DB 两个数据集上验证; RTF 0.952 比 single-step 的 0.711 慢 34%; 多组件设计增加了低资源语言适配难度; 未开源", "concepts": ["Instruction-GuidedSpeechSynthesis", "LLM-basedTTS", "SpeechTokenizer", "FiniteScalarQuantization", "Audio-LanguagePretraining", "SpeechFactorization", "SemanticvsAcousticTokens", "ProsodyModeling", "EmotionControlinTTS"], "source": "Sources/HD-PPT.pdf", "github": "", "demo": ""}, {"name": "HiStyle", "title": "HiStyle: Hierarchical Style Embedding Predictor for Text-Prompt-Guided Controllable Speech Synthesis", "arxiv_id": "2509.25842", "date": "2025-09", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "style-control", "text-prompt", "diffusion", "contrastive-learning", "hierarchical", "controllability"], "summary": "基于 style embedding 空间的层级聚类观察 (timbre → style),提出两阶段 diffusion predictor 从文本描述分层预测 speaker embedding 和 style embedding,显著提升 text-prompt 可控 TTS 的风格控制精度。", "route": "Text prompt → BERT encoder → (Stage 1) Speaker Embedding Predictor (conditional diffusion) → predicted speaker embedding → (Stage 2) Style Embedding Predictor (residual connection + conditional diffusion) → predicted style embedding → 注入 TTS backbone (SingleCodec + LLaMA)", "metrics": "Volume acc 95.56%, Pitch acc 92.87%, Fluctuation acc 88.02%, WER 3.32%, Style-MOS 3.71 [Table 2]; 消融: 去掉 contrastive learning gender acc 从 98.78% 降至 94.49%, 去掉 style annotation pitch acc 从 91.97% 降至 80.02% [Table 3]", "takeaway": "(1) 对 style embedding 空间做 t-SNE 分析发现层级结构,用此观察指导模型设计的方法论; (2) 统计阈值 + 人类感知迭代校准的数据标注 pipeline; (3) contrastive learning 对齐文本-音频 embedding 空间", "limitation": "仅在内部数据集 (2000h, 20+ timbres) 上验证,无公开数据集对比; TTS backbone 是 SingleCodec+LLaMA,未验证对其他架构的迁移性; 全局 embedding 控制,不支持局部/细粒度风格变化", "concepts": ["StyleTransferinTTS", "NaturalLanguageDescriptionforTTS", "SpeakerEmbedding", "GlobalStyleTokens", "ProsodyModeling", "DiffusionModel"], "source": "Sources/HiStyle.pdf", "github": "", "demo": ""}, {"name": "LatinX", "title": "LatinX: Aligning a Multilingual TTS Model with Direct Preference Optimization", "arxiv_id": "2509.05863", "date": "2025-09", "venue": "arXiv (preprint)", "org": "", "tier": "deep", "tags": ["TTS", "multilingual", "DPO", "zero-shot", "voice-cloning", "autoregressive", "codec-LM", "cross-lingual"], "summary": "在 210M decoder-only Transformer 上通过三阶段训练 (预训练→SFT→DPO) 实现多语言零样本 TTS, DPO 以 WER+speaker-sim 自动标注偏好对, 跨 6 种语言显著降低 WER 并提升客观相似度", "route": "文本 → LatPhon G2P → IPA 音素 → [3s 音频 prompt + 音素] → 12 层 decoder-only Transformer (AR) → Spectrogram Patch Codec indices → VQ-VAE decoder → mel → HiFi-GAN → 波形", "metrics": "WER avg(all) 9.90% (DPO) vs 16.96% (FT) vs 10.65% (XTTSv2, 5-lang) [Table 3]; SMOS avg 3.54 (DPO) vs 3.24 (XTTSv2) [Table 5]; MOS avg 3.35 (DPO) vs 3.45 (XTTSv2) [Table 6]", "takeaway": "Pareto dominance 偏好标注策略 (winner 必须在 WER 和 SIM 双指标上均优于 loser) 可消除 reward hacking; 双指标 (Sim-O 和 Sim-E) 分离 codec 重建损失与模型能力", "limitation": "RTF ~4.85 (仅适合离线); 主观评价者以非母语为主 (尤其 Romanian), 影响 MOS/SMOS 可靠性; 自研 codec 和 G2P 未开源, 复现难度大; DPO 有时损害主观相似度", "concepts": ["LLM-basedTTS", "CodecLanguageModel", "SpeakerEmbedding", "VoiceCloningTaxonomy", "DifferentiableRewardOptimization"], "source": "Sources/LatinX.pdf", "github": "", "demo": ""}, {"name": "LibriQuote", "title": "Computational Narrative Understanding for Expressive Text-to-Speech", "arxiv_id": "2509.04072", "date": "2025-09", "venue": "Findings of ACL 2026", "org": "", "tier": "deep", "tags": ["TTS", "dataset", "expressive-speech", "audiobook", "zero-shot", "flow-matching", "evaluation", "narrative"], "summary": "从有声书角色台词中构建 5.3K 小时表现力语音数据集 LibriQuote,附带叙事语境伪标签,验证其对 flow-matching TTS 微调效果显著优于自回归 TTS", "route": "LibriVox 有声书音频 → BookNLP 台词检测 → Zipformer ASR 转写 → Levenshtein 对齐 → 台词/叙述分割 → LLM (Phi-4) 提取 speech verbs/adverbs → 按表现力过滤子集 Qf (379h)", "metrics": "F5-TTS FT(Qf) ContextMOS 3.33 vs 基线 2.95 (+0.38) [Table 2]; IndexTTS2-Context Win-Rate 54% 达到人类水平, CMOS +0.03 [Table 4]; SparkTTS 从头训练 Full(N∪Q) ContextMOS 3.30 vs 基线 2.94 [Table 2]", "takeaway": "(1) 叙事感知分割思路 -- 按角色台词而非随机句边切分有声书,可获得更纯粹的表现力语料; (2) speech verbs/adverbs 伪标签 -- 低成本自动提取有声书中\"how to say\"信息; (3) LALM-as-Judge 评估表现力的 ContextMOS/Win-Rate 方案", "limitation": "数据集未做 WER-based 过滤可能含少量异常; 叙事语境条件仅在 SparkTTS 从头训练和 IndexTTS2 的情感预测中验证,未在 F5-TTS 等 flow-matching 模型上探索; LibriVox 业余朗读者本身表现力有限", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "NaturalLanguageDescriptionforTTS", "ConditionalFlowMatching", "TTSEvaluation"], "source": "Sources/LibriQuote.pdf", "github": "", "demo": ""}, {"name": "MBCodec", "title": "MBCodec: Thorough Disentanglement for High-Fidelity Audio Compression", "arxiv_id": "2509.17006", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-codec", "RVQ", "disentanglement", "subband-decomposition", "quantizer-dropout", "PQMF", "semantic-acoustic-disentanglement"], "summary": "用 PQMF 子带分解给 RVQ 每层码本分配独立频段监督,将传统\"残差编码\"转变为\"功能编码\",实现语义-声学的彻底解耦和 2.2 kbps 超低比特率高保真重建", "route": "音频 → Neural Encoder → [VQ(HuBERT语义蒸馏) ‖ RVQ(PQMF子带监督)] → Neural Decoder → 重建音频", "metrics": "8cb@25Hz: PESQ 2.98 / SIM 0.90 / WER 4.25 @ 2.2kbps (170x 压缩 [§1]); 16cb@50Hz: PESQ 3.83 / SIM 0.97 / WER 3.24 @ 8.8kbps,全面超越 DAC/EnCodec/SpeechTokenizer [Table 1]", "takeaway": "(1) PQMF 子带监督思路 — 给 RVQ 每层绑定特定频段,增强可解释性且不引入额外 SSL 模型; (2) 非均匀 quantizer dropout — 半高斯分布比 uniform 更匹配 RVQ 残差递减特性", "limitation": "仅评估重建任务(无 TTS 下游验证); 训练仅 2 天单卡 H20,未充分训练; 95k 小时训练但码本大小 2048 需验证利用率; 未开源", "concepts": ["ResidualVectorQuantization", "SemanticvsAcousticTokens", "QuantizerDropout", "SpeechFactorization", "CodebookCollapse", "Single-codebookvsMulti-codebook", "CodecTrainingObjectives"], "source": "Sources/MBCodec.pdf", "github": "", "demo": ""}, {"name": "MELA-TTS", "title": "MELA-TTS: Joint transformer-diffusion model with representation alignment for speech synthesis", "arxiv_id": "2509.14784", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "autoregressive", "mel-generation", "continuous-features", "representation-alignment", "zero-shot", "streaming"], "summary": "用自回归 transformer 生成连续向量 + diffusion 生成 mel chunk 的 tokenizer-free TTS,通过 ASR encoder 对齐中间表征显著提升内容一致性和训练收敛速度", "route": "Text (BPE) + Speaker/Utterance Embedding → Qwen2-0.5B AR Transformer Decoder (6.25Hz) → 连续向量 h → DiT Diffusion (10-step DDIM) → Mel Chunk (50Hz, 80-dim) → HiFTNet Vocoder → Waveform", "metrics": "CER 0.9% (test-zh), WER 2.4% (test-en, 170K h), SS1 0.59/SS2 0.68 (test-en); 主观偏好 66.7% vs CosyVoice 2, 57.3% vs CosyVoice 3 [Table 2, Fig 5]", "takeaway": "(1) 用预训练 ASR encoder 的表征对齐 AR decoder 中间状态,可加速训练 3.3x 且提升内容一致性; (2) 自回归帧率 6.25Hz 远低于 discrete-token 系统的 25-75Hz,大幅降低序列长度", "limitation": "Speaker similarity 在 test-en 上不如 CosyVoice 系列 (SS2 0.68 vs 0.78-0.79),作者归因于 diffusion 模块只能利用 local context; 未开源", "concepts": ["Diffusion-basedTTS", "MelSpectrogram", "Classifier-FreeGuidance", "SpeakerEmbedding", "SemanticvsAcousticTokens", "LLM-basedTTS", "SpeechTokenizer", "NeuralVocoder"], "source": "Sources/MELA-TTS.pdf", "github": "", "demo": ""}, {"name": "MFCIG-CSS", "title": "MFCIG-CSS: Multimodal Fine-grained Context Interaction Graph Modeling for Conversational Speech Synthesis", "arxiv_id": "2509.06074", "date": "2025-09", "venue": "EMNLP 2025", "org": "", "tier": "deep", "tags": ["TTS", "conversational-speech-synthesis", "graph-neural-network", "multimodal", "word-level-prosody", "context-modeling", "GraphSAGE"], "summary": "首个从词级粒度建模对话历史中语义-韵律交互的 CSS 框架,通过双图 (语义交互图 SIG + 韵律交互图 PIG) 显式编码词级文本/语音对后续话语的影响,提升合成语音的对话韵律表现力", "route": "MDH (text+speech) → TOD-BERT 词级文本特征 + Wav2Vec2.0 词级语音特征 + SentenceBERT 句级文本特征 + Wav2Vec2.0-IEMOCAP 句级语音特征 → SIG (词级→句级语义交互图, GraphSAGE 编码) → PIG (词级→句级韵律交互图, GraphSAGE 编码) → Feature Aggregator 融合 Is'+Ip'+当前文本 → FastSpeech 2 Acoustic Decoder → Vocoder → 语音", "metrics": "N-DMOS 3.980 (+0.122) / P-DMOS 3.899 (+0.104) / MAE-P 0.439 / MAE-E 0.314 / MCD 9.53 (vs best baseline I3-CSS, DailyTalk) [Table 1]", "takeaway": "(1) 用 MFA 对齐 + Wav2Vec2.0 + Average Pooling 获取词级语音特征,建立 word-level prosody node 的标准流程; (2) 对交互图设计\"interaction backbone branch + special aggregation node (Is/Ip)\"结构,先逐句传播再全局聚合; (3) 将语义交互和韵律交互拆分为两个独立图分别编码,避免混杂", "limitation": "(1) 仅在 DailyTalk (20h, 2 speakers, 固定交替) 上验证,未验证多说话人真实场景; (2) backbone 为 FastSpeech 2,未探索 LLM-based TTS; (3) 图构建假设词级语义/韵律对 **下一句** 有影响,但未建模跨多句的长距离依赖; (4) 未融入更细粒度声学特征 (emotion, emphasis, pause) 到交互图中; (5) 论文未报告推理延迟和图构建开销", "concepts": ["ProsodyModeling", "EmotionControlinTTS"], "source": "Sources/MFCIG-CSS.pdf", "github": "", "demo": ""}, {"name": "MPO", "title": "MPO: Multidimensional Preference Optimization for Language Model-based Text-to-Speech", "arxiv_id": "2509.00685", "date": "2025-09", "venue": "arXiv (Interspeech format)", "org": "", "tier": "deep", "tags": ["RLHF", "DPO", "preference-optimization", "zero-shot-TTS", "multidimensional-alignment", "regularization", "codec-LM", "post-training"], "summary": "提出 Multidimensional Preference Optimization (MPO),通过 preference set (每维度独立选最优/最差) + CE loss 正则化,实现 LM-based TTS 在 intelligibility/speaker similarity/prosody 三维度的同时偏好对齐 [§3]", "route": "Text → BPE → LLaMA decoder (24L/16H/1024d) → single-codebook acoustic tokens (8192) → neural codec → waveform; 生成 10 candidates per input → 各维度选 max/min 构建 preference set (wset/lset) → DPO + CE loss 联合训练", "metrics": "CER 3.90↓ (base 4.72), SPK SIM 0.577↑ (base 0.548), Prosody RMSE 0.279↓ (base 0.337) [Table 2]; ABX: MPO vs baseline 52.3% win [Fig 3]; vs combined rankings 40.2% win [Fig 3]", "takeaway": "(1) preference set 构建: 多维度独立选极值 + 冲突时选次优/次差,比 combined ranking 更有效; (2) DPO + CE loss 联合训练防退化,简单有效 (λ=10)", "limitation": "(1) 仅在 100h 中文数据上做偏好优化,规模偏小; (2) 无 MOS 主观评价,仅 ABX preference test; (3) 未与 SpeechAlign/UNO/RIO 等已有偏好优化方法直接对比; (4) 三个评估维度由客观指标定义 (CER/SIM/F0 RMSE),未涉及自然度/情感等更主观的维度; (5) 代码/模型未开源", "concepts": ["LLM-basedTTS", "DifferentiableRewardOptimization", "TTSEvaluation", "SpeechTokenizer", "SpeakerEmbedding", "Single-codebookvsMulti-codebook"], "source": "Sources/MPO.pdf", "github": "", "demo": ""}, {"name": "MSR-Codec", "title": "MSR-Codec: A Low-Bitrate Multi-Stream Residual Codec for High-Fidelity Speech Generation with Information Disentanglement", "arxiv_id": "2509.13068", "date": "2025-09", "venue": "arXiv (v3, Feb 2026)", "org": "", "tier": "deep", "tags": ["audio-codec", "disentanglement", "low-bitrate", "TTS", "voice-conversion", "multi-stream", "factorization", "zero-shot"], "summary": "用级联残差架构将语音分解为 semantic/timbre/prosody/residual 四流,不需对抗训练即可隐式解耦,62.5 TPS 低比特率实现高保真重建", "route": "Mel → Enc1(25Hz) → Enc2(12.5Hz) + HuBERT tokens + SPK embedding → Dec1 (base) → +VQ1 prosody → Dec2 → +VQ2 residual → Dec3 → Rec Mel → FreGAN → Waveform", "metrics": "Codec 重建 SIM 0.80-0.83 / UTMOS 4.13-4.15 @ 424-612 bps [Table 1]; TTS WER 3.07 / SIM 0.613 / RTF 0.67 on Seed-TTS-eval [Table 2]", "takeaway": "(1) 级联残差实现隐式解耦,不需 GRL/adversarial loss,训练更稳; (2) 不同流用不同时间分辨率(12.5Hz prosody / 25Hz residual),匹配信息变化速度; (3) Speaker embedding 不参与 token 预测,只在 codec decoder 注入,简化 LM 建模", "limitation": "(1) STOI/PESQ 在低比特率下偏低(信号级重建细节损失); (2) TTS 实验仅在英文 Seed-TTS-eval 上评测,无多语言验证; (3) Vocoder 用的是 16kHz FreGAN,采样率受限; (4) 论文部分性能声明与表格数据不完全一致(见点评)", "concepts": ["SpeechFactorization", "ResidualVectorQuantization", "SpeakerEmbedding", "SemanticvsAcousticTokens", "ProsodyModeling", "LLM-basedTTS", "CodecLanguageModel", "TokenRateandBitrateTrade-offs", "CodecTrainingObjectives"], "source": "Sources/MSR-Codec.pdf", "github": "", "demo": ""}, {"name": "NoVerifiableRewardforProsody", "title": "No Verifiable Reward for Prosody: Toward Preference-Guided Prosody Learning in TTS", "arxiv_id": "2509.18531", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "prosody", "preference-optimization", "DPO", "GRPO", "reinforcement-learning", "reward-design", "Korean-TTS"], "summary": "GRPO 用 CER/NLL reward 优化 TTS 会将韵律坍缩为近单调语音;iterative DPO 仅需 ~200 人类偏好对/轮即可恢复对话韵律且保持 CER 竞争力", "route": "Llasa-1B → Korean continual training (36k h) → single-speaker fine-tune (18 h) → channel-base → {GRPO / iterative DPO (3 rounds)} → evaluation on KoCC-TTS", "metrics": "DPO-R2 ELO 1190.1 (最高) + CER 3.60% | GRPO CER 2.20% (最低) + ELO 753.7 (最低) | channel-base CER 2.90% + ELO 1150.1 [Table 1]", "takeaway": "当目标维度缺乏可验证的自动 reward 时,用极少量人类偏好对做 iterative DPO 是 cost-effective 的修复路径;moving reference (πref = πθr-1) + 不跨轮复用数据的设计防止过优化", "limitation": "仅验证单说话人韩语客服场景;ELO 评估基于 596 votes / 27 人,样本量有限;未与 DiffRO / FPO 等 token-level RL 方法对比;DPO Round 3 已出现收益递减", "concepts": ["ProsodyModeling", "DifferentiableRewardOptimization", "TTSEvaluation", "F0Modeling"], "source": "Sources/NoVerifiableRewardforProsody.pdf", "github": "", "demo": ""}, {"name": "ProsodyEval", "title": "Measuring Prosody Diversity in Zero-Shot TTS: A New Metric, Benchmark, and Exploration", "arxiv_id": "2509.19928", "date": "2025-09", "venue": "ICASSP 2026", "org": "", "tier": "deep", "tags": ["TTS", "evaluation", "prosody", "prosody-diversity", "semantic-tokens", "zero-shot", "benchmark", "metrics"], "summary": "提出 DS-WED (基于 semantic token 加权编辑距离的韵律多样性指标) + ProsodyEval (首个人类标注韵律多样性数据集),系统性 benchmark 了零样本 TTS 系统的韵律多样性", "route": "合成语音对 → VAD 去静音 → SSL 模型 (HuBERT/WavLM) 提取表征 → k-means 离散化 → 加权 Levenshtein 编辑距离 → DS-WED 分数", "metrics": "DS-WED 与人类 PMOS 相关性 r=0.77 [Table 1] (vs log F0 RMSE 0.30, MCD 0.66); RTF 0.110 (vs F0 RMSE 0.549, MCD 0.203) [§4.2]", "takeaway": "(1) 将 semantic tokens 重新定位为韵律度量载体而非语义载体 -- SSL 中间层天然编码韵律; (2) 加权编辑距离作为离散序列差异的可解释度量; (3) duration perturbation 作为诊断 NAR 系统韵律瓶颈的手段", "limitation": "仅在英语上验证跨语言适用性; 仅评估 0.5B 规模单一模型 backbone; DS-WED 不区分\"好的多样性\"和\"坏的多样性\"(如随机错误也会增大编辑距离)", "concepts": ["ProsodyModeling", "Self-SupervisedSpeechRepresentation", "SemanticvsAcousticTokens", "TTSEvaluation", "ConditionalFlowMatching", "MaskedGenerativeModeling", "Non-autoregressiveTTS"], "source": "Sources/ProsodyEval.pdf", "github": "", "demo": ""}, {"name": "Qwen3-Omni", "title": "Qwen3-Omni Technical Report", "arxiv_id": "2509.17765", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["omni-model", "multimodal", "streaming", "speech-generation", "thinker-talker", "MoE", "RVQ", "multi-codebook"], "summary": "30B MoE 全模态大模型,首次证明端到端多模态联合训练可不退化任何单模态性能,在 36 个音频 benchmark 中 32 个开源 SOTA / 22 个总体 SOTA,并通过 multi-codebook + MTP + causal ConvNet 实现 234ms 首包延迟", "route": "`Audio → AuT encoder (0.6B, 12.5Hz) + Image/Video → SigLIP2 → TM-RoPE → Thinker (MoE 30B-A3B, text gen) → Talker (MoE 3B-A0.3B, 条件化于多模态特征 + text tokens) → MTP (残差 codebooks) → Code2Wav (causal ConvNet) → waveform`", "metrics": "SEED test-zh/en WER 1.07/1.39 (超 CosyVoice 3 的 0.71/1.45 中的 en) [Table 13] | MMAU 77.6 (超 Gemini-2.5-Pro 77.4) [Table 7] | VoiceBench 89.5 (接近 Gemini-2.5-Pro 89.6) [Table 7] | WorldSense 54.0 (音视频理解 SOTA) [Table 11] | 首包延迟 234ms (audio) [Table 2] | 文本能力与 Qwen3-30B-A3B 持平 [Table 4-5, §6]", "takeaway": "(1) Talker 与 Thinker 文本表征解耦 -- 离散 text tokens 和 embeddings 信息等价,去掉高维表征传递反而释放了部署灵活性; (2) AuT 从零训练 20M 小时,用 block-wise window attention 兼顾流式和离线; (3) multi-codebook + MTP 替代 CFM,用 codec 表达力换 decoder 简化; (4) 非退化多模态训练的关键: 在文本预训练早期就混入跨模态数据", "limitation": "训练数据/代码未开源 | AuT 训练细节 (decoder 架构/loss) 描述简略 | 长视频理解受限于 positional extrapolation 和 context length | 无 MOS 主观评估 | 高并发下延迟线性增长 (6并发 1172ms)", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation", "概念库/ConditionalFlowMatching|Conditional Flow Matching", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/AudioUnderstanding|Audio Understanding", "概念库/LLM-basedTTS|LLM-based TTS", "概念库/Single-codebookvsMulti-codebook|Single-codebook vs Multi-codebook"], "source": "Sources/Qwen3-Omni.pdf", "github": "", "demo": ""}, {"name": "RL-for-Audio-LLM", "title": "Explore the Reinforcement Learning for the LLM based ASR and TTS system", "arxiv_id": "2509.18569", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["reinforcement-learning", "GRPO", "DiffRO", "ASR", "TTS", "reward-design", "audio-LLM", "CosyVoice"], "summary": "设计轻量级 RL 训练框架统一 audio LLM 的 ASR 和 TTS 后训练,对比 GRPO 与 DiffRO 并提出 Combined+Filter 组合方案 [论文原文]", "route": "Audio Encoder → SGLang LLM (rollout) → FSDP LLM (policy update); ASR: 规则 reward (WER+Hallucination+Keyword); TTS: GRPO + DiffRO + Sample Filter", "metrics": "ASR: WER 9.71 (短) / 6.03 (长), 相对改进 5.3% [Table 1]; TTS: WER 3.414 (zh), SS 77.11 (zh) (Combined+Filter R1,2,3) [Table 2]", "takeaway": "(1) GRPO 与 DiffRO 各有优劣,sample filter 使两者兼容; (2) 规则式 reward 设计 (hallucination detection + keyword) 对 ASR 有效; (3) GPU 交替调度框架 (SGLang rollout + FSDP policy) 提升 RL 训练效率", "limitation": "(1) TTS 实验仅在 CosyVoice2-0.5B 上; (2) 未报 MOS 主观评估; (3) 组合方法 (GRPO+DiffRO) 直接合并反而变差,需 sample filter 才有效,机制未深入分析", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "ResidualVectorQuantization", "TTSEvaluation"], "source": "Sources/RL-for-Audio-LLM.pdf", "github": "", "demo": ""}, {"name": "Semantic-VAE", "title": "Semantic-VAE: Semantic-Alignment Latent Representation for Better Speech Synthesis", "arxiv_id": "2509.22167", "date": "2025-09", "venue": "ICASSP 2026", "org": "", "tier": "deep", "tags": ["TTS", "VAE", "latent-diffusion", "semantic-alignment", "self-supervised-learning", "flow-matching", "zero-shot-TTS"], "summary": "在 VAE 的隐空间中引入 SSL 模型 (WavLM) 的语义对齐正则化,打破高维 latent 下\"重建好但生成差\"的困境,使 F5-TTS 在低资源设定下 WER 从 2.23%→1.95%、SIM 从 0.60→0.64", "route": "waveform → DAC-style CNN encoder → 64-dim latent z (40Hz) + WavLM 23rd layer 语义正则 → AMP Block decoder → waveform; 下游: latent z 替代 mel 输入 F5-TTS (flow matching DiT)", "metrics": "WER 1.95% / SIM 0.64 (LibriSpeech-PC test-clean, F5-TTS + Semantic-VAE, 159M, 0.6kh); 重建 PESQ 3.74 / STOI 0.96 (LibriTTS test-other) [Table 1, Table 2]", "takeaway": "用 SSL 中间层 (而非最后层) 的 cosine similarity loss 对 VAE latent 做语义正则,成本极低 (仅加一个 Align MLP + frozen SSL) 但显著加速收敛并提升生成质量;WavLM 第 23 层是 WER-SIM 最优 trade-off 的发现可直接迁移", "limitation": "仅在 F5-TTS Small (159M) 和 E2 TTS (157M) 上验证,未测试大规模模型; 训练数据仅 0.6kh (LibriTTS),未验证数据规模效应; 仅评估英文; 未与 MegaTTS 3 等同期 VAE-based TTS 对比; 未讨论 sigma-VAE / LatentLM 等 VAE 变体", "concepts": ["VariationalAutoencoderforTTS", "Self-SupervisedSpeechRepresentation", "ConditionalFlowMatching", "SemanticvsAcousticTokens", "CodecTrainingObjectives", "MelSpectrogram"], "source": "Sources/Semantic-VAE.pdf", "github": "", "demo": ""}, {"name": "SpeechWeave", "title": "SpeechWeave: Diverse Multilingual Synthetic Text & Audio Data Generation Pipeline for Training Text to Speech Models", "arxiv_id": "2509.14270", "date": "2025-09", "venue": "ACL 2025 (Industry Track)", "org": "", "tier": "deep", "tags": ["TTS", "data-generation", "text-normalization", "synthetic-data", "multilingual", "pipeline", "diversity", "speaker-standardization"], "summary": "提出 SpeechWeave,一个端到端合成 TTS 训练数据管线,通过 keyphrase 多样性注入 + at-source text normalization + 跨语言说话人标准化,生成比直接 LLM prompting 多样性高 10-48% 且规范化准确率达 97% 的多语言训练数据", "route": "业务域 → 多步 LLM prompting → keyphrases → keyphrase store (去重) → keyphrases + entity sampler (at-source normalization) → 文本脚本 → 后处理 → MeloTTS 合成 → OpenVoice V2 tone color conversion → 标准化音频", "metrics": "分组相似度↓45.8%(EN)/44.4%(ES) vs 直接 prompting [Table 3]; 规范化准确率 0.97(EN)/0.94(ES) vs NeMo 0.67/0.54 [Table 4]; 下游 StyleTTS 2 WER 15.37%→9.36%(EN, -40%相对) [Table 6]", "takeaway": "at-source normalization 思路——在生成 semiotic class 实体的同时生成其规范化形式,避免后处理 normalizer 的覆盖盲区;keyphrase infusion 增加 LLM 文本生成多样性", "limitation": "仅评估英语和西班牙语;下游评估仅用 StyleTTS 2 + WER 单一指标;未评估说话人标准化的 speaker similarity;西班牙语 baseline WER 85% 说明基模型本身不支持西班牙语,使改进幅度的意义打折扣", "concepts": ["Text-to-SpeechPipeline", "TTSEvaluation", "PhonemeRepresentation"], "source": "Sources/SpeechWeave.pdf", "github": "", "demo": ""}, {"name": "TMD-TTS", "title": "TMD-TTS: A Unified Tibetan Multi-Dialect Text-to-Speech Framework", "arxiv_id": "2509.18060", "date": "2025-09", "venue": "ICASSP 2026 (submitted)", "org": "", "tier": "deep", "tags": ["TTS", "multi-dialect", "low-resource", "Tibetan", "dynamic-routing", "flow-matching", "dataset-generation"], "summary": "在 Matcha-TTS 基础上增加 dialect fusion + DSDR-Net(public/private FFN 动态路由),实现三方言统一藏语 TTS,并构建了 102h 合成方言数据集 TMDD", "route": "藏文字符 → Tokenizer → Text Encoder + Dialect Fusion(dialect embedding 线性投影加到 text hidden) → Duration Predictor → Flow Prediction Network (Transformer w/ DSDR-Net) → Mel Spectrogram → BigVGAN Vocoder → Waveform", "metrics": "Ü-Tsang/Amdo/Kham 三方言: PESQ 3.03/3.13/3.05, STOI 94.52/94.92/93.17%, DECS 88.09/79.17/67.65%, nMOS 3.83/3.84/3.86 [Table 1]; 消融: 去掉 DSDR-Net DCA 从 80.25% 降至 60.12% [Table 2]", "takeaway": "(1) \"public FFN + private FFN\" 的条件计算路由设计,可迁移到任何需要风格/方言/情感条件控制的 Transformer TTS; (2) 合成数据质量筛选 pipeline(DECS>0.8 + PESQ<3 的用 MetricGAN+ 增强 + 人工抽查)", "limitation": "nMOS 最高 3.86(中等水平); RTF 0.031 略慢于 VITS2; 仅在藏语验证,未证明推广到其他低资源多方言场景; 未开源代码(截至论文发表)", "concepts": ["ConditionalFlowMatching", "MelSpectrogram", "DurationPredictor", "NeuralVocoder", "SpeakerEmbedding", "Non-autoregressiveTTS"], "source": "Sources/TMD-TTS.pdf", "github": "", "demo": ""}, {"name": "VARSTok", "title": "VARSTok: Variable-Frame-Rate Speech Tokenization via Adaptive Clustering and Implicit Duration Coding", "arxiv_id": "2509.04685", "date": "2025-09", "venue": "arXiv (USTC + Alibaba Tongyi Fun Team)", "org": "", "tier": "deep", "tags": ["audio-codec", "speech-tokenizer", "variable-frame-rate", "single-codebook", "VQ", "clustering", "duration-modeling", "TTS"], "summary": "首个 fully dynamic variable-frame-rate acoustic speech tokenizer,通过 temporal-aware 密度峰聚类 + implicit duration coding 在 30.95 Hz 平均帧率下超越 40 Hz fixed-rate baseline 的重建和 TTS 质量", "route": "Waveform → CNN Encoder (产出 fixed-rate frame embeddings) → Temporal-Aware Density Peak Clustering (聚合为 variable-length clusters) → Mean Pooling → VQ (K=4096 单码本) + Implicit Duration Coding (ID = (d-1)*K + k) → Repeat by duration → CNN Decoder → Waveform", "metrics": "重建 UTMOS 3.89 / PESQ 1.71 @ 30.95 Hz (vs WavTokenizer 40Hz: 3.61 / 1.71) [Table 1]; TTS WER 6.79% / UTMOS 4.25 / MOS 4.05 @ 36.81 Hz (vs WavTokenizer: 7.48% / 3.92 / 3.98) [Table 3]; RTF 0.487 (36% speedup) @ 26.29 Hz [Table 5]", "takeaway": "(1) Implicit duration coding: 将 duration 编码进 token index ((d-1)*K + k) 的做法极其简洁,任何需要处理变长 token 的系统都可复用; (2) Density peak clustering 的 temporal-aware 约束:在标准 DPC 基础上加 bidirectional temporal contiguity 约束,确保聚类结果是时间连续的段", "limitation": "仅在 585h LibriTTS 上训练,未验证大规模数据; Smax=4 的硬约束限制了最大压缩比; 聚类算法不可微,encoder 无法直接从聚类决策获得梯度; 代码已开源但模型权重情况不明", "concepts": ["SpeechTokenizer", "ResidualVectorQuantization", "CodebookCollapse", "TokenRateandBitrateTrade-offs", "Single-codebookvsMulti-codebook", "DurationPredictor", "CodecLanguageModel"], "source": "Sources/VARSTok.pdf", "github": "", "demo": ""}, {"name": "VoXtream",
