"title": "VoXtream: Full-Stream Text-to-Speech with Extremely Low Latency", "arxiv_id": "2509.15969", "date": "2025-09", "venue": "IEEE (推测 ICASSP 2026, 论文含 IEEE copyright 但未明确标注)", "org": "", "tier": "deep", "tags": ["TTS", "streaming", "zero-shot", "autoregressive", "low-latency", "full-stream"], "summary": "首个 full-stream(输入侧+输出侧同时流式) zero-shot TTS,通过 incremental phoneme transformer + 有限 look-ahead 实现 102ms 首包延迟,以 9k 小时数据比肩大规模非流式系统", "route": "Phoneme stream → Incremental Phoneme Transformer (有限 look-ahead) → Temporal Transformer (semantic token + duration token) → Depth Transformer (acoustic tokens, 冻结 CSM 权重) + ReDimNet speaker embedding → Mimi decoder → waveform", "metrics": "FPL 102ms (torch.compile, A100); WER 3.82%/3.09% (SEED-en/LibriSpeech), SPK-SIM 0.529/0.461, UTMOS 3.88/4.08; Full-stream naturalness preference 57% vs CosyVoice2 31% [Table 1-3]", "takeaway": "(1) Incremental phoneme encoding with limited look-ahead: 不等全文,每来一个词就开始编码,过去状态随新上下文更新; (2) 冻结大规模预训练的 Depth Transformer (CSM-DT) 做知识迁移,用外部 speaker encoder 补偿 speaker similarity; (3) Duration token = shift flag + phoneme count 的联合编码方式,实现单一 classification head 同时预测语义和时长", "limitation": "SPK-SIM 明显低于 CosyVoice 2 等使用 NAR flow-matching decoder 的系统 (0.529 vs 0.656 on SEED-en); 仅训练于 9k 小时英语数据,无多语言支持; 仅 441M 参数,模型较小; 无显式 speaking-rate control", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "SpeakerEmbedding", "LLM-basedTTS", "DurationPredictor", "PhonemeRepresentation", "Speech-TextAlignment"], "source": "Sources/VoXtream.pdf", "github": "", "demo": ""}, {"name": "VoxCPM", "title": "VoxCPM: Tokenizer-Free TTS for Context-Aware Speech Generation and True-to-Life Voice Cloning", "arxiv_id": "2509.24650", "date": "2025-09", "venue": "arXiv preprint", "org": "", "tier": "repro", "tags": ["TTS", "zero-shot", "tokenizer-free", "hierarchical-modeling", "flow-matching", "end-to-end", "semi-discrete", "LLM-based"], "summary": "通过可微 FSQ 瓶颈实现 TSLM(语义骨架) + RALM(声学残差) 的隐式分工,端到端训练无需外部 speech tokenizer 的 0.5B zero-shot TTS", "route": "Text → TSLM (MiniCPM-4 init) → FSQ 瓶颈(semi-discrete skeleton) + RALM(连续残差) → LocDiT (local diffusion) → Causal VAE decoder → 16kHz waveform", "metrics": "SEED-TTS-Eval EN-WER 1.85% / ZH-CER 0.93% (开源 SOTA); CV3-Hard-EN WER 7.89% (超闭源 CosyVoice 3); RTF 0.17 on RTX 4090 [Table 3, 4]", "takeaway": "FSQ 作为内部正则化瓶颈(不是预测目标)诱导 semantic-acoustic 分工; 残差连接实现功能分离但不割裂架构; WSD 两阶段 lr schedule 显著提升 zero-shot similarity", "limitation": "仅支持中英文; 无显式韵律/情感控制; 仅 16kHz (非高保真 24kHz/44.1kHz); 内部数据集 1.8M 小时不可复现", "concepts": ["FiniteScalarQuantization", "ConditionalFlowMatching", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "LLM-basedTTS", "SpeechTokenizer", "Classifier-FreeGuidance", "VariationalAutoencoderforTTS", "Next-TokenDiffusion"], "source": "Sources/VoxCPM.pdf", "github": "", "demo": ""}, {"name": "VoxRole", "title": "VoxRole: A Comprehensive Benchmark for Evaluating Speech-Based Role-Playing Agents", "arxiv_id": "2509.03940", "date": "2025-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["benchmark", "evaluation", "role-playing", "spoken-dialogue", "persona-consistency", "paralinguistic", "speech-LM"], "summary": "首个面向语音角色扮演的 benchmark,从 261 部电影自动提取 13335 段多轮对话 (65.6h) + 1228 个角色的四维画像,用 metric-based + acoustically-aware LLM judge 六维评估当代 spoken dialogue model 的角色扮演能力", "route": "电影(剧本+音频) → Resemble 去噪 + Whisper ASR + wav2vec2.0 forced alignment → 最小编辑距离词级对齐 → MPNet 语义验证(阈值 0.8) → LLM 事件摘要 → 四维角色画像(personality/linguistic style/relationship/acoustic) → 角色扮演 prompt → 6 维 LLM-based 评估 + metric-based 评估", "metrics": "GPT-4o Overall 4.28 最佳; Qwen2.5-Omni (7B) Overall 3.72 为开源最佳且 UTMOS 3.57 接近 GPT-4o (3.66); 132B Step-Audio 语义最强 (BertScore 84.16) 但语音最差 (UTMOS 2.42); LLM-human Pearson r=0.762 [Table 2, 3]", "takeaway": "(1) acoustically-aware LLM judge 思路 -- 用 Emotion2Vec 情感标签 + pitch/energy/rate 离散特征增强文本后交给 LLM 评分,可用于任何需要评估声学表现力的场景; (2) 电影剧本-音频自动对齐 pipeline 可复用于构建其他语音数据集; (3) 四维角色画像的层级设计思路 (心理核心→社会关系→语言风格→声学特征)", "limitation": "仅英语电影; 角色画像验证规模小 (20 人 x 5 标注员); 评估仅覆盖单轮响应,未测试多轮角色一致性和全双工场景; acoustic 维度仅用 pitch/energy/rate 三个粗粒度离散特征,缺少 timbre/emotion 细粒度评估; 未开源数据集和评估代码", "concepts": ["SpokenDialogueEvaluation", "ProsodyModeling", "TTSEvaluation"], "source": "Sources/VoxRole.pdf", "github": "", "demo": ""}, {"name": "WeSCon", "title": "Word-Level Emotional Expression Control in Zero-Shot Text-to-Speech Synthesis", "arxiv_id": "2509.24629", "date": "2025-09", "venue": "NeurIPS 2025", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "zero-shot", "self-training", "word-level-control", "speaking-rate-control", "attention-bias", "CosyVoice2"], "summary": "WeSCon 通过两阶段 self-training 框架,首次在不依赖含情感转换数据的条件下实现了零样本 TTS 中的 word-level 情感和语速联合控制", "route": "文本 + 多个情感 prompt → [Stage 1: 多轮推理 + transition smoothing + dynamic speed control → teacher 生成伪标签] → [Stage 2: student TTS (CosyVoice2 + DEAB) 端到端推理] → flow matching + vocoder → 语音", "metrics": "Emo2v. 0.882 / Aro. 0.468 (EN), DNSV 4.361 (EN, 越低越好, CosyVoice2 baseline 7.894), EMOS 3.70±0.17, NMOS 3.93±0.20 [Table 1, Table 2]; 零样本 TTS 性能 CER 1.47 / S-SIM 0.744 与 CosyVoice2 几乎一致 [Table 3]", "takeaway": "(1) 多轮推理 + tail-to-head linkage 解决多情感段拼接的不连续性; (2) 用 self-training 绕过细粒度标注数据的稀缺; (3) Dynamic Emotional Attention Bias — 7 种预定义 bias 模板的加权组合,轻量且高效; (4) 语速控制通过简单的 prompt token 插值/下采样实现,50%-200% 范围内稳定有效", "limitation": "(1) 仅支持离散情感类别,不支持混合/渐变情感; (2) 情感转换方案由 GPT-4o 预定义,缺乏上下文自适应; (3) ESD 数据集情感/说话人多样性有限导致 500h 后过拟合; (4) NeurIPS 2025 论文,代码计划开源但截至目前未见完整发布", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "ProsodyModeling", "SpeechTokenizer", "SpeakerEmbedding", "Speech-TextAlignment"], "source": "Sources/WeSCon.pdf", "github": "", "demo": ""}, {"name": "Audio-Thinker", "title": "Audio-Thinker: Guiding Audio Language Model When and How to Think via Reinforcement Learning", "arxiv_id": "2508.08039", "date": "2025-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["LALM", "reinforcement-learning", "GRPO", "adaptive-reasoning", "audio-QA", "reward-design", "think-reward", "consistency-reward"], "summary": "首个系统性的音频-语言 RL 推理框架,通过四层渐进式 reward 设计 (format + adaptive accuracy + consistency + think) 让 LALM 学会根据问题难度自适应决定是否推理、以及如何推理,在 MMAU/MMAR/AIR 三大基准上刷新 SOTA", "route": "已有 LALM (Qwen2-Audio / Qwen2.5-Omni) → Adaptive Think Prompt → GRPO (8 rollouts/step) → 四层 Reward: R = R_a x (1 + 0.5 R_c) + 0.5 R_f + R_t → 1000 steps, 8xH20 GPU, LoRA rank=8", "metrics": "MMAU Test-mini Avg 73.70 (Qwen2.5-Omni base: 66.30, +7.4); MMAR Avg 65.30 (base: 56.70, +8.6); AIR Avg 67.1 (base: 65.2, +1.9); MMAU-v05.15.25 Test-mini 78.00 (SOTA) [Tables 1-5]", "takeaway": "(1) 批次级 think/no-think 比例的软惩罚因子防止模式坍缩; (2) 外部 LLM 做 think reward 评审弥补 accuracy-only 奖励的推理质量盲区; (3) 渐进式 reward 叠加的消融实验设计方法论", "limitation": "仅用 AVQA 40k 样本训练 (视频转音频的代理数据); 仅在 MCQ 上评估,未涉及开放式生成; Think Reward 依赖外部 Qwen3-8B-Base 评审,推理时不用但训练时增加成本", "concepts": ["AudioUnderstanding", "SpeechLanguageModel", "Audio-LanguagePretraining"], "source": "Sources/Audio-Thinker.pdf", "github": "", "demo": ""}, {"name": "CLEAR", "title": "CLEAR: Continuous Latent Autoregressive Modeling for High-quality and Low-latency Speech Synthesis", "arxiv_id": "2508.19098", "date": "2025-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "continuous-representation", "autoregressive", "rectified-flow", "VAE", "streaming", "low-latency"], "summary": "提出 CLEAR,用增强 wav-VAE (shortcut connections + 2048x downsampling) 编码连续 latent + MLP-based rectified flow head 逐 token 建模连续分布,实现单阶段零样本 TTS,RTF 0.18 + 96ms 流式首帧延迟", "route": "Text (phoneme) + Speech prompt → VAE encoder → continuous latents → AR Transformer (conditioning h_k) → Rectified Flow Head (per-token) → continuous latents → Causal VAE decoder → waveform", "metrics": "WER 1.88%, UTMOS 4.22, SIM-o 0.59, RTF 0.18 (Base) / 0.29 (Large) on LibriSpeech Subset-B [Table 1]; streaming FFL 96ms [Table 4]; 仅 78 AR decoding steps per 10s", "takeaway": "1) shortcut-connected VAE 实现 2048x 压缩; 2) MLP rectified flow head 支持流式 (不需等全序列); 3) logit-normal timestep sampling 加速收敛; 4) 辅助 velocity direction loss", "limitation": "仅英语评估; SIM-o 相对偏低 (0.55-0.59); 不支持多 token 并行预测", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "SpeechTokenizer", "LLM-basedTTS", "DiffusionModel"], "source": "Sources/CLEAR.pdf", "github": "", "demo": ""}, {"name": "DLPO", "title": "Fine-Tuning Text-to-Speech Diffusion Models Using Reinforcement Learning with Human Feedback", "arxiv_id": "2508.03123", "date": "2025-08", "venue": "Interspeech 2025 (arXiv preprint)", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "RLHF", "reinforcement-learning", "fine-tuning", "waveform-generation", "non-autoregressive", "reward-model"], "summary": "提出 DLPO,将 diffusion 原始训练 loss 作为正则项嵌入 RLHF reward function,解决 text-to-image RL 方法迁移到 TTS diffusion 时的语音质量退化问题", "route": "文本 → WaveGrad 2R (DDPM 去噪 T 步) → 波形 x_0 → UTMOS 评分 reward → 梯度更新 (reward + diffusion loss penalty)", "metrics": "UTMOS 3.65 / NISQA 4.02 / WER 1.2% (LJSpeech 200 test, 优于 base WaveGrad 2R UTMOS 2.90 / NISQA 3.74 / WER 1.5%); 人类评估 67% 偏好 DLPO [§2.3]", "takeaway": "在 RL 微调 diffusion 模型时,将原始训练 loss 嵌入 reward function 作为正则项 — 这是一种通用的 \"task-specific regularization\" 策略,可防止模型偏离预训练分布", "limitation": "仅在单说话人 LJSpeech + WaveGrad 2R 复现模型上验证; UTMOS 作为 reward 存在 reward hacking 风险; 未与同期 token-level RL 方法 (DiffRO/GRPO) 对比; 代码未正式开源 (anonymous link)", "concepts": ["DiffusionModel", "Diffusion-basedTTS", "Diffusion-basedVocoder", "Non-autoregressiveTTS", "TTSEvaluation", "DifferentiableRewardOptimization"], "source": "Sources/DLPO.pdf", "github": "", "demo": ""}, {"name": "DualSpeechLM", "title": "DualSpeechLM: Towards Unified Speech Understanding and Generation via Dual Speech Token Modeling with Large Language Models", "arxiv_id": "2508.08961", "date": "2025-08", "venue": "AAAI 2026", "org": "", "tier": "deep", "tags": ["speech-LM", "speech-tokenizer", "dual-token", "unified-model", "understanding-generation", "LoRA", "semantic-token", "acoustic-token"], "summary": "提出 dual-token 建模框架,用 understanding-driven semantic token 作 LLM 输入、acoustic token 作 LLM 输出,以 4.5K 小时数据和 LoRA 微调实现统一语音理解和生成的互增强", "route": "Speech → Whisper encoder → 2x 下采样 Encoder → 单层 VQ (USToken, 25Hz/250bps) → [理解: USToken→Text LLM→文本输出] [生成: USToken→Text LLM→预测 USToken→AcousticGPT→acoustic token→WavTokenizer decoder→语音]", "metrics": "ASR WER 4.22/9.71 (clean/other), TTS SIM 0.90/WER 9.25/DNSMOS 3.86 (clean); 仅用 4.5K hrs + LoRA, 优于 SpeechGPT (70K hrs) 和 SpiritLM (570K hrs) [Table 1, 2]", "takeaway": "(1) input-output token 解耦 — 不同模态需求用不同 token 处理,避免单一 token 的 trade-off; (2) understanding-driven loss — 在 tokenizer 训练阶段就用冻结 LLM 反传对齐 VQ 空间; (3) CoC 随机条件策略 — 防止 AcousticGPT 过拟合单一条件信号", "limitation": "仅验证英语和少量翻译任务; 数据规模较小 (4.5K hrs) 未验证 scaling; AcousticGPT 仅 6 层,生成质量与 SOTA (Qwen2.5-Omni 等大规模系统) 仍有差距; 依赖外部 WavTokenizer 和 3D-Speaker", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "SpeechLanguageModel", "Self-SupervisedSpeechRepresentation", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "ResidualVectorQuantization", "CodecLanguageModel"], "source": "Sources/DualSpeechLM.pdf", "github": "", "demo": ""}, {"name": "EmoSSLSphere", "title": "EmoSSLSphere: Multilingual Emotional Speech Synthesis with Spherical Vectors and Discrete Speech Tokens", "arxiv_id": "2508.11273", "date": "2025-08", "venue": "13th ISCA Speech Synthesis Workshop", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "multilingual", "self-supervised-learning", "spherical-coordinates", "discrete-tokens", "prosody", "HuBERT"], "summary": "在 EmoSphere-TTS 基础上融合 HuBERT 离散韵律 token 和 DeBERTaV3 语义编码,实现英日双语情感可控 TTS", "route": "文本 → Phoneme Encoder (MFA/pyopenjtalk) + Semantic Encoder (DeBERTaV3, frozen) || 参考音频 → AVD Encoder → 球面坐标变换 → 球面情感向量 || 参考音频 → HuBERT (layer 9) → k-means (K=200) → 离散 token || Speaker Embedding → 四路 concat + 线性投影 → FastSpeech 2 Mel Decoder → Mel → Waveform", "metrics": "EN: WER 19.58% / MCD 7.282 / nMOS 4.13+-0.08 vs EmoSphere-TTS WER 20.96% / MCD 7.979 / nMOS 4.05+-0.12; JA: CER 18.33% / MCD 8.719 / nMOS 3.94+-0.15 vs EmoSphere-TTS CER 19.26% / MCD 9.131 / nMOS 3.63+-0.16 [Table 1, 2]; AVD RMSE: EN 0.0773 vs 0.0798, JA 0.0783 vs 0.0867 [Table 3]", "takeaway": "(1) 语言分别聚类的 HuBERT token 作为跨语言韵律控制信号,避免不同语言 phone 体系混淆 codebook; (2) DeBERTaV3 语义编码通过 cross-attention 条件化韵律模块而非直接作为 decoder 输入,间接增强语义-韵律对齐", "limitation": "仅单说话人数据 (EN 80 句 / JA 60 句); 无零样本能力; 未与 EmoSphere++ 或 LLM-TTS 对比; 代码未开源; 评估规模极小 (9/21 人主观评估)", "concepts": ["EmotionControlinTTS", "Self-SupervisedSpeechRepresentation", "ProsodyModeling", "MelSpectrogram", "SpeakerEmbedding", "Non-autoregressiveTTS"], "source": "Sources/EmoSSLSphere.pdf", "github": "", "demo": ""}, {"name": "EmoSteer-TTS", "title": "EmoSteer-TTS: Fine-Grained and Training-Free Emotion-Controllable Text-to-Speech via Activation Steering", "arxiv_id": "2508.03543", "date": "2025-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "activation-steering", "training-free", "flow-matching", "DiT", "interpretability", "zero-shot"], "summary": "首个 training-free 细粒度情感可控 TTS — 通过在 flow-matching TTS 的 DiT 层激活值上施加 steering vector,实现情感转换/插值/擦除/组合,无需任何训练", "route": "情感/中性语音对 → 提取 DiT 各层激活差 → SER 模型筛选 top-k 情感 token → 构造加权 steering vector → 推理时注入激活值 (α 控制强度) → 情感可控语音", "metrics": "F5-TTS+EmoSteer: WER 2.79 / S-SIM 0.64 / E-SIM 0.29 / EI-MOS 4.00 / EE-MOS 4.02; CosyVoice2+EmoSteer: WER 2.83 / S-SIM 0.65 / N-MOS 3.65 [Table 1]", "takeaway": "(1) difference-in-means 提取 emotion direction + 只保留 top-k token 构造稀疏 steering vector 的方法可迁移到其他可控生成任务 (如说话风格、语速); (2) renormalization (保持 L2 norm) 防止 steering 破坏生成质量; (3) 投影减法实现属性擦除 (Eq. 9) 是通用的解耦技巧", "limitation": "α>3 时语音不可懂; 仅验证了 6 种基本情感; 依赖 emotion2vec 的 SER 质量; 未验证非 flow-matching 模型; 未开源代码 (截至论文)", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "StyleTransferinTTS", "MelSpectrogram", "Classifier-FreeGuidance"], "source": "Sources/EmoSteer-TTS.pdf", "github": "", "demo": ""}, {"name": "FNH-TTS", "title": "FNH-TTS: Mixture-of-Experts Duration Modeling for Robust Neural Speech Synthesis", "arxiv_id": "2508.12001", "date": "2025-08", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "duration-modeling", "MoE", "vocoder", "non-autoregressive", "VITS", "discriminator", "prosody"], "summary": "将 Mixture-of-Experts 引入 VITS 的 Duration Predictor,同时用 VOCOS vocoder + CoMBD/SBD 判别器应对更丰富 duration 变化带来的合成难度提升", "route": "Phoneme + Speaker Emb → MoE-DP (1D Conv + Switch-Transformer, 8 experts) → Duration → VITS Flow/Prior → VOCOS (ConvNeXt + ISTFT) → Waveform; CoMBD + SBD 做对抗训练", "metrics": "MOS 4.48 (LJSpeech) / 4.63 (VCTK) [Table 1]; Duration-category ACC 67.07% (最高) [Table 2]; CPU RTF 0.046 (最低) [Table 3]; 模型 47.73M 参数", "takeaway": "(1) MoE 做 DP 的结构化路线,speaker-conditioned router 让不同专家专注不同 duration pattern; (2) \"duration 改进必须配合 vocoder 升级\"的联合优化思路; (3) Jensen-Shannon divergence 评估 phoneme-level duration 对齐质量的方法", "limitation": "仅在 VITS 框架内验证,未验证 MoE-DP 对 flow matching / diffusion TTS 的通用性; 评估未包含 speaker similarity 指标; 未开源", "concepts": ["DurationPredictor", "Non-autoregressiveTTS", "ProsodyModeling", "NeuralVocoder", "SpeakerEmbedding", "Multi-scaleSTFTDiscriminator", "VariationalAutoencoderforTTS"], "source": "Sources/FNH-TTS.pdf", "github": "", "demo": ""}, {"name": "Llasa+", "title": "Llasa+: Free Lunch for Accelerated and Streaming Llama-Based Speech Synthesis", "arxiv_id": "2508.06262", "date": "2025-08", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based-TTS", "inference-acceleration", "multi-token-prediction", "speculative-decoding", "streaming", "speech-codec", "single-codebook"], "summary": "在冻结的 Llasa backbone 上加挂可插拔 MTP 模块 + verification 算法, 实现 1.48x 推理加速且不降质量; 附带 XCodec2-S 支持流式波形重建", "route": "Text tokens → [Frozen Llasa-1B backbone] → hidden states → [MTP1 (LLaMA block)] → token prediction 1 → [MTP2 (LLaMA block)] → token prediction 2 → [Verification against backbone logits] → accepted tokens → [XCodec2-S causal decoder] → streaming waveform", "metrics": "Seed-TTS-eval-en WER 2.499% (vs Llasa baseline 3.220%), SIM 0.575 (vs 0.572), speed-up 1.48x [Table I]; XCodec2-S WER 3.239% / SPK-SIM 0.795 / UTMOS 4.029 (vs XCodec2 2.470/0.821/4.127) [Table II]", "takeaway": "Frozen backbone + plug-and-play MTP 加速策略可推广到任何 LLM-based 生成模型; verification 中对 EOS token 的专门处理是稳定性关键; MTP 在 TTS 中不仅加速还可能改善质量 (更长距离 historical context)", "limitation": "仅在 LibriTTS (~960h) 上训练 MTP, 未验证大数据场景; 仅基于 Llasa-1B, 未测 3B/8B; 第二个 MTP 模块加速增益有限 (~15.66% vs 第一个 ~32.21%); XCodec2-S 质量仍低于非因果 XCodec2", "concepts": ["LLM-basedTTS", "CodecLanguageModel", "Single-codebookvsMulti-codebook", "StreamingSpokenDialogue", "SpeechTokenizer"], "source": "Sources/Llasa+.pdf", "github": "", "demo": ""}, {"name": "MiSTR", "title": "MiSTR: Multi-Modal iEEG-to-Speech Synthesis with Transformer-Based Prosody Prediction and Neural Phase Reconstruction", "arxiv_id": "2508.03166", "date": "2025-08", "venue": "Interspeech 2025 (推断)", "org": "", "tier": "deep", "tags": ["BCI", "iEEG", "speech-synthesis", "neural-decoding", "prosody", "mel-spectrogram", "vocoder", "phase-reconstruction"], "summary": "提出 MiSTR 框架,通过小波特征提取 + Transformer 韵律感知解码 + 迭代谐波相位重建三模块组合,从颅内脑电信号合成语音,实现 0.91 Pearson 相关的 SOTA mel 重建精度", "route": "iEEG 信号 → DWT 小波分解 + CFC 分析 + 韵律特征提取 → Autoencoder 降维 → Transformer 预测 Mel spectrogram → IHPR 相位重建 → 波形", "metrics": "PC=0.91 / MCD=3.92 / STOI=0.73 / HNR=12.7 dB / MOSA-Net=3.38 (10名被试,10-fold CV,Dutch iEEG dataset [24]) [Table 1]", "takeaway": "(1) 迭代谐波相位重建 (IHPR) 的思路 — 用谐波一致性初始化 + 自适应校正替代 Griffin-Lim 的盲迭代,可移植到其他 mel-to-waveform 场景; (2) Cross-Frequency Coupling (PAC) 作为神经信号特征,捕获频带间调制关系", "limitation": "单一公开数据集 (10人,Dutch,癫痫患者); 无实时性分析; 未与现代 TTS vocoder (HiFi-GAN, BigVGAN) 做 vocoder 对比; 评估主要靠自动指标 (MOSA-Net 替代 MOS); 代码已开源但数据受限", "concepts": ["MelSpectrogram", "NeuralVocoder", "ProsodyModeling", "F0Modeling"], "source": "Sources/MiSTR.pdf", "github": "", "demo": ""}, {"name": "NVSpeech", "title": "NVSpeech: An Integrated and Scalable Pipeline for Human-Like Speech Modeling with Paralinguistic Vocalizations", "arxiv_id": "2508.04195", "date": "2025-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["paralinguistic", "non-verbal-vocalization", "ASR", "TTS", "dataset", "human-like-speech", "expressive-TTS", "Mandarin"], "summary": "首个集数据集构建、副语言感知 ASR、可控 TTS 于一体的端到端 pipeline,以 18 类 word-level 副语言标注为核心,实现副语言发声的自动识别和可控合成", "route": "[Step 1] 人工标注 48K 话语 (18 类 PV, word-level) → [Step 2] 训练 paralinguistic-aware ASR (SenseVoice 最优, F1 0.73/0.85) → [Step 3] ASR 自动标注 174K 话语 (573.4h) → [Step 4] CosyVoice/CosyVoice2 词表扩展 + 微调 → 可控 PV 插入的人类般语音合成", "metrics": "Tagging SenseVoice F1 0.73; ASR in-domain CER 4.61% + F1 0.83; TTS CosyVoice2 (large-scale) CER_w/o_para 3.73% + UTMOS 2.67 + listener win rate 75.4% [Table 3, 4, 5, Fig 5]", "takeaway": "(1) 18 类 word-level PV 分类体系 (生理/话语态度/语篇标记) 可复用于中文语音标注; (2) ASR 内联 PV token 方案 — 将 PV 作为文本 token 而非后处理; (3) 词表扩展 fine-tune 方式给已有 TTS 系统添加 PV 控制能力; (4) 跨域泛化验证 (游戏→开放域)", "limitation": "仅中文 (Mandarin); 人工标注 48K 话语成本高; 游戏语音为主可能存在域偏移; UTMOS 分数偏低 (~2.5); 仅测试 CosyVoice 系列", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "Instruction-GuidedSpeechSynthesis", "SpeechTokenizer"], "source": "Sources/NVSpeech.pdf", "github": "", "demo": ""}, {"name": "SecoustiCodec", "title": "SecoustiCodec: Cross-Modal Aligned Streaming Single-Codebook Speech Codec", "arxiv_id": "2508.02849", "date": "2025-08", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-codec", "semantic-disentanglement", "single-codebook", "streaming", "contrastive-learning", "FSQ", "VAE", "low-bitrate"], "summary": "通过帧级 text-speech contrastive learning + 显式 paralinguistic encoder + VAE+FSQ 量化,在单码本、流式条件下实现语义-副语言解耦与高保真重建", "route": "语音 → Speech Encoder → Semantic Projection (VAE+FSQ → 离散 S) + Acoustic Projection (连续 A) + Paralinguistic Encoder (全局 G) → Semantic Connector (S+G→A_hat) → Speech Decoder → Mel → HiFi-GAN", "metrics": "PESQ 1.77/2.58 @ 0.27/1 kbps (单码本 SOTA); SpkSim 0.92/0.95; EmoSim 0.93/0.97; WER 11.58/3.99; 码本利用率 98.06% [Table I, Fig.4]", "takeaway": "(1) 帧级 contrastive learning 做 text-speech 对齐(比 ASR loss 在 SpkSim/EmoSim 上更优); (2) VAE+FSQ 混合量化解决 long-tail 分布; (3) 多阶段冻结训练策略稳定收敛; (4) S+G≈A 的显式分解思路", "limitation": "仅在 1000h 数据上训练; 仅验证中英文; 依赖 ground-truth phoneme duration; 未验证下游 TTS/对话任务效果; 解码依赖 HiFi-GAN 增加 RTF", "concepts": ["FiniteScalarQuantization", "SemanticvsAcousticTokens", "Single-codebookvsMulti-codebook", "SpeechFactorization", "CodebookCollapse", "ResidualVectorQuantization"], "source": "Sources/SecoustiCodec.pdf", "github": "", "demo": ""}, {"name": "TaDiCodec", "title": "TaDiCodec: Text-aware Diffusion Speech Tokenizer for Speech Language Modeling", "arxiv_id": "2508.16790", "date": "2025-08", "venue": "arXiv preprint (under review)", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "diffusion-model", "flow-matching", "single-codebook", "low-bitrate", "zero-shot-TTS", "codec-design", "BSQ"], "summary": "用端到端 diffusion autoencoder (flow matching) + text-aware decoding + BSQ 量化实现 6.25 Hz / 0.0875 kbps 的极低帧率单码本 speech tokenizer,同时在重建和 zero-shot TTS 上保持有竞争力的质量", "route": "语音 mel → Transformer encoder → BSQ 单层量化 (L=14, codebook 16384) → DiT decoder (conditioned on text + prompt + noise level) → flow matching 重建 mel → vocoder → 波形", "metrics": "重建 WER 2.73 / SIM 0.69 / UTMOS 3.73 (SeedTTS test-en, w. dct) [Table 1]; TTS-AR WER 2.28 (en) / 1.19 (zh) [Table 5]; RTF 0.12-0.29 [Table 6]", "takeaway": "(1) text conditioning 注入 diffusion decoder 补偿极端压缩下的信息损失; (2) BSQ 无需显式码本且不需 commitment loss,与 diffusion loss 配合实现端到端训练; (3) prompt mechanism 作为全局 conditioning 信号减轻 VQ 编码 speaker identity 的负担", "limitation": "diffusion decoder 多步推理带来解码延迟 (相比 GAN 单步); 需要 text 输入做 de-tokenization; 仅验证了 TTS 下游,未验证 speech understanding/dialogue", "concepts": ["SpeechTokenizer", "ConditionalFlowMatching", "Single-codebookvsMulti-codebook", "TokenRateandBitrateTrade-offs", "SemanticvsAcousticTokens", "ResidualVectorQuantization", "MaskedGenerativeModeling", "DiffusionModel", "CodecLanguageModel", "LLM-basedTTS"], "source": "Sources/TaDiCodec.pdf", "github": "", "demo": ""}, {"name": "Vevo2", "title": "Vevo2: A Unified and Controllable Framework for Speech and Singing Voice Generation", "arxiv_id": "2508.16332", "date": "2025-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "SVS", "voice-conversion", "singing-voice", "speech-editing", "unified-generation", "chromagram", "post-training"], "summary": "通过基于 chromagram 的统一 prosody tokenizer 和显式/隐式韵律学习策略,将 speech 和 singing voice 生成统一到单一 AR+FM 两阶段框架中,并用 GRPO 多目标后训练同时优化可懂度和旋律跟随能力", "route": "Text + Prosody source (optional) + Style ref → [AR Transformer 509M, Qwen2.5-0.5B init] → content-style tokens (12.5Hz) + Timbre ref → [FM Transformer 363M] → Mel spectrogram → [Vocos 255M] → Waveform", "metrics": "Zero-shot TTS: WER 11.48% / SIM 0.689 (expressive speech, post-trained); SVS: WER 9.83% / FPC 0.710 (Chinese, post-trained); SVC: WER 11.64% / SIM 0.601 (English); Speech editing: WER 16.83% / SIM 0.799; 训练数据 101K h speech (Emilia) + 7K h singing (SingNet)", "takeaway": "(1) Chromagram VQ-VAE 作为 notation-free prosody 表示 — 八度无关+噪声鲁棒+跨音频类型通用; (2) EPL/IPL 随机切换策略统一 speech-singing 训练; (3) GRPO 双目标后训练避免单目标过优化导致的能力退化; (4) Fixed frame rate tokenizer 的 2:1 长度关系实现 AR 模型的 duration control", "limitation": "12.5Hz content-style token rate 导致 FM-only SVC 可懂度弱于 50Hz 方案; 后训练依赖 M4Singer 的 MIDI 标注渲染器乐; singing voice 数据仅 7K h (vs speech 101K h) 比例悬殊; 未在 streaming/实时场景评估", "concepts": ["SpeechTokenizer", "ConditionalFlowMatching", "LLM-basedTTS", "SemanticvsAcousticTokens", "SpeechFactorization", "SingingVoiceSynthesis"], "source": "Sources/Vevo2.pdf", "github": "", "demo": ""}, {"name": "VibeVoice", "title": "VibeVoice Technical Report", "arxiv_id": "2508.19205", "date": "2025-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "long-form", "multi-speaker", "conversational", "next-token-diffusion", "LLM-TTS", "streaming", "sigma-VAE"], "summary": "基于 LatentLM 的 next-token diffusion 框架,结合 3200x causal acoustic tokenizer + semantic tokenizer + Qwen2.5 LLM,实现最长 90 分钟多说话人对话语音合成,在 preference/realism/richness 三项主观评测中全面超越 Gemini 2.5 Pro TTS 和 ElevenLabs v3", "route": "Voice prompts + Text scripts (multi-speaker) → [Acoustic tokenizer (continuous VAE) + Semantic tokenizer] → Hybrid features → Qwen2.5 LLM (1.5B/7B) → Token-level Diffusion Head (CFG, DPM-Solver++) → Acoustic VAE Decoder → Waveform (up to 90min)", "metrics": "Podcast MOS: Preference 3.75/3.71, Realism 3.59/3.59, Richness 3.44/3.75 (1.5B/7B) vs Gemini 2.5 Pro 3.55/3.78/3.65 [Table 1]; Short-utterance WER 1.16 (zh), 3.04 (en) at 7.5fps [Table 2]; Tokenizer PESQ 3.068, UTMOS 4.181 (test-clean) [Table 3]", "takeaway": "1) 双 tokenizer (acoustic + semantic) 的混合表示实现长对话稳定性; 2) 3200x 因果 tokenizer 仅 7.5 Hz,speech-to-text token ratio 约 2:1; 3) curriculum learning from 4K to 64K context; 4) ASR proxy task 训练 semantic tokenizer", "limitation": "仅中英双语; 不处理重叠语音; 不支持非语音音频 (背景音乐/音效)", "concepts": ["Classifier-FreeGuidance", "SpeechTokenizer", "LLM-basedTTS", "SemanticvsAcousticTokens", "DiffusionModel"], "source": "Sources/VibeVoice.pdf", "github": "", "demo": ""}, {"name": "DMOSpeech2", "title": "DMOSpeech 2: Reinforcement Learning for Duration Prediction in Metric-Optimized Speech Synthesis", "arxiv_id": "2507.14988", "date": "2025-07", "venue": "AAAI 2026", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "reinforcement-learning", "duration-prediction", "flow-matching", "distillation", "zero-shot"], "summary": "将 RL (GRPO) 精确靶向 duration predictor 组件,以 SIM+WER 为 reward 优化 diffusion TTS 的时长预测,同时引入 teacher-guided sampling 恢复蒸馏模型的韵律多样性", "route": "Text + Prompt → Duration Predictor (GRPO-optimized) → 预测总时长 L → Student Generator (4-step DMD-distilled flow matching) → Mel → Vocos Vocoder → Waveform", "metrics": "WER 1.752 / SIM 0.698 (Seed-TTS-en), CER 1.527 / SIM 0.760 (Seed-TTS-zh), RTF 0.032 (5.2x faster than F5-TTS), 0.3B params [Table 1, Table 2]", "takeaway": "(1) RL 不必作用于整个 pipeline,靶向瓶颈组件 (duration predictor) 成本低效果好; (2) teacher-guided sampling: 早期步骤用 teacher 建立韵律,后期步骤用 student 细化声学,两全其美; (3) reward diversity filter: 跳过 reward 区分度不足的 batch 避免无效训练", "limitation": "(1) 仅优化 duration predictor,未将 RL 扩展到 teacher model 或其他组件; (2) GRPO 训练窗口极窄 (1.5K steps 后退化),超参数敏感; (3) teacher-guided sampling 需同时加载 teacher+student 参数 (0.6B); (4) 未开源训练 reward 模型 (ASR/SV),复现需自建", "concepts": ["ConditionalFlowMatching", "DurationPredictor", "Diffusion-basedTTS", "DifferentiableRewardOptimization", "SpeakerEmbedding", "DiffusionModel"], "source": "Sources/DMOSpeech2.pdf", "github": "", "demo": ""}, {"name": "DiffRO", "title": "Differentiable Reward Optimization for LLM based TTS system", "arxiv_id": "2507.05911", "date": "2025-07", "venue": "arXiv (Interspeech format)", "org": "", "tier": "deep", "tags": ["reinforcement-learning", "DiffRO", "TTS", "reward-model", "Gumbel-Softmax", "RLHF", "multi-task-reward", "emotion-control"], "summary": "在 codec token 空间直接计算可微 reward 并反向传播梯度优化 TTS LM,绕过 FM+vocoder 的计算瓶颈,同时用 Multi-Task Reward 模型实现多维度音频属性控制", "route": "Text → LLM(codec token prediction, Gumbel-Softmax 采样) → Token2Reward Model(ASR/SER/SQA/AED) → reward loss → 反向传播更新 LM", "metrics": "WER 0.78%(zh, Seed-TTS-eval, 基于 CosyVoice2.0 base) [Table 2]; 情感 accuracy HAPPY 1.00(zh)/0.92(en), SAD 0.76/0.96, ANGRY 0.84/0.92 [Table 3]", "takeaway": "(1) Token2Reward 范式: 用类 ASR 模型在 token 空间计算 reward,省去 FM+vocoder 推理; (2) Gumbel-Softmax 替换 argmax 实现端到端可微; (3) MTR 模型: 一个多任务 reward 模型同时提供 ASR/SER/SQA/AED 反馈,无需显式情感标签数据即可实现情感控制", "limitation": "(1) MTR-based DiffRO 的 ASR WER 劣于 ASR-only DiffRO,多任务目标存在冲突 [Table 2]; (2) MOS/age/gender 控制效果受限于 FM+vocoder 的去噪能力,LM 层面的控制无法完全传递到最终音频 [Table 4]; (3) 仅在 CosyVoice 2.0 上验证,未测更多 backbone", "concepts": ["DifferentiableRewardOptimization", "Gumbel-Softmax", "EmotionControlinTTS", "TTSEvaluation", "SpeechLanguageModel"], "source": "Sources/DiffRO.pdf", "github": "", "demo": ""}, {"name": "Dragon-FM", "title": "Next Tokens Denoising for Speech Synthesis", "arxiv_id": "2507.22746", "date": "2025-07", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "flow-matching", "autoregressive", "chunk-AR", "codec", "FSQ", "podcast"], "summary": "Dragon-FM 将 AR 和 flow matching 统一到单一模型中,以 chunk-wise AR(2 秒/25 token 一组)跨 chunk 建模全局连贯性,chunk 内并行 flow matching 去噪,实现低延迟高质量 48kHz TTS", "route": "文本+说话人 prompt → 48kHz FSQ codec (12.5Hz) → chunk-AR Transformer (25 tokens/chunk) + chunk 内 flow matching → FSQ token embeddings → codec decoder → 48kHz waveform", "metrics": "FAD 2.4 (12-step FM, 2s chunk); Codec CodecB: SIM 0.916, WER 2.74 (12.5Hz, 48kHz); TNFE 仅 2-4 (2s audio) vs VALL-E 150 vs E2 32 [Table 2-4]", "takeaway": "(1) chunk-AR 粒度作为 per-token AR 与 full-sequence NAR 之间的折中方案,可调节 chunk 大小控制延迟-多样性平衡; (2) FSQ 离散 token embedding 直接作为连续 flow matching 的目标,无需 VAE——证明去噪模型有内在分类能力; (3) mean flow 优化将 chunk 内 FM 步数降至 2-4 步", "limitation": "(1) 仅报告 FAD 和 codec 重建指标,无 MOS/SIM/WER 端到端合成指标; (2) 60K h podcast 内部数据集无法复现; (3) 未与 LatentLM/CLEAR/CosyVoice 3 等近期强 baseline 比较; (4) 未开源", "concepts": ["ConditionalFlowMatching", "FiniteScalarQuantization", "Next-TokenDiffusion", "TokenRateandBitrateTrade-offs", "Single-codebookvsMulti-codebook", "CodecLanguageModel", "MelSpectrogram", "Multi-scaleSTFTDiscriminator"], "source": "Sources/Dragon-FM.pdf", "github": "", "demo": ""}, {"name": "EME-TTS", "title": "EME-TTS: Unlocking the Emphasis and Emotion Link in Speech Synthesis", "arxiv_id": "2507.12015", "date": "2025-07", "venue": "Interspeech 2025 (submitted)", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "emphasis", "prosody", "variance-adapter", "weakly-supervised", "non-autoregressive"], "summary": "首次探索重音与情感在 TTS 中的交互关系,通过弱监督重音伪标签 + EPE block 实现情感增强且重音稳定的语音合成", "route": "Text → Phoneme Encoder (EPE blocks) → Variance Adapter (pitch/duration/energy + variance pitch/duration predictors) → Frame Decoder (EPE blocks) → Mel-spec → iSTFTNet vocoder", "metrics": "主观情感准确率 Mean 0.67 (vs EmoSpeech 0.58, CosyVoice2 0.48) [Table 3]; MOS 4.22 (vs EmoSpeech 4.14, w/o EPE 3.98) [Table 4]; 重音识别准确率 Mean 0.78 (vs w/o EPE 0.73) [Table 1]", "takeaway": "(1) variance-based emphasis features (pitch/duration 相对偏差) 是轻量级重音建模方案; (2) Emphasis Adapter 的 attention weight additive modulation 可推广到任何需要局部增强的注意力场景; (3) LLM 预测重音位置 + TTS 执行分离的设计", "limitation": "仅在 ESD 数据集 (10 说话人, 5 情感, 1.2h/人) 上验证; 仅评估 5 种基础情感; 只有 11 名评估者; 未与最新 LLM-based TTS 做公平对比; 代码/模型未开源", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "DurationPredictor", "F0Modeling", "Non-autoregressiveTTS", "MelSpectrogram", "Self-SupervisedSpeechRepresentation", "NeuralVocoder"], "source": "Sources/EME-TTS.pdf", "github": "", "demo": ""}, {"name": "JoyTTS", "title": "JoyTTS: LLM-based Spoken Chatbot With Voice Cloning", "arxiv_id": "2507.02380", "date": "2025-07", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "spoken-chatbot", "voice-cloning", "LLM-based", "end-to-end", "open-source"], "summary": "将 MiniCPM-o 的 LLM-Chat 与 CosyVoice2 的 TTS 模块通过 hidden state MLP 桥接,构建带 voice cloning 的端到端语音聊天机器人", "route": "Text → Tokenizer → LLM-Chat (Qwen-7B) → MLP(3584→768) + Text Embedding → LLM-TTS (CosyVoice2) → Generator → Mel/Audio", "metrics": "SEED-TTS-zh SS 0.73 / WER 5.09 (vs CosyVoice2 独立: SS 0.748 / WER 1.45) [Table 1]; 延迟 1.8s on 4090D [§4]", "takeaway": "LLM hidden states 作为语义桥接送入 TTS 模块,让 TTS 获得对话上下文理解能力; 两阶段训练 (独立→联合) 的稳定性策略", "limitation": "集成后 WER 大幅恶化 (5.09 vs 1.45); 无消融实验; 仅 5 页无深度分析; 训练数据全为合成语音; 仅中文评估", "concepts": ["LLM-basedTTS", "SpeakerEmbedding", "SpeechTokenizer", "SpeechLanguageModel", "MelSpectrogram"], "source": "Sources/JoyTTS.pdf", "github": "", "demo": ""}, {"name": "MIDI-VALLE", "title": "MIDI-VALLE: Improving Expressive Piano Performance Synthesis Through Neural Codec Language Modelling", "arxiv_id": "2507.08530", "date": "2025-07", "venue": "ISMIR 2025", "org": "", "tier": "deep", "tags": ["music-synthesis", "codec-LM", "MIDI-to-audio", "piano", "RVQ", "zero-shot", "AR-NAR"], "summary": "将 VALL-E 的 codec language modeling 范式从语音迁移到钢琴演奏合成,用 Octuple MIDI tokenisation 替代 piano-roll 表征,在 ATEPP/Maestro 上 FAD 降低 75%+", "route": "Performance MIDI → Octuple Tokenisation (pitch/vel/dur/IOI/pos/bar) + Audio Prompt → Piano-Encodec → AR Decoder (1st codebook) → NAR Decoder (2-4th codebooks, conditioned on 3s audio prompt) → Piano-Decoder → Waveform", "metrics": "FAD 3.329 vs M2A 11.014 (ATEPP-GT), FAD 11.281 vs 34.479 (Maestro-GT) [Table 4]; 听力测试 202:58 偏好票 [§6.2]; Piano-Encodec Spec. 0.123 vs Encodec 0.304 [Table 3]", "takeaway": "TTS codec LM 范式向音乐合成的迁移方法论; Octuple tokenisation 解决 EPR-EPS MIDI 表征不一致问题; domain-specific codec fine-tuning (Piano-Encodec) 大幅提升重建质量", "limitation": "jazz 泛化差 (Pijama FAD 102 仍很高); MIDI-audio prompt 对齐敏感(timing 偏移导致开头异常); 长段拼接有声学不连续; 未与 MusicGen/AudioLM 等音乐生成系统对比; 仅 4 层 RVQ 较浅", "concepts": ["ResidualVectorQuantization", "CodecLanguageModel"], "source": "Sources/MIDI-VALLE.pdf", "github": "", "demo": ""}, {"name": "Multi-StepHierarchicalED", "title": "Multi-Step Prediction and Control of Hierarchical Emotion Distribution in Text-to-Speech Synthesis", "arxiv_id": "2507.04598", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "hierarchical", "multi-step-prediction", "emotion-distribution", "variance-adaptor", "FastSpeech2", "controllability"], "summary": "提出多步预测框架,将情感分布从 utterance→word→phoneme 逐级细化,使高层情感上下文引导底层韵律,在 FastSpeech 2 上显著提升情感表达力和可控性", "route": "Text → Encoder → Linguistic Embedding + Hierarchical ED (utterance→word→phoneme, 多步预测) → Variance Adaptor (pitch/duration/energy) → Decoder → Mel → HiFi-GAN → Waveform", "metrics": "MUSHRA 自然度 62.2 (GT ED, VA Multi-Step) vs 57.5 (GT ED, VA Single-Step); WER 2.45% (Pred, VA Multi-Step) vs 4.61% (Pred, VA Single-Step); BWS 测试中情感可控性全面优于 MsEmoTTS [Table 1][Table 2][Table 4]", "takeaway": "多步预测的设计模式 — 先预测粗粒度(utterance)再条件化细粒度(word→phoneme),这种 coarse-to-fine 逐级细化策略可迁移到任何需要多层级控制的场景(如韵律/风格/说话人属性的层级建模)", "limitation": "仅在 FastSpeech 2 上验证,未在 LLM-based TTS 或 flow-based 模型上测试; 仅支持 5 类基础情感(ESD),未涉及混合情感或连续维度(arousal-valence); 不支持零样本情感迁移", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "Non-autoregressiveTTS", "F0Modeling", "DurationPredictor"], "source": "Sources/Multi-StepHierarchicalED.pdf", "github": "", "demo": ""}, {"name": "NonverbalTTS", "title": "NonverbalTTS: A Public English Corpus of Text-Aligned Nonverbal Vocalizations with Emotion Annotations for Text-to-Speech", "arxiv_id": "2507.13155", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["dataset", "non-verbal-vocalization", "emotion-annotation", "TTS", "expressive-TTS", "data-pipeline", "English"], "summary": "首个包含 10 类 NV + 8 类情感标注的 17 小时公开英语 TTS 数据集,配套自动检测-人工验证-多标注者融合 pipeline,微调 CosyVoice 后 NV 生成能力与闭源 CosyVoice2 持平", "route": "VoxCeleb + Expresso 原始音频 → BEATs NV 检测 + MFA 对齐 → emotion2vec 情感分类 → 人工验证+过滤 → 多标注者融合 (Merge + Majority Vote) → 17h NVTTS 语料 → CosyVoice-300M LM SFT → 零样本 NV-capable TTS", "metrics": "(NVTTS-no-emo vs CosyVoice2-no-emo) SIM-o 0.89 vs 0.75; WER 0.19 vs 0.18; DNSMOS 3.82 vs 3.93; NV Jaccard (全类) 0.80 vs 0.78; 人类偏好 33.4% vs 35.4% (无显著差异, p>0.05) [Table 8, Fig 1]", "takeaway": "(1) NV 检测 (BEATs) + 强制对齐 (MFA) 组合实现自动 NV 定位; (2) 多标注者融合算法 (Merge + Align + Majority Vote) 是通用可复用的标注融合方案; (3) 仅微调 LM 组件 (非全参) + 25 epoch + 单卡 A100 即可赋予 NV 能力,成本极低; (4) NV Jaccard distance 作为 NV 生成保真度评估指标", "limitation": "仅 17h 规模偏小; 仅英语; NV tokenization 无单/多 token 区分 (导致 laughter Jaccard 低于 CosyVoice2); 去掉情感标签反而更好,情感标注价值未充分体现; BEATs 检测阈值设极低 (0.1) 可能引入噪声; 仅测试 CosyVoice 系列", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "TTSEvaluation", "Speech-TextAlignment"], "source": "Sources/NonverbalTTS.pdf", "github": "", "demo": ""}, {"name": "OpenS2S", "title": "OpenS2S: Advancing Fully Open-Source End-to-End Empathetic Large Speech Language Model", "arxiv_id": "2507.05177", "date": "2025-07", "venue": "arXiv preprint (Technical Report)", "org": "", "tier": "deep", "tags": ["speech-LM", "empathetic", "end-to-end", "streaming", "interleaved-decoding", "open-source", "data-construction"], "summary": "完全开源的端到端共情语音对话模型,通过自动化数据构建 pipeline 以低成本实现副语言情感理解与表达", "route": "语音输入 → Qwen2-Audio encoder (25Hz → 6.25Hz via CNN adapter) → Qwen3-8B LLM (interleaved text+speech hidden states) → Qwen3-1.8B streaming speech decoder (GLM-4-Voice tokenizer, 12.5 tok/s) → chunk-aware causal flow matching + HiFi-GAN → 语音输出", "metrics": "VoiceBench alpaca 4.51 / URO-Bench UnderEmo-en 59.32 (V1.5, 接近 Kimi-Audio 的 59.22/76.96) [Table 2]; 预训练用 Emilia ~12k 小时 TTS 数据 [§3.1] + ~3.8M ASR 对 + 70k SER 对, 远少于 Kimi-Audio 的 1300 万小时 [§1]", "takeaway": "自动化共情数据构建三步法 (seed audio → LLM self-instruct 生成带副语言标注的 query → CosyVoice2 情感可控合成 response); 用 thinking mode 推断回复应带的情感色调", "limitation": "语音到语音评估仅有定性分析无定量指标; 架构与 LLaMA-Omni 2 高度同构,创新主要在数据侧; V1 版本多项指标落后 Kimi-Audio 较多, V1.5 通过扩数据追平", "concepts": ["SpeechLanguageModel", "StreamingSpokenDialogue", "EmotionControlinTTS", "SpeechTokenizer", "ModalityAdaptationforSpeechLLM", "ConditionalFlowMatching"], "source": "Sources/OpenS2S.pdf", "github": "", "demo": ""}, {"name": "SpeakerIdentityUnlearning", "title": "Do Not Mimic My Voice: Speaker Identity Unlearning for Zero-Shot Text-to-Speech", "arxiv_id": "2507.20140", "date": "2025-07", "venue": "ICML 2025", "org": "", "tier": "deep", "tags": ["machine-unlearning", "voice-privacy", "zero-shot-TTS", "speaker-identity", "flow-matching", "GDPR", "safety"], "summary": "首次提出 ZS-TTS 中的 speaker identity unlearning 问题,通过 Teacher-Guided Unlearning (TGU) 使 VoiceBox 在遇到 forget speaker 的 audio prompt 时生成随机音色语音,同时保持对 remain speaker 的克隆质量", "route": "pre-trained VoiceBox (θ) → 对 forget speaker 的 audio prompt: teacher θ 仅以 text y 为条件生成随机音色目标 x̄=θ(y) → student θ⁻ 训练拟合 x̄ 而非原说话人 → 对 remain speaker 保持原 CFM loss → 联合训练 (λ=0.2 forget, 0.8 remain)", "metrics": "TGU SIM-F 0.169 (接近不同说话人的均值 0.09) [Table 1]; SIM-R 0.631 (仅比原模型 0.649 降 2.8%) [Table 1]; WER-R 2.5 vs 原模型 2.1 [Table 1]; spk-ZRF-F 0.871 (最高随机性) [Table 1]; SMOS-F 1.28 (几乎不像原说话人) [Table 4]; CMOS-R -0.02 (质量几乎无损) [Table 4]", "takeaway": "利用 pre-trained model 的无条件生成能力作为 unlearning 的\"随机目标生成器\" -- teacher θ 不接收 audio context 时自然产生随机说话人,省去构造 aligned random target 的难题;spk-ZRF 指标设计思路(用 JSD 度量生成分布与随机分布的距离)可迁移到其他 unlearning 场景的评估", "limitation": "仅在 VoiceBox (CFM-based NAR) 上验证,未测试 AR 架构 (VALL-E) 或 LLM-based TTS; 恢复实验 [Table 12] 显示 15 min 数据 fine-tune 可使 SIM-F 回升至 0.735(但 remain 性能崩溃); 未讨论声音相似但非 forget speaker 的潜在误伤(仅 Appendix H 简要分析)", "concepts": ["ConditionalFlowMatching", "SpeakerEmbedding", "SpeakerVerification", "Classifier-FreeGuidance", "Anti-spoofingandDeepfakeDetection", "VoiceCloningTaxonomy"], "source": "Sources/SpeakerIdentityUnlearning.pdf", "github": "", "demo": ""}, {"name": "SpeechAccentLLM", "title": "SpeechAccentLLM: A Unified Framework for Foreign Accent Conversion and Text to Speech", "arxiv_id": "2507.01348", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "voice-conversion", "accent-conversion", "LLM-based", "discrete-token", "speech-tokenization", "VQ", "CTC"], "summary": "将 CTC 引入 VQ codebook 离散化构建具有局部性的 speech content tokens (SpeechCodeVAE),并通过 FAC+TTS 联合训练 + BERT-style token 修复 (SpeechRestorer) 解决外国口音转换中的数据稀缺和 LLM 推理错误问题", "route": "非母语语音 → Whisper encoder + CTC-guided VQ (SpeechCodeVAE) → content tokens V + ECAPA-TDNN → speaker S → LLM decoder (FAC&TTS Model, 8-layer transformer) → predicted native tokens → SpeechRestorer (4-layer BERT) → VITS-backend reconstruction → native accented waveform", "metrics": "FAC: accentedness 1.86 vs baseline 2.48 (↓25%), WER 9.1% vs 14.4% (↓37%), CMOS 4.07 vs 3.55; Token: De-dup Efficiency 0.253 vs CosyVoice-50Hz 0.159 (↑59%), Speed Robustness 0.219 vs 0.024 (↑9x) [Table 1-2]", "takeaway": "(1) CTC loss 约束 VQ codebook → tokens 具有\"局部性\"(每帧 token 只编码对应语音段信息),可迁移到任何需要时间对齐离散表征的场景; (2) BERT-style SpeechRestorer 做 LLM 输出的 token-level 后处理纠错,是一个轻量通用方案; (3) 输入扰动 (f0 ± 20%, formant ± 15%) 防止 timbre 泄漏的具体参数值可参考", "limitation": "(1) 韵律建模不够全面,Variance Adapter 仅用 f0 不含 energy/duration; (2) 音色重建质量受限于预训练 Speaker Encoder; (3) SpeechRestorer 无法修复跳词/重复等序列级错误; (4) FAC 评估仅 L2-ARCTIC 一个数据集,TTS 评估落后 NaturalSpeech 2 (CMOS 3.85 vs 3.94),后者数据量 10x+; (5) 未开源", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "LLM-basedTTS", "SpeechFactorization", "SpeakerEmbedding", "ProsodyModeling"], "source": "Sources/SpeechAccentLLM.pdf", "github": "", "demo": ""}, {"name": "SplitMeanFlow", "title": "SplitMeanFlow: Interval Splitting Consistency in Few-Step Generative Modeling", "arxiv_id": "2507.16884", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["flow-matching", "few-step-generation", "one-step-generation", "average-velocity", "algebraic-consistency", "distillation", "TTS", "efficiency"], "summary": "从积分可加性出发推导纯代数的 Interval Splitting Consistency 恒等式,用于训练平均速度场,证明 MeanFlow 的微分恒等式是其极限特例,消除 JVP 计算", "route": "噪声 z1 → uθ(zt, r, t) 预测平均速度 → z0 = z1 - u(z1, 0, 1) (一步生成); 训练时对区间 [r,t] 取中间点 s,强制 (t-r)u(zt,r,t) = (s-r)u(zs,r,s) + (t-s)u(zt,s,t) 的代数一致性", "metrics": "2-step SFT SIM 0.789 vs FM 10-step 0.787, CMOS -0.01; 1-step ICL WER 0.0286 = FM 10-step, CMOS 0; 20x 加速 (FM 10步+CFG=20 NFE vs SMF 1步无CFG=1 NFE) [Table 1, 2]", "takeaway": "(1) 从积分可加性推导 self-consistency 约束,绕过 JVP; (2) 代数恒等式 → 微分恒等式的极限关系,证明 general-to-special 的理论层次; (3) CFG 内化策略 (Stage 2 dropout=0.0,student 直接输出 guided velocity)", "limitation": "仅在 Seed-TTS 内部系统验证,无公开 checkpoint/代码; 未与 DSFlow/RapFlow-TTS 等同期加速方法直接对比; 实验仅覆盖 audio 域,未验证 image/video", "concepts": ["ConditionalFlowMatching", "DiffusionModel", "Classifier-FreeGuidance", "Diffusion-basedTTS", "ScoreMatching"], "source": "Sources/SplitMeanFlow.pdf", "github": "", "demo": ""}, {"name": "Step-Audio2", "title": "Step-Audio 2 Technical Report", "arxiv_id": "2507.16632", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "end-to-end", "multimodal", "latent-encoder", "RAG", "tool-calling", "RLHF", "reinforcement-learning"], "summary": "Step-Audio 系列从 AQTA 级联转向端到端的关键版本,通过 latent audio encoder + reasoning-centric RL + text-audio 交织生成 + RAG/tool-calling,在 ASR/audio-understanding/paralinguistic/speech-conversation 全面 SOTA [§Abstract]", "route": "Input audio → Frozen audio encoder (25Hz) → Adaptor (2x down, 12.5Hz) → LLM decoder → interleaved text+audio tokens → Audio detokenizer (Flow Matching + HiFi-GAN) → waveform [§3.1, Fig 3]", "metrics": "ASR CER 3.08 zh / WER 3.14 en (SOTA vs Kimi/Qwen/GPT-4o) [Table 1]; Paralinguistic 83.09 avg (vs GPT-4o 43.45) [Table 2]; MMAU 78.0 (SOTA) [Table 3]; CoVoST2 BLEU 39.26 avg (SOTA) [Table 4]; URO-Bench zh 83.32 / en 83.90 basic avg (SOTA) [Table 6]", "takeaway": "(1) Latent audio encoder 替代 discrete tokenizer 做输入,保留副语言信息; (2) Reasoning-centric RL: 两阶段 PPO (binary reward → learned reward) + GRPO 提升音频推理; (3) Audio search tool: 语音检索库实现风格/音色切换; (4) Conversational speech synthesis pipeline 生成训练数据 (50K speakers); (5) StepEval-Audio-Paralinguistic: 11 维副语言理解 benchmark", "limitation": "模型参数量未公开 (仅说\"fewer than Step-Audio v1\"); TTS 质量无独立评估 (融合在 conversation 中); RL 的 reasoning trace 格式未详细说明; 端到端但仍需独立 detokenizer (非 waveform 直出)", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "LLM-basedTTS", "ConditionalFlowMatching", "ModalityAdaptationforSpeechLLM"], "source": "Sources/Step-Audio2.pdf", "github": "", "demo": ""}, {"name": "TTS-1", "title": "TTS-1 Technical Report", "arxiv_id": "2507.21138", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "autoregressive", "zero-shot", "GRPO", "RL-alignment", "audio-codec", "single-codebook"], "summary": "Inworld AI 的 1.6B/8.8B 参数 LLaMA-based 自回归 TTS 系统,通过 pre-training → SFT → GRPO 三阶段训练在 human arena 中以 60% 胜率超越 11Labs、Cartesia、OpenAI TTS", "route": "Text + Reference Audio → X-codec2 Encoder (16kHz, 50 tokens/s, 65536 codebook) → LLaMA SpeechLM (AR token generation) → X-codec2 Decoder (super-resolution to 48kHz) → Waveform", "metrics": "TTS-1-Max WER 5.1% (EN avg, RL 后), arena 胜率 59-61% vs 11Labs/Cartesia/OpenAI [Table 8-9]; SIM 0.535 (decode with prompt) vs 0.495 (without) [Table 10]; DNSMOS 4.195 (48kHz codec) [Table 2]", "takeaway": "(1) RMS loudness loss 解决流式音量不一致; (2) neutral-stylized speaker pairing + LoRA 实现风格控制同时保持说话人一致性; (3) 非发声区域拼接 + decoder context extension 解决流式拼接伪影", "limitation": "未报告 SEED-TTS-Eval 标准指标,难以直接与 CosyVoice 3 / Qwen3-TTS 等系统对比; arena 评估仅 400 票,统计显著性有限; 模型权重未开源", "concepts": ["LLM-basedTTS", "SpeechLanguageModel", "Single-codebookvsMulti-codebook", "DifferentiableRewardOptimization", "EmotionControlinTTS", "CodecTrainingObjectives", "VoiceCloningTaxonomy"], "source": "Sources/TTS-1.pdf", "github": "", "demo": ""}, {"name": "TTS-CtrlNet", "title": "TTS-CtrlNet: Time varying emotion aligned text-to-speech generation with ControlNet", "arxiv_id": "2507.04349", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "zero-shot", "flow-matching", "ControlNet", "DiT", "arousal-valence", "time-varying-control"], "summary": "将图像 ControlNet 范式首次迁移至 flow-matching TTS (F5-TTS),冻结原始模型仅训练可学习副本,用 ~400 小时公开情感数据实现时变情感控制,同时保留 zero-shot voice cloning 能力", "route": "参考音频 → SER (wav2vec 2.0-based, 窗口滑动插值) → arousal-valence embedding → [noisy speech + masked speech + transcript + emotion] → ControlNet (trainable DiT blocks subset) → zero-conv → 原始 F5-TTS DiT blocks (frozen) → mel spectrogram → vocoder → waveform", "metrics": "JVNV S2ST: Emo-SIM 0.751 / Aro-Val SIM 0.742 (超越 EmoCtrl-TTS(+) 0.697/0.643); EMO-Change: Emo-SIM 0.724 / Aro-Val SIM 0.864 (超越 EmoCtrl-TTS(+) 0.679/0.811); WER: EMO-Change 0.6% (与 F5-TTS 2.9% 可比) [Table 5]", "takeaway": "(1) ControlNet 冻结-副本范式可用于任何 flow-matching 生成模型的条件扩展; (2) emotion-specific flow step: 只在 flow step [0, 0.1] 区间注入情感条件,既省算力又提升质量; (3) block-level 消融定位关键 block 后将其排除在 ControlNet 连接外,保护文本保真度", "limitation": "仅用 F5-TTS 作为 backbone (未验证其他模型泛化); 无 NV (笑声/哭泣) 控制 (仅用 emotion encoder); WER 在 JVNV S2ST 上退化至 5.4% (F5-TTS 4.5%); 未开源代码/权重", "concepts": ["ConditionalFlowMatching", "EmotionControlinTTS", "MelSpectrogram", "Self-SupervisedSpeechRepresentation", "SpeakerEmbedding", "Diffusion-basedTTS"], "source": "Sources/TTS-CtrlNet.pdf", "github": "", "demo": ""}, {"name": "TraceableTTS", "title": "Traceable TTS: Toward Watermark-Free TTS with Strong Traceability", "arxiv_id": "2507.03887", "date": "2025-07", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "traceability", "deepfake-detection", "model-attribution", "joint-training", "watermark-free", "security", "speech-synthesis"], "summary": "通过反转 GAN generator 的 loss 方向实现 TTS 模型与判别器的协同训练,让模型自然产生可追溯的隐式指纹,无需嵌入任何显式水印", "route": "Text → F5-TTS (CFM+DiT, Mel) → Vocos (vocoder) → Speech; 判别器: Speech → wav2vec 2.0 (feature) → LCNN (classifier) → Binary (yes/no this model); 训练 10 loops 交替 finetune TTS + 生成数据 + 训练判别器", "metrics": "域内 AUC 0.9999 / EER 0.29% [Table 2]; 域外泛化 AUC 0.9421 vs baseline 0.8823, EER 11.50% vs 18.99% [Table 3]; 语音质量 WER 2.033% vs 原始 2.202%, UTMOS 3.958 vs 3.926 [Table 5] (LibriSpeech-PC test-clean)", "takeaway": "(1) 反转 GAN loss 实现协同训练的思路,可推广到任何需要让生成器输出携带可识别特征的场景 (如品牌音色标记、生成内容溯源); (2) 三阶段循环训练 (finetune→infer→train-disc) 的迭代增强策略", "limitation": "仅适用于端到端可微的 TTS (不支持 VALL-E 等 discrete token 模型); 域外 EER 仍 11.5%; 噪声/变调攻击下精度大幅下降 (~13%); 仅在 F5-TTS + LibriTTS 上验证; 未讨论多模型共存场景", "concepts": ["Anti-spoofingandDeepfakeDetection", "ConditionalFlowMatching", "TTSEvaluation", "VoiceCloningTaxonomy", "Self-SupervisedSpeechRepresentation"], "source": "Sources/TraceableTTS.pdf", "github": "", "demo": ""}, {"name": "ZipVoice-Dialog", "title": "ZipVoice-Dialog: Non-Autoregressive Spoken Dialogue Generation with Flow Matching", "arxiv_id": "2507.09318", "date": "2025-07", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["zero-shot-TTS", "flow-matching", "NAR-TTS", "dialogue-synthesis", "turn-taking", "curriculum-learning", "stereo-audio", "dataset"], "summary": "首个 NAR flow-matching 对话 TTS,通过 curriculum learning + speaker-turn embeddings 两个轻量设计使 123M 模型在对话生成上全面超越 1.6B Dia 和 2.7B MoonCast", "route": "文本 (interleaved [S1]/[S2] tokens) → Zipformer text encoder → average upsample + speaker-turn embedding → Zipformer vector field estimator (CFM) → Euler ODE solver → Vocos vocoder → waveform", "metrics": "WER 3.25% / cpWER 3.27% / cpSIM 0.437 / UTMOS 3.07 (test-en), RTF 0.063 (15x faster than baselines) [Table 4]; CMOS +1.17 vs MoonCast, SMOS 3.86 vs 2.35 [Table 5]", "takeaway": "(1) curriculum learning (monologue pretrain → dialogue finetune) 解决多说话人 alignment collapse,成本极低; (2) 两个 learnable embeddings 做 speaker disambiguation 比复杂 speaker encoding 更有效; (3) speaker exclusive loss 惩罚双通道同时活跃帧,适用于任何需要通道分离的生成任务", "limitation": "模型仅 123M,表达力受限 (MoonCast 在 expressiveness 上更好); 仅支持双人对话; stereo 模型性能弱于 mono (受限于双通道数据量); 主观评估仅中文", "concepts": ["ConditionalFlowMatching", "Non-autoregressiveTTS", "Turn-takinginSpokenDialogue", "Speech-TextAlignment", "Classifier-FreeGuidance", "SpokenDialogueEvaluation"], "source": "Sources/ZipVoice-Dialog.pdf", "github": "", "demo": ""}, {"name": "CMT-LLM", "title": "CMT-LLM: Contextual Multi-Talker ASR Utilizing Large Language Models", "arxiv_id": "2506.12059", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multi-talker-ASR", "contextual-biasing", "LLM", "SOT", "speech-recognition", "WavLM", "LoRA", "CTC"], "summary": "首次将多说话人 ASR (SOT) 与上下文偏置 (contextual biasing) 统一到单一 LLM 框架中,通过 CTC 粗解码 + 编辑距离过滤缩减大规模偏置列表后注入 prompt", "route": "重叠语音 → WavLM-Large (SOT finetuned) → 1D Conv downsampler (5x) → 2-layer linear projector → Vicuna-7B (LoRA) + prompt biasing list → SOT 转写", "metrics": "LibriMix WER 7.3% (test, +100 distractors) / 7.9% (+1000), AMI SDM WER 32.9% (+1000); B-WER 从 25.3% 降至 8.7% (LibriMix +100) [Table 1, 2, 3]", "takeaway": "CTC 粗解码 + 子组合编辑距离过滤作为大规模偏置列表的实用缩减策略; prompt-based contextual biasing 比后处理纠错更有效", "limitation": "biasing list > 300 词无过滤时性能反而劣于 baseline [Fig 3a]; 过滤后 coverage 随 distractors 增加下降 (5000 distractors 时仅 83%); Vicuna-7B 较旧; 无 speaker diarization 输出", "concepts": ["ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "LLM-enhancedASR", "Self-SupervisedSpeechRepresentation"], "source": "Sources/CMT-LLM.pdf", "github": "", "demo": ""}, {"name": "CapSpeech", "title": "CapSpeech: Enabling Downstream Applications in Style-Captioned Text-to-Speech", "arxiv_id": "2506.02863", "date": "2025-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "style-captioned", "benchmark", "dataset", "emotion", "accent", "sound-event", "autoregressive"], "summary": "首个统一覆盖完整语音风格属性的大规模 CapTTS 基准,定义 5 个下游任务并提供 AR/NAR 两类模型的全面基线", "route": "Text + Style Caption → (AR: Parler-TTS codec LM / NAR: F5-TTS flow matching + cross-attention) → Speech (可含 sound events)", "metrics": "NAR-CapTTS Style-ACC 66.0% / UTMOS 3.37 / WER 9.2% [Table 4]; NAR > AR 在多数任务; 预训练提升 Style-ACC 约 20% abs [Table 4]", "takeaway": "(1) LAION-CLAP embedding 作为 sound event 条件输入,使 NAR 模型可泛化到未见过的声音事件 [§4.1]; (2) 用 BERT 从 transcription+caption 联合预测总时长,解决 NAR 无法自动预测 duration 的问题 [§4.1]; (3) 将 sound event 的 background/insertion 控制编码为特殊 token (<B></B>, <I></I>) 嵌入转录文本 [§4.1]", "limitation": "仅英语; 无 AI 安全 (水印/检测) 方案; 自动风格评估仍依赖离散分类器而非感知对齐; AgentTTS 风格一致性和 CapTTS-SE 可懂度仍有明显 gap [§5, §6]", "concepts": ["NaturalLanguageDescriptionforTTS", "Classifier-FreeGuidance", "ConditionalFlowMatching", "CodecLanguageModel", "EmotionControlinTTS", "StyleTransferinTTS"], "source": "Sources/CapSpeech.pdf", "github": "", "demo": ""}, {"name": "DS-TTS", "title": "DS-TTS: Zero-Shot Speaker Style Adaptation from Voice Clips via Dynamic Dual-Style Feature Modulation", "arxiv_id": "2506.01020", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "voice-cloning", "speaker-encoding", "style-transfer", "FiLM", "dynamic-network", "non-autoregressive"], "summary": "在 FastSpeech 2 架构上,用 mel + MFCC 双风格编码器 (DuSEN) 提取互补说话人特征,并通过动态变体适配器 (DyGN) 为长短序列选择不同预测器,改善 zero-shot voice cloning 的 speaker similarity。", "route": "参考音频 → DuSEN (Mel-Style Encoder + MFCC-Style Encoder → 256d 拼接向量) → SGF 注入 FFT → Phoneme Encoder → Dynamic Variance Adaptor (短≤85用Conv1D / 长>85用Linear) → Mel Decoder → MelGAN vocoder → 波形", "metrics": "SMCS 0.865 / WER 0.047 (VCTK unseen 108 speakers) [Table I]; 短句 MOS 4.08 / SMOS 3.72, 长句 MOS 4.12 / SMOS 3.99 [Table II]", "takeaway": "(1) mel + MFCC 双表征捕捉互补说话人信息; (2) 按序列长度动态路由到不同预测器架构 (Conv1D vs Linear); (3) 在 FiLM 基础上增加 gating 参数 (eta, delta) 做更精细的风格调制", "limitation": "仅在 VCTK (108 speakers) 上评估泛化; 使用 MelGAN vocoder (已过时); 未对比 LLM-based SOTA (CosyVoice, Seed-TTS 等); 仅英语; 训练数据仅 ~460h (LibriTTS clean); 未验证极端口音/情感场景", "concepts": ["SpeakerEmbedding", "StyleTransferinTTS", "Non-autoregressiveTTS", "DurationPredictor", "VoiceCloningTaxonomy", "GlobalStyleTokens"], "source": "Sources/DS-TTS.pdf", "github": "", "demo": ""}, {"name": "DrVoice", "title": "DrVoice: Parallel Speech-Text Voice Conversation Model via Dual-Resolution Speech Representations", "arxiv_id": "2506.09349", "date": "2025-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-LM", "parallel-speech-text", "dual-resolution", "speech-tokenizer", "joint-modeling", "grouping", "SRH"], "summary": "通过 dual-resolution speech representations (DRSR) 将 LLM 输入帧率降至 5Hz,结合 Speech Refined Head (SRH) 自回归恢复 25Hz 输出,在 parallel speech-text 框架下以最低计算成本达到 7B 级 SOTA", "route": "User speech → Whisper-v3 encoder + Adapter(理解侧) / S3Tokenizer 25Hz → Grouping k=5 → 5Hz(生成侧) → Shared LLM Layer → Text Head(文本) + SRH ungrouping(语音) → CosyVoice Flow Matching + HiFi-GAN", "metrics": "OpenAudioBench 72.04, VoiceBench 80.17, UltraEval-Audio 56.66, BBA 74.0 (均 SOTA among ~7B); UTMOS 4.29; ASR-WER 8.36; ~50% GPU hours 节省", "takeaway": "(1) Grouping+SRH 双分辨率设计可迁移到任何 parallel speech-text 系统; (2) Core-Cocktail 两阶段训练(高 LR 全参 → merge 回 base → 低 LR 精调)是通用的 LLM 知识保留策略; (3) CoM-Mixing 的 7 种交互模式系统 prompt 设计", "limitation": "无全双工; ASR-WER 8.36 落后 Qwen2.5-Omni (3.48); 仅英文; 未开源完整代码", "concepts": ["SemanticvsAcousticTokens", "SpeechTokenizer", "SpeechLanguageModel", "Speech-TextAlignment", "TokenRateandBitrateTrade-offs", "ModalityAdaptationforSpeechLLM", "ConditionalFlowMatching"], "source": "Sources/DrVoice.pdf", "github": "", "demo": ""}, {"name": "IndexTTS2", "title": "IndexTTS2: A Breakthrough in Emotionally Expressive and Duration-Controlled Auto-Regressive Zero-Shot Text-to-Speech", "arxiv_id": "2506.21619", "date": "2025-06", "venue": "AAAI 2026", "org": "", "tier": "repro", "tags": ["TTS", "zero-shot", "autoregressive", "emotion-control", "duration-control"], "summary": "通过位置编码共享 (W_sem=W_num) 实现 AR TTS 精确时长控制,通过 GRL 对抗训练实现情感-音色解耦的 zero-shot 情感迁移", "route": "Text + timbre/style prompt → T2S (AR Transformer) → semantic tokens → S2M (CFM) → Mel → BigVGAN → Waveform", "metrics": "WER 1.008% / SS 0.865 (SeedTTS test-zh); ES 0.887 / EMOS 4.22 (Emotional test set); duration token error <0.02% (SeedTTS 1x)", "takeaway": "W_sem=W_num 位置编码共享零开销实现 AR duration control; GRL 解耦情感与音色可迁移到任何内容-风格分离场景; \"全量预训→135h 精调→全量回炉\" 三阶段范式应对稀缺数据", "limitation": "情感数据仅 135h / 7 种基础情感; 仅支持中英文; 未报告 RTF/推理延迟; 开源状态未明确", "concepts": ["ConditionalFlowMatching", "SpeechTokenizer", "GradientReversalLayer"], "source": "Sources/IndexTTS2.pdf", "github": "", "demo": ""}, {"name": "InstructTTSEval", "title": "InstructTTSEval: Benchmarking Complex Natural-Language Instruction Following in Text-to-Speech Systems", "arxiv_id": "2506.16381", "date": "2025-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "evaluation", "benchmark", "instruction-following", "controllability", "style-control", "paralinguistic", "LLM-as-judge"], "summary": "首个分层级 (APS/DSD/RP) 的指令遵循 TTS benchmark,覆盖 12 个副语言特征 x 3 抽象层级 x 2 语言 = 6K 测试用例,用 Gemini-as-Judge 自动评估", "route": "影视数据 → 清洗/过滤(DNSMOS+DVA) → Gemini 生成 speech caption (APS) → GPT-4o 生成 DSD/RP 指令 → TTS 合成 → Gemini-as-Judge 评估 True/False", "metrics": "商用最佳 gemini-flash EN-Avg 88.7% (超过 reference_audio 84.3%,有 self-preference bias 嫌疑), 开源最佳 VoxInstruct EN-Avg 50.4%; 人机一致率整体 79.0% (APS 87%, DSD 79%, RP 71%) [Table 4-6]", "takeaway": "(1) 从影视数据 bottom-up 构造 benchmark 的思路 — 先有表现力强的音频,再反向生成指令; (2) 12 特征 x 3 抽象层级的分层设计思想可迁移到其他可控生成评估; (3) Gemini-as-Judge 在 TTS 指令评估中 79% 一致率,成本约 $12/session", "limitation": "(1) RP 任务主观性强,人机一致率仅 66-76%; (2) Gemini 做 judge 可能偏好自己的输出; (3) 仅 True/False 二分评估,无连续分数; (4) 数据源集中在影视,口语/对话场景不足; (5) 中文 subset 仅评测了 3 个商用 + 1 个开源系统", "concepts": ["TTSEvaluation", "NaturalLanguageDescriptionforTTS", "Instruction-GuidedSpeechSynthesis", "ProsodyModeling", "EmotionControlinTTS", "StyleTransferinTTS"], "source": "Sources/InstructTTSEval.pdf", "github": "", "demo": ""}, {"name": "LM-SPT", "title": "LM-SPT: LM-Aligned Semantic Distillation for Speech Tokenization", "arxiv_id": "2506.16738", "date": "2025-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "semantic-distillation", "RVQ", "speech-LM", "low-frame-rate", "codec-design"], "summary": "提出 reconstruction-driven semantic distillation — 不直接对齐 teacher-student 特征,而是用 ASR encoder (Whisper) 对比原始与语义重建波形的表征差异,使 speech token 在低帧率下更好对齐 LM 语义", "route": "语音波形 → dual encoder (semantic encoder + acoustic encoder) → Split VQ (semantic VQ + acoustic RVQ) → Vocos decoder 重建; 同时 semantic tokens → 轻量 auxiliary decoder → 重建波形 → Whisper encoder 表征 → 与原始波形 Whisper 表征 MSE loss", "metrics": "重建 WER 3.19% (25Hz) / 3.92% (12.5Hz) / 8.35% (6.25Hz); TTS WER 4.94% (25Hz, 0.5B LM), UTMOS 3.82; 全面超越 SpeechTokenizer 和 Mimi baseline [Table 1, 2]", "takeaway": "(1) reconstruction-driven distillation 绕过帧率对齐约束,可泛化到任意 teacher-student 帧率组合; (2) 轻量 auxiliary decoder 作为 information bottleneck 迫使 semantic encoder 学习更紧凑表征; (3) dual encoder 显式分离 semantic/acoustic 编码,比 shared encoder 提升约 0.3% WER", "limitation": "仅在 LibriSpeech (1K h) 上训练,泛化能力有待验证; 仅测试 16kHz; 6.25Hz 帧率下 TTS WER 仍>18%,极低帧率性能待改善; 未开源代码/权重", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "ResidualVectorQuantization", "TokenRateandBitrateTrade-offs", "Self-SupervisedSpeechRepresentation", "SpeechLanguageModel", "CodecTrainingObjectives"], "source": "Sources/LM-SPT.pdf", "github": "", "demo": ""}, {"name": "LightweightPromptBiasing", "title": "Lightweight Prompt Biasing for Contextualized End-to-End ASR Systems", "arxiv_id": "2506.06252", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["ASR", "contextual-biasing", "multi-task-learning", "entity-filtering", "prompt-biasing", "Conformer", "Transformer"], "summary": "通过在 Transformer ASR decoder 的输入中插入 entity prompt + task tokens (`<hit>/<miss>`),实现零架构改动的 contextual biasing,并复用同一模型做 entity filtering 缩减候选列表", "route": "音频 → Conformer encoder → cross-attention decoder(prompt: `<sop> entities <sot>` + task token `<hit>/<miss>`) → 转写; 推理时先单实体过滤(Phit < 0.5 的丢弃)再拼接 prompt 做最终解码", "metrics": "EWER 4.04%(小列表)/ 4.95%(大列表),相比 baseline+shallow fusion 分别降低 30.7% / 18.0% [Table III, D1 vs B1, D2 vs B2]; 噪声鲁棒性仅增 0.06% WER [Table V]", "takeaway": "(1) 用 task tokens 区分\"需要偏置\"和\"不需要偏置\"两种模式,避免 prompt 干扰正常识别; (2) 复用主模型做 entity filtering——对每个候选实体单独前向一次取 `<hit>` 概率,阈值 0.5 过滤,可批处理", "limitation": "仅在 Microsoft 内部数据集评估,无公开 benchmark 对比; entity filtering 需对每个候选做一次 decoder forward,大列表(~2000)时仍有延迟开销; 未与 LLM-based contextual biasing 做对比", "concepts": ["LLM-enhancedASR"], "source": "Sources/LightweightPromptBiasing.pdf", "github": "", "demo": ""}, {"name": "MAEStyle-RichTTS", "title": "Controllable Text-to-Speech Synthesis with Masked-Autoencoded Style-Rich Representation", "arxiv_id": "2506.02997", "date": "2025-06", "venue": "arXiv:2506.02997", "org": "", "tier": "deep", "tags": ["TTS", "controllable-TTS", "style-control", "masked-autoencoder", "autoregressive", "discrete-labels", "CFG", "two-stage"], "summary": "用 MAE 提取的 style-rich tokens 作为两阶段 LM pipeline 的中间表示,实现离散标签对 TTS 多属性 (pitch/emotion/timbre/环境) 的细粒度控制,并通过数据解耦缓解高质量语料稀缺问题。", "route": "离散控制标签 + phonemes → Style LM → style-rich tokens → Acoustic LM → codec tokens → EnCodec decoder → waveform", "metrics": "UTMOS 3.63 (LibriTTS), SIM 0.90 (LibriTTS); 两阶段 emotion control accuracy Aro 78.0% / Dom 80.9% / Val 68.5% (Gigaspeech, CFG=2.0/3.0); 主观 MOS-Q 4.18, MOS-A 4.28 [Table III, IV, V]", "takeaway": "(1) MAE mask-reconstruction 范式提取 content-free style features 的思路; (2) 两阶段数据解耦 --- 控制阶段用大量低质量数据、生成阶段用少量高质量数据; (3) phone-level merge 压缩 style token 序列长度; (4) CFG 在 AR LM logit 上增强细粒度属性控制", "limitation": "标注工具精度有限导致控制 bias; SNR/C50 控制受 codec 性能限制; 边缘标签 (儿童音色/极端 SNR) 控制退化; 无与现有 NL-prompt 可控 TTS 的直接对比; 未开源", "concepts": ["StyleTransferinTTS", "Classifier-FreeGuidance", "ProsodyModeling", "SpeakerEmbedding", "ResidualVectorQuantization", "LLM-basedTTS", "EmotionControlinTTS"], "source": "Sources/MAEStyle-RichTTS.pdf", "github": "", "demo": ""}, {"name": "MagiCodec", "title": "MagiCodec: Simple Masked Gaussian-Injected Codec for High-Fidelity Reconstruction and Generation", "arxiv_id": "2506.00385", "date": "2025-06", "venue": "arXiv preprint (under review)", "org": "", "tier": "deep", "tags": ["audio-codec", "single-codebook", "streaming", "Transformer", "Gaussian-noise-injection", "VQ", "multi-stage-training", "Zipf-distribution"], "summary": "通过 Gaussian noise injection 在频域隐式正则化高频成分 + 三阶段训练避免 codebook collapse,在单层 streaming codec 上同时达到 SOTA 重建质量和下游可建模性", "route": "16kHz 波形 → Linear Downsample + Windowed Transformer Encoder → SVQ (K=131072, D=16) → Transformer Decoder + Linear Upsample → 重建波形; 三阶段: AE+Mask → Quantizer → GAN Vocoder", "metrics": "重建: WER 3.16/PESQ 2.56/UTMOS 4.18/SPK-SIM 0.76 (LibriSpeech test-clean, 850bps) [Table 2]; ZS-TTS: WER 3.30/UTMOS 4.27 [Table 3]; ASR PER 7.7 [Table 4]; Emotion ACC 0.70 [Table 5]", "takeaway": "(1) Bernoulli mask + Gaussian replacement 作为无需外部模型的内在频域正则化,理论简洁实现容易; (2) 三阶段训练 (AE→VQ→Vocoder) 解耦冷启动问题; (3) Zipf 分布分析作为 token 语义质量的诊断工具", "limitation": "仅在 16kHz 英语语音上训练和评估,未测试噪声鲁棒性和高采样率; 单层量化可能不足以覆盖宽带音频 (如音乐); 209.7M 参数较大", "concepts": ["CodebookCollapse", "Single-codebookvsMulti-codebook", "SemanticvsAcousticTokens", "TokenRateandBitrateTrade-offs", "CodecTrainingObjectives", "AudioTokenizerTaxonomy"], "source": "Sources/MagiCodec.pdf", "github": "", "demo": ""}, {"name": "Ming-Omni", "title": "Ming-Omni: A Unified Multimodal Model for Perception and Generation", "arxiv_id": "2506.09344", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["omni-model", "multimodal", "MoE", "modality-specific-router", "speech-understanding", "speech-generation", "image-generation", "image-editing"], "summary": "基于 MoE 架构 LLM (Ling) 构建的全模态统一感知-生成模型,通过 modality-specific router 解决模态冲突,支持 image/video/audio 理解 + speech/image 生成,是首个开源对标 GPT-4o 模态覆盖的模型", "route": "Image/Video → Qwen2.5-VL encoder → projection → Ling (MoE + modality-specific routers, 2.8B active) → text; Audio → Whisper encoder → linear+conv downsample → Ling → text; Text → Ling → hidden states → AR audio decoder (discrete tokens via BPE) → speech; Text → Ling → multi-scale learnable tokens → connector → DiT → image", "metrics": "Audio understanding: Aishell1 WER 1.47, LS-clean WER 1.44, in-house dialect avg 5.45 (vs Qwen2.5-Omni 14.79) [Table 10]; TTS: Seed-zh WER 1.69, Seed-en WER 4.31 [Table 12]; Image gen: GenEval 0.64, FID 4.85 (SOTA across unified models) [Table 5]; Audio QA: AlpacaEval 4.63, IFEval 58.36 [Table 11]", "takeaway": "(1) BPE on audio tokens — 无损压缩 36% 且改善韵律的低成本技巧 [§2.2]; (2) 两阶段训练冻结 LLM — 生成训练时冻结全部理解模块,完全避免理解-生成冲突 [§2.4]; (3) Language ID prediction before downstream — 先预测语言标识再做 ASR/QA 任务,对方言识别提升显著 [§2.2]; (4) 元数据属性注入 instruction prompt — 用 audio labeler 标注场景/环境信息作为可选上下文提示 [§2.2]", "limitation": "TTS 的 SIM 偏低 (zh 0.68, en 0.51 vs Qwen2.5-Omni zh 0.75, en 0.63) [Table 12]; 仅评估 lite 版本 (2.8B active),完整版性能未公开; image generation GenEval 0.64 低于 JanusPro (0.80) 和 SD3-Medium (0.74) [Table 5]; context-aware speech generation (Ming-Lite-Omni-context) WER 反而上升 (zh 1.98 vs 1.69, en 5.10 vs 4.31) [Table 12]", "concepts": ["SpeechLanguageModel", "LLM-basedTTS", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding"], "source": "Sources/Ming-Omni.pdf", "github": "", "demo": ""}, {"name": "MultilingualTTSAccentsEmotions", "title": "Optimizing Multilingual Text-To-Speech with Accents & Emotions", "arxiv_id": "2506.16310", "date": "2025-06", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "multilingual", "accent", "emotion", "code-switching", "Indic", "fine-tuning", "Parler-TTS"], "summary": "在 Parler-TTS 基础上通过多阶段 fine-tuning 实现 Hindi + Indian English 双语口音控制与情感表达", "route": "文本 → Flan-T5 编码 + NL description 条件 → Parler-TTS decoder → DAC vocoder → 语音(分阶段: 口音 FT → Hindi FT → 情感 FT)", "metrics": "WER 15.4%→11.8% (Indian accent); 情感识别 85.3%; MOS 4.2/5 (文化正确性); PESQ/STOI 超越 Audiobox [§4, Fig 4-8]", "takeaway": "用 dataspeech 库自动提取语音特征 → 映射到 Parler-TTS 的 NL prompt 格式,低成本实现口音/情感条件化", "limitation": "仅限 Hindi + Indian English 两种口音; 离散情感标签(8类); 训练数据规模小(5h Hindi + expresso subset); 未与主流 LLM-based TTS 对比; 缺少消融实验; 部分 claim 缺乏支撑细节", "concepts": ["EmotionControlinTTS", "NaturalLanguageDescriptionforTTS", "SpeechFactorization", "StyleTransferinTTS", "SpeakerEmbedding"], "source": "Sources/MultilingualTTSAccentsEmotions.pdf", "github": "", "demo": ""}, {"name": "PMF-CEC", "title": "PMF-CEC: Phoneme-augmented Multimodal Fusion for Context-aware ASR Error Correction with Error-specific Selective Decoding", "arxiv_id": "2506.11064", "date": "2025-06", "venue": "arXiv (submitted to IEEE journal)", "org": "", "tier": "deep", "tags": ["ASR", "error-correction", "multimodal-fusion", "phoneme", "contextual-biasing", "rare-word", "postprocessing", "non-autoregressive"], "summary": "在 ASR 后处理纠错框架中引入 phoneme-augmented multimodal fusion (BERT+XPhoneBERT cross-attention),专门解决同音异义词错误,同时用 Retention Probability Mechanism 抑制过检测", "route": "ASR transcript + Rare word list → G2P 转 phoneme → BERT(text) + XPhoneBERT(phoneme) → cross-attention fusion → AED(3类编辑标签 K/D/C) → CEC(Generation Decoder + Context Decoder 加权) → 纠正后文本", "metrics": "在 5 数据集上相比 ED-CEC: WERR 4.25%-14.46%, B-WER 改善 8.39%-12.56% [Table VI]; 推理速度 27-38ms, 比 SC BART 快 2.4-5.3x [Table VII]; Whisper 上 B-WER 相对下降 36.27%(test-clean) [Table VIII]", "takeaway": "(1) 用 cross-attention 对齐不同长度的多模态表征(text vs phoneme),再做残差加法融合; (2) RPM 的置信度过滤机制——对编辑操作设阈值保留原始标签,简单但有效抑制过纠正; (3) dummy token 插入法将全自回归解码转为部分自回归,仅对 CHANGE 位置做生成,节省 4/5 解码时间", "limitation": "仅限英文(XPhoneBERT 虽多语言但实验全英文); phoneme 信息仅在后处理阶段引入,不参与 LM 解码的实时决策; 依赖预构建 rare word list 作为上下文来源; 空 biasing list 时仍能纠错但效果有限", "concepts": ["PhonemeRepresentation", "LLM-enhancedASR", "Self-SupervisedSpeechRepresentation"], "source": "Sources/PMF-CEC.pdf", "github": "", "demo": ""}, {"name": "Prompt-Unseen-Emotion", "title": "Prompt-Unseen-Emotion: Zero-shot Expressive Speech Synthesis with Prompt-LLM Contextual Knowledge for Mixed Emotions", "arxiv_id": "2506.02742", "date": "2025-06", "venue": "arXiv (Interspeech 2025 投稿)", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "zero-shot", "mixed-emotion", "LLM-based", "prompt-learning", "in-context-learning", "CosyVoice"], "summary": "基于 CosyVoice LLM-TTS 架构,通过 emotion-guided prompt (α%/β%/γ%/ε%/λ% 百分比模板) 训练时学习单一情感-prompt 一致性,推理时调整百分比实现零样本混合情感语音合成", "route": "Emotion-guided prompt (EP: \"A man/woman speaks ... α% happy, β% sad, ...\") + Input text → [Text Encoder + LLM Decoder (init from CosyVoice)] → Emotional speech tokens → [Frozen Flow-Matching + Frozen HiFi-GAN] → Mixed-emotion waveform", "metrics": "WER: PUE 25.19-26.67% vs cosy 39.26-51.85% vs mix 27.41-32.59% (各混合条件) [Table I]; AB Preference: PUE vs mix 68-87% 偏好 PUE [Fig 3]; MOS (unseen emotions): PUE outrage 3.57±0.18, disappointment 3.12±0.16, delight 3.50±0.13 (均高于 cosy 和 mix baselines) [Fig 5, Table III]", "takeaway": "(1) 用百分比 prompt 模板实现 zero-shot compositionality — 训练时每个样本只有一种情感 (对应参数=100, 其余=0),推理时混合任意比例即可; (2) 利用 LLM 的 in-context learning 隐式理解情感比例语义,无需设计专门的混合机制; (3) 用 label smoothing KL loss 保证情感概率分布一致性", "limitation": "(1) 仅在 ESD 数据集 2 说话人 (~2.4h 总计) 上验证,泛化性未知; (2) 仅 5 种基础情感,混合实验仅以 surprise 为基底; (3) WER 绝对值较高 (25-27%),语音可懂度有限; (4) 主观评测仅 18 人; (5) 代码尚未开源 (upon acceptance); (6) 未与 Daisy-TTS 等 Plutchik 模型方法直接对比", "concepts": ["EmotionControlinTTS", "LLM-basedTTS", "Instruction-GuidedSpeechSynthesis", "SpeechTokenizer", "ConditionalFlowMatching", "NaturalLanguageDescriptionforTTS"], "source": "Sources/Prompt-Unseen-Emotion.pdf", "github": "", "demo": ""}, {"name": "RapFlow-TTS", "title": "RapFlow-TTS: Rapid and High-Fidelity Text-to-Speech with Improved Consistency Flow Matching", "arxiv_id": "2506.16741", "date": "2025-06", "venue": "arXiv 2025", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "consistency-model", "few-step-generation", "acoustic-model", "efficiency", "adversarial-learning", "NAR"], "summary": "首次将 consistency flow matching 引入 TTS,通过在直 ODE 轨迹上强制速度一致性,实现 2 步高保真合成,NFE 较 FM/diffusion 基线降低 5-10 倍", "route": "Text → Text Encoder + MAS Aligner → Prior µ → Consistency FM Decoder (multi-segment, conditioned on µ+t) → Euler ODE (2 steps) → Mel Spectrogram → HiFi-GAN → Waveform", "metrics": "LJSpeech 2-step: MOS 4.01 vs Matcha-TTS 3.83(10步)/3.32(2步), Grad-TTS 3.78(25步), VoiceFlow 3.42(10步)/3.05(2步), ComoSpeech 3.19(2步) [Table 1]; WER 3.11 vs Matcha-TTS 3.28(10步) [Table 1]; RTF 0.031 ≈ FastSpeech2 [Table 1]; VCTK 2-step: MOS 4.28, WER 2.01 [Table 3]", "takeaway": "(1) 两阶段训练策略(先直流再一致性)可迁移至任何 ODE 生成模型; (2) multi-segment consistency FM 将 [0,1] 分为 S 段用分段线性逼近,对复杂分布建模有效; (3) delta scheduling (线性递减 Δt) 改善一致性训练的 bias-variance 权衡; (4) 对抗学习扩展到 multi-segment endpoint 匹配,每段端点都做 discriminator 监督", "limitation": "仅在 LJSpeech (24h) + VCTK (44h) 上验证,未测试大规模数据; 仅单/多说话人英文场景,无 zero-shot 实验; NFE>2 时性能反而下降(一致性模型的固有特性),高步数场景无优势; 代码已开源但仅 Euler solver", "concepts": ["ConditionalFlowMatching", "Diffusion-basedTTS", "DiffusionModel", "ScoreMatching", "Non-autoregressiveTTS", "DurationPredictor", "MelSpectrogram"], "source": "Sources/RapFlow-TTS.pdf", "github": "", "demo": ""}, {"name": "Step-Audio-AQAA", "title": "Step-Audio-AQAA: a Fully End-to-End Expressive Large Audio Language Model", "arxiv_id": "2506.08967", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "end-to-end", "AQAA", "audio-language-model", "DPO", "dual-codebook", "flow-matching", "vocoder"], "summary": "130B 端到端 LALM,通过双码本 tokenizer + tri-codebook interleaved output + masked DPO + 三模型权重合并,实现 audio-in audio-out 直接交互,在语音情感控制等维度领先 Kimi-Audio 和 Qwen-Omni", "route": "Audio input → dual-codebook tokenizer (linguistic 16.7Hz + semantic 25Hz, 2:3 interleave) → 130B LLM (Step-Omni) → interleaved text+audio tokens (10:6:9) → OT-CFM vocoder → speech output", "metrics": "StepEval-Audio-360 人工评估 MOS (1-5),在 Speech Emotion Control / Creativity / Language Ability / Role-playing / Gaming 维度领先 Kimi-Audio 和 Qwen-Omni [Fig 3]; ablation 中 ratio_10_15 的 Chat 4.03 / Factuality 0.67 显著优于 audio_only 的 1.72 / 0.03 [Table 1]", "takeaway": "(1) DPO 时 mask audio token loss 避免文本-音频对齐退化; (2) text tokens 作为中间输出辅助 audio generation 的语义一致性; (3) 多阶段模型权重合并 (5:5:1) 融合互补能力", "limitation": "仅有 MOS 人工评估,缺乏 WER/SIM 等客观指标; Singing 和 Voice Instruction Following 维度弱; 模型 130B 参数未公开训练细节; 评测基准 StepEval-Audio-360 为自建,外部可比性有限", "concepts": ["SpeechLanguageModel", "SemanticvsAcousticTokens", "ConditionalFlowMatching", "NeuralVocoder", "Single-codebookvsMulti-codebook", "Speech-TextAlignment", "EmotionControlinTTS", "AudioUnderstanding"], "source": "Sources/Step-Audio-AQAA.pdf", "github": "", "demo": ""}, {"name": "StreamMel", "title": "StreamMel: Real-Time Zero-shot Text-to-Speech via Interleaved Continuous Autoregressive Modeling", "arxiv_id": "2506.12570", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "streaming", "autoregressive", "continuous-token", "mel-spectrogram", "interleaving", "low-latency"], "summary": "首个单阶段流式零样本 TTS,通过文本-mel 交错序列在连续 mel-spectrogram 空间做自回归建模,同时实现低延迟和高质量", "route": "文本 phonemes + speech prompt mel → 按 n:m 比率交错排列 → Transformer decoder 自回归预测 mel frames → latent sampling → mel spectrogram → vocoder → waveform", "metrics": "Cross-sentence WER-H 2.76% / SIM-O 0.622 / MOS 4.14 / SMOS 4.27 (LibriSpeech test-clean); FPL-A 0.01s / FPL-L 0.04s (NVIDIA A100) [Table II-IV]", "takeaway": "文本-声学交错序列策略可直接复用于任何连续值 AR 模型的流式化改造; n:m ratio 作为延迟-质量 trade-off 的简单旋钮", "limitation": "仅在 LibriSpeech (英文朗读) 上验证; 需外部 vocoder; 未与大规模数据训练的系统 (Emilia/Libriheavy) 做公平对比", "concepts": ["MelSpectrogram", "LLM-basedTTS", "VariationalAutoencoderforTTS", "CodecLanguageModel"], "source": "Sources/StreamMel.pdf", "github": "", "demo": ""}, {"name": "UmbraTTS", "title": "UmbraTTS: Adapting Text-to-Speech to Environmental Contexts with Flow Matching", "arxiv_id": "2506.09874", "date": "2025-06", "venue": "ICML 2025 Workshop on Machine Learning for Audio", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "environmental-audio", "joint-generation", "self-supervised", "controllability"], "summary": "基于 F5-TTS 的 flow matching 框架,联合生成语音与环境音,支持 SER 细粒度控制,通过 self-supervised 数据构建解决配对数据缺失", "route": "(text + ref_speech + ref_env + SER) --> ConvNeXT V2 text embedding + mel features --> DiT + adaLN-zero (CFM) --> mel spectrogram --> vocoder --> waveform", "metrics": "WER 6.89% / CLAP 0.37 / FAD 4.14 (AudioCaps); 人类 A/B 测试 81.9% 偏好; SER 控制 96.6% 听者对齐 [Table 1, Table 3]", "takeaway": "(1) SER 连续控制通过 sinusoidal encoding + MLP 注入 adaLN-zero,零额外推理成本; (2) VAD + source separation 双策略随机切换构建 self-supervised 训练数据; (3) 联合生成 vs 后混合的实验对比方法论", "limitation": "仅 6 页 workshop paper,实验规模有限; 环境音类型受限于 AudioSet 覆盖范围; 未测试长文本/多轮场景; 仅评估英语; 代码/模型未开源(截至论文发布)", "concepts": ["ConditionalFlowMatching", "MelSpectrogram", "Diffusion-basedTTS", "Non-autoregressiveTTS", "NaturalLanguageDescriptionforTTS"], "source": "Sources/UmbraTTS.pdf", "github": "", "demo": ""}, {"name": "ZipVoice", "title": "ZipVoice: Fast and High-Quality Zero-Shot Text-to-Speech with Flow Matching", "arxiv_id": "2506.13053", "date": "2025-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["zero-shot-TTS", "flow-matching", "NAR-TTS", "model-compression", "inference-acceleration", "distillation"], "summary": "用 Zipformer (ASR backbone) 替代 DiT/Transformer 作为 flow matching 的 vector field estimator,配合 average upsampling 对齐和 flow distillation 加速,实现 123M 参数下 SOTA 级 zero-shot TTS 质量,推理速度比 F5-TTS 快 ~24-33x", "route": "Text → Zipformer Text Encoder → Average Upsample → Channel-wise Concat(text condition + speech condition + noisy speech) → Zipformer Vector Field Estimator → ODE Solver → Vocos Vocoder → Waveform", "metrics": "LibriSpeech-PC: WER 1.64/SIM-o 0.668/UTMOS 3.98 (16NFE); Seed-TTS test-en: WER 1.70/SIM-o 0.697 (16NFE); ZipVoice-Distill(4NFE) RTF 0.0125 GPU / 1.22 CPU vs F5-TTS(32NFE) RTF 0.2958 GPU [Table I, Table II]", "takeaway": "(1) Zipformer 的 U-Net downsampling + convolution + attention weight reuse 三要素可作为 flow matching backbone 的高效设计参考; (2) Average upsampling 作为极简对齐策略,无需 duration predictor 也无需 filler token,一行公式 d=floor(T/N); (3) Flow distillation 通过 teacher 两步推理构造 target vector field + CFG strength 作为 model input,同时消除 CFG 双倍开销和减少 NFE", "limitation": "(1) SIM-o 不如 MaskGCT/E2-TTS 等大模型,speaker similarity 有损; (2) Average upsampling 的均匀 duration 假设与真实发音差距大,依赖 flow matching 模型隐式纠正; (3) 仅在英语和中文上评估; (4) 开源但尚无大规模社区验证", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Non-autoregressiveTTS", "DurationPredictor", "Speech-TextAlignment", "NeuralVocoder"], "source": "Sources/ZipVoice.pdf", "github": "", "demo": ""}, {"name": "video-SALMONN2", "title": "video-SALMONN 2: Caption-Enhanced Audio-Visual Large Language Models", "arxiv_id": "2506.15220", "date": "2025-06", "venue": "Preprint (under review)", "org": "", "tier": "deep", "tags": ["audio-visual", "speech-LM", "multimodal", "DPO", "LoRA", "video-captioning", "video-QA", "RLHF"], "summary": "通过 MrDPO (multi-round DPO + LoRA proxy + gDPO loss) 持续优化视频 captioning 质量,再用优化后的 captioner 自标注高质量 SFT 数据,实现 captioning→QA 的能力迁移,在 7 个 video QA benchmark 上 SOTA", "route": "Video frames → Visual Encoder → Visual Aligner + Audio → Whisper-Large-v3 → Audio Q-Former → interleaved synchronization → LLM backbone (LLaVA-OneVision / Qwen2.5-VL) + LoRA → text response; 训练: Audio Alignment → AV-SFT → MrDPO (6 rounds) → 数据自标注 → SFT 新模型", "metrics": "Caption Total Error% 22.9 (vs GPT-4o 31.2, Qwen2.5-VL 39.2) [Table 1a]; Elo 1115 (vs GPT-4o 976) [Table 11]; Video-MME 73.4/79.7 (7B/72B) [Table 3]; MLVU 73.6 (7B, SOTA) [Table 3]", "takeaway": "(1) MrDPO 的 LoRA proxy 机制: 每轮 merge 旧 LoRA 到 backbone + 初始化新 LoRA,避免 reference staleness; (2) 原子事件分解的 caption 评估方法 (missing rate + hallucination rate); (3) \"captioner 作为数据引擎\" 的自循环范式", "limitation": "MrDPO 仅优化 captioning 不直接提升 QA; 依赖 GPT-3.5/4o 做 caption 评估; atomic event 分解的质量依赖外部 LLM; 训练资源仍然可观 (32x H800s for SFT)", "concepts": ["ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "Audio-LanguagePretraining", "Speech-LLMIntegrationTaxonomy", "DifferentiableRewardOptimization"], "source": "Sources/video-SALMONN2.pdf", "github": "", "demo": ""}, {"name": "C2F-LM", "title": "Speech Token Prediction via Compressed-to-fine Language Modeling", "arxiv_id": "2505.24496", "date": "2025-05", "venue": "ACM (under review)", "org": "", "tier": "deep", "tags": ["codec-language-model", "speech-generation", "token-compression", "attention-mechanism", "long-context", "zero-shot-TTS", "VALL-E"], "summary": "在 neural codec LM 中,将长距离 speech token 压缩为 5Hz 紧凑表征 + 保留局部 token 滑窗,同时解决注意力稀疏和信息冗余问题,通用于各种 codec 和 LM 架构。", "route": "Text + Speech prompt → [压缩 token W_0..W_k-1 (长距离)] + [原始 token (局部滑窗 N)] → AR decoder 预测第一层 → NAR decoder (仅滑窗) 预测后续层 → Codec decoder 合成波形", "metrics": "VALL-E* (EnCodec, 960h): WER 5.23%→2.36% (-55%), SIM 56.64%→59.75% (+3.11pp) [Table 2]; WavTokenizer decoder-only: WER 5.94%→3.40% (-42.8%) [Table 2]; RTF 0.79→0.65 (-18%) [Table 6]", "takeaway": "(1) 在 LM 层面做 token 压缩的思路可迁移到任何长序列生成任务; (2) 5Hz 压缩率 (对应 ~5 音节/秒) 作为语音压缩的 sweet spot; (3) 仅通过 attention mask + 插入压缩 token 实现,无需改架构", "limitation": "仅在 LibriSpeech 上评估 (英语朗读体); 代码未开源; 训练数据最大 44Kh 仍远小于工业级; vanilla inference 不加速 (需 KV cache eviction 才加速); NAR decoder 未用压缩 token", "concepts": ["CodecLanguageModel", "SpeechTokenizer", "SemanticvsAcousticTokens", "TokenRateandBitrateTrade-offs", "Single-codebookvsMulti-codebook", "Speech-TextAlignment"], "source": "Sources/C2F-LM.pdf", "github": "", "demo": ""}, {"name": "Chain-Talker", "title": "Chain-Talker: Chain Understanding and Rendering for Empathetic Conversational Speech Synthesis", "arxiv_id": "2505.12597", "date": "2025-05", "venue": "ACL 2025 (Findings)", "org": "", "tier": "deep", "tags": ["TTS", "conversational-speech-synthesis", "emotion-inference", "empathetic-speech", "context-aware", "chain-of-thought", "LLM-captioning"], "summary": "首个将 chain-of-thought 式分步推理引入 CSS 的框架,通过三阶段认知链 (情感理解→语义理解→共情渲染) 实现可解释的对话语音情感合成", "route": "多模态对话历史 (text+speech+speaker+captions) → Unified Context Tokenization → EmGPT (CosyVoice-300M-25Hz fine-tune) 依次预测 empathetic caption tokens + semantic speech codes → OT-CFM Synthesizer (caption BERT embedding + semantic codes + speaker + masked mel) → HiFi-GAN → 语音", "metrics": "DMOS-N 4.147 / DMOS-E 4.239 / ACCm 0.612 / DDTW 38.784 / SSIM 0.862 (vs GPT-Talker 3.962/3.913/0.562/44.625/0.814; vs GT 4.467/4.571/-/67.851/0.765) [Table 2, NCSSD-EmCap]", "takeaway": "(1) Chain decomposition: 将复杂对话 TTS 分解为显式情感推理→语义编码→声学渲染三步,每步可独立调试和验证; (2) CSS-EmCap: LLM-driven 多层属性提取 (sentence-level style factors + dialog-level emotion) + 两步 caption 生成 (basic→enriched) 的自动化情感标注 pipeline,可复用于任意 CSS 数据集; (3) Supervised semantic tokenizer 替代 HuBERT: 减少冗余声学信息,提升 LM 收敛速度和稳定性", "limitation": "(1) 推理延迟 2.5s 平均响应时间,未达实时; (2) 训练数据仅 384h 且以年轻说话人为主; (3) 情感描述依赖 Gemini 生成质量; (4) 未验证 N>4 的长对话场景", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "StyleTransferinTTS", "CodecLanguageModel"], "source": "Sources/Chain-Talker.pdf", "github": "", "demo": ""}, {"name": "CosyVoice3", "title": "CosyVoice 3: Towards In-the-wild Speech Generation via Scaling-up and Post-training", "arxiv_id": "2505.17589", "date": "2025-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "multilingual", "scaling", "post-training", "speech-tokenizer", "reinforcement-learning"], "summary": "监督式多任务 speech tokenizer + DiffRO token-level RL + 100 万小时数据 scaling,构建 9 语种 in-the-wild zero-shot TTS", "route":
