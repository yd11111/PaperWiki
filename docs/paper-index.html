 "Text → LLM (1.5B, AR) → discrete speech tokens (25Hz) → CFM (DiT 300M) → Mel → Vocoder → Waveform", "metrics": "CER 0.71% / WER 1.45% (SEED-TTS-Eval test-zh/en), SS 0.775; 相对 CosyVoice 2 内容一致性提升 44%-51%; 跨语言 WER zh→en 5.09 vs 13.5 (CV3-Eval)", "takeaway": "DiffRO 绕过 CFM/vocoder 在 token 层用 Gumbel-Softmax 做可微 reward 优化; 在预训练 backbone (MinMo) 中间层插入 FSQ 的监督式 tokenizer 设计模式", "limitation": "1.5B 在 test-hard 上反而逊于 0.5B (scaling 未充分验证); 模型和 100 万小时数据均未开源; 缺少与 VALL-E 2 等强 baseline 直接对比", "concepts": ["FiniteScalarQuantization", "ConditionalFlowMatching", "DifferentiableRewardOptimization", "SpeechTokenizer", "Gumbel-Softmax"], "source": "Sources/CosyVoice3.pdf", "github": "", "demo": ""}, {"name": "DS-Codec", "title": "DS-Codec: Dual-Stage Training with Mirror-to-NonMirror Architecture Switching for Speech Codec", "arxiv_id": "2505.24314", "date": "2025-05", "venue": "arXiv (Interspeech submission)", "org": "", "tier": "deep", "tags": ["audio-codec", "single-codebook", "VQ", "product-quantization", "dual-stage-training", "speech-reconstruction"], "summary": "通过先镜像训练(强化 codebook)再切换到非镜像架构(强化 decoder)的两阶段策略,在单码本条件下实现接近 ground truth 的语音重建质量", "route": "波形 → CNN+LSTM encoder (200x下采样) → VQ/PQ 单码本量化 → Transformer Block → CNN decoder (上采样) → 重建波形", "metrics": "LibriSpeech test-clean: UTMOS 4.218 (GT 4.086), PESQ 2.862, STOI 0.941 (单码本 1.04 kbps); LJSpeech: UTMOS 4.451, PESQ 2.962 [Table 1, Table 2]", "takeaway": "镜像→非镜像的两阶段训练策略可迁移到其他 codec 设计; 第一阶段冻结时保留 decoder 权重+降低学习率的 warm-start 策略比 APCodec+ 的重新初始化更高效", "limitation": "仅在 LibriSpeech (1000h, 16kHz, 英语朗读) 上训练和评估,未验证多语言/多说话人/多采样率泛化; 无主观 MOS 评估; 未与 2024-2025 年最新 codec (SNAC, SiTok, TS3-Codec) 对比; 代码未开源", "concepts": ["ResidualVectorQuantization", "Single-codebookvsMulti-codebook", "CodebookCollapse", "CodecTrainingObjectives", "SpeechTokenizer"], "source": "Sources/DS-Codec.pdf", "github": "", "demo": ""}, {"name": "DiEmo-TTS", "title": "DiEmo-TTS: Disentangled Emotion Representations via Self-Supervised Distillation for Cross-Speaker Emotion Transfer in Text-to-Speech", "arxiv_id": "2505.19687", "date": "2025-05", "venue": "Interspeech 2025", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "cross-speaker", "disentanglement", "self-supervised", "DINO", "style-transfer", "FastSpeech2"], "summary": "用 DINO 自监督蒸馏 + cluster-driven sampling + formant perturbation 实现跨说话人情感解耦迁移,无需显式情感标签", "route": "参考 mel → (cluster-driven cropping + formant perturbation) → teacher/student emotion encoder (DINO loss + cosine similarity loss) → emotion embedding → FastSpeech 2 + dual conditioning transformer → mel → BigVGAN → waveform", "metrics": "nMOS 4.23, sMOS 3.96, eMOS 4.07 (平均); SECS 0.8505, EECS 0.4527; WER 16.16, CER 5.60 (ESD 数据集) [Table 2]", "takeaway": "(1) cluster-driven sampling: 基于情感聚类构造 DINO 训练对而非随机裁剪,可迁移到任何需要属性解耦的蒸馏场景; (2) formant perturbation 作为 speaker identity 扰动手段,比 noise augmentation 更精准地保留情感同时破坏音色; (3) convex hull + 球面坐标做无监督情感聚类对齐", "limitation": "依赖 emotional attribute predictor (预训练在标注数据上) 生成伪标签,非完全无监督; 仅在 ESD (350 句 x 10 人) 小规模数据集上验证; 未开源代码", "concepts": ["EmotionControlinTTS", "SpeechFactorization", "StyleTransferinTTS", "SpeakerEmbedding", "GradientReversalLayer", "Self-SupervisedSpeechRepresentation"], "source": "Sources/DiEmo-TTS.pdf", "github": "", "demo": ""}, {"name": "EmergentTTS-Eval", "title": "EmergentTTS-Eval", "arxiv_id": "2505.23009", "date": "2025-05", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["TTS-evaluation", "benchmark", "model-as-judge", "LALM", "prosody", "expressiveness", "pronunciation", "emergent-abilities"], "summary": "面向 TTS 系统 \"emergent abilities\" 的综合 benchmark (1645 cases, 6 challenging 场景) + LALM-as-judge 评估框架,Gemini 2.5 Pro 作为 judge 与人类评估 Spearman 相关 90.5%", "route": "Seed prompts (140 from BASE-TTS) → LLM breadth expansion (→70 per cat) → iterative depth refinement (x3) → 1645 test cases; Evaluation: TTS system output + reference output → LALM judge (Gemini 2.5 Pro) → win-rate scoring", "metrics": "GPT-4o-Audio (Ballad) overall win-rate 65.07%, best among all; Orpheus-TTS best open-source ~38%; Gemini 2.5 Pro judge Spearman 90.5% with human [Table 1, Table 3b]", "takeaway": "(1) LLM 迭代生成 increasingly complex test cases (breadth → depth refinement) (2) LALM-as-judge 替代人类评估,跨模型一致性高 (W=0.97) (3) 6 场景覆盖 TTS 评估盲区 (4) text normalization 对 Complex Pronunciation 影响大 (GPT-4.1-mini TN: 51.69% → 76.74%)", "limitation": "LALM judge 有偏见 (偏好 literary language, formal phrasing); 非英文评估局限于 Latin 转写; 成本高 (~$50/complete eval with Gemini 2.5 Pro); baseline 为 gpt-4o-mini-tts (可能不中立)", "concepts": ["TTSEvaluation", "AudioUnderstanding", "Audio-LanguagePretraining", "ProsodyModeling"], "source": "Sources/EmergentTTS-Eval.pdf", "github": "", "demo": ""}, {"name": "FMSD-TTS", "title": "FMSD-TTS: Few-shot Multi-Speaker Multi-Dialect Text-to-Speech Synthesis for Ü-Tsang, Amdo and Kham Speech Dataset Generation", "arxiv_id": "2505.14351", "date": "2025-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "multi-speaker", "multi-dialect", "few-shot", "low-resource", "Tibetan", "speaker-identity", "non-autoregressive"], "summary": "基于 Matcha-TTS 的藏语少样本多说话人多方言 TTS,通过 Speaker-Dialect Fusion + DSDR-Net 动态路由实现方言精细控制,同时保持说话人身份一致性", "route": "藏文字符 → Tokenization → Text Encoder (含 speaker-dialect fusion) → Duration Predictor → Upsampling → Flow Prediction Network (含 speaker-dialect fusion) → Mel Spectrogram → BigVGAN → Waveform", "metrics": "DCA 80.25% vs Matcha-TTS 65.80% / VITS2 44.44%; DECS 0.80 vs 0.65 / 0.37; SECS 0.56 vs 0.37 / 0.41; nMOS 3.83 vs 3.73 / 3.18 [Table 1]", "takeaway": "(1) DSDR-Net 的 public FFN + private FFN 硬路由设计 — 可迁移到任何需要按离散属性(方言/风格/情感)做精细控制的 TTS/SVS 场景; (2) Reference Loss (cosine similarity 最小化) 解耦 speaker 与 dialect embedding 的简洁方案", "limitation": "仅评估 NAR 架构,未探索 AR 模型; speaker encoder 未在藏语上 fine-tune; 方言转换评估仅采用一种 VC 模型; 训练数据非公开(仅合成数据公开)", "concepts": ["SpeakerEmbedding", "ConditionalFlowMatching", "DurationPredictor", "Non-autoregressiveTTS", "SpeakerAdaptation"], "source": "https://arxiv.org/abs/2505.14351", "github": "", "demo": ""}, {"name": "FlexSpeech", "title": "FlexSpeech: Towards Stable, Controllable and Expressive Text-to-Speech", "arxiv_id": "2505.05159", "date": "2025-05", "venue": "arXiv (eess.AS)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "flow-matching", "duration-prediction", "DPO", "style-transfer", "NAR", "preference-alignment"], "summary": "将 TTS 解耦为 AR duration predictor + NAR flow-matching acoustic model,通过 DPO 对 duration predictor 做偏好对齐,以约 100 条数据实现快速风格迁移", "route": "Text → Phoneme + MFA duration → AR Duration Predictor (encoder-decoder, next-token prediction) → Expanded Phoneme Sequence → Flow-Matching DiT Acoustic Model (+ speaker embedding) → Mel Spectrogram → BigVGAN → 48kHz Waveform", "metrics": "WER 1.20% (Seed-TTS test-zh) / 1.81% (Seed-TTS test-en), SMOS 3.93/3.92; CMOS 与 MegaTTS 3 持平或略优 [Table 1]", "takeaway": "(1) 对 duration predictor 单独做 DPO 是极轻量的偏好对齐路线,仅 50 对数据就有效; (2) duration + acoustic 完全解耦使风格迁移只需微调 duration 模型(~100 samples),acoustic 模型不动; (3) duration 离散化为分类问题(帧数 0-99)而非回归,适合 next-token prediction", "limitation": "(1) 依赖外部 forced alignment (MFA) 提取训练 duration 标签; (2) SIM-O 偏低(0.60-0.68 vs MaskGCT 0.717-0.774),可能因 ECAPA-TDNN speaker embedding 表达力有限; (3) 未开源代码和模型权重; (4) 韵律控制仅限 duration 维度,pitch/energy 无显式控制", "concepts": ["ConditionalFlowMatching", "DurationPredictor", "Non-autoregressiveTTS", "StyleTransferinTTS", "ProsodyModeling", "Classifier-FreeGuidance", "SpeakerEmbedding", "DifferentiableRewardOptimization"], "source": "Sources/FlexSpeech.pdf", "github": "", "demo": ""}, {"name": "GSA-TTS", "title": "GSA-TTS: Toward Zero-Shot Speech Synthesis based on Gradual Style Adaptor", "arxiv_id": "2505.19384", "date": "2025-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "style-transfer", "non-autoregressive", "speaker-adaptation", "reference-encoder", "FastPitch"], "summary": "用 Whisper ASR 将参考音频切分为 word-level 语义段,经 local style encoder 提取词级风格 → self-attention global style encoder 聚合为全局风格,以 CLN 注入 FastPitch,实现零样本 TTS 中风格的鲁棒分层编码。", "route": "Reference audio → Whisper ASR word-level segmentation → 各段 mel → Local Style Encoder (CNN+Gated-CNN+MHA+TAP) → local styles → Global Style Encoder (Self-Attention+FFN+TAP) + avg local styles → global style → CLN conditioning → FastPitch (Encoder+Decoder+Duration/Pitch Predictor) → mel → HiFi-GAN → waveform", "metrics": "MOS 3.67, SECS 0.792 (vs GT 0.795), WER 1.47% (优于 GT 3.79%), CER 0.62% [Table 1]; MetaStyleSpeech SECS 0.613, YourTTS WER 8.90% 作为对比基准; LibriTTS-R + VCTK 数据集", "takeaway": "(1) ASR-guided style segmentation: 用 ASR 时间戳切分参考音频去除非语音段,使 style extraction 更干净; (2) POS 分析发现形容词段对 intelligibility 影响最大,可用于 attention weight 手动调节控制韵律; (3) plug-and-play 设计,GSA 可移植到任何 NAR TTS 上", "limitation": "仅与 MetaStyleSpeech/YourTTS 对比,未与 LLM-based 系统 (VALL-E, CosyVoice, Seed-TTS) 比较; 58.8M 参数, 训练在 LibriTTS-R+VCTK (~2500 speakers), 规模远小于当前 SOTA; 7 页短文,缺乏消融中对各组件的深入分析; 未开源代码", "concepts": ["StyleTransferinTTS", "GlobalStyleTokens", "SpeakerEmbedding", "ProsodyModeling", "Non-autoregressiveTTS", "DurationPredictor"], "source": "Sources/GSA-TTS.pdf", "github": "", "demo": ""}, {"name": "LLaMA-Omni2", "title": "LLaMA-Omni 2: LLM-based Real-time Spoken Chatbot with Autoregressive Streaming Speech Synthesis", "arxiv_id": "2505.02625", "date": "2025-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "streaming", "real-time", "autoregressive", "modular-SpeechLM", "speech-interaction"], "summary": "将 CosyVoice 2 的 AR 流式语音解码器嫁接到 Qwen2.5 LLM 上,用 200K 合成多轮对话数据训练出 0.5B-14B 的 modular SpeechLM 系列,以远少于 native SpeechLM 的数据量超越 GLM-4-Voice", "route": "Speech → Whisper encoder → 5x downsample adapter → Qwen2.5 LLM → Gate Fusion(LLM hidden + text emb）→ AR TTS LM (Qwen2.5-0.5B init) → chunk-aware causal flow matching → HiFi-GAN → Speech", "metrics": "SpokenQA Llama Questions S2S 62.7% (14B) vs GLM-4-Voice 49.0%; ChatGPT Score S2S 4.35 (14B) vs GLM-4-Voice 3.52; ASR-WER 3.89 (14B) vs GLM-4-Voice 5.95; Latency ~600ms [Table 1]", "takeaway": "Gate fusion 融合 hidden states + text embedding 的方案可推广到任何需要从 LLM 中间表征驱动下游模块的场景; Read-Write 比例消融提供了延迟-质量 trade-off 的具体参考", "limitation": "不支持情感/语速等副语言控制; 仅用合成数据训练,声音多样性有限; 600ms 延迟仍高于 LLaMA-Omni (347ms) 和 Moshi (230ms); 代码开源但训练数据未开源", "concepts": ["SpeechLanguageModel", "StreamingSpokenDialogue", "ConditionalFlowMatching", "SpeechTokenizer", "FiniteScalarQuantization", "ModalityAdaptationforSpeechLLM", "CodecLanguageModel"], "source": "Sources/LLaMA-Omni2.pdf", "github": "", "demo": ""}, {"name": "MPE-TTS", "title": "MPE-TTS: Customized Emotion Zero-Shot Text-To-Speech Using Multi-Modal Prompt", "arxiv_id": "2505.18453", "date": "2025-05", "venue": "arXiv (Interspeech submission)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "emotion", "multi-modal", "disentanglement", "diffusion", "prosody"], "summary": "提出多模态情感提示 (文本/图像/语音) 的零样本 TTS,通过层级解耦 + Emotion2Vec 锚定 + AR prosody predictor 实现情感与音色的独立定制", "route": "文本→Conformer content encoder→LR→Diffusion decoder→mel→HiFi-GAN; 情感提示→MPEE(Emotion2Vec/CLIP+adapter)→emotion code; 参考语音→ECAPA-TDNN timbre encoder→speaker vector; (content+emotion+timbre)→AR prosody predictor→prosody code", "metrics": "MOS 3.73 (speech prompt), ESMOS 4.05, EACC 48% vs GT 54% on MEAD-TTS [Table 1]; 文本提示 MOS 3.65, EACC 46% [Table 2]; 图像提示 ESMOS 3.90, EACC 47% [Table 3]", "takeaway": "(1) 用预训练 Emotion2Vec 作为跨模态情感对齐的锚点,MSE loss 拉齐 CLIP text/image encoder 到语音情感空间; (2) Emotion Consistency Loss (ECL) — 在 prosody predictor 后加情感分类器,确保预测的韵律保留情感信息", "limitation": "数据规模小 (MEAD-TTS 仅 36h/48 人/8 情感); EACC 上限 54% (GT 的 SER 识别率本身不高); 无开源代码; 仅复现 MM-TTS 作为 baseline (无官方实现); 未与现代大规模 ZS-TTS 系统对比", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "SpeechFactorization", "NaturalLanguageDescriptionforTTS", "SpeakerEmbedding", "Diffusion-basedTTS", "GlobalStyleTokens"], "source": "Sources/MPE-TTS.pdf", "github": "", "demo": ""}, {"name": "MiniMax-Speech", "title": "MiniMax-Speech", "arxiv_id": "2505.07916", "date": "2025-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "voice-cloning", "autoregressive", "flow-matching", "VAE", "speaker-encoder", "multilingual"], "summary": "AR Transformer + learnable speaker encoder 实现无需参考转写的零样本语音克隆,Flow-VAE 增强 flow matching 的 latent 表达力,TTS Arena 排名第一", "route": "Text(BPE) + Reference Audio → Speaker Encoder(固定维度条件向量) → AR Transformer(离散 audio tokens, 25 tok/s) → Flow Matching(Transformer, 条件: AR output + speaker embedding + optional prompt) → Flow-VAE Decoder(latent → waveform)", "metrics": "Seed-TTS-eval test-zh WER 0.83 / SIM 0.783 (zero-shot), WER 0.99 / SIM 0.799 (one-shot); test-en WER 1.65 / SIM 0.692 (zero-shot); Artificial Arena ELO 第一 [Table 1, Fig 4]", "takeaway": "(1) Learnable speaker encoder 联合训练,比冻结 SV encoder 在 WER 上优势显著 (1.252 vs 1.400) [Table 4]; (2) Flow-VAE 用 normalizing flow 放宽 VAE posterior 约束,提升 latent 信息密度 [§2.2.2]; (3) Speaker embedding 作为可微调向量实现 PVC (professional voice cloning),仅优化一个向量即可适配新说话人 [§4.3]; (4) LoRA-based emotion control 用 neutral/random 参考音频做对比学习,解耦情感与内容 [§4.1]", "limitation": "不公开训练数据规模和模型参数量; 消融实验仅在中文子集上做; 无流式推理讨论; Artificial Arena 排名时效性强; 多语言评估中粤语 WER 仍高 (34.1%)", "concepts": ["LLM-basedTTS", "ConditionalFlowMatching", "SpeakerEmbedding", "VoiceCloningTaxonomy", "VariationalAutoencoderforTTS", "SpeechTokenizer", "SemanticvsAcousticTokens"], "source": "Sources/MiniMax-Speech.pdf", "github": "", "demo": ""}, {"name": "OZSpeech", "title": "OZSpeech: One-step Zero-shot Speech Synthesis with Learned-Prior-Conditioned Flow Matching", "arxiv_id": "2505.12800", "date": "2025-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "flow-matching", "one-step-sampling", "neural-codec", "FACodec", "non-autoregressive", "efficiency"], "summary": "用 learned prior 替代 Gaussian noise 作为 OT-CFM 起点, 实现 zero-shot TTS 的单步采样, WER 大幅领先基线但音质有所牺牲", "route": "Text → Phoneme → Prior Codes Generator (6 seq, 层级依赖) → + Acoustic Prompt (FACodec codes, content masked) → OT-CFM Vector Field Estimator (1 step) → FACodec Decoder → Waveform", "metrics": "WER 0.05 (vs F5-TTS 0.24/VALL-E 0.19, 3s prompt) [Table 1]; RTF 0.26 (vs F5-TTS 0.70, 3s) [Table 2]; NFE=1 (vs F5-TTS 32/NS2 200) [Table 2]; 模型 145M+102M (最小) [Table 2]; UTMOS 3.15 (vs VALL-E 3.68, 3s) [Table 1]", "takeaway": "(1) learned prior + one-step CFM 联合训练策略——不需要 teacher model 或蒸馏阶段; (2) 量化器编码 (Quantizer Encoding) 让 Transformer 在单序列中同时建模 6 个量化器且不混淆; (3) 噪声容忍分析方法——系统评估不同 SNR 下 prompt 噪声对 TTS 的影响", "limitation": "UTMOS/SIM-O 不如多步基线; Duration Predictor 使用传统取整方式导致时域失真; 仅在 LibriTTS 500h 上训练, 未验证 scaling; FACodec 冻结, codec 质量是瓶颈上限", "concepts": ["ConditionalFlowMatching", "SpeechFactorization", "DurationPredictor", "ResidualVectorQuantization", "Non-autoregressiveTTS"], "source": "Sources/OZSpeech.pdf", "github": "", "demo": ""}, {"name": "RevivalwithVoice", "title": "Revival with Voice: Multi-modal Controllable Text-to-Speech Synthesis", "arxiv_id": "2505.18972", "date": "2025-05", "venue": "Interspeech 2025", "org": "", "tier": "deep", "tags": ["TTS", "multi-modal", "face-to-speech", "controllability", "contrastive-learning", "style-augmentation", "codec-LM", "RVQ"], "summary": "提出 RV-TTS,通过 face image 控制声音 + descriptive text 控制语音特征 + input text 控制内容,利用对比学习对齐 face/audio 嵌入空间,结合 style augmentation 和交替训练策略,使 codec LM 能在保持高质量的同时从真人照片和艺术肖像生成匹配的语音", "route": "Face image -> ArcFace ResNet50 -> face-driven voice embedding (256d) -> concat with T5-encoded descriptive text -> cross-attention conditioning -> 24-layer Transformer (MusicGen) -> 9-level RVQ codes (delay pattern) -> RVQ decoder -> waveform", "metrics": "MOS 4.14 vs FaceTTS 1.84, FMS 3.86 vs FaceTTS 2.31, VCS 3.96 (LRS3 + artistic portraits) [Table 2]; speaker identification accuracy 76% (LRS3) / 73% (artistic portraits) vs FaceTTS 57%/52% [Fig 3]", "takeaway": "(1) 对比学习对齐 face/audio embedding + alternating training 利用高质量 audio-only 数据弥补 AV 数据质量不足; (2) neural style transfer augmentation 缩小真人/艺术肖像域差距; (3) sampling-based 生成多候选 + prompting 锁定一致声音的两步策略", "limitation": "(1) 仅 human subjective evaluation,无大规模客观评估; (2) face-voice 映射假设的科学基础薄弱; (3) VCS 3.96 不如 audio-driven YourTTS 的 4.42,voice consistency 仍有差距; (4) 未开源", "concepts": ["SpeakerEmbedding", "CodecLanguageModel", "NaturalLanguageDescriptionforTTS", "ResidualVectorQuantization", "VoiceCloningTaxonomy", "StyleTransferinTTS", "SpeechFactorization"], "source": "Sources/RevivalwithVoice.pdf", "github": "", "demo": ""}, {"name": "SALMONN-omni-v2", "title": "SALMONN-omni: A Standalone Speech LLM without Codec Injection for Full-duplex Conversation", "arxiv_id": "2505.17060", "date": "2025-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["full-duplex", "speech-LM", "codec-free", "standalone", "thinking-strategy", "streaming", "turn-taking", "barge-in"], "summary": "首个 codec-free standalone 全双工 Speech LLM,用 Mamba encoder + Llama-3-8B + CosyVoice2 的 embedding 桥接架构 + 显式 thinking (`<think>`/`<shift>`) 状态转换机制,全双工模式比此前开源 SOTA 平均高 35.9%,半双工模式与 Kimi-Audio/Qwen2.5-Omni 竞争 [§1, §5.2]", "route": "dual-stream audio (environment + assistant) → Mamba encoder (32 blocks, 25Hz) → MLP connector → Llama-3-8B + LoRA (text tokens + `<think>`/`<shift>`) → linear adapter → CosyVoice2-0.5B (从 LLM 第 24 层 embedding 驱动) → speech output [§3, Fig 1, Appendix E]", "metrics": "Predicted turn-taking 全面 SOTA: Llama Q. 79.3/73.6, Web Q. 49.7/43.7, TriviaQA 63.6/56.0, AlpacaEval 4.01/3.22 (S2T/S2S) [Table 3]; Oracle turn-taking 与半双工 SOTA 竞争 (80.0/50.5/66.0/4.05, S2T) [Table 3]; Turn-taking 成功率 92-99.7% [Table 4]; Barge-in overall F1 0.90 (DPO 后 vs SFT 0.86) [Table 6]", "takeaway": "(1) 显式 thinking: 2 个特殊 token 让 LLM 自然学会全双工状态转换 (\"your LLM is secretly a full-duplex predictor\") [§3.3]; (2) assistant stream 回听将 turn-taking 成功率从 ~70% 提升到 ~90% [§5.1]; (3) DPO U 型曲线: 先极端保守再恢复超越 SFT,对全双工 RL 训练有警示价值 [§5.3.2, Fig 4]; (4) LLM 第 24 层 embedding 而非最后层驱动 synthesizer [Appendix E]", "limitation": "仅英语 [§1]; 80ms time block 引入 320ms 最小输出延迟 [§4.1]; 情感表达不稳定 [Appendix F]; LoRA rank 32 容量有限 [§4.1]; 训练数据 ~1.3M 样本远少于 Kimi-Audio 13M 小时 [§1]; barge-in 评估使用自建数据集 [§4.3]", "concepts": ["概念库/Full-duplexSpokenDialogue|Full-duplex Spoken Dialogue", "概念库/SpeechLanguageModel|Speech Language Model", "概念库/StreamingSpokenDialogue|Streaming Spoken Dialogue", "概念库/Turn-takinginSpokenDialogue|Turn-taking in Spoken Dialogue", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation for Speech LLM", "概念库/SpokenDialogueEvaluation|Spoken Dialogue Evaluation"], "source": "Sources/SALMONN-omni-v2.pdf", "github": "", "demo": ""}, {"name": "SALMONN-omni", "title": "SALMONN-omni: A Standalone Speech LLM without Codec Injection for Full-duplex Conversation", "arxiv_id": "2505.17060", "date": "2025-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["full-duplex", "speech-LM", "codec-free", "standalone", "thinking-strategy", "streaming", "turn-taking", "barge-in"], "summary": "首个不注入 audio codec 的独立全双工 Speech LLM,通过 Mamba streaming encoder + Llama-3-8B (LoRA) + CosyVoice2 streaming synthesizer 的 codec-free 架构 + 显式 \"thinking\" 状态转换机制,在全双工模式下比此前开源 SOTA 平均高 35.9% [§1, §5.2]", "route": "dual-stream audio (environment + assistant) → Mamba encoder (25Hz embeddings) → interleaved with text embeddings → Llama-3-8B + LoRA → text tokens + `<think>`/`<shift>` → CosyVoice2 synthesizer (从 LLM 第 24 层 embedding 输入) → speech output [§3.1-3.3, Fig 1, Appendix E]", "metrics": "Predicted turn-taking: Llama Q. 79.3 / Web Q. 49.7 / TriviaQA 63.6 / AlpacaEval 4.01 (S2T, 全面 SOTA) [Table 3]; Turn-taking success rate 92-99.7% [Table 4]; Context-dependent barge-in F1 0.93 (DPO 后) [Table 6]; Oracle turn-taking 与 Kimi-Audio/Qwen2.5-Omni 等半双工 SOTA 竞争 [Table 3]", "takeaway": "(1) 显式 thinking 策略: `<think>` + `<shift>` 两个 token 让 LLM 自然学会状态转换,验证了 \"your LLM is secretly a full-duplex predictor\" 的假说 [§3.3]; (2) Assistant stream 回听: 让模型在生成前先看到自己上一轮的语音 embedding,既提供 echo 信息又将 turn-taking 成功率从 ~70% 提升到 ~90% [§5.1]; (3) DPO 的 U 型曲线: DPO 训练中模型先变得极端保守 (几乎不被打断),然后恢复并超越 SFT,这一现象对 RL 训练全双工模型有参考价值 [§5.3.2, Fig 4]", "limitation": "仅英语 [§1]; 80ms time block 设计引入 320ms 最小输出延迟 [§4.1]; 情感表达不稳定 (偶尔不匹配) [Appendix F]; 仅 LoRA (rank 32) 微调 LLM,容量有限 [§4.1]; 训练数据 ~1.3M 样本,远少于 Kimi-Audio 13M 小时 [§1]", "concepts": ["概念库/Full-duplexSpokenDialogue|Full-duplex Spoken Dialogue", "概念库/SpeechLanguageModel|Speech Language Model", "概念库/StreamingSpokenDialogue|Streaming Spoken Dialogue", "概念库/Turn-takinginSpokenDialogue|Turn-taking in Spoken Dialogue", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation for Speech LLM"], "source": "Sources/SALMONN-omni.pdf", "github": "", "demo": ""}, {"name": "SMLLE", "title": "SMLLE: Zero-Shot Streaming Text to Speech Synthesis with Transducer and Auto-Regressive Modeling", "arxiv_id": "2505.19669", "date": "2025-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "streaming", "zero-shot", "transducer", "autoregressive", "mel-spectrogram", "semantic-token", "frame-by-frame"], "summary": "首个逐帧流式零样本 TTS——Transducer 实时生成 semantic tokens 并提供 duration 对齐,AR 模型逐帧将 semantic tokens + 对齐文本转为 mel spectrogram,Delete <Bos> Mechanism 以最小延迟获取未来文本信息。", "route": "Text (phoneme) → Conformer Encoder → Transducer (RNNT) → Semantic Tokens + Duration-Aligned Text → Delete <Bos> Mechanism → AR Transformer (MELLE-based) + Latent Sampling → Mel Spectrogram → BigVGAN-V2 → Waveform", "metrics": "WER-C 5.14% / WER-H 6.37% / SIM 0.516 (streaming, LibriSpeech test-clean); SMLLE-R5: WER-C 1.03% / WER-H 1.67% / SIM 0.578 (5x repeated Transducer sampling); MOS 3.18 (vs MELLE 3.39, GT 3.61) [Table 1, 3]", "takeaway": "(1) Transducer 对齐路径直接提供 duration-aligned text,免去 forced alignment 或 duration predictor; (2) Delete <Bos> Mechanism 让 AR 模型以几乎零延迟获取未来文本; (3) 两阶段解耦使 Transducer 和 AR 各自可独立优化", "limitation": "仅在 LibriSpeech 960h 训练,未在大规模数据验证; SIM (0.516) 与当前 SOTA (>0.8) 差距大; MOS (3.18) 低于句子级 MELLE (3.39); 重复采样 (R5) 破坏了流式特性; 未提供 RTF/真实延迟数据; 未开源", "concepts": ["SemanticvsAcousticTokens", "LLM-basedTTS", "SpeechTokenizer", "MelSpectrogram", "DurationPredictor", "Non-autoregressiveTTS", "SpeakerEmbedding"], "source": "Sources/SMLLE.pdf", "github": "", "demo": ""}, {"name": "ShallowFlowMatching", "title": "Shallow Flow Matching for Coarse-to-Fine Text-to-Speech Synthesis", "arxiv_id": "2505.12226", "date": "2025-05", "venue": "NeurIPS 2025", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "coarse-to-fine", "inference-acceleration", "ODE-solver", "piecewise-flow"], "summary": "将 coarse-to-fine TTS 中 FM 模块的推理起点从纯噪声移至 coarse 表示构造的中间状态,用正交投影自适应确定时间点,通过单段分段流实现更自然的合成和更快的自适应步长 ODE 求解", "route": "文本/speech tokens → weak generator (encoder/LLM) → coarse mel + hidden states → SFM head (预测 X_h, t_h, sigma_h) → 正交投影到 CondOT 路径构造中间状态 → FM decoder 从中间状态出发求解 ODE → mel spectrogram → vocoder → 波形", "metrics": "Matcha-TTS/LJ Speech: 验证集 PMOS 4.176 (α=2.5) [Table 3], 测试集 CMOS 0.00 vs baseline -0.48 [Table 4]; CosyVoice/LibriTTS: SMOS 3.67 vs baseline 3.47, CMOS 0.00 vs baseline -0.21* [Table 4]; Dopri(5) solver 加速率最高 ~48% (Matcha-TTS α=5) [Table 5]", "takeaway": "(1) 正交投影确定 FM 中间状态的时间位置——可迁移到任何有 coarse 初始估计的 FM 系统; (2) SFM strength α 超参数——在推理时线性放大 coarse 信号的引导效果,简单有效; (3) 轻量 SFM head (基于 VITS duration predictor 架构,仅 Conv1d+LayerNorm) 作为即插即用模块", "limitation": "(1) SFM head 非常简单,weak generator 不稳定时可能不收敛 (StableTTS 的 reference encoder 问题); (2) 未开源训练代码 (仅 demo); (3) 加速仅对自适应步长 ODE solver 有效,固定步长 solver 无法受益; (4) WER 和 SIM 改善不一致", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Diffusion-basedTTS", "MelSpectrogram", "NeuralVocoder", "Non-autoregressiveTTS", "DurationPredictor"], "source": "Sources/ShallowFlowMatching.pdf", "github": "", "demo": ""}, {"name": "SpeechSpeculativeDecoding", "title": "Speech Speculative Decoding", "arxiv_id": "2505.15380", "date": "2025-05", "venue": "Interspeech 2025", "org": "", "tier": "deep", "tags": ["TTS", "inference-acceleration", "speculative-decoding", "autoregressive", "LLM-based"], "summary": "将 NLP 中的 speculative decoding 迁移到 AR 语音合成,通过 lightweight draft model + tolerance factor 在 CosyVoice 2 上实现 1.4x 推理加速且质量几乎无损", "route": "Text+Speech prompt → Draft model (8L Transformer) AR 生成 Ld 候选 tokens → Target model (24L) 并行验证 → tolerance-relaxed acceptance → Speech Decoder (flow matching + vocoder)", "metrics": "LM-RTF 0.360 vs 0.504 (1.4x), NMOS 3.94 vs 3.96, SS 0.63 vs 0.62, WER 5.70% vs 3.67% (LibriTTS test-clean 500 utterances) [Table 1]; NAT-MOS 3.925 vs 3.930, SIM-MOS 3.784 vs 3.789 [Table 2]", "takeaway": "(1) 用 target model 上层参数初始化 draft model + 仅微调底层的 layer-specific adaptation 策略,极低训练成本构建 draft model; (2) tolerance factor beta 的引入方式简洁且有效,可推广到其他 non-text token 的 speculative decoding", "limitation": "仅在 CosyVoice 2 上验证; 1.4x 加速幅度有限 (vs WAND 1.55x, 且后者还减少 KV cache); WER 从 3.67% 升至 5.70% (55% 退化); draft model 仅用 LibriTTS 580h 训练 (约为 target model 工业数据的 1/300 [§4.1]),data mismatch 可能限制了加速效果; 未报告端到端 RTF (仅 LM-RTF,而 LM 仅占总推理时间 70%)", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "ConditionalFlowMatching", "CodecLanguageModel"], "source": "Sources/SpeechSpeculativeDecoding.pdf", "github": "", "demo": ""}, {"name": "SpeechTokenizationforSLM", "title": "Speech Tokenization for SLM", "arxiv_id": "2505.17446", "date": "2025-05", "venue": "arXiv 2025 (UTokyo + Keio University)", "org": "", "tier": "deep", "tags": ["speech-tokenization", "speech-language-model", "segmentation", "vocabulary-size", "k-means", "HuBERT", "spoken-language-understanding", "zero-shot-SLU"], "summary": "系统探索 SSL speech tokenization 中分段宽度 (N=20-280ms) 和聚类大小 (K=128-16384) 对 SLM 零样本理解性能的影响,发现中等粗分段 (N=80ms) + 大词表 (K=16384) 是最佳配置,且训练效率提升显著 (数据 -50%, 时间 -70%)", "route": "HuBERT layer 9 → 按 N ms 分段 + 均值池化 → K-means (K clusters) → 去重 → OPT-based SLM (12L, 16H) → 零样本 SLU 评估", "metrics": "最佳 (80, 2^14) 平均准确率 0.67; baseline (20, 2^7) 平均 0.65; 训练时间 8.3h vs 12.4h [Table 3]; pros-syntax 最高 ~0.76; sBLIMP 最高 ~0.55 (接近随机) [Fig 2]", "takeaway": "(1) 大 N 需要大 K 的\"音素-语素\"类比,为 tokenizer 粒度-词表联合设计提供理论框架; (2) 固定宽度分段在大多数 SLU 任务上与语言学分段 (音素/音节/词) 表现相当甚至更好,可省去无监督分段成本; (3) 不同 SLU 能力维度需要不同 token 粒度,暗示 multi-resolution token 组合可能有益", "limitation": "仅 LibriSpeech (英语朗读); 仅 HuBERT layer 9; 未测 TTS/语音续写等生成任务; 未与 NAC/监督式 tokenizer 对比; SLM 规模小 (~125M OPT)", "concepts": ["SpeechTokenizer", "SpeechLanguageModel", "SemanticvsAcousticTokens", "Self-SupervisedSpeechRepresentation", "TokenRateandBitrateTrade-offs"], "source": "Sources/SpeechTokenizationforSLM.pdf", "github": "", "demo": ""}, {"name": "Spotlight-TTS", "title": "Spotlight-TTS: Spotlighting the Style via Voiced-Aware Style Extraction and Style Direction Adjustment for Expressive Text-to-Speech", "arxiv_id": "2505.20868", "date": "2025-05", "venue": "Interspeech 2025; extended Master's thesis (Korea University, Feb 2026)", "org": "", "tier": "deep", "tags": ["TTS", "style-transfer", "expressive", "VQ", "RVQ", "disentanglement", "voiced-unvoiced", "FastSpeech2"], "summary": "在 style transfer TTS 中,通过仅对 voiced 帧做 RVQ (rotation trick) + 非对称自注意力填充 unvoiced 帧 + 正交/韵律双损失调整 style 方向,实现更好的 content-style 解耦和表现力", "route": "Reference Mel → (V/UV flag 筛选 voiced frames) → RVQ-RT 量化 → Unvoiced Filler (biased self-attention) → Align Attention → 注入 FastSpeech2 Variance Adaptor → Decoder → Mel → BigVGAN → Waveform", "metrics": "nMOS 4.26 vs GenerSpeech 3.98 / sMOS 3.84 vs GenerSpeech 3.37 / WER 12.64 vs GT 12.42 / RMSEf0 8.27 (最优, vs GenerSpeech 11.20) [Table 1, ESD dataset]", "takeaway": "(1) voiced/unvoiced 区分处理思路 — 对 style 相关的部分做精细量化,不相关部分用 mask+填充; (2) biased self-attention 实现非对称信息流; (3) 正交 loss 做 style-content 解耦时配合 SP loss 防止韵律信息丢失", "limitation": "仅在 ESD (10 人 / 5 情感 / 350 句) 小数据集验证; non-parallel 风格迁移仍有较大提升空间; 未与 LLM-based TTS 对比; 代码暂未开源", "concepts": ["StyleTransferinTTS", "GlobalStyleTokens", "ResidualVectorQuantization", "ProsodyModeling", "SpeechFactorization", "MelSpectrogram", "F0Modeling", "EmotionControlinTTS"], "source": "Sources/Spotlight-TTS.pdf", "github": "", "demo": ""}, {"name": "UDDETTS", "title": "UDDETTS: Unifying Discrete and Dimensional Emotions for Controllable Emotional Text-to-Speech", "arxiv_id": "2505.10599", "date": "2025-05", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "LLM-based", "flow-matching", "controllable", "semi-supervised", "ADV-space"], "summary": "首个在 LLM-TTS 中引入 Arousal-Dominance-Valence (ADV) 空间的框架,通过非线性分箱 + 半监督训练统一离散标签与维度情感,实现三维解耦的可解释情感控制", "route": "Text + (ADV tokens / Label / 无) → Neural Codec LM (0.70B, Transformer AR) → semantic tokens + label → OT-CFM (0.35B, U-Net + emotional mixture encoder) → mel → HiFi-GAN → waveform", "metrics": "Label-controlled MOS 4.29, ES 0.833, WER 2.40% [Table 1]; ADV-controlled SRC 0.92/0.85/0.78 (V/A/D) [Table 2]; 非线性分箱 ADV 覆盖率 77.89% → 半监督后 89.35% [Fig 4]; 端到端偏好率 67.33% vs CosyVoice2 [Table 3]", "takeaway": "(1) 非线性分箱: 对任意不均衡连续空间做聚类→自适应分箱→CLT 选 bin 数,可泛化到 pitch/energy 等其他连续属性控制; (2) 半监督 label↔ADV 知识迁移策略 — 用有 ADV 标注的小数据集带动仅有 label 的大数据集; (3) emotional mixture encoder 中 label-ADV 注意力融合 + 门控的条件注入方式", "limitation": "ADV 标注主观性大,标注者间不一致影响线性控制; ADV predictor 对情感模糊文本表现差; 缺乏多模态/对话上下文建模; 仅支持英语; 训练需 24×A800 GPU", "concepts": ["EmotionControlinTTS", "ConditionalFlowMatching", "LLM-basedTTS", "SpeechTokenizer", "FiniteScalarQuantization", "ProsodyModeling", "SpeakerEmbedding"], "source": "Sources/UDDETTS.pdf", "github": "", "demo": ""}, {"name": "UniTTS", "title": "UniTTS: An end-to-end TTS system without decoupling of acoustic and semantic information", "arxiv_id": "2505.17426", "date": "2025-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based-TTS", "audio-codec", "single-codebook", "codec-distillation", "universal-audio", "DPO", "alignment"], "summary": "提出 DistilCodec(多码本→单码本蒸馏, 32768 codes, ~100% 利用率)+ UniTTS(Qwen2.5-7B 三任务预训练), 不做 semantic-acoustic 解耦, 端到端建模完整音频信息", "route": "Audio → DistilCodec Encoder → VQ(1 codebook, 32768, dim=3584) → Audio Tokens; Text → Qwen2.5 Word Embedding; 两者拼接为 ~180K 词表 → Qwen2.5-7B(Pretrain→SFT→LPO) → Audio Tokens → DistilCodec Decoder → Waveform", "metrics": "MOS Emotional expressiveness 4.60(最高), Naturalness 4.94(最高), Fidelity 4.80, Stability 4.97; SFT CER 3.43%→AB-1 CER 3.466%; DistilCodec codebook usage 98.2-99.9%, PPL 21660-26999", "takeaway": "(1) DMS 蒸馏策略(继承 teacher encoder/decoder 参数, 仅重训 VQ 层)降低单码本训练难度; (2) 码本维度对齐 LLM word embedding(3584 = Qwen2.5-7B embedding dim), 直接用 codebook 初始化 audio embedding; (3) LPO(Linear Preference Optimization)替代 DPO 避免超长序列下的 mode collapse", "limitation": "(1) 预训练 loss 未收敛, 计算资源不足 [Fig 7]; (2) SFT 仅 948h 音频数据(vs Llasa 250Kh, Spark-TTS 100Kh); (3) MOS 评估基于自建 test set, 非标准 benchmark(无 LibriSpeech/SEED-TTS-Eval WER/SIM); (4) 代码开源但训练数据部分为自有", "concepts": ["ResidualVectorQuantization", "LLM-basedTTS", "SemanticvsAcousticTokens", "Single-codebookvsMulti-codebook", "SpeechTokenizer", "CodebookCollapse", "CodecTrainingObjectives"], "source": "Sources/UniTTS.pdf", "github": "", "demo": ""}, {"name": "AutoStyle-TTS", "title": "AutoStyle-TTS: Retrieval-Augmented Generation based Automatic Style Matching Text-to-Speech Synthesis", "arxiv_id": "2504.10309", "date": "2025-04", "venue": "ICME 2025", "org": "", "tier": "deep", "tags": ["TTS", "style-control", "RAG", "retrieval-augmented", "CosyVoice", "flow-matching", "embedding", "podcast"], "summary": "在 CosyVoice backbone 上引入 RAG 机制,根据文本内容自动从风格知识库中检索匹配的 speech style prompt,实现 podcast 场景下的动态风格切换", "route": "用户文本 → Llama(角色画像) + PER-LLM-Embedder(情景情感) + Moka(用户偏好) → 三部分 embedding 拼合 → Milvus MIPS 检索 Top-K style prompt → CosyVoice(style-timbre 解耦 TTS) → 生成语音", "metrics": "SM-MOS 3.85/3.90 vs CosyVoice 3.35/3.38, SC-MOS 3.81/3.83 vs CosyVoice 3.48/3.51 (英/中) [Table II]; IS 1.325 vs 0.750 [Table I]; AB test ~50:50 vs 人工选择 [Fig 6]", "takeaway": "(1) 三维 embedding 拆分 (profile + emotion + user preference) 捕捉不同层次风格语义; (2) 将 RAG 范式从 NLP 迁移到 TTS prompt selection; (3) 用 LLM fine-tune 做情感 embedding 提取 (PER-LLM-Embedder)", "limitation": "实验规模小(30 speakers, 2000 segments); 无客观风格匹配指标; 评估数据集非标准 benchmark; 对 CosyVoice backbone 的修改有限,更像应用层工作; 未开源", "concepts": ["StyleTransferinTTS", "SpeechFactorization", "ConditionalFlowMatching", "SpeakerEmbedding", "EmotionControlinTTS", "GlobalStyleTokens"], "source": "Sources/AutoStyle-TTS.pdf", "github": "", "demo": ""}, {"name": "DialogueAgents", "title": "DialogueAgents: A Hybrid Agent-Based Speech Synthesis Framework for Multi-Party Dialogue", "arxiv_id": "2504.14482", "date": "2025-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "dialogue-synthesis", "multi-agent", "multi-party", "emotional-TTS", "data-generation", "zero-shot", "evaluation"], "summary": "用三个 agent (GPT-4o 写剧本 + CosyVoice 合成语音 + Qwen2-Audio 评审) 迭代生成多方多轮对话语音,并贡献双语数据集 MultiTalk", "route": "Character Pool → Script Writer (GPT-4o) → Speech Synthesizer (CosyVoice) → Dialogue Critic (Qwen2-Audio) → Feedback → Script Writer (迭代 T 轮) → 最终对话语音 + 脚本", "metrics": "2 loop 最优 — MOS 3.75, EMOS 3.96, TMOS 3.78 [Table II]; 脚本 Emotiveness 3.96 [Table III]; WER(EN) 4.07%, CER(CN) 5.16% [Table II]; MultiTalk 4437 utterances / 32441s [Table V]", "takeaway": "(1) 用多模态 LLM (Qwen2-Audio) 作为语音评审 agent 提供结构化反馈的思路; (2) EMOS/TMOS 两个对话级语音评估指标的定义; (3) Character Pool 设计 (角色描述+社交关系) 增加对话多样性", "limitation": "依赖 GPT-4o (闭源/成本高); CosyVoice 在长对话和多说话人交互中仍不稳定 (论文自述); 3 loop 过优化导致质量下降; MultiTalk 数据量偏小 (仅 ~9h); 对话级 MOS 仍未超过 4.0", "concepts": ["EmotionControlinTTS", "ProsodyModeling", "Turn-takinginSpokenDialogue", "TTSEvaluation"], "source": "Sources/DialogueAgents.pdf", "github": "", "demo": ""}, {"name": "EmoVoice", "title": "EmoVoice: LLM-based Emotional Text-To-Speech Model with Freestyle Text Prompting", "arxiv_id": "2504.12867", "date": "2025-04", "venue": "ACM MM 2025", "org": "", "tier": "deep", "tags": ["TTS", "emotion", "LLM-based", "instruction", "natural-language-description", "controllability", "dataset", "evaluation"], "summary": "基于 Qwen2.5 LLM 的情感 TTS,通过 freestyle 自然语言描述控制情感,phoneme parallel output 增强内容一致性,附带 40h 高质量情感数据集 EmoVoice-DB", "route": "(Emotion Description + Text) → Qwen2.5-0.5B/1.5B LLM → CosyVoice 50Hz Semantic Tokens (group size=3) [+ Phoneme Tokens parallel] → CosyVoice Flow Matching + HiFi-GAN → Waveform", "metrics": "EmoVoice(1.5B) 在 EmoVoice-DB 上 WER 2.62 / Emo_Sim 0.9118 / Recall 0.424 / MOS 3.507 (vs GPT-4o-mini-tts MOS 3.598) [Table 2, Table 3]; 中文 Secap 上 EmoVoice-PP WER 7.60 / Recall 0.434 [Table 4]", "takeaway": "(1) Parallel phoneme output 作为辅助 supervision 降低 WER,尤其在 hard case 上效果显著 (18.07→11.68) [Table 6]; (2) 用 GPT-4o-audio 蒸馏构建情感数据集的完整 pipeline (text+description生成→语音合成→WER过滤); (3) Description augmentation 策略 (GPT-4o 改写 emotion description,WER 从 3.83 降到 2.73,相对降幅 29%) [Table 9]", "limitation": "(1) 完全依赖合成数据训练,真实情感语音的泛化性未充分验证; (2) Emotion evaluation 指标 (emotion2vec similarity) 与人类感知对齐度低 (sentence-level Spearman ρ 仅 0.40) [Table 10]; (3) 不支持 zero-shot speaker cloning — 需要从同说话人选 prompt speech; (4) 代码/模型已开源但 in-house 中文数据未公开", "concepts": ["EmotionControlinTTS", "LLM-basedTTS", "NaturalLanguageDescriptionforTTS", "Instruction-GuidedSpeechSynthesis", "SemanticvsAcousticTokens"], "source": "Sources/EmoVoice.pdf", "github": "", "demo": ""}, {"name": "F5R-TTS", "title": "F5R-TTS: Improving Flow-Matching based Text-to-Speech with Group Relative Policy Optimization", "arxiv_id": "2504.02407", "date": "2025-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "reinforcement-learning", "GRPO", "flow-matching", "NAR-TTS", "zero-shot", "voice-cloning", "post-training"], "summary": "通过将 flow matching TTS 的确定性输出重构为概率分布,首次在 NAR flow-matching TTS 上成功集成 GRPO 强化学习,用 WER+SIM 双奖励显著提升语音可懂度和说话人相似度", "route": "Text+Ref Speech -> F5-TTS (修改最后一层为 mu+sigma) -> Phase 1: Flow Matching Pretraining (log-likelihood loss) -> Phase 2: GRPO (N rollouts -> SenseVoice ASR 计算 WER reward + WeSpeaker 计算 SIM reward -> policy update with KL constraint)", "metrics": "WenetSpeech4TTS: WER 1.48% vs F5 baseline 2.10% (29.5% relative reduction), SIM 0.730 vs 0.698 (4.6% increase) [Table 1]; Internal dataset: WER 1.37% vs 1.68% (18.4% reduction), SIM 0.754 vs 0.731 [Table 2]; Hard set WER 10.63% vs 11.30% [Table 1]", "takeaway": "将 NAR 模型的确定性输出改为均值+方差的概率输出,使任意 RL 算法 (GRPO/PPO/DDPO) 可直接应用于 flow-matching 模型;修改仅在最后一层,工程成本极低", "limitation": "仅 WER+SIM 两个奖励,未涉及韵律/情感等维度; 仅在中文 Mandarin 上评估; 未与 DiffRO/DPO 做直接对比; 未报告 MOS 主观评估; 未开源代码", "concepts": ["ConditionalFlowMatching", "DifferentiableRewardOptimization", "Non-autoregressiveTTS", "SpeakerEmbedding", "TTSEvaluation"], "source": "Sources/F5R-TTS.pdf", "github": "", "demo": ""}, {"name": "GOAT-TTS", "title": "GOAT-TTS: LLM-based Text-To-Speech Generation Optimized via A Dual-Branch Architecture", "arxiv_id": "2504.12339", "date": "2025-04", "venue": "arXiv (Technical Report)", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "zero-shot", "dual-branch", "modality-alignment", "streaming", "multi-token-prediction", "dialect"], "summary": "双分支 LLM 架构解决 speech prompt 离散化信息损失 + 微调遗忘问题,用连续 acoustic embedding 对齐模态 + layer-wise freezing 保护语言知识,同时支持原生流式推理", "route": "Speech prompt → Whisper-Small encoder → CNN projector → 连续 acoustic embeddings + Text tokens → LLM (bottom-N frozen, top-K fine-tuned) → discrete speech tokens → Flow-matching model → Mel → Waveform", "metrics": "SEED test-zh CER 1.53% (vs CosyVoice2 1.45%), test-en WER 2.24% (vs CosyVoice2 2.57%), test-hard WER 7.83% (vs CosyVoice2-S 8.08%); 方言 ASR WER: 中原 15.82% (vs CosyVoice2 20.01%), 西南 13.0% (vs CosyVoice2 19.52%) [Table 2, 3]", "takeaway": "layer-wise freezing (冻结 bottom-N + 微调 top-K) 保护 LLM 预训练知识的策略; 用 speech-text continuation pairs 做模态对齐训练; 用 TTS 合成方言数据做 ASR 数据增强验证", "limitation": "未报告 MOS/DNSMOS 等主观质量评估; 未报告 speaker similarity; 方言合成质量与 GT 仍有显著差距 (WER ~2x GT); 未开源; 流式推理延迟未量化", "concepts": ["LLM-basedTTS", "ConditionalFlowMatching", "SpeechTokenizer", "ModalityAdaptationforSpeechLLM", "SpeechLanguageModel"], "source": "Sources/GOAT-TTS.pdf", "github": "", "demo": ""}, {"name": "Kimi-Audio", "title": "Kimi-Audio", "arxiv_id": "2504.18425", "date": "2025-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-foundation-model", "audio-understanding", "speech-conversation", "flow-matching", "universal-audio", "open-source", "hybrid-tokenization"], "summary": "开源 audio foundation model,通过 hybrid tokenization (discrete semantic + continuous acoustic)、dual-head LLM (text + audio) 和 chunk-wise streaming flow matching detokenizer 实现 ASR/理解/对话/生成多任务 SOTA", "route": "Audio → VQ-Whisper 12.5Hz semantic tokens + Whisper continuous features (adaptor 4x downsample) → 相加作为 LLM 输入 → Shared LLM layers → Text Head + Audio Head 并行生成 → Audio tokens → Flow Matching (chunk-wise streaming + look-ahead) → BigVGAN → Waveform", "metrics": "ASR: LibriSpeech 1.28/2.42 WER [Table 4], AISHELL-1 0.60 WER [Table 4]; 理解: MMAU sound 73.27 [Table 5], CochlScene 79.84/80.99 [Table 5]; 对话: VoiceBench avg 76.93 [Table 6]; 语音对话: avg 3.90 (vs GPT-4o 4.06) [Table 7]", "takeaway": "(1) 6-blank-token delay 解决 audio-text 并行生成初始阶段对齐困难 [§4.1.3]; (2) chunk-wise streaming + look-ahead 4 tokens 的 training-free 流式 detokenizer 方案 [§2.4]; (3) 原始/增强 audio 1:1 混合防止 speech enhancement 破坏环境音理解 [§3.1]; (4) 7 种预训练任务的 weight 配比方案 (text 7: 其余各 1-2) [Table 3]", "limitation": "非全双工 (turn-based, 依赖 VAD 判断说话结束) [§5.1]; 基础 LLM 仅 7B; 13M hours 预训练数据细节不完全可复现 (含 in-house data); 语音对话的 empathy 维度弱于 GPT-4o (3.39 vs 3.87) [Table 7]; 未来挑战部分坦承当前 audio token 表征仍不够好 [§8]", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/ConditionalFlowMatching|Conditional Flow Matching", "概念库/SemanticvsAcousticTokens|Semantic vs Acoustic Tokens", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation for Speech LLM", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy", "概念库/AudioTokenizerTaxonomy|Audio Tokenizer Taxonomy", "概念库/LLM-basedTTS|LLM-based TTS", "概念库/NeuralVocoder|Neural Vocoder"], "source": "Sources/Kimi-Audio.pdf", "github": "", "demo": ""}, {"name": "Muyan-TTS", "title": "Muyan-TTS: A Trainable Text-to-Speech Model Optimized for Podcast Scenarios with a $50K Budget", "arxiv_id": "2504.19146", "date": "2025-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based", "zero-shot", "podcast", "open-source", "VITS", "SoVITS", "inference-acceleration"], "summary": "基于 Llama-3.2-3B + SoVITS decoder 的开源 LLM-based TTS,面向 podcast 场景,以 $50K 预算完成 100K+ 小时数据训练,提供完整可复现的训练流程", "route": "Text → Llama-3.2-3B (生成 HuBERT-quantized audio tokens) → SoVITS decoder (phoneme + speaker embedding → waveform)", "metrics": "LibriSpeech WER 3.44% / MOS 4.58 / SIM 0.37; SEED WER 4.09% / MOS 4.32 / SIM 0.41; 推理速度 r=0.33 (所有对比模型中最快) [Table 3, Table 5]", "takeaway": "(1) 数据处理管线: MSS→DeReverb→DeEcho→Denoise 四步清洗 + NISQA MOS>3.8/4.5 筛选; (2) 用 VITS decoder 抑制 LLM 幻觉的思路; (3) SFT 只需几十分钟数据、15 分钟训练即可适应新说话人", "limitation": "SIM 得分显著低于主流模型 (0.37 vs CosyVoice2 的 0.70); 不支持流式推理 (G2P 依赖完整 phoneme); 多语言能力弱 (训练数据偏英语); 不支持 instruction-following", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "SpeakerEmbedding", "SpeakerAdaptation", "VariationalAutoencoderforTTS", "Self-SupervisedSpeechRepresentation"], "source": "Sources/Muyan-TTS.pdf", "github": "", "demo": ""}, {"name": "PALLE", "title": "Pseudo-Autoregressive Neural Codec Language Models for Efficient Zero-Shot Text-to-Speech Synthesis", "arxiv_id": "2504.10352", "date": "2025-04", "venue": "ACM MM 2025", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "codec-LM", "pseudo-autoregressive", "masked-generative", "parallel-decoding", "non-autoregressive"], "summary": "提出 Pseudo-Autoregressive (PAR) 建模范式,在双向 masked generative transformer 中注入 span-level 时序约束,实现固定步数的并行语音生成,兼具 AR 的时序建模和 NAR 的推理效率", "route": "Text (BPE) + Speech prompt (S3Tokenizer v2, 25Hz) → PAR stage (固定 100 步,每步生成 1%T span 并 commit) → NAR refinement stage (7 步,confidence-guided re-masking) → CFM + HiFi-GAN (CosyVoice 2) → Waveform", "metrics": "Cross-sentence WER-W 2.23% (vs MaskGCT 4.22%, E2 TTS 5.90%) / SIM-o 0.716 (vs MaskGCT 0.756) / RTF 0.06 (vs MaskGCT 0.65, F5-TTS 0.15); 仅用 LibriTTS 580h 训练 [Table 1]", "takeaway": "(1) PAR 的 span-level progressive commitment -- 在 masked generation 中加入软时序约束的通用技巧; (2) 第二阶段 confidence-guided refinement 只需 7 步即可显著降低 WER; (3) 训练/推理 span 比例解耦 (训练 10%, 推理 1%) 可提升质量", "limitation": "仅在 LibriSpeech test-clean 评估 (英语, 干净条件); SIM-o 略低于 MaskGCT; 两阶段不能合并为单模型 (WER 恶化 20%); 未开源", "concepts": ["CodecLanguageModel", "MaskedGenerativeModeling", "Non-autoregressiveTTS", "SpeechTokenizer", "SemanticvsAcousticTokens", "ConditionalFlowMatching", "Speech-TextAlignment"], "source": "Sources/PALLE.pdf", "github": "", "demo": ""}, {"name": "RWKVTTS", "title": "RWKVTTS: Yet another TTS based on RWKV-7", "arxiv_id": "2504.03289", "date": "2025-04", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "RWKV", "RNN", "LLM-based-TTS", "efficiency", "zero-shot", "CosyVoice"], "summary": "将 CosyVoice 2.0 中的 Transformer LLM backbone 完整替换为 RWKV-7 (RNN-based 线性复杂度模型),声称在 TTS 质量上与 Ground Truth 和 Transformer baseline 相当", "route": "参考音频 → VQ-VAE → 音频 token; 文本 → text token; [audio embedding + text embedding] → RWKV-7 LLM → audio head → 音频 token → 解码", "metrics": "Production Quality 7.73 (vs GT 7.80, FireRedTTS-1S 7.82); Content Enjoyment 6.11 (vs GT 6.20, FireRedTTS-1S 6.06) [Fig 1]; 无 WER/CER/MOS/Speaker Similarity 标准指标", "takeaway": "RWKV-7 直接 drop-in 替换 Transformer LLM 的集成方式 (保持 data layout / embedding / audio head 不变,仅换中间的 LM); PISSA 微调策略复用 LM 参数同时做语音和文本任务的思路 (§5.3,未实现)", "limitation": "论文完成度低 -- 无标准 TTS 评估指标 (WER/CER/Speaker Similarity/MOS),仅用非标准主观评分; 仅与 FireRedTTS-1S 一个 baseline 对比; 无效率数据 (推理速度/显存/RTF); 无消融实验; 未开源训练细节; 多处提到的增强 (§3.5) 均为 future work", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "CodecLanguageModel"], "source": "Sources/RWKVTTS.pdf", "github": "", "demo": ""}, {"name": "SafeSpeech", "title": "SafeSpeech: Robust and Universal Voice Protection Against Malicious Speech Synthesis", "arxiv_id": "2504.09839", "date": "2025-04", "venue": "USENIX Security 2025", "org": "", "tier": "deep", "tags": ["voice-protection", "adversarial-perturbation", "unlearnable-examples", "voice-cloning", "anti-spoofing", "deepfake-defense", "data-poisoning", "speaker-verification"], "summary": "通过在原始语音中嵌入不可感知扰动,使 TTS 模型在 fine-tuning 和 zero-shot 两种场景下均无法合成高质量仿冒语音,实现主动式语音隐私保护", "route": "原始音频 → 代理 TTS 模型(BERT-VITS2) → pivotal objective(mel L1) + SPEC(KL 散度引导输出趋近噪声) + 感知优化(STOI+STFT) → 受保护音频(不可感知扰动) → 攻击者用任意 TTS fine-tune/zero-shot 均生成低质量语音", "metrics": "BERT-VITS2 上 WER 24.0%→99.6%, SIM 0.604→0.204 [Table 1]; 跨模型迁移到 GlowTTS WER 30.7%→102.4% [Table 1]; zero-shot F5-TTS SIM 0.885→0.094 [Fig 4]; 受保护音频 MOS naturalness 3.190±0.189 [Table 4]; 实时生成扰动仅需 10.6s [§7.3]", "takeaway": "pivotal objective selection 思路 -- 在多目标 TTS 中找收敛最快且通用的单一目标(mel L1)作为扰动优化的锚点,可迁移到其他需要通用对抗扰动的场景", "limitation": "扰动依赖 L_p norm 约束(epsilon=8/255),极端降噪(DEMUCS)可部分削弱保护效果(WER 降至 57.3%); 物理世界需要额外播放设备; 对 FishSpeech 的 zero-shot 保护相对较弱(SIM=0.301)", "concepts": ["Anti-spoofingandDeepfakeDetection", "SpeakerVerification", "SpeakerEmbedding", "MelSpectrogram", "VoiceCloningTaxonomy", "SpeakerAdaptation"], "source": "Sources/SafeSpeech.pdf", "github": "", "demo": ""}, {"name": "USM-VC", "title": "USM-VC: Mitigating Timbre Leakage with Universal Semantic Mapping Residual Block for Voice Conversion", "arxiv_id": "2504.08524", "date": "2025-04", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["voice-conversion", "timbre-leakage", "content-representation", "semantic-dictionary", "zero-shot", "any-to-many", "universal"], "summary": "提出 Universal Semantic Matching (USM) 残差模块,通过离线构建的全局语义字典 + Content Feature Re-expression (CFR) + 加权 skip connection,将任意 content representation 转换为 timbre-free 版本,在 VITS/LM/Diffusion 三种 VC 框架上均显著提升 speaker similarity", "route": "Source speech → Content Extractor (PPG/HuBERT) → Content Layer → Softmax → Phoneme Posteriors → [Global Semantic Dictionary × Posteriors = Timbre-free repr (w1)] + [Original content × w2] → USM representation → VC framework (VITS/LM/Diffusion) → Converted speech", "metrics": "VITS any-to-many: USM NMOS 4.153/SMOS 3.832/SSIM 0.748/WER 2.102 vs BNF 4.012/3.051/0.601/2.285 [Table 1]; LM zero-shot: USM SSIM 0.751/WER 2.133 vs BNF 0.641/2.153 [Table 2]; Cross-system best: LM-VC-USM UTMOS 4.011/SSIM 0.751/WER 2.133 vs FreeVC 3.973/0.617/2.613 [Table 4]", "takeaway": "(1) Global semantic dictionary — 从多说话人数据离线统计的 speaker-independent phoneme centroid,作为 timbre-free anchor; (2) CFR: 用 phoneme posterior 作为权重,将每帧表示为字典条目的加权组合; (3) Weighted skip connection (w1+w2=1) 平衡 timbre-free 表征和原始上下文信息; (4) 可即插即用到任何 VC 框架", "limitation": "(1) 需要离线构建 semantic dictionary (K=4096 entries); (2) w1/w2 权重对不同框架需分别调优; (3) 仅在 VCTK + LibriTTS 上验证,未测大规模数据; (4) PPG extractor 需要 phonetic alignment 训练数据", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeechFactorization", "ResidualVectorQuantization", "CodecLanguageModel", "DiffusionModel"], "source": "Sources/USM-VC.pdf", "github": "", "demo": ""}, {"name": "DiVISe", "title": "DiVISe: Direct Visual-Input Speech Synthesis Preserving Speaker Characteristics And Intelligibility", "arxiv_id": "2503.05223", "date": "2025-03", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["video-to-speech", "V2S", "audio-visual", "speaker-preservation", "mel-spectrogram", "vocoder", "HiFi-GAN", "AV-HuBERT"], "summary": "端到端 V2S 模型,用 AV-HuBERT + Conformer 直接从无声视频预测 mel spectrogram,不需要任何 speaker embedding 就能保留说话人特性", "route": "无声视频帧 (25 FPS) → AV-HuBERT Encoder (325M) → Linear Upsampling (4x, 25→100 Hz) → Conformer (4 blocks) → 128-dim Mel Spectrogram → HiFi-GAN Vocoder → 16kHz 波形", "metrics": "LRS3 SECS 0.624 / EER 28.66% (visual-only SOTA); WER 35.68%; PESQ 1.17; 人类主观 speaker matching 3.90/5.0 [Table 3-6]", "takeaway": "mel-based vocoder 显著优于 unit-based vocoder 在说话人特性保留上的实证 (SECS 0.894 vs 0.555, Table 1),vocoder 输入表示的选择是 speaker similarity 的关键瓶颈", "limitation": "需要预处理提取 96x96 嘴部区域 (不适合实时场景); 仅在英语 (LRS2/LRS3) 上测试; 绝对音质指标 (PESQ 1.17-1.23) 仍然较低; 与需要额外信息的方法相比,内容准确度仍有差距", "concepts": ["MelSpectrogram", "NeuralVocoder", "SpeakerEmbedding", "Self-SupervisedSpeechRepresentation", "SpeakerVerification"], "source": "Sources/DiVISe.pdf", "github": "", "demo": ""}, {"name": "LLMVoX", "title": "LLMVoX: Autoregressive Streaming Text-to-Speech Model for Any LLM", "arxiv_id": "2503.04724", "date": "2025-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "streaming", "LLM-agnostic", "autoregressive", "speech-tokenizer", "low-latency", "plug-and-play", "speech-LM"], "summary": "30M 参数的 LLM-agnostic autoregressive streaming TTS,通过 multi-queue 机制实现 475ms 端到端延迟,同时保留任意 LLM 的全部能力", "route": "LLM text tokens → ByT5 G2P embedding + 前一帧 codec feature → concat + L2 norm + positional embedding → 4-layer decoder-only Transformer → speech token → WavTokenizer decoder → waveform (multi-queue 双实例并行)", "metrics": "WER 3.70% / UTMOS 4.05 / 端到端延迟 475ms (Whisper Small + LLaMA-3.1-8B + LLMVoX) [Table 1]; Arabic CER 8.2% (streaming) [Table 3]; VSQA GPT score 6.41 / latency 1.05s [Table 4]", "takeaway": "(1) multi-queue 双 TTS 实例 + 倍增 chunk size 的 streaming 方案,可用于任何需要长对话的 cascaded TTS 系统; (2) 直接复用 ByT5 G2P embedding layer 作为 phoneme-aware text frontend,避免显式 G2P 转换的延迟; (3) 仅用 LLM 输出文本 (非 hidden states) 作为 TTS 输入,实现真正的 plug-and-play", "limitation": "单说话人 / 无 voice cloning / ASR 未流式化 / 仅 2200h 训练数据 / WavTokenizer 单层 RVQ 可能限制音质上限 / 未评估韵律表现力", "concepts": ["StreamingSpokenDialogue", "LLM-basedTTS", "SpeechTokenizer", "CodecLanguageModel", "ResidualVectorQuantization", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/LLMVoX.pdf", "github": "", "demo": ""}, {"name": "Phi-4-multimodal", "title": "Phi-4-Mini Technical Report: Compact yet Powerful Multimodal Language Models via Mixture-of-LoRAs", "arxiv_id": "2503.01743", "date": "2025-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["multimodal-LLM", "speech-understanding", "ASR", "speech-translation", "speech-summarization", "audio-understanding", "LoRA", "modality-adaptation"], "summary": "3.8B 参数的多模态 SLM,通过 Mixture of LoRAs 将文本/视觉/语音模态集成在冻结基座上,语音 LoRA 仅 460M 参数即登顶 OpenASR 排行榜", "route": "80-dim log-Mel (10ms) → 预训练 Conformer 编码器 (3 Conv + 24 Conformer blocks) → 2-layer MLP projector → 冻结的 Phi-4-Mini (3.8B) + LoRA_A (rank=320)", "metrics": "OpenASR WER 6.14 (No.1); CV15 8语言平均 WER 6.80; CoVoST2 X-EN BLEU 40.76 (CoT); SSUM Golden3 6.28/7; AirBench 6.98", "takeaway": "Mixture of LoRAs 的模态隔离设计 (不同模态互不干扰 + 基座冻结保留语言能力); CoT 解码提升翻译质量 1-2 BLEU; 语音 token rate 80ms (750 tokens/min) 的实用性设计", "limitation": "仅支持语音理解,不支持语音生成/TTS; SQQA 能力明显弱于 GPT-4o/Gemini (MT-Bench 7.05 vs 8.11); 音频安全仅覆盖 voice,未涵盖非语音音频; 长音频 (>30s, 除 SSUM 外) 未经充分训练", "concepts": ["ModalityAdaptationforSpeechLLM", "SpeechLanguageModel", "Speech-LLMIntegrationTaxonomy", "AudioUnderstanding", "LLM-enhancedASR", "Self-SupervisedSpeechRepresentation", "MelSpectrogram"], "source": "Sources/Phi-4-multimodal.pdf", "github": "", "demo": ""}, {"name": "QualiSpeech", "title": "QualiSpeech: A Speech Quality Assessment Dataset with Natural Language Reasoning and Descriptions", "arxiv_id": "2503.20290", "date": "2025-03", "venue": "ACL 2025", "org": "", "tier": "deep", "tags": ["speech-quality-assessment", "natural-language-description", "auditory-LLM", "dataset", "benchmark", "MOS", "low-level-perception", "evaluation"], "summary": "首个覆盖合成+真实语音的 11 维低级语音质量评估数据集,含自然语言描述和推理,配套 auditory LLM benchmark", "route": "多源语音 → 人工标注(7 项打分 + 4 项描述) → GPT 生成 NL 描述 → 人工修正 → 数据集;SALMONN-7B + LoRA finetune → NL 质量评估", "metrics": "finetuned SALMONN noise PCC 0.70, distortion 时间定位 IoU 0.78 [Table 2]; 原始 auditory LLM 近零 PCC [Table 1]; GPT-4o-mini reasoning acc 0.46 vs Vicuna 0.28 [Table 4]", "takeaway": "三步标注流程(人工元信息 → GPT 生成描述 → 人工修正)可迁移到任何需要高质量 NL 标注的评估数据集; 对描述式评估的多维度拆分评估方法(precision/recall + GPT correlation + IoU)", "limitation": "每条样本仅 1 名标注员(vs MOS 多人); 英语单语; finetuned 模型推理能力受限于 Vicuna backbone; 数据集规模 ~10K 偏小", "concepts": ["TTSEvaluation", "AudioUnderstanding", "Audio-LanguagePretraining"], "source": "Sources/QualiSpeech.pdf", "github": "", "demo": ""}, {"name": "Qwen2.5-Omni", "title": "Qwen2.5-Omni Technical Report", "arxiv_id": "2503.20215", "date": "2025-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["omni-model", "multimodal", "streaming", "speech-generation", "thinker-talker", "end-to-end", "TMRoPE", "DPO"], "summary": "统一的端到端多模态模型,同时感知 text/image/audio/video 并**流式**生成 text + 自然语音,通过 Thinker-Talker 分离架构避免文本和语音生成的模态干扰", "route": "`Audio/Image/Video → Block-wise Encoder + TMRoPE → Thinker (Transformer Decoder, text generation) → Talker (Dual-track AR, speech token generation) → Flow-Matching DiT → BigVGAN → Waveform`", "metrics": "OmniBench 56.13% (SOTA, +13% over prev best) | VoiceBench 74.12 avg | seed-tts-eval WER 1.42/2.33/6.54 (zh/en/hard) | 单说话人 NMOS 4.51 (zh, 接近人类 4.51) | MMAU 65.60 (audio reasoning SOTA)", "takeaway": "(1) Thinker-Talker 分离设计,用 hidden representation 传递语义而非串行 pipeline; (2) TMRoPE 将时间戳编码到位置嵌入中同步音视频; (3) DPO 优化语音生成稳定性 (基于 WER + 标点停顿错误率构建正负对)", "limitation": "未开源训练数据和训练代码 | 仅支持 streaming 输出,不支持全双工 (无打断能力) | 语音生成的 speaker similarity 弱于 Seed-TTS/CosyVoice 2 | 7B 参数,推理计算成本高", "concepts": ["概念库/SpeechLanguageModel|Speech Language Model", "概念库/Speech-LLMIntegrationTaxonomy|Speech-LLM Integration Taxonomy", "概念库/ModalityAdaptationforSpeechLLM|Modality Adaptation", "概念库/ConditionalFlowMatching|Conditional Flow Matching", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/AudioUnderstanding|Audio Understanding", "概念库/Full-duplexSpokenDialogue|Full-duplex Spoken Dialogue", "概念库/StreamingSpokenDialogue|Streaming Spoken Dialogue", "概念库/LLM-basedTTS|LLM-based TTS"], "source": "Alibaba Qwen Team", "github": "", "demo": ""}, {"name": "Spark-TTS", "title": "Spark-TTS: An Efficient LLM-Based Text-to-Speech Model with Single-Stream Decoupled Speech Tokens", "arxiv_id": "2503.01710", "date": "2025-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based-TTS", "speech-codec", "single-codebook", "zero-shot", "controllable-TTS", "chain-of-thought", "speech-factorization"], "summary": "BiCodec 将语音解耦为 semantic tokens (语义,50 TPS VQ) + global tokens (音色,固定 32 个 FSQ),配合 Qwen2.5-0.5B 实现单 LM 的 zero-shot TTS 和 CoT 属性控制。", "route": "Text + (Reference Audio 或 Attribute Labels) → Qwen2.5-0.5B (fine-tuned) → [Fine-grained Attributes →] Global Tokens → Semantic Tokens → BiCodec Decoder → Waveform", "metrics": "Seed-TTS-eval: CER 1.20% / SIM 0.672 (zh), WER 1.98% / SIM 0.584 (en); BiCodec 重建: STOI 0.92, UTMOS 4.18, SIM 0.80 @ 650 bps; TTS 音质: UTMOS 4.35 (LibriSpeech test-clean) 超越 CosyVoice2 (4.23) 和 GT (4.08) [Table 4, 5]", "takeaway": "(1) Global tokens 用 learnable queries + cross-attention + FSQ 从 Mel 提取固定长度说话人表征,避免了传统 speaker embedding 的信息瓶颈和 RVQ 的多码本复杂度; (2) Chain-of-thought 属性预测 -- coarse label 先预测 fine-grained value 再预测 global/semantic tokens,将可控性嵌入 LM 的自然生成流程", "limitation": "Speaker similarity 显著弱于多阶段方案 (SIM 0.672 vs Seed-TTS 0.796 / CosyVoice2 0.748 [Table 4]); semantic 和 global tokens 之间缺乏显式解耦约束; 仅在英中双语评估", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "SemanticvsAcousticTokens", "FiniteScalarQuantization", "Single-codebookvsMulti-codebook", "SpeechFactorization", "CodecLanguageModel", "SpeakerEmbedding"], "source": "Sources/Spark-TTS.pdf", "github": "", "demo": ""}, {"name": "UniSep", "title": "UniSep: Universal Target Audio Separation with Language Models at Scale", "arxiv_id": "2503.23762", "date": "2025-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-separation", "language-model", "discrete-token", "universal-model", "pre-training", "target-separation"], "summary": "首个基于 LM 的通用目标音频分离模型,将分离建模为离散 token 空间的 seq2seq 问题,统一处理语音/声音/音乐分离", "route": "混合音频 → SoundStream RVQ (Nq=3) tokenize → [mixture tokens + prompt tokens + target tokens] 拼接 → 多尺度 causal Transformer (12 global + 4 local layers, 535M) → AR 解码 target tokens → SoundStream decoder → 分离音频", "metrics": "Speech DNSMOS 4.07 / MUSHRA 4.11 (Libri2Mix); Sound ViSQOL 4.10 / MUSHRA 3.73 (AudioSet); Music avg ViSQOL 4.23 / avg MUSHRA 3.72 (MUSDB18); LASS fine-tuning 用 0.12% audio-text pairs 达到 AudioSep 96.94% ViSQOL", "takeaway": "(1) Audio Continuation + Audio Inpaint 两阶段 pre-training 利用无标注音频数据; (2) 统一模型优于单任务模型的实验证据; (3) 用 LM 做分离的范式迁移思路", "limitation": "PESQ 等对齐敏感指标不适用于 AR 采样(作者承认); LASS fine-tuning 效果不如 AudioSep(数据量差 800x); 未与连续空间分离方法做公平对比; 535M 参数推理速度未报告; 代码基于 UniAudio 但分离部分未单独开源", "concepts": ["ResidualVectorQuantization", "CodecLanguageModel", "SpeechLanguageModel", "AudioTokenizerTaxonomy"], "source": "Sources/UniSep.pdf", "github": "", "demo": ""}, {"name": "BalancingUnderstanding-Generation", "title": "Continual Pre-training for Codec-Based Speech LLMs: Balancing Understanding and Generation", "arxiv_id": "2502.16897", "date": "2025-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "codec", "continual-pre-training", "ASR", "TTS", "speech-translation", "S2S-Trans", "catastrophic-forgetting"], "summary": "提出 continual pre-training (CPT) 框架,通过在预训练文本 LLM 上继续训练 codec-discretized speech,使单一模型同时具备语音理解 (ASR) 和生成 (TTS) 能力,并首次实现 codec-only single-pass S2S-Trans", "route": "Speech → SoundStream codec tokens → shared embedding (sum L' levels) → Qwen1.5-0.5B Transformer (CPT adapted) → parallel prediction heads → text tokens / codec tokens", "metrics": "ASR WER 3.7/6.3 (LibriSpeech clean/other), TTS WER 3.7 + UTMOS 3.59 + SPK-SIM 0.65 (LibriTTS), S2S-Trans ASR-BLEU 33.4 + UTMOS 3.66 (GigaST EN-to-ZH) [Table I-IV]", "takeaway": "(1) CPT 中 10% 纯文本数据即可有效缓解灾难性遗忘 (perplexity 38.59 vs 47.88); (2) 多层 codec tokens 直接求和为单一 embedding 而非展开为长序列,大幅简化了 RVQ 建模; (3) S2S-Trans 作为 held-out task 验证 CPT 的跨模态泛化能力", "limitation": "模型仅 0.5B 规模,ASR 性能落后于 7B 级 SSL-based 系统 (Qwen-Audio2 WER 1.3); codec tokens 在语义任务上仍有结构性劣势; 仅支持 EN-ZH 双语; 未开源完整训练代码", "concepts": ["CodecLanguageModel", "SpeechLanguageModel", "SemanticvsAcousticTokens", "ModalityAdaptationforSpeechLLM", "Speech-LLMIntegrationTaxonomy", "SpeechTokenizer"], "source": "Sources/BalancingUnderstanding-Generation.pdf", "github": "", "demo": ""}, {"name": "DiTAR", "title": "DiTAR: Diffusion Transformer Autoregressive Modeling for Speech Generation", "arxiv_id": "2502.03930", "date": "2025-02", "venue": "arXiv (ByteDance Seed)", "org": "", "tier": "deep", "tags": ["TTS", "autoregressive", "diffusion", "continuous-representation", "patchification", "zero-shot", "scalability"], "summary": "Patch-based AR 框架,用 causal LM 做 patch 间预测 + bidirectional DiT (LocDiT) 做 patch 内生成,在连续语音表示上实现 SOTA 零样本 TTS 且计算量远低于 NAR 竞品", "route": "文本 phoneme → [text embedding + speech VAE latent (40Hz, dim=64)] → causal LM (patch 聚合) → LocDiT (diffusion 解码 next patch) → VAE decoder (BigVGAN) → waveform", "metrics": "WER 1.78% / SIM 0.64 (LibriSpeech-A, Librilight 60K h, 0.6B) [Table 1]; WER 1.685% / SIM 0.735 (Seed-EN, 280K h, 1B) [Table 3]; TFLOPs ~2.75 vs NAR 37-117 TFLOPs [Table 1]; NFE=10", "takeaway": "(1) Patchification 让 causal LM 处理更短序列同时为 diffusion 提供双向建模窗口; (2) LM Guidance — 仅需 2 次 diffusion head + 1 次 LM forward 的高效 CFG 变体; (3) 连续 LM 温度 = reverse ODE 噪声引入时间点,兼容 ODE solver; (4) historical patch 作为 LocDiT context 将任务从 generation 转为 outpainting", "limitation": "仅评估了英文和中文; VAE tokenizer 训练细节未充分公开; 未与同期 AR+Diffusion 工作 (如 LatentLM) 直接对比; 未讨论流式推理; 24kHz 采样率在高保真场景可能不足", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Next-TokenDiffusion", "VariationalAutoencoderforTTS", "Diffusion-basedTTS"], "source": "Sources/DiTAR.pdf", "github": "", "demo": ""}, {"name": "DiffCSS", "title": "DiffCSS: Diverse and Expressive Conversational Speech Synthesis with Diffusion Models", "arxiv_id": "2502.19924", "date": "2025-02", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "conversational-speech-synthesis", "diffusion", "prosody", "diversity", "LM-based-TTS", "context-modeling"], "summary": "首个将 diffusion model 引入 CSS 的框架,通过扩散韵律预测器从多模态对话上下文中采样多样韵律嵌入,配合 LM-based TTS backbone 合成富有表现力的对话语音", "route": "多模态对话上下文 (text+speech) → Sentence-T5 文本编码 + FACodec 韵律提取 → Diffusion-based 韵律预测器 (Transformer encoder denoiser) → 韵律嵌入 → Prosody-enhanced ParlerTTS (decoder-only transformer + DAC codec) → 语音", "metrics": "E-MOS 3.602 / C-MOS 3.574 (vs GRU 3.209/3.177); NDB 4 / JSD 0.036 (vs GRU 16/0.227, vs Transformer 14/0.181) [Table I, DailyTalk]", "takeaway": "(1) 用 diffusion 建模韵律嵌入空间而非直接建模声学特征,解耦韵律多样性与音质; (2) 用 learnable query + cross-attention 将变长韵律特征压缩为固定长度嵌入; (3) 两阶段训练策略 (先训 TTS backbone 再冻结训韵律预测器) 保证模块独立可控", "limitation": "仅在 DailyTalk (20h, 2 speakers) 上验证; 无真实对话场景评估; ParlerTTS backbone 本身并非 SOTA; 未开源代码", "concepts": ["DiffusionModel", "Diffusion-basedTTS", "ProsodyModeling", "CodecLanguageModel", "LLM-basedTTS", "SpeakerEmbedding", "NaturalLanguageDescriptionforTTS"], "source": "Sources/DiffCSS.pdf", "github": "", "demo": ""}, {"name": "FELLE", "title": "FELLE", "arxiv_id": "2502.11128", "date": "2025-02", "venue": "ACM Multimedia 2025", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "autoregressive", "flow-matching", "continuous-token", "mel-spectrogram", "coarse-to-fine", "LLM-TTS"], "summary": "在 AR mel-spectrogram LM 中引入 token-wise coarse-to-fine flow matching,用前一帧初始化 flow 先验分布,显著提升 speaker similarity (SIM-o: 0.619 vs MELLE 0.591)", "route": "Text(phoneme) + Speech Prompt(mel) → AR Transformer LM(hidden z^i) → C2F-FM(coarse→fine flow matching, 每帧独立) → Mel Spectrogram → HiFi-GAN Vocoder → Waveform", "metrics": "Continuation MOS 3.836 / Cross-Sentence MOS 4.157 (超越 MELLE 4.036); WER-C 1.53% / SIM-o 0.619 (Cross-Sentence) [Table 1, 2]", "takeaway": "(1) 动态先验: 用前一帧 mel 初始化 flow 的 p0,减少 NFE 和提升连贯性 (2) Coarse-to-fine 频域分解: 低频粗+高频细两阶段 flow matching (3) 在 AR 框架中 per-token 使用 flow matching 替代回归损失", "limitation": "仅在 LibriSpeech 960h 上评估,未在大规模数据上验证; 16kHz 采样率; 模型规模较小(12层 Transformer + 18M C2F-FM)", "concepts": ["ConditionalFlowMatching", "LLM-basedTTS", "Classifier-FreeGuidance", "MelSpectrogram"], "source": "Sources/FELLE.pdf", "github": "", "demo": ""}, {"name": "FPO", "title": "FPO: Fine-grained Preference Optimization Improves Zero-shot Text-to-Speech", "arxiv_id": "2502.02950", "date": "2025-02", "venue": "arXiv (journal submission)", "org": "", "tier": "deep", "tags": ["RLHF", "DPO", "preference-optimization", "zero-shot-TTS", "robustness", "fine-grained-alignment", "token-level-optimization", "data-efficiency"], "summary": "将 TTS 偏好优化从 utterance-level 下沉到 token-level,通过分类 segmental errors (temporal modeling / semantic-phonetic alignment) 并选择性计算 loss,以 3-4x 数据效率显著降低 bad case ratio", "route": "多次采样生成 candidate pairs -> 自动评分选择 preference pairs -> fine-grained annotation (Whisper-timestamped + forced alignment 定位 error segments) -> token-level indicator function 选择性 DPO loss", "metrics": "CosyVoice CER 3.63->1.83 (-49.6%), bad case 21%->9%; CosyVoice2 CER 1.45->1.32, bad case 14%->8%; Llasa CER 1.89->1.47, bad case 25%->11% [Table I]; NMOS +0.19/+0.10/+0.19 [Table II]; 200 utterances 即达 UNO 600 utterances 的 WER [Fig 4]", "takeaway": "(1) 对 TTS segmental errors 的二分类 (temporal vs semantic-phonetic) + 不同 annotation 策略 (局部 vs 级联); (2) token-level indicator function 选择性 loss 计算,可迁移到任何序列模型的 fine-grained alignment", "limitation": "fine-grained 人工标注成本高 (虽然数据量少但每条更复杂); SECS 无显著提升 (FPO 不优化 speaker similarity); 仅在 AR 模型上验证,连续表征 TTS 的适用性未探索", "concepts": ["LLM-basedTTS", "SemanticvsAcousticTokens", "DifferentiableRewardOptimization", "TTSEvaluation"], "source": "Sources/FPO.pdf", "github": "", "demo": ""}, {"name": "IndexTTS", "title": "IndexTTS: An Industrial-Level Controllable and Efficient Zero-Shot Text-To-Speech System", "arxiv_id": "2502.05512", "date": "2025-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "autoregressive", "industrial", "polyphone-control", "VQ", "FSQ", "BigVGAN"], "summary": "基于 XTTS/Tortoise 的工业级 zero-shot TTS 系统,通过字符-拼音混合建模实现中文多音字可控发音,用 Conformer Perceiver + BigVGAN2 提升音色相似度和音质", "route": "Text (BPE tokenizer, 字符+拼音混合) → Conformer Perceiver (speaker conditioning) → decoder-only Transformer (AR, 单码本 VQ/FSQ 8192 codes, 25Hz) → BigVGAN2 (25Hz→100Hz→24kHz) → Waveform", "metrics": "AVG WER 3.7% / AVG SS 0.776 (4 测试集) [Table 3]; MOS AVG 4.01 (prosody 3.79, timbre 4.20, quality 4.05) [Table 4]; 推理耗时 397s/200 样本, GPU 利用率 28.47% [Table 5]", "takeaway": "(1) 字符-拼音混合 BPE 建模 — 94% 多音字纠正率,无需外部 G2P 模块; (2) Conformer Perceiver 替代 Transformer conditioner 提升音色一致性; (3) VQ 在大数据量(34k h)下利用率接近 100%,不必一定用 FSQ", "limitation": "不支持情感/指令控制; 仅中英文; 主观评估样本量 100 偏小; 缺乏与 Seed-TTS 等同期系统对比", "concepts": ["SpeechTokenizer", "CodebookCollapse", "FiniteScalarQuantization", "LLM-basedTTS", "SpeakerEmbedding", "NeuralVocoder", "Single-codebookvsMulti-codebook"], "source": "Sources/IndexTTS.pdf", "github": "", "demo": ""}, {"name": "Koel-TTS", "title": "Koel-TTS: Enhancing LLM based Speech Generation with Preference Alignment and Classifier Free Guidance", "arxiv_id": "2502.05236", "date": "2025-02", "venue": "Preprint (NVIDIA)", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based-TTS", "preference-alignment", "DPO", "RPO", "classifier-free-guidance", "zero-shot-TTS", "autoregressive"], "summary": "在 encoder-decoder 自回归 TTS 模型上,用 ASR/SV 驱动的偏好对齐 (DPO/RPO) + 同时 dropout text 和 audio 的 CFG,以 18-21K 小时数据在 zero-shot TTS 上达到 SOTA 可懂度和说话人相似度", "route": "Text → NAR Encoder → Cross-attention → AR Decoder → N codebook tokens (并行) → LFSC Codec → Waveform; post-training: 采样多输出 → ASR CER + SV SSIM 排序 → Pareto 最优配对 → DPO/RPO 微调; 推理: conditional + unconditional logit 插值 (CFG scale gamma)", "metrics": "CER 0.55% / WER 1.41% (Koel-TTS 380M, unseen, LibriTTS test-clean) vs GT CER 0.80%; SSIM 0.740 (1.1B multilingual); MOS 4.054/SMOS 3.826 均优于 VALL-E-X/XTTS-v2/StyleTTS-2/E2-TTS/F5-TTS [Table 3]", "takeaway": "(1) Pareto 最优排序构建多目标偏好对——可推广到任何多指标优化场景; (2) CFG 对自回归 token 预测模型同样有效,无需额外微调即可大幅提升; (3) RPO 比 DPO 对超参更鲁棒且支持 non-high-contrast 对", "limitation": "SSIM 指标上不及 flow-matching 模型 (F5-TTS 0.834, E2-TTS 0.848 vs Koel-TTS 0.740); 训练数据远少于竞品 (18-21K h vs 100K+ h); 代码已开源但开源时间晚于投稿; 对 challenging text (重复词) CER 仍有 4-5% 空间", "concepts": ["Classifier-FreeGuidance", "LLM-basedTTS", "CodecLanguageModel", "DifferentiableRewardOptimization", "SpeakerVerification", "FiniteScalarQuantization", "Speech-TextAlignment"], "source": "Sources/Koel-TTS.pdf", "github": "", "demo": ""}, {"name": "LLM-EnhancedFull-Duplex", "title": "LLM-Enhanced Dialogue Management for Full-Duplex Spoken Dialogue Systems", "arxiv_id": "2502.14145", "date": "2025-02", "venue": "Interspeech 2025", "org": "", "tier": "deep", "tags": ["full-duplex", "dialogue-management", "turn-taking", "VAD", "LLM", "semantic-VAD", "control-tokens", "Tencent"], "summary": "用 0.5B LLM (Hunyuan) 微调为\"语义 VAD\",预测 4 个控制 token 管理全双工对话轮次,将 DM 从 CDE 解耦以降低计算开销", "route": "用户语音 → AEC → Acoustic VAD → ASR → Semantic VAD (0.5B LLM, 预测 C-L/S-S/S-L/C-S) → CDE (仅在 S-S 时激活) → TTS", "metrics": "合成测试集 accuracy 97.85%, barge-in F1 0.999/1.000, 实录数据 accuracy 93.5%+ [Table 1, 3]", "takeaway": "(1) DM/CDE 解耦思路可用于任何需要实时决策但核心推理昂贵的系统; (2) 合成全双工训练数据的 Algorithm 1 (topic+style+交互类型概率控制) 可复用; (3) 4-token 设计将复杂交互简化为分类问题", "limitation": "仅在合成数据上评估 barge-in; 实录实验仅覆盖 user state detection; 仅支持中文; 无延迟分析; 与 baseline 的对比使用不同测试集", "concepts": ["Full-duplexSpokenDialogue", "Turn-takinginSpokenDialogue", "StreamingSpokenDialogue", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/LLM-EnhancedFull-Duplex.pdf", "github": "", "demo": ""}, {"name": "Llamba", "title": "Llamba: Scaling Distilled Recurrent Models for Efficient Language Processing", "arxiv_id": "2502.14458", "date": "2025-02", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["SSM", "Mamba", "knowledge-distillation", "cross-architecture-distillation", "recurrent-model", "efficient-inference", "on-device", "language-model"], "summary": "用 MOHAWK 三阶段跨架构蒸馏将 Llama-3.x Transformer 知识迁移到 Mamba-2 架构,仅用 <0.1% 训练数据即获得接近教师模型的性能,同时大幅提升推理吞吐和降低内存消耗", "route": "Llama-3.x (teacher) → MOHAWK 3阶段蒸馏(Matrix Orientation → Hidden-State Alignment → Weight Transfer + KD) → Discrete Mamba-2 blocks + Llama MLP → Llamba-{1B,3B,8B}", "metrics": "Llamba-8B AVG 68.8% vs 教师 Llama-3.1-8B 69.4% (8 benchmarks zero-shot) [Table 1]; MMLU 61.0 (relative 80.6% vs teacher) [Table 3]; 仅用 12B tokens 蒸馏 [Table 2]; 推理吞吐远超 Transformer 尤其大 batch [Fig 4]; Apple Silicon M3 Pro 上恒定内存/吞吐 [Fig 5]", "takeaway": "(1) MOHAWK 三阶段渐进蒸馏策略可迁移到 TTS 中 Transformer→Mamba 的架构替换; (2) Discrete-Mamba-2 的简化(去除 Delta 离散化+非线性)有助于蒸馏对齐; (3) 交替 Mamba+MLP 的架构比纯 Mamba 更省内存且更快(MLP 无时间状态)", "limitation": "MMLU 仍有 gap (61.0 vs 68.0); 未验证 instruction tuning/RLHF 后表现; 对比中部分 baseline 是 hybrid 架构(含 attention); 在 TTS/语音任务上未测试", "concepts": ["SpeechLanguageModel", "CodecLanguageModel"], "source": "Sources/Llamba.pdf", "github": "", "demo": ""}, {"name": "Llasa", "title": "Llasa: Scaling Train-Time and Inference-Time Compute for Llama-based Speech Synthesis", "arxiv_id": "2502.04128", "date": "2025-02", "venue": "ICML 2025", "org": "", "tier": "deep", "tags": ["TTS", "LLM-based-TTS", "scaling-law", "inference-time-compute", "speech-codec", "single-codebook", "autoregressive", "zero-shot"], "summary": "将 TTS 完全对齐标准 LLM 范式 (单层 VQ codec X-codec2 + LLaMA 初始化的单 Transformer),系统验证 train-time 和 inference-time scaling 效果", "route": "Text tokens → [LLaMA Transformer] → Speech tokens (单层 FSQ, 50Hz) → [X-codec2 Decoder] → Waveform", "metrics": "Seed-TTS-eval test-hard WER 4.38% / SIM-O 0.767 (8B+partial PRM+ORM) [Table 2]; LibriSpeech test-clean WER-H 1.49% / SIM-R 0.740 (8B+PRM+ORM) [Table 5]; X-codec2 UTMOS 4.13 / WER 2.47 / SPK-SIM 0.82 at 50 token/s [Table 1]", "takeaway": "Partial PRM 策略 (前 n 秒用 beam search + speaker verifier,后段切换到 best-of-N + WER verifier) 平衡了 SIM 和 WER;X-codec2 用 semantic encoder (Wav2Vec2-BERT) + acoustic encoder concat → 单层 FSQ 融合语义声学信息", "limitation": "单层 codec 的 SPK-SIM 上限受限 (resynthesis SIM-O 仅 0.677 on Seed-TTS-eval);test-time scaling 的计算量极大 (beam width 16, N=16, 即 256x 候选);未开源训练数据;中文 test-hard WER 仍达 4.38%", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "FiniteScalarQuantization", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "Single-codebookvsMulti-codebook", "TokenRateandBitrateTrade-offs"], "source": "https://arxiv.org/abs/2502.04128", "github": "", "demo": ""}, {"name": "Metis", "title": "Metis: A Foundation Speech Generation Model with Masked Generative Pre-training", "arxiv_id": "2502.03128", "date": "2025-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "foundation-model", "pre-training", "masked-generative", "unified-speech-generation", "fine-tuning", "multi-task", "zero-shot"], "summary": "在 SSL tokens 上做无条件 masked generative pre-training (300K h),通过 fine-tuning 高效适配 5 种语音生成任务,用 <20M 参数或 300x 更少数据超越 task-specific SOTA", "route": "Unlabeled speech → w2v-BERT 2.0 VQ → SSL tokens → [Pre-trained MGM, 300K h unconditional] → fine-tune with task-specific conditions → SSL tokens → Acoustic decoder (MGM) → DAC+Vocos → Waveform", "metrics": "TTS: WER 2.28% / SIM 0.72 (SeedTTS-en, 10K h ft) [Table 1]; VC: SIM 0.55 (VCTK, 0.4K h ft) [Table 2]; TSE: NISQA 4.41 (LibriMix) [Table 3]; SE: SOTA across all DNS2020 sets [Table 4]; L2S: SIM 59.73 (LRS2, 2x baseline) [Table 5]", "takeaway": "无条件预训练 + 有条件 fine-tuning 的范式可迁移到其他离散 token 生成任务; prompt prefix 机制 (p=0.8, length 0-40%) 增强 in-context learning; 帧级条件用 interpolation + MLP adapter 对齐, 非帧级条件用 time-dimension concatenation; LoRA rank=32 即可获得竞争力结果", "limitation": "推理需两阶段 (SSL→acoustic) 增加延迟; 预训练 300K h + 1200K steps 成本高; 离散 token 信息瓶颈限制声学质量上限; VC 任务 WER 高于部分 baseline (4.49 vs Vevo 3.48); 代码承诺开源于 Amphion 但实际可用性待验证", "concepts": ["MaskedGenerativeModeling", "Self-SupervisedSpeechRepresentation", "SemanticvsAcousticTokens", "Non-autoregressiveTTS", "Classifier-FreeGuidance"], "source": "Sources/Metis.pdf", "github": "", "demo": ""}, {"name": "Moonlight", "title": "Moonlight: Muon is Scalable for LLM Training", "arxiv_id": "2502.16982", "date": "2025-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["LLM", "optimizer", "Muon", "MoE", "scaling-law", "distributed-training", "AdamW", "matrix-orthogonalization"], "summary": "首次证明 Muon 优化器可扩展到大规模 LLM 训练,通过添加 weight decay 和调整 per-parameter update scale 实现 ~2x 计算效率优于 AdamW,训练出 3B/16B MoE 模型 Moonlight 推进 Pareto frontier [论文原文]", "route": "Muon optimizer (gradient momentum → Newton-Schulz orthogonalization → weight update) + weight decay + sqrt(max(A,B)) update RMS scaling → Distributed Muon (ZeRO-1 style) → 3-stage pretraining (warmup → cosine decay → cooldown) [§2, §3.3]", "metrics": "Moonlight@5.7T: MMLU 70.0 / HumanEval 48.1 / GSM8K 77.4 (vs DSV2-Lite MMLU 58.3 / HumanEval 29.9 / GSM8K 41.1, 同参数同 token 量); Scaling law: Muon 仅需 ~52% FLOPs 达到 AdamW 同等性能 [Table 5, Fig 1a]", "takeaway": "(1) 通过 sqrt(max(A,B)) scaling 统一不同形状矩阵的 update RMS,消除超参数调节; (2) 将 Muon update RMS 对齐 AdamW 范围 (0.2) 使 LR/WD 直接复用; (3) Distributed Muon 的 ZeRO-1 集成仅增加 ~0-25% 通信开销; (4) SVD entropy 作为优化器质量的诊断指标", "limitation": "(1) 预训练-微调优化器不匹配时性能下降,无法直接利用现有 AdamW pretrained checkpoints [§4]; (2) 非矩阵参数仍需 AdamW 处理; (3) 未开源训练数据,复现依赖 Kimi 内部数据集", "concepts": [], "source": "Sources/Moonlight.pdf", "github": "", "demo": ""}, {"name": "SongGen", "title": "SongGen: A Single Stage Auto-regressive Transformer for Text-to-Song Generation", "arxiv_id": "2502.13128", "date": "2025-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["text-to-song", "song-generation", "autoregressive", "codec-LM", "voice-cloning", "music-generation", "open-source"], "summary": "首个全开源的单阶段自回归 Transformer，直接从歌词+文本描述+可选参考声音生成完整歌曲（歌声+伴奏），支持 mixed mode 和 dual-track mode 两种输出模式", "route": "(歌词→VoiceBPE→Lyrics Encoder) + (描述→FLAN-T5→Text Embedding) + (参考声→MERT→Voice Embedding) → 拼接 cross-attention 条件 → Transformer Decoder (codebook-delay pattern) → X-Codec 解码 → 歌曲波形", "metrics": "Mixed Pro: FAD 1.71 / KL 0.69 / CLAP 0.35 / OVL 3.96 / REL 3.86; Interleaving A-V: FAD 1.87 / OVL 3.95 / VQ 4.15 (MusicCaps test) [Table 1]", "takeaway": "(1) Auxiliary vocal token prediction target 缓解 mixed audio 中人声被伴奏淹没的 learning bias; (2) Interleaving A-V 双轨 token pattern 利用 Transformer 层级分工(低层跨轨/高层轨内); (3) VoiceBPE 音素级 tokenizer 适配歌唱场景; (4) Curriculum learning 调整 codebook loss 权重", "limitation": "最长 30 秒/16kHz; 仅 2K 小时训练数据; Mixed mode 人声清晰度仍不如 dual-track; 无法生成完整歌曲结构; X-Codec 16kHz 限制音质", "concepts": ["ResidualVectorQuantization", "CodecLanguageModel", "SingingVoiceSynthesis", "SpeechTokenizer", "Classifier-FreeGuidance"], "source": "Sources/SongGen.pdf", "github": "", "demo": ""}, {"name": "Step-Audio", "title": "Step-Audio: Unified Understanding and Generation in Intelligent Speech Interaction", "arxiv_id": "2502.11946", "date": "2025-02", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "multimodal", "dual-codebook", "voice-cloning", "instruction-control", "RLHF", "TTS", "ASR"], "summary": "首个生产就绪的开源 130B 语音-文本多模态模型,通过 dual-codebook tokenization + AQTA 架构 + 3B speech decoder + instruction-driven 精细语音控制 + ToolCall 增强,实现 SoTA 的语音对话和可控 TTS [§Abstract]", "route": "User audio → Streaming dual tokenizer (linguistic 16.7Hz + semantic 25Hz, 2:3 interleave) → 130B LLM (Step-1) → text response → 3B Speech Decoder (LM + flow matching + neural vocoder) → waveform [§3, Fig 2]", "metrics": "TTS CER 1.17% zh / WER 2.0% en (130B, SEED test) [Table 3]; TTS CER 1.31 zh / WER 2.31 en (3B, SEED test) [Table 3]; ASR avg CER 4.64 (pretrain) [Table 1]; AQTA Chat Factuality 66.4% / Relevance 75.2% / Chat Score 4.11 (StepEval-Audio-360, 超越 GLM-4-Voice/Qwen2-Audio/Moshi) [Table 5]; Llama Question 81.0 / Web Questions 75.1 / ComplexBench 74.0 / HSK-6 86.0 [Table 6]; 人类评估 9 维度全面 SoTA (vs GLM-4-Voice, Qwen2-Audio) [Fig 1]", "takeaway": "(1) Dual-codebook tokenizer: linguistic (Paraformer) + semantic (CosyVoice) 以 2:3 交错,降低 LM perplexity 且提升 ASR; (2) Generative data engine: Step-2 LLM 生成文本 → Step-Audio clone 语音 → Audio-Edit model 添加情感/风格 [Fig 5]; (3) RLHF anti-deaf-hacking: 构造清晰音频+deaf-hacking 回复作为 rejected pair 消除奖励模型偏差 [§5.2.6]; (4) Speculative response generation: 用户暂停时预生成响应,~40% 命中率,减少约 500ms 延迟 [§3.4]", "limitation": "非端到端 (理解走 LLM,生成走 speech decoder,延迟叠加); 130B 推理成本极高; Moshi 在 StepEval-Audio-360 上表现极差 (非中文) 故对比参考价值有限 [Table 5]; 未公开训练数据规模细节; 多语言支持深度不清楚", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "SemanticvsAcousticTokens", "LLM-basedTTS", "Instruction-GuidedSpeechSynthesis", "EmotionControlinTTS"], "source": "Sources/Step-Audio.pdf", "github": "", "demo": ""}, {"name": "TechSinger", "title": "TechSinger: Technique Controllable Multilingual Singing Voice Synthesis via Flow Matching", "arxiv_id": "2502.12572", "date": "2025-02", "venue": "AAAI 2025", "org": "", "tier": "deep", "tags": ["SVS", "flow-matching", "technique-control", "pitch-control", "prompt-based", "multilingual", "CFG", "singing"], "summary": "首个基于 flow matching 的多语言多技巧可控歌声合成系统,通过 CFG + 自动技巧标注 + 自然语言 prompt 实现 7 种歌唱技巧的 phoneme-level 精细控制", "route": "歌词+乐谱+技巧序列(或 NL prompt→technique predictor) → phoneme/note encoder → duration predictor → LR → FMPP(flow matching F0 预测) → coarse mel decoder → CFGFMP(CFG flow matching postnet) → HiFi-GAN → 波形", "metrics": "MOS-Q 3.89 / MOS-C 4.10,FFE 0.245 / MCD 3.823 (GTSinger+自采数据集,Table 1); Prompt 控制 MOS-C 4.04 vs Random 3.76 [Table 2]", "takeaway": "(1) 用 flow matching 替代 L1 回归预测 F0,适用于任何需要精细 F0 建模的 SVS/TTS; (2) technique detector 自动标注扩展数据的策略可推广到其他细粒度属性标注; (3) CFG 用于歌唱技巧条件,可迁移到情感/风格条件 SVS", "limitation": "训练数据规模有限 (~30h 自采 + GTSinger); bubble/vibrato 预测精度差 (F1 仅 0.427/0.374); 无零样本说话人能力; 主观评估规模小 (40 段 × 20 人); 所有 baseline 都经过技巧嵌入增强改造,非原始配置对比", "concepts": ["SingingVoiceSynthesis", "ConditionalFlowMatching", "Classifier-FreeGuidance", "F0Modeling", "SVSEvaluationMetrics", "MusicalScoreEncoder", "NaturalLanguageDescriptionforTTS", "NeuralVocoder"], "source": "Sources/TechSinger.pdf", "github": "", "demo": ""}, {"name": "video-SALMONN-o1", "title": "video-SALMONN-o1: Reasoning-enhanced Audio-visual Large Language Model", "arxiv_id": "2502.11775", "date": "2025-02", "venue": "Preprint", "org": "", "tier": "deep", "tags": ["audio-visual-LLM", "reasoning", "process-DPO", "chain-of-thought", "video-understanding", "benchmark", "multimodal", "reinforcement-learning"], "summary": "首个开源推理增强音视频 LLM,通过 process DPO (pDPO) + contrastive step selection 实现步骤级推理优化,在 VideoMME/NExT-QA/RivaBench 上超越同规模所有开源模型", "route": "视频帧 → SigLIP encoder + Whisper-Large-v3 encoder → 各自 aligner → interleaved synchronization → Qwen2-7B (LoRA) → 推理步骤 + 答案", "metrics": "VideoMME 65.6%, NExT-QA 82.3%, RivaBench-StandUp 76.7%(超 Gemini-1.5-pro 的 75.8%）; pDPO 比 SFT 提升 3-8% absolute [Table 2]", "takeaway": "(1) pDPO 的步骤级偏好建模思路可迁移到 TTS 推理链优化; (2) contrastive step selection 用输入扰动+KL 散度定位易错步骤,计算效率高; (3) 推理路径 + 直接回答混合 SFT 策略", "limitation": "7B 规模限制; SynthDec F1 仅 17.8% 说明合成视频检测仍很难; 依赖 Gemini-1.5-pro/GPT-4o 生成训练数据", "concepts": ["SpeechLanguageModel", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "DifferentiableRewardOptimization", "Audio-LanguagePretraining"], "source": "Sources/video-SALMONN-o1.pdf", "github": "", "demo": ""}, {"name": "ALLD", "title": "ALLD", "arxiv_id": "2501.17202", "date": "2025-01", "venue": "ICLR 2025", "org": "", "tier": "deep", "tags": ["speech-quality-evaluation", "MOS-prediction", "audio-LLM", "distillation", "DPO", "A-B-test", "descriptive-analysis", "NISQA"], "summary": "首个 descriptive speech quality evaluation 数据集 + ALLD (Alignment with LLM Distillation) 训练方法,使 audio LLM 既能预测 MOS 又能生成多维度质量分析和 A/B 比较判断", "route": "Raw speech → Audio Encoder (trainable) → Audio LLM (pi_theta, e.g. Qwen2-Audio) → descriptive response y_a; 同时 Meta info (mos,noi,col,dis,loud) → Expert LLM (pi_ref, Qwen-7B) → reference response y_t; ALLD loss = DPO(y_t preferred, y_a dispreferred | same audio x)", "metrics": "MOS MSE 0.17 (vs Wav2vec2 0.27), LCC 0.93, SRCC 0.93; A/B Acc 98.6%, BLEU 30.17; BLEU 25.8 (MOS) / 30.2 (A/B) 超越 task-specific models [Table 1, Table 3]", "takeaway": "(1) Token-level distillation via DPO 对齐 audio LLM 与 expert LLM (2) 基于 NISQA human ratings 用 LLM 生成 descriptive training corpus (3) Multi-task joint training (MOS + A/B + description) 互不干扰 (4) Descriptive analysis 反向影响 MOS 数值预测 (类 CoT)", "limitation": "依赖 NISQA 数据集 (97K samples); 评估粒度为 utterance-level 而非 word-level; SWD 任务准确率有限 (~50%); full-ft 需完整微调 encoder + decoder", "concepts": ["TTSEvaluation", "AudioUnderstanding", "Audio-LanguagePretraining", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/ALLD.pdf", "github": "", "demo": ""}, {"name": "BreezyVoice", "title": "BreezyVoice: Adapting T
