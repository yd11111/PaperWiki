r": "deep", "tags": ["TTS", "low-resource", "VITS", "XTTS", "Mundari", "Indian-language", "data-collection", "endangered-language"], "summary": "为极低资源印度语言 Mundari 构建首个专用多说话人 E2E TTS 系统,通过社区参与式数据收集 (27.5h) + VITS-44K 实现 MOS 3.69", "route": "印地语句子 → 人工翻译为 Mundari → 2 位说话人录制 (44.1kHz) → VITS/XTTS v2 训练 → 母语者 MOS 评估", "metrics": "VITS-44K MOS 3.69+-1.18 / MCD 7.60 (最佳); GT-22k MOS 4.62; XTTS-finetuned MOS 0.05 (灾难性遗忘) [Table 2, 3]", "takeaway": "社区参与式低资源语言数据收集流程; 单语言 E2E 模型 vs 多语言模型的系统比较方法论; speaker-weighted sampler 处理说话人不平衡", "limitation": "仅 2 位说话人 (1M/1F, 严重不平衡 74% F); 无对比两阶段模型 (AM+Vocoder); 未开放训练数据; MOS 评价者仅 5 人/样本; 未报 CI 统计显著性检验", "concepts": ["VariationalAutoencoderforTTS", "Text-to-SpeechPipeline", "TTSEvaluation", "MelSpectrogram", "SpeakerEmbedding"], "source": "Sources/MunTTS.pdf", "github": "", "demo": ""}, {"name": "TextToSpeechSynthesis", "title": "Text to Speech Synthesis", "arxiv_id": "2401.13891", "date": "2024-01", "venue": "", "org": "", "tier": "deep", "tags": ["TTS", "survey", "literature-review", "neural-TTS", "speech-synthesis"], "summary": "一篇面向初学者的 TTS 文献综述,概述了从传统到 neural TTS 的基本概念和代表模型", "route": "文本 → 文本分析(G2P/normalization) → 声学模型(mel spectrogram) → 声码器(waveform) [§IV]", "metrics": "无自有实验;仅引述 GRU 情感分类器 86.77% accuracy [§III, Ref 1]", "takeaway": "无可迁移 idea;对 TTS 完全初学者可作为入门导引", "limitation": "无原创贡献;对引用模型的描述停留在功能概述层面,缺乏机制分析;覆盖范围截至 2022 年,缺失 LLM-based TTS、codec language model、flow matching 等 2023+ 主流范式;Results 部分无定量实验", "concepts": ["Text-to-SpeechPipeline", "ProsodyModeling", "Attention-basedTTS", "Diffusion-basedTTS", "DurationPredictor"], "source": "Sources/TextToSpeechSynthesis.pdf", "github": "", "demo": ""}, {"name": "Amphion", "title": "Amphion: An Open-Source Audio, Music, and Speech Generation Toolkit", "arxiv_id": "2312.09911", "date": "2023-12", "venue": "arXiv (ICASSP 2024 companion)", "org": "", "tier": "deep", "tags": ["toolkit", "open-source", "TTS", "text-to-audio", "singing-voice-conversion", "vocoder", "audio-codec", "unified-framework"], "summary": "统一 TTS/TTA/SVC/Vocoder/Codec 五类任务的开源 toolkit,提供标准化训练流程和评估指标,目标是降低音频生成研究的复现门槛", "route": "Text/Audio Input → 统一数据处理层 → 任务框架层 (TTS/TTA/SVC) → 模型架构层 → Vocoder/Codec → Audio Output + Evaluation Suite", "metrics": "Multi-speaker TTS MOS 3.61 (VITS, 与 Coqui/ESPnet 持平) [Table 4]; Zero-shot VALL-E SIM-O 0.51 / WER 0.034 (匹配官方) [Table 5]; TTA FD 20.47 / IS 8.78 (优于官方 AudioLDM) [Table 6]; SVC MOS 3.52 / SMOS 3.69 (优于 SoftVC) [Table 7]", "takeaway": "四层系统架构设计 (共享底层 → 任务层 → 模型层 → Recipe/Demo) 可作为构建多任务音频研究平台的参考范式; 统一评估 pipeline 的组织方式", "limitation": "v0.1 各任务仅集成 1-4 个代表模型,覆盖面有限; 未包含 flow matching 等 2024 主流方法; 论文未报告大规模数据训练实验; 仅为框架介绍论文,技术深度有限", "concepts": ["NeuralVocoder", "DiffusionModel", "Text-to-SpeechPipeline", "TTSEvaluation", "SingingVoiceSynthesis", "VariationalAutoencoderforTTS"], "source": "Sources/Amphion.pdf", "github": "", "demo": ""}, {"name": "Bridge-TTS", "title": "Bridge-TTS: Schrödinger Bridges Beat Diffusion Models on Text-to-Speech Synthesis", "arxiv_id": "2312.03491", "date": "2023-12", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "diffusion", "Schrödinger-bridge", "data-to-data", "mel-generation", "sampling-efficiency", "noise-schedule"], "summary": "用 Schrödinger bridge 将 diffusion TTS 的 data-to-noise 过程替换为 data-to-data 过程,以 text encoder 输出(干净 latent)为先验,同时提升生成质量和采样效率", "route": "Text → Phoneme Encoder + Duration Predictor → text latent z (clean prior) → Schrödinger Bridge (U-Net decoder) → Mel Spectrogram → HiFi-GAN → Waveform", "metrics": "LJ-Speech 50-step MOS 4.09 (VP) / 4.07 (gmax) vs Grad-TTS 3.99; 2-step MOS 4.04 vs CoMoSpeech 3.87; 4-step MOS 4.10 vs FastGrad-TTS 3.87 [Table 2, Table 3]", "takeaway": "(1) 当条件信号(text latent)本身就能提供目标的结构信息时,用 data-to-data bridge 替代 data-to-noise diffusion 可显著减少采样步数; (2) 非对称噪声调度(asymmetric marginal variance)优于对称调度; (3) temperature-scaled SDE 采样(tau_b=2)能有效抑制背景 artifacts", "limitation": "仅在 LJ-Speech 单说话人数据集上验证;未与 flow matching 方法(Matcha-TTS, VoiceFlow)直接对比;无零样本/多说话人实验;vocoder 依赖预训练 HiFi-GAN", "concepts": ["DiffusionModel", "Diffusion-basedTTS", "ScoreMatching", "ConditionalFlowMatching", "MelSpectrogram", "DurationPredictor"], "source": "Sources/Bridge-TTS.pdf", "github": "", "demo": ""}, {"name": "ECSS", "title": "ECSS: Emotion Rendering for Conversational Speech Synthesis with Heterogeneous Graph-Based Context Modeling", "arxiv_id": "2312.11947", "date": "2023-12", "venue": "AAAI 2024", "org": "", "tier": "deep", "tags": ["TTS", "conversational-speech-synthesis", "emotion-graph", "contrastive-learning", "dataset-annotation", "heterogeneous-graph", "emotion-rendering"], "summary": "首个显式建模情感表达的对话语音合成系统,通过异构图 (HGT) 编码 5 种对话信息节点理解情感上下文,用对比学习情感渲染器推断当前句情感风格", "route": "多模态对话历史 (text+audio+speaker+emotion+intensity) → 异构情感对话图 ECG (5 类节点, 14 种边) → HGT 编码 (HMA+HMP+EKA) → 图增强节点特征 → Emotion Renderer (emotion predictor + intensity predictor + prosody predictor) + CL loss → FastSpeech 2 backbone → HiFi-GAN vocoder", "metrics": "N-DMOS 3.506 / E-DMOS 3.619 (vs GRU 3.314/3.288, vs HomoGraph 3.384/3.493) [Table 1, DailyTalk]", "takeaway": "(1) 异构图将对话中 multi-source knowledge 统一建模的框架设计; (2) 对比学习增强情感/强度类别区分的训练策略; (3) DailyTalk 情感标注方案 (7 category + 3 intensity) 可作为后续 emotional CSS 研究的 baseline 标注", "limitation": "仅单数据集 (DailyTalk, 20h, 2 speakers); FastSpeech 2 backbone 限制了音质天花板; 情感分布严重不平衡 (neutral 76.5%); 推理时需 ground-truth 情感标签作为图节点输入", "concepts": ["ProsodyModeling", "EmotionControlinTTS", "GlobalStyleTokens"], "source": "Sources/ECSS.pdf", "github": "", "demo": ""}, {"name": "Mamba", "title": "Mamba: Linear-Time Sequence Modeling with Selective State Spaces", "arxiv_id": "2312.00752", "date": "2023-12", "venue": "arXiv preprint (COLM 2024)", "org": "", "tier": "deep", "tags": ["SSM", "state-space-model", "selective-SSM", "sequence-modeling", "architecture", "linear-complexity", "audio", "language-model"], "summary": "通过让 SSM 参数随输入变化(选择性机制),突破了结构化状态空间模型的 LTI 限制,实现首个在语言建模上匹配 Transformer 的线性复杂度序列模型", "route": "输入 x → 线性投影扩展(E=2) → 1D Conv → 选择性 SSM(输入依赖的 Delta/B/C) → 门控乘法 → 线性投影输出;堆叠 Mamba block 构成完整架构", "metrics": "LM: Mamba-2.8B avg acc 63.3% 超越 Pythia-6.9B 61.7% 和 RWKV-7.4B 62.5% [Table 3]; 音频: SC09 FID 0.94 vs SaShiMi 1.99 (同规模 ~6M), 扩展至 24.3M 后 FID 0.67 vs DiffWave+SaShiMi 1.42 [Table 4]; 推理: 5x throughput vs 同规模 Transformer [Fig 8]", "takeaway": "(1) 选择性机制(输入依赖的 gating/遗忘)可迁移到任何序列建模; (2) hardware-aware 算法设计(SRAM/HBM 分层)是通用优化思路; (3) 将 H3 SSM block 和 MLP 合并为单一 block 的架构简化策略", "limitation": "仅验证到 3B 参数规模; 在连续信号(音频)上选择性机制可能不如 LTI SSM(需用 complex 参数); 下游生态(fine-tuning, RLHF, ICL)未充分验证; 后续 Mamba-2 已显著改进", "concepts": ["SpeechLanguageModel", "LLM-basedTTS", "CodecLanguageModel"], "source": "Sources/Mamba.pdf", "github": "", "demo": ""}, {"name": "NEUTART", "title": "Neural Text to Articulate Talk: Deep Text to Audiovisual Speech Synthesis achieving both Auditory and Photo-realism", "arxiv_id": "2312.06613", "date": "2023-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["talking-face-generation", "audiovisual-synthesis", "text-driven", "3DMM", "FLAME", "FastSpeech2", "GAN", "photo-realistic"], "summary": "首个真正双模态(genuine bimodal)的 text-driven 真实感说话人面部视频合成系统,通过联合 audiovisual 表征避免级联 TTS+lip-sync 的冗余", "route": "Text → Phonemizer → Encoder → Variance Adaptor → [Audio Decoder → Mel → HiFi-GAN → Audio] + [Visual Decoder → FLAME 3DMM params → Neural Face Renderer (GAN) → Video]", "metrics": "FID 28.70 (vs SadTalker 30.71, VideoReTalking 37.32); V-CER 76.74% (vs 81.34-82.20%); 用户偏好 55-72.5% vs 各 baseline [Table 1, 3]; 联合训练使 ASR-CER 从 27.04% 降至 24.85% [Table 2]", "takeaway": "(1) 用 lip-reading loss (AV-HuBERT 特征的 cosine distance) 做视觉监督,可迁移到任何需要嘴唇一致性的生成任务; (2) 联合 audiovisual 训练反过来提升 TTS 音频质量的发现; (3) SPECTRE 3D 面部重建保持唇读一致性", "limitation": "(1) 仅在 TCD-TIMIT 小数据集上验证,泛化性存疑; (2) 神经渲染器对大头部姿态变化敏感; (3) FastSpeech 2 骨架已被 LLM-based TTS 超越; (4) 代码开源但未见大规模跟进", "concepts": ["Non-autoregressiveTTS", "NeuralVocoder", "MelSpectrogram", "DurationPredictor", "Text-to-SpeechPipeline", "ProsodyModeling"], "source": "Sources/NEUTART.pdf", "github": "", "demo": ""}, {"name": "SECap", "title": "SECap: Speech Emotion Captioning with Large Language Model", "arxiv_id": "2312.10381", "date": "2023-12", "venue": "AAAI 2024", "org": "", "tier": "deep", "tags": ["speech-emotion", "captioning", "LLM", "Q-Former", "HuBERT", "contrastive-learning", "mutual-information", "audio-understanding"], "summary": "首次提出 Speech Emotion Captioning 任务,用 HuBERT + Q-Former + LLaMA 架构从语音中生成自然语言情感描述,通过互信息最小化解纠缠内容、对比学习增强情感特征", "route": "Speech → HuBERT (frozen, 语音特征提取) → Q-Former (Bridge-Net, STMIL 解纠缠 + SCCL 情感对齐) → Q-Embedding → LLaMA (frozen, 文本生成) → 自然语言情感描述", "metrics": "SIM1 71.95 / SIM2 70.51 / BLEU1 36.08 / CIDEr 34.81 (vs HTSAT-BART SIM1 59.62 / CIDEr 2.21); MOS 3.77 vs 人类标注 3.85 / 人类标签 3.39 [Table 2, Fig 4]", "takeaway": "(1) vCLUB 互信息上界估计用于最小化不相关特征的相关性 — 可迁移到任何需要特征解纠缠的场景 [§Method, Eq.4]; (2) 分类别采样的对比学习策略 (N 类 x K 样本) 控制正负样本分布 [§Method, Eq.5]; (3) 两阶段训练 (先学表征对齐,再接 LLM) 的 BLIP-2 式 recipe 在低资源音频任务上有效", "limitation": "仅中文; 数据集内部不公开 (仅测试集开放); 41.6h 数据量极小; 仅 7 个说话人; 无跨语言/跨域泛化实验; 评估指标沿用 AAC 的词级匹配,未验证情感感知层面的对齐度", "concepts": ["EmotionControlinTTS", "AudioUnderstanding", "NaturalLanguageDescriptionforTTS", "Audio-LanguagePretraining"], "source": "Sources/SECap.pdf", "github": "", "demo": ""}, {"name": "Seamless", "title": "Seamless", "arxiv_id": "2312.05187", "date": "2023-12", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-translation", "S2ST", "expressive", "streaming", "multilingual", "prosody-preservation", "w2v-BERT", "UnitY2"], "summary": "首个公开的端到端表达性+流式跨语言语音翻译系统，统一 SeamlessM4T v2 + SeamlessExpressive + SeamlessStreaming", "route": "speech/text → w2v-BERT 2.0 encoder → X2T decoder → UnitY2 NAR T2U → HiFi-GAN vocoder", "metrics": "S2TT 101 语言, S2ST 36 语言; Expressive 保留 rhythm/style (5 语言); Streaming 实时多向翻译; BLEU +1.3 avg over SeamlessM4T v1 [§3.5]", "takeaway": "(1) UnitY2 层级上采样架构 (subword→char→unit) 解决 T2U 长度不匹配; (2) EMMA 机制实现低延迟流式翻译; (3) SeamlessAlign 76 语言自动对齐数据", "limitation": "Expressive 仅支持 6 语言; 语音输出质量仍依赖 HiFi-GAN unit vocoder; 流式模式牺牲部分质量", "concepts": ["ProsodyModeling", "Self-SupervisedSpeechRepresentation", "Speech-TextAlignment", "Non-autoregressiveTTS", "SpeechLanguageModel"], "source": "Sources/Seamless.pdf", "github": "", "demo": ""}, {"name": "ZMM-TTS", "title": "ZMM-TTS: Zero-shot Multilingual and Multispeaker Speech Synthesis Conditioned on Self-supervised Discrete Speech Representations", "arxiv_id": "2312.14398", "date": "2023-12", "venue": "IEEE/ACM Transactions on Audio, Speech, and Language Processing", "org": "", "tier": "deep", "tags": ["multilingual-TTS", "zero-shot", "self-supervised-learning", "discrete-speech-representation", "low-resource", "multispeaker", "XLSR-53"], "summary": "用 XLSR-53 的 VQ 离散表征替代 Mel spectrogram 作为中间特征,构建多语言多说话人 TTS 系统,实现对未见说话人和未见语言的零样本/少样本合成", "route": "Text → (characters/IPA/XPhoneBERT) → FastSpeech-based txt2vec → XLSR-53 discrete codes → vec2wav (HiFi-GAN or multi-stage VQ + HiFi-GAN generator) → Waveform", "metrics": "6 语言 seen speaker MOS 最高 4.20 (ZMM-TTS2x, fr) [Table V]; unseen speaker MOS 最高 4.32 (ZMM-TTS2x, fr) [Table VI]; 低资源 Italian 15min few-shot MOS 3.33 [Table VIII]; vs LibriSpeech test-clean SECS 0.644, WER 2.37%, RTF 0.003 [Table IX]", "takeaway": "(1) SSL 离散表征天然 speaker-content 解耦,可用于低资源多语言场景;(2) 去掉 language embedding 即可 zero-shot inference 未见语言;(3) 同时用 cross-entropy (分类) + MSE (回归) loss 预测离散 code,利用 codebook 的连续空间信息", "limitation": "英语 MOS 明显低于其他语言 (~3.0 vs ~4.2);与大规模系统 (VALL-E-X, HierSpeech++) 相比 speaker similarity 差距显著;未评估跨语言合成质量;代码已开源但数据处理流程复杂", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeakerEmbedding", "NeuralVocoder", "SemanticvsAcousticTokens", "Non-autoregressiveTTS", "PhonemeRepresentation", "MelSpectrogram", "DurationPredictor"], "source": "Sources/ZMM-TTS.pdf", "github": "", "demo": ""}, {"name": "Zoology", "title": "Zoology: Measuring and Improving Recall in Efficient Language Models", "arxiv_id": "2312.04927", "date": "2023-12", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["sequence-modeling", "attention", "gated-convolution", "SSM", "associative-recall", "hybrid-architecture", "efficiency", "language-model"], "summary": "系统性证明 gated convolution 架构 (Hyena/RWKV/H3) 在 associative recall 上显著弱于 attention (70M attention > 1.4B Hyena),提出 Multi-Query Associative Recall (MQAR) 形式化框架并证明 gated convolution 的 model dimension 需随序列长度线性增长,而 attention 不需要;最终用 <10% 层的 input-dependent sparse attention hybrid 关闭 85% 的 AR gap (programmatic selection, 360M) [Table 2]", "route": "17 个语言模型预训练 (Pile, 70M-1.4B) → fine-grained perplexity 分析发现 AR gap → 定义 MQAR 合成任务 → 理论分析 BaseConv capacity → 证明 input-dependence 必要性 → sparse attention hybrid 验证", "metrics": "360M BaseConv+3层 programmatic attention hybrid: 整体 PPL 9.54 (vs attention 9.44), AR slice PPL 2.35 (vs attention 1.98), 关闭 85% AR gap; 360M BaseConv+full attention hybrid: PPL 8.59, 比纯 attention 好 0.85 PPL 且 FLOPs 少 18% [Table 2]; 1.4B 规模: 70M attention AR PPL 2.41 vs 1.4B Hyena AR PPL 3.43 [Table 5]", "takeaway": "(1) 用 n-gram 重复率作为 real data 上 AR 能力的 proxy metric,简单有效 [§3.1]; (2) MQAR 合成任务设计:大词表 (8192) + 多查询 + power-law 距离分布,比旧的单查询合成任务更能预测 downstream gap [§3.2, Alg.1]; (3) BaseConv 作为 gated convolution 的 canonical representation,19 行 PyTorch,便于理论和实验分析 [§4.1, Appendix B]; (4) 极少量 input-dependent 层 (<10%) 即可大幅提升 recall,为 speech/audio 中的 SSM-attention 混合比例提供理论依据 [§5]", "limitation": "仅在 Pile 上验证,未涉及 speech/audio domain 的 recall 特性 [§1]; 最大规模止于 1.4B (50B tokens) + 7B (开源模型评估),未覆盖当前 7B+ 训练规模 [§G]; AR heuristic 仅测量显式 bigram 重复,不覆盖 fuzzy/semantic recall [§C.1]; 理论结果依赖 BaseConv 到 Hyena 的 poly-log 等价,实际训练动态未考虑 [Thm 4.2]", "concepts": [], "source": "Sources/Zoology.pdf", "github": "", "demo": ""}, {"name": "w2v-BERT2.0", "title": "w2v-BERT 2.0: Massively Multilingual Speech Encoder in Seamless Communication", "arxiv_id": "2312.05187", "date": "2023-12", "venue": "arXiv (Meta / FAIR)", "org": "", "tier": "deep", "tags": ["self-supervised-learning", "speech-representation", "multilingual", "contrastive-learning", "masked-prediction", "Conformer", "ASR", "speech-translation"], "summary": "w2v-BERT 2.0 是 Meta 在 Seamless Communication 系列中开发的大规模多语言自监督语音编码器,通过在 4.5M 小时、143 种语言数据上预训练 contrastive + masked prediction 联合目标的 Conformer 模型,成为 SeamlessM4T v2 的核心语音编码器", "route": "Waveform → Log-Mel Spectrogram → 2-layer 2D Conv (4x 下采样) → Contrastive Module (Conformer layers, 产生 token IDs) → Masked Prediction Module (Conformer layers, 预测 token IDs)", "metrics": "580M params, 143 languages, 4.5M hours [XEUS Table 1]; ML-SUPERB SUPERB_s 826/916 (10min/1h) [XEUS Table 3]; FLEURS CER 8.7 [XEUS Table 4]; VCTK resynthesis MOS 3.21/WER 15.5 [XEUS Table 6]", "takeaway": "(1) Contrastive + masked prediction 联合训练是端到端 SSL 的有效范式; (2) 大规模多语言预训练提升跨语言迁移; (3) Conformer blocks 在 SSL 中优于纯 Transformer", "limitation": "训练数据完全闭源 (4.5M hours 未公开) [XEUS Table 1]; 训练代码未发布; 仅发布权重; 语言覆盖仅 143 种 (远少于 XEUS 4057 种和 MMS 1406 种)", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeechTokenizer", "SemanticvsAcousticTokens", "CodebookCollapse"], "source": "Sources/w2v-BERT2.0.pdf", "github": "", "demo": ""}, {"name": "ChildTTS-Fastpitch", "title": "Improved Child Text-to-Speech Synthesis through Fastpitch-based Transfer Learning", "arxiv_id": "2311.04313", "date": "2023-11", "venue": "IEEE (conference paper)", "org": "", "tier": "deep", "tags": ["TTS", "child-speech", "transfer-learning", "FastPitch", "multi-speaker", "low-resource"], "summary": "用 FastPitch + transfer learning(LibriTTS 预训练 → MyST 微调）合成多说话人儿童语音,客观评估优于 Tacotron 2 baseline", "route": "文本 → FastPitch(encoder + duration predictor + pitch predictor + decoder) → mel spectrogram → WaveGlow → 波形", "metrics": "MOSNet 3.10 vs 真实儿童 2.91 vs Tacotron2 2.60 [Table II]; WER 17.61 vs 真实 15.27 vs Tacotron2 25.63 [Table III]; 说话人相似度 77% [§IV.C]", "takeaway": "成人→儿童 transfer learning 的简单有效 pipeline;用 MOSNet+WER+speaker similarity 三维客观评估替代主观评估的思路", "limitation": "无主观评估(MOS 仅用 MOSNet 自动评分,MOSNet 在儿童语音上的泛化性存疑); WaveGlow vocoder 已过时; 无与现代 TTS 系统的对比", "concepts": ["Non-autoregressiveTTS", "SpeakerAdaptation", "ProsodyModeling", "DurationPredictor", "F0Modeling", "NeuralVocoder"], "source": "Sources/ChildTTS-Fastpitch.pdf", "github": "", "demo": ""}, {"name": "HierSpeech++", "title": "HierSpeech++: Bridging the Gap between Semantic and Acoustic Representation of Speech by Hierarchical Variational Inference for Zero-shot Speech Synthesis", "arxiv_id": "2311.12454", "date": "2023-11", "venue": "IEEE/ACM TASLP (under review)", "org": "", "tier": "deep", "tags": ["TTS", "voice-conversion", "zero-shot", "hierarchical-VAE", "speech-super-resolution", "non-autoregressive", "BigVGAN"], "summary": "基于层级 VAE + bidirectional Transformer flow 的非自回归零样本 TTS/VC 框架,首次在零样本 TTS 和 VC 任务上达到人类水平质量 [论文原文]", "route": "Text→TTV(semantic+F0)→Hierarchical Speech Synthesizer(层级 VAE+BiT-Flow+HAG)→16kHz 波形→SpeechSR→48kHz 波形 [Fig 1]", "metrics": "TTS nMOS 4.56 (GT 4.32); VC nMOS 4.54; CER 0.90 (TTS), 二者均超 GT; SECS 0.899 (TTS, LT-960); SpeechSR PESQ 4.63 [Table 7, 5, 10]", "takeaway": "(1) Style Prompt Replication (SPR) 技巧用于 1s 短 prompt 克隆; (2) DWT-based sub-band discriminator 提升高频重建; (3) Bidirectional Transformer Flow 解决 train-inference mismatch; (4) 无需文本标注的 hierarchical synthesizer 可利用海量无标注音频数据", "limitation": "(1) 仍合成 noisy prompt 中的噪声; (2) 未做跨语言零样本; (3) SpeechSR 仅限 16→48 kHz; (4) 依赖 MMS 作为 semantic representation", "concepts": ["VariationalAutoencoderforTTS", "SpeechFactorization", "SemanticvsAcousticTokens", "F0Modeling", "NeuralVocoder", "SpeakerEmbedding"], "source": "https://arxiv.org/abs/2311.12454", "github": "", "demo": ""}, {"name": "Qwen-Audio", "title": "Qwen-Audio: Advancing Universal Audio Understanding via Unified Large-Scale Audio-Language Models", "arxiv_id": "2311.07919", "date": "2023-11", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-understanding", "multimodal", "multi-task-pretraining", "hierarchical-tags", "SRWT", "universal-audio", "instruction-tuning"], "summary": "首个覆盖 30+ 任务、多种音频类型 (语音/环境声/音乐/歌曲) 的统一音频-语言模型,通过层级标签框架解决多任务混训干扰,无需任务特定微调即超越同类模型", "route": "Audio (any type) → 16kHz resample → 80-ch mel spectrogram → Whisper-large-v2 encoder (640M, 可训练) → stride-2 pooling (~40ms/frame) → Qwen-7B LLM (7.7B, Stage 1 冻结 / Stage 2 可训练) → text response", "metrics": "Aishell1 test WER 1.3% (SOTA); CochlScene ACC 79.5% (SOTA); ClothoAQA ACC 57.9% (SOTA); VocalSound ACC 92.9% (SOTA); LibriSpeech test-clean WER 2.0%; CoVoST2 七方向平均 BLEU 显著优于 SpeechLLaMA/SALMONN [Table 3]", "takeaway": "(1) 层级标签框架 (transcription/audio-lang/task/text-lang/timestamps/output-instruction) 作为多数据集混训的轻量级干扰缓解方案; (2) SRWT (word-level timestamp) 训练同时提升 ASR 和非语音 QA 性能的发现; (3) 两阶段训练 (Stage 1 冻结 LLM 训编码器, Stage 2 冻结编码器训 LLM) 的模块化对齐策略", "limitation": "论文未开源训练数据配比和混训细节; Chat 模型仅 20k instruction 数据,与后续工作量级差距大; 无生成能力 (仅理解); 无消融实验验证各标签层级的独立贡献", "concepts": ["AudioUnderstanding", "Audio-LanguagePretraining", "ModalityAdaptationforSpeechLLM", "SpeechLanguageModel", "Self-SupervisedSpeechRepresentation"], "source": "Sources/Qwen-Audio.pdf", "github": "", "demo": ""}, {"name": "GATrainingRawPhonetic", "title": "Generative Adversarial Training for Text-to-Speech Synthesis Based on Raw Phonetic Input and Explicit Prosody Modelling", "arxiv_id": "2310.09636", "date": "2023-10", "venue": "Blizzard Challenge 2023 / Interspeech SSW", "org": "", "tier": "deep", "tags": ["TTS", "end-to-end", "GAN", "vocoder", "prosody", "pitch", "duration", "BERT"], "summary": "基于 CamemBERT + 显式韵律 (pitch/duration) + HiFi-GAN 的端到端法语 TTS,跳过 mel spectrogram 直接从 phoneme 生成波形", "route": "文本→Phonemizer (G2P)→Phoneme Embeddings + CamemBERT Word Embeddings→Backbone (Conv+BiLSTM)→三路并行 BiLSTM (Duration/Pitch/HiFi-GAN Conditioning)→Non-uniform Upsampling→HiFi-GAN→Waveform", "metrics": "Blizzard 2023 排名 6/20; NEB MOS 3.6-4.3 (按评估组), AD MOS 3.2-4.2; SUS WER 0.162 [Table 1, Fig 3-10, Fig 11]", "takeaway": "(1) 将 BERT 嵌入与音素级表示对齐的两层 non-uniform upsampling 策略 (word→phoneme→frame); (2) 跳过 mel 中间表示避免两阶段 compounding error 的实践验证; (3) Duration 用 softmax 分类而非回归的设计选择", "limitation": "论文未给出与同期端到端系统 (如 VITS) 的直接对比; 仅在法语上验证; 未详细描述 \"discreet style tokens\" 的具体实现; 训练需 3 周 (RTX 3090)", "concepts": ["NeuralVocoder", "ProsodyModeling", "DurationPredictor", "GlobalStyleTokens", "Text-to-SpeechPipeline", "MelSpectrogram"], "source": "Sources/GATrainingRawPhonetic.pdf", "github": "", "demo": ""}, {"name": "SALMONN", "title": "SALMONN: Towards Generic Hearing Abilities for Large Language Models", "arxiv_id": "2310.13289", "date": "2023-10", "venue": "ICLR 2024", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-understanding", "multimodal", "Q-Former", "LoRA", "instruction-tuning", "dual-encoder", "emergent-abilities"], "summary": "首个同时理解语音+音频事件+音乐的多模态 LLM,通过双编码器 (Whisper+BEATs) + window-level Q-Former + activation tuning 实现通用听觉能力和跨模态涌现能力", "route": "Audio → Whisper encoder + BEATs encoder (冻结) → frame-level concat → Window-level Q-Former (可训练) → augmented audio tokens → Vicuna 13B + LoRA (LLM 冻结,LoRA 可训练) → text response", "metrics": "ASR WER 2.1/4.9/10.0 (LibriSpeech clean/other, GigaSpeech); En2Zh BLEU4 33.1; AAC METEOR 24.0; Story diversity 82.57 (activation tuning 后 FR 从 0% → 100%); SAC accuracy 0.50 (FR 从 4% → 73%) [Table 3]", "takeaway": "(1) LoRA scaling factor discount 发现跨模态涌现能力的诊断工具; (2) 12-sample activation tuning 作为极低成本的 task over-fitting 解法; (3) dual encoder 互补设计思路 (语音专精 + 通用音频语义)", "limitation": "仅支持理解不支持生成; 13B LLM backbone 推理开销大; activation tuning 仅用 12 个样本,泛化性存疑; OSR 受限于 Whisper 本身不支持重叠语音", "concepts": ["SpeechLanguageModel", "ModalityAdaptationforSpeechLLM", "AudioUnderstanding", "Audio-LanguagePretraining", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/SALMONN.pdf", "github": "", "demo": ""}, {"name": "UniAudio", "title": "UniAudio: An Audio Foundation Model Toward Universal Audio Generation", "arxiv_id": "2310.00704", "date": "2023-10", "venue": "Under review, ICLR 2024", "org": "", "tier": "deep", "tags": ["audio-generation", "LLM", "multi-task", "TTS", "voice-conversion", "speech-enhancement", "singing-voice", "text-to-sound"], "summary": "首个支持 11 种音频生成任务的统一 LLM-based 音频基础模型, 通过统一 tokenization + 统一 task formulation + multi-scale transformer 实现跨任务迁移", "route": "Conditions (Phoneme/MIDI/Text/Semantic Token/Audio) → Tokenization → [condition, target] sequence → Multi-Scale Transformer (Global + Local) → Audio Tokens (RVQ) → Neural Codec Decoder → Waveform", "metrics": "TTS SIM 0.708 / WER 2.0 / MOS 3.81 / SMOS 3.56; VC SIM 0.868 / MOS 3.54; Text-to-Sound FAD 3.12 / KL 2.6 [Table 2, 10]", "takeaway": "(1) Multi-scale Transformer 降低 RVQ 长序列复杂度 O(T*n_q)² → O(T²); (2) 统一 [condition, target] 序列格式处理多任务; (3) 多任务联合训练带来互利", "limitation": "n_q 受限于 flattening 长度无法超过 4; 不含 noise removal / speech translation; 1B 参数+165K h 数据在当前标准下较小", "concepts": ["LLM-basedTTS", "SpeechTokenizer", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "SpeechLanguageModel", "CodecLanguageModel"], "source": "Sources/UniAudio.pdf", "github": "", "demo": ""}, {"name": "Vec-TokSpeech", "title": "Vec-Tok Speech: Speech Vectorization and Tokenization for Neural Speech Generation", "arxiv_id": "2310.07246", "date": "2023-10", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["speech-codec", "LLM-TTS", "zero-shot-TTS", "voice-conversion", "S2ST", "semantic-token", "speech-vector", "BPE"], "summary": "提出 Vec-Tok Codec,将语音分为连续向量(WavLM 6 层特征,承载全部声学细节)和离散语义 token(K-means 聚类,承载语言和副语言信息),LM 只建模语义 token,解码时用 inverse K-means + vocoder 恢复高保真语音", "route": "语音 → WavLM → 连续向量(vectorization); 连续向量 → mean-norm → K-means → 语义 token(tokenization); 文本/源语音 → AR LM → BPE 语义 token → inverse K-means(+ speaker 向量 prompt) → 连续向量 → HiFi-GAN → 波形", "metrics": "ZS-TTS Naturalness MOS 3.92 vs VALL-E X 3.72 / Bark 3.68 [Table 3]; Speaker SIM MOS 3.87 vs 3.67/3.73; SCS 0.909 vs 0.852/0.866; ZS-VC SCS 0.927 vs LM-VC 0.892 [Table 1]; 50k 小时训练, 600M 参数", "takeaway": "(1) BPE 压缩 speech token 序列(50→16 Hz)降低 LM exposure bias + 增加 context 覆盖; (2) utterance-level mean normalization 作为轻量 speaker 解耦手段; (3) \"保留连续向量 + 只量化语义\"的 codec 设计思路,避免 RVQ 的信息压缩瓶颈", "limitation": "仅发表在 arXiv preprint,未正式发表; 推理需 CLVP rescoring(256 候选序列,计算成本高); 未报告实时因子 RTF; 代码已开源但社区关注度有限; 与后续 CosyVoice/NaturalSpeech 3 等方案相比缺乏 diffusion/flow 基声学建模", "concepts": ["SemanticvsAcousticTokens", "SpeechFactorization", "SpeechLanguageModel", "ResidualVectorQuantization", "LLM-basedTTS", "SpeechTokenizer", "NeuralVocoder"], "source": "Sources/Vec-TokSpeech.pdf", "github": "", "demo": ""}, {"name": "BiSinger", "title": "BiSinger: Bilingual Singing Voice Synthesis", "arxiv_id": "2309.14089", "date": "2023-09", "venue": "IEEE Conference 2023", "org": "", "tier": "deep", "tags": ["SVS", "bilingual", "code-switch", "singing-voice-synthesis", "multilingual", "DiffSinger", "language-independent-representation", "dataset-adaptation"], "summary": "基于 DiffSinger 的中英双语 SVS 系统,通过 CMU 音素统一表示 + SVC 数据增强 + 语音 pitch shift 伪歌声,在单模型中实现双语和 code-switch 歌声合成", "route": "乐谱 + 歌词 → CMU 音素转换 + Language/Style Token → Language-Style-Infused Encoder (DiffSinger + ESM) → Mel Spectrogram → HiFi-GAN → 波形", "metrics": "System 5 (全数据) ALL MOS 3.24 [Table 7]; System 3 (SVC 增强) EN MOS 3.40, MIX MOS 3.32 [Table 7]; GT MOS 3.73 [Table 7]; 英文 WER 从 System 2 ~80% 降至 System 3/5 ~20% [Fig 3]", "takeaway": "(1) CMU 音素 + MFA 比例分配时长的标注适配方案可迁移到其他双语 SVS; (2) SVC 做跨语言数据增强的思路可用于任何低资源歌声场景; (3) 语音 pitch shift 伪歌声思路可用于利用丰富的语音数据辅助 SVS 训练", "limitation": "(1) GT 本身是 SVC 转换的,非真人歌声,MOS 上限受限 (GT ALL MOS 3.73); (2) 英文音素替代效果差 (某些音素如 /TH/, /V/, /DH/ 中文无对应); (3) 仅支持中英双语; (4) 未开源模型", "concepts": ["SingingVoiceSynthesis", "PhonemeRepresentation", "MusicalScoreEncoder", "SVSEvaluationMetrics", "DiffusionModel"], "source": "Sources/BiSinger.pdf", "github": "", "demo": ""}, {"name": "EmotionAwareProsodic", "title": "Emotion-Aware Prosodic Phrasing for Expressive Text-to-Speech", "arxiv_id": "2309.11724", "date": "2023-09", "venue": "ICASSP 2024", "org": "", "tier": "deep", "tags": ["TTS", "prosody", "emotion", "phrase-break", "expressive-TTS", "BERT", "RoBERTa", "BiLSTM"], "summary": "提出 EmoPP,在 phrase break prediction 中引入 RoBERTa 情感预测器,使韵律分句感知情感上下文,提升情感 TTS 表现力", "route": "文本 → BERT (语言特征) + RoBERTa (情感预测) → concat → BiLSTM decoder → phrase break sequence → 输入 emotional TTS", "metrics": "F1 78.43 (vs BERT+BiLSTM 77.48, BiLSTM 73.90) [Table 2]; EMOS 4.09 vs 3.84 [Table 3] (IEMOCAP)", "takeaway": "情感信息对韵律前端 (phrase break) 有显著影响的实证; 用 RoBERTa 做文本情感预测 + 联合训练的简洁范式", "limitation": "仅 5 类离散情感; 实验规模小 (100 test samples); 未在现代 LLM-TTS 上验证; phrase break 定义简单 (30ms silence 阈值); TTS 后端用 DailyTalk 而非 IEMOCAP 训练", "concepts": ["ProsodyModeling", "EmotionControlinTTS"], "source": "Sources/EmotionAwareProsodic.pdf", "github": "", "demo": ""}, {"name": "JointDialogueSpeech", "title": "Towards Joint Modeling of Dialogue Response and Speech Synthesis based on Large Language Model", "arxiv_id": "2309.11000", "date": "2023-09", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "LLM", "prosody", "front-end", "dialogue", "spoken-dialogue", "Chinese-TTS", "prosodic-structure-prediction"], "summary": "用 LLM 同时生成对话回复和 TTS 语言学特征(韵律边界/拼音/时长/音高),模仿人类语音产出中语法编码与音韵编码的并行机制", "route": "用户输入 → LLM (ChatGPT prompting 或 ChatGLM2-6B fine-tuning) → 对话回复 + JSON 格式的 character/pinyin/prosody/duration/pitch 特征 → (后接 acoustic model + vocoder,本文未实现)", "metrics": "PSP Average F-Score: ChatGPT 80.12%, ChatGLM2-6B fine-tuned 82.38% vs SpanPSP (BERT, 0.1B) 79.80% [Table 1]; 联合建模 89.70% parsable, 77.70% matched prosody [Table 3]", "takeaway": "(1) 将多种 TTS 前端特征统一编码为 JSON 字符串,用 Seq2Seq 范式让 LLM 一次性生成 — 简单有效的多任务编码技巧; (2) 用 ChatGPT 生成对话上下文来扩充单句语音数据集", "limitation": "仅做到语言学特征预测,未接声学模型/vocoder 验证端到端效果; 数据集仅 8k 单人朗读句,严重过拟合; JSON 自回归解码极慢 (15-40s/句); 2023 年 9 月后 LLM-TTS 直接跳过前端,本文路线未被后续采纳", "concepts": ["ProsodyModeling", "Text-to-SpeechPipeline", "PhonemeRepresentation", "LLM-basedTTS", "Speech-LLMIntegrationTaxonomy"], "source": "Sources/JointDialogueSpeech.pdf", "github": "", "demo": ""}, {"name": "LowResourceSSL-TTS", "title": "Low-Resource Self-Supervised Learning with SSL-Enhanced TTS", "arxiv_id": "2309.17020", "date": "2023-09", "venue": "ICASSP 2024", "org": "", "tier": "deep", "tags": ["self-supervised-learning", "low-resource", "TTS", "data-augmentation", "HuBERT", "discrete-units", "speech-representation"], "summary": "用 100h 真实语音预训练的 HuBERT 构建 unit-based TTS,合成大量数据反哺 SSL 预训练,将语音数据需求降低 90%", "route": "100h real speech → HuBERT pre-train → k-means units → T2U + U2S TTS → synthetic corpus → HuBERT re-train", "metrics": "WER-best 15.8% on LibriSpeech dev-other (100h real + 11k synth, 2nd iter) vs 14.4% topline (960h real) [Table 5]", "takeaway": "用 SSL discrete units 降低 TTS 训练难度(10h paired data 就能训练 T2U);合成数据中 oversampling 真实数据(100x)显著提升效果", "limitation": "仅在 LibriSpeech (英语阅读语音) 上验证;合成语音语速偏快需后处理拉伸;未评估合成语音质量(MOS)", "concepts": ["Self-SupervisedSpeechRepresentation", "SemanticvsAcousticTokens", "SpeakerEmbedding", "DurationPredictor", "Text-to-SpeechPipeline"], "source": "Sources/LowResourceSSL-TTS.pdf", "github": "", "demo": ""}, {"name": "RepCodec", "title": "RepCodec: A Speech Representation Codec for Speech Tokenization", "arxiv_id": "2309.00169", "date": "2023-09", "venue": "arXiv (ByteDance)", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "semantic-token", "vector-quantization", "representation-codec", "speech-LM"], "summary": "用参数化 codec (encoder+VQ+decoder) 替代 k-means 聚类来离散化 SSL 语音表征, 在相同比特率 (0.5kbps) 下显著降低下游 ASR 的 WER [论文原文]", "route": "Speech Waveform → Speech Encoder (HuBERT/data2vec/Whisper, frozen) → Speech Representation @50Hz → RepCodec Encoder (Conv1D blocks) → VQ/RVQ (K=1024) → RepCodec Decoder (Conv1D blocks) → Reconstructed Speech Representation → Downstream (ASR / Speech Resynthesis / Voice Conversion) [§3.1, Fig 1]", "metrics": "Decoder-only ASR WER: RepCodec 4.11 vs k-means 6.14 vs VQ 5.17 (HuBERT large, LibriSpeech test-clean) [Table 1]; Speech resynthesis WER: RepCodec 4.71 vs k-means 7.61 (HuBERT large, LJSpeech) [Table 3]; MOS: 3.48 vs 2.82 [Table 4]", "takeaway": "用轻量级 encoder-decoder + VQ 做\"表征压缩\"而非\"信号重建\" — 一种比 k-means 更优的 SSL 表征离散化范式; PNMI_n 扩展评估指标 (n-gram 级别的 token-phoneme 互信息)", "limitation": "仅在英语上全面验证, 多语言 (法/西) 实验规模有限; 训练依赖预训练 speech encoder (非端到端); 0.5kbps 语义 token 仍有信息损失 (与连续表征有 gap)", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "ResidualVectorQuantization", "Self-SupervisedSpeechRepresentation", "CodebookCollapse"], "source": "Sources/RepCodec.pdf", "github": "", "demo": ""}, {"name": "VoiceFlow", "title": "VoiceFlow: Efficient Text-to-Speech with Rectified Flow Matching", "arxiv_id": "2309.05027", "date": "2023-09", "venue": "ICASSP 2024", "org": "", "tier": "deep", "tags": ["TTS", "flow-matching", "rectified-flow", "acoustic-model", "efficiency", "NAR", "mel-generation"], "summary": "首次将 rectified flow matching 引入 TTS 声学模型,在保持合成质量的同时大幅提升采样效率,2 步即可生成可接受语音", "route": "Phones → Text Encoder → Duration Predictor → Expanded Latent y → Vector Field Estimator (U-Net, conditioned on y+t) → Euler ODE Solve → Mel Spectrogram → HiFi-GAN → Waveform", "metrics": "2 步 MOS 3.92 vs GradTTS 2.98 (LJSpeech) [Table 1]; 10 步 MOS 4.10 vs 3.97; 100 步 MOS 4.17 vs 4.03; ReFlow CMOS +0.78 (LJ) / +1.21 (LibriTTS) vs 无 ReFlow [Table 2]", "takeaway": "(1) Rectified flow 的两阶段训练策略(先训 flow matching,再用生成样本 rewire 轨迹)可直接迁移至任何 ODE-based 生成模型; (2) 用 ground-truth duration 而非 predicted duration 生成 rectification 训练数据,减少 duration error 对 reflow 质量的影响", "limitation": "仅在 LJSpeech (24h) 和 LibriTTS (585h) 上验证,未测试大规模数据; 仅用 Euler solver,未探索高阶 ODE solver 与 reflow 的组合; 无 zero-shot speaker adaptation 实验; 代码已开源", "concepts": ["ConditionalFlowMatching", "Diffusion-basedTTS", "DiffusionModel", "ScoreMatching", "Non-autoregressiveTTS", "DurationPredictor", "MelSpectrogram", "NeuralVocoder"], "source": "Sources/VoiceFlow.pdf", "github": "", "demo": ""}, {"name": "Zipfs-law-speech-symbols", "title": "Do Learned Speech Symbols Follow Zipf's Law?", "arxiv_id": "2309.09690", "date": "2023-09", "venue": "Interspeech 2024", "org": "", "tier": "deep", "tags": ["speech-tokenizer", "Zipf-law", "discrete-token", "speech-representation", "GSLM", "HuBERT", "k-means", "statistical-analysis"], "summary": "首次验证 GSLM 离散 speech symbols (HuBERT k-means tokens) 的 n-gram 分布遵循 power law (非严格 Zipf's law),且该分析可识别非标准语音 (非母语) 的偏差", "route": "语音波形 → HuBERT + k-means (200 clusters, 20ms) → speech symbols → 去重 → 计算 n-gram rank-frequency 分布 → 与 Zipf's law (f_r = a * r^{-η}) 拟合 + native/non-native 对比", "metrics": "word-level η ≈ 0.95 (日) / 0.94 (英), 接近 Zipf's law (η=1); speech symbol n-gram η < 1 (power law but not Zipf); 语言无关 (日英分布几乎一致)", "takeaway": "(1) speech token n-gram 的 Zipf 分析框架可用于 tokenizer 质量评估; (2) n 值选择: n=6 (日) / n=2 (英) 对应一个字符, n=9 对应一个词; (3) 无文本分析方法可扩展到动物叫声/音乐等非语音音频", "limitation": "仅 200 clusters 的 k-means; 仅朗读语音; 非母语偏差的因果解释不明; 未分析不同 SSL 模型/层级的差异", "concepts": ["SpeechTokenizer", "SemanticvsAcousticTokens", "Self-SupervisedSpeechRepresentation", "SpeechLanguageModel"], "source": "Sources/2309.09690.pdf", "github": "", "demo": ""}, {"name": "TextrolSpeech", "title": "TextrolSpeech: A Text Style Control Speech Corpus with Codec Language Text-to-Speech Models", "arxiv_id": "2308.14430", "date": "2023-08", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["dataset", "controllable-TTS", "text-style-prompt", "codec-LM", "emotion", "style-control", "RVQ", "autoregressive"], "summary": "发布首个大规模开源文本风格控制语音数据集 TextrolSpeech (330h, 236K style descriptions, 5 style factors),并提出 codec LM 模型 Salle 用文本描述直接引导 acoustic token 生成 [§Abstract]", "route": "Text + Style Prompt → Phoneme Conversion → [Style Token Embeddings, Text Token Embeddings] → AR Codec LM (theta_SAR, 生成第 1 层 RVQ) → NAR Codec LM (theta_SNAR, 生成第 2-8 层 RVQ) → Audio Codec Decoder → Waveform [§3, Fig 2]", "metrics": "Style factor accuracy: Gender 95.5%, Pitch 90.5%, Speech 85%, Volume 86%, Emotion 81% (avg 87.6% vs PromptTTS 82.3%) [Table 2]; MOS-Q 3.78±0.09 / MOS-S 3.88±0.10 (vs PromptTTS 3.76/3.74) [Table 3]", "takeaway": "(1) Multi-stage prompt programming: 用 GPT-3.5-Turbo 通过 Base→Diversity→Constraint→Few-shot 四阶段生成 500 种自然文本描述/style group [§2.3]; (2) 数据集构建方法论: LibriTTS + VCTK + emotion datasets (ESD/TESS/MEAD/SAVEE/MESS) → acoustic feature extraction + text-speech alignment → 自动标注 5 factors [§2.2]", "limitation": "(1) MOS-Q 3.78 (满分 5),音质仍有明显差距; (2) Emotion accuracy 最低 (81%),论文归因于数据有限和情感分类固有困难 [§4.2.1]; (3) 模型架构较简单 (6 层 Transformer),未采用更强的 LLM backbone; (4) 数据集仅英文; (5) 未开源模型权重", "concepts": ["NaturalLanguageDescriptionforTTS", "CodecLanguageModel", "EmotionControlinTTS", "StyleTransferinTTS", "ResidualVectorQuantization", "LLM-basedTTS"], "source": "Sources/TextrolSpeech.pdf", "github": "", "demo": ""}, {"name": "DiffProsody", "title": "DiffProsody: Diffusion-based Latent Prosody Generation for Expressive Speech Synthesis with Prosody Conditional Adversarial Training", "arxiv_id": "2307.16549", "date": "2023-07", "venue": "arXiv (IEEE TASLP submission)", "org": "", "tier": "deep", "tags": ["TTS", "prosody", "diffusion", "VQ", "GAN", "adversarial-training", "expressive-speech", "DDGAN"], "summary": "用 DDGAN 加速的扩散模型生成韵律隐向量 + prosody conditional discriminator 强化韵律反映,实现比 AR predictor 更快更好的表现力语音合成", "route": "Text → (Phoneme+Word Encoder) → htxt; Mel[0:20] → Prosody Encoder → VQ → zpros; htxt+hspk+zpros → Decoder → Mel → HiFi-GAN; 推理时 DLPG(htxt, hspk) → h'pros → VQ → zpros", "metrics": "MOS 4.03 (vs ProsoSpeech 3.97, FS2 3.84) [Table I]; RTF 0.054 (vs AR 0.149, DDPM 0.871) [Table III]; 韵律生成速度 16x faster than DDPM [§I]", "takeaway": "(1) low-band mel (20 bins) 作为 prosody encoder 输入实现韵律解耦; (2) DDGAN 4 steps 即达 DDPM 100 steps 水平; (3) PCD 用 zpros 作条件判别语音韵律质量", "limitation": "单层 VQ 可能损失韵律精度(作者建议 RVQ); 仅在 VCTK 上评估; 无情感/风格可控实验; 代码开源但影响力有限", "concepts": ["ProsodyModeling", "DiffusionModel", "Diffusion-basedTTS", "Non-autoregressiveTTS", "GlobalStyleTokens", "DurationPredictor"], "source": "Sources/DiffProsody.pdf", "github": "", "demo": ""}, {"name": "METTS", "title": "METTS: Multilingual Emotional Text-to-Speech by Cross-speaker and Cross-lingual Emotion Transfer", "arxiv_id": "2307.15951", "date": "2023-07", "venue": "arXiv (TASLP format)", "org": "", "tier": "deep", "tags": ["TTS", "emotional-TTS", "cross-lingual", "multilingual", "emotion-transfer", "disentanglement", "GST", "CVAE"], "summary": "提出多尺度情感建模(coarse-grained GST + fine-grained CVAE)+ formant-shift 信息扰动 + VQ emotion matcher,实现单语说话人的跨语言跨说话人情感语音合成", "route": "Text → DelightfulTTS Conformer Encoder → Variance Adaptor (+Speaker Embedding) → Mel Decoder; 情感条件来自 (a) Reference mel → Formant Perturb → GST (coarse) + CVAE (fine) 或 (b) Text+EmotionID → VQ Emotion Matcher → coarse embedding + Fine-grained Predictor", "metrics": "MOS 4.11 (intra-lingual, CN speakers) / 4.00 (cross-lingual); Speaker SIM 3.94/3.94; Emotion SIM 4.12/3.44; Cosine SIM 0.813 (intra) / 0.753 (cross); CER 0.48% / WER 5.60% (cross-lingual); 全面优于 CET 和 M3 [Table II-V]", "takeaway": "(1) L2 normalization 消除跨语言 magnitude 差异,使 GST 编码 language-agnostic 情感; (2) Formant shift 作为 pre-processing 步骤去除 speaker timbre,比 GRL 更稳定; (3) VQ 将回归问题转化为分类问题,简化 text→emotion embedding 的映射", "limitation": "仅双语(中英),仅女性说话人,数据规模极小(~41h),backbone 过时(DelightfulTTS/MelGAN),英语训练数据无情感标注导致跨语言英语情感表达偏弱,未开源", "concepts": ["EmotionControlinTTS", "GlobalStyleTokens", "SpeechFactorization", "VariationalAutoencoderforTTS", "StyleTransferinTTS"], "source": "Sources/METTS.pdf", "github": "", "demo": ""}, {"name": "Mega-TTS2", "title": "Mega-TTS 2: Boosting Prompting Mechanisms for Zero-Shot Speech Synthesis", "arxiv_id": "2307.07218", "date": "2023-07", "venue": "ICLR 2024 (Zhejiang University & ByteDance)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "speech-factorization", "prosody-LLM", "multi-sentence-prompting", "prosody-transfer", "timbre-disentanglement", "VQ"], "summary": "通过 prosody/timbre 解耦 + 多句 prompting + prosody LLM,在零样本 TTS 中以 10s-300s 多句 prompt 超越微调基线 / Disentangles prosody from timbre via compressive autoencoder, then uses multi-sentence prompting with P-LLM to surpass fine-tuning baselines at 10s-300s of reference data", "route": "Speech y → Compressive Acoustic AE (Content Enc E_c + VQ Prosody Enc E_p + Multi-Ref Timbre Enc E_t) → Decoder D → y_hat; Inference: multi-sentence refs → E_t for timbre z_t, E_p for prosody codes → P-LLM autoregressively predicts prosody → Decoder generates mel [§3, Fig 1]", "metrics": "WER 2.23% / SIM 0.932 / SMOS 4.01 with 300s prompt [Table 1]; 超越 fine-tuning baseline (300s) in SMOS (4.01 vs 4.03) and SIM (0.932 vs 0.934) [Table 1]; prosody transfer: DE 32.8, sigma 72.62, gamma 0.664, kappa 0.197 vs CopyCat/Daft-Exprt [Table 2]", "takeaway": "(1) 信息论分解框架 I(y_t; y_bar) = H(z_t) + H(g) — 理论驱动的 timbre/prosody 解耦 [§3.1, Eq 1]; (2) P-LLM 只建模 prosody codes(非全语音 token),codebook 小因此长 prompt 可行; (3) Prosody interpolation — 两个 P-LLM 输出概率加权混合实现风格迁移 [§3.4, Eq 3]", "limitation": "仅支持英语 [Appendix E.1]; 依赖外部 aligner (MFA) 获取 duration/pitch [§3.1]; VQ codebook 的信息瓶颈设计需仔细调参(r, d 参数搜索空间大) [Appendix F]; 未开源", "concepts": ["SpeechFactorization", "ProsodyModeling", "SpeakerEmbedding", "LLM-basedTTS", "SpeechTokenizer", "CodebookCollapse"], "source": "Sources/Mega-TTS2.pdf", "github": "", "demo": ""}, {"name": "ShanghainTTS", "title": "Improving TTS for Shanghainese: Addressing Tone Sandhi via Word Segmentation", "arxiv_id": "2307.16199", "date": "2023-07", "venue": "", "org": "", "tier": "deep", "tags": ["TTS", "low-resource", "tone-sandhi", "prosody", "word-segmentation", "minority-language", "VITS", "Shanghainese"], "summary": "通过词分割标注上海话左主导变调 (LD) 域的边界,改善 VITS 模型的声调连读变调质量", "route": "文本 → jieba 分词(Mandarin 字典 + 上海话补丁) → 上海话词典音标化(IPA) → VITS 训练 → 语音", "metrics": "MOS 4.14 (本文) vs 4.19 (Apple VoiceOver) vs 4.83 (人类), 无显著差异 (p=0.64) [§4.2]; 句子 5 本文 4.53 显著优于 VoiceOver 3.08 (p<<0.001) [§4.2, Table 1, 3]", "takeaway": "用分词结果作为韵律域标注的代理,避免了训练专用韵律标注模型的数据需求;对其他声调语言 (粤语/闽南语等) 的低资源 TTS 有参考价值", "limitation": "数据集仅 2012 条/~93 分钟/单说话人; 依赖普通话预训练的 jieba 分词器,非原生上海话分词; 音节时长问题 (glottal stop coda 处理不当导致过长停顿); 仅 10 名有效评估者", "concepts": ["ProsodyModeling", "PhonemeRepresentation"], "source": "Sources/ShanghainTTS.pdf", "github": "", "demo": ""}, {"name": "AudioCraft", "title": "Simple and Controllable Music Generation (MusicGen / AudioCraft)", "arxiv_id": "2306.05284", "date": "2023-06", "venue": "NeurIPS 2023", "org": "", "tier": "deep", "tags": ["music-generation", "codec-LM", "autoregressive", "codebook-interleaving", "text-to-music", "melody-conditioning", "RVQ", "EnCodec"], "summary": "单阶段 autoregressive transformer LM + codebook interleaving patterns,在 EnCodec tokens 上实现 text/melody 条件音乐生成,无需级联多模型", "route": "Text (T5 encoder) / Melody (quantized chromagram) → Transformer decoder (causal self-attn + cross-attn) → Codebook pattern 排列的 RVQ tokens → EnCodec decoder → 32kHz 音频", "metrics": "OVL 84.8 / REL 82.5 (3.3B, MusicCaps) vs MusicLM OVL 80.5 / REL 82.4; FAD_vgg 3.8 vs MusicLM 4.0 [Table 1]", "takeaway": "(1) Codebook interleaving patterns 的数学框架可直接迁移到 speech codec LM; (2) Delay pattern 以 1/4 flattening 的计算量达到接近的质量; (3) Stereo 扩展无需额外计算成本", "limitation": "无精细控制 (依赖 CFG); Melody conditioning 对低频乐器敏感需先做 source separation (Demucs); 数据偏向 Dance/EDM 流派; 仅生成 30 秒片段", "concepts": ["CodecLanguageModel", "ResidualVectorQuantization", "Classifier-FreeGuidance", "SemanticvsAcousticTokens", "AudioTokenizerTaxonomy"], "source": "Sources/AudioCraft.pdf", "github": "", "demo": ""}, {"name": "AudioPaLM", "title": "AudioPaLM: A Large Language Model That Can Speak and Listen", "arxiv_id": "2306.12925", "date": "2023-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["speech-LM", "multimodal", "speech-translation", "ASR", "S2ST", "voice-transfer", "zero-shot", "decoder-only"], "summary": "将 text-only LLM (PaLM-2) 的词表扩展为 text+audio 联合词表,通过 fine-tuning 实现单一 decoder-only 模型在 ASR/AST/S2ST/TTS 多任务上的统一建模,SOTA speech translation + 零样本跨语言翻译 + 跨语言声音保持", "route": "音频 → w2v-BERT/USM semantic tokens (25Hz, 1024 vocab) → 扩展 PaLM-2 embedding matrix (text tokens + audio tokens) → decoder-only Transformer → text 或 audio tokens → SoundStorm/AudioLM 解码为波形", "metrics": "CoVoST2 AST BLEU 37.8 (AudioPaLM-2, vs Whisper 29.1) [Table 2]; CVSS S2ST ASR-BLEU 32.5 (vs Translatotron 2 25.6) [Table 2]; FLEURS 零样本 AST BLEU 20.7 (无 AST 训练数据的语言, vs Whisper 19.6 有监督) [Table 3]; 主观 MOS 4.44 / SMOS 4.00 (vs Translatotron 2 3.96 / 3.51) [Table 4]", "takeaway": "(1) 词表扩展法: 仅扩展 embedding matrix 即可将 text LLM 转为 multimodal LLM,架构零修改; (2) combined tasks (chain-of-thought 式多步解码) 显著提升复杂任务性能; (3) 文本 LLM 的翻译能力可直接迁移到语音翻译 (零样本跨语言)", "limitation": "未开源; 全参数 fine-tuning 必要(冻结权重不行); tokenizer 质量是瓶颈 (USM-v2 >> w2v-BERT); 加入 S2ST 任务会轻微降低 ASR/AST 性能; 8B 参数部署成本高", "concepts": ["SpeechLanguageModel", "SpeechTokenizer", "LLM-basedTTS", "AudioUnderstanding", "SemanticvsAcousticTokens", "Audio-LanguagePretraining"], "source": "Sources/AudioPaLM.pdf", "github": "", "demo": ""}, {"name": "DAC", "title": "High-Fidelity Audio Compression with Improved RVQGAN", "arxiv_id": "2306.06546", "date": "2023-06", "venue": "NeurIPS 2023", "org": "", "tier": "repro", "tags": ["audio-codec", "neural-compression", "VQ-GAN", "RVQ", "universal-codec"], "summary": "系统性改进 RVQ-GAN 各组件 (Snake 激活、factorized codes、sub-band discriminator),在 8 kbps / ~91x 压缩下全面超越 EnCodec 24 kbps", "route": "Audio (44.1kHz) → Conv Encoder (4 blocks, stride [2,4,8,8]=512, dim 1024, 22M) → RVQ (9 层, 1024 entries, factorized 8d lookup, 86Hz) → Conv Decoder (4 blocks, stride [8,8,4,2], dim 1536, Snake, 54M) → Reconstructed Audio | Discriminators: MPD [2,3,5,7,11] + Multi-band STFT [2048,1024,512]", "metrics": "ViSQOL 4.18 / SI-SDR 10.75 @8kbps vs EnCodec ViSQOL 3.16 / SI-SDR 9.59 @24kbps (混合测试集); codebook bitrate efficiency 99%; 76M 参数", "takeaway": "Factorized codes (低维 8d 投影做 VQ lookup) 解决 codebook collapse; Snake 激活引入周期 inductive bias 零成本提升音质; 概率式 quantizer dropout (p=0.5) 兼顾可变比特率与全带宽质量", "limitation": "无语义/声学分层 (不适合直接做 TTS semantic token); 无 streaming/causal 模式; 代码和权重已开源 (github.com/descriptinc/descript-audio-codec)", "concepts": ["ResidualVectorQuantization", "CodebookCollapse", "SnakeActivation", "QuantizerDropout", "Multi-scaleSTFTDiscriminator"], "source": "Sources/DAC.pdf", "github": "", "demo": ""}, {"name": "HowGSLMEncodesNoisySpeech", "title": "How Generative Spoken Language Modeling Encodes Noisy Speech: Investigation from Phonetics to Syntactics", "arxiv_id": "2306.00697", "date": "2023-06", "venue": "Interspeech 2023", "org": "", "tier": "deep", "tags": ["speech-language-model", "GSLM", "HuBERT", "noise-robustness", "speech-resynthesis", "self-supervised-learning", "discrete-speech-token", "phoneme-analysis"], "summary": "系统分析 GSLM 在噪声环境下从 phone 到 syntax 各层级的编码退化,揭示 GSLM 会把噪声语音重合成为自然但内容篡改的语音", "route": "噪声语音 → HuBERT encoder (speech2unit, k-means 200 classes) → 离散 unit 序列 → Tacotron2 decoder (unit2speech) → 重合成语音; 在 unit/phoneme/word/syntax/speech 五层评估", "metrics": "UER 13.4-54.1% (15-0 dB); PER 14.8-61.9%; WER 14.5-75.8% (resyn); UTMOS ~3.8 (自然度高但内容错); WARP-Q 在含语音噪声时改善", "takeaway": "(1) 多层级评估框架 (UER/PER/WER/WCER/WARP-Q/UTMOS) 可复用于任何 speech tokenizer 鲁棒性分析; (2) unit-phoneme mapping 方法可用于分析其他 SSL tokenizer 的语音学特性; (3) \"natural but content-altered\" 现象提示 semantic token 系统需要专门的内容保持机制", "limitation": "仅测试 HuBERT-base + 200 codebook 一种配置; 未对比 WavLM 等噪声鲁棒 SSL 模型; 无降噪前处理对比; 分析偏描述性,缺乏机制解释", "concepts": ["SpeechLanguageModel", "Self-SupervisedSpeechRepresentation", "SpeechTokenizer", "SemanticvsAcousticTokens", "PhonemeRepresentation"], "source": "Sources/HowGSLMEncodesNoisySpeech.pdf", "github": "", "demo": ""}, {"name": "Mega-TTS", "title": "Mega-TTS: Zero-Shot Text-to-Speech at Scale with Intrinsic Inductive Bias", "arxiv_id": "2306.03509", "date": "2023-06", "venue": "arXiv (Zhejiang University & ByteDance)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "speech-factorization", "prosody-LLM", "VQGAN", "inductive-bias", "timbre-disentanglement", "speech-editing"], "summary": "将语音分解为 content/timbre/prosody/phase 四个属性,为每个属性设计匹配其固有特性的建模方式,实现鲁棒的零样本 TTS / Decomposes speech into content/timbre/prosody/phase and models each with architecture matching its intrinsic inductive bias", "route": "文本 → Content Encoder (phoneme, FFT) + Timbre Encoder (global vector from reference mel) + P-LLM (AR prosody code prediction) → VQGAN Mel Decoder → HiFi-GAN → 波形", "metrics": "MOS-Q 4.27/4.08, MOS-P 4.32/4.21, MOS-S 4.27/3.90 (VCTK/LibriSpeech, 超越 YourTTS) [Table 2]; CMOS-Q +0.23, CMOS-P +0.27 vs VALL-E [Table 3]; 鲁棒性 0% error rate vs VALL-E 28% [Table 6]; 跨语言 WER 3.04% vs YourTTS 7.59% [Table 5]", "takeaway": "(1) 四维分解: 按属性固有性质选择建模方式的设计原则; (2) P-LLM: 仅用 LM 建模韵律而非全部语音; (3) Speech editing 的 max-likelihood 拼接策略", "limitation": "222.5M 参数偏小; 仅 20K 小时训练; 背景噪声/混响下 VQGAN 重建质量下降; 未开源 (demo page only)", "concepts": ["SpeechFactorization", "ProsodyModeling", "SpeakerEmbedding", "LLM-basedTTS", "SpeechTokenizer"], "source": "Sources/Mega-TTS.pdf", "github": "", "demo": ""}, {"name": "UnitSpeech", "title": "UnitSpeech: Speaker-adaptive Speech Synthesis with Untranscribed Data", "arxiv_id": "2306.16083", "date": "2023-06", "venue": "Interspeech 2023 (arXiv: 2306.16083)", "org": "", "tier": "deep", "tags": ["speaker-adaptation", "diffusion-model", "self-supervised-unit", "voice-conversion", "HuBERT", "fine-tuning", "untranscribed-data", "classifier-free-guidance"], "summary": "用 HuBERT 离散单元替代文本转写,实现基于 diffusion 的 speaker adaptation,单条无转写音频即可微调,同时支持 TTS 和 VC", "route": "语音→HuBERT→K-means 离散化→unit encoder→diffusion decoder (DDPM)→mel→HiFi-GAN→波形; 适应时冻结 unit encoder,仅微调 decoder", "metrics": "TTS: MOS 4.13, CER 1.75%, SECS 0.935 (LibriTTS); VC: MOS 4.26, CER 3.55%, SECS 0.923 (LibriTTS) [Table 1, Table 2]", "takeaway": "(1) 用 self-supervised discrete units 作为通用内容表示,绕开转写依赖; (2) 数据集 mel 均值作为 CFG 的 unconditional embedding,免去额外训练; (3) 冻结 encoder + 仅微调 decoder 的分离式适应策略", "limitation": "CER 1.75% 高于 text-conditioned Grad-TTS 的 0.75% [Table 1]; 每个目标说话人需单独微调 500 步; 未开源预训练权重(仅开源代码)", "concepts": ["SpeakerAdaptation", "DiffusionModel", "Classifier-FreeGuidance", "Self-SupervisedSpeechRepresentation", "SpeechFactorization", "VoiceCloningTaxonomy"], "source": "Sources/UnitSpeech.pdf", "github": "", "demo": ""}, {"name": "Voicebox", "title": "Voicebox: Text-Guided Multilingual Universal Speech Generation at Scale", "arxiv_id": "2306.15687", "date": "2023-06", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "flow-matching", "non-autoregressive", "speech-infilling", "cross-lingual", "multilingual", "in-context-learning"], "summary": "首个大规模非自回归 flow matching 语音生成模型,通过 text-guided speech infilling 统一 zero-shot TTS / 去噪 / 编辑 / 多样化采样等多种任务", "route": "(文本, 音频上下文) → phonemize + forced alignment → duration model (预测帧长) → audio model (OT-CFM Transformer, 80-dim log mel) → HiFi-GAN vocoder → waveform", "metrics": "Zero-shot TTS WER 1.9% vs VALL-E 5.9%, SIM-o 0.662 vs 0.580 [Table 2]; 推理速度 20x vs VALL-E (NFE=2); 跨语言 TTS 平均 WER 5.2% vs YourTTS 10.9% [Table 3]", "takeaway": "speech infilling 作为 universal task formulation; masked CFM loss 聚焦预测区域; duration model 解耦文本-音频建模; CFG 扩展到 flow matching", "limitation": "依赖 phonemizer + forced aligner (MFA); 仅训练于有声读物 (read speech); 不支持属性解耦控制; 未开源模型", "concepts": ["ConditionalFlowMatching", "Classifier-FreeGuidance", "Non-autoregressiveTTS", "DurationPredictor", "MelSpectrogram"], "source": "Sources/Voicebox.pdf", "github": "", "demo": ""}, {"name": "ADAPTERMIX", "title": "ADAPTERMIX: Exploring the Efficacy of Mixture of Adapters for Low-Resource TTS Adaptation", "arxiv_id": "2305.18028", "date": "2023-05", "venue": "Interspeech 2023", "org": "", "tier": "deep", "tags": ["TTS", "speaker-adaptation", "parameter-efficient", "adapter", "mixture-of-experts", "low-resource", "few-shot"], "summary": "将 Mixture of Experts 中的 expert choice routing 引入 TTS decoder adapter,实现跨说话人共享的参数高效 speaker adaptation (仅 11.62% 参数)", "route": "Text → Transformer TTS Encoder → Duration/Pitch Predictor → Decoder (每层含 N 个并行 residual adapter + routing) → Mel Spectrogram → Vocoder [Fig 1a]", "metrics": "1min 数据 MOS 3.33 vs Fine-tune 3.45 vs Adapter 2.82; XAB speaker similarity 偏好 43.63% (10min); Cosine Sim 0.7324 (10min) 接近 Fine-tune 0.7362 [Table 1, Fig 3]", "takeaway": "expert choice routing 让每个 adapter 自主选择 top-k token 处理,实现 token 级别的细粒度分工;adapter 跨说话人共享的设计比 per-speaker adapter 更可扩展", "limitation": "仅在 LibriTTS → VCTK 英语场景验证; backbone 3.6M 参数偏小; 与 CLN-based 方法 (AdaSpeech) 未直接对比; 无 ablation 解释各 adapter 学到了什么; 已开源但 2023 年后无后续", "concepts": ["SpeakerAdaptation", "SpeakerEmbedding", "Non-autoregressiveTTS", "TTSEvaluation"], "source": "Sources/ADAPTERMIX.pdf", "github": "", "demo": ""}, {"name": "ChatGPT-EDSS", "title": "ChatGPT-EDSS: Empathetic Dialogue Speech Synthesis Trained from ChatGPT-derived Context Word Embeddings", "arxiv_id": "2305.13724", "date": "2023-05", "venue": "Interspeech 2023", "org": "", "tier": "deep", "tags": ["TTS", "dialogue", "empathy", "emotion", "ChatGPT", "prompt-engineering", "context-embedding", "style-control"], "summary": "用 ChatGPT 从对话历史中提取 intention/emotion/style 三个上下文词,其 BERT 嵌入替代人工情感标注或数据驱动 CCE 来条件化 EDSS 模型,效果持平", "route": "对话历史 → ChatGPT prompt → 三词 (intention, emotion, style) → BERT embedding → sum → Linear → FastSpeech 2 条件化 → mel → HiFi-GAN → waveform", "metrics": "Naturalness MOS 3.52 (IES only) vs 3.43 (Emo only) vs 3.54 (CCE only); Similarity MOS 3.19-3.24 无显著差异 [Table 3]", "takeaway": "用 LLM 的阅读理解能力自动标注对话上下文,替代昂贵的人工情感标注; prompt 设计中包含 dialogue situation description 可改善结果相关性", "limitation": "仅在日语小数据集 (STUDIES) 上验证; ChatGPT 回答多样性大 (79% 的 intention 词出现 ≤ 5 次); reliability score 与 MOS 提升无相关性; 未验证在非共情对话场景的泛化", "concepts": ["EmotionControlinTTS", "GlobalStyleTokens", "NaturalLanguageDescriptionforTTS", "ProsodyModeling", "StyleTransferinTTS"], "source": "Sources/ChatGPT-EDSS.pdf", "github": "", "demo": ""}, {"name": "Make-A-Voice", "title": "Make-A-Voice: Unified Voice Synthesis With Discrete Representation", "arxiv_id": "2305.19269", "date": "2023-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "voice-conversion", "SVS", "zero-shot", "discrete-token", "unified-framework", "autoregressive", "coarse-to-fine"], "summary": "基于离散表示的统一语音合成框架,通过 coarse-to-fine 三阶段 (semantic→acoustic→waveform) 统一处理 TTS、VC 和 SVS 三个任务 [论文原文]", "route": "Text/Speech→S1(Text-to-Semantic/HuBERT)→Semantic Tokens→S2(Semantic-to-Acoustic Transformer, conditioned on speaker+F0 prompt)→Acoustic Tokens (3 levels)→S3(Unit-based Vocoder)→Waveform [Fig 1]", "metrics": "TTS MOS 4.04, SMOS 3.81, CER 0.068, Cos 0.77 (vs YourTTS MOS 3.89, SMOS 3.72); VC MOS 4.07, Cos 0.80 (vs PPG-VC MOS 3.97, Cos 0.78); SVS MOS 3.99, FFE 0.05 (vs Diffsinger MOS 3.98, FFE 0.08) [Table 2-4]", "takeaway": "(1) 三阶段统一框架设计,同一 backbone 处理 TTS/VC/SVS; (2) Unit-based vocoder 替代 codec decoder 避免 codebook mismatch; (3) Quantized F0 prompt 条件化 acoustic stage", "limitation": "(1) 推理需三阶段串联,无端到端; (2) HuBERT mono-lingual 限制跨语言; (3) 无代码开源; (4) 评估规模较小 (50 sentences)", "concepts": ["SemanticvsAcousticTokens", "ResidualVectorQuantization", "NeuralVocoder", "LLM-basedTTS", "F0Modeling", "SingingVoiceSynthesis"], "source": "Sources/Make-A-Voice.pdf", "github": "", "demo": ""}, {"name": "MultilingualTurkicTTS", "title": "Multilingual Text-to-Speech Synthesis for Turkic Languages Using Transliteration", "arxiv_id": "2305.15749", "date": "2023-05", "venue": "Interspeech 2023 (arXiv:2305.15749)", "org": "", "tier": "deep", "tags": ["TTS", "multilingual", "zero-shot", "Turkic-languages", "IPA", "transliteration", "low-resource", "cross-lingual"], "summary": "仅用哈萨克语数据训练 Tacotron 2,通过 IPA 转写实现 10 种突厥语的零样本多语言 TTS", "route": "目标语言文本 → IPA 转换器 → 哈萨克字母 → Tacotron 2 (单语训练) → 80-dim log-mel → WaveGAN vocoder → 波形", "metrics": "全语言平均 MOS 3.25/5.0, 可理解度 92%, 可辨度 41%; 目标语言最佳 MOS: 吉尔吉斯语 3.54 [Table 3]; 548 名评估者", "takeaway": "同语系语言间 IPA 作为\"万能桥梁\"的思路 -- 手动构建 42 个 IPA 符号的映射表,选择字母最多的语言(哈萨克语 42 个字母)作为源语言以最大化音素覆盖", "limitation": "仅限突厥语系内迁移; 未使用任何目标语言数据(包括无标注数据); MOS 最低仅 2.37(土库曼语); 可辨度整体偏低(41%); Tacotron 2 架构已过时; 未与现代多语言 TTS 对比", "concepts": ["PhonemeRepresentation", "Attention-basedTTS", "NeuralVocoder", "MelSpectrogram", "TTSEvaluation"], "source": "Sources/MultilingualTurkicTTS.pdf", "github": "", "demo": ""}, {"name": "SoundStorm", "title": "SoundStorm: Efficient Parallel Audio Generation", "arxiv_id": "2305.09636", "date": "2023-05", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["audio-generation", "non-autoregressive", "masked-generative", "parallel-decoding", "RVQ", "acoustic-model", "dialogue-synthesis", "TTS"], "summary": "将 MaskGIT 的迭代并行解码推广到 RVQ 结构,按 RVQ 层 coarse-to-fine 逐级生成 SoundStream acoustic tokens,比 AudioLM 快 100 倍且质量更好", "route": "Semantic tokens (conditioning, from AudioLM/SPEAR-TTS) → Conformer (bidirectional self-attention, sum frame embeddings) → Q separate heads → RVQ level-wise iterative parallel decoding → SoundStream tokens → SoundStream decoder → Waveform", "metrics": "LibriSpeech test-clean (prompted) WER 2.99% / Audio quality 4.05 / Voice preservation 0.57 / Acoustic consistency 0.91; RTF 0.017 vs AudioLM ~1.7 [Table 1, Fig 3]", "takeaway": "(1) Frame-level embedding sum 将 Q 层 RVQ tokens 压缩到与 frame 数等长的序列; (2) Coarse-to-fine RVQ-level decoding + level-wise confidence-based masking; (3) 最后一步用 greedy 替代 confidence-based 提升质量; (4) Acoustic consistency metric (contrastive model 测时间漂移)", "limitation": "(1) 不做 text→semantic (需外部模型如 SPEAR-TTS); (2) Conformer 350M 参数,对长序列仍有二次复杂度; (3) 需 time-aligned conditioning signal; (4) 仅在 LibriSpeech + 对话数据上验证", "concepts": ["MaskedGenerativeModeling", "ResidualVectorQuantization", "SemanticvsAcousticTokens", "SpeechTokenizer", "Non-autoregressiveTTS"], "source": "Sources/SoundStorm.pdf", "github": "", "demo": ""}, {"name": "StochasticPitchPrediction", "title": "Stochastic Pitch Prediction Improves the Diversity and Naturalness of Speech in Glow-TTS", "arxiv_id": "2305.17724", "date": "2023-05", "venue": "Interspeech 2023", "org": "", "tier": "deep", "tags": ["TTS", "pitch-prediction", "normalizing-flow", "multi-speaker", "zero-shot", "prosody", "diversity", "Glow-TTS"], "summary": "在 Glow-TTS 中引入 flow-based stochastic pitch predictor,显式学习 F0 分布,配合 stochastic duration predictor 显著提升 zero-shot 多说话人语音的多样性和自然度", "route": "文本 → Transformer encoder → MAS 对齐 → Stochastic Duration Predictor(采样 duration）→ 扩展 embedding → Stochastic Pitch Predictor（采样 log-F0）→ Pitch-conditioned Decoder（normalizing flow）→ Mel-spectrogram → HiFi-GAN vocoder → 音频", "metrics": "N-MOS 3.45(vs baseline 3.13）[Table 1]; D-MOS 显著优于 baseline 和 STD-only [Fig 2]; log-F0 分布更接近真实语音 [Fig 3]; 模型仅增加 1.5M 参数（56.0M vs 54.5M）", "takeaway": "将 VITS 的 stochastic duration predictor 架构直接迁移到 pitch 维度的方法论 — 任何可以用确定性预测器建模的韵律维度,都可以尝试用 flow-based 概率预测器替代以增加多样性", "limitation": "仅在 Glow-TTS 上验证,未在 VITS/端到端系统上测试; 与 VCTK copy-synthesis 上界仍有较大差距（N-MOS 3.45 vs 4.21）; 未测试 energy 维度; 评估规模较小（26 评估者,6 unseen speakers）", "concepts": ["DurationPredictor", "ProsodyModeling", "ConditionalFlowMatching", "GlobalStyleTokens"], "source": "Sources/StochasticPitchPrediction.pdf", "github": "", "demo": ""}, {"name": "TortoiseTTS", "title": "Tortoise TTS", "arxiv_id": "2305.07243", "date": "2023-05", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "autoregressive", "diffusion", "DDPM", "voice-cloning", "scaling", "VQVAE"], "summary": "将图像生成领域的 AR Transformer + DDPM 范式迁移到 TTS,通过大规模数据训练和 CLVP re-ranking 实现高质量多说话人语音合成", "route": "Text + Reference Audio → VQVAE tokens → AR Transformer(GPT-2) → CLVP re-ranking → DDPM(mel spectrogram) → UnivNet Vocoder → Waveform", "metrics": "非标准化评估(使用自建 CLVP-based 评估套件 + wav2vec intelligibility); 定性优于同期开源 TTS", "takeaway": "(1) AR+DDPM 两阶段解耦设计 (2) CLVP re-ranking 策略 (3) \"TorToise Trick\" — 在 AR latent space 微调 DDPM (4) 大规模 web-scraped 数据集构建流程", "limitation": "推理慢(64步 DDIM + AR); 无标准化 benchmark; 22kHz 采样率; 缺乏与 VALL-E 等的直接对比; 独立研究者资源有限", "concepts": ["DiffusionModel", "Classifier-FreeGuidance", "LLM-basedTTS", "MelSpectrogram", "NeuralVocoder", "SpeechTokenizer", "VoiceCloningTaxonomy"], "source": "Sources/TortoiseTTS.pdf", "github": "", "demo": ""}, {"name": "XPhoneBERT", "title": "XPhoneBERT: A Pre-trained Multilingual Model for Phoneme Representations for Text-to-Speech", "arxiv_id": "2305.19709", "date": "2023-05", "venue": "INTERSPEECH 2023", "org": "", "tier": "deep", "tags": ["TTS", "phoneme", "pre-training", "multilingual", "BERT", "G2P", "representation-learning"], "summary": "首个多语言 phoneme BERT (330M 句, 94 语言),用 RoBERTa 方法预训练,替换 VITS encoder 后显著提升自然度,尤其在低资源场景", "route": "Raw Text → CharsiuG2P (G2P) → segments (phoneme segmentation) → White-space tokenized phoneme sequence → XPhoneBERT (BERT-base, MLM) → Contextual phoneme embeddings → VITS decoder → Waveform", "metrics": "EN MOS 4.00→4.14 (+0.14, LJSpeech), VN MOS 3.74→3.89 (+0.15, Vietnamese 自建 18h) [Table 2, 3]; 低资源 VN MOS 1.59→3.35 (+1.76, Vietnamese 5%) [Table 3]", "takeaway": "(1) 预训练 phoneme encoder 可直接 drop-in 替换 TTS 的 text encoder; (2) 冻结预训练模型 25% 训练步后 unfreeze 的 fine-tuning 策略; (3) 低资源语言 TTS 中,phoneme 预训练的杠杆效应远大于高资源语言", "limitation": "仅在 VITS 上评估,未验证其他 TTS 架构; 实验仅覆盖英语和越南语两种语言; 未与 PnG BERT 等同类模型对比 (对方未开源); G2P 依赖 CharsiuG2P 的转换质量", "concepts": ["PhonemeRepresentation"], "source": "Sources/XPhoneBERT.pdf", "github": "", "demo": ""}, {"name": "ZET-Speech", "title": "ZET-Speech: Zero-shot adaptive Emotion-controllable Text-to-Speech Synthesis with Diffusion and Style-based Models", "arxiv_id": "2305.13831", "date": "2023-05", "venue": "Interspeech 2023", "org": "", "tier": "deep", "tags": ["TTS", "emotion-control", "zero-shot", "diffusion", "domain-adversarial-training", "classifier-free-guidance", "style-transfer"], "summary": "通过 domain adversarial training 解耦 style vector 中的情感信息 + diffusion guidance 增强情感表达,实现仅凭中性参考语音和情感标签即可合成任意说话人情感语音", "route": "中性参考语音 → Mel-Style Encoder (DAT 解耦) → emotion-free style vector + emotion label → Transformer Encoder → mu → Diffusion (+ CG/CFG guidance) → 情感 mel → HiFi-GAN → 语音", "metrics": "ECA 51.59% (seen, CG) vs baseline 16.35% [Table 1]; ECA 39.86% (unseen, CG) vs baseline 18.29% [Table 2]; MOS 3.44 (seen, CFG) vs 2.60 (baseline) [Table 4]", "takeaway": "(1) DAT 解耦 style vector 中的特定属性是一个简洁有效的 trick,可推广到其他需要解耦的场景; (2) classifier-free guidance 在 TTS diffusion 中同时增强条件控制的方法; (3) 将 mu (noise prior) 也用 null embedding 生成 mu_null 的 CFG 设计细节", "limitation": "(1) 基于 mel spectrogram + HiFi-GAN 的两阶段架构; (2) guidance 增强情感表达以牺牲语音质量为代价 (CER/SECS 下降) [§3.3]; (3) 仅支持离散情感标签,不支持连续情感控制; (4) 未开源; (5) 实验规模较小 (9 seen + 10 unseen speakers)", "concepts": ["EmotionControlinTTS", "Classifier-FreeGuidance", "GradientReversalLayer", "Diffusion-basedTTS", "GlobalStyleTokens"], "source": "Sources/ZET-Speech.pdf", "github": "", "demo": ""}, {"name": "NaturalSpeech2", "title": "NaturalSpeech 2: Latent Diffusion Models are Natural and Zero-Shot Speech and Singing Synthesizers", "arxiv_id": "2304.09116", "date": "2023-04", "venue": "arXiv (Microsoft Research Asia & Microsoft Azure Speech)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "diffusion", "latent-diffusion", "speech-prompting", "in-context-learning", "singing-synthesis", "voice-conversion"], "summary": "用连续 latent vectors + latent diffusion 替代离散 tokens + AR LM,配合 speech prompting 实现强零样本 TTS 和歌声合成 / Replaces discrete tokens + AR LM with continuous latent vectors + latent diffusion plus speech prompting for strong zero-shot TTS and singing synthesis", "route": "Text → Phoneme Encoder → Duration/Pitch Predictor → Condition c → Diffusion Model (with speech prompt z^p) → Latent z → Codec Decoder → Waveform [§3, Fig 1]", "metrics": "CMOS 0.00 (= ground truth) on LibriSpeech/VCTK [Table 3]; SMOS 3.28/3.20 vs YourTTS 2.03/2.43 [Table 5]; WER 2.26% vs YourTTS 7.10% on LibriSpeech [Table 6]; 0% error rate on 50 hard sentences [Table 7]; outperforms VALL-E by +0.3 SMOS and +0.31 CMOS [Table 8]", "takeaway": "(1) RVQ 残差求和作为连续 latent 表示 — 兼顾信息密度和序列长度; (2) Speech prompting 的双路设计 — duration/pitch predictor 用 Q-K-V attention 直接 attend prompt,diffusion model 用 query attention + FiLM 间接 attend 避免信息泄露; (3) Source-aware diffusion 实现零样本 voice conversion", "limitation": "模型仍在 underfitting (300K steps) [§4.3]; 推理需 150 步 ODE (慢); 未开源; 44K 小时训练数据规模中等", "concepts": ["ResidualVectorQuantization", "DiffusionModel", "Diffusion-basedTTS", "DurationPredictor", "SpeechTokenizer", "Non-autoregressiveTTS", "ProsodyModeling", "SpeakerEmbedding"], "source": "https://arxiv.org/abs/2304.09116", "github": "", "demo": ""}, {"name": "USM", "title": "Google USM: Scaling Automatic Speech Recognition Beyond 100 Languages", "arxiv_id": "2303.01037", "date": "2023-03", "venue": "arXiv", "org": "", "tier": "deep", "tags": ["ASR", "multilingual", "self-supervised-learning", "speech-representation", "pre-training", "conformer", "BEST-RQ", "text-injection"], "summary": "提出 Universal Speech Model (USM), 通过三阶段训练 (BEST-RQ 无监督预训练 → MOST 多模态监督预训练 → 任务微调) 在 2B Conformer 上实现 100+ 语言的 SOTA ASR/AST,用 1/7 标注数据匹敌 Whisper", "route": "12M h 无标注语音 → BEST-RQ (masked prediction + random-projection quantization, 16-codebook multi-softmax) → MOST (BEST-RQ + text-injection + ASR loss + modality matching) → CTC/LAS/RNN-T transducer 微调 [Fig 1]", "metrics": "YouTube 73 语言 <30% WER; FLEURS 102 语言 WER 17.4 (6.5 CER), 相对 Whisper 66% WER 改进 [Table 3]; CoVoST 2 BLEU 30.7 (SOTA) [Table 3]; SpeechStew WER 7.0 [Table 3]; frozen encoder + 2% adapter 仅微弱性能损失 [Table 3]", "takeaway": "(1) BEST-RQ 随机投影量化 -- 去掉复杂可学习量化模块,用随机冻结矩阵实现同等或更好的 SSL,在大规模时训练稳定性远优于 w2v-BERT; (2) MOST 多目标预训练 -- 同时优化 BEST-RQ + text-injection + ASR loss, 使 speech/text 表征共享同一空间; (3) chunk-wise attention -- 解决深层网络 long-form 性能退化的简单有效方案; (4) 2% adapter 冻结 encoder -- 可扩展到 100+ 语言/任务", "limitation": "12M h YouTube 预训练数据未公开,无法复现 [§3]; 标注数据基于 YouTube 用户上传字幕,质量参差; 仅评估 ASR/AST, 未探索 TTS/理解等任务; 架构相对保守 (Conformer+CTC/LAS/RNN-T), 非端到端 SpeechLM", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeechLanguageModel", "AudioUnderstanding"], "source": "Sources/USM.pdf", "github": "", "demo": ""}, {"name": "VALL-E-X", "title": "Speak Foreign Languages with Your Own Voice: Cross-Lingual Neural Codec Language Modeling", "arxiv_id": "2303.03926", "date": "2023-03", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "cross-lingual", "zero-shot", "codec-LM", "in-context-learning", "speech-to-speech-translation", "multilingual", "AR-NAR"], "summary": "将 VALL-E 的 codec LM 范式扩展到跨语言场景,用 70K 小时中英双语数据训练多语言 AR+NAR codec LM,实现零样本跨语言 TTS 和语音到语音翻译,同时通过 Language ID 控制外语口音", "route": "Source Speech → EnCodec Encoder → Source Acoustic Tokens; Source/Target Text → Multilingual G2P → Phoneme Sequences; [Source Phonemes, Target Phonemes, Source Tokens] → Multilingual AR Codec LM → 1st layer Target Tokens → Multilingual NAR Codec LM → Full Target Tokens → EnCodec Decoder → Target Waveform", "metrics": "Cross-lingual EN TTS: ASV 0.36 / WER 4.07 vs YourTTS ASV 0.30 / WER 8.53 [Table 2]; SMOS 4.00 vs 3.42, CMOS +0.24 [Table 3]; S2ST: SMOS 4.12 vs 3.06 (baseline), BLEU 30.66 vs 27.49 [Table 4,5]", "takeaway": "(1) Language ID embedding 加到 acoustic token embedding 上即可有效控制目标语言口音(简单但效果显著); (2) 跨语言推理时将 source phonemes + target phonemes + source acoustic tokens 三段拼接作为 AR prefix/prompt 的设计; (3) 无需同一说话人的双语平行数据,用独立的单语 ASR 语料即可训练跨语言能力", "limitation": "仅支持中英双语; 继承 VALL-E 的 AR 鲁棒性问题; Speaker similarity 与 ground truth 仍有明显 gap (ASV 0.37-0.48 vs tgt-src 0.58); 未开源; 评估数据集(EMIME, LibriSpeech)规模较小", "concepts": ["ResidualVectorQuantization", "CodecLanguageModel", "PhonemeRepresentation", "LLM-basedTTS", "SpeakerVerification"], "source": "Sources/VALL-E-X.pdf", "github": "", "demo": ""}, {"name": "PITS", "title": "PITS: Variational Pitch Inference without Fundamental Frequency for End-to-End Pitch-controllable TTS", "arxiv_id": "2302.12391", "date": "2023-02", "venue": "Preprint (maum.ai / KAIST / SNU)", "org": "", "tier": "deep", "tags": ["TTS", "pitch-control", "end-to-end", "VITS", "VAE", "adversarial-training", "Yingram", "prosody"], "summary": "在 VITS 上添加 Yingram encoder + adversarial pitch-shifted training,实现无需 F0 提取器的端到端 pitch 可控 TTS", "route": "Phoneme → Text Encoder + MAS → Prior; Linear Spec → STFT Encoder (zspec) + Yingram → Yingram Encoder (zyin) → scope crop → concat → HiFi-GAN Decoder → Waveform; 推理时 scope-shift 控制 pitch", "metrics": "MOS 4.01+-0.04 (vs VITS 3.89, GT 4.04), CER 3.27% (vs VITS 4.35%), EER 0.926% (vs VITS 1.08%), VCTK [Table 1]", "takeaway": "Yingram 作为 F0 替代的 pitch 表示; scope-shift 机制实现推理时无需重训练的连续 pitch 控制; adversarial pitch-shifted training 确保 shifted speech 质量", "limitation": "Q-VAE 解耦路线失败(CER 42-50%); 仅验证 VCTK 多说话人场景; pitch-shift 影响说话人身份(EER 随 shift 增大); 无大规模数据/语言泛化验证", "concepts": ["F0Modeling", "VariationalAutoencoderforTTS", "ProsodyModeling", "SpeechFactorization", "DurationPredictor"], "source": "Sources/PITS.pdf", "github": "", "demo": ""}, {"name": "SPEAR-TTS", "title": "Speak, Read and Prompt: High-Fidelity Text-to-Speech with Minimal Supervision", "arxiv_id": "2302.03540", "date": "2023-02", "venue": "arXiv (Google Research)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "low-resource", "semantic-token", "acoustic-token", "backtranslation", "pretraining", "in-context-learning"], "summary": "将 TTS 分解为 reading (text→semantic) 和 speaking (semantic→acoustic) 两阶段,仅需 15 分钟平行数据即可训练接近真人的多说话人 TTS / Decomposes TTS into reading (text→semantic) + speaking (semantic→acoustic), achieving near-human quality with only 15 min of parallel data", "route": "文本 → S1 (encoder-decoder Transformer, 预训练+回译+微调) → semantic tokens → S2 (decoder-only Transformer, 音频 prompt 控制说话人) → acoustic tokens → SoundStream decoder → 波形", "metrics": "CER 1.92% (15min parallel, LibriSpeech test-clean) [Table 1(d)]; MOS 4.96 (接近 GT 4.92) [Table 5]; Speaker accuracy 92.4% (3s prompt) [Table 3]; Speaker sim 0.56 (接近 VALL-E 0.58, 用 240000x 少数据) [Table 4]", "takeaway": "(1) 回译 (backtranslation) 利用无标注音频扩展平行数据; (2) semantic tokens 作为枢轴语言解耦 reading 和 speaking; (3) example prompting 控制说话人身份而无需 speaker label", "limitation": "推理需三阶段串行; 仅英语实验; 16 kHz 基础采样率 (bandwidth extension 为可选附加); 未开源", "concepts": ["SemanticvsAcousticTokens", "LLM-basedTTS", "SpeechLanguageModel", "SpeechTokenizer", "ResidualVectorQuantization"], "source": "Sources/SPEAR-TTS.pdf", "github": "", "demo": ""}, {"name": "InstructTTS", "title": "InstructTTS: Modelling Expressive TTS in Discrete Latent Space with Natural Language Style Prompt", "arxiv_id": "2301.13662", "date": "2023-01", "venue": "arXiv (v2: Jun 2023)", "org": "", "tier": "deep", "tags": ["expressive-TTS", "natural-language-prompt", "discrete-diffusion", "VQ-VAE", "cross-modal", "metric-learning", "mutual-information", "style-control"], "summary": "首次将离散 diffusion model 用于 TTS 声学建模,结合三阶段训练的 cross-modal style prompt embedding 和互信息最小化,实现自由格式自然语言风格控制 [§I]", "route": "Content Prompt → Phoneme Encoder → Variance Adaptor; Style Prompt → RoBERTa (3-stage trained) → Style Encoder; Speaker ID → Speaker Embedding; 三路融合 → SALN Adaptor → Discrete Diffusion Decoder (Mel-VQ-Diffusion 或 Wave-VQ-Diffusion) → VQ Tokens → Vocoder/Codec Decoder → Waveform [Fig 1]", "metrics": "Mel-VQ-Diffusion MOS 4.35 / RMOS 4.22; Wave-VQ-Diffusion (GRVQ) MOS 3.95 / RMOS 4.32; Baseline MOS 4.04 / RMOS 3.85 [Table II]; AXY preference 0.72 (Mel) / 0.84 (Wave) vs baseline [Table III]", "takeaway": "(1) 离散 diffusion + VQ 中间表征: 将 mel 预测转化为离散 token 分类问题,避免连续空间的时频相关性建模困难; (2) Cross-modal metric learning 三阶段训练获取鲁棒 style embedding; (3) MI 最小化解耦 style-speaker 和 style-content,避免 audio encoder 泄漏非 style 信息; (4) 改进的 mask-and-uniform 策略,按 RVQ 层信息量递减原则差异化 masking", "limitation": "(1) 仅在 44h 内部中文数据集 NLSpeech 上验证,无公开数据集实验; (2) 推理速度受限 (100 diffusion steps); (3) Wave-VQ-Diffusion 语音质量 MOS 3.95 低于 Mel 方案 4.35; (4) 未与同期 PromptTTS 直接对比; (5) 代码和数据均未公开", "concepts": ["NaturalLanguageDescriptionforTTS", "Diffusion-basedTTS", "Classifier-FreeGuidance", "StyleTransferinTTS", "GlobalStyleTokens", "ResidualVectorQuantization"], "source": "Sources/InstructTTS.pdf", "github": "", "demo": ""}, {"name": "LearningToSpeakFromText", "title": "Learning to Speak from Text: Zero-Shot Multilingual Text-to-Speech with Unsupervised Text Pretraining", "arxiv_id": "2301.12596", "date": "2023-01", "venue": "IJCAI 2023", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "multilingual", "cross-lingual", "pretraining", "masked-language-model", "low-resource"], "summary": "用多语言纯文本做 MLM 预训练 + 冻结 language-aware embedding,实现只需文本 (无语音) 的零样本多语言 TTS", "route": "多语言文本 → MLM 预训练 (token embed + language embed + bottleneck + encoder) → 少量配对数据微调 (冻结 language-aware embedding,训练 encoder + decoder) → 推理时输入未见语言文本 + language ID → mel → HiFi-GAN", "metrics": "未见语言 (西班牙语) CER 18.27% (bytes) / 11.69% (IPA) [Table 3],已见语言 byte 模型全面超 IPA baseline [Table 2];MOS 3.44 (bytes zero-shot) vs 3.29 (baseline) [Fig 5]", "takeaway": "(1) 冻结 language-aware embedding 的跨语言迁移策略; (2) 纯文本 MLM 预训练提升 byte-based TTS 的思路; (3) bottleneck layer 对跨语言泛化的重要性", "limitation": "仅在 7+1 欧洲语言上验证,语种跨度有限; 模型规模小 (6 层 Transformer); 与 oracle 仍有明显 gap; 语言依赖性强 (相似语种效果好,差异大的语种改善有限)", "concepts": ["PhonemeRepresentation", "SpeakerEmbedding", "Attention-basedTTS", "MelSpectrogram", "Text-to-SpeechPipeline", "Self-SupervisedSpeechRepresentation"], "source": "Sources/LearningToSpeakFromText.pdf", "github": "", "demo": ""}, {"name": "VALL-E", "title": "Neural Codec Language Models are Zero-Shot Text to Speech Synthesizers", "arxiv_id": "2301.02111", "date": "2023-01", "venue": "arXiv preprint", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "codec-LM", "in-context-learning", "large-scale-training", "AR-NAR"], "summary": "首个将 TTS 重构为 neural codec 条件语言建模任务,60K 小时训练使模型涌现 in-context learning 能力,3 秒 prompt 即可零样本克隆", "route": "Text → G2P → Phoneme + 3s Acoustic Prompt(EnCodec codes） → AR model（生成 1st quantizer codes） → NAR model（生成 2-8th quantizer codes） → EnCodec Decoder → Waveform", "metrics": "WER 5.9% / SPK 0.580 (LibriSpeech) vs YourTTS WER 7.7 / SPK 0.337 [Table 2]; SMOS 4.38 vs YourTTS 3.45 [Table 3]; CMOS +0.04 vs GroundTruth on VCTK [Table 7]", "takeaway": "将 TTS 重构为 LM task 的范式转换思路; AR(coarse) + NAR(fine) 的层级生成匹配 RVQ 结构; 60K h 半监督数据 scaling; 3s prompt 作为 in-context example", "limitation": "鲁棒性问题(词漏/重复/错序); 仅英文; 需两个独立模型(AR+NAR); 未开源; SPK 相对 GT 仍有明显 gap (0.580 vs 0.754)", "concepts": ["ResidualVectorQuantization", "SpeechTokenizer"], "source": "Sources/VALL-E.pdf", "github": "", "demo": ""}, {"name": "SCVALL-E", "title": "SC VALL-E: Style-Controllable Zero-Shot Text to Speech Synthesizer", "arxiv_id": "", "date": "2023", "venue": "IEEE Access (CC BY 4.0)", "org": "", "tier": "deep", "tags": ["TTS", "zero-shot", "style-control", "VALL-E", "codec-LM", "emotion", "prosody", "Korean"], "summary": "在 VALL-E 的 NAR block 中加入 style network (N=10 style tokens + multi-head attention),从 quantized audio tokens 中无监督学习 emotion/speed/pitch 等风格维度,通过 scale factor c_i ∈ [0.5, 2.5] 实现推理时的显式风格控制", "route": "Text → KoG2P → Phonemes → [Audio prompt → EnCodec → RVQ tokens (8 layers)] → AR decoder (stage 1) → NAR decoder + Style Network (N=10 tokens, 8-head attention) → Predicted RVQ tokens → DeCodec → Speech", "metrics": "WER 0.25 / FVE 64.19 / F0GPE 56.53 (vs VALL-E 0.30/64.75/56.79, GST-Tacotron 0.21/64.24/54.53) [Table 3]; CMOS +4.10 / SMOS 4.10 (vs VALL-E -0.40/3.90) [Table 4]", "takeaway": "(1) Style token bank 在 codec LM NAR block 中的应用 — 用 scale factor 实现推理时风格调节,无需标签; (2) Style token 自动发现语义维度 (c1=emotion, c2=speed, c3=volume/pitch); (3) 韩语 TTS 的 KoG2P 音素分解方案", "limitation": "(1) 韩语专属,未验证跨语言; (2) 仅训练 1.5 epochs (21,497h 数据, 68 天 4×A100),训练不充分; (3) style token c4-c10 未学到明显风格维度; (4) 未与现代 LLM-TTS (CosyVoice, Seed-TTS) 对比; (5) 代码开源但数据为韩国 AI Hub 内部数据", "concepts": ["CodecLanguageModel", "GlobalStyleTokens", "ResidualVectorQuantization", "ProsodyModeling", "EmotionControlinTTS"], "source": "Sources/SCVALL-E.pdf", "github": "", "demo": ""}, {"name": "BEATs", "title": "BEATs: Audio Pre-Training with Acoustic Tokenizers", "arxiv_id": "2212.09058", "date": "2022-12", "venue": "ICML 2023 (Microsoft)", "org": "", "tier": "deep", "tags": ["self-supervised-learning", "audio-representation", "acoustic-tokenizer", "iterative-pretraining", "ViT", "audio-classification", "discrete-label-prediction", "knowledge-distillation"], "summary": "提出 BEATs (Bidirectional Encoder representation from Audio Transformers),一个迭代式音频预训练框架,通过交替优化 acoustic tokenizer 和 audio SSL 模型,用离散标签预测替代传统重建 loss,在 AudioSet-2M 和 ESC-50 上刷新 SOTA", "route": "Audio → Mel-filterbank (128d, 25ms, 10ms hop) → 16x16 patches → ViT Encoder (12层, 768d, 90M params) → 预测 Acoustic Tokenizer 产生的离散标签; Tokenizer: Random-Projection (iter1) → Self-Distilled Tokenizer (iter2+,含 12层 Transformer encoder + 3层 estimator)", "metrics": "AS-2M mAP 48.6 (single model SOTA, vs prev 47.4) [Table 1]; AS-20K mAP 38.9 [Table 1]; ESC-50 Acc 98.1 [Table 1]; Ensemble (10) AS-2M mAP **50.6** [Table 3]; KS1 98.1, KS2 98.3 [Table 1]", "takeaway": "(1) 迭代训练 tokenizer + SSL 模型的交替优化框架; (2) Random-projection tokenizer 作为冷启动; (3) 离散标签预测优于重建 loss 的实证依据; (4) 知识蒸馏式 self-distilled tokenizer 设计", "limitation": "仅在 AudioSet (音频分类) 上验证,未在 ASR/TTS 等语音任务上评估; 90M 参数较小,未探索 scaling; 需要多轮迭代训练,流程较复杂", "concepts": ["Self-SupervisedSpeechRepresentation", "SpeechTokenizer", "CodebookCollapse"], "source": "Sources/BEATs.pdf", "github": "", "demo": ""}, {"name": "Whisper", "title": "Whisper: Robust Speech Recognition via Large-Scale Weak Supervision", "arxiv_id": "2212.04356", "date": "2022-12", "venue": "ICML 2023", "org": "", "tier": "deep", "tags": ["ASR", "weak-supervision", "robustness", "multilingual", "multitask", "speech-recognition", "seq2seq", "zero-shot"], "summary": "通过将弱监督预训练扩展到 680,000 小时多语言多任务数据,Whisper 证明了简单的 seq2seq Transformer 在 zero-shot 设定下可以匹敌甚至超越人类转录员的鲁棒性", "route": "Audio → 80-channel log-mel spectrogram (25ms window, 10ms stride) → 2x Conv1D stem → Transformer Encoder → Transformer Decoder (with task/language tokens) → Text; Multitask: ASR + Translation + LID + VAD + Timestamps", "metrics": "LibriSpeech test-clean WER 2.7% (zero-shot) [Table 2]; OOD 平均 WER 12.8% (vs wav2vec 2.0 的 29.3%) [Table 2]; X→EN BLEU 29.1 (zero-shot SOTA) [Table 4]; 接近人类转录水平 [Fig 7, §3.9]", "takeaway": "(1) 弱监督大数据 > 小规模金标准数据; (2) multitask format 统一 ASR/翻译/LID/VAD; (3) effective robustness 分析框架; (4) long-form 解码策略 (beam search + temperature fallback + VAD + previous-text conditioning)", "limitation": "seq2seq 固有问题 (hallucination, repeat loops); 非英语性能随资源量差异大; 语言识别不够强; 30s 窗口限制长音频", "concepts": ["MelSpectrogram", "SpeechTokenizer", "LLM-enhancedASR"], "source": "Sources/Whisper.pdf", "github": "", "demo": ""}, {"name": "OverFlow", "title": "OverFlow: Putting flows on top of neural transducers for better TTS", "arxiv_id": "2211.06892", "date": "2022-11", "venue": "Interspeech 2023", "org": "", "tier": "deep", "tags": ["TTS", "normalizing-flow", "autoregressive", "acoustic-model", "neural-HMM", "probabilistic-model", "Glow", "invertible-post-net"], "summary": "在 neural HMM TTS 之上叠加 normalizing flow (invertible post-net),构建同时具备自回归、单调对齐、全概率建模和流增强的 TTS 声学模型", "route": "phoneme → encoder (2 vectors/phone) → left-to-right HMM decoder (pre-net + LSTM + emission params) → invertible neural net (Glow-TTS decoder architecture) → mel spectrogram → HiFi-GAN → waveform", "metrics": "WER 2.91% (Harvard sentences, Whisper ASR) vs T2 6.36% / GTTS 3.97% / NHMM 5.96%; MOS 3.43 vs T2 3.25 / GTTS 2.64 / NHMM 2.97; 3h 达到 5% validation WER (仅次于 GTTS 2.5h, 均远快于其他方法) [Table 2]", "takeaway": "将 invertible neural net 作为 post-net 的思路 -- 既能像传统 post-net 一样利用非因果 CNN 增强输出,又不破坏精确似然训练; neural HMM 的 quantile-based duration generation 实现概率化时长控制", "limitation": "仅在 LJ Speech 单说话人上验证; 自回归推理速度未量化(但框架本身是自回归的,不适合 GPU 并行); MOS 3.43 与 VOC 4.18 仍有较大差距; 未与 diffusion-based 方法对比", "concepts": ["ConditionalFlowMatching", "Attention-basedTTS", "Non-autoregressiveTTS", "DurationPredictor", "MelSpectrogram", "NeuralVocoder"], "source": "Sources/OverFlow.pdf", "github": "", "demo": ""}, {"name": "EnCodec", "title": "EnCodec: High Fidelity Neural Audio Compression", "arxiv_id": "2210.13438", "date": "2022-10", "venue": "TMLR 2023", "org": "", "tier": "deep", "tags": ["audio-codec", "neural-compression", "RVQ", "GAN", "streaming", "entropy-coding", "loss-balancing"], "summary": "端到端流式 neural audio codec,用 RVQ 量化 + MS-STFT 判别器 + loss balancer 在 1.5-24 kbps 实现实时高保真压缩,可选 Transformer LM 做熵编码再压 25-40%", "route": "Encoder-RVQ-Decoder (conv-LSTM) + GAN adversarial training; 频域判别器替代时域方案; 梯度归一化 balancer 稳定多损失训练", "metrics": "MUSHRA 3kbps=76.8 > Lyra-v2@6kbps=57.4 > Opus@12kbps=70.2 [Table 1]; stereo@6kbps MUSHRA 82.9 comparable to MP3@64kbps=82.7 [Table 4]; RTF~10x real-time on single CPU [Table 5]", "takeaway": "(1) Loss balancer: 用 EMA 跟踪梯度 L2 范数,将权重重新定义为梯度占比,解耦权重设定与损失尺度 (2) MS-STFT 判别器: 单一频域多尺度判别器足以替代 MSD+MPD+STFTD 的复杂组合 (3) Per-bandwidth discriminator: 每个比特率档位一个判别器,改善多带宽训练质量 (4) Transformer LM 熵编码: 用轻量 LM 估计 codebook 分布,arithmetic coding 额外压缩 25-40%", "limitation": "(1) 48kHz 模型无法实时 (RTF 0.66-0.68 with entropy coding) (2) 未解决 codebook collapse (利用率~90%,DAC 后来提升至 99%) (3) 熵编码增加延迟且有浮点一致性风险 (4) 评估以 MUSHRA 为主,缺少下游 TTS 任务评估", "concepts": ["概念库/ResidualVectorQuantization|RVQ", "概念库/Multi-scaleSTFTDiscriminator|MS-STFT Discriminator", "概念库/CodebookCollapse|Codebook Collapse", "概念库/QuantizerDropout|Quantizer Dropout", "概念库/CodecTrainingObjectives|Codec Training Objectives", "概念库/TokenRateandBitrateTrade-offs|Token Rate and Bitrate Trade-offs", "概念库/SpeechTokenizer|Speech Tokenizer", "概念库/NeuralVocoder|Neural Vocoder"], "source": "Sources/EnCodec.pdf", "github": "", "demo": ""}, {"name": "AudioLM", "title": "AudioLM: a Language Modeling Approach to Audio Generation", "arxiv_id": "2209.03143", "date": "2022-09", "venue": "arXiv (Google Research)", "org": "", "tier": "deep", "tags": ["speech-LM", "audio-generation", "semantic-token", "acoustic-token", "hierarchical-generation", "speech-continuation", "piano-generation", "zero-shot"], "summary": "提出 semantic + acoustic tokens 层级建模框架,首次在无文本监督下实现长期连贯且高保真的语音/音乐续写 / Proposes hierarchical semantic-acoustic token modeling for coherent, high-quality audio generation without text supervision", "route": "音频 → w2v-BERT semantic tokens + SoundStream acoustic tokens → 三阶段 decoder-only Transformer (semantic → coarse acoustic → fine acoustic) → SoundStream decoder → 波形", "metrics": "sWUGGY 83.7 (causal S
