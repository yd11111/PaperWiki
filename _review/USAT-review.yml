    trustworthy:
      score: 9
      rationale: "所有关键数字经 PDF 交叉验证正确: LibriTTS unseen NMOS 3.95 [Table I] ✓, SMOS 4.06 [Table I] ✓, SMCS 0.780 ✓, SVR 88.7% ✓; ESLTTS fine-grained SMCS 0.833 [Table V] ✓, SVR 98.8% ✓, params 0.64M ✓; 消融 CNMOS/CSMOS 数值均正确 [Table III] ✓。指标名称使用正确,方向性描述无误。"
    distinguishable:
      score: 8
      rationale: "[论文原文] 和 [agent 解读] 标注覆盖率 >80%。MAVAE 的 discrete bottleneck 连续化类比正确标注为 [agent 解读]。局限性中的对比基准陈旧和 ESLTTS 规模评价正确标注为 [agent 解读]。有一处 KB 背景中将 MAVAE decoder 等同于 HiFi-GAN 未标注为推断。"
    positionable:
      score: 9
