# 发现的问题
issues:
  - severity: medium
    type: factual-error
    principle: trustworthy
    location: "局限性 > 第 6 条"
    detail: "笔记写'扩展到 2^13 利用率 68% 时 UTMOS 略高于 2^12 (差值在误差范围内)',但 Table 5 实际数据为 K=8192 UTMOS=4.0220 < K=4096 UTMOS=4.0486。方向写反。K=8192 的 PESQ (2.3916) 确实略高于 K=4096 (2.3730),可能是指标混淆。"
    suggestion: "改为'扩展到 2^13 时 PESQ (2.39) 略高于 2^12 (2.37) 但 UTMOS (4.02) 反而略低于 2^12 (4.05),差值均在误差范围内',或直接引用两个指标的具体数字避免含糊。"

  - severity: low
    type: template-compliance
    principle: trustworthy
    location: "实验表格 > 语义表征 (ARCH Benchmark)"
    detail: "ARCH 表只展示了 12 个数据集中的 6 个,点评中'仅在 6 个超过 DAC-9Q'的判断需要全 12 列数据支撑。读者无法从表格直接验证此判断。"
    suggestion: "在 ARCH 表下方加一行注释说明完整 12 数据集结果,或在点评该句旁标注 [Table 3, full 12 datasets]。"

  - severity: low
    type: traceability-gap
    principle: trustworthy
    location: "方法 > 判别器 > MPD"
    detail: "'periods [2,3,5,7,11]' 虽在 §3.4 大段下,但这个具体参数来自 HiFi-GAN 而非 WavTokenizer 论文。当前依靠 section-level 标注 [§3.4] 覆盖,尚可接受但不够精确。"
    suggestion: "补充 '(HiFi-GAN, Kong et al. 2020)' 标注明确来源。"

