    suggestion: "从 aliases 移除 'Lookahead Decoding'。若确需连接该技术,写入 related_concepts 或正文边界段做区分,而非 alias。"
  - severity: low
    type: frontmatter-drift
    principle: non_pollution
    location: "frontmatter aliases (line 4)"
    detail: "'MTP head' 是 MTP 的子部件(实现分支),'Parallel Token Decoding' 是宽泛近义描述,'Multi-Token Prediction' 与 title 完全重复。严格按 'aliases 仅含同一概念的不同名称' 规则,前两者属子概念/近义。"
    suggestion: "aliases 收敛为 [MTP, 多token预测, MTP head] 一类真别名;去掉与 title 重复项(可选,不影响功能)。"
