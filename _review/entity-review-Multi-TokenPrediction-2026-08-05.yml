  rule_gap: "entity-review-checklist 与 kb.md 的两条阈值与本库 confirmed 页实际惯例不符: (1) '一级标题 ≤ 6' —— 抽查 4 个 confirmed 页均为 7-9 个 h2(定义/机制/边界/应用/关键论文/相关概念/演进 本就 ≥7);(2) '无研究演进时间线' —— RVQ/Multi-scaleSTFTDiscriminator/SpeechFactorization 等 confirmed 页均含 '## 演进' 段。审阅时若机械执行会误判合规页。"
  checklist_upgrade_suggestion: "建议把标题阈值上调到 ≤9,或明确 '关键论文/相关概念/演进' 为不计入配额的标准 footer 段;并把 kb.md '无研究演进时间线' 澄清为 '禁止 MOC 式多条目研究池,允许单行 lineage 演进段'。"
  rule_gap_2: "aliases 污染(混入 distinct technique)是本次真实高信号问题,但当前 checklist 只有 'aliases 仅含同一概念' 的定性描述,缺少 '别名不得是独立技术/独立论文名' 的可机械判定条目。建议增设一条: alias 若在 vault 中已是/可成为独立实体页,则应移到 related_concepts。"
