principles:
  可复述:
    score: 9
    rationale: "方法节详细解释了 MHGK 的 WHY (dual-resolution property: talking 需要帧级 hard alignment, listening 需要 long-range soft context), HOW (高斯距离惩罚 bias 矩阵, 不同 head 不同 sigma), 以及与 ALiBi/2D Spatial CA 的对比。Q-Former 替代 all-zero CFG 的 WHY 解释清楚。两阶段训练的逻辑 (避免信号干扰) 有因果链。速查卡片可借鉴字段给出 4 个具体可迁移 idea (MHGK, Q-Former CFG, arbitrary-position training, 数据清洗管线)。"

  可信赖:
    score: 8
    rationale: "实验表格覆盖了论文 Table 1-5 的主要结果, 数字均标注了 [Table N] 出处。方法节引用了 [§X.X]/[Fig N]。指标使用正确 (FID/FVD/LPIPS/CSIM/LMD/LSE-C 方向均对)。速查指标有具体数字、数据集名和出处。有少量非关键 claim (如 VoxHear 1206 小时) 缺少 section 标注但信息来源明确。速查中 User Study 分数被标为 MOS 但原文未用该术语, 属于轻微不精确。"

  可区分:
    score: 9
    rationale: "方法节系统使用 [论文原文] 和 [agent 解读] 标注, 覆盖率约 85%。agent 解读部分明确标记 (如 MHGK 与 ALiBi 哲学类比、与 LongCat-AudioDiT CFG 问题的关联、两阶段训练与 ELLSA 的类比)。局限性节中部分推断 (如 '无法理解语义') 虽为 agent 分析但放在评论性 section 中, 边界清晰。"

  可定位:
    score: 8
    rationale: "KB 背景节有清晰的双线定位: audio-driven video gen 演进线 + full-duplex 系统演进线。创新判断有对比基准 (vs ALiBi, vs DIM, vs StreamAvatar)。frontmatter 字段完整且语义正确: concepts 列了 4 个直接相关 KB 概念, models 列了 wav2vec2.0 (使用的 encoder)。本文不是 TTS 论文而是 video generation, 与 KB 核心领域的关联度适中 — KB 背景正确标注了这种跨领域关系, 但定位深度受限于 KB 中缺乏 audio-driven video generation 的专门概念页。"

  不污染:
    score: 9
    rationale: "按指令不做反向更新和 KB 修改, 不涉及新建概念页。frontmatter 引用合理, 不存在 overclaim 或 factual error 风险。如未来做反向更新, 仅需对 Full-duplexSpokenDialogue 等页做 key_papers 追加, 属于 append 操作, 不改 status。"

