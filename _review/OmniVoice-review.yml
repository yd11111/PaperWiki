# 发现的问题
issues:
  - severity: low
    type: traceability-gap
    principle: 可信赖
    location: "消融实验 > LLM 初始化 (line 329 vs line 119)"
    detail: >
      消融总结 (line 329) 写 "random init 最优 WER 2.52",引用的是 PDF Table 6 中
      LR=2e-4 的行。但笔记内简化表格 (line 119) 仅展示 LR=5e-4 行 (WER 2.56),
      且标记为 "Random init (最优 LR)"。两处 "最优" 指代不同 LR,造成笔记内微小不一致。
      不影响结论 (LLM init 远优于 random init),但可能让仔细对照的读者困惑。
    suggestion: >
      line 329 改为 "random init 最优 Libri WER 2.52 (LR=2e-4)" 或
      将 line 119 表格中的 "最优 LR" 换成更具体的 "LR=5e-4 (Seed-en 最优)"
  - severity: low
    type: template-compliance
    principle: 可定位
    location: "frontmatter.models"
    detail: >
      ZipVoice 是同团队前序工作且为 Table 1 直接 baseline,论文笔记/ZipVoice.md 存在,
      但未列入 frontmatter models 字段。lineage 信息因此不完整。
    suggestion: >
      models 字段追加: "[[论文笔记/ZipVoice|ZipVoice]]"
  - severity: low
    type: traceability-gap
    principle: 可信赖
    location: "实验 > 中英文评估 Table 2 行 (lines 304-305)"
    detail: >
      CMOS 和 SMOS 数字未包含置信区间 (PDF Table 2: 0.44+-0.16, 3.80+-0.17)。
      对 repro 层级笔记,置信区间有助于判断统计显著性。
    suggestion: >
      CMOS/SMOS 列数字补充 +-std,如 "+0.44+-0.16" 和 "3.80+-0.17"

