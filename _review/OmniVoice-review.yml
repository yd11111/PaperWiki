# 第一层: 原则判断
principles:
  reproducible:
    score: 9
    judgment: >
      方法节不仅覆盖 WHAT (full-codebook masking, LLM init, multilingual scaling)
      还深入 WHY: 每个设计选择都有因果解释 + 消融验证 + 与 baseline 的对比。
      作为 repro 层级笔记,模块细节 (embedding offset, fused head, codebook-weighted loss)
      和训练/推理代码逻辑均有伪代码级别记录。速查卡片"可借鉴"列出 3 个具体可迁移 trick,
      每个都有足够细节支撑复用。
  trustworthy:
    score: 9
    judgment: >
      与 PDF 原文交叉验证: Table 1-8 所有关键数字完全匹配。68 处 [§X.X]/[Table N]/[Fig N]
      标注,覆盖率 >90%。指标名使用正确 (WER/CER/SIM-o/UTMOS/CMOS/SMOS/RTF 无混淆)。
      对 FLEURS CER < ground truth 这一反直觉结果有审慎解读 [agent 解读]。
      唯一瑕疵: 消融总结中 "random init 最优 WER 2.52" 引用的是 LR=2e-4 行,
      但笔记内表格仅展示 LR=5e-4 行 (WER 2.56),造成笔记内微小不一致。
  distinguishable:
    score: 9
    judgment: >
      方法节全程使用 [论文原文](8 处) / [agent 解读](10 处) 标注,
      覆盖率 >85%。Agent 推断均有明确标记且语气审慎 (如 "这可能因为"/"这个结果的
      合理解释是")。无推断被写成断言的情况。"首个"等强 claim 均以引号
      + [§2.1.2] 归属原文。
  positioned:
    score: 9
    judgment: >
      KB 背景节提供精确谱系定位: 从 SoundStorm/MaskGCT 到 OmniVoice 的演进线,
      两个根本性突破点 (单阶段 + LLM→NAR),与 SOTA 的量化对比 (CosyVoice 3 WER 0.71%),
      及独特价值定位 (600+ 语言 + 全开源)。点评节进一步讨论 ZipVoice 关系
      (同团队前序 flow-matching NAR → 本文 discrete diffusion)。
      Frontmatter models 已包含 SoundStorm/CosyVoice3/MaskGCT/Qwen3-TTS 核心对比系统。
  non_polluting:
    score: 9
    judgment: >
      无新概念页创建。8 个已有概念页链接均合理 (Non-autoregressive TTS / Masked Generative
      Modeling / LLM-based TTS / Speech Tokenizer / RVQ / CFG / Single-vs-Multi-codebook /
      Diffusion-based TTS)。"可复用的 idea" 6 条均有实验或代码依据,不存在 overclaim。
      对 "600+ 语言" 的宣传值持审慎态度,指出低资源语言实际质量差异大。

