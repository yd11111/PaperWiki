    severity: high
    type: factual-error
    location: "实验表 APS (EN) 行和 RP (EN) 行"
    detail: |
      Baseline 数字混淆:
      1. APS (EN): 写 "MIMO-Audio 78.4%" 实为 Qwen3-TTS-VD EN APS; MIMO-Audio EN APS 应为 80.6%
      2. APS (EN): 写 "Qwen3-TTS-VD 78.0% (ZH)" — 78.0% 是 MOSS 自身 ZH APS,非 Qwen3-TTS-VD (EN=78.4%, ZH=84.3%)
      3. RP (EN): 写 "MIMO-Audio 72.0%" 实为 Qwen3-TTS-VD EN RP; MIMO-Audio EN RP 应为 59.5%
    suggestion: "核对 Table 1 修正所有 baseline 数字,区分 MIMO-Audio 和 Qwen3-TTS-VD"
    fixed: true

  - id: 2
    severity: medium
    type: overclaim
    location: "客观评估分析段落"
    detail: |
      称 "EN-RP (68.7%) 超越 Gemini-TTS-Pro (67.2%)" 但未提及 Qwen3-TTS-VD EN RP = 72.0% 高于 MOSS。
      选择性对比造成误导印象。
    suggestion: "补充 Qwen3-TTS-VD 72.0% 的对比,或改为更中性的表述"
    fixed: true

  - id: 3
    severity: low
    type: template-compliance
    location: "frontmatter datasets 字段"
    detail: "datasets 为空 []。InstructTTSEval 虽已在 models 中引用,但作为主要评估 benchmark 也可列入 datasets 或保持空但在 note 中说明。"
    suggestion: "保持现状可接受,InstructTTSEval 已通过 models 引用"

  - id: 4
    severity: low
    type: traceability-gap
    location: "方法节部分 WHY 语句"
    detail: "少数 WHY 语句 (如'影视数据的优势在于内在的场景、角色和说话风格多样性 [§2.2]') 有章节标注但未显式加 [论文原文] tag。"
    suggestion: "非阻塞,覆盖率已 >80%"

