summary: |
  Ming-Omni 是一篇 system report 类论文,核心贡献在工程集成而非单点技术突破。
  笔记准确反映了这一定位: 在方法节解释了每个设计选择的 WHY,在局限性中指出了
  TTS SIM 偏低、缺乏关键消融等问题。KB 背景与 Ming-UniAudio (同团队) 和
  Qwen2.5-Omni (竞品) 的对比清晰。

  主要审阅发现: modality-specific router 是核心声称但无消融 (medium),
  该 idea 的可迁移性因此不确定 (low)。两个 issue 均不影响笔记的可信性
  因为已在正文中标注了 caveat。

  审阅通过,可继续反向更新。
