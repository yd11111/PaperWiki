      维度从 512 变为 256 未解释. 原文图中有两层 Linear,可能做了降维,
      笔记如实记录了这个不一致但未深究.
    suggestion: 低优先级, 原文本身描述模糊, 笔记已如实反映.
    action: none

conclusion: pass
