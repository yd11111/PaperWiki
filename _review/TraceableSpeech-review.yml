      EnCodec 仅在 KB 背景中作为 codec 范式代表提及. 应考虑是否需要新建 HiFiCodec 模型页
      或改为空. 但考虑到 HiFiCodec 模型页不存在且本文核心不在 codec 架构本身,
      保留 EnCodec 作为上位概念参考是可接受的.
    suggestion: 可保持现状; 如后续有 HiFiCodec 模型页则改为 [[HiFiCodec]].
    action: defer

