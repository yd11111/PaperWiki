# 第一层: 原则判断
principles:
  navigable:
    score: 7
    judgment: "作为 sub-MOC 结构清晰: scope 声明明确(离散 Token AR / VITS 系 / 混合 AR+FM)、与父页 [[零样本语音合成]] 通过 wikilink 互引、年份分组提供基础导航。但 46 篇论文纯按年份平铺,缺少技术路线子分组(如 Codec LM / VITS 系 / 混合 AR+FM),用户需要逐条扫描才能定位某条路线的代表工作。"
  no_mixing:
    score: 8
    judgment: "所有 46 篇论文均属于自回归路线范畴,与 scope 声明一致。VITS/YourTTS 虽非严格 codec LM,但 scope 明确包含'端到端基础 (VITS 系)',不算越界。作为纯论文列表的 sub-MOC,无概念/模型混层风险。"
  traceable:
    score: 5
    judgment: "10 处强判断词(首个/首篇/SOTA/最快/最高/best)均无 R8 要求的来源标注((作者 claim)/(benchmark: XX)/(agent 整理))。这是系统性缺失,而非偶发遗漏。如果读者引用这些判断写报告,无法判断可信度。"
  no_decay:
    score: 6
    judgment: "年份 section 归属全部正确(46 篇均匹配 frontmatter year)。但 4 篇论文的 inline 描述文本年份与 frontmatter/section 不一致: Make-A-Voice/SC VALL-E/TextrolSpeech/UniAudio 在 ### 2023 section 下但描述写'2024'。无重复条目,无死链。"
  no_overload:
    score: 7
    judgment: "46 篇论文,未超 50 条阈值但已进入 lint L15 WARNING 区间(>40)。2 条描述超出单行合理长度(UniTTS 210 chars, TTS-1 238 chars)。随着 2026 论文继续入库,很快将触及拆分线。"

