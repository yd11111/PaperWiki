issues:
  - id: 1
    type: traceability-gap
    severity: medium
    principle: 可信赖
    location: "KB 背景 - 创新判断"
    detail: >
      "VoxInstruct 需 556h 指令数据, CosyVoice 需 1500h" -- 这个数据来自 Table 1
      的 Instruction Data 列,其中 CosyVoice 是 556h,CosyVoice2 是 1500h,而非
      VoxInstruct(VoxInstruct 不在表中)。应修正为 CosyVoice 556h / CosyVoice2 1500h。
    suggestion: >
      将 "VoxInstruct 需 556h 指令数据, CosyVoice 需 1500h" 修正为
      "CosyVoice 需 556h, CosyVoice2 需 1500h 指令数据"。

  - id: 2
    type: overclaim
    severity: medium
    principle: 可信赖
    location: "局限性 第 6 点"
    detail: >
      "CosyVoice2 (167K h pretrain + 1500h instruction)" 把 167K h 归于 CosyVoice2
      但 Table 1 显示 CosyVoice2 pretrain 是 167K h,而 BatonVoice pretrain 也有
      103K h。这里的对比暗示 BatonVoice 数据量远小于 CosyVoice2,但实际差距主要
      在 pretrain 规模(103K vs 167K)而非数量级差异。
    suggestion: >
      改为 "SFT 仅用 500h 英文数据,pretrain 103K h;
      对比 CosyVoice2 pretrain 167K h + 1500h instruction data"。

  - id: 3
    type: template-compliance
    severity: low
    principle: 可定位
    location: "frontmatter - models"
    detail: >
      models 字段仅列了 CosyVoice 2,但 BatonVoice 也对比了 Spark-TTS、
      CosyVoice (v1)、Higgs speech V2 等 baseline。按 checklist 要求
      models 应列本文模型 + 对比 baseline。
    suggestion: >
      考虑是否需要在 models 中追加对比 baseline (Spark-TTS, CosyVoice 等),
      但这些 baseline 未在 vault 中都有模型页,且 frontmatter models 字段
      应指向已有 wikilink,所以当前做法可接受。标记为 low。
