review:
  paper: "High-FidelityCodec-Inspired"
  title: "CodecCap: High-Fidelity Codec-Inspired Residual Modeling for Dense Video Captioning"
  date: 2026-06-08
  reviewer: auto
  conclusion: pass-with-fixes
  issues_summary:
    high: 0
    medium: 1
    low: 1

principles:
  reproducible:
    score: 8
    rationale: >
      方法节包含充分的因果解释: GOP-aware 分割的 WHY(区分编码器机械行为 vs 真实场景切换),
      delta-only 约束的 WHY(避免 VLM 重复总结整个场景), attribute locking 的 WHY(静态信息默认
      继承,动态信息显式更新)。每个关键设计选择都回答了"为什么选这个"。速查卡片的"可借鉴"
      给出了 3 个具体可迁移 trick(锚点+增量分解、caption-then-QA 评估、unknown-aware voting),
      不是泛泛的"提出了新方法"。
  trustworthy:
    score: 9
    rationale: >
      数字型 claim 标注覆盖率高: 所有实验数据均标注 [Table 2], 方法描述标注 [§3.1]-[§3.5],
      benchmark 设计标注 [§4.1]-[§4.4], [Fig 2], [Fig 3]。指标名称使用正确(accuracy)。
      速查卡片指标字段包含具体数字 + 数据集 + 来源。无方向性错误。
  distinguishable:
    score: 8
    rationale: >
      因果解释来源标注清晰: 5 处 [论文原文] 标注(GOP-aware 设计、delta-only 约束、
      滑动窗口设计、空间归一化、residual-only SFT 退化归因), 5 处 [agent 解读] 标注
      (GOP-aware 价值分析、attribute locking 设计哲学、数据表示 vs 模型规模、VidCapQA 天花板、
      计算开销缺失)。覆盖率 >= 80%。无推断写成断言的情况。
  locatable:
    score: 7
    rationale: >
      KB 背景正确标注为无匹配(CV 论文 vs TTS vault),降级处理合规。
      frontmatter 字段存在且非空(tags, models)。速查卡片 5 字段均有实质内容。
      但 concepts/tasks/datasets 为空,这对于跨领域论文是合理的,不扣分。
      models 字段的 wikilink 指向不存在的 VDCTalker 模型页,属于中等问题。
  non_polluting:
    score: 8
    rationale: >
      no-kb-update 标志位已设置,不会触发反向更新。concepts/tasks/datasets 均为空,
      不会创建不相关的实体页。唯一风险是 models 字段的 VDCTalker wikilink
      可能在未来 lint 中触发孤儿链接告警。

issues:
  - id: 1
    severity: medium
    type: bad-linking
    location: "frontmatter models"
    detail: >
      models 字段包含 [[模型库/VDCTalker|VDCTalker]],但 VDCTalker 是视频字幕模型,
      不属于本 vault 的 TTS/语音知识体系。创建此模型页会引入噪声。
    suggestion: >
      将 models 字段改为纯文本 "VDCTalker" 或清空。不应为非 TTS 模型创建实体页。
