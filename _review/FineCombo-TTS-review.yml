issues:
  - type: factual-error
    severity: medium
    principle: 可信赖
    location: "Timbre Control [Table 3 right], WER row"
    detail: >
      WER 行中 VoxInstruct-Joint 的 19.24 被加粗标记为最优,
      但 WER 越低越好,FineCombo-TTS 的 18.59 才是更优值。
      加粗应在 18.59 上。这是一个方向性错误。
    suggestion: "将 WER 行改为: WER | 19.24 | **18.59** |"

  - type: overclaim
    severity: medium
    principle: 可区分
    location: "速查卡片 > 一句话总结 + 核心数字"
    detail: >
      卡片一句话总结写"提出首个真正联合参考语音+文本描述的可控 TTS 框架",
      但正文 vs ControlSpeech 段承认 ControlSpeech "也做 reference + description
      联合控制",与"首个"矛盾。此外核心数字写"全面超越 VoxInstruct-Joint",
      但 prosody WER (12.87 vs 11.12) 实际更差,非"全面"。
    suggestion: >
      一句话总结改为"提出首个(作者声称)真正联合..." 或
      "基于 CFM 的联合参考语音+文本描述框架";
      核心数字改为"在可控性指标上全面超越 VoxInstruct-Joint,WER 略有 trade-off"

  - type: template-compliance
    severity: low
    principle: 可定位
    location: "frontmatter > read_time"
    detail: "read_time 字段为空字符串,应填入实际阅读时长或删除此字段。"
    suggestion: "填入估算时长或保留空值(不影响主要功能)"

  - type: traceability-gap
    severity: low
    principle: 可信赖
    location: "速查卡片 > 核心数字"
    detail: "核心数字缺少评估测试集/条件说明(如 test set 来源、合成条数等)"
    suggestion: "在核心数字末尾补充评估条件,如 '[100 条 test set, §4.1]'"

suggestions:
  - >
    方法详解中 TTS Backbone 的 cross-attention 注入方式描述为
    "text features as Q, E_a as K/V",这是一个较不常见的设计
    (通常 conditioning signal 作 K/V 而 main sequence 作 Q),
    建议回查原文 §2.3 确认 Q/K/V 分配是否准确。
  - >
    "与已有工作的对比"表格质量很高,建议在 ControlSpeech 行补充
    其论文发表时间,以帮助读者判断同期性。
  - >
    "存疑与待验证"第 4 点关于 80M pairs 可能导致过拟合的分析很有洞察力,
    可考虑在 KB 反向更新时将此观察追加到 EmotionControlinTTS 页面。

