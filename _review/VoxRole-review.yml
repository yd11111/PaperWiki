principles:
  可复述:
    score: 9
    rationale: "方法节含充分因果解释: 为什么选电影数据源、为什么两层对齐设计、为什么两阶段 LLM 蒸馏、为什么 acoustic 用统计方法; 每个设计选择都回答 why this not that; 速查可借鉴列出 5 个具体可迁移 trick (pipeline/judge/画像/蒸馏/context窗口)"
  可信赖:
    score: 8
    rationale: "实验表格全部标注 [Table 2]/[Table 3]; 质量验证结果标 [§Quality Validation]; 相关性标 [§Subjective experimental results]; 指标名正确 (Rouge-L/Meteor/BertScore/UTMOS); 速查指标含数字+来源 [Table 2, 3]; 无方向性错误; 覆盖率约 85%"
  可区分:
    score: 8
    rationale: "因果解释来源标注覆盖率 ~85%; 方法节广泛使用 [论文原文]/[agent 解读] 标注; 点评节用 agent 视角明确与论文区分; '暗示'等限定词使用恰当; 局限性中部分 agent 推断标了 [agent 解读]"
  可定位:
    score: 8
    rationale: "KB 背景谱系定位清晰 (WavChat 11维框架缺角色扮演维度、VoiceBench/SUPERB/SD-EVAL 不覆盖); 创新判断有 3 个具体对比基准 (InstructTTSEval/NV-Bench); frontmatter 完整; 速查 5 字段均实质; concepts 列出 3 个核心概念"
  不污染:
    score: 10
    rationale: "本次审阅范围内无新建概念页、无反向更新; 按用户指示跳过 KB 修改; 笔记内容事实准确,无 overclaim 或 factual error 会影响未来 KB 背景"

