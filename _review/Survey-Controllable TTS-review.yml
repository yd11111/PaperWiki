principles:
  reproducible:
    verdict: pass
    notes: >
      Survey 类笔记的"方法节"以分类框架而非单一方法为主。
      框架解释清晰(六大任务维度、四大控制策略、架构演进路线),
      包含 WHY 解释(如架构演进中"效率 vs 控制力 vs 保真度"的 trade-off 分析)。
      速查卡片"可借鉴"提供了 4 个具体可迁移 trick。
  trustworthy:
    verdict: pass
    notes: >
      数字型 claim 标注覆盖率高(Table 6 数据有 [Table 6, Appendix A.5] 标注,
      各节内容有 [§X.X] 章节标注)。指标名使用正确(MCD/FDSD/WER/Cosine/PESQ/MOS)。
      速查卡片"指标"含具体数字+数据集名+标注。
  distinguishable:
    verdict: pass-with-note
    notes: >
      因果解释来源标注到位: [论文原文] 和 [agent 解读] 有明确区分,
      覆盖率约 90%。"Agent 补充的局限" 部分也有明确 [agent 解读] 标注。
      方法节中个别分析性句子("这是本 survey 最核心的分类贡献")
      虽为 agent 判断但语境下可区分。
  navigable:
    verdict: pass
    notes: >
      KB 背景节包含谱系定位、已有认知、创新判断三段,
      有 6 个 confirmed 实体页 + 6 个 pending-review 过滤记录。
      frontmatter 字段完整(concepts/models/tasks 均填充)。
      速查卡片 5 字段都有实质内容。
  no_contamination:
    verdict: pass
    notes: >
      Survey 类论文笔记主要提供分类框架,反向更新以追加 key_papers 为主,
      不涉及概念定义重写。6 个 pending-review 概念页(Style Transfer in TTS 等)
      在原 card 阶段已创建,本次 deep 升级不新建概念页。

