principles:
  可复述:
    score: 9
    rationale: "方法节结构清晰, 包含4阶段流水线+3个关键设计选择, 每个设计选择都回答了WHY (为什么加性水印/为什么解耦/为什么TF-Loudness); 速查卡片可借鉴给出5个具体可迁移trick (TF-Loudness, 遮蔽增强, 解耦, 自适应采样, codec架构复用), 均有明确迁移场景; 局限性分析到位且有结构性解释 (感知-鲁棒性trade-off)"
  可信赖:
    score: 9
    rationale: "实验表包含9行关键指标, 全部标注出处 [Table 1/3/4/5, Fig 5]; 文中数字型claim出处覆盖率约90%; 指标名使用正确 (PESQ/STOI/ViSQOL/MUSHRA/SI-SNR/AUC/IoU均正确); 速查指标字段含具体数字+数据集+出处标注; 未发现方向性错误"
  可区分:
    score: 8
    rationale: "因果解释来源标注覆盖率约85%; 方法节6处WHY解释中5处标注了[论文原文]或[agent 解读]; 实验发现节也有正确来源区分; 速查卡片未标注agent解读来源但内容为事实性总结, 风险较低"
  可定位:
    score: 9
    rationale: "KB背景节质量高: 4个维度定位 (谱系/架构溯源/损失函数谱系/已有认知), 均含具体论文和模型名; 创新判断有明确对比基准 (vs WavMark的data hiding + brute-force sync); frontmatter完整, concepts列2个相关概念, models列1个架构来源"
  不污染:
    score: 9
    rationale: "无新建概念页; 无反向更新操作; KB背景中的谱系定位信息准确, 不会误导未来检索; 唯一风险是 frontmatter concepts 仅列2个, 可能遗漏AudioWatermarking相关概念, 但目前概念库中尚无此页, 不构成污染"

