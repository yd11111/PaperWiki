principles:
  可复述:
    verdict: pass
    notes: >
      方法节包含 6 个关键设计选择,每个都有充分的 WHY 解释: AudioVAE 两阶段训练的动机(语义结构化 latent)、
      LLM 只看语义摘要的稳定性论证、full-history conditioning 的长程一致性论证、block-causal 并行训练的效率动机、
      SOAR 自修正解决 train-inference mismatch、CFG-aware MeanFlow 消除双 forward 开销。
      复现要点覆盖 10 个关键实现细节。速查卡片可借鉴字段具体可操作(SOAR recipe、block-causal position reset 等)。

  可信赖:
    verdict: pass
    notes: >
      数字型 claim 标注覆盖率 >90%,所有实验数字标注 [Table N] 或 [§X.X]。
      指标名使用正确(WER/CER/SIM/PESQ/STOI/UTMOS/NFE/RTF)。速查卡片指标字段含完整数字+数据集+来源。
      方向性无误。比较表包含 CosyVoice 3、VoxCPM 2、Seed-TTS 等多 baseline,数字与论文一致。

  可区分:
    verdict: pass
    notes: >
      因果解释来源标注覆盖率约 90%。[论文原文] 和 [agent 解读] 区分清晰。
      agent 解读限定在合理推断范围(如 Stage 2 的 HoliTok 类比、semantic encoder 信息瓶颈的作用机理)。

  可定位:
    verdict: pass
    notes: >
      KB 背景有具体谱系定位(连续 AR 路线 vs 离散 token AR vs 混合离散-连续)。
      创新判断有明确对比基准(vs VoxCPM FSQ 瓶颈、vs DiTAR 局部条件)。
      frontmatter 字段完整,concepts/models/tasks/datasets 均合理。

  不污染:
    verdict: pass
    notes: >
      未新建概念页。所有引用概念页均已存在或标记 pending-review。
      反向更新仅做 key_papers 追加。

