issues:
  - id: 1
    type: traceability-gap
    severity: medium
    principle: trustworthy
    location: "速查卡片 / 实验表格"
    detail: >
      论文 abstract 和正文 §4.1 均声称 "2.10% WER",但 Table 1 主结果 (1M iterations)
      显示 1.95% WER。笔记引用了两个数字但未明确解释差异来源。
      经核实: 2.10% 来自 Table 3 ablation (600K iterations), 1.95% 来自 Table 1 (1M iterations)。
    suggestion: >
      在实验节添加脚注说明: "注意: abstract 引用的 2.10% 来自 600K iteration 的 ablation study [Table 3],
      Table 1 主实验 (1M iterations) 的 WER 为 1.95%。"

  - id: 2
    type: traceability-gap
    severity: low
    principle: trustworthy
    location: "训练策略 / Align Loss"
    detail: >
      Align Loss 公式标注为 "[Eq. ?]"。原文中该公式介于 Eq.3 和 Eq.4 之间,
      未编号,但有明确文字描述。
    suggestion: >
      将 "[Eq. ?]" 改为 "[§2.2]"。

  - id: 3
