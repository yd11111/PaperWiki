summary: |
  笔记整体质量良好。方法节包含 4 个因果解释完整的设计选择,
  每个都回答了"为什么选这个而不是那个"。速查卡片 5 字段均有实质内容。
  KB 背景节定位准确,创新判断有对比基准。

  主要问题是 abstract WER (2.10%) 与 Table 1 WER (1.95%) 的差异未解释清楚,
  但这是论文自身的表述不一致,笔记只需标注即可。

  无 high issue,可放行反向更新。
