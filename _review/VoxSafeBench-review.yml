principles:
  可复述:
    score: 9
    rationale: "方法节有丰富的因果解释: 为什么用 Two-Tier 分离内容与上下文风险、为什么引入文本参考上限验证构建有效性、为什么用中间感知探测区分感知与对齐失败; 速查卡片可借鉴字段列了 4 条具体可迁移 idea (Two-Tier taxonomy / construct validity 三件套 / NBS+交换顺序 / speech grounding gap 框架); 整体读完不看原文可以向同事解释清楚"
  可信赖:
    score: 9
    rationale: "数字型 claim 出处标注覆盖率 > 90%; 几乎每个数据点都标注了 [Table N] 或 [§N]; 指标名定义明确且有方向标注 (↑↓→0); 速查指标含具体数字+条件+出处; inter-judge agreement 数字 (kappa=0.78, rho>=0.88) 有 [§2] 标注"
  可区分:
    score: 8
    rationale: "因果解释来源标注覆盖率约 85%; 方法节中 4 个关键设计选择全部用 [论文原文] 和 [agent 解读] 做了清晰分离; KB 背景中的创新判断有明确对比基准; 点评节中观点明确标注为评论性质; 一处 KB 背景末段 (与 E2E-VGuard 关系) 的描述是 agent 判断但未加 [agent 解读] 标注"
  可定位:
    score: 9
    rationale: "KB 背景命中 2 个实体页并有具体谱系定位 (SLM competence→alignment 范式转移); 创新判断有明确对比基准 (Dynamic-SUPERB/MMSU/VoiceBench vs VoxSafeBench); 与 E2E-VGuard 的互补关系描述清晰 (主动防护 vs 对齐评估); frontmatter 完整且语义正确"
  不污染:
    score: 9
    rationale: "未新建概念页; 笔记中的信息若流入概念页会改善 SpeechLanguageModel 页 (补充对齐评估维度) 和 AudioUnderstanding 页 (补充感知≠对齐的认知); 无 overclaim; 无 factual error"

