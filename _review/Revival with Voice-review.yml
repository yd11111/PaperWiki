principles:
  可复述:
    verdict: pass
    notes: >
      方法节包含 4 个关键设计选择,每个都有 WHY 解释: (1) 为什么做 style augmentation
      (缩小 train-test domain gap), (2) 为什么用 contrastive + alternating training
      (利用 HQ audio-only 数据弥补 AV 数据质量不足), (3) 为什么用 sampling + prompting
      (解决 face-to-voice 一对多映射), (4) 为什么去除 gender 词 (条件正交化)。
      与 FaceSpeak 的对比贯穿全文提供了清晰的定位参照。
      速查卡片 "可借鉴" 列出 3 个具体可迁移 trick,含操作细节和推广方向。

  可信赖:
    verdict: pass
    notes: >
      数字型 claim 标注覆盖率 ~90%,所有实验数字标注 [Table N]/[Fig N]/[§X.X]。
      指标名使用正确: MOS (Mean Opinion Score), FMS (Face Matching Score),
      VCS (Voice Consistency Score), SIM (speaker similarity), SI-SDR, C50。
      速查卡片 "指标" 含具体数字 + 数据集名 + 来源标注。
      无方向性错误。

  可区分:
    verdict: pass
    notes: >
      方法节 WHY 解释全部标注了 [论文原文] 或 [agent 解读],覆盖率 ~95%。
      agent 解读限定在合理推断范围: 冻结 audio encoder 的原因分析、
      style augmentation vs FaceSpeak FaRL 的比较、self-bootstrapping 解读、
      descriptive text gender 词去除的意义。
      局限性中 face-voice 映射假设 和 descriptive text 信息泄露
      均明确标注 [agent 解读]。

  可定位:
    verdict: pass-with-fixes
    notes: >
      KB 背景谱系定位具体: 定位于 face-driven TTS 分支,与 FaceSpeak 同类但架构不同
      (codec LM vs VITS2),与 Parler-TTS 的 NL description 控制对接。
      创新判断有明确对比基准 (FaceSpeak 的 GRL+vCLUB vs RV-TTS 的三策略)。
      frontmatter 基本完整,datasets 字段原为空 (已修复)。
      速查卡片 5 字段都有实质内容。

  不污染:
