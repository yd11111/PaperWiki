      type: "traceability-gap"
      severity: "medium"
      location: "实验表"
      detail: "实验表中 6 行 WER 数据未标注是 WER-last 还是 WER-best。论文 §4.3 说明 'We report WER-last except for the 2nd iteration of S0',但表中未体现这一区分。S0 第 2 轮迭代的 15.8% 实际是 WER-best。"
      suggestion: "在实验表脚注或行内标注 WER-last/WER-best,特别是 15.8% (iter2) 和 25.0% (S0) 行。"
    - id: 2
      type: "template-compliance"
      severity: "medium"
      location: "frontmatter datasets"
      detail: "datasets 字段为空。论文使用 LibriSpeech (pre-train/fine-tune/eval)、Libri-light (10h split)、MUSAN (augmentation) 三个数据集。"
      suggestion: "补充 datasets 字段,至少列入 LibriSpeech。"
    - id: 3
      type: "traceability-gap"
      severity: "low"
      location: "速查卡片-指标"
      detail: "15.8% 是第二轮迭代的最终结果,速查中未标注这是 2nd iteration WER-best(非 WER-last）。"
      suggestion: "速查指标改为 'WER 15.8% (WER-best, 2nd iter) on LibriSpeech dev-other'。"

