    suggestion: 在该句末尾加标注 [论文原文]

  - id: 2
    type: bad-linking
    severity: medium
    principle: 不污染
    location: "frontmatter concepts"
    detail: >
      concepts 列了 [[Masked Generative Modeling]]。DiFlow-TTS 虽然 source distribution
      使用 all-mask tokens,但其生成范式是 discrete flow matching (概率速度场驱动的连续时间
      Markov chain),与 MaskGCT-style iterative parallel decoding 有本质区别。
      将 DFM 挂接到 Masked Generative Modeling 概念页可能造成概念混淆。
    suggestion: >
      从 concepts 中移除 [[Masked Generative Modeling]],保留现有的 [[Conditional Flow Matching]]
      作为主要方法论挂接点。可在 [[Conditional Flow Matching]] 的反向更新中提及 DFM 变体。

