  reproducible:
    score: 8
    reasoning: >
      方法节对 inter-utterance (direction vector) 和 intra-utterance (KV-cache swap + sliding window)
      的 WHY/HOW 都有清晰的因果解释。Style self-referencing 的分析逻辑完整 (现象观察 → 根因分析 →
      cross-attention variance 定量验证)。速查卡片的可借鉴字段具体可迁移。
  trustworthy:
    score: 8
    reasoning: >
      关键数字与 PDF 原文交叉验证通过 (Table 1, Table 2, Table 3, Fig 6 数据均匹配)。
      出处标注覆盖率高 (>90%)。指标名使用正确 (F0/SPS/SIM/MOS)。
      minor: inter-utterance 表格遗漏了 pitch/speed 的 success rate 数据。
  distinguishable:
    score: 9
    reasoning: >
      来源标注系统性好。方法节中的 WHY 解释基本都标注了 [论文原文] 或 [agent 解读],
      覆盖率 > 90%。点评部分明确区分了方法论层面的分析和主观判断。
  positionable:
    score: 8
    reasoning: >
      KB 背景提供了清晰的对比表 (6 条路线),与 EmoSteer-TTS 和 TED-TTS 的定位对比具体。
      创新判断准确 (核心贡献在 self-referencing 发现而非 inter-utterance interpolation)。
      minor: frontmatter models/datasets 字段为空。
  non-polluting:
    score: 9
    reasoning: >
      笔记中不存在 overclaim 或 factual error。对方法局限性的总结全面。
      concepts 字段挂接合理,没有遗漏主要概念或错误挂接。

