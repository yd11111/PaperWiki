    suggestion: "将该行出处改为仅 [Table 3]; 可选: 在局限性或脚注中标注 'Table 1 声称 +1000 distractors 下 7.3%,与 Table 3 的 7.9% 及摘要的 7.9% 不一致,疑为原文数据错误'"

