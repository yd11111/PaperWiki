summary: |
  作为 survey 精读笔记,整体质量良好。三轴分类框架的呈现清晰,
  关键设计选择的 WHY 解释充分 (tokenizer 选择、TextLM 初始化、
  vocoder pipeline 选择均有因果解释),KB 背景精准 (6 个 confirmed
  实体页,其中 2 个以本文为 origin_paper)。主要问题是下游应用节
  偏列表式,以及少量 traceability 标注缺失。均为 medium/low 问题,
  不阻塞反向更新。
