principles:
  可复述:
    satisfied: true
    notes: >
      方法节包含清晰的因果解释链: 为什么 ORM/PRM 在视频推理中失效 (loss 仅降 5%,
      绝对分数难定义) → 为什么成对偏好更可行 → 为什么需要步骤级而非整条路径 →
      为什么用 contrastive step selection (>70% 错误来自视频误解)。
      关键设计选择均回答了 "为什么选这个而不是那个" (ORM vs PRM vs PPRM vs pDPO 对比表)。
      速查卡片 "可借鉴" 列出 5 条具体可迁移 trick,包括 pDPO 迁移思路、
      KL 散度定位法、混合 SFT 策略等。

  可信赖:
    satisfied: true
    notes: >
      数字型 claim 标注覆盖率约 95%。所有实验数据均标注 [Table N] 或 [§X.X]。
      指标名使用正确 (accuracy、F1、precision、recall 均无混淆)。
      速查卡片 "指标" 字段含 VideoMME 65.6%、NExT-QA 82.3%、RivaBench-StandUp 76.7%
      + 对应数据集名 + [Table 2] 来源标注。无方向性错误。
      Gemini-1.5-pro 对比数字 (75.8%) 正确引用。

  可区分:
    satisfied: true
    notes: >
      方法节严格使用 [论文原文] 和 [agent 解读] 双标注。因果解释来源标注覆盖率约 90%。
      agent 解读均以推断性语言表述 ("核心洞察是"、"巧妙之处在于"、"这是一个有趣的涌现能力")。
      未发现推断被写成断言的情况。"首个开源推理增强音视频 LLM" 来自论文原文定位。
      零样本合成视频检测能力描述中,紧跟 "但 F1 仅 17.8% 说明这项能力仍然很初级" 的限定。

  可定位:
    satisfied: true
    notes: >
      KB 背景有具体谱系定位: latent-representation-based vs audio-token-based 路线,
      Q-Former 适配器在 SALMONN 系列中的定位,pDPO 与 KB 中已有 TTS DPO 方法的区分
      (应用场景不同: 视频推理 vs 语音生成)。创新判断有对比基准 (token 级 reward vs
      Gumbel-Softmax 采样 vs pDPO 的步骤级偏好)。
      frontmatter 字段存在且非空 (concepts 5 项, models 1 项)。
      速查卡片 5 字段均有实质内容。

  不污染:
    satisfied: true
    notes: >
      未新建概念页,未执行反向更新 (按指令要求)。
      KB 背景中的谱系描述准确,不含 overclaim。
      概念引用 ([[SpeechLanguageModel]] 等) 指向已有实体页,无虚链。

conclusion: pass-with-fixes

