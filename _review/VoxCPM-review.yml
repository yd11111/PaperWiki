principles:
  可复述:
    verdict: pass
    notes: >
      方法节包含 5 个关键设计选择,每个都有 WHY 解释(FSQ 作为正则化瓶颈 vs tokenizer 的区别、
      TSLM+RALM 残差分工的归纳偏置来源、MiniCPM-4 初始化 vs phoneme 的权衡、LocDiT outpainting 设计、
      CFG 对条件引导的作用)。速查卡片"可借鉴"给出 3 个具体可迁移 trick。
      消融分析包含参数补偿实验(24L+6L vs 30L+0L),清晰展示架构分离 > 等量参数。

  可信赖:
    verdict: pass
    notes: >
      数字型 claim 标注覆盖率 ~90%+,所有实验数字标注 [Table N] 或 [§X.X]。
      指标名使用正确(CER/WER/SIM/MOS/N-MOS/S-MOS/DNSMOS/RTF)。
      速查卡片指标字段含完整数字+数据集+出处。方向性无误(WER↓, SIM↑等)。

  可区分:
    verdict: pass
    notes: >
      方法节的 WHY 解释全部标注了 [论文原文] 或 [agent 解读],覆盖率约 87%。
      agent 解读限定在合理推断范围内(如 FSQ 瓶颈诱导分工的机制、batch doubling 对 similarity 的影响)。
      无推断-断言混淆。"开源 SOTA"标注了具体数字和来源。

  可定位:
    verdict: pass-with-fixes
    notes: >
      KB 背景有具体谱系定位(LLM-based TTS 中 hybrid 路线 vs CosyVoice 两阶段 vs DiTAR/CLEAR 纯连续)。
      创新判断有明确对比基准。frontmatter 字段完整,models 列本文引用的已有模型页(CosyVoice 2/3, MELLE 等)。
      原始主结果表混合 open-source 与 non-open-source baseline 未标注区别(见 issue #1),已修正。

  不污染:
    verdict: pass
    notes: >
      未新建概念页。所有引用概念页均已存在。
      反向更新将在审阅通过后执行,仅做 key_papers 追加(不改 status)。

