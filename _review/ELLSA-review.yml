review:
  paper: "ELLSA"
  note_path: "论文笔记/ELLSA.md"
  reviewer: auto
  date: 2026-06-06
  checklist_version: v1.1

principles:
  可复述:
    score: 9
    rationale: "方法节详细解释了 SA-MoE 的 WHY (为什么不用 dense model, 为什么这样分组 expert), HOW (shared KV cache + independent FFN), 以及三阶段训练的逻辑。速查卡片的可借鉴字段给出了具体可迁移的设计 (shared KV cache, interleaved sequence, speech from text hidden state)。核心问题节回答了三个层层递进的为什么。"

  可信赖:
    score: 8
    rationale: "实验表格覆盖了论文主要结果,数字均标注了出处 (Table N)。指标使用正确 (Acc, Success Rate, GPTScore)。速查卡片指标字段包含具体数字、数据集名和出处。方法节引用了 Section 和 Figure 编号。有少量 claim 缺少出处标注。"

  可区分:
    score: 9
    rationale: "方法节系统使用了 [论文原文] 和 [agent 解读] 标注,覆盖率高。agent 解读部分 (如 SA-MoE vs 标准 MoE 的区别、Stage 2 数据效率的分析) 明确标记为推断。点评节的观点明确是 agent 评论性质。"

  可定位:
    score: 9
    rationale: "KB 背景节提供了具体谱系定位 (full-duplex 演进线 + VLA 演进线的交叉), 引用了具体系统名 (Moshi, LSLM, pi0, OpenVLA 等)。创新判断有对比基准 (从 pi0 的 attention 连接扩展而来)。点评节进一步讨论了与 Moshi 的延迟对比和与 KB 现有系统的定位。"

  不污染:
    score: 8
    rationale: "frontmatter 的 concepts 和 models 字段合理。concepts 列出的 6 个 KB 页均与论文内容直接相关。models 列了 CosyVoice2 (论文使用的组件)。没有列后续系统。反向更新计划中可能涉及的追加操作 (key_papers) 预计不会有 factual error。"

