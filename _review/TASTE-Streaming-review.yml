  safe_for_reverse_update: false
  safe_for_trusted_layer: false
  reason: "比较表中 BigCodec/TaDiCodec 两列整体错位,TASTE RTF 数字部分错误,消融分析条件标签互换——这些错误如果通过反向更新流入实体页(如 SpeechTokenizer/BigCodec/TaDiCodec 相关描述),会传播错误信息。必须先修正所有 high issue 再执行反向更新。"

