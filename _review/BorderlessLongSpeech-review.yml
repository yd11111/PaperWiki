      因果解释来源标注覆盖率高,方法节中几乎每段都有 [论文原文] 或 [agent 解读] 标注。
      agent 解读部分(如 Dimension Dropout 与 CFG/Quantizer Dropout 的类比,CoT 与
      RALL-E/OV-InstructTTS 的对比)明确标记为推断。点评节的质疑("更像 position paper")
      是 agent 观点,语境中可区分。
  可定位:
