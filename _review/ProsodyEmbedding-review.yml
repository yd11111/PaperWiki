score_rationale:
  factual_accuracy: >
    RAVDESS decomposition "24人×2固定句子×8情感 = 1440条" arithmetic wrong
    (24×2×8=384, not 1440); total 1440 is likely correct for full RAVDESS speech set
    but factors shown are incomplete (missing repetitions/intensities). SynthID
    19×16×2=608 checks out. Bestiary discrepancy explained by "(经平衡后)". All other
    numbers (32-dim finding, bottleneck tradeoff, WavLM leakage percentages)
    internally consistent across card and main text. No directional errors found.
  technical_depth: >
    Excellent coverage: detailed 3-channel input pipeline (F0/energy/voicing extraction
    with normalization rationale), IU segmentation with linguistic motivation, three AE
    architectures with explicit bottleneck strength comparison, three pretext tasks with
    ablation result, training details (curriculum learning, teacher forcing decay schedule).
    Six numbered experimental findings with causal explanations. The bottleneck-robustness
    tradeoff (Finding 2) and "reconstruction != representation quality" (Finding 1) are
    genuinely insightful, not surface-level summaries. 启发 section contains five
    concrete transferable points with specific downstream applications.
  kb_integration: >
    KB background covers 2 entity pages (ProsodyModeling confirmed, StyleTransferinTTS
    pending-review). Specific lineage positioning against GST-Tacotron (mel input),
    FastSpeech 2 (explicit params), ProsodyVQ-VAE (frame-level discrete), SSL models
    (entangled). Cross-references to SSLSuprasegmentalAnalysis, ProsodyEval,
    DynamicProsodyCosyVoice in main text and 启发 section. Could potentially link to
    more entities (e.g., MAE, auto-encoder concepts) but current coverage is solid.
  writing_quality: >
    Clear structure with logical flow from method to experiments to insights. Source
    attribution coverage approximately 65% in 方法详解, below the 80% target. Several
    causal and interpretive statements lack [论文原文] or [agent 解读] markers, including:
    "核心价值在于从输入端就切断了非韵律信息的泄漏路径" (KB背景),
    "这一设计的语言学动机是" (方法详解 IU分割段),
    "本文最有洞察的发现之一" (方法详解 架构表后).
    The 启发 and 存疑 sections are naturally agent interpretation and appropriately
    framed. No instances of inference stated as assertion found.
  template_compliance: >
    All required sections present: 速查卡片 (10+ fields with substance), KB背景, 方法详解,
    实验与结果, 对比, 启发与可迁移经验, 存疑与待验证, 审阅callout. Frontmatter has tags,
    tier, status, arxiv_id, date_read, date_published, confidence, importance,
    related_notes, kb_links. read_time is empty string (minor). No models/concepts
    frontmatter fields but this note is about methods not a specific model system.

