principles:
  可复述:
    score: 9
    rationale: "方法节详尽覆盖 CosyVoice2 instruction fine-tuning 和 F5-TTS cognition label embedding 两条路线的因果解释; 速查卡片可借鉴字段含 5 个具体可迁移 trick; 关键设计选择 (instruction vs label embedding, 分训两模型 vs 单模型+标签) 回答了 why this not that"
  可信赖:
    score: 8
    rationale: "Table 1/2/3/4 数字全部经 pdftotext 交叉验证无误; 指标名正确 (MCD/FAD/log-F0 RMSE/WER/accuracy); 速查指标字段含具体数字+数据集+来源; 出处标注覆盖率约 85%; 有一处增强倍率范围不准确 (1.5x-2x 应为 1.5x-2.5x)"
  可区分:
    score: 8
    rationale: "因果解释来源标注覆盖率约 85%; 方法节中 [论文原文] 和 [agent 解读] 标注使用正确且分布合理; KB 背景中的创新判断正确标注了分析性质; 有一处 F5-TTS KB 状态标注不准确"
  可定位:
    score: 9
    rationale: "KB 背景谱系定位清晰 (TTS 从高保真目标偏转到病理语音数据增强); 创新判断明确指出核心创新在应用层而非模型层; CosyVoice2 在 KB 中 30+ 篇引用但首次用于临床的定位精准; frontmatter 概念/模型挂接基本合理"
  不污染:
    score: 10
    rationale: "无新建概念页; 无反向更新; 无 KB 污染风险"

