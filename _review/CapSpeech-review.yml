    detail: >
      tasks 字段挂接 [[任务库/Instructed Speech Generation|Instructed Speech Generation]],
      但 CapSpeech 属于 NL Description 范式 (content + description 分离),
      而 Instructed Speech Generation 的核心定义是"统一指令格式"(content 和 style 合并为一条指令)。
      KB 中 Instruction-Guided Speech Synthesis 概念页明确区分了两者。
      建议: 保留挂接 (CapTTS 任务确实与 Instructed Speech Generation 有交集),
      但在 KB 背景中补充说明 CapSpeech 属于 NL Description 子范式。
    suggestion: >
      可在 KB 背景已有认知中追加一句说明 CapSpeech 与 Instruction-Guided 范式的区分,
      或在 tasks 字段补充说明。当前挂接不算错误但不够精确。
    action: noted

